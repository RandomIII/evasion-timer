      const w = x1 - x0, e = Math.max(1, w*0.055);
      arch(x0 - e, x1 + e, yt - e*0.7, yb, ri);
      c.fillStyle = C(BRICKD, .9); c.fill();

      c.save();
      arch(x0, x1, yt, yb, ri); c.clip();
      const gg = c.createLinearGradient(x1, yt - ri*2, x0, yb);
      gg.addColorStop(0, C(mix(GLASSL, SUN, .12), 1));
      gg.addColorStop(0.45, C(GLASS, 1));
      gg.addColorStop(1, C(mix(GLASS, SOOT, .70), 1));
      c.fillStyle = gg; c.fillRect(x0, yt - ri*2, w, yb - yt + ri*2);
      panes(x0, x1, yt, yb, cols, rows);
      // le jambage de gauche recoit le jour qui entre par la droite, le linteau reste dans l'ombre
      c.fillStyle = C(mix(STONE, SUN, .35), .40);
      c.fillRect(x0, yt - ri*2, Math.max(0.9, w*0.06), yb - yt + ri*2);
      c.fillStyle = C(SOOT, .45);
      c.fillRect(x0, yt - ri*2, w, Math.max(1.2, w*0.10));
      c.restore();

      voussoirs(x0 - e*0.5, x1 + e*0.5, yt, ri, Math.max(2.2, w*0.19));
    }

    for(let i = 0; i < nb; i++){
      if(i === mid) continue;
      const cx = xL + quoinW + bw*(i + 0.5);
      const x0 = cx - winW/2, x1 = cx + winW/2;
      opening(x0, x1, winTop, winBot, rise, 3, 5);
      const sillW = winW*1.28, sh = Math.max(1.8, wallH*0.022);
      c.fillStyle = C(STONED, .55);
      c.fillRect(cx - sillW/2, winBot + sh, sillW, sh*0.75);
      c.fillStyle = C(mix(STONE, BRICKD, .18), 1);
      c.fillRect(cx - sillW/2, winBot, sillW, sh);
      c.fillStyle = C(mix(STONE, SUN, .50), .9);
      c.fillRect(cx - sillW/2, winBot, sillW, Math.max(0.8, sh*0.30));
      bays.push({ x0: x0, x1: x1, cx: cx, on: al(i*29 + 5) > 0.26, k: i });
    }

    /* --- porte charretiere --- */
    const dW = Math.min(bw*0.86, W*0.23);
    const dH = wallH*0.60;
    const dRise = dW*0.15;
    const dTop = -dH, dx0 = -dW/2, dx1 = dW/2;
    const de = Math.max(1.2, dW*0.05);

    arch(dx0 - de, dx1 + de, dTop - de*0.7, 0, dRise);
    c.fillStyle = C(BRICKD, .95); c.fill();

    c.save();
    arch(dx0, dx1, dTop, 0, dRise); c.clip();
    c.fillStyle = C(mix(SOOT, BRICKD, .25), 1);
    c.fillRect(dx0, dTop - dRise*2, dW, dH + dRise*2);
    const fanH = dH*0.16;
    c.fillStyle = C(mix(GLASS, SOOT, .35), 1);
    c.fillRect(dx0, dTop - dRise*2, dW, fanH + dRise*2);
    c.strokeStyle = C(WOOD, .8); c.lineWidth = Math.max(0.6, dW*0.02);
    for(let i = 1; i < 5; i++){
      const xx = dx0 + dW*i/5;
      c.beginPath(); c.moveTo(xx, dTop - dRise*2); c.lineTo(xx, dTop + fanH); c.stroke();
    }
    const leafW = dW*0.47;
    for(let s = 0; s < 2; s++){
      const lx = s ? dx1 - leafW : dx0;
      c.fillStyle = C(mix(WOOD, s ? SUN : SOOT, s ? .18 : .30), 1);
      c.fillRect(lx, dTop + fanH, leafW, dH - fanH);
      c.strokeStyle = C(mix(WOOD, SOOT, .5), .8);
      c.lineWidth = Math.max(0.5, dW*0.014);
      for(let k = 1; k < 5; k++){
        const xx = lx + leafW*k/5;
        c.beginPath(); c.moveTo(xx, dTop + fanH); c.lineTo(xx, 0); c.stroke();
      }
      c.fillStyle = C(IRON, .95);
      c.fillRect(lx, dTop + fanH + (dH-fanH)*0.16, leafW, Math.max(1.2, dH*0.030));
      c.fillRect(lx, dTop + fanH + (dH-fanH)*0.70, leafW, Math.max(1.2, dH*0.030));
    }
    c.fillStyle = C(SOOT, .45);
    c.fillRect(dx0, dTop - dRise*2, dW, Math.max(1.4, dW*0.09));
    c.restore();

    voussoirs(dx0 - de*0.6, dx1 + de*0.6, dTop, dRise, Math.max(2.6, dW*0.13));

    /* --- soubassement --- */
    c.fillStyle = C(STONE, 1);
    c.fillRect(xL - ov*0.4, -plinthH, W + ov*0.8, plinthH);
    c.strokeStyle = C(STONED, .40); c.lineWidth = 0.8;
    for(let i = 0; i < 14; i++){
      const xx = xL + W*(i + 0.5 + (al(i*5+2) - 0.5)*0.5)/14;
      c.beginPath(); c.moveTo(xx, -plinthH*0.92); c.lineTo(xx, 0); c.stroke();
    }
    c.fillStyle = C(mix(STONE, SUN, .45), .85);
    c.fillRect(xL - ov*0.4, -plinthH, W + ov*0.8, Math.max(0.9, plinthH*0.12));
    c.fillStyle = C(STONED, .45);
    c.fillRect(xL - ov*0.4, -plinthH*0.20, W + ov*0.8, plinthH*0.20);

    /* --- corniche --- */
    c.fillStyle = C(BRICKD, .60);
    c.fillRect(xL, yEave + corn, W, Math.max(1, corn*0.26));
    const dw = Math.max(2, W*0.018);
    for(let x = xL; x < xR - dw*0.4; x += dw*2){
      const wdt = Math.min(dw, xR - x);
      c.fillStyle = C(mix(BRICK, BRICKL, .30), 1);
      c.fillRect(x, yEave + corn*0.40, wdt, corn*0.36);
      c.fillStyle = C(mix(BRICKL, SUN, .45), .8);
      c.fillRect(x, yEave + corn*0.40, wdt, 0.9);
    }
    c.fillStyle = C(mix(BRICK, BRICKD, .18), 1);
    c.fillRect(xL - ov*0.5, yEave + corn*0.18, W + ov, corn*0.24);
    c.fillStyle = C(mix(BRICK, BRICKL, .22), 1);
    c.fillRect(xL - ov, yEave, W + ov*2, corn*0.22);
    c.fillStyle = C(mix(BRICKL, SUN, .55), .9);
    c.fillRect(xL - ov, yEave, W + ov*2, Math.max(0.9, corn*0.08));
    c.fillStyle = C(SOOT, .34);
    c.fillRect(xL - ov, yEave, W + ov*2, corn*0.55);

    /* --- plan de lumiere general --- */
    function outline(){
      c.beginPath();
      c.moveTo(xL - ov, 0);
      c.lineTo(xL - ov, yEave);
      c.lineTo(xL, yEave); c.lineTo(xL, yPk); c.lineTo(iL, yPk);
      for(let p = 0; p < nsh; p++){
        const xpk = iL + p*sw;
        c.lineTo(xpk + (sw-gr), yEave);
        c.lineTo(xpk + sw, yPk);
      }
      c.lineTo(xR, yPk); c.lineTo(xR, yEave);
      c.lineTo(xR + ov, yEave); c.lineTo(xR + ov, 0);
      c.closePath();
    }
    c.save();
    outline(); c.clip();
    const lg = c.createLinearGradient(xL, 0, xR, yPk);
    lg.addColorStop(0, C(NIGHTBLUE, .34));
    lg.addColorStop(0.42, C(NIGHTBLUE, .07));
    lg.addColorStop(0.74, C(SUN, .05));
    lg.addColorStop(1, C(SUN, .17));
    c.fillStyle = lg;
    c.fillRect(xL - ov, yPk, W + ov*2, wallH + roofH);
    c.restore();

    /* --- feux --- */
    const forge = 0.34 + 0.66*nuit;
    const beat  = 0.72 + 0.28*Math.sin(t*0.55) + 0.10*Math.sin(t*1.27);
    c.save();
    c.globalCompositeOperation = "lighter";
    if(nuit > 0.02){
      for(let i = 0; i < bays.length; i++){
        const b = bays[i];
        if(!b.on) continue;
        const flick = 1 + 0.07*Math.sin(t*0.8 + b.k);
        const a = nuit*(0.30 + 0.30*al(b.k*17 + 3))*flick;
        c.save();
        arch(b.x0, b.x1, winTop, winBot, rise); c.clip();
        c.fillStyle = "rgba(255,186,104," + a.toFixed(3) + ")";
        c.fillRect(b.x0, winTop - rise*2, b.x1 - b.x0, winBot - winTop + rise*2);
        c.restore();
        const rg = c.createRadialGradient(b.cx, (winTop+winBot)/2, 0, b.cx, (winTop+winBot)/2, winW*1.6);
        rg.addColorStop(0, "rgba(255,176,96," + (a*0.42).toFixed(3) + ")");
        rg.addColorStop(1, "rgba(255,176,96,0)");
        c.fillStyle = rg;
        c.fillRect(b.cx - winW*1.6, (winTop+winBot)/2 - winW*1.6, winW*3.2, winW*3.2);
      }
      for(let p = 0; p < nsh; p++){
        const xpk = iL + p*sw, xv = xpk + (sw-gr), xnk = xpk + sw;
        c.save();
        c.beginPath(); c.moveTo(xv, yEave); c.lineTo(xnk, yPk); c.lineTo(xnk, yEave); c.closePath(); c.clip();
        c.fillStyle = "rgba(255,192,118," + (nuit*0.30*(0.7 + 0.3*al(p*11+1))).toFixed(3) + ")";
        c.fillRect(xv, yPk, gr, roofH);
        c.restore();
      }
    }
    c.save();
    arch(dx0, dx1, dTop, 0, dRise); c.clip();
    const fw = dW*0.10;
    const fg = c.createLinearGradient(-fw, 0, fw, 0);
    fg.addColorStop(0, "rgba(255,96,28,0)");
    fg.addColorStop(0.5, "rgba(255,150,54," + (0.55*forge*beat).toFixed(3) + ")");
    fg.addColorStop(1, "rgba(255,96,28,0)");
    c.fillStyle = fg;
    c.fillRect(-fw, dTop + dH*0.16, fw*2, dH*0.84);
    const dg = c.createRadialGradient(0, -dH*0.22, 0, 0, -dH*0.22, dW*0.75);
    dg.addColorStop(0, "rgba(255,124,42," + (0.34*forge*beat).toFixed(3) + ")");
    dg.addColorStop(1, "rgba(255,124,42,0)");
    c.fillStyle = dg;
    c.fillRect(dx0, dTop, dW, dH);
    c.restore();
    c.restore();
  }

  function mon3(c, L, H, om, al, nuit, t){
    const baseH  = H*0.155;
    const crownH = H*0.055;
    const yFoot  = -baseH;
    const yHead  = -(H - crownH);
    const r0 = L*0.285, r1 = L*0.135;
    const hb = r0*1.42;
    const plinthH = baseH*0.18;
    const capH    = baseH*0.20;

    const BRICK=[150,80,62], BRICKD=[78,40,36], BRICKL=[198,126,94];
    const MORTAR=[206,190,170], STONE=[142,136,124], STONED=[82,78,72];
    const IRON=[52,50,55], IRONL=[132,130,136], SOOT=[26,23,23];
    const SUN=[255,238,212], NIGHTBLUE=[20,14,12];

    function mix(a,b,k){ return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k]; }
    function C(p,a){ return om(p[0]|0, p[1]|0, p[2]|0, a===undefined?1:a); }

    function rad(y){
      const p = Math.min(1, Math.max(0, (yFoot - y)/(yFoot - yHead)));
      return r0 + (r1 - r0)*Math.pow(p, 0.86);
    }
    function soot(y){
      return Math.max(0, Math.min(1, ((-y)/H - 0.26)/0.74))*0.60;
    }
    // eclairement d'un cylindre : maximum vers u=0.74, le bord droit garde un leger retrait
    function cyl(u, base){
      let g = Math.cos((u - 0.74)*3.0) + 0.20*Math.max(0, 1 - u/0.12);
      return g > 0 ? mix(base, SUN, Math.min(1, g)*0.42 + Math.min(1, g)*0.26)
                   : mix(base, [30,20,20], Math.min(1, -g*1.45));
    }

    function ring(ya, ra, yb, rb, n, f){
      const e = 0.4;
      for(let i = 0; i < n; i++){
        const ua = i/n, ub = (i+1)/n;
        c.beginPath();
        c.moveTo(-ra + 2*ra*ua - e, ya);
        c.lineTo(-ra + 2*ra*ub + e, ya);
        c.lineTo(-rb + 2*rb*ub + e, yb);
        c.lineTo(-rb + 2*rb*ua - e, yb);
        c.closePath();
        c.fillStyle = f((ua+ub)/2, (ya+yb)/2);
        c.fill();
      }
    }
    function shaftPath(){
      const n = 14;
      c.beginPath();
      c.moveTo(-r0, yFoot);
      for(let i = 1; i <= n; i++){ const y = yFoot + (yHead-yFoot)*i/n; c.lineTo(-rad(y), y); }
      for(let i = n; i >= 0; i--){ const y = yFoot + (yHead-yFoot)*i/n; c.lineTo(rad(y), y); }
      c.closePath();
    }

    c.save();

    /* --- fut tronconique --- */
    const bands = 5;
    for(let b = 0; b < bands; b++){
      const ya = yFoot + (yHead-yFoot)*b/bands;
      const yb = yFoot + (yHead-yFoot)*(b+1)/bands;
      ring(ya, rad(ya), yb, rad(yb), 15, function(u, y){
        return C(mix(cyl(u, BRICK), SOOT, soot(y)), 1);
      });
    }

    c.save();
    shaftPath(); c.clip();
    const cch = Math.max(2.4, H*0.018);
    let row = 0;
    for(let y = yFoot; y > yHead; y -= cch, row++){
      const r = rad(y);
      const sag = r*0.34*Math.min(1, Math.max(0.06, ((-y) - H*0.04)/(H*0.55)));
      c.lineWidth = 1;
      c.strokeStyle = C(MORTAR, .10);
      c.beginPath(); c.moveTo(-r, y); c.quadraticCurveTo(0, y + sag*2, r, y); c.stroke();
      c.strokeStyle = C(BRICKD, .16);
      c.beginPath(); c.moveTo(-r, y + 0.9); c.quadraticCurveTo(0, y + 0.9 + sag*2, r, y + 0.9); c.stroke();
      if(row % 2 === 0){
        for(let j = 0; j < 2; j++){
          const u = al((row*53 + j*29)|0);
          const bx = -r + 2*r*u;
          const by = y + sag*2*(1 - Math.pow(2*u - 1, 2));
          c.fillStyle = C(mix(cyl(u, u > 0.5 ? BRICKL : BRICKD), SOOT, soot(y)), .40);
          c.fillRect(bx, by - cch + 1, r*0.22, cch - 1.6);
        }
      }
    }
    for(let i = 0; i < 8; i++){
      const u = al(i*13 + 4);
      const yTopS = yHead + (yFoot - yHead)*0.42*al(i*13 + 7);
      const st = c.createLinearGradient(0, yHead, 0, yTopS);
      st.addColorStop(0, C(SOOT, .34)); st.addColorStop(1, C(SOOT, 0));
      c.fillStyle = st;
      c.fillRect(-r0 + 2*r0*u, yHead, Math.max(1.2, r0*0.10), yTopS - yHead);
    }
    c.strokeStyle = C(IRON, .55);
    c.lineWidth = Math.max(0.7, H*0.0028);
    for(let s = 0; s < 2; s++){
      const k = s ? 0.62 : 0.42;
      c.beginPath();
      for(let i = 0; i <= 12; i++){
        const y = yFoot + (yHead-yFoot)*i/12;
        const x = rad(y)*k;
        if(i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
    }
    for(let y = yFoot - H*0.02; y > yHead; y -= H*0.026){
      const r = rad(y);
      c.beginPath(); c.moveTo(r*0.42, y); c.lineTo(r*0.62, y); c.stroke();
    }
    c.restore();

    /* --- cerclages de fer --- */
    const nbd = 5;
    for(let k = 0; k < nbd; k++){
      const p = 0.10 + 0.80*Math.pow(k/(nbd-1), 0.92);
      const y = yFoot + (yHead - yFoot)*p;
      const bh = Math.max(2.2, H*0.013);
      const ya = y + bh/2, yb = y - bh/2;
      const ra = rad(ya) + 0.9, rb = rad(yb) + 0.9;
      c.fillStyle = C(SOOT, .35);
      ring(ya + bh*0.55, ra, ya, ra, 1, function(){ return C(SOOT, .35); });
      ring(ya, ra, yb, rb, 13, function(u, yy){
        return C(mix(cyl(u, IRON), SOOT, soot(yy)*0.5), 1);
      });
      ring(yb, rb, yb - bh*0.16, rb, 13, function(u){
        return C(mix(cyl(u, IRONL), SOOT, .25), .55);
      });
      const lugX = rad(y)*0.80;
      c.fillStyle = C(mix(IRON, SUN, .18), 1);
      c.fillRect(lugX, y - bh*0.85, Math.max(1.2, bh*0.42), bh*1.7);
      c.fillStyle = C(SOOT, .5);
      c.fillRect(lugX - Math.max(0.7, bh*0.20), y - bh*0.85, Math.max(0.7, bh*0.20), bh*1.7);
    }

    /* --- couronnement --- */
    const rc = rad(yHead);
    const rimR = rc*1.36, rimRy = rimR*0.26;
    const yRim = -H + rimRy;
    const steps = [[1.06, 0.00, 0.30], [1.17, 0.30, 0.62], [1.28, 0.62, 1.00]];
    for(let k = 0; k < steps.length; k++){
      const rr = rc*steps[k][0];
      const ya = yHead + (yRim - yHead)*steps[k][1];
      const yb = yHead + (yRim - yHead)*steps[k][2];
      c.fillStyle = C(SOOT, .40);
      c.fillRect(-rr, ya, rr*2, Math.max(0.9, crownH*0.06));
      ring(ya, rr, yb, rr, 14, function(u){
        return C(mix(cyl(u, BRICK), SOOT, 0.52), 1);
      });
    }
    c.save();
    c.beginPath(); c.ellipse(0, yRim, rimR, rimRy, 0, 0, Math.PI*2); c.closePath();
    c.fillStyle = C(mix(BRICK, SOOT, .62), 1); c.fill();
    c.clip();
    const cg = c.createLinearGradient(-rimR, 0, rimR, 0);
    cg.addColorStop(0, C([26,18,18], .55));
    cg.addColorStop(0.72, C(SUN, .10));
    cg.addColorStop(1, C(SUN, .22));
    c.fillStyle = cg; c.fillRect(-rimR, yRim - rimRy, rimR*2, rimRy*2);
    c.restore();
    c.beginPath(); c.ellipse(0, yRim, rimR*0.74, rimRy*0.74, 0, 0, Math.PI*2);
    c.fillStyle = C([18,13,13], 1); c.fill();
    c.beginPath();
    c.ellipse(0, yRim, rimR*0.74, rimRy*0.74, 0, Math.PI*1.08, Math.PI*1.92);
    c.strokeStyle = C(mix(BRICKL, SUN, .3), .35);
    c.lineWidth = Math.max(0.8, rimRy*0.22);
    c.stroke();

    /* --- socle --- */
    const bodyTop = yFoot + capH;
    c.fillStyle = C(BRICK, 1);
    c.fillRect(-hb, bodyTop, hb*2, -plinthH - bodyTop);
    c.save();
    c.beginPath(); c.rect(-hb, bodyTop, hb*2, -plinthH - bodyTop); c.clip();
    const bch = Math.max(2.4, H*0.016);
    const bbl = bch*2.7;
    let br = 0;
    for(let yy = -plinthH; yy > bodyTop - bch; yy -= bch, br++){
      c.fillStyle = C(MORTAR, .10);
      c.fillRect(-hb, yy - 0.75, hb*2, 0.75);
      const off = (br % 2)*bbl*0.5;
      for(let k = -1; -hb + off + k*bbl < hb; k++){
        const rr = al((br*79 + k*23 + 401)|0);
        if(rr < 0.32){
          c.fillStyle = C(mix(BRICK, rr < 0.14 ? BRICKD : BRICKL, 0.28 + rr), .5);
          c.fillRect(-hb + off + k*bbl + 0.7, yy - bch + 0.85, bbl - 1.4, bch - 1.5);
        }
      }
    }
    const bg = c.createLinearGradient(-hb, 0, hb, 0);
    bg.addColorStop(0, C(NIGHTBLUE, .42));
    bg.addColorStop(0.40, C(NIGHTBLUE, .10));
    bg.addColorStop(0.80, C(SUN, .08));
    bg.addColorStop(1, C(SUN, .24));
    c.fillStyle = bg; c.fillRect(-hb, bodyTop, hb*2, -plinthH - bodyTop);
    const bs = c.createLinearGradient(0, bodyTop, 0, -plinthH);
    bs.addColorStop(0, C(SOOT, .34)); bs.addColorStop(1, C(SOOT, .04));
    c.fillStyle = bs; c.fillRect(-hb, bodyTop, hb*2, -plinthH - bodyTop);
    c.restore();

    for(let k = 0; k < 2; k++){
      const rr = hb*(1.05 + k*0.07);
      const ya = yFoot + capH*(1 - k*0.5);
      const hgt = capH*0.5;
      c.fillStyle = C(SOOT, .40);
      c.fillRect(-rr, ya, rr*2, Math.max(0.9, hgt*0.22));
      const cgd = c.createLinearGradient(-rr, 0, rr, 0);
      cgd.addColorStop(0, C(mix(BRICK, [30,20,20], .55), 1));
      cgd.addColorStop(0.45, C(mix(BRICK, SOOT, .30), 1));
      cgd.addColorStop(1, C(mix(BRICKL, SUN, .30), 1));
      c.fillStyle = cgd;
      c.fillRect(-rr, ya - hgt, rr*2, hgt);
      c.fillStyle = C(mix(BRICKL, SUN, .55), .8);
      c.fillRect(-rr, ya - hgt, rr*2, Math.max(0.8, hgt*0.16));
    }

    c.fillStyle = C(STONE, 1);
    c.fillRect(-hb*1.10, -plinthH, hb*2.20, plinthH);
    c.strokeStyle = C(STONED, .40); c.lineWidth = 0.8;
    for(let i = 0; i < 6; i++){
      const xx = -hb*1.10 + hb*2.20*(i + 0.5 + (al(i*9 + 6) - 0.5)*0.6)/6;
      c.beginPath(); c.moveTo(xx, -plinthH*0.9); c.lineTo(xx, 0); c.stroke();
    }
    const pg = c.createLinearGradient(-hb, 0, hb, 0);
    pg.addColorStop(0, C(NIGHTBLUE, .38));
    pg.addColorStop(0.45, C(NIGHTBLUE, .08));
    pg.addColorStop(1, C(SUN, .22));
    c.fillStyle = pg; c.fillRect(-hb*1.10, -plinthH, hb*2.20, plinthH);
    c.fillStyle = C(mix(STONE, SUN, .48), .85);
    c.fillRect(-hb*1.10, -plinthH, hb*2.20, Math.max(0.9, plinthH*0.13));
    c.fillStyle = C(STONED, .45);
    c.fillRect(-hb*1.10, -plinthH*0.18, hb*2.20, plinthH*0.18);

    /* --- porte de ramonage --- */
    const gW = hb*0.44, gH = (-plinthH - bodyTop)*0.62;
    const gTop = -plinthH - gH, gRise = gW*0.20;
    function gate(x0, x1, yt, yb, ri){
      c.beginPath();
      c.moveTo(x0, yb); c.lineTo(x0, yt);
      c.quadraticCurveTo((x0+x1)/2, yt - ri*2, x1, yt);
      c.lineTo(x1, yb); c.closePath();
    }
    gate(-gW/2 - gW*0.10, gW/2 + gW*0.10, gTop - gW*0.07, -plinthH*0.2, gRise);
    c.fillStyle = C(BRICKD, .95); c.fill();
    gate(-gW/2, gW/2, gTop, -plinthH*0.2, gRise);
    c.save(); c.clip();
    const dgr = c.createLinearGradient(-gW/2, 0, gW/2, 0);
    dgr.addColorStop(0, C(mix(IRON, [20,14,14], .5), 1));
    dgr.addColorStop(0.75, C(IRON, 1));
    dgr.addColorStop(1, C(mix(IRONL, SUN, .2), 1));
    c.fillStyle = dgr;
    c.fillRect(-gW/2, gTop - gRise*2, gW, gH + gRise*2);
    c.fillStyle = C(SOOT, .5);
    c.fillRect(-gW/2, gTop - gRise*2, gW, Math.max(1.2, gW*0.11));
    c.fillStyle = C([20,15,15], .8);
    c.fillRect(-Math.max(0.7, gW*0.03), gTop, Math.max(1.4, gW*0.06), gH);
    for(let i = 0; i < 6; i++){
      const rx = (i % 2 ? 1 : -1)*gW*0.34;
      const ry = gTop + gH*(0.18 + 0.3*((i/2)|0));
      c.fillStyle = C(mix(IRONL, SUN, .25), .7);
      c.beginPath(); c.arc(rx, ry, Math.max(0.7, gW*0.035), 0, Math.PI*2); c.fill();
    }
    c.restore();

    /* --- feux --- */
    const forge = 0.30 + 0.70*nuit;
    const beat  = 0.72 + 0.28*Math.sin(t*0.5) + 0.10*Math.sin(t*1.13);
    c.save();
    c.globalCompositeOperation = "lighter";
    const mg = c.createRadialGradient(0, yRim, 0, 0, yRim, rimR*2.6);
    mg.addColorStop(0, "rgba(255,132,58," + (0.30*(0.30 + 0.70*nuit)*beat).toFixed(3) + ")");
    mg.addColorStop(0.45, "rgba(255,96,40," + (0.10*(0.30 + 0.70*nuit)*beat).toFixed(3) + ")");
    mg.addColorStop(1, "rgba(255,96,40,0)");
    c.fillStyle = mg;
    c.fillRect(-rimR*2.6, yRim - rimR*2.6, rimR*5.2, rimR*5.2);
    c.save();
    c.beginPath(); c.ellipse(0, yRim, rimR*0.72, rimRy*0.72, 0, 0, Math.PI*2); c.clip();
    c.fillStyle = "rgba(255,118,48," + (0.42*(0.30 + 0.70*nuit)*beat).toFixed(3) + ")";
    c.fillRect(-rimR, yRim - rimRy, rimR*2, rimRy*2);
    c.restore();
    c.save();
    gate(-gW/2, gW/2, gTop, -plinthH*0.2, gRise); c.clip();
    const sg2 = c.createLinearGradient(-gW*0.14, 0, gW*0.14, 0);
    sg2.addColorStop(0, "rgba(255,90,26,0)");
    sg2.addColorStop(0.5, "rgba(255,158,62," + (0.70*forge*beat).toFixed(3) + ")");
    sg2.addColorStop(1, "rgba(255,90,26,0)");
    c.fillStyle = sg2;
    c.fillRect(-gW*0.14, gTop, gW*0.28, gH);
    c.restore();
    const fgr = c.createRadialGradient(0, gTop + gH*0.55, 0, 0, gTop + gH*0.55, gW*1.5);
    fgr.addColorStop(0, "rgba(255,116,38," + (0.26*forge*beat).toFixed(3) + ")");
    fgr.addColorStop(1, "rgba(255,116,38,0)");
    c.fillStyle = fgr;
    c.fillRect(-gW*1.5, gTop + gH*0.55 - gW*1.5, gW*3, gW*3);
    c.restore();

    c.restore();
  }

  // Deux volumes urbains des annees 1990. Lumiere venant du haut-droite :
  // face avant en valeur moyenne, pignon gauche a l'ombre, couronnements clairs.

  function bat4(c, L, H, om, al, nuit, t){
    const hw = L * 0.5;
    const xR = hw;                 // silhouette droite, cote eclaire
    const xE = -hw * 0.50;         // arete verticale entre la face et le pignon
    const dep = L * 0.20;
    const yRoof = -H;
    const horizon = -H * 0.30;
    const kf = 0.14;
    const day = 1 - nuit;

    const ph = H * 0.055;
    const baseH = H * 0.165;
    const yBase = -baseH;
    const yTopF = yRoof + ph;
    const nF = 5;
    const fh = (yBase - yTopF) / nF;
    const nB = 6;
    const bw = (xR - xE) / nB;
    const pw = bw * 0.15;
    const px1 = Math.max(0.7, L * 0.006);

    // Fuite vers l'horizon : la transformation ne depend pas de x, donc le meme
    // decalage sert a tous les volumes empiles.
    const bk = (x, y, u) => [x - dep * u, y + (horizon - y) * kf * u];

    const quadPath = (x0, yTop, yBot, u0, u1) => {
      const a = bk(x0, yTop, u0), b = bk(x0, yTop, u1);
      const d = bk(x0, yBot, u1), e = bk(x0, yBot, u0);
      c.beginPath();
      c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.lineTo(e[0], e[1]);
      c.closePath();
      return [a[1], e[1]];
    };

    const flank = (x0, yTop, yBot, u0, u1, style) => {
      quadPath(x0, yTop, yBot, u0, u1);
      c.fillStyle = style;
      c.fill();
    };

    const glassFill = (yT, yB, seed, sh, force) => {
      c.fillStyle = om(Math.round(26 * sh) + 4, Math.round(32 * sh) + 5, Math.round(43 * sh) + 7);
      c.fill();
      if (day > 0.02){
        if (yB - yT > 0.6){
          const g = c.createLinearGradient(0, yT, 0, yB);
          g.addColorStop(0, om(204, 224, 244, 0.94 * day * sh));
          g.addColorStop(0.46, om(148, 174, 202, 0.74 * day * sh));
          g.addColorStop(1, om(92, 113, 137, 0.50 * day * sh));
          c.fillStyle = g;
        } else {

    c.fillStyle = om(20, 22, 28, 0.28);
    c.fillRect(cE, yC + H * 0.012, cR - cE, H * 0.006);
    const ccr = c.createLinearGradient(0, yC - H * 0.012, 0, yC + H * 0.012);
    ccr.addColorStop(0, om(208, 212, 219));
    ccr.addColorStop(0.55, om(160, 165, 173));
    ccr.addColorStop(1, om(112, 117, 126));
    c.fillStyle = ccr;
    c.fillRect(cE - L * 0.010, yC - H * 0.012, (cR - cE) + L * 0.020, H * 0.024);
    flank(cE, yC - H * 0.012, yC + H * 0.012, 0, 1, om(88, 93, 102));

    // ---- socle du mat ----
    c.fillStyle = om(84, 89, 98);
    c.fillRect(mE, yM, mR - mE, yC - yM + H * 0.008);
    c.fillStyle = om(140, 146, 155);
    c.fillRect(mE + (mR - mE) * 0.70, yM, (mR - mE) * 0.30, yC - yM + H * 0.008);
    c.fillStyle = om(50, 54, 62);
    c.fillRect(mE, yM, (mR - mE) * 0.16, yC - yM + H * 0.008);
    c.fillStyle = om(198, 202, 209);
    c.fillRect(mE - L * 0.006, yM - H * 0.008, (mR - mE) + L * 0.012, H * 0.008);
    flank(mE, yM - H * 0.008, yC, 0, 1, om(66, 71, 80));

    // ---- mat et feu a eclats ----
    const mx = (mE + mR) * 0.5;
    const my0 = yM - H * 0.008, my1 = -H * 1.12;
    const w0 = L * 0.028, w1 = L * 0.007;
    c.beginPath();
    c.moveTo(mx - w0, my0); c.lineTo(mx - w1, my1); c.lineTo(mx + w1, my1); c.lineTo(mx + w0, my0);
    c.closePath();
    c.fillStyle = om(98, 103, 112); c.fill();
    c.beginPath();
    c.moveTo(mx + w0 * 0.30, my0); c.lineTo(mx + w1 * 0.30, my1); c.lineTo(mx + w1, my1); c.lineTo(mx + w0, my0);
    c.closePath();
    c.fillStyle = om(162, 168, 177); c.fill();
    c.beginPath();
    c.moveTo(mx - w0, my0); c.lineTo(mx - w1, my1); c.lineTo(mx - w1 * 0.5, my1); c.lineTo(mx - w0 * 0.5, my0);
    c.closePath();
    c.fillStyle = om(54, 58, 66); c.fill();
    for (let i = 0; i < 7; i++){
      const u = i / 7;
      const yy = my0 + (my1 - my0) * u;
      const ww = w0 + (w1 - w0) * u;
      c.fillStyle = om(122, 127, 136);
      c.fillRect(mx - ww, yy, ww * 2, Math.max(0.6, H * 0.0035));
    }
    c.fillStyle = om(140, 145, 154);
    c.fillRect(mx - L * 0.032, my0 - (my0 - my1) * 0.62, L * 0.064, Math.max(0.7, H * 0.004));
    c.fillStyle = om(112, 60, 58);
    c.fillRect(mx - L * 0.011, my1 - H * 0.013, L * 0.022, H * 0.015);

    // Eclat bref puis retour a la braise : cycle lent, pilote par t seul.
    const cyc = (t * 0.45) % 1;
    const flash = Math.exp(-cyc * cyc * 120) * 0.9 + 0.12;
    const fy = my1 - H * 0.008;
    const fr = H * 0.040 * (0.6 + flash);
    c.save();
    c.globalCompositeOperation = "lighter";
    const rg = c.createRadialGradient(mx, fy, 0, mx, fy, fr);
    rg.addColorStop(0, "rgba(255,158,136," + (0.95 * flash) + ")");
    rg.addColorStop(0.24, "rgba(238,72,58," + (0.50 * flash) + ")");
    rg.addColorStop(1, "rgba(198,30,26,0)");
    c.fillStyle = rg;
    c.beginPath(); c.arc(mx, fy, fr, 0, Math.PI * 2); c.fill();
    const cr2 = H * 0.016 * (0.7 + 0.4 * flash);
    const rg2 = c.createRadialGradient(cE + L * 0.010, yC - H * 0.010, 0, cE + L * 0.010, yC - H * 0.010, cr2);
    rg2.addColorStop(0, "rgba(255,110,92,0.55)");
    rg2.addColorStop(1, "rgba(210,40,32,0)");
    c.fillStyle = rg2;
    c.beginPath(); c.arc(cE + L * 0.010, yC - H * 0.010, cr2, 0, Math.PI * 2); c.fill();
    const rg3 = c.createRadialGradient(cR - L * 0.010, yC - H * 0.010, 0, cR - L * 0.010, yC - H * 0.010, cr2);
    rg3.addColorStop(0, "rgba(255,110,92,0.55)");
    rg3.addColorStop(1, "rgba(210,40,32,0)");
    c.fillStyle = rg3;
    c.beginPath(); c.arc(cR - L * 0.010, yC - H * 0.010, cr2, 0, Math.PI * 2); c.fill();
    c.restore();

    // ---- socle : hall vitre profond sous un auvent en debord ----
    const bgrK = c.createLinearGradient(pE, 0, pE - dep, 0);
    bgrK.addColorStop(0, om(48, 52, 60));
    bgrK.addColorStop(1, om(78, 83, 92));
    flank(pE, -hb, 0, 0, 1, bgrK);
    flank(pE, -hb, -hb * 0.78, 0, 1, om(116, 121, 130));
    for (let i = 0; i < 3; i++){
      fpane(pE, -hb * 0.70, -hb * 0.12, 0.08 + i * 0.30, 0.32 + i * 0.30, 4200 + i, 0.5);
    }

    const bgrF = c.createLinearGradient(pE, 0, pR, 0);
    bgrF.addColorStop(0, om(104, 109, 117));
    bgrF.addColorStop(0.6, om(134, 139, 147));
    bgrF.addColorStop(1, om(168, 173, 181));
    c.fillStyle = bgrF;
    c.fillRect(pE, -hb, pR - pE, hb);

    c.save();
    c.beginPath(); c.rect(pE, -hb, pR - pE, hb); c.clip();
    c.fillStyle = om(34, 38, 46);
    c.fillRect(pE, -hb * 0.86, pR - pE, hb * 0.86);
    const nc = 7;
    const cw = (pR - pE) / nc;
    for (let i = 0; i < nc; i++){
      pane(pE + i * cw + cw * 0.10, -hb * 0.78, cw * 0.80, hb * 0.70, 4400 + i, 0.9, 0);
    }
    for (let i = 0; i <= nc; i++){
      const cx = pE + i * cw - cw * 0.05;
      c.fillStyle = om(112, 116, 124); c.fillRect(cx, -hb * 0.86, cw * 0.10, hb * 0.86);
      c.fillStyle = om(166, 170, 178); c.fillRect(cx + cw * 0.066, -hb * 0.86, cw * 0.034, hb * 0.86);
      c.fillStyle = om(62, 66, 74); c.fillRect(cx, -hb * 0.86, cw * 0.024, hb * 0.86);
    }
    const bog = c.createLinearGradient(0, -hb * 0.86, 0, -hb * 0.42);
    bog.addColorStop(0, om(12, 14, 20, 0.62));
    bog.addColorStop(1, om(12, 14, 20, 0));
    c.fillStyle = bog;
    c.fillRect(pE, -hb * 0.86, pR - pE, hb * 0.44);
    c.fillStyle = om(76, 80, 87);
    c.fillRect(pE, -H * 0.012, pR - pE, H * 0.012);
    if (nuit > 0.02){
      c.save();
      c.globalCompositeOperation = "lighter";
      const lg = c.createLinearGradient(0, -hb * 0.76, 0, 0);
      lg.addColorStop(0, "rgba(255,206,142," + (0.26 * nuit) + ")");
      lg.addColorStop(1, "rgba(255,174,92,0)");
      c.fillStyle = lg;
      c.fillRect(pE, -hb * 0.76, pR - pE, hb * 0.76);
      c.restore();
    }
    c.restore();

    const aug = c.createLinearGradient(0, -hb - H * 0.014, 0, -hb + H * 0.006);
    aug.addColorStop(0, om(200, 204, 211));
    aug.addColorStop(0.5, om(158, 163, 171));
    aug.addColorStop(1, om(84, 88, 96));
    c.fillStyle = aug;
    c.fillRect(pE - dep * 0.06, -hb - H * 0.014, (pR - pE) + dep * 0.06 + L * 0.018, H * 0.020);

    // ---- aretes verticales : ombre franche a gauche, liseré a droite ----
    c.fillStyle = om(24, 26, 32, 0.55);
    c.fillRect(sE - px1, shTop, px1, shBot - shTop);
    c.fillStyle = om(20, 22, 28, 0.55);
    c.fillRect(pE - px1, -hb, px1, hb);
    c.fillStyle = om(216, 222, 230, 0.45);
    c.fillRect(sR - px1 * 1.2, yS + H * 0.020, px1 * 1.2, shBot - yS - H * 0.020);
    c.fillStyle = om(216, 220, 228, 0.4);
    c.fillRect(pR - px1 * 1.2, -hb, px1 * 1.2, hb);

    c.restore();
  }

  // Cite futuriste (vers 2210), vue de nuit.
  // La matiere opaque passe par om() pour heriter de la teinte de nuit, les sources
  // lumineuses sont ecrites en rgba direct et composees en "lighter" pour s'additionner.

  function bat5(c, L, H, om, al, nuit, t) {
    const n = nuit < 0 ? 0 : nuit > 1 ? 1 : nuit;
    const glow = 0.18 + 0.82 * n;
    const dep = L * 0.095;
    const dyy = dep * 0.42;
    const eye = -H * 0.32;

    const lerp = (a, b, u) => a + (b - a) * u;
    const cl = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);
    const rg = (r, g, b, a) =>
      "rgba(" + Math.round(cl(r)) + "," + Math.round(cl(g)) + "," + Math.round(cl(b)) +
      "," + Math.max(0, Math.min(1, a)) + ")";
    const grad = (x0, y0, x1, y1, c0, c1) => {
      const g = c.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, c0);
      g.addColorStop(1, c1);
      return g;
    };
    const beam = (x0, y0, x1, y1, w, r, g, b, a) => {
      c.strokeStyle = rg(r, g, b, a * 0.20);
      c.lineWidth = w * 4.5;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.strokeStyle = rg(r, g, b, a * 0.80);
      c.lineWidth = w * 1.5;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.strokeStyle = rg(255, 255, 255, a * 0.45);
      c.lineWidth = w * 0.45;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    };
    const halo = (x, y, r, cr, cg, cb, a) => {
      if (r <= 0) return;
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rg(cr, cg, cb, a));
      g.addColorStop(0.40, rg(cr, cg, cb, a * 0.30));
      g.addColorStop(1, rg(cr, cg, cb, 0));
      c.fillStyle = g;
      c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
    };

    // --- geometrie ---
    const pX0 = -0.52 * L, pX1 = 0.47 * L, pY = -0.13 * H;          // socle technique
    const rX0 = -0.28 * L, rX1 = -0.03 * L, rY = -0.80 * H;          // tour d'arriere plan
    const bX0 = -0.50 * L, bX1 = -0.26 * L, bYb = -0.10 * H, bYt = -0.47 * H;
    const aX0b = -0.15 * L, aX1b = 0.44 * L, aX0t = -0.10 * L, aX1t = 0.38 * L;
    const aYb = -0.07 * H, aYt = -0.68 * H;
    const cX0b = 0.01 * L, cX1b = 0.30 * L, cX0t = 0.03 * L, cX1t = 0.27 * L, cYt = -0.90 * H;
    const tX0 = 0.06 * L, tX1 = 0.25 * L, tYt = -0.99 * H;
    const mx = 0.155 * L, mYt = -1.16 * H;
    const aLeft = (y) => lerp(aX0b, aX0t, (y - aYb) / (aYt - aYb));
    const bridges = [
      { y: -0.19 * H, th: H * 0.030 },
      { y: -0.32 * H, th: H * 0.026 },
      { y: -0.43 * H, th: H * 0.022 }
    ];

    const volume = (x0b, x1b, x0t, x1t, yBot, yTop, r, g, b) => {
      c.fillStyle = om(cl(r * 1.55 + 14), cl(g * 1.55 + 14), cl(b * 1.50 + 16), 1);
      c.beginPath();
      c.moveTo(x1b, yBot); c.lineTo(x1b + dep, yBot - dyy);
      c.lineTo(x1t + dep, yTop - dyy); c.lineTo(x1t, yTop);
      c.closePath(); c.fill();
      c.fillStyle = grad(x1t, yTop, x0b, yBot,
        om(cl(r * 1.20), cl(g * 1.20), cl(b * 1.20), 1),
        om(cl(r * 0.50), cl(g * 0.54), cl(b * 0.62), 1));
      c.beginPath();
      c.moveTo(x0b, yBot); c.lineTo(x0t, yTop); c.lineTo(x1t, yTop); c.lineTo(x1b, yBot);
      c.closePath(); c.fill();
      c.fillStyle = om(cl(r * 0.34), cl(g * 0.38), cl(b * 0.48), 1);
      c.beginPath();
      c.moveTo(x0b, yBot); c.lineTo(x0t, yTop);
      c.lineTo(x0t + (x1t - x0t) * 0.06, yTop); c.lineTo(x0b + (x1b - x0b) * 0.06, yBot);
      c.closePath(); c.fill();
    };

    // Au dessus de la ligne d'oeil on voit la sous face de la dalle, en dessous son dessus.
    const slab = (x0, x1, y, th) => {
      if (y < eye) {
        c.fillStyle = om(20, 26, 40, 1);
        c.beginPath();
        c.moveTo(x0, y + th); c.lineTo(x0 + dep, y + th - dyy);
        c.lineTo(x1 + dep, y + th - dyy); c.lineTo(x1, y + th);
        c.closePath(); c.fill();
      } else {
        c.fillStyle = om(104, 112, 132, 1);
        c.beginPath();
        c.moveTo(x0, y); c.lineTo(x0 + dep, y - dyy);
        c.lineTo(x1 + dep, y - dyy); c.lineTo(x1, y);
        c.closePath(); c.fill();
      }
      c.fillStyle = om(70, 78, 98, 1);
      c.fillRect(x0, y, x1 - x0, th);
      c.fillStyle = om(126, 136, 158, 1);
      c.fillRect(x0, y, x1 - x0, Math.max(0.8, th * 0.28));
    };

    const facade = (x0b, x1b, x0t, x1t, yBot, yTop, rows, cols, seed, mode, h0, h1) => {
      for (let i = 0; i < rows; i++) {
        if (i >= h0 && i < h1) continue;
        const u = i / rows;
        const y = lerp(yBot, yTop, u);
        const yn = lerp(yBot, yTop, (i + 1) / rows);
        const lx = lerp(x0b, x0t, u), rx = lerp(x1b, x1t, u);
        const w = rx - lx, th = y - yn;
        if (mode === 0) {
          c.fillStyle = om(12, 17, 30, 1);
          c.fillRect(lx, yn, w, th * 0.46);
          c.fillStyle = om(84, 92, 112, 0.75);
          c.fillRect(lx, yn + th * 0.46, w, Math.max(0.7, th * 0.12));
        } else {
          for (let k = 0; k < cols; k++) {
            const s = al(seed + i * 37 + k * 11);
            if (s < 0.32) continue;
            const cw = w / cols;
            const wx = lx + cw * (k + 0.18), ww = cw * 0.64;
            const wy = yn + th * 0.09, wh = th * 0.29;
            const tone = al(seed + i * 7 + k * 3);
            const cr = tone < 0.58 ? 255 : (tone < 0.82 ? 140 : 255);
            const cv = tone < 0.58 ? 198 : (tone < 0.82 ? 220 : 148);
            const cb = tone < 0.58 ? 132 : (tone < 0.82 ? 255 : 208);
            const a = glow * (0.28 + 0.55 * s) * (0.86 + 0.14 * Math.sin(t * 0.5 + s * 6.2832));
            c.fillStyle = rg(cr, cv, cb, a * 0.15);
            c.fillRect(wx - ww * 0.35, wy - wh * 0.35, ww * 1.7, wh * 1.7);
            c.fillStyle = rg(cr, cv, cb, a);
            c.fillRect(wx, wy, ww, wh);
          }
        }
      }
    };

    const exo = (x0b, x1b, x0t, x1t, yBot, yTop, mods, mode) => {
      for (let i = 0; i < mods; i++) {
        const u0 = i / mods, u1 = (i + 1) / mods;
        const ya = lerp(yBot, yTop, u0), yb = lerp(yBot, yTop, u1);
        const l0 = lerp(x0b, x0t, u0), r0 = lerp(x1b, x1t, u0);
        const l1 = lerp(x0b, x0t, u1), r1 = lerp(x1b, x1t, u1);
        if (mode === 0) {
          c.lineWidth = L * 0.019;
          c.strokeStyle = om(70, 78, 100, 1);
          c.beginPath();
          c.moveTo(l0, ya); c.lineTo(r1, yb);
          c.moveTo(r0, ya); c.lineTo(l1, yb);
          c.moveTo(l0, ya); c.lineTo(r0, ya);
          c.stroke();
          c.lineWidth = L * 0.005;
          c.strokeStyle = om(152, 162, 186, 0.85);
          c.beginPath();
          c.moveTo(l0, ya - L * 0.008); c.lineTo(r1, yb - L * 0.008);
          c.moveTo(r0, ya - L * 0.008); c.lineTo(l1, yb - L * 0.008);
          c.moveTo(l0, ya - L * 0.009); c.lineTo(r0, ya - L * 0.009);
          c.stroke();
        } else {
          const a = glow * 0.45 * (0.62 + 0.38 * Math.sin(t * 0.32 + i * 0.9));
          beam(r0, ya, l1, yb, L * 0.006, 90, 190, 255, a);
          halo(l0, ya, L * 0.055, 120, 200, 255, glow * 0.30);
          halo(r0, ya, L * 0.055, 120, 200, 255, glow * 0.30);
        }
      }
    };

    const foliage = (x0, x1, y, seed, count) => {
      for (let i = 0; i < count; i++) {
        const s = al(seed + i * 13), s2 = al(seed + i * 29);
        const x = lerp(x0, x1, (i + 0.5) / count) + (s - 0.5) * (x1 - x0) * 0.10;
        const r = (x1 - x0) * (0.06 + 0.06 * s2);
        c.fillStyle = om(22, 48, 40, 1);
        c.beginPath(); c.arc(x, y - r * 0.75, r, 0, 6.2832); c.fill();
        c.fillStyle = om(46, 88, 64, 1);
        c.beginPath(); c.arc(x + r * 0.30, y - r * 1.10, r * 0.52, 0, 6.2832); c.fill();
      }
    };

    c.save();
    c.lineJoin = "round";
    c.lineCap = "butt";

    // ----- matiere opaque, de l'arriere vers l'avant -----
    volume(rX0, rX1, rX0 + 0.02 * L, rX1 - 0.02 * L, -0.02 * H, rY, 20, 26, 42);
    slab(rX0 + 0.02 * L, rX1 - 0.02 * L, rY, H * 0.012);
    facade(rX0 + 0.03 * L, rX1 - 0.03 * L, rX0 + 0.04 * L, rX1 - 0.04 * L, -0.02 * H, rY, 30, 4, 601, 0, -1, -1);

    volume(pX0, pX1, pX0 + 0.012 * L, pX1 - 0.012 * L, 0, pY, 44, 50, 66);
    slab(pX0 + 0.012 * L, pX1 - 0.012 * L, pY, H * 0.016);

    volume(bX0, bX1, bX0 + 0.012 * L, bX1 - 0.012 * L, bYb, bYt, 40, 46, 62);
    facade(bX0 + 0.022 * L, bX1 - 0.022 * L, bX0 + 0.032 * L, bX1 - 0.032 * L, bYb, bYt, 15, 4, 101, 0, -1, -1);
    slab(bX0 + 0.012 * L, bX1 - 0.012 * L, bYt, H * 0.016);
    foliage(bX0 + 0.03 * L, bX1 - 0.03 * L, bYt, 311, 4);

    volume(aX0b, aX1b, aX0t, aX1t, aYb, aYt, 44, 50, 68);
    facade(aX0b + 0.022 * L, aX1b - 0.022 * L, aX0t + 0.022 * L, aX1t - 0.022 * L, aYb, aYt, 24, 7, 211, 0, 12, 14);

    // jardin suspendu: deux niveaux evides dans la facade
    const gyF = lerp(aYb, aYt, 12 / 24), gyC = lerp(aYb, aYt, 14 / 24);
    const gx0 = lerp(aX0b, aX0t, 0.5) + 0.05 * L, gx1 = lerp(aX1b, aX1t, 0.5) - 0.08 * L;
    c.fillStyle = om(8, 12, 22, 1);
    c.fillRect(gx0, gyC, gx1 - gx0, gyF - gyC);
    c.fillStyle = om(60, 68, 88, 1);
    c.fillRect(gx0, gyF - H * 0.006, gx1 - gx0, H * 0.006);
    foliage(gx0 + 0.01 * L, gx1 - 0.01 * L, gyF, 407, 5);

    exo(aX0b, aX1b, aX0t, aX1t, aYb, aYt, 6, 0);
    slab(aX0t, aX1t, aYt, H * 0.018);
    foliage(aX0t + 0.03 * L, aX0t + 0.16 * L, aYt, 503, 3);

    volume(cX0b, cX1b, cX0t, cX1t, aYt, cYt, 42, 48, 66);
    facade(cX0b + 0.02 * L, cX1b - 0.02 * L, cX0t + 0.02 * L, cX1t - 0.02 * L, aYt, cYt, 9, 5, 809, 0, -1, -1);
    slab(cX0t, cX1t, cYt, H * 0.014);

    volume(tX0, tX1, tX0 + 0.01 * L, tX1 - 0.01 * L, cYt, tYt, 52, 58, 74);
    slab(tX0 + 0.01 * L, tX1 - 0.01 * L, tYt, H * 0.012);
    c.fillStyle = om(16, 22, 36, 1);
    for (let i = 0; i < 5; i++) {
      const vx = tX0 + 0.02 * L + i * (tX1 - tX0 - 0.04 * L) / 5;
      c.fillRect(vx, tYt + H * 0.014, (tX1 - tX0 - 0.04 * L) / 8, H * 0.055);
    }

    c.fillStyle = om(62, 70, 90, 1);
    c.fillRect(mx - L * 0.009, mYt, L * 0.018, tYt - mYt);
    c.fillStyle = om(128, 138, 162, 1);

      beam(x0, br.y - br.th * 1.02, x1, br.y - br.th * 1.02, L * 0.004, 255, 210, 150, glow * 0.55);

    for (let k = 0; k < 3; k++) {
      const u = (t * (0.028 + 0.018 * al(200 + k)) + al(210 + k)) % 1;

    c.restore();

  function mon5(c, L, H, om, al, nuit, t) {
    const n = nuit < 0 ? 0 : nuit > 1 ? 1 : nuit;

    const lerp = (a, b, u) => a + (b - a) * u;
    const cl = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);
    const rg = (r, g, b, a) =>

    const grad = (x0, y0, x1, y1, c0, c1) => {
      const g = c.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, c0);
      g.addColorStop(1, c1);

    };
    const beam = (x0, y0, x1, y1, w, r, g, b, a) => {
      c.strokeStyle = rg(r, g, b, a * 0.20);
      c.lineWidth = w * 4.5;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.strokeStyle = rg(r, g, b, a * 0.80);
      c.lineWidth = w * 1.5;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.strokeStyle = rg(255, 255, 255, a * 0.45);

    const halo = (x, y, r, cr, cg, cb, a) => {

      g.addColorStop(0.40, rg(cr, cg, cb, a * 0.30));
      g.addColorStop(1, rg(cr, cg, cb, 0));

    };

    const yBase = -0.24 * H, yTip = -1.06 * H;
    const wBase = 0.085 * L, wTip = 0.020 * L;
    const steps = 16;
    // L'exposant donne un affinement rapide en bas puis presque parallele en haut.

      const u = Math.max(0, Math.min(1, (y - yBase) / (yTip - yBase)));

    const shaftPath = (off) => {
      c.moveTo(-halfAt(yBase) - off, yBase + H * 0.03);
      for (let i = 0; i <= steps; i++) {

        c.lineTo(-halfAt(y) - off, y);
      }
      for (let i = steps; i >= 0; i--) {

      }

    const collars = [0.06, 0.24, 0.42, 0.60, 0.78, 0.94];

    c.fill();
    c.fillStyle = om(16, 22, 36, 1);
    c.beginPath();
    c.ellipse(0, plTop, rx * 0.42, ry * 0.42, 0, 0, 6.2832);
    c.fill();

    leg(-0.26 * L, -0.13 * L, -0.045 * L, true);
    leg(0.13 * L, 0.26 * L, 0.045 * L, true);

    c.beginPath();
    shaftPath(0);
    c.fillStyle = grad(0, yBase, 0, yTip, om(40, 48, 66, 1), om(74, 84, 108, 1));
    c.fill();

    for (let i = 0; i <= steps; i++) {

    c.strokeStyle = rg(255, 255, 255, glow * 0.35);

      c.clip("evenodd");
      c.strokeStyle = rg(cr, cv, 255, a * 0.35);
      c.lineWidth = L * 0.007;
      c.beginPath();
      c.ellipse(0, y, r, rr, 0, Math.PI, 6.2832);
      c.stroke();
      c.restore();
      c.strokeStyle = rg(cr, cv, 255, a * 0.30);
      c.lineWidth = L * 0.020;
      c.beginPath();
      c.ellipse(0, y, r, rr, 0, 0, Math.PI);

      c.ellipse(0, y, r, rr, 0, 0, Math.PI);

      const a = glow * (0.45 + 0.3 * Math.sin(t * 0.30 + i * 1.2));

      const x = lerp(-0.44 * L, 0.44 * L, al(410 + k));
      const h = H * (0.08 + 0.16 * al(420 + k)) * Math.min(1, u * 2.5);
      const a = glow * 0.35 * (1 - u);
      const g = c.createLinearGradient(0, plTop, 0, plTop - h);
      g.addColorStop(0, rg(110, 235, 255, a));
      g.addColorStop(1, rg(110, 235, 255, 0));

      c.fillRect(x - L * 0.006, plTop - h, L * 0.012, h);

    for (let k = 0; k < 3; k++) {

      const orb = L * (0.20 + 0.16 * al(320 + k));
      const yd = -H * (0.36 + 0.44 * al(330 + k));
      const x = Math.cos(ph) * orb;
      const front = Math.sin(ph) > 0;

      halo(x, yd, L * 0.035, 190, 235, 255, a * 0.5);
      c.fillStyle = rg(235, 250, 255, a);
      c.fillRect(x - L * 0.006, yd - H * 0.003, L * 0.012, H * 0.006);
    }

    halo(0, -1.135 * H, L * 0.22, 160, 220, 255, glow * (0.45 + 0.3 * Math.sin(t * 0.5)));
    c.fillStyle = rg(255, 90, 90, glow * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 0.8))));
    c.fillRect(-L * 0.008, -1.152 * H, L * 0.016, H * 0.012);

    // le cable qui file vers l'orbite, en fondu
    const tg = c.createLinearGradient(0, -1.14 * H, 0, -1.24 * H);
    tg.addColorStop(0, rg(150, 215, 255, glow * 0.55));
    tg.addColorStop(1, rg(150, 215, 255, 0));
    c.strokeStyle = tg;
    c.lineWidth = L * 0.006;
    c.beginPath();
    c.moveTo(0, -1.14 * H);
    c.lineTo(0, -1.24 * H);
    c.stroke();

    c.restore();
    c.restore();
  }

  // Nuages du ciel du village : des lobes poses sur une ligne de base commune,
  // repasses deux fois decales vers le soleil et retrecis, du gris-bleu plat du
  // ventre au blanc du sommet. Lumiere fixe au haut-droite.

  function paysageNuages(c, W, Hh, solY, ee, nuit, t, E, om, al){
    if (!(W > 0) || !(Hh > 0) || !(E > 0) || !(solY > 12 * E)) return;

    const TAU = 6.283185307179586, LX = 0.60, LY = -0.80;
    const cl = (v, a, b) => (v < a ? a : (v > b ? b : v));
    const lp = (a, b, u) => a + (b - a) * u;
    const ss = (v) => { const x = cl(v, 0, 1); return x * x * (3 - 2 * x); };
    const md = (v) => v - Math.floor(v);
    const mx = (a, b, u) => [lp(a[0], b[0], u), lp(a[1], b[1], u), lp(a[2], b[2], u)];
    const sky = solY, day = 1 - cl(nuit, 0, 1);

    /* Meteo par epoque. `w` en unites E, `yLo/yHi` en fraction de hauteur de ciel
       comptee depuis l'horizon vers le haut, `fib` l'etirement en cirrus,
       `rel` la force du relief, `bud` les bourgeons de chou-fleur. */
    const P = [
      { n: 6.0, w: 210, hh: 0.62, nl: 6, yLo: 0.30, yHi: 0.64, op: 0.90, spd: 0.62,
        fib: 0.10, soot: 0.04, rel: 0.85, tr: 0.00, neon: 0.0, bud: 0.70,
        bas: [112, 104, 132], mid: [170, 154, 170], lit: [228, 192, 184], hi: [255, 224, 184] },
      { n: 3.2, w: 150, hh: 0.52, nl: 5, yLo: 0.40, yHi: 0.74, op: 0.82, spd: 0.55,
        fib: 0.22, soot: 0.02, rel: 0.90, tr: 0.00, neon: 0.0, bud: 0.50,
        bas: [152, 168, 192], mid: [198, 210, 226], lit: [240, 244, 250], hi: [255, 254, 248] },
      { n: 9.0, w: 262, hh: 0.72, nl: 7, yLo: 0.34, yHi: 0.72, op: 0.96, spd: 0.70,
        fib: 0.04, soot: 0.03, rel: 1.00, tr: 0.00, neon: 0.0, bud: 1.00,
        bas: [124, 142, 174], mid: [180, 194, 216], lit: [234, 240, 248], hi: [255, 253, 246] },
      { n: 12.0, w: 340, hh: 0.40, nl: 8, yLo: 0.14, yHi: 0.46, op: 0.97, spd: 0.45,
        fib: 0.16, soot: 1.00, rel: 0.34, tr: 0.00, neon: 0.0, bud: 0.35,
        bas: [74, 70, 70], mid: [116, 110, 104], lit: [158, 148, 136], hi: [196, 184, 164] },
      { n: 8.0, w: 420, hh: 0.20, nl: 9, yLo: 0.58, yHi: 0.92, op: 0.72, spd: 0.34,
        fib: 0.92, soot: 0.05, rel: 0.30, tr: 1.00, neon: 0.0, bud: 0.00,
        bas: [176, 190, 212], mid: [214, 224, 238], lit: [244, 248, 254], hi: [255, 255, 255] },
      { n: 4.5, w: 300, hh: 0.30, nl: 7, yLo: 0.66, yHi: 0.95, op: 0.80, spd: 0.26,
        fib: 0.62, soot: 0.03, rel: 0.45, tr: 0.30, neon: 1.0, bud: 0.20,
        bas: [86, 84, 120], mid: [126, 122, 160], lit: [176, 168, 206], hi: [224, 214, 246] }
    ];

    const e = cl(ee, 0, 5), i0 = Math.min(4, Math.floor(e)), A0 = P[i0], B0 = P[i0 + 1];
    const u0 = cl(e - i0, 0, 1);
    const g = (k) => lp(A0[k], B0[k], u0);
    const gc = (k) => mx(A0[k], B0[k], u0);
    const cBas = gc("bas"), cMid = gc("mid"), cLit = gc("lit"), cHi = gc("hi");
    const rgb = (v, a) => om(Math.round(v[0]), Math.round(v[1]), Math.round(v[2]), cl(a, 0, 1));
    const fib = g("fib"), soot = g("soot"), rel = g("rel"), neon = g("neon");
    const bud = g("bud"), op = g("op"), spd = g("spd"), nlB = g("nl"), cnt = g("n");
    const NC = 13;

    c.save();
    c.lineJoin = "round";
    c.lineCap = "round";
    const ga = (v) => { c.globalAlpha = cl(v, 0, 1); };

    // ---- voile de suie au ras de l'horizon : l'industrie salit le ciel ----
    if (soot > 0.06){
      const hB = sky * 0.46, yB = solY - hB;
      const gs = c.createLinearGradient(0, yB, 0, solY);
      gs.addColorStop(0, om(104, 92, 76, 0));
      gs.addColorStop(0.55, om(92, 82, 68, 0.10 * soot));
      gs.addColorStop(1, om(78, 68, 56, 0.23 * soot));
      ga(1);
      c.fillStyle = gs;
      c.fillRect(0, yB, W, hB);
    }

    // ---- trainees d'avion ----
    function trainee(i, amt){
      if (amt <= 0.02) return;
      const s = 91.3 + i * 6.31;
      const len = W * (0.46 + 0.42 * al(s + 1.1));
      const pen = (al(s + 2.3) - 0.5) * 0.30;
      const hy = solY - sky * (0.62 + 0.32 * al(s + 3.7));
      const per = 300 + 240 * al(s + 4.9);
      const M = len + 34 * E, nb = 5, seg = 7;
      const hx = -M + md(al(s + 5.3) + t / per) * (W + 2 * M);
      for (let b = 0; b < nb; b++){
        c.beginPath();
        for (let q = (b === 0 ? 0 : 1); q <= seg; q++){
          const f = (b * seg + q) / (nb * seg);
          const x = hx - len * f, y = hy + len * f * pen;
          const r = E * (1.1 + 1.9 * f + 5.4 * f * f) * (0.72 + 0.56 * al(s + 6.1 + b * 0.77 + q * 0.13));
          c.moveTo(x + r, y);
          c.arc(x, y, r, 0, TAU);
        }
        const fb = (b + 0.5) / nb;
        ga(amt * op * (0.62 - 0.54 * fb * fb) * (0.34 + 0.66 * day));
        c.fillStyle = rgb(cHi, 1);
        c.fill();
      }
      ga(amt * 0.95);
      c.fillStyle = rgb(cHi, 1);
      c.beginPath();
      c.arc(hx + 1.6 * E, hy - 0.5 * E, Math.max(0.7, 1.4 * E), 0, TAU);
      c.fill();
    }
    const tr = g("tr");
    if (tr > 0.04){ for (let i = 0; i < 3; i++) trainee(i, tr * ss(3 * tr - i)); }

    /* Les lobes sont produits en repere local : ventre a y = 0, masse vers les y
       negatifs, x centre sur 0. C'est ce qui permet de mesurer l'encombrement
       reel avant de choisir la marge de bouclage. */
    function bouffee(s, wC, hC, nl, br){
      const L = [];
      const sp = wC / nl, rB = Math.max(sp * 0.70, hC * 0.34);
      const skew = (al(s + 0.31) - 0.5) * 0.34;
      const tilt = (al(s + 0.73) - 0.5) * 0.50 * fib;
      const rot = Math.atan(tilt);
      for (let k = 0; k < nl; k++){
        const f = (k + 0.5) / nl;
        const bell = Math.sin(Math.PI * f);
        const comet = Math.pow(f, 1.35) * Math.pow(1 - f, 0.30) * 2.05;
        const env = cl((bell * (1 - fib) + comet * fib) * (0.52 + 0.80 * al(s + k * 2.13 + 1.7)), 0.14, 1.30);
        const r = rB * (0.50 + 0.80 * env) * br;
        const rx = r * (1 + fib * 0.95), ry = r * (1 - fib * 0.78);
        const x = (f - 0.5) * wC + skew * bell * wC * 0.50
                + (al(s + k * 2.13 + 2.9) - 0.5) * sp * 0.55;
        const y = -ry * (0.35 + 0.42 * env) + tilt * (f - 0.5) * wC;
        L.push([x, y, rx, ry, rot + (al(s + k * 2.13 + 3.3) - 0.5) * 0.30 * fib]);
        // bourgeons : c'est ce qui separe un cumulus d'une rangee de disques
        if (bud > 0.02 && env > 0.62){
          const nbg = al(s + k * 2.13 + 4.3) < bud * 0.55 ? 2 : (al(s + k * 2.13 + 4.3) < bud ? 1 : 0);
          for (let j = 0; j < nbg; j++){
            const rr = r * (0.32 + 0.30 * al(s + k * 2.13 + 5.1 + j * 0.41));
            L.push([x + r * (0.10 + 0.46 * (al(s + k * 2.13 + 5.9 + j * 0.41) - 0.28)),
                    y - r * (0.50 + 0.34 * al(s + k * 2.13 + 6.7 + j * 0.41)) - rr * 0.15,
                    rr * (1 + fib * 0.60), rr * (1 - fib * 0.60), rot]);
          }
        }
      }
      return L;
    }

    function nuage(s, dp, fa){
      const wC = Math.min(g("w") * E * (0.52 + 0.92 * dp) * (0.74 + 0.58 * al(s + 1.1)), W * 0.62);
      const hC = wC * g("hh") * (0.80 + 0.42 * al(s + 1.7)) * (0.62 + 0.38 * dp);
      if (wC < 6 * E || hC < 2 * E) return;
      const nl = Math.max(3, Math.round(nlB * (0.76 + 0.48 * al(s + 2.3))));
      const br = 1 + 0.022 * Math.sin(t * 0.085 + s);          // respiration a cadence fixe
      const L = bouffee(s, wC, hC, nl, br);
      let x0 = 0, x1 = 0, top = 0;
      for (const o of L){
        if (o[0] - o[2] < x0) x0 = o[0] - o[2];
        if (o[0] + o[2] > x1) x1 = o[0] + o[2];
        if (o[1] - o[3] < top) top = o[1] - o[3];
      }
      const fe = Math.max(0.45, hC * 0.016);
      const hair = fib > 0.32;
      // marge de bouclage : aucun lobe ni aucune fibre ne doit etre coupe au saut
      const M = Math.max(-x0, x1) + hC * 0.6 + fe * 6 + (hair ? wC * 0.58 : 0);
      const per = lp(430, 150, dp) / Math.max(0.12, spd);
      const cx = -M + md(al(s + 3.1) + t / per) * (W + 2 * M);
      const yFr = lp(g("yLo"), g("yHi"), cl(al(s + 3.9) * 0.60 + dp * 0.40, 0, 1));
      const yMax = solY - 5 * E, yMin = Math.min(-top + 4 * E, yMax);
      const yb = cl(solY - sky * yFr, yMin, yMax);
      const A = op * fa * (0.62 + 0.38 * dp);

      const path = (dr, k, sf) => {
        c.beginPath();
        for (let q = 0; q < L.length; q++){
          const o = L[q], sh = (1 - k) * Math.min(o[2], o[3]) * sf;
          const px = o[0] + LX * sh, py = o[1] + LY * sh;
          const rx = Math.max(0.35, o[2] * k + dr), ry = Math.max(0.35, o[3] * k + dr);
          c.moveTo(px + rx * Math.cos(o[4]), py + rx * Math.sin(o[4]));
          c.ellipse(px, py, rx, ry, o[4], 0, TAU);
        }
      };

      const fibres = (front) => {
        if (!hair) return;
        const n = Math.round(5 + 8 * fib);
        c.lineWidth = Math.max(0.4, hC * (front ? 0.05 : 0.08));
        c.strokeStyle = rgb(front ? cHi : cMid, (front ? 0.32 : 0.24) * fib * (0.45 + 0.55 * day));
        ga(A);
        for (let q = 0; q < n; q++){
          const o = L[Math.min(L.length - 1, Math.floor(al(s + 20.1 + q * 1.31) * L.length))];
          const xs = o[0] + o[2] * (0.55 * al(s + 21.3 + q * 1.31) - 0.10);
          const ys = o[1] + (al(s + 22.5 + q * 1.31) - 0.5) * o[3] * 1.2;
          const ln = wC * (0.16 + 0.34 * al(s + 23.7 + q * 1.31));
          const dv = (al(s + 24.9 + q * 1.31) - 0.34) * hC * 0.85;
          c.beginPath();
          c.moveTo(xs, ys);
          c.quadraticCurveTo(xs - ln * 0.5, ys + dv * 0.3 - hC * 0.14, xs - ln, ys + dv);
          c.stroke();
        }
      };

      c.save();
      c.translate(cx, yb);
      fibres(false);
      c.save();
      if (fib < 0.50){
        // ventre plat, a peine ondule : c'est lui qui donne l'assise du cumulus
        const pad = hC * 0.6 + 5 * E, amp = hC * 0.035;
        c.beginPath();
        c.moveTo(x0 - pad, top - pad);
        c.lineTo(x1 + pad, top - pad);
        for (let q = 12; q >= 0; q--){
          c.lineTo(lp(x0 - pad, x1 + pad, q / 12), (al(s + 30.1 + q * 0.53) - 0.5) * 2 * amp);
        }
        c.closePath();
        c.clip();
      }

      const gr = c.createLinearGradient(0, top, 0, hC * 0.06);
      gr.addColorStop(0, rgb(cMid, 1));
      gr.addColorStop(0.50, rgb(mx(cMid, cBas, 0.45), 1));
      gr.addColorStop(1, rgb(cBas, 1));
      c.fillStyle = gr;
      ga(A * 0.30); path(fe * 2, 1, 0); c.fill();     // plume : les derniers pour cent du bord
      ga(A * 0.55); path(fe, 1, 0); c.fill();
      ga(A);        path(0, 1, 0); c.fill();

      if (neon > 0.02){
        // la cite eclaire ses nuages par en dessous
        const nc = al(s + 9.3) < 0.5 ? [255, 70, 160] : [70, 220, 255];
        const gn = c.createLinearGradient(0, top * 0.55, 0, hC * 0.10);
        gn.addColorStop(0, om(nc[0], nc[1], nc[2], 0));
        gn.addColorStop(1, om(nc[0], nc[1], nc[2], 0.50 * neon));
        c.save();
        path(0, 1, 0);
        c.clip();
        c.globalCompositeOperation = "lighter";
        ga(A);
        c.fillStyle = gn;
        c.fillRect(x0 - 2, top * 0.6 - 2, x1 - x0 + 4, hC * 0.9 + 4);
        c.restore();
      }

      if (soot > 0.10){
        c.save();
        path(0, 1, 0);
        c.clip();
        c.fillStyle = rgb(mx(cBas, [38, 32, 28], 0.72), 1);
        for (let q = 0; q < 5; q++){
          const ph = md(al(s + 12.1 + q * 1.7) + t * 0.0055 * (1 + q * 0.23));
          const sx = lp(x0, x1, ph), sy = top * (0.20 + 0.55 * al(s + 13.3 + q * 1.7));
          ga(A * 0.26 * soot * Math.sin(Math.PI * ph));   // fondu aux deux bouts, pas de saut
          c.beginPath();
          c.ellipse(sx, sy, wC * 0.17, hC * 0.19, (al(s + 14.5 + q * 1.7) - 0.5) * 0.6, 0, TAU);
          c.fill();
        }
        c.restore();
      }

      c.fillStyle = rgb(cLit, 1);
      ga(A * (0.34 + 0.62 * ss(rel)) * (0.55 + 0.45 * day));
      path(0, 0.865, 0.72); c.fill();

      c.fillStyle = rgb(cHi, 1);
      ga(A * (0.26 + 0.60 * ss(rel)) * (0.40 + 0.60 * day));
      path(-fe * 0.5, 0.66, 0.88); c.fill();

      if (rel > 0.45 && day > 0.04){
        c.fillStyle = rgb(mx(cHi, [255, 255, 250], 0.35), 1);
        ga(A * (rel - 0.45) * 1.1 * day);
        path(-fe, 0.40, 0.95); c.fill();
      }
      c.restore();
      fibres(true);
      c.restore();
    }

    const arr = [];
    for (let i = 0; i < NC; i++){
      const fa = ss(cnt - i);
      if (fa <= 0.01) continue;
      const s = 7.13 + i * 4.77;
      arr.push({ s: s, fa: fa, dp: al(s + 0.07) });
    }
    arr.sort((a, b) => a.dp - b.dp);            // les lointains d'abord, sous les proches
    for (const o of arr) nuage(o.s, o.dp, o.fa);

    c.restore();
  }

  /* Lointain du village : cinq plans de relief empilés, du massif brumeux à la
     colline proche. Rien ne descend sous solY, toute la matière passe par om(). */
  function paysageFond(c, W, Hh, solY, ee, nuit, t, E, om, al){
    if (!(W > 0) || !(Hh > 0) || !(E > 0) || !(solY > 0)) return;

    /* ================= outils ================= */
    const cl = (v, a, b) => (v < a ? a : (v > b ? b : v));
    const lp = (a, b, k) => a + (b - a) * k;
    const mx = (a, b, k) => [lp(a[0], b[0], k), lp(a[1], b[1], k), lp(a[2], b[2], k)];
    const night = cl(nuit, 0, 1);

    const era = cl(ee, 0, 5);
    const e0 = Math.min(4, Math.floor(era)), eF = era - e0;
    // poids par époque : les décors non morphables se fondent au lieu de sauter
    const eraW = [0, 0, 0, 0, 0, 0];
    eraW[e0] = 1 - eF; eraW[e0 + 1] += eF;
    const eNum = a => a[e0] + (a[e0 + 1] - a[e0]) * eF;
    const eCol = a => mx(a[e0], a[e0 + 1], eF);

    /* ---- palettes de jour : c'est om() qui bascule la scène en nuit ---- */
    const SKY   = [[190,203,188],[228,216,178],[199,208,204],[176,166,150],[197,207,213],[ 72, 82,114]];
    const LEAF  = [[ 40, 70, 40],[ 88,102, 64],[ 66, 96, 52],[ 84, 80, 58],[ 94,116, 62],[ 54, 66, 88]];
    const LEAF2 = [[ 26, 52, 32],[ 62, 76, 50],[ 44, 70, 38],[ 60, 56, 44],[ 66, 86, 46],[ 38, 48, 68]];
    const STONE = [[ 96, 98, 94],[136,126,104],[106,106, 98],[ 84, 76, 66],[106,106,106],[ 74, 80,106]];
    const SOIL  = [[110,100, 76],[164,148,112],[136,118, 86],[ 98, 86, 70],[142,126, 92],[ 88, 92,112]];
    const skyC = eCol(SKY), leaf = eCol(LEAF), leaf2 = eCol(LEAF2);
    const rock = eCol(STONE), soil = eCol(SOIL);
    const hazeK = eNum([.70, .76, .78, .93, .78, .84]);   // épaisseur d'atmosphère par époque

    /* Perspective atmosphérique : on désature d'abord, puis on tire vers l'horizon.
       Sans la désaturation les lointains restent verts et la profondeur ne prend pas. */
    function aerial(col, d){
      const g = col[0] * .30 + col[1] * .56 + col[2] * .14, s = d * .46;
      const k = cl(Math.pow(d, .80) * hazeK, 0, 1);
      return mx([lp(col[0],g,s), lp(col[1],g,s), lp(col[2],g,s)], skyC, k);
    }
    const paint = (col, d, a) => { const q = aerial(col, d); c.fillStyle   = om(q[0]|0, q[1]|0, q[2]|0, a === undefined ? 1 : a); };
    const ink   = (col, d, a) => { const q = aerial(col, d); c.strokeStyle = om(q[0]|0, q[1]|0, q[2]|0, a === undefined ? 1 : a); };

    /* ---- bruit déterministe : jamais Math.random(), le lointain ne doit pas grésiller ---- */
    const vnoise = (x, s) => {
      const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
      return lp(al(i + s * 811 + 4096), al(i + 1 + s * 811 + 4096), u);
    };
    const fbm = (x, s, o) => {
      let v = 0, a = .5, f = 1, n = 0;
      for (let k = 0; k < o; k++){ v += a * vnoise(x * f, s + k * 7); n += a; a *= .52; f *= 2.07; }
      return v / n;
    };
    // valeur absolue repliée : donne des arêtes franches là où le fbm ferait des bosses
    const ridged = (x, s, o) => {
      let v = 0, a = .5, f = 1, n = 0;
      for (let k = 0; k < o; k++){
        const q = 1 - Math.abs(2 * vnoise(x * f, s + k * 7) - 1);
        v += a * q * q; n += a; a *= .5; f *= 2.11;
      }
      return v / n;
    };

    /* ================= profils de relief ================= */
    const B = Math.min(solY * .60, Hh * .34);            // hauteur maxi du relief au-dessus du sol
    const BASE = [ .26, .17, .07, .00, -.05];
    const AMPL = [ .80, .54, .35, .21,  .13];
    const DIST = [ .96, .75, .51, .27,  .09];
    const RIDGE = [
      { s: 11, f: 2.5, o: 5, r: 1 }, { s: 23, f: 3.3, o: 5, r: 1 },
      { s: 37, f: 4.3, o: 4, r: 0 }, { s: 53, f: 5.6, o: 4, r: 0 },
      { s: 71, f: 7.4, o: 4, r: 0 }
    ];
    for (let k = 0; k < RIDGE.length; k++){
      const g = RIDGE[k]; g.ph = al(g.s * 7 + 3) * 60; g.v = [];
      for (let i = 0; i < 3; i++)
        g.v.push([ (i + .15 + al(g.s * 17 + i * 5 + 101) * .70) / 3,
                   .040 + al(g.s * 17 + i * 5 + 102) * .070,
                   .26  + al(g.s * 17 + i * 5 + 103) * .42 ]);
      g.sh = [ .20 + al(g.s * 17 + 140) * .60, .05 + al(g.s * 17 + 141) * .10,
               .18 + al(g.s * 17 + 142) * .32 ];
    }
    function rawProfile(x, g){
      const u = x / W;
      let n = g.r ? ridged(u * g.f + g.ph, g.s, g.o) * 1.25 : fbm(u * g.f + g.ph, g.s, g.o);
      n = n * .88 + .06;
      for (let i = 0; i < g.v.length; i++){
        const q = (u - g.v[i][0]) / g.v[i][1];
        n -= g.v[i][2] * Math.exp(-q * q);              // entaille gaussienne : creuse un col lisible
      }
      // épaulement asymétrique : empêche la crête de sonner comme une sinusoïde
      const sh = (u - g.sh[0]) / g.sh[1];
      n += g.sh[2] * (1 / (1 + Math.exp(-sh * 6)) - .5);
      return n < 0 ? 0 : (n > 1.3 ? 1.3 : n);
    }

    /* Le profil normalisé ne dépend ni de l'époque ni de l'heure : on le garde
       d'une frame à l'autre, seuls base et amplitude sont recalculés. */
    const NS = Math.max(48, Math.min(420, Math.round(W / (4 * E))));
    const gx0 = -3 * E, gx1 = W + 3 * E, gdx = (gx1 - gx0) / NS;
    const ckey = W + "|" + Math.round(E * 64) + "|" + NS;
    let cache = paysageFond._c;
    if (!cache || cache.k !== ckey){
      cache = paysageFond._c = { k: ckey, p: [] };
      for (let k = 0; k < RIDGE.length; k++){
        const a = new Float64Array(NS + 1);
        for (let i = 0; i <= NS; i++) a[i] = rawProfile(gx0 + i * gdx, RIDGE[k]);
        cache.p.push(a);
      }
    }
    const PLANE = [];
    for (let k = 0; k < 5; k++){
      const arr = cache.p[k], top = solY - B * BASE[k], amp = B * AMPL[k];
      PLANE.push({
        d: DIST[k], x0: gx0, x1: gx1,
        y: function(x){
          let s = (x - gx0) / gdx;
          if (s <= 0) s = 0; else if (s >= NS) s = NS;
          const i = s | 0, f = s - i;
          return top - (arr[i] + ((i < NS ? arr[i + 1] : arr[i]) - arr[i]) * f) * amp;
        }
      });
    }

    /* ================= tracés qui suivent le relief ================= */
    const STEP = Math.max(3, 5 * E);
    function edge(P, xa, xb, o1, o2, dir){
      const dl = xb - xa || 1;
      if (dir > 0){
        for (let x = xa; x < xb; x += STEP) c.lineTo(x, P.y(x) + lp(o1, o2, (x - xa) / dl));
        c.lineTo(xb, P.y(xb) + o2);
      } else {
        for (let x = xb; x > xa; x -= STEP) c.lineTo(x, P.y(x) + lp(o1, o2, (x - xa) / dl));
        c.lineTo(xa, P.y(xa) + o1);
      }
    }
    function skyline(P){
      c.beginPath(); c.moveTo(P.x0, solY + 8 * E); c.lineTo(P.x0, P.y(P.x0));
      edge(P, P.x0, P.x1, 0, 0, 1);
      c.lineTo(P.x1, solY + 8 * E); c.closePath();
    }
    // parcelle drapée sur la pente : ses deux bords épousent la crête
    function strip(P, xa, xb, dTop, dBot, col, dd, a, slope){
      const sl = slope || 0;
      c.beginPath(); c.moveTo(xa, P.y(xa) + dTop);
      edge(P, xa, xb, dTop, dTop + sl, 1);
      c.lineTo(xb, P.y(xb) + dBot + sl);
      edge(P, xa, xb, dBot, dBot + sl, -1);
      c.closePath(); paint(col, dd, a); c.fill();
    }

    /* ================= végétation ================= */
    /* Une seule lisière dont la forme des houppiers s'interpole d'une époque à
       l'autre : morphing continu plutôt que deux forêts en fondu croisé. */
    function treeLine(P, xa, xb, sz, gap, spike, col, colHi, dd, seed, a){
      const st = Math.max(1.1 * E, sz * gap), k = 1 - spike * .82;
      let i = 0;
      for (let x = xa; x < xb; x += st, i++){
        const r1 = al(seed + i * 4), r2 = al(seed + i * 4 + 1), r3 = al(seed + i * 4 + 2);
        const h = sz * (.50 + r1 * 1.15), wd = sz * (.30 + r2 * .32);
        const y = P.y(x + (r3 - .5) * st * .7) + sz * .16;
        c.beginPath(); c.moveTo(x - wd, y);
        c.quadraticCurveTo(x - wd * k, y - h * .60, x + (r3 - .5) * wd * .5, y - h);
        c.quadraticCurveTo(x + wd * k, y - h * .60, x + wd, y);
        c.closePath(); paint(r2 > .62 ? colHi : col, dd, a); c.fill();
      }
    }
    // bosquet isolé : une masse détachée casse la continuité de la lisière
    function grove(P, x, sz, spike, col, colHi, dd, seed){
      const k = 1 - spike * .82;
      for (let i = 0; i < 16; i++){
        const dx = (al(seed + i * 3) - .5) * sz * 3.4;
        const h = sz * (.55 + al(seed + i * 3 + 1) * 1.0), wd = sz * (.32 + al(seed + i * 3 + 2) * .30);
        const y = P.y(x + dx) + sz * .2;
        c.beginPath(); c.moveTo(x + dx - wd, y);
        c.quadraticCurveTo(x + dx - wd * k, y - h * .6, x + dx, y - h);
        c.quadraticCurveTo(x + dx + wd * k, y - h * .6, x + dx + wd, y);
        c.closePath(); paint(i % 3 === 0 ? colHi : col, dd); c.fill();
      }
    }

    /* ================= accidents ================= */
    // crête rocheuse : facettes alternées, la lumière vient du haut-droite
    function rockCrest(P, xa, xb, hgt, dd, seed){
      const n = 14;
      for (let i = 0; i < n; i++){
        const ua = i / n, ub = (i + 1) / n;
        const x1 = lp(xa, xb, ua), x2 = lp(xa, xb, ub), xm = (x1 + x2) * .5;
        const h = hgt * (.35 + al(seed + i * 3) * .85) * Math.sin(lp(ua, ub, .5) * 3.1416);
        const sk = (al(seed + i * 3 + 1) - .5) * (x2 - x1) * .8;
        const y1 = P.y(x1) + hgt * .35, y2 = P.y(x2) + hgt * .35, yt = P.y(xm) - h;
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(xm + sk, yt); c.lineTo(xm + sk, y2); c.closePath();
        paint([rock[0] * .68, rock[1] * .70, rock[2] * .74], dd); c.fill();
        c.beginPath(); c.moveTo(xm + sk, yt); c.lineTo(x2, y2); c.lineTo(xm + sk, y2); c.closePath();
        paint([rock[0] * 1.14, rock[1] * 1.12, rock[2] * 1.08], dd); c.fill();
      }
    }
    // chemin qui monte : il franchit la crête, sinon le relief reste inhabité
    function trail(P, xs, wd, col, dd, seed){
      const n = 16, dx = W * (.10 + al(seed) * .10) * (al(seed + 1) > .5 ? 1 : -1);
      const px = u => xs + dx * u + Math.sin(u * 4.1 + al(seed + 2) * 6) * wd * 3.2;
      c.beginPath();
      for (let s = 0; s <= n; s++){
        const u = s / n, x = px(u);
        const y = lp(solY + wd, P.y(x) - wd * .4, u), hw = lp(wd, wd * .22, u);
        if (s === 0) c.moveTo(x - hw, y); else c.lineTo(x - hw, y);
      }
      for (let s = n; s >= 0; s--){
        const u = s / n, x = px(u);
        c.lineTo(x + lp(wd, wd * .22, u), lp(solY + wd, P.y(x) - wd * .4, u));
      }
      c.closePath(); paint(col, dd, .8); c.fill();
    }

    /* ================= profondeur ================= */
    function veil(yTop, a){
      const yT = Math.max(0, yTop);
      if (solY - yT < 1) return;
      const g = c.createLinearGradient(0, yT, 0, solY);
      g.addColorStop(0, om(skyC[0]|0, skyC[1]|0, skyC[2]|0, 0));
      g.addColorStop(1, om(skyC[0]|0, skyC[1]|0, skyC[2]|0, a));
      c.fillStyle = g; c.fillRect(0, yT, W, solY - yT);
    }
    // liseré de crête éclairé : donne du volume sans une vraie passe d'ombrage
    function rimLight(P, dd, th, col){
      c.save(); skyline(P); c.clip();
      c.beginPath(); c.moveTo(P.x0, P.y(P.x0));
      edge(P, P.x0, P.x1, 0, 0, 1);
      c.lineTo(P.x1, P.y(P.x1) + th);
      edge(P, P.x0, P.x1, th, th, -1);
      c.closePath(); paint(col, dd, .55); c.fill();
      c.restore();
    }

    /* ================= réglages continus par époque ================= */
    const gap    = eNum([ .38, .95, .80, 1.9, 1.5, 2.1]);   // écart entre arbres : grand = clairsemé
    const spike  = eNum([ .86, .22, .48, .58, .34, .20]);   // houppier pointu ou rond
    const fields = eNum([ .00, .85, 1.0, .40, 1.0, .55]);   // présence de cultures
    const woods  = eNum([1.00, .55, .70, .22, .38, .26]);   // couverture boisée

    /* ================= rendu ================= */
    c.save();
    c.beginPath(); c.rect(0, 0, W, solY); c.clip();        // garde-fou : rien ne passe sous le sol
    c.lineJoin = "round"; c.lineCap = "round";

    /* ---- plan 0 : massif lointain, roche et névés ---- */
    const P0 = PLANE[0], d0 = P0.d;
    skyline(P0); paint(rock, d0); c.fill();
    c.save(); skyline(P0); c.clip();
    c.beginPath(); c.moveTo(P0.x0, -B);
    for (let x = P0.x0; x <= P0.x1; x += STEP * 1.4)
      c.lineTo(x, solY - B * .62 + fbm(x / W * 9 + 2.7, 61, 3) * B * .22 - B * .06);
    c.lineTo(P0.x1, -B); c.closePath();
    paint([238, 242, 248], d0, .92); c.fill();             // névés : bord bas dentelé par le bruit
    c.beginPath(); c.moveTo(P0.x0, solY);                  // versants ouest à l'ombre
    for (let x = P0.x0; x <= P0.x1; x += STEP) c.lineTo(x, P0.y(x - B * .10) + B * .04);
    c.lineTo(P0.x1, solY); c.closePath();
    paint([rock[0] * .70, rock[1] * .74, rock[2] * .82], d0, .5); c.fill();
    c.restore();
    rockCrest(P0, W * .18, W * .46, B * .16, d0, 900);
    veil(solY - B * 1.15, .30);

    /* ---- plan 1 : contreforts, arête vive ---- */
    const P1 = PLANE[1], d1 = P1.d;
    skyline(P1); paint(mx(rock, leaf, .45), d1); c.fill();
    rimLight(P1, d1, B * .035, mx(rock, [255, 246, 216], .30));
    rockCrest(P1, W * .52, W * .88, B * .13, d1, 1300);
    if (woods > .1) treeLine(P1, P1.x0, P1.x1, B * .050, gap * .9, spike,
                             mx(leaf2, skyC, .30), mx(leaf, skyC, .34), d1, 1500, woods * .9);
    veil(solY - B * .74, .24);

    /* ---- plan 2 : coteaux, cultures et silhouettes d'époque ---- */
    const P2 = PLANE[2], d2 = P2.d;
    skyline(P2); paint(mx(leaf, rock, .22), d2); c.fill();
    if (fields > .02){
      c.save(); skyline(P2); c.clip();
      const nb = Math.round(lp(14, 5, eNum([0, .3, 0, .4, 1, .8])));
      for (let i = 0; i < nb; i++){
        const tk = al(2200 + i * 3);
        strip(P2, W * (i / nb) - 4 * E, W * ((i + 1) / nb) + 4 * E, B * .045, B * .30,
              mx(soil, leaf, .25 + tk * .55), d2, fields * .55, B * .03 * (tk - .5));
      }
      c.restore();
    }
    rimLight(P2, d2, B * .026, mx(leaf, [255, 246, 205], .30));
    if (woods > .1) treeLine(P2, P2.x0, P2.x1, B * .062, gap, spike,
                             mx(leaf2, skyC, .16), mx(leaf, skyC, .22), d2, 1800, woods);
    grove(P2, W * .70, B * .050, spike, mx(leaf2, skyC, .18), mx(leaf, skyC, .24), d2, 2050);

    /* -- clocher lointain (moyen âge) -- */
    if (eraW[2] > .004){
      c.save(); c.globalAlpha = eraW[2];
      const x = W * .30, y = P2.y(x) + B * .02, s = B * .085;
      paint([180, 170, 152], d2);
      c.fillRect(x - s * .9, y - s * .55, s * 1.8, s * .55);
      c.fillRect(x + s * .55, y - s * 1.5, s * .42, s * 1.5);
      c.beginPath(); c.moveTo(x + s * .48, y - s * 1.5); c.lineTo(x + s * .76, y - s * 2.15);
      c.lineTo(x + s * 1.04, y - s * 1.5); c.closePath(); c.fill();
      paint([140, 118, 100], d2);
      c.beginPath(); c.moveTo(x - s * 1.0, y - s * .55); c.lineTo(x, y - s * .92);
      c.lineTo(x + s * .55, y - s * .55); c.closePath(); c.fill();
      for (let i = 0; i < 5; i++){                         // hameau serré autour de l'église
        const hx = x + (al(4100 + i) - .5) * s * 6, hw = s * (.3 + al(4110 + i) * .25);
        const hy = P2.y(hx) + B * .03;
        paint([172, 160, 142], d2); c.fillRect(hx - hw, hy - hw * .8, hw * 2, hw * .8);
        paint([132, 106, 88], d2);
        c.beginPath(); c.moveTo(hx - hw * 1.15, hy - hw * .8); c.lineTo(hx, hy - hw * 1.35);
        c.lineTo(hx + hw * 1.15, hy - hw * .8); c.closePath(); c.fill();
      }
      c.restore();
    }

    /* -- terrils et cheminées (industrie) -- */
    if (eraW[3] > .004){
      c.save(); c.globalAlpha = eraW[3];
      for (let i = 0; i < 2; i++){
        const x = W * (.16 + i * .55), s = B * (.30 + i * .10), y = P2.y(x) + B * .02;
        c.beginPath(); c.moveTo(x - s * .62, y); c.lineTo(x - s * .11, y - s);
        c.lineTo(x + s * .11, y - s); c.lineTo(x + s * .62, y); c.closePath();
        paint([62, 54, 50], d2, .95); c.fill();            // terril : cône raide à sommet tronqué
        c.beginPath(); c.moveTo(x - s * .11, y - s); c.lineTo(x + s * .11, y - s);
        c.lineTo(x + s * .62, y); c.lineTo(x + s * .18, y); c.closePath();
        paint([88, 78, 70], d2, .9); c.fill();
      }
      for (let i = 0; i < 4; i++){
        const x = W * (.36 + i * .13), hg = B * (.20 + al(4300 + i) * .16);
        const y = P2.y(x) + B * .02, wd = B * .016;
        paint([104, 84, 74], d2);
        c.beginPath(); c.moveTo(x - wd, y); c.lineTo(x - wd * .55, y - hg);
        c.lineTo(x + wd * .55, y - hg); c.lineTo(x + wd, y); c.closePath(); c.fill();
        for (let k = 0; k < 12; k++){                      // panache : dérive lente, phase par index
          const u = k / 12, dr = Math.sin(t * .06 + i * 1.7 + k * .5) * B * .02;
          paint([150, 142, 132], d2 * .8, (1 - u) * .30);
          c.beginPath();
          c.ellipse(x + dr + u * B * .16, y - hg - u * B * .34,
                    B * (.018 + u * .075), B * (.014 + u * .055), 0, 0, 6.283);
          c.fill();
        }
      }
      c.restore();
    }

    /* -- mégastructures d'horizon (cité future) -- */
    if (eraW[5] > .004){
      c.save(); c.globalAlpha = eraW[5];
      // arc orbital : posé très loin, il donne l'échelle des tours
      c.beginPath();
      c.arc(W * .5, solY + B * 2.2, B * 2.6, Math.PI * 1.16, Math.PI * 1.84);
      ink([150, 170, 210], .92, .30); c.lineWidth = Math.max(1, B * .012); c.stroke();
      for (let i = 0; i < 9; i++){
        const x = W * (.04 + al(5000 + i * 3) * .92);
        const hg = B * (.55 + al(5001 + i * 3) * 1.05), wd = B * (.030 + al(5002 + i * 3) * .055);
        const dd = i % 2 ? .86 : .70, y = (i % 2 ? P1 : P2).y(x) + B * .04;
        paint([78, 88, 118], dd);
        c.beginPath(); c.moveTo(x - wd, y); c.lineTo(x - wd * .78, y - hg);
        c.lineTo(x + wd * .78, y - hg); c.lineTo(x + wd, y); c.closePath(); c.fill();
        paint([104, 116, 150], dd, .7);
        c.fillRect(x + wd * .30, y - hg, wd * .5, hg);     // arête éclairée côté droit
        /* Fenêtres : lumière émise, elle ne passe pas par om() qui assombrit la matière. */
        if (night > .05) for (let k = 0; k < 16; k++){
          c.fillStyle = "rgba(180,224,255," + (night * .9 * (.10 + al(5100 + i * 17 + k) * .28)) + ")";
          c.fillRect(x - wd * .6, y - hg * ((k + .5) / 16), wd * 1.2, Math.max(1, hg * .014));
        }
      }
      for (let i = 0; i < 3; i++){                         // arcologies : pyramides à gradins
        const x = W * (.14 + i * .34), s = B * (.34 + al(5200 + i) * .16), y = P2.y(x) + B * .03;
        for (let k = 0; k < 5; k++){
          const u = k / 5, hw = s * (.85 - u * .62), yt = y - s * u * 1.05;
          paint([68, 80, 112], .58, .96);
          c.beginPath(); c.moveTo(x - hw, yt); c.lineTo(x - hw * .84, yt - s * .21);
          c.lineTo(x + hw * .84, yt - s * .21); c.lineTo(x + hw, yt); c.closePath(); c.fill();
          if (night > .05){
            c.fillStyle = "rgba(150,238,214," + (night * .34) + ")";
            c.fillRect(x - hw * .84, yt - s * .215, hw * 1.68, Math.max(1, s * .022));
          }
        }
        paint([92, 106, 140], .58);
        c.beginPath(); c.ellipse(x, y - s * 1.05, s * .24, s * .20, 0, Math.PI, 0); c.fill();
      }
      c.restore();
    }
    veil(solY - B * .48, .18);

    /* ---- plan 3 : collines proches, parcellaire lisible ---- */
    const P3 = PLANE[3], d3 = P3.d;
    skyline(P3); paint(leaf, d3); c.fill();
    c.save(); skyline(P3); c.clip();

    if (fields > .02){
      const nb = Math.round(lp(22, 6, eNum([0, .25, 0, .5, 1, .9])));
      for (let i = 0; i < nb; i++){
        const xa = W * (i / nb) - 3 * E, xb = W * ((i + 1) / nb) + 3 * E;
        const tk = al(2400 + i * 3), tk2 = al(2401 + i * 3);
        strip(P3, xa, xb, B * .030 + B * .02 * tk2, B * .26,
              mx(soil, leaf, .18 + tk * .62), d3, fields * .62, B * .022 * (tk2 - .5));
        // haie de bocage : le trait qui descend la pente fait lire le parcellaire
        if (tk2 > .35 && eraW[2] + eraW[1] > .1){
          c.beginPath();
          c.moveTo(xb, P3.y(xb) + B * .03);
          c.lineTo(xb + B * .022 * (tk2 - .5), P3.y(xb) + B * .26);
          ink(leaf2, d3, (eraW[1] * .5 + eraW[2]) * .55);
          c.lineWidth = Math.max(1, B * .012); c.stroke();
        }
      }
    }

    /* -- terrasses de pierre (antiquité) -- */
    if (eraW[1] > .004){
      c.save(); c.globalAlpha = eraW[1];
      for (let k = 0; k < 6; k++){
        const dTop = B * (.03 + k * .042);
        strip(P3, W * .04, W * .70, dTop, dTop + B * .038, mx(soil, leaf, .30 + k * .06), d3, .8);
        c.beginPath(); c.moveTo(W * .04, P3.y(W * .04) + dTop);
        edge(P3, W * .04, W * .70, dTop, dTop, 1);
        ink([210, 198, 170], d3, .55); c.lineWidth = Math.max(1, B * .009); c.stroke();
      }
      c.restore();
    }

    /* -- autoroute (moderne) -- */
    if (eraW[4] > .004){
      c.save(); c.globalAlpha = eraW[4];
      strip(P3, P3.x0, P3.x1, B * .150, B * .186, [96, 98, 104], d3, .95, B * .03);
      c.beginPath(); c.moveTo(P3.x0, P3.y(P3.x0) + B * .168);
      edge(P3, P3.x0, P3.x1, B * .168, B * .198, 1);
      ink([206, 206, 200], d3, .55); c.lineWidth = Math.max(1, B * .005);
      c.setLineDash([B * .05, B * .05]); c.stroke(); c.setLineDash([]);
      if (night > .04) for (let i = 0; i < 26; i++){       // phares : lumière émise, hors om()
        const dir = i % 2 ? 1 : -1;
        const u = ((al(5400 + i) + t * .008 * dir) % 1 + 1) % 1;
        const x = lp(P3.x0, P3.x1, u);
        c.fillStyle = dir > 0 ? "rgba(255,238,190," + (night * .8) + ")"
                              : "rgba(255,110,90," + (night * .7) + ")";
        c.beginPath();
        c.ellipse(x, P3.y(x) + B * (dir > 0 ? .158 : .180), B * .010, B * .006, 0, 0, 6.283);
        c.fill();
      }
      c.restore();
    }

    trail(P3, W * .58, B * .020, mx(soil, [220, 210, 180], eNum([.1, .5, .4, .2, .6, .3])), d3, 3100);
    c.restore();

    rimLight(P3, d3, B * .022, mx(leaf, [255, 244, 200], .32));
    if (woods > .05) treeLine(P3, P3.x0, P3.x1, B * .080, gap * 1.05, spike,
                              leaf2, mx(leaf, [200, 210, 150], .22), d3, 2600, woods);
    grove(P3, W * .22, B * .062, spike, leaf2, mx(leaf, [190, 205, 140], .25), d3, 2800);

    /* -- pylônes (moderne) : la ligne fuit vers la droite -- */
    if (eraW[4] > .004){
      c.save(); c.globalAlpha = eraW[4];
      for (let i = 0; i < 6; i++){
        const u = i / 5, x = W * (.08 + u * .84);
        const s = B * lp(.20, .085, u), y = P3.y(x) + B * .04;
        ink([116, 122, 128], lp(d3, d2, u * .6), .9);
        c.lineWidth = Math.max(1, s * .05);
        c.beginPath();
        c.moveTo(x - s * .22, y);       c.lineTo(x - s * .07, y - s);
        c.moveTo(x + s * .22, y);       c.lineTo(x + s * .07, y - s);
        c.moveTo(x - s * .30, y - s * .60); c.lineTo(x + s * .30, y - s * .60);
        c.moveTo(x - s * .24, y - s * .82); c.lineTo(x + s * .24, y - s * .82);
        c.moveTo(x - s * .13, y - s * .30); c.lineTo(x + s * .13, y - s * .44);
        c.moveTo(x + s * .13, y - s * .30); c.lineTo(x - s * .13, y - s * .44);
        c.stroke();
        if (i < 5){                                        // caténaires : la flèche dit la portée
          const u2 = (i + 1) / 5, x2 = W * (.08 + u2 * .84);
          const s2 = B * lp(.20, .085, u2), y2 = P3.y(x2) + B * .04;
          ink([116, 122, 128], lp(d3, d2, u * .6), .55);
          c.lineWidth = Math.max(1, s * .022);
          for (let ln = -1; ln <= 1; ln++){
            const oy = ln * s * .22;
            c.beginPath(); c.moveTo(x + s * .28, y - s * .60 + oy);
            c.quadraticCurveTo((x + x2) * .5, (y + y2) * .5 - s * .10 + oy,
                               x2 - s2 * .28, y2 - s2 * .60 + oy * (s2 / s));
            c.stroke();
          }
        }
      }
      c.restore();
    }
    veil(solY - B * .24, .10);

    /* ---- plan 4 : ourlet de terrain au ras du sol ---- */
    const P4 = PLANE[4], d4 = P4.d;
    skyline(P4); paint(mx(leaf2, leaf, .35), d4); c.fill();
    c.save(); skyline(P4); c.clip();
    // touffes basses : sans elles la lisière flotte au-dessus d'un aplat
    for (let i = 0; i < 90; i++){
      const x = P4.x0 + (P4.x1 - P4.x0) * al(3600 + i * 2);
      const y = P4.y(x) + B * (.02 + al(3601 + i * 2) * .10);
      const r = B * (.008 + al(3602 + i * 2) * .016);
      paint(i % 3 ? leaf2 : leaf, d4, .5);
      c.beginPath(); c.ellipse(x, y, r * 1.7, r, 0, 0, 6.283); c.fill();
    }
    c.restore();
    rimLight(P4, d4, B * .016, mx(leaf, [255, 240, 190], .28));
    if (woods > .05) treeLine(P4, P4.x0, P4.x1, B * .105, gap * 1.25, spike,
                              [leaf2[0] * .78, leaf2[1] * .82, leaf2[2] * .80],
                              mx(leaf2, leaf, .55), d4, 3400, woods);

    c.restore();
  }

  // Sol du village : bande solY..Hh seule, matiere par epoque, herbe brin a brin.
  // Lumiere admise en haut-droite (facettes claires a droite, ombres a gauche).

  function paysageSol(c, W, Hh, solY, ee, nuit, t, E, om, al){
    const D = Hh - solY;
    if (!(D > 4) || !(W > 4)) return;

    const cl  = (x, a, b) => (x < a ? a : (x > b ? b : x));
    const lrp = (a, b, k) => a + (b - a) * k;
