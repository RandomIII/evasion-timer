<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compte a rebours d'evasion</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}</style></head><body>
<title>Compte à rebours d'évasion</title>
<meta name="theme-color" content="#04050A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Évasion">
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%2304050A"/><circle cx="32" cy="32" r="21" fill="none" stroke="%2300E5FF" stroke-width="6"/><path d="M32 32V18M32 32l11 6" stroke="%23E6ECF7" stroke-width="5" stroke-linecap="round"/></svg>'>
<link rel="manifest" href='data:application/manifest+json,{"name":"Compte à rebours d évasion","short_name":"Évasion","display":"standalone","orientation":"any","background_color":"%2304050A","theme_color":"%2304050A","start_url":".","icons":[{"src":"data:image/svg%2Bxml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27><rect width=%2764%27 height=%2764%27 fill=%27%2304050A%27/><circle cx=%2732%27 cy=%2732%27 r=%2721%27 fill=%27none%27 stroke=%27%2300E5FF%27 stroke-width=%276%27/></svg>","sizes":"any","type":"image/svg+xml","purpose":"any"}]}'>
<style>
  :root{
    --void:#04050A;
    --cyan:#00E5FF;
    --magenta:#FF2D78;
    --amber:#FFB020;
    --ink:#E6ECF7;
    --dim:#5C6784;
    --glow: var(--cyan);
    --u: clamp(24px, 7.4vw, 84px);
    --dh: calc(var(--u) * 1.62);
    --dw: calc(var(--u) * 0.98);
    --t:  calc(var(--u) * 0.155);
    --mono: "Consolas","SF Mono",ui-monospace,"DejaVu Sans Mono",monospace;
    --cond: "Haettenschweiler","Arial Narrow","Impact","Segoe UI",sans-serif;
    --ui: "Segoe UI",system-ui,sans-serif;
  }

  html,body{height:100%;}
  body{
    margin:0;background:var(--void);color:var(--ink);
    font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  #warp{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(2,3,8,.75) 78%, #02030899 100%);
  }
  .scan{
    position:fixed;inset:0;pointer-events:none;opacity:.22;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.055) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  /* voile RGB : n'apparaît qu'au RAINBOW, faible opacité, défile très vite */
  .rgbVeil{
    position:fixed;inset:0;pointer-events:none;z-index:36;opacity:0;
    mix-blend-mode:screen;transition:opacity .3s;
    background:repeating-linear-gradient(90deg,
      #FF0000 0px,#FF8000 40px,#FFE000 80px,#00FF00 120px,#00FFFF 160px,
      #3300FF 200px,#B400FF 240px,#FF0080 280px,#FF0000 320px);
  }
  body.monde-neon.arc .rgbVeil{opacity:.14;animation:rgbSlide .5s linear infinite;}
  @keyframes rgbSlide{from{background-position:0 0}to{background-position:320px 0}}

  .stage{
    position:relative;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2vh,24px);padding:clamp(14px,2.6vh,34px) 18px;box-sizing:border-box;
  }

  /* ---------- étiquettes ---------- */
  .eyebrow{
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.4em;
    font-size:clamp(11px,1.5vw,15px);color:var(--dim);
    display:flex;align-items:center;gap:.9em;text-align:center;
    margin-bottom:clamp(12px,3vh,40px);        /* respirer entre le texte et l'heure */
  }
  .eyebrow b{color:var(--glow);font-weight:400;text-shadow:0 0 14px var(--glow);}
  .dot{
    width:7px;height:7px;background:var(--glow);border-radius:50%;
    box-shadow:0 0 12px var(--glow);animation:pulse 1s steps(2,end) infinite;
  }
  @keyframes pulse{0%,49%{opacity:1}50%,100%{opacity:.15}}

  /* ---------- afficheur 7 segments ---------- */
  .readout{display:flex;align-items:flex-start;gap:calc(var(--u)*.30);}
  .grp{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.20);}
  .digits{display:flex;gap:calc(var(--u)*.14);}
  .cap{font-family:var(--cond);text-transform:uppercase;letter-spacing:.32em;
       font-size:clamp(9px,1.1vw,13px);color:var(--dim);}
  .colon{position:relative;width:calc(var(--u)*.30);height:var(--dh);
         animation:blink 1s steps(2,end) infinite;}
  .colon i{position:absolute;left:12%;width:76%;aspect-ratio:1;border-radius:2px;
           background:var(--glow);box-shadow:0 0 calc(var(--u)*.30) var(--glow);}
  .colon i:first-child{top:28%}
  .colon i:last-child{top:60%}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}

  .d7{position:relative;width:var(--dw);height:var(--dh);}
  .d7 s{position:absolute;display:block;background:var(--glow);
        opacity:.055;transition:opacity .07s linear, box-shadow .07s linear;}
  .d7 s.on{opacity:1;box-shadow:0 0 calc(var(--u)*.34) color-mix(in srgb, var(--glow) 70%, transparent);}
  .d7 .h{left:var(--t);width:calc(var(--dw) - var(--t)*2);height:var(--t);
         clip-path:polygon(0 50%,14% 0,86% 0,100% 50%,86% 100%,14% 100%);}
  .d7 .v{width:var(--t);height:calc(var(--dh)/2 - var(--t)*1.5);
         clip-path:polygon(50% 0,100% 14%,100% 86%,50% 100%,0 86%,0 14%);}
  .d7 .a{top:0}
  .d7 .g{left:var(--t);width:calc(var(--dw) - var(--t)*2);height:var(--t);
         top:calc(var(--dh)/2 - var(--t)/2);
         clip-path:polygon(0 50%,10% 0,90% 0,100% 50%,90% 100%,10% 100%);}
  .d7 .d{bottom:0}
  .d7 .b{right:0;top:var(--t)}
  .d7 .c{right:0;top:calc(var(--dh)/2 + var(--t)*.5)}
  .d7 .f{left:0;top:var(--t)}
  .d7 .e{left:0;top:calc(var(--dh)/2 + var(--t)*.5)}

  /* ---------- sous-secondes ---------- */
  .sub{display:flex;align-items:baseline;gap:1.1ch;
       font-family:var(--mono);font-variant-numeric:tabular-nums;
       font-size:clamp(18px,3.8vw,44px);letter-spacing:.02em;}
  .ms{color:var(--glow);text-shadow:0 0 26px color-mix(in srgb,var(--glow) 60%,transparent);}
  .us{color:var(--magenta);opacity:.85;filter:blur(.35px);
      text-shadow:0 0 22px color-mix(in srgb,var(--magenta) 55%,transparent);}
  .sub small{font-family:var(--cond);letter-spacing:.3em;
             font-size:clamp(9px,1.1vw,12px);color:var(--dim);}

  /* ---------- frise de journée ---------- */
  .day{width:min(880px,92vw);display:flex;flex-direction:column;gap:6px;}
  .track{height:14px;background:#0D1220;border:1px solid #18203A;position:relative;overflow:hidden;}
  .band{                                   /* zone déjeuner, par-dessus le remplissage */
    position:absolute;top:0;bottom:0;z-index:2;
    background:repeating-linear-gradient(115deg,rgba(12,6,2,.62) 0 7px,rgba(255,138,61,.34) 7px 15px);
    border-left:1px solid rgba(255,138,61,.75);border-right:1px solid rgba(255,138,61,.75);
  }
  .fill{
    position:absolute;top:0;bottom:0;left:0;z-index:1;
    background:linear-gradient(90deg,color-mix(in srgb,var(--glow) 30%,#0D1220),var(--glow));
    box-shadow:0 0 22px color-mix(in srgb,var(--glow) 45%,transparent);
    transition:width .12s linear;
  }
  .cursor{position:absolute;top:-4px;bottom:-4px;width:3px;z-index:3;background:var(--ink);
          box-shadow:0 0 12px var(--ink);transition:left .12s linear;}
  /* étiquettes calées sur leur vraie abscisse dans la frise, pas réparties à l'aveugle */
  .ticks{position:relative;height:15px;
         font-family:var(--mono);font-size:11px;color:var(--dim);}
  .ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;}
  .ticks span:first-child{left:0;transform:none;}
  .ticks span:last-child{left:100%;transform:translateX(-100%);}
  .ticks .repas{color:#FF8A3D;}

  /* ---------- télémétrie ---------- */
  .telemetry{
    width:min(880px,92vw);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:1px;background:#141B2E;border:1px solid #141B2E;
  }
  .cell{background:#070A13;padding:8px 12px;display:flex;flex-direction:column;gap:4px;}
  .cell .k{font-family:var(--cond);text-transform:uppercase;letter-spacing:.22em;font-size:10px;color:var(--dim);}
  .cell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink);}

  /* ---------- champs et boutons (réutilisés dans le menu) ---------- */
  input[type=time]{font-family:var(--mono);font-size:16px;color:var(--ink);
                   background:#070A13;border:1px solid #222C4A;padding:8px 11px;color-scheme:dark;}
  input[type=time]:focus-visible,button:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  button{font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;font-size:13px;
         color:var(--ink);background:#070A13;border:1px solid #222C4A;padding:10px 13px;cursor:pointer;
         transition:background .12s,border-color .12s,color .12s;}
  button:hover{background:#0F1626;border-color:var(--glow);color:var(--glow);}
  button[aria-pressed=true]{background:var(--glow);color:var(--void);border-color:var(--glow);}

  /* ---------- bouton ☰ et panneau de réglages ---------- */
  .menuBtn{
    position:fixed;z-index:40;
    top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;
    padding:11px;background:rgba(7,10,19,.7);border:1px solid #222C4A;cursor:pointer;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .menuBtn span{display:block;height:2px;width:100%;background:var(--ink);
                transition:transform .25s,opacity .25s,background .12s;transform-origin:center;}
  .menuBtn:hover{border-color:var(--glow);}
  .menuBtn:hover span{background:var(--glow);}
  .menuBtn:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  .menuBtn[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .menuBtn[aria-expanded=true] span:nth-child(2){opacity:0;}
  .menuBtn[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  .backdrop{
    position:fixed;inset:0;z-index:38;background:rgba(2,3,8,.6);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;
  }
  .panel{
    position:fixed;z-index:39;top:0;right:0;height:100dvh;width:min(340px,86vw);
    background:linear-gradient(#0A0E1A,#070A13);border-left:1px solid #222C4A;
    padding:calc(72px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px;overflow-y:auto;
    box-shadow:-24px 0 60px rgba(0,0,0,.55);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  body.menu-open .panel{transform:none;}
  body.menu-open .backdrop{opacity:1;visibility:visible;}
  .panel h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.3em;
            font-size:14px;color:var(--glow);margin:0;text-shadow:0 0 20px var(--glow);}
  .panel label{display:flex;flex-direction:column;gap:5px;
               font-family:var(--cond);text-transform:uppercase;letter-spacing:.16em;
               font-size:11px;color:var(--dim);}
  .panel label input[type=time]{width:100%;font-size:18px;}
  /* interrupteur de la pause */
  .panel label.switch{flex-direction:row;align-items:center;gap:10px;cursor:pointer;
                      color:var(--ink);font-size:12px;}
  .panel label.switch input{width:18px;height:18px;accent-color:var(--glow);cursor:pointer;margin:0;}
  #pauseFields{display:flex;flex-direction:column;gap:14px;transition:opacity .2s;}
  #pauseFields.off{opacity:.35;}                 /* grisé quand la pause est désactivée */
  #pauseFields.off input{pointer-events:none;}
  .panelRow{display:flex;gap:8px;}
  .panelRow button{flex:1;}
  .panel .reset{margin-top:4px;font-size:11px;letter-spacing:.08em;line-height:1.5;}

  /* ---------- états ---------- */
  /* paliers : 1h jaune · 15 min orange · 5 min rouge · 1 min violet · 10 s arc-en-ciel */
  body.jaune{--glow:#FFE34A;--magenta:#FFC24A;}
  body.orange{--glow:#FF9A1F;--magenta:#FFB86A;}
  body.rouge{--glow:#FF3B2F;--magenta:#FF8A6A;}
  body.monde-neon.rouge .stage{animation:shake .09s infinite;}
  body.violet{--glow:#B14DFF;--magenta:#F06BFF;}
  body.monde-neon.violet .stage{animation:shakeFast .05s infinite;}

  /* --glow enregistrée comme couleur : sans ça, une custom property s'anime par à-coups
     au lieu de s'interpoler entre les 8 teintes. */
  @property --glow{ syntax:"<color>"; inherits:true; initial-value:#00E5FF; }

  body.monde-neon.arc{--glow:#FF0000;--magenta:#FF0000;}
  body.monde-neon.arc .stage{animation:shakeWild .07s infinite;}
  /* vague RGB façon clavier gamer : même cycle, décalé bloc par bloc de gauche à droite */
  body.monde-neon.arc .eyebrow, body.monde-neon.arc .sub, body.monde-neon.arc .day,
  body.monde-neon.arc .telemetry,
  body.monde-neon.arc .readout .d7, body.monde-neon.arc .readout .colon{
    animation:arcCycle 1.15s linear infinite;
    animation-delay:calc(var(--w,0) * -.05s);
  }
  body.monde-neon.arc .us{color:var(--glow);opacity:1;filter:none;}   /* les µs suivent la vague aussi */
  body.arc .eyebrow{--w:0}  body.arc .sub{--w:6}  body.arc .day{--w:9}
  body.arc .telemetry{--w:11}
  /* palette saturée à fond, ordre exact : rouge→orange→jaune→vert→cyan→indigo→violet→rose */
  @keyframes arcCycle{
    0%   {--glow:#FF0000}
    12.5%{--glow:#FF8000}
    25%  {--glow:#FFE000}
    37.5%{--glow:#00FF00}
    50%  {--glow:#00FFFF}
    62.5%{--glow:#3300FF}
    75%  {--glow:#B400FF}
    87.5%{--glow:#FF0080}
    100% {--glow:#FF0000}
  }
  @keyframes shakeWild{
    0%  {transform:translate(0,0)       rotate(0deg)}
    14% {transform:translate(-10px,7px)  rotate(-1.1deg)}
    28% {transform:translate(9px,-8px)   rotate(1deg)}
    42% {transform:translate(-7px,-6px)  rotate(1.2deg)}
    57% {transform:translate(10px,8px)   rotate(-.9deg)}
    71% {transform:translate(-9px,4px)   rotate(.8deg)}
    85% {transform:translate(6px,-10px)  rotate(-1.2deg)}
    100%{transform:translate(0,0)       rotate(0deg)}
  }
  @keyframes shake{
    0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}
    50%{transform:translate(-1px,1.5px)}75%{transform:translate(-1.5px,-1px)}
    100%{transform:translate(1px,1px)}
  }
  @keyframes shakeFast{
    0%{transform:translate(0,0) rotate(0deg)}
    20%{transform:translate(6px,-5px) rotate(.3deg)}
    40%{transform:translate(-7px,4px) rotate(-.3deg)}
    60%{transform:translate(5px,6px) rotate(.2deg)}
    80%{transform:translate(-5px,-6px) rotate(-.2deg)}
    100%{transform:translate(0,0) rotate(0deg)}
  }
  body.free{--glow:#3BF07A;}

  /* ---------- pause repas ---------- */
  body.lunch{--glow:#FF8A3D;--magenta:#FFD24A;}
  body.lunch .vignette{
    background:radial-gradient(ellipse at 50% 42%, rgba(255,138,61,.16) 0%, rgba(0,0,0,0) 45%),
               radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(10,4,2,.78) 78%, #0A0402 100%);
  }
  body.lunch .us{filter:none;opacity:.95;}

  .banner{
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.3em;
    font-size:clamp(16px,3.4vw,36px);color:var(--glow);text-shadow:0 0 40px var(--glow);
    height:0;overflow:visible;opacity:0;transition:opacity .3s;white-space:nowrap;
  }
  body.lunch .banner{opacity:1;}

  /* la libération : le mot remplace le compteur, compter ses heures sup serait le contraire du message */
  .libre{
    display:none;font-family:var(--cond);text-transform:uppercase;font-weight:800;
    font-size:clamp(72px,20vw,280px);line-height:.9;letter-spacing:.04em;
    color:var(--glow);text-shadow:0 0 50px var(--glow),0 0 160px var(--glow);
  }
  body.free .libre{display:flex;animation:respire 2.8s ease-in-out infinite;}
  body.free .readout,body.free .sub{display:none;}
  .libre span{animation:tombe .55s cubic-bezier(.2,1.7,.4,1) backwards;}
  .libre span:nth-child(2){animation-delay:.07s}
  .libre span:nth-child(3){animation-delay:.14s}
  .libre span:nth-child(4){animation-delay:.21s}
  .libre span:nth-child(5){animation-delay:.28s}
  @keyframes tombe{from{transform:translateY(-.3em) scale(.75);opacity:0}
                   to{transform:none;opacity:1}}
  @keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

  /* ---------- le hamburger qui se monte ---------- */
  .burger{
    display:none;flex-direction:column-reverse;align-items:center;
    width:clamp(120px,17vw,190px);height:clamp(96px,15vh,150px);justify-content:flex-start;
    filter:drop-shadow(0 10px 26px rgba(255,138,61,.35));
  }
  body.lunch .burger{display:flex;}
  .burger i{display:block;width:100%;animation:plop .5s cubic-bezier(.2,1.5,.4,1) backwards;}
  @keyframes plop{
    from{transform:translateY(-90px) scaleX(.7);opacity:0}
    60%{transform:translateY(4px) scaleX(1.06);opacity:1}
    to{transform:translateY(0) scaleX(1);opacity:1}
  }
  .l-bunb{height:20%;background:linear-gradient(#D89550,#A96A32);
          border-radius:0 0 46% 46% / 0 0 100% 100%;}
  .l-steak{height:17%;background:linear-gradient(#7A4426,#4A2513);border-radius:7px;width:104%;}
  .l-cheese{height:9%;background:linear-gradient(#FFC93C,#EFA415);width:106%;
            clip-path:polygon(0 0,100% 0,100% 55%,88% 100%,72% 55%,52% 100%,34% 55%,16% 100%,0 55%);}
  .l-salad{height:9%;background:#63BE38;width:108%;
           clip-path:polygon(0 0,100% 0,100% 40%,92% 100%,80% 40%,66% 100%,52% 40%,38% 100%,24% 40%,10% 100%,0 40%);}
  .l-tomato{height:9%;background:linear-gradient(#E8452F,#B8261A);border-radius:5px;width:102%;}
  .l-onion{height:6%;background:#F3E6EC;border-radius:5px;width:100%;opacity:.9;}
  .l-bacon{height:8%;background:repeating-linear-gradient(92deg,#C7452B 0 9px,#F0C9B6 9px 13px);
           border-radius:4px;width:104%;}
  .l-bunt{height:34%;background:radial-gradient(circle at 30% 65%,#F3E3C0 0 3px,transparent 3px),
                    radial-gradient(circle at 55% 45%,#F3E3C0 0 3px,transparent 3px),
                    radial-gradient(circle at 72% 70%,#F3E3C0 0 3px,transparent 3px),
                    linear-gradient(#E5A45C,#C07C39);
          border-radius:50% 50% 14% 14% / 100% 100% 22% 22%;}

  /* ---------- verrouillage des compétences (masqué tant que non débloqué) ---------- */
  body.lock-min .gM, body.lock-min .cM{display:none;}
  body.lock-sec .gS, body.lock-sec .cS{display:none;}
  body.lock-ms .sub-ms{display:none;}
  body.lock-us .sub-us{display:none;}
  body.lock-stats .telemetry, body.lock-stats .day{display:none;}
  body.lock-bg .vignette, body.lock-bg .scan{display:none;}
  body.lock-lunch .switch, body.lock-lunch #pauseFields{display:none;}
  body.lock-pin .need-pin{display:none;}
  body.lock-son .need-son{display:none;}
  body.lock-full .need-full{display:none;}
  /* RP : dans un masque de plongée il n'y a pas de tableau de bord.
     Les instruments (règle de profondeur, manomètre) remplacent la télémétrie. */
  body.monde-abysses .telemetry,body.monde-abysses .day{display:none;}

  /* ---------- compteur de tokens ---------- */
  .tokBtn{
    position:fixed;z-index:40;
    top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    display:flex;align-items:center;gap:6px;padding:9px 13px;cursor:pointer;
    background:rgba(7,10,19,.7);border:1px solid #222C4A;
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .tokStar{color:var(--glow);text-shadow:0 0 10px var(--glow);}
  .tokBtn:hover{border-color:var(--glow);color:var(--glow);}
  .tokBtn:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  .tokBtn.ready{animation:tokReady 1.1s ease-in-out infinite;}   /* pulse : un achat est possible */
  @keyframes tokReady{0%,100%{box-shadow:0 0 0 rgba(0,229,255,0)}
                      50%{box-shadow:0 0 18px var(--glow);border-color:var(--glow)}}

  /* ---------- instruments de plongée (RP : l'écran est le masque) ---------- */
  .depthRule,.pressGauge,.visorCrack{display:none;}
  body.monde-abysses:not(.lock-prof)  .depthRule,
  body.monde-arbre:not(.lock-prof)    .depthRule{display:block;}
  body.monde-abysses:not(.lock-press) .pressGauge{display:block;}
  /* on monte : l'échelle de l'altimètre se lit de bas en haut */
  body.monde-arbre .dr-cursor::after{border-left-color:var(--glow);}

  /* règle de profondeur, à droite */
  .depthRule{
    position:fixed;z-index:30;pointer-events:none;
    right:calc(22px + env(safe-area-inset-right));top:16vh;height:68vh;width:96px;
    font-family:var(--mono);font-variant-numeric:tabular-nums;
  }
  .dr-axis{position:absolute;right:14px;top:0;bottom:0;width:2px;
           background:linear-gradient(rgba(190,240,255,.7),rgba(190,240,255,.15));}
  .dr-ticks{position:absolute;inset:0;}
  .dr-ticks i{position:absolute;right:14px;height:1px;background:rgba(190,240,255,.45);}
  .dr-ticks i.maj{height:2px;background:rgba(210,248,255,.8);}
  .dr-ticks b{position:absolute;right:26px;transform:translateY(-50%);
              font-size:10px;font-weight:400;color:rgba(198,236,250,.75);
              text-shadow:0 1px 6px rgba(0,18,30,.9);}
  .dr-cursor{
    position:absolute;right:6px;transform:translateY(-50%);
    display:flex;align-items:baseline;gap:2px;padding:3px 7px;
    background:rgba(2,20,32,.86);border:1px solid var(--glow);
    box-shadow:0 0 14px color-mix(in srgb,var(--glow) 55%,transparent);
    transition:top .25s linear;
  }
  .dr-cursor b{font-size:15px;color:var(--glow);font-weight:400;}
  .dr-cursor{white-space:nowrap;}
  body.monde-arbre .dr-cursor i{display:none;}   /* l'unité est déjà dans le libellé */
  .dr-cursor i{font-size:9px;font-style:normal;color:rgba(190,230,245,.8);}
  .dr-cursor::after{                              /* pointe vers l'axe */
    content:"";position:absolute;right:-9px;top:50%;transform:translateY(-50%);
    border:5px solid transparent;border-left-color:var(--glow);
  }

  /* manomètre, en bas à gauche */
  .pressGauge{
    position:fixed;z-index:30;pointer-events:none;
    left:calc(20px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
    width:126px;height:126px;
  }
  .pressGauge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .pg-ring{fill:#0A1C28;stroke:#28596E;stroke-width:3;}
  .pg-face{fill:radial-gradient(#08202E,#04121B);fill:#07202E;stroke:#123443;stroke-width:1;}
  .pg-needle{stroke:#FF6B4A;stroke-width:3;stroke-linecap:round;
             transform-origin:60px 60px;transition:transform .3s ease-out;}
  .pg-hub{fill:#D8E8F0;}
  #pgTicks line{stroke:rgba(190,228,244,.6);stroke-width:1.6;}
  #pgTicks line.maj{stroke:rgba(226,244,255,.95);stroke-width:2.4;}
  .pg-crack{opacity:0;transition:opacity .4s;}
  .pg-crack path{fill:none;stroke:rgba(232,248,255,.85);stroke-width:1.4;stroke-linecap:round;}
  body.pg-fissure .pg-crack{opacity:1;}
  .pg-val{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
    color:#CFEAF6;text-shadow:0 1px 6px rgba(0,18,30,.9);white-space:nowrap;
  }
  .pg-led{
    position:absolute;left:50%;top:30px;transform:translateX(-50%);
    width:11px;height:11px;border-radius:50%;
    background:#2BE07A;box-shadow:0 0 12px #2BE07A;
  }
  body.led-jaune  .pg-led{background:#FFE04A;box-shadow:0 0 12px #FFE04A;}
  body.led-orange .pg-led{background:#FF9A1F;box-shadow:0 0 14px #FF9A1F;animation:ledBlink 1s steps(2,end) infinite;}
  body.led-rouge  .pg-led{background:#FF3B2F;box-shadow:0 0 16px #FF3B2F;animation:ledBlink .45s steps(2,end) infinite;}
  body.led-noire  .pg-led{background:#1A1A1A;box-shadow:inset 0 0 6px #000;animation:none;}
  @keyframes ledBlink{0%,49%{opacity:1}50%,100%{opacity:.12}}

  /* la vitre du casque : dernière minute */
  .visorCrack{
    position:fixed;inset:0;z-index:31;pointer-events:none;
    width:100%;height:100%;opacity:0;transition:opacity .5s;
  }
  .visorCrack path{
    fill:none;stroke:rgba(226,246,255,.6);stroke-width:2;
    filter:drop-shadow(0 0 3px rgba(160,220,255,.55));
  }
  body.monde-abysses.visor-casse .visorCrack{display:block;opacity:1;}

  @media (max-width:720px){
    .depthRule{height:56vh;top:20vh;width:76px;right:8px;}
    .pressGauge{width:96px;height:96px;left:10px;bottom:10px;}
    .pg-led{top:22px;width:9px;height:9px;}
    .pg-val{bottom:18px;font-size:11px;}
  }

  /* ---------- bouton monde (planète) : visible après le 1er prestige ---------- */
  .worldBtn{
    position:fixed;z-index:40;
    top:calc(66px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    width:44px;height:44px;padding:0;font-size:21px;line-height:1;
    background:rgba(7,10,19,.7);border:1px solid #222C4A;cursor:pointer;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .worldBtn:hover{border-color:var(--glow);}
  body:not(.a-prestige) .worldBtn{display:none;}     /* caché tant qu'on n'a pas prestige */

  /* ---------- bouton prestige : visible seulement quand tout est acheté ---------- */
  .prestigeBtn{
    display:none;margin:26px auto 0;padding:14px 22px;
    font-size:14px;letter-spacing:.22em;
    color:#F0D9FF;background:linear-gradient(#3B1060,#25073F);
    border:1px solid #B14DFF;box-shadow:0 0 26px rgba(177,77,255,.5);
    animation:prestigePulse 1.6s ease-in-out infinite;
  }
  .prestigeBtn:hover{background:linear-gradient(#54178A,#360A5C);color:#fff;border-color:#D89BFF;}
  body.peut-prestige .prestigeBtn{display:block;}
  @keyframes prestigePulse{
    0%,100%{box-shadow:0 0 18px rgba(177,77,255,.35)}
    50%    {box-shadow:0 0 40px rgba(177,77,255,.75)}
  }

  /* ---------- thème du monde des abysses ---------- */
  body.monde-abysses{--void:#02121C;--ink:#E8F7FF;--dim:#5E8598;--glow:#35D6E8;}
  body.monde-abysses .cell{background:rgba(3,20,32,.72);}
  body.monde-abysses .telemetry{background:#16455C;border-color:#16455C;}
  body.monde-abysses .track{background:rgba(3,20,32,.6);border-color:#1C5B78;}
  body.monde-abysses .menuBtn,body.monde-abysses .tokBtn,body.monde-abysses .worldBtn{
    background:rgba(3,20,32,.66);border-color:#1C5B78;
  }
  /* paliers = remontée vers la lumière, pas escalade du danger */
  body.monde-abysses.jaune {--glow:#46D2F2;--magenta:#8FE2F8;}
  body.monde-abysses.orange{--glow:#5CCDF8;--magenta:#9FE4FA;}
  body.monde-abysses.rouge {--glow:#7CD4FC;--magenta:#B4E9FD;}
  body.monde-abysses.violet{--glow:#A2E2FF;--magenta:#CDF1FF;}
  /* dernières secondes dans la fosse : l'afficheur est la seule lumière restante */
  body.monde-abysses.arc{--glow:#D6F4FF;--magenta:#EAFAFF;}
  body.monde-abysses .libre{color:#EAFBFF;text-shadow:0 0 60px #7FE9F5;}
  /* l'eau claire délave le texte : on le rehausse */
  body.monde-abysses .eyebrow{color:#BFE8F5;text-shadow:0 2px 10px rgba(0,20,34,.9);}
  body.monde-abysses .cap,body.monde-abysses .ticks{color:#AEDDEC;text-shadow:0 1px 8px rgba(0,20,34,.85);}

  /* ---------- thème du monde du Village ---------- */
  body.monde-village{--void:#171009;--ink:#F8F0E2;--dim:#9C8A72;--glow:#F2C36B;}
  body.monde-village .cell{background:rgba(28,20,12,.72);}
  body.monde-village .telemetry,body.monde-village .day{display:none;}
  body.monde-village .cell-fps{display:none;}
  body.monde-village .menuBtn,body.monde-village .tokBtn,body.monde-village .worldBtn{
    background:rgba(28,20,12,.66);border-color:#4A3620;
  }
  body.monde-village .eyebrow{color:#EBD9BE;text-shadow:0 2px 10px rgba(16,10,4,.9);}
  body.monde-village .cap{color:#D9C6A8;text-shadow:0 1px 8px rgba(16,10,4,.85);}
  body.monde-village.jaune {--glow:#FFD45E;--magenta:#FFE9A6;}
  body.monde-village.orange{--glow:#FF9B4F;--magenta:#FFC79A;}
  body.monde-village.rouge {--glow:#FF6B5A;--magenta:#FFB0A2;}
  body.monde-village.violet{--glow:#B08BEA;--magenta:#D8C6F8;}
  body.monde-village.arc   {--glow:#7DE0FF;--magenta:#BFF2FF;}
  body.monde-village .libre{color:#FFF3DC;text-shadow:0 0 60px #FFC46B;}

  /* chronique du village : l'instrument du Monde 4, année et population */
  .chronique{
    display:none;position:fixed;z-index:30;
    left:calc(16px + env(safe-area-inset-left));
    bottom:calc(16px + env(safe-area-inset-bottom));
    padding:9px 14px;background:rgba(24,17,9,.72);border:1px solid var(--glow);
    font-family:var(--mono);line-height:1.3;pointer-events:none;
  }
  body.monde-village:not(.lock-prof) .chronique{display:block;}
  .chronique b{display:block;font-size:19px;font-weight:400;color:var(--glow);
               text-shadow:0 0 14px var(--glow);}
  .chronique span{display:block;font-size:9px;letter-spacing:.22em;
                  text-transform:uppercase;color:rgba(240,222,190,.66);}
  .chronique i{display:block;font-size:11px;font-style:normal;
               color:rgba(240,222,190,.86);}
  @media (max-width:720px){ .chronique{padding:7px 10px;} .chronique b{font-size:16px;} }

  /* ---------- thème du monde de l'Arbre ---------- */
  body.monde-arbre{--void:#0B1410;--ink:#F0F6EC;--dim:#7C8F79;--glow:#8FE08A;}
  body.monde-arbre .cell{background:rgba(10,22,16,.72);}
  body.monde-arbre .telemetry,body.monde-arbre .day{display:none;}
  body.monde-arbre .cell-fps{display:none;}
  body.monde-arbre .menuBtn,body.monde-arbre .tokBtn,body.monde-arbre .worldBtn{
    background:rgba(10,22,16,.66);border-color:#2C4A34;
  }
  body.monde-arbre .eyebrow{color:#CFE6C8;text-shadow:0 2px 10px rgba(4,16,10,.9);}
  body.monde-arbre .cap{color:#BEDCB6;text-shadow:0 1px 8px rgba(4,16,10,.85);}
  body.monde-arbre.jaune {--glow:#FFD45E;--magenta:#FFE9A6;}
  body.monde-arbre.orange{--glow:#FF9B4F;--magenta:#FFC79A;}
  body.monde-arbre.rouge {--glow:#E9739B;--magenta:#F7B2C8;}
  body.monde-arbre.violet{--glow:#8E7BEA;--magenta:#C3B8F6;}
  /* dans l'espace, l'aurore : le compteur passe au vert polaire */
  body.monde-arbre.arc{--glow:#7CF0C0;--magenta:#BFFAE2;}
  body.monde-arbre .libre{color:#FFE9F4;text-shadow:0 0 60px #FF9ECF;}

  /* ---------- arbre de compétences ---------- */
  .tree{
    position:fixed;z-index:41;inset:0;overflow:auto;
    background:linear-gradient(160deg,#080C16,#04050A);
    padding:calc(72px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
    transform:translateY(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  body.tree-open .tree{transform:none;}
  .treeHead{max-width:920px;margin:0 auto 24px;text-align:center;}
  .treeHead h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.32em;
               font-size:20px;color:var(--glow);margin:0 0 8px;text-shadow:0 0 24px var(--glow);}
  .treeSolde{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;color:var(--ink);}
  .treeHint{color:var(--dim);font-size:12px;margin:6px 0 0;}
  /* l'arbre : grille positionnée (5 colonnes, nœuds en 1/3/5), connecteurs SVG dessous */
  #treeBody{position:relative;max-width:720px;min-width:560px;margin:0 auto;padding:0;
            display:grid;grid-template-columns:repeat(5,1fr);
            column-gap:8px;row-gap:48px;justify-items:center;align-items:stretch;}
  .treeLines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;}
  .noeud{position:relative;z-index:2;width:100%;
         display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
         padding:10px 12px;border:1px solid #222C4A;background:#070A13;cursor:pointer;
         transition:border-color .15s,background .15s,opacity .15s;}
  .noeud .n-nom{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;
                font-size:12px;line-height:1.15;color:var(--ink);}
  .noeud .n-cout{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .noeud:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  .noeud.buyable{border-color:var(--glow);box-shadow:0 0 14px rgba(0,229,255,.25);}
  .noeud.buyable .n-cout{color:var(--glow);}
  .noeud.buyable:hover{background:#0F1626;}
  .noeud.pending{opacity:.85;}
  .noeud.pending .n-cout{color:var(--amber);}
  .noeud.locked{opacity:.34;cursor:not-allowed;}
  .noeud.owned{border-color:#2C7A52;background:#0A1A12;cursor:default;}
  .noeud.owned .n-cout{color:#3BF07A;}
  .noeud.owned .n-cout::before{content:"✓ ";}
  .treeClose{display:block;margin:26px auto 0;}

  /* ---------- téléphone en portrait ---------- */
  @media (max-width:720px){
    .tokBtn{font-size:13px;padding:8px 11px;}
    :root{--u:clamp(30px,10.5vw,58px);}
    .stage{
      gap:clamp(8px,1.6vh,16px);
      padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
    }
    .eyebrow{letter-spacing:.26em;font-size:10px;flex-wrap:wrap;justify-content:center;
             max-width:78vw;}                     /* ne pas passer sous le bouton ☰ */
    .sub{font-size:clamp(16px,6.5vw,30px);}
    .telemetry{grid-template-columns:repeat(2,1fr);}
    .cell{padding:7px 10px;}
    .cell .k{font-size:9px;letter-spacing:.18em;}
    .cell .v{font-size:13px;}
    .ticks{font-size:10px;height:14px;}
    .libre{font-size:clamp(56px,21vw,150px);}
    .burger{width:clamp(96px,26vw,140px);height:clamp(78px,12vh,120px);}
    .banner{font-size:clamp(15px,5vw,26px);letter-spacing:.24em;}
  }

  /* ---------- téléphone en paysage : rien que le timer ---------- */
  @media (max-width:960px) and (orientation:landscape){
    :root{--u:clamp(24px,12vh,54px);}            /* dimensionné sur la hauteur, l'écran est bas */
    .stage{gap:clamp(4px,1.4vh,12px);}
    .telemetry,.day,.banner{display:none;}       /* on cache Phase, Travail effectif, la frise… */
    .eyebrow{font-size:10px;letter-spacing:.24em;}
    .sub{font-size:clamp(14px,4.6vh,26px);}
    .libre{font-size:clamp(44px,22vh,150px);}
  }

  @media (prefers-reduced-motion: reduce){
    body.monde-neon.rouge .stage,body.monde-neon.violet .stage,body.monde-neon.arc .stage{animation:none}
    .dot,.colon,.burger i{animation:none}
    body.monde-neon.arc .rgbVeil{animation:none}       /* voile figé plutôt que défilant */
  }
</style>

      { id:"jaune",  nom:"120 m · la canopée",   cout:60,  pre:"bg",     row:6, col:2 },

  MONDES.village = {

    competences: [

      { id:"wake",   nom:"Écran allumé",         cout:30,  pre:"stats",  row:4, col:5 },

      { id:"feu",    nom:"Le grand foyer",       cout:170, pre:"prof",   row:5, col:1 },

      // les âges : chaque palier repousse l'époque atteinte le soir
      { id:"jaune",  nom:"Le Moyen Âge",         cout:60,  pre:"bg",     row:6, col:2 },
      { id:"boat",   nom:"Le convoi",            cout:120, pre:"tresor", row:6, col:3 },
      { id:"pin",    nom:"Épingler au 1er plan", cout:450, pre:"full",   row:6, col:5 },

      { id:"rate2",  nom:"+1 🧱 / min",          cout:300, pre:"feu",    row:7, col:1 },
      { id:"orange", nom:"L'ère industrielle",   cout:120, pre:"jaune",  row:7, col:2 },

      { id:"rouge",  nom:"L'ère moderne",        cout:220, pre:"orange", row:8, col:2 },
      { id:"violet", nom:"La cité de néon",      cout:400, pre:"rouge",  row:9, col:2 },
      { id:"arc",    nom:"LA CITÉ-JARDIN",       cout:800, pre:"violet", row:10, col:2 }
    ]
  };
  const ORDRE_MONDES = ["neon", "abysses", "arbre", "village"];   // ordre de déblocage par prestige
  const TOUS_IDS = [...new Set(ORDRE_MONDES.flatMap(m => MONDES[m].competences.map(c => c.id)))];

  const CLE_JEU = "evasion.jeu";
  function chargeJeu(){
    let o = null;
    try { o = JSON.parse(localStorage.getItem(CLE_JEU)); } catch {}
    // migration : ancienne save à plat { earned, unlocked } → monde « neon »
    if (o && typeof o.earned === "number" && Array.isArray(o.unlocked) && !o.mondes)
      o = { actif:"neon", debloques:["neon"], mondes:{ neon:{ earned:o.earned, unlocked:o.unlocked } } };
    if (!o || !o.mondes) o = { actif:"neon", debloques:["neon"], mondes:{} };
    if (!Array.isArray(o.debloques) || !o.debloques.length) o.debloques = ["neon"];
    for (const id of ORDRE_MONDES){
      const m = o.mondes[id] || (o.mondes[id] = { earned:0, unlocked:[] });
      if (!Array.isArray(m.unlocked)) m.unlocked = [];
      if (typeof m.earned !== "number") m.earned = 0;
      if (!m.unlocked.includes("start")) m.unlocked.push("start");  // racine toujours acquise
    }
    if (!o.debloques.includes(o.actif)) o.actif = "neon";
    return o;
  }
  let save = chargeJeu();
  function sauveJeu(){ try { localStorage.setItem(CLE_JEU, JSON.stringify(save)); } catch {} }

  // raccourcis sur le monde actif
  const MONDE       = () => MONDES[save.actif];
  const COMPETENCES = () => MONDE().competences;
  let jeu           = save.mondes[save.actif];
  const aDebloque = id => jeu.unlocked.includes(id);
  const coutDe = id => (COMPETENCES().find(c => c.id === id) || {}).cout || 0;
  const depense = () => jeu.unlocked.reduce((s, id) => s + coutDe(id), 0);
  const solde = () => Math.max(0, Math.floor(jeu.earned) - depense());
  // chaque porte d'économie ajoute 1/min au revenu de base
  const tauxToken = () => BASE_RATE * (1 + jeu.unlocked.filter(id => id.startsWith("rate")).length);
  // prestige possible quand TOUT le monde actif est acheté
  const toutAchete = () => COMPETENCES().every(c => aDebloque(c.id));
  const mondeSuivant = () => ORDRE_MONDES[ORDRE_MONDES.indexOf(save.actif) + 1];
  /* ============================================================== */

  // Épinglage : l'appli peut être déplacée dans une fenêtre Picture-in-Picture (toujours
  // au premier plan). $ et le canvas doivent alors viser le document/fenêtre qui l'héberge.
  let pipWin = null;
  const hostDoc = () => pipWin ? pipWin.document : document;
  const hostWin = () => pipWin || window;
  const $ = id => hostDoc().getElementById(id);
  const pad = (n, w) => String(n).padStart(w, "0");
  const SEGMAP = {
    0:"abcdef", 1:"bc", 2:"abged", 3:"abgcd", 4:"fgbc",
    5:"afgcd", 6:"afgedc", 7:"abc", 8:"abcdefg", 9:"abfgcd"
  };

  /* --- fabrique d'afficheurs 7 segments --- */
  function buildDigits(host, count){
    const cells = [];
    for (let i = 0; i < count; i++){
      const d = document.createElement("div");
      d.className = "d7";
      const segs = {};
      for (const s of "abcdefg"){
        const el = document.createElement("s");
        el.className = s + " " + ("adg".includes(s) ? "h" : "v");
        d.appendChild(el); segs[s] = el;
      }
      host.appendChild(d);
      cells.push({ segs, last: null });
    }
    return cells;
  }
  function setDigits(cells, value){
    const str = String(value).padStart(cells.length, "0").slice(-cells.length);
    for (let i = 0; i < cells.length; i++){
      if (cells[i].last === str[i]) continue;
      cells[i].last = str[i];
      const on = SEGMAP[str[i]] || "";
      for (const s of "abcdefg") cells[i].segs[s].classList.toggle("on", on.includes(s));
    }
  }
  const H = buildDigits($("dH"), 2), M = buildDigits($("dM"), 2), S = buildDigits($("dS"), 2);

  // rang de chaque élément dans la vague RGB, de gauche à droite (querySelectorAll suit l'ordre du DOM)
  document.querySelectorAll(".readout .d7, .readout .colon")
          .forEach((el, i) => el.style.setProperty("--w", i + 1));

  /* --- horloge microseconde : Date.now() ancré sur performance.now() --- */
  // Horloge : l'heure système locale, relue à CHAQUE frame. Pas d'ancrage figé au
  // démarrage (qui pouvait dériver quand le téléphone se met en veille), pas d'UTC,
  // pas de géoloc : new Date()/Date.now() suivent déjà le fuseau de l'appareil.
  const nowUs = () => {
    const ms = Date.now();                          // vérité : horloge locale (résolution ms)
    const frac = performance.now();                 // sous-milliseconde, pour animer les µs
    return ms * 1000 + Math.floor((frac - Math.floor(frac)) * 1000);
  };

  /* --- jalons de la journée --- */
  let A = null;                       // jalons du jour en cours, en ms

  function anchorsFor(day){
    const mk = ([h, m]) => { const d = new Date(day); d.setHours(h, m, 0, 0); return d.getTime(); };
    return { debut: mk(horaires.debut), dej: mk(horaires.dejeuner),
             rep: mk(horaires.reprise), dep: mk(horaires.depart) };
  }
  function recale(){

    // pas basculer sur demain. Le passage de minuit est géré dans la boucle.
    A = anchorsFor(new Date());

    // clamp au cas où l'utilisateur saisit des horaires dans le désordre.
    const span = Math.max(1, A.dep - A.debut);
    const pos = ms => Math.max(0, Math.min(100, (ms - A.debut) / span * 100)) + "%";
    $("k1").textContent = hhmm(A.debut);
    $("k4").textContent = hhmm(A.dep);
    // sans pause : ni bande hachurée, ni étiquettes de pause
    const vis = horaires.pause ? "" : "none";
    $("band").style.display = $("k2").style.display = $("k3").style.display = vis;
    if (horaires.pause){
      $("band").style.left  = pos(A.dej);
      $("band").style.width = Math.max(0, Math.min(100, (A.rep - A.dej) / span * 100)) + "%";
      $("k2").textContent = hhmm(A.dej); $("k2").style.left = pos(A.dej);
      $("k3").textContent = hhmm(A.rep); $("k3").style.left = pos(A.rep);
    }

  const hhmm = ms => { const d = new Date(ms); return pad(d.getHours(),2) + ":" + pad(d.getMinutes(),2); };
  const duree = ms => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return pad(Math.floor(s / 3600), 1) + "h" + pad(Math.floor(s / 60) % 60, 2);
  };

  let freed = false, lastSecond = -1, phase = "", lastPhase = "", lastAlerte = "", jourAffiche = -1;
  let lastTok = 0, tokSaveT = 0;                 // comptage des tokens

  /* --- son --- */
  let ac = null, soundOn = false;
  function chirp(freq, dur, type = "square", vol = .05){
    if (!soundOn) return;
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  const air = notes => notes.forEach((f, i) => setTimeout(() => chirp(f, .3, "triangle", .07), i * 130));

  /* --- décor : warp la journée, pluie de bouffe à midi --- */
  const cv = $("warp"), ctx = cv.getContext("2d");

  const MENU = ["🍔","🍟","🌭","🍕","🥐","🧀","🥖","☕","🍎","🥗","🍩","🥓"];
  let W = 0, Hh = 0, dpr = 1, stars = [], food = [], bursts = [];

  function resize(){
    const win = hostWin();                          // suit l'appli si elle est épinglée en PiP
    dpr = Math.min(win.devicePixelRatio || 1, 2);
    W = cv.width = win.innerWidth * dpr; Hh = cv.height = win.innerHeight * dpr;
    cv.style.width = win.innerWidth + "px"; cv.style.height = win.innerHeight + "px";
  }
  const seedStar = z => ({ x:(Math.random()-.5)*2, y:(Math.random()-.5)*2,

  const ARCPAL = [[255,0,0],[255,128,0],[255,224,0],[0,255,0],
                  [0,255,255],[51,0,255],[180,0,255],[255,0,128]];
  const arcColor = p => {                       // interpole la palette en boucle, p ∈ ℝ
    const n = ARCPAL.length, f = (((p % 1) + 1) % 1) * n, i = Math.floor(f), t = f - i;
    const a = ARCPAL[i % n], b = ARCPAL[(i + 1) % n];
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];

  const pastilles = {};
  function pastille(hue){
    const k = Math.round(hue / 8) * 8;
    if (pastilles[k]) return pastilles[k];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0,  `hsla(${k},100%,78%,.90)`);
    gr.addColorStop(.3, `hsla(${k},100%,58%,.40)`);
    gr.addColorStop(1,  `hsla(${k},100%,45%,0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return pastilles[k] = c;
  }

    },

    fusee(c, u, glow, t){

      c.fillStyle = '#E4A93A';

  /* ================= MONDE 3 : l'Arbre =================
     La journée est une ASCENSION : une graine germe le matin, l'arbre perce
     l'atmosphère le soir. La caméra suit la cime, donc le tronc défile vers le
     bas. Les paliers d'alerte deviennent les couleurs du ciel, et le grimpeur
     change de moyen de transport à mesure qu'il monte. */
  const ALTITUDES = [                    // palier acheté → altitude atteinte (m)
    { id:"violet", m:420000000 },        // au-delà de l'orbite lunaire
    { id:"rouge",  m:400000 },
    { id:"orange", m:800 },   { id:"jaune", m:120 }
  ];
  const altMax = () => (ALTITUDES.find(z => aDebloque(z.id)) || { m:30 }).m;

  /* Altitude affichée : un palier par étage, interpolé géométriquement. En
     linéaire, la matinée passerait déjà les 100 000 km — le chiffre ne
     raconterait plus ce qu'on voit à l'écran. */
  const PALIERS_ALT = [30, 120, 800, 400000, 384400000, 420000000];
  function altitudeDe(f){
    const i = Math.min(PALIERS_ALT.length - 2, Math.max(0, Math.floor(f)));
    const u = Math.max(0, Math.min(1, f - i));
    return PALIERS_ALT[i] * Math.pow(PALIERS_ALT[i + 1] / PALIERS_ALT[i], u);
  }

  /* Les six étages du voyage, calés sur les mêmes seuils que les paliers de
     couleur : la prairie le matin, le trou noir aux dix dernières secondes. */
  /* Un étage par tranche de 20 % de la journée. Calés sur les seuils d'alerte,
     ils s'entassaient tous dans la dernière heure : on passait la matinée dans
     l'herbe et tout le voyage en quinze minutes. */
  const ETAGES = ["prairie", "ciel", "nuages", "espace", "lune", "trou"];
  /* Trois arrêts par étage : zénith, plein ciel, horizon. Deux seulement
     donnaient une teinte moyenne uniforme, sans la respiration d'un vrai ciel. */
  const CIEL = {
    prairie: { h:[64, 152, 226],  m:[140, 202, 240], b:[218, 240, 202] },
    ciel:    { h:[30, 104, 204],  m:[92, 166, 232],  b:[206, 226, 236] },
    nuages:  { h:[14, 44, 142],   m:[96, 92, 188],   b:[250, 166, 106] },
    espace:  { h:[3, 5, 22],      m:[16, 18, 64],    b:[66, 38, 112]   },
    lune:    { h:[1, 2, 8],       m:[6, 6, 26],      b:[20, 12, 46]    },
    trou:    { h:[0, 0, 0],       m:[3, 1, 11],      b:[12, 3, 24]     }
  };
  function couleurCiel(f, cle){
    const i = Math.min(ETAGES.length - 2, Math.max(0, Math.floor(f))), t = f - i;
    return mix(CIEL[ETAGES[i]][cle], CIEL[ETAGES[i + 1]][cle], Math.max(0, Math.min(1, t)));
  }

  const etoiles = [], nuees = [], feuilles = [], oiseaux = [], petales = [],
        pollen = [], flocons = [];
  /* Phase propre à l'arbre : près du trou noir tout s'emballe. On intègre le
     temps au lieu de multiplier t0, sinon la moindre variation du facteur
     ferait sauter l'animation d'un bout à l'autre de son cycle. */
  let phArbre = 0, tArbrePrec = 0, rushArbre = 1;
  let arbrePret = false, altM = 0;
  function initArbre(){
    if (arbrePret) return;
    arbrePret = true;
    for (let i = 0; i < 130; i++)
      etoiles.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .4,
                     ph: Math.random() * 6.3 });
    for (let i = 0; i < 14; i++)
      nuees.push({ x: Math.random(), y: Math.random(), l: Math.random() * .3 + .18,
                   e: Math.random() * .5 + .5, v: Math.random() * .3 + .1,
                   c: Math.random() });
    for (let i = 0; i < 26; i++)
      feuilles.push({ x: Math.random() * W, y: Math.random() * Hh,
                      r: (Math.random() * 5 + 4), rot: Math.random() * 6.3,
                      vr: (Math.random() - .5) * .05, v: Math.random() * .5 + .3,
                      h: 92 + Math.random() * 46 });
    for (let i = 0; i < 70; i++)
      pollen.push({ x: Math.random() * W, y: Math.random() * Hh,
                    r: Math.random() * 1.5 + .5, v: Math.random() * .5 + .2,
                    ph: Math.random() * 6.3 });
    for (let i = 0; i < 90; i++)
      flocons.push({ x: Math.random() * W, y: Math.random() * Hh,
                     r: Math.random() * 2.2 + .8, v: Math.random() * .9 + .35,
                     ph: Math.random() * 6.3, br: Math.random() < .18 });
    for (let i = 0; i < 8; i++)
      oiseaux.push({ x: Math.random() * W, y: Math.random() * Hh * .7,
                     dir: Math.random() < .5 ? 1 : -1, v: Math.random() * 1.2 + .8,
                     ph: Math.random() * 6.3, t: Math.random() * 5 + 6 });
  }

  /* ---- les saisons ----
     Prises sur la DATE RÉELLE : en octobre l'arbre est roux, en janvier il est nu
     sous la neige. L'appli change donc de visage au fil de l'année, ce qu'aucune
     progression interne ne peut offrir. */
  const SAISONS = {
    printemps: { nom:"printemps",
                 rampe:[0x2b5326, 0x39702f, 0x4f9a3c, 0x6fbf55, 0x9bda78, 0xc4ec9e],
                 densite:.85, fleurs:"#F6B8D0", neige:0 },
    ete:       { nom:"été",
                 rampe:[0x163a20, 0x1e4a28, 0x2f6b36, 0x4c9147, 0x7fbf5c, 0xa8d97a],
                 densite:1, fleurs:null, neige:0 },
    automne:   { nom:"automne",
                 rampe:[0x4a2410, 0x76380f, 0xa55c18, 0xc98526, 0xe0ab3c, 0xf2cd74],
                 densite:.8, fleurs:null, neige:0 },
    hiver:     { nom:"hiver",
                 rampe:[0x2c3a3e, 0x3d5157, 0x536c73, 0x74909a, 0x9db8c0, 0xd8e8ee],
                 densite:.28, fleurs:null, neige:1 }
  };
  function saisonDuJour(){
    const m = new Date().getMonth();             // 0 = janvier
    return m <= 1 || m === 11 ? SAISONS.hiver
         : m <= 4 ? SAISONS.printemps
         : m <= 7 ? SAISONS.ete
         : SAISONS.automne;
  }
  let SAISON = SAISONS.ete;                      // remplacée au démarrage du monde

  /* La toute jeune pousse. Le tronc adulte, avec son écorce et ses branches,
     serait absurde sur quinze pixels : la matinée mérite sa propre silhouette. */
  function dessinePousse(c, E, tx, cimeY, basY, t, nuit){
    const h = Math.max(5 * E, basY - cimeY);
    const flex = Math.sin(t * 1.05) * .12 + Math.sin(t * .43 + 1.3) * .05;
    const som = 1 - nuit * .58;
    const rgb = (r, g, b) => "rgb(" + Math.round(r * som) + "," +
                             Math.round(g * som) + "," + Math.round(b * som) + ")";
    const tige = rgb(104, 158, 66), clair = rgb(142, 208, 92), sombre = rgb(74, 122, 48);
    const ouv = Math.min(1, h / (52 * E));           // les cotylédons s'ouvrent en grandissant
    c.save();
    c.translate(tx, basY);
    c.lineCap = "round"; c.lineJoin = "round";
    c.strokeStyle = tige; c.lineWidth = Math.max(1.4, h * .085);
    c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(h * .16 * flex, -h * .55, h * .26 * flex, -h);
    c.stroke();
    for (const cote of [-1, 1]){
      c.save();
      c.translate(h * .26 * flex, -h);
      c.rotate(cote * (.42 + ouv * .62) + flex * .28);
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(cote * h * .34, -h * .34, cote * h * .70, -h * .05);
      c.quadraticCurveTo(cote * h * .34, h * .13, 0, 0);
      c.closePath();
      c.fillStyle = cote > 0 ? clair : sombre; c.fill();
      c.strokeStyle = sombre; c.lineWidth = Math.max(.7, h * .022); c.stroke();
      c.restore();
    }
    // la gouttelette de rosée attrape la lumière du matin
    if (nuit < .4){
      c.fillStyle = "rgba(255,255,255," + (.5 - nuit) + ")";
      c.beginPath();
      c.arc(h * .26 * flex + h * .2, -h * .92, Math.max(.8, h * .05), 0, 6.283);
      c.fill();
    }
    c.restore();
  }

  /* ---- le système solaire de la libération ----
     Chaque orbite est un cercle incliné, projeté en perspective : le demi-tour
     proche passe devant l'arbre et grossit, le lointain passe derrière et
     rétrécit. Une ellipse symétrique tracée d'un bloc ne pouvait rien dire de
     tout ça — ni les rails ni les planètes n'avaient de profondeur. */
  const PLANETES = [
    { r:0.60, t:6.5,  d:0.046, c:["#C9C4BA", "#6E6A63"] },
    { r:0.92, t:11,   d:0.070, c:["#F2D9A0", "#A8873F"] },
    { r:1.28, t:17,   d:0.074, c:["#7FB6E8", "#1E4C86"], lune:true },
    { r:1.68, t:26,   d:0.061, c:["#E08A5A", "#8C3E20"] },
    { r:2.22, t:44,   d:0.132, c:["#DCBA8E", "#8A6438"], bandes:true },
    { r:2.76, t:66,   d:0.116, c:["#EBD8A6", "#A88C4C"], anneau:true },
    { r:3.20, t:92,   d:0.086, c:["#A8E4E0", "#3C7E86"] },
    { r:3.58, t:124,  d:0.082, c:["#7FA0E8", "#2C3F86"] }
  ];
  const INCL = 1.224;                        // ~70° : le plan vu d'assez haut
  const CI = Math.cos(INCL), SI = Math.sin(INCL);
  const CAM = 9;                             // distance caméra, en rayons d'orbite

  /* Cercle incliné puis projeté. sin(θ) > 0 : le point est du côté caméra, donc
     sous le centre à l'écran et devant l'arbre. */
  function projOrbite(r, th){
    const s = Math.sin(th);
    const z = r * s * SI;
    const k = CAM / (CAM - z);
    return { x: r * Math.cos(th) * k, y: r * s * CI * k, k: k };
  }

  function dessineSysteme(cx, cy, t, E, devant){
    const U = Math.min(W, Hh) * 0.158;
    ctx.save();
    ctx.translate(cx, cy);

    if (!devant){
      // l'arbre est l'astre de ce système : c'est de lui que vient la lumière
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const ag = ctx.createRadialGradient(0, 0, 0, 0, 0, U * 1.3);
      ag.addColorStop(0, "rgba(186,150,255,.34)");
      ag.addColorStop(.4, "rgba(126,96,220,.13)");
      ag.addColorStop(1, "rgba(90,60,180,0)");
      ctx.fillStyle = ag;
      ctx.beginPath(); ctx.arc(0, 0, U * 1.3, 0, 6.2832); ctx.fill();
      ctx.restore();
    }

    // le rail, coupé en deux : moitié lointaine au fond, moitié proche devant
    const N = 40, dep = devant ? 0 : Math.PI;
    for (const pl of PLANETES){
      ctx.beginPath();
      for (let i = 0; i <= N; i++){
        const p = projOrbite(pl.r, dep + Math.PI * (i / N));
        const x = p.x * U, y = p.y * U;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = devant ? "rgba(198,220,255,.34)" : "rgba(112,140,208,.15)";
      ctx.lineWidth = Math.max(1, E * (devant ? 1.5 : 1));
      ctx.stroke();
    }

    for (const pl of PLANETES){
      const th = t * 6.2832 / pl.t + pl.r * 2.7;
      const s = Math.sin(th);
      if ((s > 0) !== devant) continue;
      const p = projOrbite(pl.r, th);
      const rr = pl.d * U * p.k;
      // ce qui s'éloigne perd de l'éclat : c'est la moitié du sentiment de relief
      const lum = 0.50 + 0.50 * Math.max(0, Math.min(1, (p.k - 0.72) / 0.88));
      ctx.save();
      ctx.translate(p.x * U, p.y * U);
      ctx.globalAlpha = 0.55 + lum * 0.45;
      if (pl.anneau){                        // l'anneau passe derrière avant la boule
        ctx.strokeStyle = "rgba(226,208,160,.55)";
        ctx.lineWidth = rr * .30;
        ctx.beginPath(); ctx.ellipse(0, 0, rr * 2.1, rr * .62, -.42, Math.PI, 6.2832); ctx.stroke();
      }
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const hg = ctx.createRadialGradient(0, 0, rr * .8, 0, 0, rr * 2.6);
      hg.addColorStop(0, pl.c[0] + (lum > .8 ? "66" : "33"));
      hg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.arc(0, 0, rr * 2.6, 0, 6.2832); ctx.fill();
      ctx.restore();
      const g = ctx.createRadialGradient(-rr * .34, -rr * .34, rr * .06, 0, 0, rr);
      g.addColorStop(0, pl.c[0]); g.addColorStop(1, pl.c[1]);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.2832); ctx.fill();
      if (pl.bandes){
        ctx.save();
        ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.2832); ctx.clip();
        for (let i = -2; i <= 2; i++){
          ctx.fillStyle = i % 2 ? "rgba(140,98,58,.32)" : "rgba(246,226,190,.26)";
          ctx.fillRect(-rr, i * rr * .34 - rr * .10, rr * 2, rr * .21);
        }
        ctx.restore();
      }
      if (pl.anneau){
        ctx.strokeStyle = "rgba(240,224,180,.8)";
        ctx.lineWidth = rr * .30;
        ctx.beginPath(); ctx.ellipse(0, 0, rr * 2.1, rr * .62, -.42, 0, Math.PI); ctx.stroke();
      }
      if (pl.lune){
        const b = t * 2.4 + pl.r;
        ctx.fillStyle = "#D8D4CC";
        ctx.beginPath();
        ctx.arc(Math.cos(b) * rr * 2.4, Math.sin(b) * rr * 1.1, rr * .30, 0, 6.2832);
        ctx.fill();
      }
      // croissant d'ombre : la lumière vient de l'arbre, au centre
      ctx.globalCompositeOperation = "source-atop";
      const og = ctx.createRadialGradient(-p.x * U * .03, -p.y * U * .03, rr * .2, 0, 0, rr * 1.5);
      og.addColorStop(0, "rgba(0,0,0,0)");
      og.addColorStop(1, "rgba(2,2,10,.55)");
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* Le soleil et ses rais, cuits une fois en 512 px. Vingt-deux secteurs
     dégradés recalculés chaque frame donnaient un éventail découpé au ciseau ;
     une couronne complète en 130 rais ne coûte plus qu'un drawImage. */
  let soleilSprite = null;
  function spriteSoleil(){
    if (soleilSprite) return soleilSprite;
    const S = 512, m = S / 2;
    soleilSprite = document.createElement("canvas");
    soleilSprite.width = soleilSprite.height = S;
    const g = soleilSprite.getContext("2d");
    const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
                       return s - Math.floor(s); };
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 130; i++){
      const a = rnd(i) * 6.2832;
      const L = m * (0.30 + Math.pow(rnd(i + 700), 2.2) * 0.70);
      const e = 0.004 + rnd(i + 1400) * 0.020;
      const al = (0.05 + rnd(i + 2100) * 0.13) * (1 - L / m * 0.45);
      const rg = g.createLinearGradient(m, m, m + Math.cos(a) * L, m + Math.sin(a) * L);
      rg.addColorStop(0,   "rgba(255,248,222," + al.toFixed(3) + ")");
      rg.addColorStop(.35, "rgba(255,240,198," + (al * 0.55).toFixed(3) + ")");
      rg.addColorStop(1,   "rgba(255,228,170,0)");
      g.fillStyle = rg;
      g.beginPath(); g.moveTo(m, m);
      g.lineTo(m + Math.cos(a - e) * L, m + Math.sin(a - e) * L);
      g.lineTo(m + Math.cos(a + e) * L, m + Math.sin(a + e) * L);
      g.closePath(); g.fill();
    }
    // le halo qui noie la base des rais : sans lui, ils partent tous d'un point
    const hg = g.createRadialGradient(m, m, 0, m, m, m * .42);
    hg.addColorStop(0,   "rgba(255,252,238,.55)");
    hg.addColorStop(.34, "rgba(255,242,206,.22)");
    hg.addColorStop(1,   "rgba(255,232,180,0)");
    g.fillStyle = hg; g.fillRect(0, 0, S, S);
    return soleilSprite;
  }

  /* La Lune, cuite une fois en 640 px. À l'écran elle fait parfois 700 px de
     large : redessiner les quatre-vingt-dix cratères à chaque frame coûterait
     tout le budget, et le sprite permet d'y mettre le détail qu'elle mérite. */
  let luneSprite = null;
  function spriteLune(){
    if (luneSprite) return luneSprite;
    const S = 640, m = S / 2, R = S / 2 - 6;
    luneSprite = document.createElement("canvas");
    luneSprite.width = luneSprite.height = S;
    const g = luneSprite.getContext("2d");
    const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
                       return s - Math.floor(s); };
    const LX = -0.42, LY = -0.42;                 // direction de la lumière, normalisée

    g.save();
    g.beginPath(); g.arc(m, m, R, 0, 6.283); g.clip();

    // 1. la sphère : le dégradé part du point éclairé, pas du centre
    const sg = g.createRadialGradient(m + LX * R * .75, m + LY * R * .75, R * .05,
                                      m, m, R * 1.32);
    sg.addColorStop(0,   "#FBF9F1");
    sg.addColorStop(.28, "#E3E1D7");
    sg.addColorStop(.55, "#B4B4B2");
    sg.addColorStop(.78, "#83848C");
    sg.addColorStop(1,   "#4F5160");
    g.fillStyle = sg; g.fillRect(0, 0, S, S);

    // 2. les mers : de larges plaines basaltiques aux côtes irrégulières
    const MERS = [[-.30, -.26, .30], [.06, -.40, .20], [-.46, .10, .22],
                  [.28, -.10, .17], [-.10, .04, .25], [.34, .34, .15],
                  [-.28, .46, .13]];
    for (let q = 0; q < MERS.length; q++){
      const [mx, my, mr] = MERS[q];
      const cx = m + mx * R, cy = m + my * R, rr = mr * R;
      g.beginPath();
      for (let i = 0; i <= 44; i++){
        const a = i / 44 * 6.283;
        const w = 1 + Math.sin(a * 3 + q * 2.1) * .16 + Math.sin(a * 7 + q) * .09
                    + (rnd(q * 100 + i) - .5) * .07;
        const px = cx + Math.cos(a) * rr * w, py = cy + Math.sin(a) * rr * w * .88;
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath();
      const mg = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      mg.addColorStop(0,   "rgba(58,62,78,.62)");
      mg.addColorStop(.72, "rgba(64,68,84,.55)");
      mg.addColorStop(1,   "rgba(80,84,100,.18)");
      g.fillStyle = mg; g.fill();
    }

    // 3. le grain des hautes terres, sinon les plaines claires restent en aplat
    for (let i = 0; i < 2600; i++){
      const a = rnd(i + 5000) * 6.283, d = Math.sqrt(rnd(i + 6000)) * R;
      g.fillStyle = rnd(i + 7000) > .5 ? "rgba(255,255,248,.055)" : "rgba(58,60,74,.07)";
      g.beginPath();
      g.arc(m + Math.cos(a) * d, m + Math.sin(a) * d, rnd(i + 8000) * 2.4 + .5, 0, 6.283);
      g.fill();
    }

    /* 4. les cratères. Un dégradé traversant suffit à creuser la cuvette :
       paroi à l'ombre du côté de la lumière, paroi éclairée en face. */
    function cratere(cx, cy, r, force){
      const dg = g.createLinearGradient(cx + LX * r, cy + LY * r, cx - LX * r, cy - LY * r);
      dg.addColorStop(0,   "rgba(48,50,62," + (.40 * force) + ")");
      dg.addColorStop(.44, "rgba(96,98,110," + (.10 * force) + ")");
      dg.addColorStop(1,   "rgba(255,253,244," + (.34 * force) + ")");
      g.fillStyle = dg;
      g.beginPath(); g.arc(cx, cy, r, 0, 6.283); g.fill();
      // bourrelet : clair du côté du soleil, sombre à l'opposé
      g.lineWidth = Math.max(.7, r * .13);
      g.strokeStyle = "rgba(255,255,248," + (.30 * force) + ")";
      g.beginPath(); g.arc(cx, cy, r * .97, 3.35, 5.65); g.stroke();
      g.strokeStyle = "rgba(44,46,58," + (.26 * force) + ")";
      g.beginPath(); g.arc(cx, cy, r * .97, .25, 2.55); g.stroke();
      if (r > R * .05){                           // pic central des grands cratères
        g.fillStyle = "rgba(226,224,214,.30)";
        g.beginPath(); g.arc(cx - r * .07, cy - r * .07, r * .16, 0, 6.283); g.fill();
      }
    }
    for (let i = 0; i < 130; i++){
      const a = rnd(i) * 6.283, d = Math.sqrt(rnd(i + 40)) * R * .96;
      const cx = m + Math.cos(a) * d, cy = m + Math.sin(a) * d;
      // loi de puissance : beaucoup de petits, quelques grands
      const r = R * (.008 + Math.pow(rnd(i + 80), 3.1) * .085);
      const dansMer = MERS.some(([mx, my, mr]) =>
        Math.hypot(cx - (m + mx * R), cy - (m + my * R)) < mr * R * .9);
      cratere(cx, cy, r, dansMer ? .45 : 1);      // les mers sont jeunes, peu cratérisées
    }

    // 5. les traînées d'éjectas de trois grands cratères récents
    g.globalCompositeOperation = "lighter";
    for (const [rx, ry, rr] of [[-.16, .52, .052], [.44, -.30, .040], [-.54, -.16, .034]]){
      const cx = m + rx * R, cy = m + ry * R, cr = rr * R;
      for (let i = 0; i < 34; i++){
        const a = rnd(i + rx * 900) * 6.283;
        const L = cr * (5 + rnd(i + ry * 900) * 11);
        const rg = g.createLinearGradient(cx, cy, cx + Math.cos(a) * L, cy + Math.sin(a) * L);
        rg.addColorStop(0, "rgba(255,255,250,.10)");
        rg.addColorStop(1, "rgba(255,255,250,0)");
        g.fillStyle = rg;
        const e = .035 + rnd(i + 300) * .03;
        g.beginPath(); g.moveTo(cx, cy);
        g.lineTo(cx + Math.cos(a - e) * L, cy + Math.sin(a - e) * L);
        g.lineTo(cx + Math.cos(a + e) * L, cy + Math.sin(a + e) * L);
        g.closePath(); g.fill();
      }
      cratere(cx, cy, cr, 1);
    }
    g.globalCompositeOperation = "source-over";

    // 6. assombrissement du limbe : c'est lui qui fait basculer le disque en sphère
    const lg = g.createRadialGradient(m, m, R * .58, m, m, R);
    lg.addColorStop(0, "rgba(20,22,34,0)");
    lg.addColorStop(1, "rgba(14,16,28,.60)");
    g.fillStyle = lg; g.fillRect(0, 0, S, S);

    // 7. terminateur : le quart opposé au soleil bascule dans la nuit
    const tg = g.createLinearGradient(m + LX * R, m + LY * R, m - LX * R * 1.5, m - LY * R * 1.5);
    tg.addColorStop(0,   "rgba(0,0,0,0)");
    tg.addColorStop(.52, "rgba(6,8,18,.10)");
    tg.addColorStop(1,   "rgba(4,5,14,.62)");
    g.fillStyle = tg; g.fillRect(0, 0, S, S);
    g.restore();
    return luneSprite;
  }

  /* La galaxie de fond : 5200 étoiles sur deux bras, peintes une seule fois.
     Les recalculer chaque frame coûterait le double du budget de rendu. */
  let galaxie = null;
  function spriteGalaxie(){
    if (galaxie) return galaxie;
    const S = 1600, m = S / 2;
    galaxie = document.createElement("canvas");
    galaxie.width = galaxie.height = S;
    const g = galaxie.getContext("2d");
    const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
                       return s - Math.floor(s); };
    const hg = g.createRadialGradient(m, m, 0, m, m, S * .34);
    hg.addColorStop(0,   "rgba(255,240,205,.90)");
    hg.addColorStop(.14, "rgba(255,206,146,.44)");
    hg.addColorStop(.42, "rgba(176,124,224,.16)");
    hg.addColorStop(1,   "rgba(48,32,120,0)");
    g.fillStyle = hg;
    g.save(); g.translate(m, m); g.scale(1, .42); g.translate(-m, -m);
    g.fillRect(0, 0, S, S); g.restore();
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 5200; i++){
      const bras = i % 2;
      const u = Math.pow(rnd(i), .72);                       // densité vers le cœur
      // dispersion serrée autour du bras : au-delà, la spirale se lit comme un nuage
      const a = u * 5.1 + bras * Math.PI + (rnd(i + 9001) - .5) * (.34 - u * .16);
      const r = (.05 + u * .45) * S * (1 + (rnd(i + 3001) - .5) * .13);
      const x = m + Math.cos(a) * r, y = m + Math.sin(a) * r * .40
                                       + (rnd(i + 5001) - .5) * S * .022;
      const chaud = 1 - u;                                   // le centre est doré, les bras bleus
      const cr = Math.round(190 + 62 * chaud), cg = Math.round(196 + 34 * chaud),
            cb = Math.round(255 - 40 * chaud);
      g.fillStyle = "rgba(" + cr + "," + cg + "," + cb + "," + (.16 + rnd(i + 7001) * .5) + ")";
      g.beginPath(); g.arc(x, y, rnd(i + 11001) * .8 + .22, 0, 6.283); g.fill();
    }
    // une poignée d'étoiles de premier plan, assez vives pour donner l'échelle
    for (let i = 0; i < 120; i++){
      const x = rnd(i + 31001) * S, y = rnd(i + 33001) * S;
      const rr = 1 + rnd(i + 35001) * 1.6;
      const eg = g.createRadialGradient(x, y, 0, x, y, rr * 5);
      eg.addColorStop(0, "rgba(255,255,255,.95)");
      eg.addColorStop(.3, "rgba(210,226,255,.34)");
      eg.addColorStop(1, "rgba(160,190,255,0)");
      g.fillStyle = eg; g.beginPath(); g.arc(x, y, rr * 5, 0, 6.283); g.fill();
    }
    // quelques nébuleuses accrochées aux bras, pour casser l'uniformité
    for (let i = 0; i < 22; i++){
      const a = rnd(i + 21001) * 6.283, r = (.12 + rnd(i + 23001) * .34) * S;
      const x = m + Math.cos(a) * r, y = m + Math.sin(a) * r * .42;
      const rr = S * (.03 + rnd(i + 25001) * .05);
      const teinte = rnd(i + 27001);
      const ng = g.createRadialGradient(x, y, 0, x, y, rr);
      ng.addColorStop(0, "rgba(" + Math.round(120 + teinte * 130) + ",90,"
                       + Math.round(200 + teinte * 55) + ",.20)");
      ng.addColorStop(1, "rgba(80,40,160,0)");
      g.fillStyle = ng; g.beginPath(); g.arc(x, y, rr, 0, 6.283); g.fill();
    }
    return galaxie;
  }

/* ---- l'arbre : tronc cylindrique et ramure qui fourche ----
   La ramure est récursive : chaque branche se divise en deux ou trois, avec un
   angle d'ouverture et un rétrécissement constants. C'est ce qui donne une
   silhouette d'arbre plutôt qu'un mât planté de bras. */
function dessineTronc(c, E, tx, cimeY, basY, t, nuit) {
  const n = Math.min(1, Math.max(0, nuit || 0));
  const H = Math.max(basY - cimeY, 1);
  const alea = (i) => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

  // La nuit tire vers un bleu sombre, jamais vers le noir : la silhouette doit
  // rester lisible au clair de lune.
  const k = 0.6 * n;
  function melange(r, g, b, a) {
    const rr = Math.round(r * (1 - k) + 26 * k), gg = Math.round(g * (1 - k) + 36 * k),
          bb = Math.round(b * (1 - k) + 58 * k);
    return a === undefined ? 'rgb(' + rr + ',' + gg + ',' + bb + ')'
                           : 'rgba(' + rr + ',' + gg + ',' + bb + ',' + a + ')';
  }
  /* Écorce : une seule rampe chaude, échantillonnée par la courbe d'éclairement.
     Des aplats plats donnaient un tronc en carton peint. */
  const RAMPE = [[19, 15, 14], [38, 29, 24], [64, 48, 36], [96, 73, 50],
                 [136, 106, 72], [186, 152, 106]];
  function ecorce(u, a) {                       // u : 0 côté ombre, 1 côté lumière
    const x = Math.max(0, Math.min(1, u)) * (RAMPE.length - 1);
    const i = Math.min(RAMPE.length - 2, Math.floor(x)), f = x - i;
    const A = RAMPE[i], B = RAMPE[i + 1];
    return melange(A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f,
                   A[2] + (B[2] - A[2]) * f, a);
  }
  /* Loi de Lambert sur un cylindre : u traverse le diamètre, la normale y tourne
     d'un quart de tour de chaque côté. Une courbe approchée laissait le bord à
     l'ombre presque aussi clair que le centre — d'où l'effet planche. */
  const PHI = 0.62;                             // lumière venue de la droite
  const cyl = (u) => {
    const th = Math.asin(Math.max(-1, Math.min(1, u * 2 - 1)));
    return 0.13 + 0.87 * Math.max(0, Math.cos(th - PHI));
  };

  // ---- géométrie du fût ----
  const DEMI_BAS = Math.min(96 * E, Math.max(3.5 * E, H * 0.098));
  const DEMI_CIME = Math.max(1.6 * E, DEMI_BAS * 0.15);
  const PAS = 26, PAS_T = 14;          // texture : moitié moins de points, invisible à l'œil
  /* Tout ce qui s'écarte de l'axe se mesure à la hauteur du fût. En absolu, un
     tronc de soixante-dix pixels portait des branches de cent soixante-dix et
     gondolait de quarante-six : l'arbre naissait énorme et tordu. */
  const jeune = Math.min(1, Math.pow(H / (420 * E), 0.75));
  const AMPL = 0.9 * DEMI_BAS;
  const balance = Math.sin(t * 0.29) * 0.7 + Math.sin(t * 0.131 + 1.1) * 0.3;

  const prof = (y) => Math.min(1, Math.max(0, (y - cimeY) / H));
  function demi(y) {
    const p = prof(y);
    // évasement du pied : les contreforts ne montent que sur le dernier dixième
    const pied = 1 + 1.5 * Math.pow(Math.max(0, p - 0.9) / 0.1, 2.2);
    return (DEMI_CIME + (DEMI_BAS - DEMI_CIME) * Math.pow(p, 1.55)) * pied;
  }
  function axe(y) {
    const p = prof(y);
    const ampl = 0.34 + 0.66 * jeune;       // le jeune fût est presque droit
    const serpent = (Math.sin(p * 3.9 + 0.7) * 46 * E * (1 - 0.45 * p)
                  +  Math.sin(p * 9.3 + 2.1) * 15 * E * (1 - 0.4 * p)
                  +  Math.sin(p * 19.1) * 5 * E) * ampl;
    return tx + serpent + balance * AMPL * (1 - p) * (1 - p);   // le pied est ancré
  }

  const ys = [], ax = [], dm = [];
  for (let i = 0; i <= PAS; i++) {
    const y = cimeY + H * (i / PAS);
    ys.push(y); ax.push(axe(y)); dm.push(demi(y));
  }

  function courbe(pts, depart) {
    if (depart) c.moveTo(pts[0][0], pts[0][1]); else c.lineTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++)
      c.quadraticCurveTo(pts[i][0], pts[i][1],
        (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    c.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
  }
  /* Un lé du fût. `neuf` ouvre un chemin, sinon le lé s'ajoute au chemin courant :
     treize rainures en un seul remplissage plutôt que treize, c'est ce qui tient
     la frame sous les dix millisecondes. */
  function bande(u0, u1, ondul, graine, neuf) {
    const a = [], b = [];
    for (let i = 0; i <= PAS_T; i++) {
      const p = i / PAS_T, j = Math.round(p * PAS);
      const w = ondul ? Math.sin(p * (4.7 + graine * 2.6) + graine * 5.7) * ondul
                      + Math.sin(p * 12.3 + graine * 3.1) * ondul * 0.45 : 0;
      a.push([ax[j] + (u0 + w) * dm[j], ys[j]]);
      b.push([ax[j] + (u1 + w) * dm[j], ys[j]]);
    }
    b.reverse();
    if (neuf !== false) c.beginPath();
    c.moveTo(a[0][0], a[0][1]);
    courbe(a, false); courbe(b, false); c.closePath();
  }

  const ancres = [{ x: ax[0], y: cimeY - 4 * E, taille: 58 * E * jeune,
                    cote: 0, graine: 1 }];
  // la cime doit être un bourgeon arrondi : une coupe nette ferait un piquet scié
  const bourgeon = () => {
    c.beginPath();
    c.moveTo(ax[0] - dm[0], ys[0]);
    c.quadraticCurveTo(ax[0] - dm[0] * .9, cimeY - dm[0] * 1.9,
                       ax[0], cimeY - dm[0] * 2.1);
    c.quadraticCurveTo(ax[0] + dm[0] * .9, cimeY - dm[0] * 1.9,
                       ax[0] + dm[0], ys[0]);
    c.closePath();
    c.fillStyle = ecorce(0.55); c.fill();
  };
  const jonctions = [];

  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';

  /* ---- la ramure, tracée avant le fût pour que les naissances disparaissent
     sous le corps du tronc ---- */
  function ruban(x0, y0, cx, cy, x1, y1, w0, w1, u) {
    const N = w0 > 6 * E ? 8 : 5, haut = [], bas = [];
    for (let i = 0; i <= N; i++) {
      const s = i / N, v = 1 - s;
      const px = v * v * x0 + 2 * v * s * cx + s * s * x1;
      const py = v * v * y0 + 2 * v * s * cy + s * s * y1;
      const dx = v * (cx - x0) + s * (x1 - cx), dy = v * (cy - y0) + s * (y1 - cy);
      const l = Math.hypot(dx, dy) || 1;
      let nx = -dy / l, ny = dx / l;
      if (ny > 0) { nx = -nx; ny = -ny; }
      const w = w0 + (w1 - w0) * Math.pow(s, 0.75);
      haut.push([px + nx * w, py + ny * w]);
      bas.push([px - nx * w, py - ny * w]);
    }
    /* Trois lés emboîtés du côté éclairé plutôt qu'un aplat : une branche est un
       cylindre, et créer un dégradé par branche coûterait cent trente objets
       par frame. `t` va de 0 (arête au soleil) à 1 (arête à l'ombre). */
    const le = (t0, t1) => {
      c.beginPath();
      for (let i = 0; i <= N; i++) {
        const x = haut[i][0] + (bas[i][0] - haut[i][0]) * t0;
        const y = haut[i][1] + (bas[i][1] - haut[i][1]) * t0;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      for (let i = N; i >= 0; i--) {
        c.lineTo(haut[i][0] + (bas[i][0] - haut[i][0]) * t1,
                 haut[i][1] + (bas[i][1] - haut[i][1]) * t1);
      }
      c.closePath();
    };
    le(0, 1); c.fillStyle = ecorce(u * 0.42); c.fill();
    le(0, 0.66); c.fillStyle = ecorce(u * 0.9); c.fill();
    le(0.03, 0.30); c.fillStyle = ecorce(Math.min(1, u + 0.30)); c.fill();
    if (w0 > 7 * E) {                      // sillon d'écorce, réservé aux grosses
      le(0.44, 0.51); c.fillStyle = ecorce(0.05, 0.34); c.fill();
      le(0.51, 0.58); c.fillStyle = ecorce(0.95, 0.13); c.fill();
    }
  }

  function ramifie(x, y, ang, len, w, reste, cote, sem) {
    const flot = Math.sin(t * 0.42 + sem * 0.7) * Math.min(4 * E, len * 0.035);
    const ex = x + Math.cos(ang) * len + flot;
    const ey = y + Math.sin(ang) * len + flot * 0.4;
    // le milieu est tiré vers le haut : une branche s'arque, elle ne file pas droit
    const cx = x + Math.cos(ang) * len * 0.5 + Math.cos(ang - 1.5708) * len * 0.13;
    const cy = y + Math.sin(ang) * len * 0.5 + Math.sin(ang - 1.5708) * len * 0.13;
    const u = 0.30 + cyl((Math.cos(ang) * cote + 1) / 2) * 0.5 + (cote > 0 ? 0.14 : 0);
    ruban(x, y, cx, cy, ex, ey, w, w * 0.6, u);
    if (reste <= 0 || w < 1.5 * E) {
      ancres.push({ x: ex, y: ey, taille: Math.max(38 * E * jeune, w * 16),
                    cote: cote, graine: sem });
      return;
    }
    /* Bouquets le long de la branche, pas seulement au bout : une couronne
       n'est pas une guirlande de pompons posés aux extrémités. */
    if (reste <= 2) {
      const mx = 0.25 * x + 0.5 * cx + 0.25 * ex, my = 0.25 * y + 0.5 * cy + 0.25 * ey;
      ancres.push({ x: mx, y: my, taille: Math.max(30 * E * jeune, w * 11),
                    cote: cote, graine: sem + 0.5 });
    }
    const ouv = 0.34 + alea(sem + 1) * 0.26;
    ramifie(ex, ey, ang - ouv, len * (0.70 + alea(sem + 2) * 0.10),
            w * 0.64, reste - 1, cote, sem * 3 + 7);
    ramifie(ex, ey, ang + ouv * (0.7 + alea(sem + 3) * 0.6),
            len * (0.60 + alea(sem + 4) * 0.14), w * 0.56, reste - 1, cote, sem * 3 + 11);
    if (alea(sem + 5) > 0.60)                    // gourmand occasionnel, brise la symétrie
      ramifie(ex, ey, ang + (alea(sem + 6) - 0.5) * 0.4, len * 0.44,
              w * 0.34, reste - 2, cote, sem * 3 + 13);
  }

  // un jeune arbre n'a pas encore de charpentières : une ou deux suffisent
  const NB = Math.max(1, Math.min(9, Math.round(H / (135 * E))));
  const NIV = H > 300 * E ? 3 : H > 150 * E ? 2 : 1;
  for (let i = 0; i < NB; i++) {
    const q = NB > 1 ? i / (NB - 1) : 0.5;
    const p = 0.10 + 0.72 * q + (alea(i + 5) - 0.5) * 0.06;
    const y0 = cimeY + H * p, a0 = axe(y0), d0 = demi(y0);
    const cote = i % 2 ? -1 : 1;
    const w0 = Math.max(2.2 * E, d0 * 0.42);
    const len = (48 + 210 * Math.pow(p, 0.9)) * E * jeune * (0.8 + 0.4 * alea(i + 13));
    // plus la branche naît bas, plus elle part à l'horizontale
    const mont = 0.62 - 0.34 * p + alea(i + 19) * 0.16;
    const ang = cote > 0 ? -mont : -(Math.PI - mont);
    const bx = a0 + cote * d0 * 0.48;
    ramifie(bx, y0, ang, len, w0, NIV, cote, i * 17 + 3);
    jonctions.push([bx, y0, w0]);
  }

  // ---- le fût ----
  const droite = [], gauche = [];
  for (let i = 0; i <= PAS; i++) {
    droite.push([ax[i] + dm[i], ys[i]]);
    gauche.push([ax[i] - dm[i], ys[i]]);
  }
  const gaucheInv = gauche.slice().reverse();
  function silhouette() {
    c.beginPath();
    courbe(droite, true); courbe(gaucheInv, false);
    c.quadraticCurveTo(ax[0], cimeY - 7 * E, droite[0][0], droite[0][1]);
    c.closePath();
  }
  bourgeon();
  silhouette(); c.fillStyle = ecorce(0.3); c.fill();

  c.save();
  silhouette(); c.clip();

  // 22 lés verticaux suivant la courbe d'éclairement : le tronc devient rond
  const LES = 12;
  for (let i = 0; i < LES; i++) {
    const u0 = -1.05 + 2.1 * (i / LES), u1 = -1.05 + 2.1 * ((i + 1) / LES);
    bande(u0, u1 + 0.004, 0, 0);
    c.fillStyle = ecorce(0.12 + cyl(((u0 + u1) / 2 + 1) / 2) * 0.86);
    c.fill();
  }
  // rainures : le liseré clair est du côté qui regarde la lumière
  c.beginPath();
  for (let i = 0; i < 13; i++) {
    const u = -0.88 + 1.76 * (i / 12) + (alea(i + 61) - 0.5) * 0.10;
    const e = 0.016 + 0.018 * alea(i + 67);
    bande(u - e, u + e, 0.05, i + 1, false);
  }
  c.fillStyle = ecorce(0.05, 0.44); c.fill();
  c.beginPath();
  for (let i = 0; i < 13; i++) {
    const u = -0.88 + 1.76 * (i / 12) + (alea(i + 61) - 0.5) * 0.10;
    const e = 0.016 + 0.018 * alea(i + 67);
    bande(u + e * 1.1, u + e * 2.6, 0.05, i + 1, false);
  }
  c.fillStyle = ecorce(0.98, 0.15); c.fill();
  /* Cassures horizontales : sans elles les rainures filent du haut en bas et
     l'écorce se lit comme un lambris. Une écorce se fend en écailles. */
  c.lineCap = 'butt';
  const ecailles = (dx) => {
    c.beginPath();
    for (let i = 0; i < 90; i++) {
      const q = alea(i + 401), yy = cimeY + H * q;
      const aa = axe(yy), dd = demi(yy);
      const u = -0.92 + 1.84 * alea(i + 403);
      const lg = dd * (0.10 + alea(i + 405) * 0.20);
      const x0 = aa + u * dd + dx;
      c.moveTo(x0, yy);
      c.quadraticCurveTo(aa + (u + 0.05) * dd + dx, yy + lg * 0.5, x0 + lg * 0.2, yy + lg);
    }
  };
  const epMoy = Math.max(0.8, DEMI_BAS * 0.022);
  ecailles(0);
  c.strokeStyle = ecorce(0.04, 0.30); c.lineWidth = epMoy; c.stroke();
  ecailles(epMoy * 1.4);
