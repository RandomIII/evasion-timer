    /* ================= haies taillées ================= */
    function haie(s, x, base, lg, h){
      ombrePied(x, base, lg * 0.55, h * 0.14);
      const dl = lg * 0.5;
      for (let pass = 0; pass < 3; pass++){
        c.fillStyle = pass === 0 ? CF0 : (pass === 1 ? CF1 : CF2);
        if (pass === 0){
          rrect(x - dl, base - h, lg, h, h * 0.14);
          c.fill();
          const n = Math.max(4, Math.round(lg / (h * 0.32)));
          for (let i = 0; i <= n; i++){         // crête à peine irrégulière, fraîchement taillée
            const u = i / n, rx = LP(-dl, dl, u);
            masse(x + rx, base - h - h * 0.02 * R(s, i * 1.7),
                  h * (0.11 + 0.07 * R(s, i * 2.3)) * (0.6 + 0.9 * P.irr), s, 400 + i, 0.85);
          }
        } else if (pass === 1){
          rrect(x - dl * 0.985, base - h * 0.985, lg * 0.97, h * 0.9, h * 0.13);
          c.fill();
          for (let i = 0; i < 16; i++){          // texture de feuilles sur la face vue
            const u = R(s, 420 + i * 1.31), v = R(s, 440 + i * 1.71);
            masse(x + LP(-dl * 0.92, dl * 0.92, u), base - h * (0.12 + 0.8 * v),
                  h * 0.10, s, 460 + i, 0.9);
          }
        } else {
          c.globalAlpha = 0.85 * jour;
          rrect(x - dl * 0.72, base - h * 0.97, lg * 0.86, h * 0.24, h * 0.11);
          c.fill();
          c.globalAlpha = 0.55 * jour;
          rrect(x + dl * 0.62, base - h * 0.9, lg * 0.12, h * 0.72, h * 0.1);
          c.fill();
          for (let i = 0; i < 10; i++){
            c.globalAlpha = (0.4 + 0.5 * R(s, 500 + i)) * jour;
            const u = R(s, 480 + i * 1.29);
            masse(x + LP(-dl * 0.8, dl * 0.95, u), base - h * (0.82 + 0.14 * R(s, 520 + i)),
                  h * 0.085, s, 540 + i, 0.9);
          }
          c.globalAlpha = 1;
        }
      }
    }

    /* ================= touffes d'herbe ================= */
    function touffes(prem){
      const N = 84;
      for (let tone = 0; tone < 2; tone++){
        c.fillStyle = tone ? om(FE[2][0], FE[2][1], FE[2][2], 0.62 * jour) : CF0;
        c.beginPath();
        for (let i = 0; i < N; i++){
          const d = R(800 + i, 1);
          if ((d > 0.42) !== prem) continue;
          const pousse = SS((P.herbe * 1.3 - R(800 + i, 2)) * 3);
          if (pousse < 0.02) continue;
          const gx = R(800 + i, 3) * W * 1.04 - W * 0.02;
          const gy = solY + bande * 0.30 * Math.pow(d, 1.5);
          const ech = (0.55 + 0.9 * d) * pousse;
          const hg = E * LP(15, 9, P.taille) * ech * (0.6 + 0.8 * R(800 + i, 4));
          const nb = 5;
          for (let b = 0; b < nb; b++){
            const droite = R(800 + i, 10 + b) > 0.5;
            if (tone === 1 && !droite) continue;
            if (tone === 0 && droite && R(800 + i, 20 + b) < 0.4) continue;
            const lean = (R(800 + i, 30 + b) - 0.5) * 1.5;
            const hb = hg * (0.55 + 0.6 * R(800 + i, 40 + b));
            const bal = Math.sin(T * 0.55 + i * 0.7 + b) * hb * 0.10 * P.vent;
            const wb = Math.max(0.45, hb * 0.075);
            const bx = gx + (b - 2) * hg * 0.13;
            const tx = bx + lean * hg * 0.42 + bal, ty = gy - hb;
            const mx = bx + lean * hg * 0.12, my = gy - hb * 0.55;
            c.moveTo(bx - wb, gy);
            c.quadraticCurveTo(mx - wb * 0.6, my, tx, ty);
            c.quadraticCurveTo(mx + wb * 0.9, my, bx + wb, gy);
            c.closePath();
          }
        }
        c.fill();
      }
    }

    /* ================= végétation suspendue (époque 5) ================= */
    function suspendue(){
      const k = P.susp;
      if (k < 0.02) return;
      for (let i = 0; i < 8; i++){
        const pousse = SS((k * 1.25 - R(600 + i, 1)) * 3);
        if (pousse < 0.02) continue;
        const cote = i % 2 ? 1 : -1, u = R(600 + i, 2);
        const x = cote < 0 ? W * (0.02 + 0.22 * u) : W * (0.98 - 0.22 * u);
        const y0 = -solY * 0.02 + solY * 0.10 * R(600 + i, 3);
        const lg = solY * (0.13 + 0.12 * R(600 + i, 4)) * pousse;
        const bac = lg * 0.42;
        c.fillStyle = om(96, 104, 118, 1);
        rrect(x - bac * 0.5, y0, bac, bac * 0.30, bac * 0.09);
        c.fill();
        c.fillStyle = om(168, 178, 194, 0.7 * jour);
        rrect(x - bac * 0.5, y0, bac, bac * 0.09, bac * 0.045);
        c.fill();
        const nv = 5;
        for (let v = 0; v < nv; v++){
          const vx = x + LP(-bac * 0.42, bac * 0.42, (v + 0.5) / nv);
          const ll = lg * (0.55 + 0.75 * R(600 + i, 10 + v));
          const bal = Math.sin(T * 0.23 + i + v * 0.8) * ll * 0.07 * (0.4 + P.vent);
          c.strokeStyle = om(FE[0][0], FE[0][1], FE[0][2], 1);
          c.lineWidth = Math.max(0.6, lg * 0.012);
          c.beginPath();
          c.moveTo(vx, y0 + bac * 0.28);
          c.quadraticCurveTo(vx + bal * 0.6, y0 + bac * 0.28 + ll * 0.55, vx + bal, y0 + bac * 0.28 + ll);
          c.stroke();
          const nl = 6;
          for (let f = 0; f < nl; f++){
            const uu = (f + 1) / (nl + 1);
            const lx = vx + bal * uu * uu, ly = y0 + bac * 0.28 + ll * uu;
            const rl = lg * 0.055 * (0.7 + 0.6 * R(600 + i, 30 + v * 7 + f));
            c.fillStyle = f % 2 ? CF1 : CF0;
            masse(lx + (f % 2 ? rl : -rl) * 0.8, ly, rl, 600 + i, v * 11 + f, 0.8);
            if (f === nl - 1 && glows.length < 190){
              glows.push({ x: lx, y: ly, r: rl * 1.6, h: R(600 + i, 50 + v) });
            }
          }
        }
      }
    }

    /* ================= mise en scène ================= */
    c.save();
    c.lineJoin = "round";
    c.lineCap = "round";

    lisiere();
    touffes(false);

    const objs = [];
    const NS = 22, demi = NS >> 1;

    for (let s = 0; s < NS; s++){
      const cote = (s % 2) ? 1 : -1, rang = s >> 1;
      const uA = (rang + 0.5) / demi;
      const uu = CL(LP(R(s, 1), uA, P.align), 0, 1);
      // le centre appartient au village : on plante des bords vers la bande, jamais dedans
      const x = cote < 0 ? W * (0.285 - 0.32 * uu) : W * (0.715 + 0.32 * uu);
      const dR = Math.pow(R(s, 2), 2.2);
      const d = LP(dR, 0.26, P.align * 0.75);
      const base = solY + bande * 0.30 * Math.pow(d, 1.5);
      const pres = SS((P.couvert - R(s, 3)) * 3.2 + 0.5);
      if (pres < 0.02) continue;
      const bord = 0.44 + 0.56 * uu;
      const varH = 0.72 + 0.58 * R(s, 4);
      const ech = pres * (0.62 + 0.85 * d) * bord * LP(varH, 1, P.align * 0.8);
      const col = SS((P.cyp * 0.85 - R(s, 5)) * 3.2);
      let haut = Math.min(P.haut * E * ech * LP(1, 1.34, col), solY * 0.94);
      // le feuillage ne doit pas empiéter sur la bande centrale
      const marge = Math.max(0, cote < 0 ? W * 0.30 - x : x - W * 0.70) + W * 0.035;
      const dc = haut * P.ratio * 0.5 * LP(1, 0.30, col);
      if (dc > marge) haut *= marge / dc;
      if (haut < 4 * E) continue;
      objs.push({ y: base, k: 0, s: s, x: x, h: haut, c: col, e: ech });
    }

    for (let i = 0; i < 16; i++){                       // fougères
      const s = 200 + i;
      const pousse = SS((P.foug * 1.25 - R(s, 1)) * 3);
      if (pousse < 0.02) continue;
      const cote = (i % 2) ? 1 : -1, u = R(s, 2);
      const x = cote < 0 ? W * (0.30 - 0.33 * u) : W * (0.70 + 0.33 * u);
      const dd = Math.pow(R(s, 3), 1.4);
      const base = solY + bande * 0.30 * dd;
      const taille = E * 46 * pousse * (0.55 + 0.9 * dd) * (0.7 + 0.6 * R(s, 4));
      if (taille < 3 * E) continue;
      objs.push({ y: base, k: 1, s: s, x: x, h: taille });
    }

    for (let i = 0; i < 14; i++){                       // souches
      const s = 300 + i;
      const pousse = SS((P.souche * 1.3 - R(s, 1)) * 3);
      if (pousse < 0.02) continue;
      const cote = (i % 2) ? 1 : -1, u = R(s, 2);
      const x = cote < 0 ? W * (0.31 - 0.34 * u) : W * (0.69 + 0.34 * u);
      const dd = Math.pow(R(s, 3), 1.3);
      const base = solY + bande * 0.30 * dd;
      const d = E * 40 * pousse * (0.5 + 1.0 * dd) * (0.7 + 0.6 * R(s, 4));
      if (d < 3 * E) continue;
      objs.push({ y: base, k: 2, s: s, x: x, h: d });
    }

    for (let i = 0; i < 10; i++){                       // haies
      const s = 400 + i;
      const pousse = SS((P.haie * 1.25 - R(s, 1)) * 3);
      if (pousse < 0.02) continue;
      const cote = (i % 2) ? 1 : -1, u = R(s, 2);
      const lg = W * (0.09 + 0.09 * R(s, 5));
      const x = cote < 0 ? W * 0.28 - lg * 0.5 - W * 0.26 * u
                         : W * 0.72 + lg * 0.5 + W * 0.26 * u;
      const dd = Math.pow(R(s, 3), 1.2);
      const base = solY + bande * 0.30 * dd;
      const h = E * 32 * pousse * (0.55 + 0.95 * dd) * (0.75 + 0.5 * R(s, 4));
      if (h < 2.5 * E) continue;
      objs.push({ y: base, k: 3, s: s, x: x, h: h, w: lg * (0.55 + 0.9 * dd) });
    }

    objs.sort((a, b) => a.y - b.y);
    for (let i = 0; i < objs.length; i++){
      const o = objs[i];
      if (o.k === 0) arbre(o.s, o.x, o.y, o.h, o.c, o.e);
      else if (o.k === 1) fougere(o.s, o.x, o.y, o.h);
      else if (o.k === 2) souche(o.s, o.x, o.y, o.h);
      else haie(o.s, o.x, o.y, o.w, o.h);
    }

    touffes(true);
    suspendue();

    /* ---- passe additive : seule la bio-luminescence s'écrit en rgba direct ---- */
    if (P.bio > 0.03 && glows.length){
      c.save();
      c.globalCompositeOperation = "lighter";
      const force = P.bio * (0.34 + 0.66 * nt);
      for (let i = 0; i < glows.length; i++){
        const g = glows[i];
        const pulse = 0.6 + 0.4 * Math.sin(T * 0.7 + i * 1.9);
        const cyan = g.h < 0.62;
        const r = cyan ? 90 : 210, v = cyan ? 250 : 110, b = cyan ? 220 : 235;
        c.fillStyle = "rgba(" + r + "," + v + "," + b + "," + (0.045 * force * pulse).toFixed(3) + ")";
        c.beginPath();
        c.arc(g.x, g.y, g.r * 2.4, 0, TAU);
        c.fill();
        c.fillStyle = "rgba(" + r + "," + v + "," + b + "," + (0.12 * force * pulse).toFixed(3) + ")";
        c.beginPath();
        c.arc(g.x, g.y, g.r, 0, TAU);
        c.fill();
        c.fillStyle = "rgba(" + Math.min(255, r + 100) + "," + 255 + "," + Math.min(255, b + 20)
                    + "," + (0.5 * force * pulse).toFixed(3) + ")";
        c.beginPath();
        c.arc(g.x, g.y, Math.max(0.7, g.r * 0.24), 0, TAU);
        c.fill();
      }
      c.restore();
    }

    c.restore();
  }

  /* ---- aiguillage vers les assets d'époque ----
     Les six familles (`bat0..bat5`, `mon0..mon5`) sont écrites séparément, une
     par époque. On leur passe la teinte de nuit et le pseudo-aléa plutôt que de
     les leur faire réimplémenter, sinon chaque époque dérive de son voisin. */
  function teinteNuit(nuit){
    const k = Math.max(0, Math.min(1, nuit)) * .62;
    return (r, g, b, a) => "rgba(" + Math.round(r * (1 - k) + 16 * k) + ","
         + Math.round(g * (1 - k) + 22 * k) + ","
         + Math.round(b * (1 - k) + 46 * k) + "," + (a === undefined ? 1 : a) + ")";
  }
  const aleaDe = (gr) => (i) => {
    const s = Math.sin((i + gr * 53.1) * 12.9898 + 78.233) * 43758.5453;
    return s - Math.floor(s);
  };
  // Chantier du village : l'ouvrier batisseur et son echafaudage, six epoques.
  // Repere local en pixels, origine au sol, y negatif vers le haut,
  // lumiere venant du haut-droite (0.66, -0.75).

  function batisseur(c, S, ep, marche, nuit, t, om, al){
    var e = ep | 0; if (e < 0) e = 0; if (e > 5) e = 5;
    var W = marche ? 1 : 0;

    // Palettes par epoque : peau, tenue, garniture, coiffe, metal, bois.
    var SK = [[198,152,108],[200,158,116],[194,148,106],[204,164,126],[206,170,134],[172,192,208]][e];
    var CL = [[132,96,60],[212,194,156],[126,80,44],[48,76,132],[216,150,34],[86,100,122]][e];
    var TR = [[92,66,40],[170,62,52],[86,54,30],[32,50,88],[58,70,88],[62,206,244]][e];
    var HT = [[60,44,32],[54,40,28],[64,46,32],[68,50,34],[234,198,46],[78,94,114]][e];
    var MT = [[128,124,118],[198,136,60],[152,122,76],[168,172,178],[198,204,210],[126,158,186]][e];
    var WD = [[122,88,52],[136,100,60],[130,94,56],[108,78,48],[92,96,104],[70,82,100]][e];
    var LG = [SK,SK,WD,CL,TR,CL][e];   // jambes
    var AB = [SK,SK,SK,CL,CL,CL][e];   // bras
    var CH = [SK,CL,[198,180,146],CL,CL,CL][e];   // buste
    var PV = [CL,CL,WD,CL,TR,CL][e];   // bassin
    var FC = [SK,SK,WD,TR,TR,CL][e];   // pieds

    function K(g,k,o){
      return om(Math.min(255,g[0]*k), Math.min(255,g[1]*k), Math.min(255,g[2]*k), o===undefined?1:o);
    }

    var OUT = false, OW = S*0.052, INK = om(16,12,10,1);

    function path(p,dx,dy){
      dx = dx||0; dy = dy||0;
      c.beginPath();
      for(var i=0;i<p.length;i+=2){
        if(i) c.lineTo(p[i]+dx,p[i+1]+dy); else c.moveTo(p[i]+dx,p[i+1]+dy);
      }
    }
    function sc(p){ var o=[],i; for(i=0;i<p.length;i++) o.push(p[i]*S); return o; }

    // Membre : trait epais a bouts ronds, l'articulation vient du coude du trace.
    function bone(p,w,g,k){
      k = k||0.86;
      c.lineCap='round'; c.lineJoin='round';
      if(OUT){ c.strokeStyle=INK; c.lineWidth=w+OW; path(p); c.stroke(); return; }
      c.strokeStyle=K(g,k); c.lineWidth=w; path(p); c.stroke();
      c.strokeStyle=K(g,k*1.45); c.lineWidth=w*0.30; path(p,w*0.19,-w*0.19); c.stroke();
    }
    // Volume ferme : l'arete haut-droite est reeclairee par decalage puis clip.
    function slab(p,g,k){
      var i, x0=p[0], x1=p[0], y0=p[1], y1=p[1];
      for(i=2;i<p.length;i+=2){
        if(p[i]<x0)x0=p[i]; if(p[i]>x1)x1=p[i];
        if(p[i+1]<y0)y0=p[i+1]; if(p[i+1]>y1)y1=p[i+1];
      }
      k = k||0.86;
      c.lineJoin='round';
      if(OUT){ c.fillStyle=INK; c.strokeStyle=INK; c.lineWidth=OW; path(p); c.closePath(); c.fill(); c.stroke(); return; }
      c.fillStyle=K(g,k); path(p); c.closePath(); c.fill();
      var w = Math.max(S*0.010, Math.min(x1-x0,y1-y0)*0.34);
      c.save(); path(p); c.closePath(); c.clip();
      c.strokeStyle=K(g,k*1.42); c.lineWidth=w;
      path(p,-w*0.5,w*0.5); c.closePath(); c.stroke();
      c.restore();
    }
    function ball(x,y,r,g,k){
      k = k||0.86;
      if(OUT){ c.fillStyle=INK; c.beginPath(); c.arc(x,y,r+OW*0.5,0,6.2832); c.fill(); return; }
      c.fillStyle=K(g,k); c.beginPath(); c.arc(x,y,r,0,6.2832); c.fill();
      c.fillStyle=K(g,k*1.34); c.beginPath(); c.arc(x+r*0.26,y-r*0.26,r*0.66,0,6.2832); c.fill();
    }
    function seg(x1,x2,h,g,k){ slab([x1,-h, x2,-h, x2,h, x1,h], g, k); }

    // ---------- cadence ----------
    var wp = t*4.2, hp = t*2.35;
    var u = hp - Math.floor(hp);
    var blow = Math.round(hp);
    var lift = u<0.70 ? Math.pow(u/0.70,1.15) : 1-Math.pow((u-0.70)/0.30,2.2);
    var hit = u>0.94 ? (u-0.94)/0.06 : (u<0.14 ? 1-u/0.14 : 0);
    if(W){ lift = 0; hit = 0; }

    // ---------- jambes ----------
    var LT = S*0.205, LS = S*0.205, FT = S*0.038;
    var th1,kn1,th2,kn2;
    if(W){
      th1 = 0.60*Math.sin(wp);          kn1 = 0.16+0.90*Math.max(0,-Math.sin(wp));
      th2 = 0.60*Math.sin(wp+3.14159);  kn2 = 0.16+0.90*Math.max(0,-Math.sin(wp+3.14159));
    } else {
      th1 = 0.32+0.07*(1-lift); kn1 = 0.24;
      th2 = -0.34;              kn2 = 0.44;
    }
    function jnt(th,kn){
      var kx = Math.sin(th)*LT, ky = Math.cos(th)*LT;
      return [kx, ky, kx+Math.sin(th-kn)*LS, ky+Math.cos(th-kn)*LS];
    }
    var J1 = jnt(th1,kn1), J2 = jnt(th2,kn2);
    // Le bassin se pose sur la jambe la plus tendue : le rebond vient de la.
    var hipY = -Math.max(J1[3],J2[3]) - FT;

    // ---------- buste, tete ----------
    var TOR = S*0.285;
    var lean = W ? 0.15+0.035*Math.sin(wp*2) : 0.08+0.30*(1-lift);
    var cs = Math.cos(lean), sn = Math.sin(lean);
    function R(x,y){ return [x*cs-y*sn, hipY+x*sn+y*cs]; }
    var SHp = R(-S*0.012,-TOR);
    var HDp = R(S*0.030,-TOR-S*0.150);
    var HR = S*0.105;

    // ---------- bras ----------
    // Cinematique inverse : on pose la main, le coude est rejete en arriere.
    var UA = S*0.160, FA = S*0.150;
    function ik(px2,py2){
      var dx = px2-SHp[0], dy = py2-SHp[1];
      var d = Math.sqrt(dx*dx+dy*dy) || 1e-4;
      var ux = dx/d, uy = dy/d;
      var mn = Math.abs(UA-FA)+1e-4, mx = UA+FA-1e-4;
      if(d < mn) d = mn; if(d > mx) d = mx;
      var aa = (d*d+UA*UA-FA*FA)/(2*d);
      var hh = Math.sqrt(Math.max(0,UA*UA-aa*aa));
      var ex = -uy*hh, ey = ux*hh;
      if(ex > 0){ ex = -ex; ey = -ey; }
      return [SHp[0]+ux*aa+ex, SHp[1]+uy*aa+ey, SHp[0]+ux*d, SHp[1]+uy*d];
    }
    var hnx,hny,tAng;
    if(W){
      hnx = SHp[0]-S*0.105;
      hny = SHp[1]+S*0.055+S*0.012*Math.sin(wp*2);
      tAng = -2.35;
    } else {
      hnx = S*0.215 - S*0.305*lift;
      hny = -S*0.450 - S*0.455*lift;
      tAng = 0.325 - 2.275*lift;
    }
    var AN = ik(hnx,hny);
    var aF = W ? 0.55*Math.sin(wp+3.14159) : 0.78-0.15*lift;
    var AF = ik(SHp[0]+Math.sin(aF)*S*0.285, SHp[1]+Math.cos(aF)*S*0.285);

    var TL = S*(e===4?0.25:0.27);
    var tdx = Math.sin(tAng), tdy = Math.cos(tAng);
    var tipx = AN[2]+tdx*TL, tipy = AN[3]+tdy*TL;

    // ---------- pieces ----------
    function limb(J,g,k){
      bone([0,hipY, J[0],hipY+J[1], J[2],hipY+J[3]], S*0.072, g, 0.85*k);
      var ax = J[2], ay = hipY+J[3];
      var tilt = Math.min(0.55, Math.max(0, (-ay/S-0.06)*2.4));
      bone([ax,ay, ax+S*0.098, ay+FT*0.30+S*0.05*tilt], S*0.046, FC, 0.80*k);
    }
    function armDraw(A,k){
      bone([SHp[0],SHp[1], A[0],A[1], A[2],A[3]], S*0.060, AB, 0.88*k);
      if(!OUT) ball(A[2],A[3],S*0.031, SK, 0.90*k);
    }
    function body(){
      c.save(); c.translate(0,hipY); c.rotate(lean);
      slab(sc([-0.086,-0.146, 0.088,-0.152, 0.080,0.034, -0.078,0.028]), PV, 0.84);
      slab(sc([-0.082,-0.320, 0.090,-0.302, 0.104,-0.150, -0.100,-0.132]), CH, 0.88);
      ball(-S*0.006,-S*0.300, S*0.054, CH, 0.94);
      if(!OUT){
        if(e<=3){ c.fillStyle=K(TR,0.95); c.fillRect(-S*0.088,-S*0.172,S*0.182,S*0.042); }
        if(e===2) slab(sc([-0.015,-0.300, 0.100,-0.256, 0.094,0.090, -0.048,0.070]), CL, 0.92);
        if(e===3){
          c.strokeStyle=K(TR,1.25); c.lineWidth=S*0.020; c.lineCap='round';
          c.beginPath(); c.moveTo(-S*0.050,-S*0.312); c.lineTo(S*0.030,-S*0.170); c.stroke();
        }
        if(e===4){ c.fillStyle=K([246,246,232],0.92); c.fillRect(-S*0.096,-S*0.246,S*0.198,S*0.036); }
        if(e===5){
          c.strokeStyle=K(TR,1.0,0.85); c.lineWidth=S*0.016; c.lineCap='round';
          c.beginPath();
          c.moveTo(-S*0.070,-S*0.286); c.lineTo(S*0.086,-S*0.264);
          c.moveTo(-S*0.084,-S*0.180); c.lineTo(S*0.096,-S*0.166);
          c.stroke();
        }
      }
      c.restore();
    }
    function head(){
      var hx = HDp[0], hy = HDp[1];
      bone([SHp[0]+S*0.012,SHp[1], hx-S*0.014,hy+S*0.078], S*0.054, SK, 0.78);
      ball(hx+HR*0.30, hy+HR*0.52, HR*0.62, SK, 0.82);           // machoire
      ball(hx, hy, HR, SK, 0.92);
      slab([hx+HR*0.62,hy-HR*0.08, hx+HR*1.16,hy+HR*0.12, hx+HR*0.60,hy+HR*0.34], SK, 0.95); // nez de profil
      if(OUT){
        // La coiffe fait partie de la silhouette : on la reprend en encre.
        if(e===4) slab([hx-HR*1.30,hy-HR*0.30, hx+HR*1.50,hy-HR*0.30, hx+HR*1.44,hy-HR*0.02, hx-HR*1.24,hy-HR*0.02], HT);
        c.fillStyle=INK; c.beginPath(); c.arc(hx-HR*0.06,hy-HR*0.22,HR*1.10+OW*0.5,0,6.2832); c.fill();
        return;
      }
      if(e===0){
        ball(hx-HR*0.60,hy-HR*0.30,HR*0.58, HT, 0.80);
        c.save(); c.translate(hx,hy); c.rotate(-0.10);
        c.fillStyle=K(TR,1.0); c.fillRect(-HR*1.05,-HR*0.86,HR*2.1,HR*0.42); c.restore();
        slab([hx-HR*0.30,hy+HR*0.42, hx+HR*0.62,hy+HR*0.30,
              hx+HR*0.52,hy+HR*0.92, hx-HR*0.24,hy+HR*0.86], HT, 0.74);
      } else if(e===1){
        c.fillStyle=K(CL,0.94); c.beginPath();
        c.arc(hx,hy,HR*1.14, Math.PI*0.62, Math.PI*1.95); c.closePath(); c.fill();
        c.fillStyle=K(CL,1.26); c.beginPath();
        c.arc(hx,hy,HR*1.14, Math.PI*1.55, Math.PI*1.95); c.arc(hx,hy,HR*0.90, Math.PI*1.95, Math.PI*1.55, true);
        c.closePath(); c.fill();
        slab([hx-HR*0.20,hy+HR*0.40, hx+HR*0.66,hy+HR*0.26,
              hx+HR*0.54,hy+HR*1.00, hx-HR*0.16,hy+HR*0.92], HT, 0.74);
      } else if(e===2){
        c.fillStyle=K(HT,0.92); c.beginPath();
        c.arc(hx,hy,HR*1.10, Math.PI*1.02, Math.PI*2.02); c.closePath(); c.fill();
        c.fillStyle=K(HT,1.28); c.beginPath();
        c.arc(hx,hy,HR*1.10, Math.PI*1.52, Math.PI*1.98); c.arc(hx,hy,HR*0.86, Math.PI*1.98, Math.PI*1.52, true);
        c.closePath(); c.fill();
      } else if(e===3){
        c.fillStyle=K(HT,0.92); c.beginPath();
        c.arc(hx,hy,HR*1.06, Math.PI*1.02, Math.PI*2.0); c.closePath(); c.fill();
        slab([hx+HR*0.10,hy-HR*1.06, hx+HR*1.32,hy-HR*0.96, hx+HR*1.30,hy-HR*0.74, hx+HR*0.10,hy-HR*0.82], HT, 1.05);
      } else if(e===4){
        slab([hx-HR*1.30,hy-HR*0.28, hx+HR*1.50,hy-HR*0.34, hx+HR*1.44,hy-HR*0.02, hx-HR*1.22,hy+HR*0.02], HT, 0.90);
        c.fillStyle=K(HT,1.02); c.beginPath();
        c.arc(hx,hy-HR*0.10,HR*1.16, Math.PI*1.0, Math.PI*2.0); c.closePath(); c.fill();
        c.fillStyle=K(HT,1.36); c.beginPath();
        c.arc(hx,hy-HR*0.10,HR*1.16, Math.PI*1.46, Math.PI*1.96);
        c.arc(hx,hy-HR*0.10,HR*0.84, Math.PI*1.96, Math.PI*1.46, true); c.closePath(); c.fill();
      } else {
        ball(hx-HR*0.04,hy-HR*0.14,HR*1.10, HT, 0.94);
        slab([hx+HR*0.18,hy-HR*0.42, hx+HR*1.06,hy-HR*0.18, hx+HR*0.94,hy+HR*0.40, hx+HR*0.16,hy+HR*0.34], TR, 0.80);
      }
    }
    function toolDraw(){
      c.save();
      c.translate(AN[2],AN[3]);
      c.rotate(Math.atan2(tdy,tdx));
      if(e===0){
        seg(-S*0.055, TL*0.72, S*0.024, WD, 0.86);
        slab([TL*0.60,-S*0.070, TL*0.86,-S*0.080, TL*1.00,-S*0.026,
              TL*0.98,S*0.048, TL*0.78,S*0.070, TL*0.60,S*0.052], MT, 0.88);
        if(!OUT){
          c.strokeStyle=K(TR,0.8); c.lineWidth=S*0.013; c.lineCap='round';
          c.beginPath();
          c.moveTo(TL*0.60,-S*0.052); c.lineTo(TL*0.70,S*0.050);
          c.moveTo(TL*0.62,S*0.046); c.lineTo(TL*0.72,-S*0.056);
          c.stroke();
        }
      } else if(e===1){
        seg(-S*0.055, S*0.105, S*0.028, WD, 0.86);
        seg(S*0.085, TL*0.82, S*0.019, MT, 1.0);
        slab([TL*0.80,-S*0.019, TL*1.0,-S*0.004, TL*1.0,S*0.009, TL*0.80,S*0.019], MT, 1.28);
      } else if(e===2){
        seg(-S*0.060, TL*0.78, S*0.022, WD, 0.86);
        slab([TL*0.72,-S*0.078, TL*0.98,-S*0.070, TL*0.98,S*0.070, TL*0.72,S*0.078], MT, 0.90);
        if(!OUT){ c.fillStyle=K(MT,0.62); c.fillRect(TL*0.82,-S*0.074,S*0.016,S*0.148); }
      } else if(e===3){
        seg(-S*0.060, TL*0.80, S*0.019, WD, 0.84);
        slab([TL*0.78,-S*0.062, TL*1.0,-S*0.054, TL*1.0,S*0.046, TL*0.78,S*0.054], MT, 0.94);
        slab([TL*0.78,-S*0.054, TL*0.72,-S*0.096, TL*0.62,-S*0.088, TL*0.74,-S*0.042], MT, 0.80);
      } else if(e===4){
        slab([-S*0.030,-S*0.058, S*0.135,-S*0.046, S*0.135,S*0.026, -S*0.030,S*0.028], HT, 0.86);
        slab([-S*0.022,S*0.018, S*0.052,S*0.018, S*0.044,S*0.098, -S*0.018,S*0.094], TR, 0.80);
        seg(S*0.128, S*0.180, S*0.030, MT, 1.0);
        seg(S*0.175, TL, S*0.010, MT, 1.12);
      } else {
        seg(-S*0.050, S*0.088, S*0.028, MT, 0.90);
        slab([S*0.080,-S*0.030, S*0.150,-S*0.016, S*0.150,S*0.016, S*0.080,S*0.030], MT, 1.10);
        if(!OUT){
          var pu = (0.72+0.28*Math.sin(t*2.1))*(0.55+0.45*nuit);
          c.save(); c.globalCompositeOperation='lighter';
          c.fillStyle='rgba(90,220,255,'+(0.26*pu).toFixed(3)+')';
          path([S*0.145,-S*0.052, TL,-S*0.012, TL,S*0.012, S*0.145,S*0.052]); c.closePath(); c.fill();
          c.fillStyle='rgba(220,250,255,'+(0.85*pu).toFixed(3)+')';
          path([S*0.150,-S*0.020, TL*0.99,-S*0.005, TL*0.99,S*0.005, S*0.150,S*0.020]); c.closePath(); c.fill();
          c.restore();
        }
      }
      c.restore();
    }

    function figure(){
      limb(J2, LG, 0.62);
      armDraw(AF, 0.62);
      body();
      limb(J1, LG, 1.0);
      head();
      armDraw(AN, 1.0);
      toolDraw();
    }

    // ---------- rendu ----------
    c.save();
    // Ombre de contact : elle s'ouvre et palit quand le pied quitte le sol.
    function contact(ax,h,w0){
      var s = Math.min(0.5, Math.max(0, -h/S));
      var ry = S*0.026 + s*S*0.055, rx = w0 + Math.min(S*0.075, s*S*0.35);
      c.fillStyle = om(10,8,6, (0.32-0.42*s)*(1-0.45*nuit));
      c.beginPath();
      c.ellipse(ax*0.7+S*0.02, -ry-S*0.002, rx, ry, 0, 0, 6.2832);
      c.fill();
    }
    contact(J1[2], hipY+J1[3], S*0.100);
    contact(J2[2], hipY+J2[3], S*0.092);

    OUT = true;  figure();
    OUT = false; figure();

    if(!W && hit>0.02 && e!==4){
      var sp = (e===5) ? [150,240,255] : [255,196,110];
      // En plein jour l'additif sature le ciel : on le retient.
      var ad = 0.42+0.58*nuit;
      c.save(); c.globalCompositeOperation='lighter';
      for(var i=0;i<10;i++){
        var an = 0.30+al(blow*17+i)*2.55;
        var ln = (0.35+al(blow*17+i+53)*0.95)*S*0.15;
        var d = (1-hit)*ln;
        var sx2 = tipx+Math.cos(an)*d;
        var sy2 = tipy-Math.sin(an)*d + d*d/(S*0.42);
        var rr = Math.max(0.35, S*0.017*(0.45+al(i*3+7)*0.9)*hit);
        c.fillStyle = 'rgba('+sp[0]+','+sp[1]+','+sp[2]+','+(0.85*ad*hit).toFixed(3)+')';
        c.beginPath(); c.arc(sx2,sy2,rr,0,6.2832); c.fill();
      }
      c.fillStyle = 'rgba('+sp[0]+','+sp[1]+','+sp[2]+','+(0.18*ad*hit).toFixed(3)+')';
      c.beginPath(); c.arc(tipx,tipy,S*0.085*hit,0,6.2832); c.fill();
      c.restore();
    }
    if(!W && hit>0.02 && e===4){
      for(var j=0;j<4;j++){
        var dd = (1-hit)*S*0.10*(0.4+al(blow*11+j)*0.9);
        c.fillStyle = om(206,196,176, 0.26*hit);
        c.beginPath();
        c.arc(tipx-dd*0.7+al(j*5+3)*S*0.04, tipy-dd*0.9, S*0.026+dd*0.5, 0, 6.2832);
        c.fill();
      }
    }
    if(e===5){
      var a5 = 0.45+0.55*nuit;
      c.save(); c.globalCompositeOperation='lighter';
      c.fillStyle='rgba(80,210,255,'+(0.18*a5).toFixed(3)+')';
      c.beginPath(); c.arc(tipx,tipy,S*0.10,0,6.2832); c.fill();
      var cp = R(S*0.055,-S*0.210);
      c.fillStyle='rgba(120,230,255,'+(0.34*a5).toFixed(3)+')';
      c.beginPath(); c.arc(cp[0],cp[1],S*0.042,0,6.2832); c.fill();
      c.restore();
    }
    if(nuit>0.12 && e>=4){
      c.save(); c.globalCompositeOperation='lighter';
      var lx = HDp[0]+HR*1.02, ly = HDp[1]-HR*0.10;
      var lc = (e===4) ? '255,236,180' : '170,235,255';
      c.fillStyle = 'rgba('+lc+','+(0.10*nuit).toFixed(3)+')';
      path([lx,ly-S*0.020, lx+S*0.140,ly-S*0.080, lx+S*0.140,ly+S*0.105, lx,ly+S*0.022]);
      c.closePath(); c.fill();
      c.fillStyle = 'rgba('+lc+','+(0.55*nuit).toFixed(3)+')';
      c.beginPath(); c.arc(lx,ly,S*0.026,0,6.2832); c.fill();
      c.restore();
    }
    c.restore();
  }

  function echafaudage(c, L, H, ep, avance, nuit, t, om, al){
    var e = ep | 0; if (e < 0) e = 0; if (e > 5) e = 5;
    var a = avance; if(!(a>0)) a = 0; if(a>1) a = 1;
    var rest = 1-a;
    var nu = nuit<0?0:(nuit>1?1:nuit);
    var i,j,b,k;

    // Materiaux par epoque : membrures, planchers, liens (lianes, cordes, rivets, filets).
    var MAT = [[126,104,66],[176,148,102],[152,122,76],[104,96,90],[178,188,196],[96,132,164]][e];
    var PLK = [[134,112,74],[170,142,98],[166,136,90],[148,118,76],[198,184,152],[112,152,182]][e];
    var TIE = [[98,116,58],[198,178,134],[176,158,118],[76,70,66],[70,158,116],[70,220,255]][e];

    function K(g,kk,o){
      return om(Math.min(255,g[0]*kk), Math.min(255,g[1]*kk), Math.min(255,g[2]*kk), o===undefined?1:o);
    }

    var hw = L*0.455;
    var top = H*(0.20+0.80*rest);
    var nb = Math.round(L/(H*0.55)); if(nb<2)nb=2; if(nb>4)nb=4;
    var np = nb+1;
    var nl = Math.max(1, Math.round(top/(H*0.26)));
    var sw = Math.min(L,H)*0.032;
    var bx = L*0.082, by = -H*0.042;     // plan arriere, projection oblique
    var flo = (e===5) ? -H*0.055 : 0;    // l'armature lumineuse ne touche pas le sol

    var lv = [], px = [], ph = [];
    for(k=0;k<nl;k++) lv.push(flo-(top+flo)*(k+1)/nl);
    for(i=0;i<np;i++){
      px.push(-hw + 2*hw*(i/(np-1)) + (al(i*7+3)-0.5)*L*0.030);
      var hi = Math.max(-top*1.03, -top*(0.88+0.15*al(i*5+11))*(1-0.30*a*al(i*3+2)));
      // Un montant sur deux tient au moins le premier niveau : il reste toujours un vestige.
      ph.push(i%2 ? hi : Math.min(hi, lv[0]-sw*0.6));
    }
    // Le balancement croit avec la hauteur : le pied reste plante.
    function sxo(y){ return Math.sin(t*0.42+al(4)*6.2832)*L*0.008*Math.pow(Math.min(1,Math.abs(y)/(top+1e-6)),1.7); }
    function bob(n){ return (e===5) ? Math.sin(t*0.5+al(n*13+7)*6.2832)*H*0.016 : 0; }

    var glow = [];

    function bar(x1,y1,x2,y2,w,g,kk,spec){
      var dx = x2-x1, dy = y2-y1, ln = Math.sqrt(dx*dx+dy*dy);
      if(ln < 1e-6) return;
      var nx = dy/ln, ny = -dx/ln;
      if(nx*0.66 - ny*0.75 < 0){ nx = -nx; ny = -ny; }
      var h = w*0.5;
      c.beginPath();
      c.moveTo(x1+nx*h,y1+ny*h); c.lineTo(x2+nx*h,y2+ny*h);
      c.lineTo(x2-nx*h,y2-ny*h); c.lineTo(x1-nx*h,y1-ny*h); c.closePath();
      c.fillStyle = K(g,0.80*kk); c.fill();
      c.strokeStyle = K(g,0.34*kk); c.lineWidth = Math.max(0.35,w*0.13); c.stroke();
      c.beginPath();
      c.moveTo(x1+nx*h,y1+ny*h); c.lineTo(x2+nx*h,y2+ny*h);
      c.lineTo(x2+nx*h*0.12,y2+ny*h*0.12); c.lineTo(x1+nx*h*0.12,y1+ny*h*0.12); c.closePath();
      c.fillStyle = K(g,1.32*kk); c.fill();
      if(spec){
        c.strokeStyle = K(g,1.70*kk,0.75); c.lineWidth = Math.max(0.3,w*0.14);
        c.beginPath(); c.moveTo(x1+nx*h*0.55,y1+ny*h*0.55); c.lineTo(x2+nx*h*0.55,y2+ny*h*0.55); c.stroke();
      }
    }
    function pole(x1,y1,x2,y2,w,g,kk,sd){
      var mx = (x1+x2)*0.5 + (al(sd)-0.5)*w*3.4, my = (y1+y2)*0.5;
      c.lineCap = 'round';
      c.strokeStyle = K(g,0.34*kk); c.lineWidth = w*1.30;
      c.beginPath(); c.moveTo(x1,y1); c.quadraticCurveTo(mx,my,x2,y2); c.stroke();
      c.strokeStyle = K(g,0.78*kk); c.lineWidth = w;
      c.beginPath(); c.moveTo(x1,y1); c.quadraticCurveTo(mx,my,x2,y2); c.stroke();
      c.strokeStyle = K(g,1.30*kk); c.lineWidth = w*0.30;
      c.beginPath(); c.moveTo(x1+w*0.22,y1-w*0.22);
      c.quadraticCurveTo(mx+w*0.22,my-w*0.22,x2+w*0.22,y2-w*0.22); c.stroke();
    }
    function member(x1,y1,x2,y2,w,g,kk,sd){
      if(e===0) pole(x1,y1,x2,y2,w,g,kk,sd);
      else bar(x1,y1,x2,y2,w,g,kk,(e===3||e===4));
      if(e===5) glow.push([x1,y1,x2,y2,w,kk]);
    }
    function joint(x,y,w,kk){
      if(e<=1){
        c.strokeStyle = K(TIE,0.95*kk); c.lineWidth = Math.max(0.4,w*0.34); c.lineCap='round';
        c.beginPath();
        c.moveTo(x-w*0.75,y-w*0.40); c.lineTo(x+w*0.75,y+w*0.40);
        c.moveTo(x-w*0.75,y+w*0.40); c.lineTo(x+w*0.75,y-w*0.40);
        c.stroke();
      } else if(e===2){
        c.fillStyle = K(TIE,0.70*kk);
        c.beginPath(); c.arc(x,y,w*0.30,0,6.2832); c.fill();
      } else if(e===3 || e===4){
        c.fillStyle = K(TIE,1.0*kk);
        c.beginPath(); c.arc(x,y,w*0.46,0,6.2832); c.fill();
        c.fillStyle = K(TIE,1.55*kk);
        c.beginPath(); c.arc(x+w*0.13,y-w*0.13,w*0.19,0,6.2832); c.fill();
      }
    }

    function plane(ox,oy,kk,front){
      for(i=0;i<np;i++){
        var x = px[i]+ox;
        if(e===5){
          for(j=0;j<nl;j++){
            var ya = (j===0 ? flo : lv[j-1]+bob(j-1)) + oy;
            var yb = lv[j]+bob(j) + oy;
            if(lv[j] < ph[i]) continue;
            member(x+sxo(ya),ya+(yb-ya)*0.10, x+sxo(yb),yb-(yb-ya)*0.06, sw*0.75, MAT, kk, i*3+j);
          }
        } else {
          // Le montant penche : on remonte le pied du creux que prend son angle.
          var tl = Math.abs(sxo(ph[i])-sxo(0))/(Math.abs(ph[i])||1);
          member(x+sxo(0),oy-sw*0.60*tl, x+sxo(ph[i]),ph[i]+oy, sw, MAT, kk, i*3+1);
        }
      }
      for(j=0;j<nl;j++){
        var yr = lv[j]+bob(j), y = yr+oy;
        for(i=0;i<np-1;i++){
          if(ph[i] > yr || ph[i+1] > yr) continue;
          if(al(j*29+i*7+5) < a*0.55) continue;
          member(px[i]+ox+sxo(yr), y, px[i+1]+ox+sxo(yr), y, sw*0.78, MAT, kk, j*11+i+40);
          if(front){
            joint(px[i]+ox+sxo(yr), y, sw, kk);
            joint(px[i+1]+ox+sxo(yr), y, sw, kk);
          }
        }
        // Boulins : les bouts qui depassent cassent la grille reguliere.
        if(front && al(j*19+9) > 0.35+a*0.4){
          var xe = px[np-1]+ox+sxo(yr);
          member(xe-sw, y, xe+L*0.055, y-H*0.006, sw*0.62, MAT, kk, j*7+3);
        }
      }
    }

    function deck(){
      for(j=0;j<nl;j++){
        var yr = lv[j]+bob(j);
        for(b=0;b<np-1;b++){
          if(al(j*23+b*5+1) < a*0.95) continue;
          if(ph[b] > yr || ph[b+1] > yr) continue;
          var x1 = px[b]+sxo(yr)-sw*0.4-al(j*13+b)*L*0.012;
          var x2 = px[b+1]+sxo(yr)+sw*0.4+al(j*13+b+21)*L*0.014;
          var n = 3;
          for(var q=0;q<n;q++){
            if(a>0.25 && al(j*41+b*9+q*3+2) < (a-0.25)*0.9) continue;
            var u0 = q/n, u1 = (q+1)/n-0.05;
            var jx = (al(j*17+b*5+q)-0.5)*L*0.010;
            var ax = bx*u0, ay = by*u0, cx = bx*u1, cy = by*u1;
            c.beginPath();
            c.moveTo(x1+ax+jx, yr+ay); c.lineTo(x2+ax+jx, yr+ay);
            c.lineTo(x2+cx+jx, yr+cy); c.lineTo(x1+cx+jx, yr+cy);
            c.closePath();
            c.fillStyle = K(PLK, (1.10-0.30*u0)*(e===5?0.9:1), e===5?0.55:1);
            c.fill();
            c.strokeStyle = K(PLK,0.42); c.lineWidth = Math.max(0.3,sw*0.14); c.stroke();
            if(q===0){
              c.fillStyle = K(PLK,0.55);
              c.fillRect(x1+jx, yr, (x2-x1), sw*0.42);   // chant de la planche de rive
            }
          }
        }
      }
    }

    function braces(){
      if(e===5) return;
      for(j=0;j<nl;j++){
        var y2 = lv[j]+bob(j), y1 = (j ? lv[j-1]+bob(j-1) : flo-sw*0.45);
        for(b=0;b<np-1;b++){
          if(al(j*31+b*13+7) < 0.28+a*0.62) continue;
          if(ph[b] > y2 || ph[b+1] > y2) continue;
          var up = ((b+j)%2 === 0);
          var xA = (up?px[b]:px[b+1])+sxo(y1), xB = (up?px[b+1]:px[b])+sxo(y2);
          member(xA,y1, xB,y2, sw*0.60, MAT, 0.92, b*17+j+70);
        }
      }
    }

    function ladder(x0,y0,x1,y1){
      var dx = x1-x0, dy = y1-y0, ln = Math.sqrt(dx*dx+dy*dy);
      if(ln<1e-6) return;
      var off = sw*1.4;
      var nx = dy/ln*off, ny = -dx/ln*off;
      // Le montant incline sortirait sous le sol : on enfonce le pied d'autant.
      var over = y0+Math.abs(ny)+sw*0.4;
      if(over > 0){
        y0 -= over; dy = y1-y0; ln = Math.sqrt(dx*dx+dy*dy);
        nx = dy/ln*off; ny = -dx/ln*off;
      }
      member(x0+nx,y0+ny, x1+nx,y1+ny, sw*0.55, MAT, 1.0, 91);
      member(x0-nx,y0-ny, x1-nx,y1-ny, sw*0.55, MAT, 1.0, 92);
      var rn = Math.max(3, Math.round(ln/(sw*3.2)));
      for(var r=1;r<rn;r++){
        var u = r/rn;
        bar(x0+dx*u+nx, y0+dy*u+ny, x0+dx*u-nx, y0+dy*u-ny, sw*0.34, PLK, 1.0, false);
      }
    }

    function net(){
      var yt = lv[Math.min(nl-1,1)], yb = flo;
      var xa = px[0]+sxo(yt), xb = px[Math.min(np-1,1)]+sxo(yt);
      var hh = yb-yt;
      c.save();
      c.beginPath(); c.moveTo(xa,yb); c.lineTo(xb,yb); c.lineTo(xb,yt); c.lineTo(xa,yt); c.closePath();
      c.fillStyle = K(TIE,1.0,0.13); c.fill();
      c.strokeStyle = K(TIE,1.35,0.60); c.lineWidth = Math.max(0.3,sw*0.13);
      var st = Math.max(sw*0.8, L*0.026);
      c.beginPath();
      // Mailles en losange bornees a la nappe : pas de trait qui deborde.
      for(var g2=-Math.ceil(hh/st)-1; g2<Math.ceil((xb-xa)/st)+2; g2++){
        var xs = xa+g2*st;
        var a1 = Math.max(yt, yb-(xb-xs)), b1 = Math.min(yb, yb-(xa-xs));
        if(a1 < b1){ c.moveTo(xs+(yb-a1),a1); c.lineTo(xs+(yb-b1),b1); }
        var a2 = Math.max(yt, yb-(xs-xa)), b2 = Math.min(yb, yb-(xs-xb));
        if(a2 < b2){ c.moveTo(xs-(yb-a2),a2); c.lineTo(xs-(yb-b2),b2); }
      }
      c.stroke();
      c.restore();
    }

    function hoist(){
      var yr = lv[nl-1]+bob(nl-1);
      var hx = px[np-1]+sxo(yr)-L*0.02;
      var sway = Math.sin(t*0.55)*0.14;
      var rl = Math.min(H*0.30, L*0.30, -yr-H*0.10-sw*3);
      if(rl < H*0.05) return;
      var lx = hx+Math.sin(sway)*rl, ly = yr+Math.cos(sway)*rl;
      c.strokeStyle = K(TIE, e>=3?0.9:1.0); c.lineWidth = Math.max(0.4,sw*0.26); c.lineCap='round';
      c.beginPath(); c.moveTo(hx,yr); c.lineTo(lx,ly); c.stroke();
      if(e<=1){
        bar(lx-L*0.035,ly+sw*0.9, lx+L*0.035,ly+sw*0.9, sw*2.0, PLK, 0.95, false);
      } else if(e===2 || e===3){
        bar(lx-L*0.030,ly+sw*1.1, lx+L*0.030,ly+sw*1.1, sw*2.4, MAT, 0.9, e===3);
      } else if(e===4){
        bar(lx-L*0.034,ly+sw*1.2, lx+L*0.034,ly+sw*1.2, sw*2.2, PLK, 1.0, false);
      }
    }

    // Trois disques concentriques : un halo qui s'eteint, sans degrade a construire.
    function halo(x,y,r,col,a){
      var q;
      for(q=0;q<3;q++){
        c.fillStyle = 'rgba('+col+','+(a*[0.30,0.34,0.40][q]).toFixed(3)+')';
        c.beginPath(); c.arc(x,y,r*[1,0.62,0.32][q],0,6.2832); c.fill();
      }
    }

    function pile(){
      var n = Math.round(1+5*rest);
      var bxw = L*0.052, bhh = H*0.026;
      for(i=0;i<n;i++){
        var row = i%3, lay = (i/3)|0;
        var x = -hw*0.98 + row*bxw*1.08 + lay*bxw*0.30 + (al(i*9+5)-0.5)*L*0.006;
        var y = -lay*bhh*1.05;
        bar(x, y-bhh*0.5, x+bxw*0.92, y-bhh*0.5, bhh, PLK, 0.95, e>=3);
      }
    }

    // ---------- rendu ----------
    c.save();
    c.lineJoin = 'round';

    if(e!==5){
      c.fillStyle = om(10,8,6, 0.28*(1-0.45*nu));
      for(i=0;i<np;i++){
        c.beginPath();
        c.ellipse(px[i]+bx*0.4, -sw*0.64, sw*1.9, sw*0.62, 0, 0, 6.2832);
        c.fill();
      }
    } else {
      c.save(); c.globalCompositeOperation='lighter';
      c.fillStyle = 'rgba(70,190,255,0.10)';
      c.beginPath(); c.ellipse(bx*0.4, -H*0.032, hw*1.1, H*0.030, 0, 0, 6.2832); c.fill();
      c.restore();
    }

    plane(bx, by, 0.58, false);
    deck();
    plane(0, 0, 1.0, true);
    braces();

    if((e===1 || e===2) && a<0.88 && nl>0){
      var lyr = lv[0]+bob(0);
      ladder(px[np-2]+L*0.02, flo-sw*0.7, px[np-2]-L*0.02, lyr+sw);
      if(nl>2 && a<0.55) ladder(px[1]-L*0.02, lv[1], px[1]+L*0.02, lv[2]+sw);
    }
    if(e===4 && a<0.72 && nl>1) net();
    if(a<0.82 && nl>0) hoist();
    pile();

    if(e===5 && glow.length){
      c.save(); c.globalCompositeOperation='lighter';
      c.lineCap = 'round';
      for(i=0;i<glow.length;i++){
        var G = glow[i];
        c.strokeStyle = 'rgba(70,200,255,'+(0.16*G[5]).toFixed(3)+')';
        c.lineWidth = G[4]*2.6;
        c.beginPath(); c.moveTo(G[0],G[1]); c.lineTo(G[2],G[3]); c.stroke();
        c.strokeStyle = 'rgba(200,245,255,'+(0.55*G[5]).toFixed(3)+')';
        c.lineWidth = G[4]*0.30;
        c.beginPath(); c.moveTo(G[0],G[1]); c.lineTo(G[2],G[3]); c.stroke();
      }
      c.restore();
    }

    if(nu > 0.05 && nl > 0){
      var lamps = (nl>2) ? 2 : 1;
      for(i=0;i<lamps;i++){
        var lj = (i===0) ? nl-1 : Math.max(0,nl-3);
        // La lampe redescend si sa flamme sortirait de l'encombrement annonce.
        var lyy = Math.max(lv[lj]+bob(lj), -H*1.06+7.6*sw);
        var lxx = (i===0 ? px[np-1] : px[0]) + sxo(lyy) + (i===0 ? -L*0.03 : L*0.03);
        var cw = Math.min(sw*7.0, L*0.085);
        var flick = 0.82+0.18*Math.sin(t*(1.7+i*0.6)+al(i*31+3)*6.2832);
        if(e<=2){
          bar(lxx-sw*1.1, lyy-sw*2.1, lxx+sw*1.1, lyy-sw*2.1, sw*1.4, MAT, 0.75, false);
          bar(lxx, lyy-sw*0.4, lxx, lyy-sw*2.0, sw*0.7, MAT, 0.6, false);
          c.save(); c.globalCompositeOperation='lighter';
          halo(lxx, lyy-sw*3.0, sw*5.0*flick, '255,168,70', 0.34*nu*flick);
          c.fillStyle = 'rgba(255,226,168,'+(0.90*nu*flick).toFixed(3)+')';
          c.beginPath();
          c.moveTo(lxx-sw*0.8, lyy-sw*2.5);
          c.quadraticCurveTo(lxx-sw*0.3, lyy-sw*3.8, lxx+sw*0.1, lyy-sw*4.9*flick);
          c.quadraticCurveTo(lxx+sw*1.0, lyy-sw*3.4, lxx+sw*0.8, lyy-sw*2.5);
          c.closePath(); c.fill();
          c.restore();
        } else {
          bar(lxx, lyy-sw*0.4, lxx, lyy-sw*1.8, sw*0.5, MAT, 0.8, true);
          bar(lxx-sw*0.9, lyy-sw*2.0, lxx+sw*0.9, lyy-sw*2.0, sw*1.1, MAT, 0.9, true);
          c.save(); c.globalCompositeOperation='lighter';
          var lc2 = (e===5) ? '150,235,255' : '255,238,190';
          c.fillStyle = 'rgba('+lc2+','+(0.14*nu*flick).toFixed(3)+')';
          c.beginPath();
          c.moveTo(lxx-sw*0.9, lyy-sw*1.9); c.lineTo(lxx+sw*0.9, lyy-sw*1.9);
          var cby = Math.min(H*0.24, -lyy-H*0.012);
          c.lineTo(lxx+cw, lyy+cby); c.lineTo(lxx-cw, lyy+cby);
          c.closePath(); c.fill();
          halo(lxx, lyy-sw*1.8, sw*2.6, lc2, 0.55*nu*flick);
          c.restore();
        }
      }
    }

    c.restore();
  }

  /* Ère nomade (~-30000) : campement de chasseurs-cueilleurs.
     Rien ne tient debout tout seul : des perches appuyées, des peaux jetées
     dessus, des pierres pour lester. Origine (0,0) au sol, y négatif vers le haut. */

  function batNom(c, L, H, om, al, nuit, t){
    c.save();
    c.lineJoin = "round";
    c.lineCap = "round";

    var LX = 0.60, LY = -0.80;                     // lumière : haut-droite
    var i, j, k;

    function cl(v){ return v < 0 ? 0 : (v > 255 ? 255 : v); }
    function lw(v){ return v > 0.55 ? v : 0.55; }

    function contact(cx, cy, rx, ry, a){
      c.beginPath();
      c.ellipse(cx - Math.abs(rx)*0.30, cy, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI*2);
      c.fillStyle = om(26, 21, 17, a);
      c.fill();
    }

    /* Une branche a deux bords courbes et un liseré du côté de la lumière :
       un trait d'épaisseur constante lit comme du fil de fer, pas comme du bois. */
    function branch(x0, y0, x1, y1, w0, w1, bow, r, g, b){
      var dx = x1 - x0, dy = y1 - y0, ln = Math.sqrt(dx*dx + dy*dy) || 1;
      var nx = -dy/ln, ny = dx/ln, wm = (w0 + w1)*0.5;
      var mx = (x0 + x1)*0.5 + nx*bow, my = (y0 + y1)*0.5 + ny*bow;
      c.beginPath();
      c.moveTo(x0 + nx*w0, y0 + ny*w0);
      c.quadraticCurveTo(mx + nx*wm, my + ny*wm, x1 + nx*w1, y1 + ny*w1);
      c.lineTo(x1 - nx*w1, y1 - ny*w1);
      c.quadraticCurveTo(mx - nx*wm, my - ny*wm, x0 - nx*w0, y0 - ny*w0);
      c.closePath();
      c.fillStyle = om(r, g, b);
      c.fill();
      var s = (nx*LX + ny*LY) >= 0 ? 1 : -1;
      c.beginPath();
      c.moveTo(x0 + s*nx*w0*0.55, y0 + s*ny*w0*0.55);
      c.quadraticCurveTo(mx + s*nx*wm*0.55, my + s*ny*wm*0.55, x1 + s*nx*w1*0.55, y1 + s*ny*w1*0.55);
      c.lineWidth = lw(wm*0.62);
      c.strokeStyle = om(cl(r*1.55 + 28), cl(g*1.5 + 24), cl(b*1.45 + 18), 0.7);
      c.stroke();
      c.beginPath();
      c.moveTo(x0 - s*nx*w0*0.68, y0 - s*ny*w0*0.68);
      c.quadraticCurveTo(mx - s*nx*wm*0.68, my - s*ny*wm*0.68, x1 - s*nx*w1*0.68, y1 - s*ny*w1*0.68);
      c.lineWidth = lw(wm*0.52);
      c.strokeStyle = om(r*0.40, g*0.40, b*0.46, 0.8);
      c.stroke();
    }

    function stone(x, yb, rx, ry, sd, r, g, b){
      var cy = yb - ry*0.62, n = 9, P = [], q;
      for (q = 0; q < n; q++){
        var a = q/n*Math.PI*2, kk = 0.74 + al(sd*17 + q)*0.40;
        P.push([x + Math.cos(a)*rx*kk, cy + Math.sin(a)*ry*kk]);
      }
      contact(x, yb, rx*1.20, ry*0.36, 0.32);
      c.beginPath();
      c.moveTo(P[0][0], P[0][1]);
      for (q = 1; q < n; q++) c.lineTo(P[q][0], P[q][1]);
      c.closePath();
      c.fillStyle = om(r, g, b);
      c.fill();
      c.save();
      c.clip();
      c.beginPath();
      c.ellipse(x + rx*0.46, cy - ry*0.54, rx*0.98, ry*0.92, -0.5, 0, Math.PI*2);
      c.fillStyle = om(cl(r*1.38 + 30), cl(g*1.36 + 28), cl(b*1.32 + 26), 0.8);
      c.fill();
      c.beginPath();
      c.ellipse(x - rx*0.55, cy + ry*0.62, rx, ry*0.9, 0.35, 0, Math.PI*2);
      c.fillStyle = om(r*0.42, g*0.44, b*0.50, 0.72);
      c.fill();
      for (q = 0; q < 5; q++){
        var lx = x + (al(sd*31 + q) - 0.5)*rx*1.5;
        var ly = cy + (al(sd*31 + q + 40) - 0.5)*ry*1.5;
        c.beginPath();
        c.ellipse(lx, ly, rx*0.14, ry*0.12, 0, 0, Math.PI*2);
        c.fillStyle = om(cl(r*0.82 + 20), cl(g*0.94 + 24), cl(b*0.68 + 10), 0.32);
        c.fill();
      }
      c.restore();
    }

    /* Ligature : plusieurs tours de tendon serrés en travers du croisement,
       plus deux brins qui pendent à la verticale du monde, pas du repère tourné. */
    function lash(x, y, ang, w, sd){
      var n = 3 + Math.floor(al(sd*7 + 3)*3), q;
      c.save();
      c.translate(x, y);
      c.rotate(ang);
      for (q = 0; q < n; q++){
        var o = (q - (n - 1)*0.5)*w*0.66;
        c.beginPath();
        c.moveTo(o - w*0.18, -w*1.15);
        c.quadraticCurveTo(o + w*0.34, 0, o - w*0.12, w*1.15);
        c.lineWidth = lw(w*0.40);
        c.strokeStyle = om(86, 68, 44);
        c.stroke();
        c.beginPath();
        c.moveTo(o - w*0.24, -w*1.02);
        c.quadraticCurveTo(o + w*0.27, 0, o - w*0.17, w*1.02);
        c.lineWidth = lw(w*0.14);
        c.strokeStyle = om(172, 146, 102, 0.65);
        c.stroke();
      }
      c.restore();
      c.beginPath();
      c.moveTo(x + w*0.4, y + w*0.3);
      c.quadraticCurveTo(x + w*0.9, y + w*1.6, x + w*0.5, y + w*3.0);
      c.lineWidth = lw(w*0.16);
      c.strokeStyle = om(96, 76, 50);
      c.stroke();
    }

    function bone(x, y, len, ang, sd){
      contact(x, y, len*0.52, len*0.07, 0.30);
      c.save();
      c.translate(x, y);
      c.rotate(ang);
      var w = len*0.072, kn = len*0.10, e;
      c.beginPath();
      c.moveTo(-len*0.5, -w);
      c.quadraticCurveTo(0, -w*0.5, len*0.5, -w);
      c.lineTo(len*0.5, w);
      c.quadraticCurveTo(0, w*0.5, -len*0.5, w);
      c.closePath();
      c.fillStyle = om(198, 188, 166);
      c.fill();
      for (e = -1; e <= 1; e += 2){
        c.beginPath();
        c.ellipse(e*len*0.48, -kn*0.55, kn*0.66, kn*0.60, 0, 0, Math.PI*2);
        c.fill();
        c.beginPath();
        c.ellipse(e*len*0.50, kn*0.50, kn*0.62, kn*0.56, 0, 0, Math.PI*2);
        c.fill();
      }
      c.beginPath();
      c.moveTo(-len*0.46, w*0.35);
      c.quadraticCurveTo(0, w*0.9, len*0.46, w*0.35);
      c.lineWidth = lw(w*0.75);
      c.strokeStyle = om(118, 108, 92, 0.7);
      c.stroke();
      c.beginPath();
      c.moveTo(-len*0.38, -w*0.5);
      c.quadraticCurveTo(0, -w*0.9, len*0.38, -w*0.5);
      c.lineWidth = lw(w*0.42);
      c.strokeStyle = om(238, 232, 214, 0.55);
      c.stroke();
      c.restore();
    }

    function tuft(x0, y0, s, sd){
      var n = 4 + Math.floor(al(sd*5 + 1)*4), q;
      for (q = 0; q < n; q++){
        var a = (al(sd*13 + q) - 0.5)*1.6;
        var hg = s*(0.55 + al(sd*13 + q + 30)*0.85);
        c.beginPath();
        c.moveTo(x0, y0);
        c.quadraticCurveTo(x0 + Math.sin(a)*hg*0.35, y0 - hg*0.62, x0 + Math.sin(a)*hg*1.05, y0 - hg);
        c.lineWidth = lw(s*0.11);
        c.strokeStyle = om(128, 118, 76, 0.8);
        c.stroke();
      }
    }

    // ---------- sol ----------
    contact(-L*0.02, -H*0.004, L*0.60, H*0.055, 0.28);
    c.beginPath();
    c.ellipse(L*0.01, -H*0.012, L*0.52, H*0.050, 0, 0, Math.PI*2);
    c.fillStyle = om(122, 106, 80, 0.34);
    c.fill();
    for (i = 0; i < 34; i++){
      var gx = (al(i*3 + 61) - 0.5)*L*1.12;
      var gy = -al(i*3 + 62)*H*0.075;
      var gr = L*0.004 + al(i*3 + 63)*L*0.010;
      c.beginPath();
      c.ellipse(gx, gy, gr, gr*0.46, 0, 0, Math.PI*2);
      c.fillStyle = om(96, 84, 62, 0.42);
      c.fill();
    }
    tuft(-L*0.52, -H*0.055, H*0.075, 3);
    tuft(L*0.50, -H*0.010, H*0.070, 8);
    tuft(L*0.31, -H*0.055, H*0.055, 12);

    // ---------- séchoir à lanières, en retrait ----------
    var dgx0 = -L*0.555, dgx1 = -L*0.415, dgy = -H*0.115;
    var dgTop = -H*0.640, wp = L*0.017;
    branch(dgx0, dgy, dgx0 - L*0.010, dgTop, wp*0.95, wp*0.62, L*0.008, 78, 62, 42);
    branch(dgx1, dgy, dgx1 + L*0.012, dgTop + H*0.012, wp*0.90, wp*0.58, -L*0.006, 74, 58, 40);
    // fourches : chaque perche se termine en Y, c'est ce qui retient la barre
    branch(dgx0 - L*0.010, dgTop, dgx0 - L*0.042, dgTop - H*0.048, wp*0.5, wp*0.28, 0, 82, 66, 44);
    branch(dgx0 - L*0.010, dgTop, dgx0 + L*0.020, dgTop - H*0.040, wp*0.5, wp*0.28, 0, 70, 56, 38);
    branch(dgx1 + L*0.012, dgTop + H*0.012, dgx1 + L*0.044, dgTop - H*0.032, wp*0.48, wp*0.26, 0, 80, 64, 44);
    branch(dgx1 + L*0.012, dgTop + H*0.012, dgx1 - L*0.014, dgTop - H*0.028, wp*0.48, wp*0.26, 0, 68, 54, 36);
    branch(dgx0 - L*0.016, dgTop - H*0.002, dgx1 + L*0.018, dgTop + H*0.010,
           wp*0.55, wp*0.55, H*0.020, 88, 72, 48);
    for (i = 0; i < 9; i++){
      var mf = (i + 0.5)/9;
      var mx = dgx0 - L*0.016 + (dgx1 + L*0.018 - dgx0 + L*0.016)*mf;
      var mby = dgTop - H*0.002 + H*0.012*mf + Math.sin(mf*Math.PI)*H*0.021;
      var mh = H*(0.070 + al(i*3 + 21)*0.062);
      var sw = Math.sin(t*0.52 + al(i*3 + 22)*6.283)*H*0.005;
      c.beginPath();
      c.moveTo(mx - mh*0.10, mby);
      c.quadraticCurveTo(mx - mh*0.16 + sw*0.6, mby + mh*0.55, mx - mh*0.06 + sw, mby + mh);
      c.lineTo(mx + mh*0.05 + sw, mby + mh*0.94);
      c.quadraticCurveTo(mx + mh*0.14 + sw*0.6, mby + mh*0.50, mx + mh*0.10, mby);
      c.closePath();
      c.fillStyle = om(112 + al(i + 70)*30, 48, 38);
      c.fill();
      c.beginPath();
      c.moveTo(mx + mh*0.04 + sw*0.6, mby + mh*0.08);
      c.quadraticCurveTo(mx + mh*0.09 + sw*0.6, mby + mh*0.5, mx + mh*0.02 + sw, mby + mh*0.90);
      c.lineWidth = lw(mh*0.055);
      c.strokeStyle = om(190, 108, 78, 0.6);
      c.stroke();
      c.beginPath();
      c.moveTo(mx - mh*0.07, mby + mh*0.10);
      c.quadraticCurveTo(mx - mh*0.12 + sw*0.6, mby + mh*0.5, mx - mh*0.04 + sw, mby + mh*0.88);
      c.lineWidth = lw(mh*0.05);
      c.strokeStyle = om(52, 22, 18, 0.6);
      c.stroke();
    }
    lash(dgx0 - L*0.012, dgTop + H*0.001, 1.35, wp*0.9, 5);
    lash(dgx1 + L*0.014, dgTop + H*0.012, 1.42, wp*0.85, 9);

    // ---------- ossature de l'abri appuyé ----------
    var gFar = -H*0.075, gNear = -H*0.012;
    var rfx = -L*0.340, rnx = L*0.020;
    var rfy = gFar - H*0.550, rny = gNear - H*0.550;
    var sdx = L*0.420, sdy = H*0.550;              // pente du toit, vers le bas-droite
    var sln = Math.sqrt(sdx*sdx + sdy*sdy);
    var NR = 11, T = [], F = [], VH = [], TP = [];
    for (k = 0; k < NR; k++){
      var uu = -0.05 + (k/(NR - 1))*1.10;
      var tx = rfx + (rnx - rfx)*uu;
      var ty = rfy + (rny - rfy)*uu + (al(k*7 + 3) - 0.5)*H*0.010;
      T.push([tx, ty]);
      F.push([tx + sdx + (al(k*7 + 4) - 0.5)*L*0.050,
              ty + sdy + (al(k*7 + 5) - 0.5)*H*0.011]);
      VH.push(0.87 + al(k*7 + 6)*0.17);
      var ov = H*(0.055 + al(k*7 + 8)*0.075);
      TP.push([tx - sdx/sln*ov, ty - sdy/sln*ov]);
    }
    function pt(kk, v){
      return [T[kk][0] + (F[kk][0] - T[kk][0])*v, T[kk][1] + (F[kk][1] - T[kk][1])*v];
    }

    // pignon du fond : la peau du côté au vent, tournée à l'opposé de la lumière
    c.beginPath();
    c.moveTo(rfx, rfy);
    c.quadraticCurveTo(rfx - L*0.012, gFar - H*0.28, rfx - L*0.004, gFar);
    c.lineTo(F[0][0] - L*0.02, gFar);
    c.quadraticCurveTo((rfx + F[0][0])*0.5 + L*0.02, (rfy + gFar)*0.5 + H*0.030, rfx, rfy);
    c.closePath();
    c.fillStyle = om(88, 71, 54);
    c.fill();
    c.save();
    c.clip();
    var gp = c.createLinearGradient(rfx, rfy, F[0][0], gFar);
    gp.addColorStop(0, om(120, 98, 74, 0.55));
    gp.addColorStop(0.6, om(48, 38, 30, 0.30));
    gp.addColorStop(1, om(30, 24, 19, 0.62));
    c.fillStyle = gp;
    c.fillRect(rfx - L*0.05, rfy - H*0.05, L*0.6, H*0.7);
    for (i = 0; i < 3; i++){
      c.beginPath();
      c.moveTo(rfx + L*0.010 + i*L*0.030, rfy + H*0.055 + i*H*0.075);
      c.quadraticCurveTo(rfx + L*0.10 + i*L*0.03, gFar - H*0.20 + i*H*0.03,
                         rfx + L*0.030 + i*L*0.045, gFar);
      c.lineWidth = lw(L*0.006);
      c.strokeStyle = om(52, 42, 32, 0.6);
      c.stroke();
    }
    c.restore();

    // montant du fond, fourche comprise
    branch(rfx, gFar, rfx - L*0.006, rfy + H*0.010, L*0.021, L*0.015, L*0.006, 76, 60, 42);
    branch(rfx - L*0.006, rfy + H*0.012, rfx - L*0.030, rfy - H*0.030, L*0.011, L*0.006, 0, 82, 66, 45);
    branch(rfx - L*0.006, rfy + H*0.012, rfx + L*0.014, rfy - H*0.026, L*0.011, L*0.006, 0, 70, 56, 38);

    // chevrons, du fond vers l'avant : chacun dépasse la faîtière
    for (k = 0; k < NR; k++){
      var dep = 0.62 + 0.38*(k/(NR - 1));          // les proches sont plus contrastés
      branch(TP[k][0], TP[k][1], F[k][0], F[k][1],
             L*0.0125*dep + L*0.003, L*0.009*dep + L*0.002,
             (al(k*7 + 9) - 0.5)*L*0.030,
             64*dep + 14, 51*dep + 12, 36*dep + 10);
    }
    // faîtière posée dans les fourches
    branch(TP[0][0] - L*0.01, rfy + H*0.006, rnx + L*0.030, rny + H*0.004,
           L*0.017, L*0.015, H*0.012, 92, 74, 50);

    // ---------- intérieur du pignon avant : l'ouverture ----------
    c.beginPath();
    c.moveTo(rnx, rny);
    c.lineTo(F[NR - 1][0], gNear);
    c.lineTo(rnx, gNear);
    c.closePath();
    c.fillStyle = om(26, 21, 18);
    c.fill();
    c.save();
    c.clip();
    var gi = c.createLinearGradient(rnx, rny, F[NR - 1][0], gNear);
    gi.addColorStop(0, om(58, 46, 38, 0.75));
    gi.addColorStop(1, om(14, 11, 9, 0.9));
    c.fillStyle = gi;
    c.fillRect(rnx - L*0.02, rny - H*0.02, L*0.5, H*0.62);
    // couche de couchage roulée, et une pierre plate qui cale l'entrée
    c.beginPath();
    c.ellipse(rnx + L*0.115, gNear - H*0.030, L*0.075, H*0.032, -0.12, 0, Math.PI*2);
    c.fillStyle = om(108, 88, 66, 0.9);
    c.fill();
    c.beginPath();
    c.ellipse(rnx + L*0.130, gNear - H*0.040, L*0.062, H*0.020, -0.12, 0, Math.PI*2);
    c.fillStyle = om(146, 122, 92, 0.7);
    c.fill();
    c.beginPath();
    c.ellipse(rnx + L*0.230, gNear - H*0.012, L*0.055, H*0.016, 0.05, 0, Math.PI*2);
    c.fillStyle = om(84, 78, 70, 0.85);
    c.fill();
    c.restore();
    // montant avant, devant l'ombre de l'ouverture
    branch(rnx, gNear, rnx + L*0.005, rny + H*0.010, L*0.023, L*0.016, -L*0.007, 84, 67, 46);
    branch(rnx + L*0.005, rny + H*0.012, rnx - L*0.022, rny - H*0.034, L*0.012, L*0.006, 0, 74, 59, 40);
    branch(rnx + L*0.005, rny + H*0.012, rnx + L*0.026, rny - H*0.028, L*0.012, L*0.006, 0, 92, 74, 50);

    // ---------- peau principale jetée sur les chevrons ----------
    var K0 = 1, K1 = NR - 1, VT = -0.040;
    function hemCtl(kk){
      var a = pt(kk, VH[kk]), b = pt(kk + 1, VH[kk + 1]);
      return [(a[0] + b[0])*0.5 + L*0.004, (a[1] + b[1])*0.5 + H*(0.028 + al(kk*11 + 9)*0.032)];
    }
    c.beginPath();
    var pA = pt(K0, VT);
    c.moveTo(pA[0], pA[1]);
    for (k = K0 + 1; k <= K1; k++){
      var qa = pt(k - 1, VT), qb = pt(k, VT);
      c.quadraticCurveTo((qa[0] + qb[0])*0.5, (qa[1] + qb[1])*0.5 - H*0.014, qb[0], qb[1]);
    }
    var pB = pt(K1, VH[K1]);
    c.lineTo(pB[0], pB[1]);
    for (k = K1 - 1; k >= K0; k--){
      var hc = hemCtl(k), hp = pt(k, VH[k]);
      c.quadraticCurveTo(hc[0], hc[1], hp[0], hp[1]);
    }
    c.closePath();
    c.fillStyle = om(146, 120, 90);
    c.fill();

    c.save();
    c.clip();
    /* Chaque lé sagit entre deux chevrons : creux sombre côté gauche du lé,
       versant éclairé en remontant vers le chevron suivant. */
    for (k = K0; k < K1; k++){
      var a0 = pt(k, VT - 0.06), a1 = pt(k + 1, VT - 0.06);
      var b0 = pt(k, 1.25), b1 = pt(k + 1, 1.25);
      c.beginPath();
      c.moveTo(a0[0], a0[1]);
      c.lineTo(a1[0], a1[1]);
      c.lineTo(b1[0], b1[1]);
      c.lineTo(b0[0], b0[1]);
      c.closePath();
      var vv = al(k*23 + 5);
      c.fillStyle = om(132 + vv*36, 106 + vv*32, 78 + vv*26);
      c.fill();
      var m0 = pt(k, 0.5), m1 = pt(k + 1, 0.5);
      var gs = c.createLinearGradient(m0[0], m0[1], m1[0], m1[1]);
      gs.addColorStop(0, om(40, 30, 22, 0.46));
      gs.addColorStop(0.42, om(40, 30, 22, 0));
      gs.addColorStop(0.58, om(255, 238, 208, 0));
      gs.addColorStop(1, om(255, 238, 208, 0.30));
      c.fillStyle = gs;
      c.fill();
    }
    // arête tendue sur chaque chevron
    for (k = K0; k <= K1; k++){
      var r0 = pt(k, VT), r1 = pt(k, VH[k] + 0.02);
      c.beginPath();
      c.moveTo(r0[0], r0[1]);
      c.lineTo(r1[0], r1[1]);
      c.lineWidth = lw(L*0.016);
      c.strokeStyle = om(214, 186, 148, 0.35);
      c.stroke();
      c.lineWidth = lw(L*0.006);
      c.strokeStyle = om(238, 214, 178, 0.30);
      c.stroke();
    }
    // coutures entre peaux, avec leurs points
    for (j = 0; j < 2; j++){
      var vs = 0.30 + j*0.30;
      c.beginPath();
      var s0 = pt(K0, vs);
      c.moveTo(s0[0], s0[1]);
      for (k = K0 + 1; k <= K1; k++){
        var sp = pt(k, vs + (al(k*13 + j*7) - 0.5)*0.05);
        var spm = pt(k - 0.5 < K0 ? K0 : k - 1, vs);
        c.quadraticCurveTo((spm[0] + sp[0])*0.5, (spm[1] + sp[1])*0.5 + H*0.012, sp[0], sp[1]);
      }
      c.lineWidth = lw(L*0.005);
      c.strokeStyle = om(72, 56, 40, 0.55);
      c.stroke();
      for (k = K0; k <= K1; k++){
        var tk = pt(k, vs);
        c.beginPath();
        c.moveTo(tk[0] - L*0.008, tk[1] - H*0.006);
        c.lineTo(tk[0] + L*0.006, tk[1] + H*0.008);
        c.lineWidth = lw(L*0.004);
        c.strokeStyle = om(196, 172, 132, 0.6);
        c.stroke();
      }
    }
    // le bas de la peau ne reçoit plus le ciel
    var lo0 = pt(5, 0.35), lo1 = pt(5, 1.10);
    var ga = c.createLinearGradient(lo0[0], lo0[1], lo1[0], lo1[1]);
    ga.addColorStop(0, om(28, 22, 17, 0));
    ga.addColorStop(1, om(28, 22, 17, 0.50));
    c.fillStyle = ga;
    c.fillRect(-L*0.6, -H*1.2, L*1.2, H*1.2);
    c.restore();

    // ourlet roulé
    c.beginPath();
    var e0 = pt(K1, VH[K1]);
    c.moveTo(e0[0], e0[1]);
    for (k = K1 - 1; k >= K0; k--){
      var ec = hemCtl(k), ep = pt(k, VH[k]);
      c.quadraticCurveTo(ec[0], ec[1], ep[0], ep[1]);
    }
    c.lineWidth = lw(L*0.010);
    c.strokeStyle = om(104, 82, 60);
    c.stroke();
    c.lineWidth = lw(L*0.004);
    c.strokeStyle = om(206, 176, 136, 0.45);
    c.stroke();

    // ---------- petite peau rapportée sur les deux chevrons du fond ----------
    var q0 = pt(0, 0.05), q1 = pt(2, 0.02), q2 = pt(2, 0.46), q3 = pt(0, 0.52);
    c.beginPath();
    c.moveTo(q0[0], q0[1]);
    c.quadraticCurveTo((q0[0] + q1[0])*0.5, (q0[1] + q1[1])*0.5 - H*0.012, q1[0], q1[1]);
    c.lineTo(q2[0], q2[1]);
    c.quadraticCurveTo((q2[0] + q3[0])*0.5, (q2[1] + q3[1])*0.5 + H*0.038, q3[0], q3[1]);
    c.closePath();
    c.fillStyle = om(118, 98, 76);
    c.fill();
    c.save();
    c.clip();
    var gq = c.createLinearGradient(q0[0], q0[1], q2[0], q2[1]);
    gq.addColorStop(0, om(216, 190, 152, 0.35));
    gq.addColorStop(0.55, om(60, 48, 36, 0.10));
    gq.addColorStop(1, om(30, 24, 18, 0.55));
    c.fillStyle = gq;
    c.fillRect(-L*0.6, -H*1.2, L*1.2, H*1.2);
    for (i = 0; i < 26; i++){
      var fx = q0[0] + (al(i*3 + 41))*(q2[0] - q3[0] + L*0.10) + (al(i*3 + 43) - 0.5)*L*0.10;
      var fy = q0[1] + al(i*3 + 42)*(q3[1] - q0[1] + H*0.10);
      c.beginPath();
      c.moveTo(fx, fy);
      c.lineTo(fx + L*0.012, fy + H*0.020);
      c.lineWidth = lw(L*0.004);
      c.strokeStyle = om(178, 152, 116, 0.35);
      c.stroke();
    }
    c.restore();

    // ligatures aux croisements visibles
    for (k = 0; k < NR; k += 3){
      var ang = Math.atan2(F[k][1] - T[k][1], F[k][0] - T[k][0]);
      lash(T[k][0], T[k][1], ang, L*0.014, k + 2);
    }

    // ---------- pierres de lestage sur l'ourlet ----------
    for (k = K0; k < K1; k++){
      var hc2 = hemCtl(k);
      var sr = L*(0.024 + al(k*19 + 2)*0.020);
      stone(hc2[0], hc2[1] + H*0.010, sr, sr*0.78, k + 30, 122, 116, 106);
    }
    stone(F[0][0] - L*0.03, gFar + H*0.004, L*0.030, L*0.024, 51, 116, 110, 100);
    stone(F[NR - 1][0] + L*0.045, gNear - H*0.002, L*0.034, L*0.026, 57, 128, 120, 108);

    // ---------- foyer froid, au premier plan ----------
    var hx = -L*0.165, hy = 0, hrx = L*0.140, hry = H*0.045;
    contact(hx, hy + H*0.002, hrx*1.15, hry*0.55, 0.22);
    c.beginPath();
    c.ellipse(hx, hy - hry*0.34, hrx*0.86, hry*0.80, 0, 0, Math.PI*2);
    c.fillStyle = om(104, 98, 92);
    c.fill();
    c.beginPath();
    c.ellipse(hx + hrx*0.16, hy - hry*0.44, hrx*0.52, hry*0.44, 0, 0, Math.PI*2);
    c.fillStyle = om(158, 152, 146, 0.7);
    c.fill();
    for (i = 0; i < 12; i++){
      var cx2 = hx + (al(i*3 + 81) - 0.5)*hrx*1.5;
      var cy2 = hy - hry*0.34 + (al(i*3 + 82) - 0.5)*hry*1.2;
      var cr2 = hrx*(0.045 + al(i*3 + 83)*0.070);
      c.beginPath();
      c.ellipse(cx2, cy2, cr2, cr2*0.6, al(i + 90)*3, 0, Math.PI*2);
      c.fillStyle = om(34, 30, 28, 0.85);
      c.fill();
    }
    branch(hx - hrx*0.55, hy - hry*0.55, hx + hrx*0.30, hy - hry*0.75, L*0.008, L*0.005, 0, 46, 40, 36);
    branch(hx - hrx*0.10, hy - hry*0.30, hx + hrx*0.70, hy - hry*0.60, L*0.007, L*0.004, 0, 38, 33, 30);
    for (i = 0; i < 9; i++){
      var fa = Math.PI*2*(i/9) + 0.25;
      var fsx = hx + Math.cos(fa)*hrx;
      var fsy = hy - hry*0.34 + Math.sin(fa)*hry;
      var fr = hrx*(0.16 + al(i*5 + 71)*0.10);
      stone(fsx, fsy + fr*0.5, fr, fr*0.80, i + 60, 138, 130, 118);
    }

    // ---------- panier tressé ----------
    var bx = -L*0.430, by = -H*0.028, bw = L*0.085, bh = H*0.140;
    contact(bx, by, bw*0.95, bh*0.14, 0.34);
    c.beginPath();
    c.moveTo(bx - bw*0.72, by - bh);
    c.quadraticCurveTo(bx - bw*0.98, by - bh*0.45, bx - bw*0.62, by - bh*0.05);
    c.quadraticCurveTo(bx, by + bh*0.09, bx + bw*0.62, by - bh*0.05);
    c.quadraticCurveTo(bx + bw*0.98, by - bh*0.45, bx + bw*0.72, by - bh);
    c.closePath();
    c.fillStyle = om(150, 122, 76);
    c.fill();
    c.save();
    c.clip();
    var gb = c.createLinearGradient(bx - bw, by, bx + bw, by);
    gb.addColorStop(0, om(44, 34, 20, 0.55));
    gb.addColorStop(0.45, om(44, 34, 20, 0));
    gb.addColorStop(0.62, om(255, 238, 190, 0));
    gb.addColorStop(1, om(255, 238, 190, 0.34));
    c.fillStyle = gb;
    c.fillRect(bx - bw*1.2, by - bh*1.3, bw*2.4, bh*1.6);
    for (i = 0; i < 8; i++){
      var cy3 = by - bh*0.06 - i*bh*0.125;
      c.beginPath();
      c.moveTo(bx - bw, cy3);
      c.quadraticCurveTo(bx, cy3 + bh*0.055, bx + bw, cy3);
      c.lineWidth = lw(bh*0.030);
      c.strokeStyle = om(74, 58, 34, 0.6);
      c.stroke();
    }
    for (i = 0; i < 11; i++){
      var vx = bx - bw*0.85 + i*bw*1.7/10;
      c.beginPath();
      c.moveTo(vx, by);
      c.lineTo(vx + (vx - bx)*0.12, by - bh);
      c.lineWidth = lw(bw*0.055);
      c.strokeStyle = om(178, 148, 96, 0.35);
      c.stroke();
    }
    c.restore();
    c.beginPath();
    c.ellipse(bx, by - bh, bw*0.72, bh*0.10, 0, 0, Math.PI*2);
    c.fillStyle = om(64, 50, 30);
    c.fill();
    c.beginPath();
    c.ellipse(bx, by - bh*1.015, bw*0.72, bh*0.095, 0, 0, Math.PI*2);
    c.fillStyle = om(168, 138, 88);
    c.fill();
    c.beginPath();
    c.ellipse(bx, by - bh*1.015, bw*0.72, bh*0.095, 0, 0, Math.PI*2);
    c.lineWidth = lw(bw*0.06);
    c.strokeStyle = om(96, 76, 46, 0.7);
    c.stroke();

    // ---------- os et éclats, au sol ----------
    bone(L*0.115, -H*0.004, L*0.135, -0.16, 4);
    bone(-L*0.030, -H*0.002, L*0.098, 0.34, 11);
    bone(L*0.400, -H*0.001, L*0.078, -0.62, 17);
    for (i = 0; i < 7; i++){
      var kx = L*(0.245 + al(i*3 + 91)*0.130);
      var ky = -H*al(i*3 + 92)*0.020;
      var kr = L*(0.006 + al(i*3 + 93)*0.010);
      c.beginPath();
      c.moveTo(kx - kr, ky);
      c.lineTo(kx + kr*0.4, ky - kr*1.5);
      c.lineTo(kx + kr, ky - kr*0.2);
      c.closePath();
      c.fillStyle = om(96, 104, 110, 0.9);
      c.fill();
      c.beginPath();
      c.moveTo(kx + kr*0.4, ky - kr*1.5);
      c.lineTo(kx + kr, ky - kr*0.2);
      c.lineWidth = lw(kr*0.5);
      c.strokeStyle = om(178, 190, 198, 0.6);
      c.stroke();
    }

    c.restore();
  }


  function monNom(c, L, H, om, al, nuit, t){
    c.save();
    c.lineJoin = "round";
    c.lineCap = "round";

    var LX = 0.60, LY = -0.80;
    var i, k, s;
    var nu = nuit < 0 ? 0 : (nuit > 1 ? 1 : nuit);
    var fl = 0.86 + 0.09*Math.sin(t*7.3) + 0.05*Math.sin(t*13.1 + 1.4);   // battement du feu

    function cl(v){ return v < 0 ? 0 : (v > 255 ? 255 : v); }
    function lw(v){ return v > 0.55 ? v : 0.55; }

    function contact(cx, cy, rx, ry, a){
      c.beginPath();
      c.ellipse(cx - Math.abs(rx)*0.30, cy, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI*2);
      c.fillStyle = om(26, 21, 17, a);
      c.fill();
    }

    function branch(x0, y0, x1, y1, w0, w1, bow, r, g, b){
      var dx = x1 - x0, dy = y1 - y0, ln = Math.sqrt(dx*dx + dy*dy) || 1;
      var nx = -dy/ln, ny = dx/ln, wm = (w0 + w1)*0.5;
      var mx = (x0 + x1)*0.5 + nx*bow, my = (y0 + y1)*0.5 + ny*bow;
      c.beginPath();
      c.moveTo(x0 + nx*w0, y0 + ny*w0);
      c.quadraticCurveTo(mx + nx*wm, my + ny*wm, x1 + nx*w1, y1 + ny*w1);
      c.lineTo(x1 - nx*w1, y1 - ny*w1);
      c.quadraticCurveTo(mx - nx*wm, my - ny*wm, x0 - nx*w0, y0 - ny*w0);
      c.closePath();
      c.fillStyle = om(r, g, b);
      c.fill();
      var sg = (nx*LX + ny*LY) >= 0 ? 1 : -1;
      c.beginPath();
      c.moveTo(x0 + sg*nx*w0*0.55, y0 + sg*ny*w0*0.55);
      c.quadraticCurveTo(mx + sg*nx*wm*0.55, my + sg*ny*wm*0.55, x1 + sg*nx*w1*0.55, y1 + sg*ny*w1*0.55);
      c.lineWidth = lw(wm*0.62);
      c.strokeStyle = om(cl(r*1.55 + 28), cl(g*1.5 + 24), cl(b*1.45 + 18), 0.7);
      c.stroke();
      c.beginPath();
      c.moveTo(x0 - sg*nx*w0*0.68, y0 - sg*ny*w0*0.68);
      c.quadraticCurveTo(mx - sg*nx*wm*0.68, my - sg*ny*wm*0.68, x1 - sg*nx*w1*0.68, y1 - sg*ny*w1*0.68);
      c.lineWidth = lw(wm*0.52);
      c.strokeStyle = om(r*0.40, g*0.40, b*0.46, 0.8);
      c.stroke();
    }

    function stone(x, yb, rx, ry, sd, r, g, b){
      var cy = yb - ry*0.62, n = 9, P = [], q;
      for (q = 0; q < n; q++){
        var a = q/n*Math.PI*2, kk = 0.74 + al(sd*17 + q)*0.40;
        P.push([x + Math.cos(a)*rx*kk, cy + Math.sin(a)*ry*kk]);
      }
      contact(x, yb, rx*1.20, ry*0.36, 0.32);
      c.beginPath();
      c.moveTo(P[0][0], P[0][1]);
      for (q = 1; q < n; q++) c.lineTo(P[q][0], P[q][1]);
      c.closePath();
      c.fillStyle = om(r, g, b);
      c.fill();
      c.save();
      c.clip();
      c.beginPath();
      c.ellipse(x + rx*0.46, cy - ry*0.54, rx*0.98, ry*0.92, -0.5, 0, Math.PI*2);
      c.fillStyle = om(cl(r*1.38 + 30), cl(g*1.36 + 28), cl(b*1.32 + 26), 0.8);
      c.fill();
      c.beginPath();
      c.ellipse(x - rx*0.55, cy + ry*0.62, rx, ry*0.9, 0.35, 0, Math.PI*2);
      c.fillStyle = om(r*0.42, g*0.44, b*0.50, 0.72);
      c.fill();
      for (q = 0; q < 4; q++){
        var lx = x + (al(sd*31 + q) - 0.5)*rx*1.5;
        var ly = cy + (al(sd*31 + q + 40) - 0.5)*ry*1.5;
        c.beginPath();
        c.ellipse(lx, ly, rx*0.14, ry*0.12, 0, 0, Math.PI*2);
        c.fillStyle = om(cl(r*0.82 + 20), cl(g*0.94 + 24), cl(b*0.68 + 10), 0.32);
        c.fill();
      }
      c.restore();
    }

    function lash(x, y, ang, w, sd, tails){
      var n = 4 + Math.floor(al(sd*7 + 3)*4), q;
      c.save();
      c.translate(x, y);
      c.rotate(ang);
      for (q = 0; q < n; q++){
        var o = (q - (n - 1)*0.5)*w*0.64;
        c.beginPath();
        c.moveTo(o - w*0.18, -w*1.20);
        c.quadraticCurveTo(o + w*0.34, 0, o - w*0.12, w*1.20);
        c.lineWidth = lw(w*0.40);
        c.strokeStyle = om(86, 68, 44);
        c.stroke();
        c.beginPath();
        c.moveTo(o - w*0.24, -w*1.06);
        c.quadraticCurveTo(o + w*0.27, 0, o - w*0.17, w*1.06);
        c.lineWidth = lw(w*0.14);
        c.strokeStyle = om(172, 146, 102, 0.65);
        c.stroke();
      }
      c.restore();
      for (q = 0; q < (tails || 0); q++){
        var sway = Math.sin(t*0.6 + q*2.1 + al(sd*5 + q)*6.283)*w*0.5;
        c.beginPath();
        c.moveTo(x + (q - 0.5)*w*0.8, y + w*0.5);
        c.quadraticCurveTo(x + (q - 0.5)*w*0.8 + sway, y + w*2.4,
                           x + (q - 0.5)*w*0.8 + sway*1.6, y + w*4.6);
        c.lineWidth = lw(w*0.16);
        c.strokeStyle = om(102, 82, 54);
        c.stroke();
      }
    }

    /* Crâne à cornes suspendu : le point d'accroche est en haut, la masse pend
       dessous, donc le balancement pivote sur ce point et pas sur son centre. */
    function skull(cx, cy, w, sd, ang){
      var h = w*1.05, e;
      c.save();
      c.translate(cx, cy);
      c.rotate(ang);
      for (e = -1; e <= 1; e += 2){
        c.beginPath();
        c.moveTo(e*w*0.28, h*0.16);
        c.quadraticCurveTo(e*w*0.92, h*0.10, e*w*1.06, -h*0.26);
        c.lineWidth = lw(w*0.15);
        c.strokeStyle = om(186, 174, 148);
        c.stroke();
        c.beginPath();
        c.moveTo(e*w*0.30, h*0.13);
        c.quadraticCurveTo(e*w*0.88, h*0.07, e*w*1.02, -h*0.22);
        c.lineWidth = lw(w*0.06);
        c.strokeStyle = om(232, 224, 200, 0.65);
        c.stroke();
      }
      c.beginPath();
      c.moveTo(-w*0.36, h*0.14);
      c.quadraticCurveTo(-w*0.42, -h*0.14, 0, -h*0.16);
      c.quadraticCurveTo(w*0.42, -h*0.14, w*0.36, h*0.14);
      c.quadraticCurveTo(w*0.28, h*0.46, w*0.16, h*0.72);
      c.quadraticCurveTo(0, h*0.86, -w*0.16, h*0.72);
      c.quadraticCurveTo(-w*0.28, h*0.46, -w*0.36, h*0.14);
      c.closePath();
      c.fillStyle = om(200, 190, 166);
      c.fill();
      c.save();
      c.clip();
      c.beginPath();
      c.ellipse(w*0.30, -h*0.10, w*0.42, h*0.44, -0.3, 0, Math.PI*2);
      c.fillStyle = om(238, 230, 208, 0.7);
      c.fill();
      c.beginPath();
      c.ellipse(-w*0.34, h*0.30, w*0.40, h*0.50, 0.2, 0, Math.PI*2);
      c.fillStyle = om(96, 88, 74, 0.6);
      c.fill();
      c.restore();
      for (e = -1; e <= 1; e += 2){
        c.beginPath();
        c.ellipse(e*w*0.20, h*0.16, w*0.13, h*0.12, e*0.3, 0, Math.PI*2);
        c.fillStyle = om(30, 26, 22, 0.92);
        c.fill();
      }
      c.beginPath();
      c.moveTo(-w*0.05, h*0.36);
      c.lineTo(0, h*0.50);
      c.lineTo(w*0.05, h*0.36);
      c.closePath();
      c.fillStyle = om(38, 32, 26, 0.85);
      c.fill();
      c.beginPath();
      c.moveTo(-w*0.14, h*0.62);
      c.lineTo(w*0.14, h*0.62);
      c.lineWidth = lw(w*0.05);
      c.strokeStyle = om(120, 110, 92, 0.7);
      c.stroke();
      c.restore();
    }

    /* Bois de cervidé : merrain courbé plus des andouillers, dessinés par
       récursion faible pour que les embranchements ne soient pas alignés. */
    function antler(x0, y0, len, ang, sd, dep){
      var x1 = x0 + Math.cos(ang)*len, y1 = y0 + Math.sin(ang)*len;
      var bw = len*(0.055 + 0.02*dep);
      branch(x0, y0, x1, y1, bw, bw*0.55, len*0.10*(al(sd) - 0.5), 208, 194, 164);
      if (dep <= 0 || len < H*0.02) return;
      var n = 2 + Math.floor(al(sd*3 + 1)*2), q;
      for (q = 0; q < n; q++){
        var f = 0.35 + q*0.28 + al(sd*5 + q)*0.10;
        var bx0 = x0 + (x1 - x0)*f, by0 = y0 + (y1 - y0)*f;
        antler(bx0, by0, len*(0.40 + al(sd*7 + q)*0.22),
               ang - 0.55 - al(sd*11 + q)*0.45, sd*13 + q + 1, dep - 1);
      }
    }

    function feather(x0, y0, len, ang, sd, r, g, b){
      var x1 = x0 + Math.cos(ang)*len, y1 = y0 + Math.sin(ang)*len;
      var nx = -Math.sin(ang), ny = Math.cos(ang);
      c.beginPath();
      c.moveTo(x0, y0);
      c.quadraticCurveTo(x0 + (x1 - x0)*0.5 + nx*len*0.20, y0 + (y1 - y0)*0.5 + ny*len*0.20, x1, y1);
      c.quadraticCurveTo(x0 + (x1 - x0)*0.5 - nx*len*0.20, y0 + (y1 - y0)*0.5 - ny*len*0.20, x0, y0);
      c.closePath();
      c.fillStyle = om(r, g, b);
      c.fill();
      c.beginPath();
      c.moveTo(x0, y0);
      c.lineTo(x1, y1);
      c.lineWidth = lw(len*0.035);
      c.strokeStyle = om(cl(r*0.5), cl(g*0.5), cl(b*0.5), 0.8);
      c.stroke();
      var q;
      for (q = 1; q < 7; q++){
        var f = q/7;
        var mx = x0 + (x1 - x0)*f, my = y0 + (y1 - y0)*f;
        var sp = Math.sin(f*Math.PI)*len*0.18;
        c.beginPath();
        c.moveTo(mx, my);
        c.lineTo(mx + nx*sp - Math.cos(ang)*sp*0.5, my + ny*sp - Math.sin(ang)*sp*0.5);
        c.lineWidth = lw(len*0.02);
        c.strokeStyle = om(cl(r*1.3 + 20), cl(g*1.3 + 20), cl(b*1.3 + 20), 0.35);
        c.stroke();
      }
    }

    // ---------- sol piétiné et cendreux ----------
    contact(0, -H*0.004, L*0.56, H*0.062, 0.30);
    c.beginPath();
    c.ellipse(0, -H*0.020, L*0.50, H*0.058, 0, 0, Math.PI*2);
    c.fillStyle = om(118, 104, 84, 0.40);
    c.fill();
    c.beginPath();
    c.ellipse(0, -H*0.022, L*0.30, H*0.040, 0, 0, Math.PI*2);
    c.fillStyle = om(96, 90, 84, 0.55);
    c.fill();
    for (i = 0; i < 30; i++){
      var px = (al(i*3 + 101) - 0.5)*L*1.05;
      var py = -al(i*3 + 102)*H*0.085;
      var pr = L*0.004 + al(i*3 + 103)*L*0.010;
      c.beginPath();
      c.ellipse(px, py, pr, pr*0.45, 0, 0, Math.PI*2);
      c.fillStyle = om(88, 78, 62, 0.45);
      c.fill();
    }

    // ---------- perches du trépied ----------
    var apex = [[L*0.020, -H*0.995], [-L*0.030, -H*1.020], [0, -H*0.965]];
    var feet = [[-L*0.400, -H*0.050], [L*0.420, -H*0.018], [L*0.060, -H*0.115]];
    var over = [[L*0.048, -H*1.075], [-L*0.062, -H*1.092], [-L*0.008, -H*1.045]];
    var order = [2, 0, 1];                       // la perche du fond passe derrière
    for (i = 0; i < 3; i++){
      k = order[i];
      var dep = k === 2 ? 0.68 : 1;
      branch(feet[k][0], feet[k][1], over[k][0], over[k][1],
             L*0.021*dep, L*0.011*dep, (al(k*9 + 4) - 0.5)*L*0.05,
             62*dep + 16, 50*dep + 13, 36*dep + 11);
      // moignons de branches coupées : la perche vient d'un arbre, pas d'une scierie
      var q2;
      for (q2 = 0; q2 < 3; q2++){
        var f2 = 0.25 + q2*0.22 + al(k*17 + q2)*0.08;
        var sx = feet[k][0] + (over[k][0] - feet[k][0])*f2;
        var sy = feet[k][1] + (over[k][1] - feet[k][1])*f2;
        var sa = (al(k*19 + q2) - 0.5)*2.2;
        branch(sx, sy, sx + Math.cos(sa)*L*0.030, sy - Math.abs(Math.sin(sa))*H*0.020,
               L*0.008*dep, L*0.003*dep, 0, 74*dep + 12, 60*dep + 10, 42*dep + 8);
      }
    }
    lash(L*0.002, -H*0.992, 0.28, L*0.030, 3, 2);

    // barre à trophées, entre les deux perches de devant
    var bax = -L*0.230, bay = -H*0.560, bbx = L*0.250, bby = -H*0.520;
    branch(bax - L*0.030, bay - H*0.004, bbx + L*0.030, bby + H*0.004,
           L*0.013, L*0.012, H*0.026, 88, 71, 48);
    lash(bax, bay + H*0.008, 1.30, L*0.013, 7, 1);
    lash(bbx, bby + H*0.010, 1.42, L*0.013, 11, 1);
    function barY(f){ return bay + (bby - bay)*f + Math.sin(f*Math.PI)*H*0.030; }
    function barX(f){ return bax + (bbx - bax)*f; }

    // ---------- trophées suspendus ----------
    function hang(f, drop, sd){
      var hx0 = barX(f), hy0 = barY(f);
      var ang = Math.sin(t*0.42 + al(sd*3 + 1)*6.283)*0.055;
      var hx1 = hx0 + Math.sin(ang)*drop, hy1 = hy0 + Math.cos(ang)*drop;
      c.beginPath();
      c.moveTo(hx0, hy0 - H*0.006);
      c.lineTo(hx1, hy1);
      c.lineWidth = lw(L*0.005);
      c.strokeStyle = om(104, 84, 56);
      c.stroke();
      return [hx1, hy1, ang];
    }
    var hg;
    hg = hang(0.14, H*0.070, 5);
    skull(hg[0], hg[1], L*0.088, 5, hg[2]);
    hg = hang(0.42, H*0.055, 9);
    c.save();
    c.translate(hg[0], hg[1]);
    c.rotate(hg[2]);
    antler(0, 0, H*0.115, -1.15, 21, 2);
    antler(0, 0, H*0.100, -1.95, 33, 2);
    c.restore();
    hg = hang(0.62, H*0.050, 13);
    c.save();
    c.translate(hg[0], hg[1]);
    c.rotate(hg[2]);
    for (i = 0; i < 5; i++){
      feather(0, 0, H*(0.075 + al(i*3 + 51)*0.045),
              Math.PI*0.5 + (i - 2)*0.19, i + 3,
              96 + al(i + 60)*70, 78 + al(i + 61)*54, 60 + al(i + 62)*40);
    }
    c.beginPath();
    c.ellipse(0, 0, L*0.020, H*0.014, 0, 0, Math.PI*2);
    c.fillStyle = om(92, 74, 48);
    c.fill();
    c.restore();
    // peau étirée, lestée d'un galet : elle sèche à la fumée
    hg = hang(0.86, H*0.030, 17);
    var pw = L*0.085, ph = H*0.190;
    c.save();
    c.translate(hg[0], hg[1]);
    c.rotate(hg[2]*0.7);
    c.beginPath();
    c.moveTo(-pw*0.5, 0);
    c.quadraticCurveTo(-pw*0.80, ph*0.42, -pw*0.34, ph*0.92);
    c.quadraticCurveTo(0, ph*1.10, pw*0.34, ph*0.92);
    c.quadraticCurveTo(pw*0.80, ph*0.42, pw*0.5, 0);
    c.quadraticCurveTo(0, ph*0.10, -pw*0.5, 0);
    c.closePath();
    c.fillStyle = om(148, 122, 92);
    c.fill();
    c.save();
    c.clip();
    var gph = c.createLinearGradient(-pw, 0, pw, ph*0.4);
    gph.addColorStop(0, om(46, 36, 26, 0.55));
    gph.addColorStop(0.5, om(46, 36, 26, 0));
    gph.addColorStop(0.66, om(255, 236, 200, 0));
    gph.addColorStop(1, om(255, 236, 200, 0.32));
    c.fillStyle = gph;
    c.fillRect(-pw, -ph*0.2, pw*2, ph*1.4);
    for (i = 0; i < 4; i++){
      c.beginPath();
      c.moveTo(-pw*0.55 + i*pw*0.30, ph*0.06);
      c.quadraticCurveTo(-pw*0.40 + i*pw*0.30, ph*0.55, -pw*0.50 + i*pw*0.32, ph*1.0);
      c.lineWidth = lw(pw*0.05);
      c.strokeStyle = om(88, 68, 50, 0.45);
      c.stroke();
    }
    c.restore();
    c.restore();
    stone(hg[0] + Math.sin(hg[2])*ph*0.95, hg[1] + ph*1.02, L*0.024, L*0.020, 71, 122, 116, 106);

    // ---------- pierres du cercle, moitié arrière ----------
    var frx = L*0.265, fry = H*0.062, fcy = -H*0.030;
    for (i = 0; i < 13; i++){
      var aa = Math.PI*2*(i/13) + 0.18;
      if (Math.sin(aa) > -0.12) continue;
      var srr = frx*(0.15 + al(i*5 + 111)*0.09);
      stone(Math.cos(aa)*frx, fcy + Math.sin(aa)*fry + srr*0.45, srr, srr*0.78,
            i + 120, 120, 112, 100);
    }

    // ---------- bûches ----------
    for (i = 0; i < 5; i++){
      var la = -0.9 + i*0.42 + (al(i*7 + 131) - 0.5)*0.3;
      var ll = frx*(1.10 + al(i*7 + 132)*0.45);
      var lcx = (al(i*7 + 133) - 0.5)*frx*0.30;
      var lcy = fcy - H*0.006 - i*H*0.008;
      branch(lcx - Math.cos(la)*ll*0.5, lcy - Math.sin(la)*ll*0.5*0.30,
             lcx + Math.cos(la)*ll*0.5, lcy + Math.sin(la)*ll*0.5*0.30,
             L*0.019, L*0.014, 0, 58, 44, 34);
    }

    // ---------- feu ----------
    c.save();
    c.globalCompositeOperation = "lighter";
    var glow = c.createRadialGradient(0, fcy - H*0.06, 0, 0, fcy - H*0.06, L*0.62);
    glow.addColorStop(0, "rgba(255,176,72," + (0.30 + 0.42*nu)*fl + ")");
    glow.addColorStop(0.32, "rgba(255,120,34," + (0.13 + 0.24*nu)*fl + ")");
    glow.addColorStop(1, "rgba(255,90,20,0)");
    c.fillStyle = glow;
    c.beginPath();
    c.arc(0, fcy - H*0.06, L*0.62, 0, Math.PI*2);
    c.fill();
    // lit de braises
    for (i = 0; i < 14; i++){
      var ex = (al(i*3 + 141) - 0.5)*frx*1.20;
      var ey = fcy - H*0.010 - al(i*3 + 142)*H*0.026;
      var er = frx*(0.05 + al(i*3 + 143)*0.075);
      var eb = 0.35 + 0.45*Math.abs(Math.sin(t*1.7 + al(i + 150)*6.283));
      c.beginPath();
      c.ellipse(ex, ey, er, er*0.62, 0, 0, Math.PI*2);
      c.fillStyle = "rgba(255," + Math.round(120 + 90*eb) + ",40," + (0.30 + 0.32*eb) + ")";
      c.fill();
    }
    // langues de flamme
    for (i = 0; i < 11; i++){
      var seed = al(i*5 + 161);
      var bx0 = (seed - 0.5)*frx*1.05;
      var by0 = fcy - H*0.012;
      var hh = H*(0.16 + al(i*5 + 162)*0.24)*(0.78 + 0.22*Math.sin(t*2.3 + seed*6.283));
      var ww = frx*(0.16 + al(i*5 + 163)*0.16);
      var wob = Math.sin(t*1.9 + seed*6.283)*ww*0.9;
      var wob2 = Math.sin(t*3.1 + seed*11.0)*ww*0.5;
      c.beginPath();
      c.moveTo(bx0 - ww, by0);
      c.bezierCurveTo(bx0 - ww*1.15 + wob*0.4, by0 - hh*0.42,
                      bx0 - ww*0.35 + wob, by0 - hh*0.74,
                      bx0 + wob + wob2, by0 - hh);
      c.bezierCurveTo(bx0 + ww*0.45 + wob, by0 - hh*0.70,
                      bx0 + ww*1.10 + wob*0.4, by0 - hh*0.40,
                      bx0 + ww, by0);
      c.closePath();
      var gf = c.createLinearGradient(bx0, by0, bx0 + wob*0.5, by0 - hh);
      gf.addColorStop(0, "rgba(255,214,120," + (0.34 + 0.14*nu) + ")");
      gf.addColorStop(0.38, "rgba(255,146,40," + (0.26 + 0.12*nu) + ")");
      gf.addColorStop(1, "rgba(220,52,10,0)");
      c.fillStyle = gf;
      c.fill();
    }
    // coeur clair, plus court et plus étroit
    for (i = 0; i < 5; i++){
      var sd2 = al(i*5 + 181);
      var cx0 = (sd2 - 0.5)*frx*0.55;
      var ch = H*(0.075 + al(i*5 + 182)*0.10)*(0.8 + 0.2*Math.sin(t*3.4 + sd2*6.283));
