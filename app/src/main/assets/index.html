<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compte a rebours d'evasion</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}</style>
</head>
<body><title>Compte à rebours d'évasion</title>
<meta name="theme-color" content="#04050A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Évasion">
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%2304050A"/><circle cx="32" cy="32" r="21" fill="none" stroke="%2300E5FF" stroke-width="6"/><path d="M32 32V18M32 32l11 6" stroke="%23E6ECF7" stroke-width="5" stroke-linecap="round"/></svg>'>
<link rel="manifest" href='data:application/manifest+json,{"name":"Compte à rebours d évasion","short_name":"Évasion","display":"standalone","orientation":"any","background_color":"%2304050A","theme_color":"%2304050A","start_url":".","icons":[{"src":"data:image/svg%2Bxml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27><rect width=%2764%27 height=%2764%27 fill=%27%2304050A%27/><circle cx=%2732%27 cy=%2732%27 r=%2721%27 fill=%27none%27 stroke=%27%2300E5FF%27 stroke-width=%276%27/></svg>","sizes":"any","type":"image/svg+xml","purpose":"any"}]}'>
<style>
  :root{
    --void:#04050A;
    --cyan:#00E5FF;
    --magenta:#FF2D78;
    --amber:#FFB020;
    --ink:#E6ECF7;
    --dim:#5C6784;
    --glow: var(--cyan);
    --u: clamp(24px, 7.4vw, 84px);
    --dh: calc(var(--u) * 1.62);
    --dw: calc(var(--u) * 0.98);
    --t:  calc(var(--u) * 0.155);
    --mono: "Consolas","SF Mono",ui-monospace,"DejaVu Sans Mono",monospace;
    --cond: "Haettenschweiler","Arial Narrow","Impact","Segoe UI",sans-serif;
    --ui: "Segoe UI",system-ui,sans-serif;
  }

  html,body{height:100%;}
  body{
    margin:0;background:var(--void);color:var(--ink);
    font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  #warp{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(2,3,8,.75) 78%, #02030899 100%);
  }
  .scan{
    position:fixed;inset:0;pointer-events:none;opacity:.22;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.055) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  /* voile RGB : n'apparaît qu'au RAINBOW, faible opacité, défile très vite */
  .rgbVeil{
    position:fixed;inset:0;pointer-events:none;z-index:36;opacity:0;
    mix-blend-mode:screen;transition:opacity .3s;
    background:repeating-linear-gradient(90deg,
      #FF0000 0px,#FF8000 40px,#FFE000 80px,#00FF00 120px,#00FFFF 160px,
      #3300FF 200px,#B400FF 240px,#FF0080 280px,#FF0000 320px);
  }
  body.arc .rgbVeil{opacity:.14;animation:rgbSlide .5s linear infinite;}
  @keyframes rgbSlide{from{background-position:0 0}to{background-position:320px 0}}

  .stage{
    position:relative;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2vh,24px);padding:clamp(14px,2.6vh,34px) 18px;box-sizing:border-box;
  }

  /* ---------- étiquettes ---------- */
  .eyebrow{
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.4em;
    font-size:clamp(11px,1.5vw,15px);color:var(--dim);
    display:flex;align-items:center;gap:.9em;text-align:center;
    margin-bottom:clamp(12px,3vh,40px);        /* respirer entre le texte et l'heure */
  }
  .eyebrow b{color:var(--glow);font-weight:400;text-shadow:0 0 14px var(--glow);}
  .dot{
    width:7px;height:7px;background:var(--glow);border-radius:50%;
    box-shadow:0 0 12px var(--glow);animation:pulse 1s steps(2,end) infinite;
  }
  @keyframes pulse{0%,49%{opacity:1}50%,100%{opacity:.15}}

  /* ---------- afficheur 7 segments ---------- */
  .readout{display:flex;align-items:flex-start;gap:calc(var(--u)*.30);}
  .grp{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.20);}
  .digits{display:flex;gap:calc(var(--u)*.14);}
  .cap{font-family:var(--cond);text-transform:uppercase;letter-spacing:.32em;
       font-size:clamp(9px,1.1vw,13px);color:var(--dim);}
  .colon{position:relative;width:calc(var(--u)*.30);height:var(--dh);
         animation:blink 1s steps(2,end) infinite;}
  .colon i{position:absolute;left:12%;width:76%;aspect-ratio:1;border-radius:2px;
           background:var(--glow);box-shadow:0 0 calc(var(--u)*.30) var(--glow);}
  .colon i:first-child{top:28%}
  .colon i:last-child{top:60%}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.12}}

  .d7{position:relative;width:var(--dw);height:var(--dh);}
  .d7 s{position:absolute;display:block;background:var(--glow);
        opacity:.055;transition:opacity .07s linear, box-shadow .07s linear;}
  .d7 s.on{opacity:1;box-shadow:0 0 calc(var(--u)*.34) color-mix(in srgb, var(--glow) 70%, transparent);}
  .d7 .h{left:var(--t);width:calc(var(--dw) - var(--t)*2);height:var(--t);
         clip-path:polygon(0 50%,14% 0,86% 0,100% 50%,86% 100%,14% 100%);}
  .d7 .v{width:var(--t);height:calc(var(--dh)/2 - var(--t)*1.5);
         clip-path:polygon(50% 0,100% 14%,100% 86%,50% 100%,0 86%,0 14%);}
  .d7 .a{top:0}
  .d7 .g{left:var(--t);width:calc(var(--dw) - var(--t)*2);height:var(--t);
         top:calc(var(--dh)/2 - var(--t)/2);
         clip-path:polygon(0 50%,10% 0,90% 0,100% 50%,90% 100%,10% 100%);}
  .d7 .d{bottom:0}
  .d7 .b{right:0;top:var(--t)}
  .d7 .c{right:0;top:calc(var(--dh)/2 + var(--t)*.5)}
  .d7 .f{left:0;top:var(--t)}
  .d7 .e{left:0;top:calc(var(--dh)/2 + var(--t)*.5)}

  /* ---------- sous-secondes ---------- */
  .sub{display:flex;align-items:baseline;gap:1.1ch;
       font-family:var(--mono);font-variant-numeric:tabular-nums;
       font-size:clamp(18px,3.8vw,44px);letter-spacing:.02em;}
  .ms{color:var(--glow);text-shadow:0 0 26px color-mix(in srgb,var(--glow) 60%,transparent);}
  .us{color:var(--magenta);opacity:.85;filter:blur(.35px);
      text-shadow:0 0 22px color-mix(in srgb,var(--magenta) 55%,transparent);}
  .sub small{font-family:var(--cond);letter-spacing:.3em;
             font-size:clamp(9px,1.1vw,12px);color:var(--dim);}

  /* ---------- frise de journée ---------- */
  .day{width:min(880px,92vw);display:flex;flex-direction:column;gap:6px;}
  .track{height:14px;background:#0D1220;border:1px solid #18203A;position:relative;overflow:hidden;}
  .band{                                   /* zone déjeuner, par-dessus le remplissage */
    position:absolute;top:0;bottom:0;z-index:2;
    background:repeating-linear-gradient(115deg,rgba(12,6,2,.62) 0 7px,rgba(255,138,61,.34) 7px 15px);
    border-left:1px solid rgba(255,138,61,.75);border-right:1px solid rgba(255,138,61,.75);
  }
  .fill{
    position:absolute;top:0;bottom:0;left:0;z-index:1;
    background:linear-gradient(90deg,color-mix(in srgb,var(--glow) 30%,#0D1220),var(--glow));
    box-shadow:0 0 22px color-mix(in srgb,var(--glow) 45%,transparent);
    transition:width .12s linear;
  }
  .cursor{position:absolute;top:-4px;bottom:-4px;width:3px;z-index:3;background:var(--ink);
          box-shadow:0 0 12px var(--ink);transition:left .12s linear;}
  /* étiquettes calées sur leur vraie abscisse dans la frise, pas réparties à l'aveugle */
  .ticks{position:relative;height:15px;
         font-family:var(--mono);font-size:11px;color:var(--dim);}
  .ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;}
  .ticks span:first-child{left:0;transform:none;}
  .ticks span:last-child{left:100%;transform:translateX(-100%);}
  .ticks .repas{color:#FF8A3D;}

  /* ---------- télémétrie ---------- */
  .telemetry{
    width:min(880px,92vw);
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:1px;background:#141B2E;border:1px solid #141B2E;
  }
  .cell{background:#070A13;padding:8px 12px;display:flex;flex-direction:column;gap:4px;}
  .cell .k{font-family:var(--cond);text-transform:uppercase;letter-spacing:.22em;font-size:10px;color:var(--dim);}
  .cell .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink);}

  /* ---------- champs et boutons (réutilisés dans le menu) ---------- */
  input[type=time]{font-family:var(--mono);font-size:16px;color:var(--ink);
                   background:#070A13;border:1px solid #222C4A;padding:8px 11px;color-scheme:dark;}
  input[type=time]:focus-visible,button:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  button{font-family:var(--cond);text-transform:uppercase;letter-spacing:.18em;font-size:13px;
         color:var(--ink);background:#070A13;border:1px solid #222C4A;padding:10px 13px;cursor:pointer;
         transition:background .12s,border-color .12s,color .12s;}
  button:hover{background:#0F1626;border-color:var(--glow);color:var(--glow);}
  button[aria-pressed=true]{background:var(--glow);color:var(--void);border-color:var(--glow);}

  /* ---------- bouton ☰ et panneau de réglages ---------- */
  .menuBtn{
    position:fixed;z-index:40;
    top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:5px;
    padding:11px;background:rgba(7,10,19,.7);border:1px solid #222C4A;cursor:pointer;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .menuBtn span{display:block;height:2px;width:100%;background:var(--ink);
                transition:transform .25s,opacity .25s,background .12s;transform-origin:center;}
  .menuBtn:hover{border-color:var(--glow);}
  .menuBtn:hover span{background:var(--glow);}
  .menuBtn:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  .menuBtn[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .menuBtn[aria-expanded=true] span:nth-child(2){opacity:0;}
  .menuBtn[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  .backdrop{
    position:fixed;inset:0;z-index:38;background:rgba(2,3,8,.6);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;
  }
  .panel{
    position:fixed;z-index:39;top:0;right:0;height:100dvh;width:min(340px,86vw);
    background:linear-gradient(#0A0E1A,#070A13);border-left:1px solid #222C4A;
    padding:calc(72px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px;overflow-y:auto;
    box-shadow:-24px 0 60px rgba(0,0,0,.55);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  body.menu-open .panel{transform:none;}
  body.menu-open .backdrop{opacity:1;visibility:visible;}
  .panel h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.3em;
            font-size:14px;color:var(--glow);margin:0;text-shadow:0 0 20px var(--glow);}
  .panel label{display:flex;flex-direction:column;gap:5px;
               font-family:var(--cond);text-transform:uppercase;letter-spacing:.16em;
               font-size:11px;color:var(--dim);}
  .panel label input[type=time]{width:100%;font-size:18px;}
  /* interrupteur de la pause */
  .panel label.switch{flex-direction:row;align-items:center;gap:10px;cursor:pointer;
                      color:var(--ink);font-size:12px;}
  .panel label.switch input{width:18px;height:18px;accent-color:var(--glow);cursor:pointer;margin:0;}
  #pauseFields{display:flex;flex-direction:column;gap:14px;transition:opacity .2s;}
  #pauseFields.off{opacity:.35;}                 /* grisé quand la pause est désactivée */
  #pauseFields.off input{pointer-events:none;}
  .panelRow{display:flex;gap:8px;}
  .panelRow button{flex:1;}
  .panel .reset{margin-top:4px;font-size:11px;letter-spacing:.08em;line-height:1.5;}

  /* ---------- états ---------- */
  /* paliers : 1h jaune · 15 min orange · 5 min rouge · 1 min violet · 10 s arc-en-ciel */
  body.jaune{--glow:#FFE34A;--magenta:#FFC24A;}
  body.orange{--glow:#FF9A1F;--magenta:#FFB86A;}
  body.rouge{--glow:#FF3B2F;--magenta:#FF8A6A;}
  body.rouge .stage{animation:shake .09s infinite;}
  body.violet{--glow:#B14DFF;--magenta:#F06BFF;}
  body.violet .stage{animation:shakeFast .05s infinite;}

  /* --glow enregistrée comme couleur : sans ça, une custom property s'anime par à-coups
     au lieu de s'interpoler entre les 8 teintes. */
  @property --glow{ syntax:"<color>"; inherits:true; initial-value:#00E5FF; }

  body.arc{--glow:#FF0000;--magenta:#FF0000;}
  body.arc .stage{animation:shakeWild .07s infinite;}
  /* vague RGB façon clavier gamer : même cycle, décalé bloc par bloc de gauche à droite */
  body.arc .eyebrow, body.arc .sub, body.arc .day, body.arc .telemetry,
  body.arc .readout .d7, body.arc .readout .colon{
    animation:arcCycle 1.15s linear infinite;
    animation-delay:calc(var(--w,0) * -.05s);
  }
  body.arc .us{color:var(--glow);opacity:1;filter:none;}   /* les µs suivent la vague aussi */
  body.arc .eyebrow{--w:0}  body.arc .sub{--w:6}  body.arc .day{--w:9}
  body.arc .telemetry{--w:11}
  /* palette saturée à fond, ordre exact : rouge→orange→jaune→vert→cyan→indigo→violet→rose */
  @keyframes arcCycle{
    0%   {--glow:#FF0000}
    12.5%{--glow:#FF8000}
    25%  {--glow:#FFE000}
    37.5%{--glow:#00FF00}
    50%  {--glow:#00FFFF}
    62.5%{--glow:#3300FF}
    75%  {--glow:#B400FF}
    87.5%{--glow:#FF0080}
    100% {--glow:#FF0000}
  }
  @keyframes shakeWild{
    0%  {transform:translate(0,0)       rotate(0deg)}
    14% {transform:translate(-10px,7px)  rotate(-1.1deg)}
    28% {transform:translate(9px,-8px)   rotate(1deg)}
    42% {transform:translate(-7px,-6px)  rotate(1.2deg)}
    57% {transform:translate(10px,8px)   rotate(-.9deg)}
    71% {transform:translate(-9px,4px)   rotate(.8deg)}
    85% {transform:translate(6px,-10px)  rotate(-1.2deg)}
    100%{transform:translate(0,0)       rotate(0deg)}
  }
  @keyframes shake{
    0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}
    50%{transform:translate(-1px,1.5px)}75%{transform:translate(-1.5px,-1px)}
    100%{transform:translate(1px,1px)}
  }
  @keyframes shakeFast{
    0%{transform:translate(0,0) rotate(0deg)}
    20%{transform:translate(6px,-5px) rotate(.3deg)}
    40%{transform:translate(-7px,4px) rotate(-.3deg)}
    60%{transform:translate(5px,6px) rotate(.2deg)}
    80%{transform:translate(-5px,-6px) rotate(-.2deg)}
    100%{transform:translate(0,0) rotate(0deg)}
  }
  body.free{--glow:#3BF07A;}

  /* ---------- pause repas ---------- */
  body.lunch{--glow:#FF8A3D;--magenta:#FFD24A;}
  body.lunch .vignette{
    background:radial-gradient(ellipse at 50% 42%, rgba(255,138,61,.16) 0%, rgba(0,0,0,0) 45%),
               radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(10,4,2,.78) 78%, #0A0402 100%);
  }
  body.lunch .us{filter:none;opacity:.95;}

  .banner{
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.3em;
    font-size:clamp(16px,3.4vw,36px);color:var(--glow);text-shadow:0 0 40px var(--glow);
    height:0;overflow:visible;opacity:0;transition:opacity .3s;white-space:nowrap;
  }
  body.lunch .banner{opacity:1;}

  /* la libération : le mot remplace le compteur, compter ses heures sup serait le contraire du message */
  .libre{
    display:none;font-family:var(--cond);text-transform:uppercase;font-weight:800;
    font-size:clamp(72px,20vw,280px);line-height:.9;letter-spacing:.04em;
    color:var(--glow);text-shadow:0 0 50px var(--glow),0 0 160px var(--glow);
  }
  body.free .libre{display:flex;animation:respire 2.8s ease-in-out infinite;}
  body.free .readout,body.free .sub{display:none;}
  .libre span{animation:tombe .55s cubic-bezier(.2,1.7,.4,1) backwards;}
  .libre span:nth-child(2){animation-delay:.07s}
  .libre span:nth-child(3){animation-delay:.14s}
  .libre span:nth-child(4){animation-delay:.21s}
  .libre span:nth-child(5){animation-delay:.28s}
  @keyframes tombe{from{transform:translateY(-.3em) scale(.75);opacity:0}
                   to{transform:none;opacity:1}}
  @keyframes respire{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

  /* ---------- le hamburger qui se monte ---------- */
  .burger{
    display:none;flex-direction:column-reverse;align-items:center;
    width:clamp(120px,17vw,190px);height:clamp(96px,15vh,150px);justify-content:flex-start;
    filter:drop-shadow(0 10px 26px rgba(255,138,61,.35));
  }
  body.lunch .burger{display:flex;}
  .burger i{display:block;width:100%;animation:plop .5s cubic-bezier(.2,1.5,.4,1) backwards;}
  @keyframes plop{
    from{transform:translateY(-90px) scaleX(.7);opacity:0}
    60%{transform:translateY(4px) scaleX(1.06);opacity:1}
    to{transform:translateY(0) scaleX(1);opacity:1}
  }
  .l-bunb{height:20%;background:linear-gradient(#D89550,#A96A32);
          border-radius:0 0 46% 46% / 0 0 100% 100%;}
  .l-steak{height:17%;background:linear-gradient(#7A4426,#4A2513);border-radius:7px;width:104%;}
  .l-cheese{height:9%;background:linear-gradient(#FFC93C,#EFA415);width:106%;
            clip-path:polygon(0 0,100% 0,100% 55%,88% 100%,72% 55%,52% 100%,34% 55%,16% 100%,0 55%);}
  .l-salad{height:9%;background:#63BE38;width:108%;
           clip-path:polygon(0 0,100% 0,100% 40%,92% 100%,80% 40%,66% 100%,52% 40%,38% 100%,24% 40%,10% 100%,0 40%);}
  .l-tomato{height:9%;background:linear-gradient(#E8452F,#B8261A);border-radius:5px;width:102%;}
  .l-onion{height:6%;background:#F3E6EC;border-radius:5px;width:100%;opacity:.9;}
  .l-bacon{height:8%;background:repeating-linear-gradient(92deg,#C7452B 0 9px,#F0C9B6 9px 13px);
           border-radius:4px;width:104%;}
  .l-bunt{height:34%;background:radial-gradient(circle at 30% 65%,#F3E3C0 0 3px,transparent 3px),
                    radial-gradient(circle at 55% 45%,#F3E3C0 0 3px,transparent 3px),
                    radial-gradient(circle at 72% 70%,#F3E3C0 0 3px,transparent 3px),
                    linear-gradient(#E5A45C,#C07C39);
          border-radius:50% 50% 14% 14% / 100% 100% 22% 22%;}

  /* ---------- verrouillage des compétences (masqué tant que non débloqué) ---------- */
  body.lock-min .gM, body.lock-min .cM{display:none;}
  body.lock-sec .gS, body.lock-sec .cS{display:none;}
  body.lock-ms .sub-ms{display:none;}
  body.lock-us .sub-us{display:none;}
  body.lock-stats .telemetry, body.lock-stats .day{display:none;}
  body.lock-bg .vignette, body.lock-bg .scan{display:none;}
  body.lock-lunch .switch, body.lock-lunch #pauseFields{display:none;}
  body.lock-pin .need-pin{display:none;}
  body.lock-son .need-son{display:none;}
  body.lock-full .need-full{display:none;}
  /* RP : dans un masque de plongée il n'y a pas de tableau de bord.
     Les instruments (règle de profondeur, manomètre) remplacent la télémétrie. */
  body.monde-abysses .telemetry,body.monde-abysses .day{display:none;}

  /* ---------- compteur de tokens ---------- */
  .tokBtn{
    position:fixed;z-index:40;
    top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    display:flex;align-items:center;gap:6px;padding:9px 13px;cursor:pointer;
    background:rgba(7,10,19,.7);border:1px solid #222C4A;
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .tokStar{color:var(--glow);text-shadow:0 0 10px var(--glow);}
  .tokBtn:hover{border-color:var(--glow);color:var(--glow);}
  .tokBtn:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  .tokBtn.ready{animation:tokReady 1.1s ease-in-out infinite;}   /* pulse : un achat est possible */
  @keyframes tokReady{0%,100%{box-shadow:0 0 0 rgba(0,229,255,0)}

  /* ---------- instruments de plongée (RP : l'écran est le masque) ---------- */
  .depthRule,.pressGauge,.visorCrack{display:none;}

  body.monde-abysses:not(.lock-press) .pressGauge{display:block;}

  /* règle de profondeur, à droite */

    position:fixed;z-index:30;pointer-events:none;

    font-family:var(--mono);font-variant-numeric:tabular-nums;
  }
  .dr-axis{position:absolute;right:14px;top:0;bottom:0;width:2px;
           background:linear-gradient(rgba(190,240,255,.7),rgba(190,240,255,.15));}
  .dr-ticks{position:absolute;inset:0;}
  .dr-ticks i{position:absolute;right:14px;height:1px;background:rgba(190,240,255,.45);}
  .dr-ticks i.maj{height:2px;background:rgba(210,248,255,.8);}
  .dr-ticks b{position:absolute;right:26px;transform:translateY(-50%);
              font-size:10px;font-weight:400;color:rgba(198,236,250,.75);
              text-shadow:0 1px 6px rgba(0,18,30,.9);}
  .dr-cursor{
    position:absolute;right:6px;transform:translateY(-50%);
    display:flex;align-items:baseline;gap:2px;padding:3px 7px;
    background:rgba(2,20,32,.86);border:1px solid var(--glow);
    box-shadow:0 0 14px color-mix(in srgb,var(--glow) 55%,transparent);
    transition:top .25s linear;
  }
  .dr-cursor b{font-size:15px;color:var(--glow);font-weight:400;}
  .dr-cursor i{font-size:9px;font-style:normal;color:rgba(190,230,245,.8);}
  .dr-cursor::after{                              /* pointe vers l'axe */
    content:"";position:absolute;right:-9px;top:50%;transform:translateY(-50%);
    border:5px solid transparent;border-left-color:var(--glow);
  }

  /* manomètre, en bas à gauche */
  .pressGauge{
    position:fixed;z-index:30;pointer-events:none;
    left:calc(20px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));
    width:126px;height:126px;
  }
  .pressGauge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .pg-ring{fill:#0A1C28;stroke:#28596E;stroke-width:3;}
  .pg-face{fill:radial-gradient(#08202E,#04121B);fill:#07202E;stroke:#123443;stroke-width:1;}
  .pg-needle{stroke:#FF6B4A;stroke-width:3;stroke-linecap:round;
             transform-origin:60px 60px;transition:transform .3s ease-out;}
  .pg-hub{fill:#D8E8F0;}
  #pgTicks line{stroke:rgba(190,228,244,.6);stroke-width:1.6;}
  #pgTicks line.maj{stroke:rgba(226,244,255,.95);stroke-width:2.4;}
  .pg-crack{opacity:0;transition:opacity .4s;}
  .pg-crack path{fill:none;stroke:rgba(232,248,255,.85);stroke-width:1.4;stroke-linecap:round;}
  body.pg-fissure .pg-crack{opacity:1;}
  .pg-val{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;
    color:#CFEAF6;text-shadow:0 1px 6px rgba(0,18,30,.9);white-space:nowrap;
  }
  .pg-led{
    position:absolute;left:50%;top:30px;transform:translateX(-50%);
    width:11px;height:11px;border-radius:50%;
    background:#2BE07A;box-shadow:0 0 12px #2BE07A;
  }
  body.led-jaune  .pg-led{background:#FFE04A;box-shadow:0 0 12px #FFE04A;}
  body.led-orange .pg-led{background:#FF9A1F;box-shadow:0 0 14px #FF9A1F;animation:ledBlink 1s steps(2,end) infinite;}
  body.led-rouge  .pg-led{background:#FF3B2F;box-shadow:0 0 16px #FF3B2F;animation:ledBlink .45s steps(2,end) infinite;}
  body.led-noire  .pg-led{background:#1A1A1A;box-shadow:inset 0 0 6px #000;animation:none;}
  @keyframes ledBlink{0%,49%{opacity:1}50%,100%{opacity:.12}}

  /* la vitre du casque : dernière minute */
  .visorCrack{
    position:fixed;inset:0;z-index:31;pointer-events:none;
    width:100%;height:100%;opacity:0;transition:opacity .5s;
  }
  .visorCrack path{
    fill:none;stroke:rgba(226,246,255,.6);stroke-width:2;
    filter:drop-shadow(0 0 3px rgba(160,220,255,.55));

  @media (max-width:720px){
    .depthRule{height:56vh;top:20vh;width:76px;right:8px;}
    .pressGauge{width:96px;height:96px;left:10px;bottom:10px;}

    .pg-val{bottom:18px;font-size:11px;}
  }

  /* ---------- bouton monde (planète) : visible après le 1er prestige ---------- */
  .worldBtn{
    position:fixed;z-index:40;
    top:calc(66px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    width:44px;height:44px;padding:0;font-size:21px;line-height:1;
    background:rgba(7,10,19,.7);border:1px solid #222C4A;cursor:pointer;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }

  /* ---------- bouton prestige : visible seulement quand tout est acheté ---------- */
  .prestigeBtn{
    display:none;margin:26px auto 0;padding:14px 22px;
    font-size:14px;letter-spacing:.22em;
    color:#F0D9FF;background:linear-gradient(#3B1060,#25073F);
    border:1px solid #B14DFF;box-shadow:0 0 26px rgba(177,77,255,.5);
    animation:prestigePulse 1.6s ease-in-out infinite;

  @keyframes prestigePulse{
    0%,100%{box-shadow:0 0 18px rgba(177,77,255,.35)}
    50%    {box-shadow:0 0 40px rgba(177,77,255,.75)}
  }

  /* ---------- thème du monde des abysses ---------- */
  body.monde-abysses{--void:#02121C;--ink:#E8F7FF;--dim:#5E8598;}
  body.monde-abysses .cell{background:rgba(3,20,32,.72);}
  body.monde-abysses .telemetry{background:#16455C;border-color:#16455C;}
  body.monde-abysses .track{background:rgba(3,20,32,.6);border-color:#1C5B78;}
  body.monde-abysses .menuBtn,body.monde-abysses .tokBtn,body.monde-abysses .worldBtn{
    background:rgba(3,20,32,.66);border-color:#1C5B78;
  }
  /* paliers = remontée vers la lumière, pas escalade du danger */
  body.monde-abysses.jaune {--glow:#2FA6E0;--magenta:#7FD0F5;}
  body.monde-abysses.orange{--glow:#3F72DC;--magenta:#8FAEF2;}
  body.monde-abysses.rouge {--glow:#6B54E4;--magenta:#A99AF5;}
  body.monde-abysses.violet{--glow:#3BF0A8;--magenta:#9BFAD6;}
  body.monde-abysses .libre{color:#EAFBFF;text-shadow:0 0 60px #7FE9F5;}
  /* l'eau claire délave le texte : on le rehausse */
  body.monde-abysses .eyebrow{color:#BFE8F5;text-shadow:0 2px 10px rgba(0,20,34,.9);}
  body.monde-abysses .cap,body.monde-abysses .ticks{color:#AEDDEC;text-shadow:0 1px 8px rgba(0,20,34,.85);}

  /* ---------- arbre de compétences ---------- */
  .tree{
    position:fixed;z-index:41;inset:0;overflow:auto;
    background:linear-gradient(160deg,#080C16,#04050A);
    padding:calc(72px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));
    transform:translateY(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  }
  body.tree-open .tree{transform:none;}
  .treeHead{max-width:920px;margin:0 auto 24px;text-align:center;}
  .treeHead h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.32em;
               font-size:20px;color:var(--glow);margin:0 0 8px;text-shadow:0 0 24px var(--glow);}
  .treeSolde{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;color:var(--ink);}
  .treeHint{color:var(--dim);font-size:12px;margin:6px 0 0;}
  /* l'arbre : grille positionnée (5 colonnes, nœuds en 1/3/5), connecteurs SVG dessous */
  #treeBody{position:relative;max-width:720px;min-width:560px;margin:0 auto;padding:0;
            display:grid;grid-template-columns:repeat(5,1fr);
            column-gap:8px;row-gap:48px;justify-items:center;align-items:stretch;}
  .treeLines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible;}
  .noeud{position:relative;z-index:2;width:100%;
         display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
         padding:10px 12px;border:1px solid #222C4A;background:#070A13;cursor:pointer;
         transition:border-color .15s,background .15s,opacity .15s;}
  .noeud .n-nom{font-family:var(--cond);text-transform:uppercase;letter-spacing:.08em;
                font-size:12px;line-height:1.15;color:var(--ink);}
  .noeud .n-cout{font-family:var(--mono);font-size:11px;color:var(--dim);}
  .noeud:focus-visible{outline:2px solid var(--glow);outline-offset:2px;}
  .noeud.buyable{border-color:var(--glow);box-shadow:0 0 14px rgba(0,229,255,.25);}
  .noeud.buyable .n-cout{color:var(--glow);}
  .noeud.buyable:hover{background:#0F1626;}
  .noeud.pending{opacity:.85;}
  .noeud.pending .n-cout{color:var(--amber);}
  .noeud.locked{opacity:.34;cursor:not-allowed;}
  .noeud.owned{border-color:#2C7A52;background:#0A1A12;cursor:default;}
  .noeud.owned .n-cout{color:#3BF07A;}
  .noeud.owned .n-cout::before{content:"✓ ";}
  .treeClose{display:block;margin:26px auto 0;}

  /* ---------- téléphone en portrait ---------- */
  @media (max-width:720px){
    .tokBtn{font-size:13px;padding:8px 11px;}
    :root{--u:clamp(30px,10.5vw,58px);}
    .stage{
      gap:clamp(8px,1.6vh,16px);
      padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
    }
    .eyebrow{letter-spacing:.26em;font-size:10px;flex-wrap:wrap;justify-content:center;
             max-width:78vw;}                     /* ne pas passer sous le bouton ☰ */
    .sub{font-size:clamp(16px,6.5vw,30px);}
    .telemetry{grid-template-columns:repeat(2,1fr);}
    .cell{padding:7px 10px;}
    .cell .k{font-size:9px;letter-spacing:.18em;}
    .cell .v{font-size:13px;}
    .ticks{font-size:10px;height:14px;}
    .libre{font-size:clamp(56px,21vw,150px);}
    .burger{width:clamp(96px,26vw,140px);height:clamp(78px,12vh,120px);}
    .banner{font-size:clamp(15px,5vw,26px);letter-spacing:.24em;}
  }

  /* ---------- téléphone en paysage : rien que le timer ---------- */
  @media (max-width:960px) and (orientation:landscape){
    :root{--u:clamp(24px,12vh,54px);}            /* dimensionné sur la hauteur, l'écran est bas */
    .stage{gap:clamp(4px,1.4vh,12px);}
    .telemetry,.day,.banner{display:none;}       /* on cache Phase, Travail effectif, la frise… */
    .eyebrow{font-size:10px;letter-spacing:.24em;}
    .sub{font-size:clamp(14px,4.6vh,26px);}
    .libre{font-size:clamp(44px,22vh,150px);}
  }

  @media (prefers-reduced-motion: reduce){
    body.rouge .stage,body.violet .stage,body.arc .stage{animation:none}
    .dot,.colon,.burger i{animation:none}
    body.arc .rgbVeil{animation:none}       /* voile figé plutôt que défilant */
  }
</style>

<script>
(() => {
  "use strict";

  /* ============ horaires de la journée ============ */
  const DEF = {           // valeurs d'usine, restaurables via le menu
    debut:    [8, 30],    // arrivée
    dejeuner: [12, 0],    // début de la pause repas
    reprise:  [13, 0],    // fin de la pause repas
    depart:   [16, 30],   // libération
    pause:    true         // pause déjeuner active ?
  };
  const CLE = "evasion.horaires";
  const clone = o => JSON.parse(JSON.stringify(o));   // WebView ancienne : pas de structuredClone
  function chargeHoraires(){          // réglages mémorisés d'une session à l'autre
    try {
      const o = JSON.parse(localStorage.getItem(CLE));
      if (o && o.debut && o.dejeuner && o.reprise && o.depart){
        if (typeof o.pause !== "boolean") o.pause = true;   // réglage ajouté après coup
        return o;
      }
    } catch { /* stockage indisponible : on repart des valeurs d'usine */ }
    return clone(DEF);
  }
  let horaires = chargeHoraires();
  function sauveHoraires(){ try { localStorage.setItem(CLE, JSON.stringify(horaires)); } catch {} }
  /* Paliers d'urgence avant le départ, du plus lointain au plus proche.
     Le premier dont le seuil est atteint gagne, d'où l'ordre décroissant.        */
  const SEUILS = [
    { classe: "jaune",   sec: 60 * 60 },
    { classe: "orange",  sec: 15 * 60 },
    { classe: "rouge",   sec:  5 * 60 },
    { classe: "violet",  sec:      60 },
    { classe: "arc",     sec:      10 }
  ];

  /* ============ progression : tokens & arbre de compétences ============ */
  // Vrai arbre qui descend : chaque nœud a un parent unique (pre) et une position
  // (row = profondeur, col = colonne 1..5). Acheter une porte d'économie « +1 ✦/min »
  // ouvre la branche des alertes, puis le Rainbow.
  const BASE_RATE = 1 / 60;      // monnaie par seconde au départ (= 1/min), +1/min par porte d'éco

  /* Les mondes partagent les MÊMES identifiants de compétence (min, sec, jaune…) :
     seuls les noms, coûts, positions et couleurs changent. Toute la logique de
     déblocage reste donc commune, et un monde n'est qu'un habillage + un arbre. */
  const MONDES = {
    neon: {
      nom: "Salle de contrôle", icone: "🎛️", monnaie: "✦",
      paliers: { base:"#00E5FF", jaune:"#FFE34A", orange:"#FF9A1F",
                 rouge:"#FF3B2F", violet:"#B14DFF" },
      competences: [
        { id:"start",  nom:"Compte à rebours",     cout:0,   pre:null,     row:1, col:3 },
        { id:"min",    nom:"Minutes",              cout:20,  pre:"start",  row:2, col:2 },
        { id:"stats",  nom:"Statistiques",         cout:15,  pre:"start",  row:2, col:4 },
        { id:"sec",    nom:"Secondes",             cout:55,  pre:"min",    row:3, col:1 },
        { id:"rate1",  nom:"+1 ✦ / min",           cout:40,  pre:"min",    row:3, col:3 },
        { id:"bg",     nom:"Décor spatial",        cout:25,  pre:"stats",  row:3, col:5 },
        { id:"ms",     nom:"Millisecondes",        cout:140, pre:"sec",    row:4, col:1 },
        { id:"jaune",  nom:"Jaune · 1 h",          cout:60,  pre:"rate1",  row:4, col:3 },
        { id:"lunch",  nom:"Pause déjeuner",       cout:55,  pre:"stats",  row:4, col:4 },
        { id:"wake",   nom:"Écran allumé",         cout:30,  pre:"bg",     row:4, col:5 },
        { id:"us",     nom:"Microsecondes",        cout:340, pre:"ms",     row:5, col:1 },
        { id:"son",    nom:"Alertes sonores",      cout:25,  pre:"jaune",  row:5, col:2 },

  function poissonRecif(c, s, clarte){         // corps rond, queue en éventail, rayé

    c.lineTo(-s.t * 2.1, -s.t * .5); c.lineTo(-s.t * 1.72, 0);
    c.lineTo(-s.t * 2.1, s.t * .5); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-s.t * .1, -s.t * .32);                     // aileron dorsal
    c.lineTo(s.t * .3, -s.t * .78); c.lineTo(s.t * .5, -s.t * .28); c.closePath(); c.fill();
  }
  function meduse(c, s, t0){                   // ombrelle translucide + tentacules
    const pulse = 1 + Math.sin(t0 * 1.5 + s.ph) * .13, R = s.t * 1.15;
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "rgba(140,120,255,.16)";
    c.beginPath(); c.arc(0, 0, R * 2.2 * pulse, 0, 6.283); c.fill();
    const g = c.createLinearGradient(0, -R, 0, R * .8);
    g.addColorStop(0, "rgba(226,214,255,.72)");
    g.addColorStop(1, "rgba(150,120,235,.16)");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, R * pulse, R * .78 * pulse, 0, Math.PI, 0); c.fill();
    c.strokeStyle = "rgba(206,190,255,.5)"; c.lineWidth = 1.6 * dpr; c.lineCap = "round";
    for (let k = -2; k <= 2; k++){
      c.beginPath(); c.moveTo(k * R * .3, R * .1);
      c.quadraticCurveTo(k * R * .48 + Math.sin(t0 * 2.2 + k + s.ph) * 7 * dpr, R * 1.5,
                         k * R * .32, R * 2.6);
      c.stroke();
    }
    c.globalCompositeOperation = "source-over";
  }
  function poissonLanterne(c, s, t0){          // corps trapu, mâchoire, leurre lumineux
    const L = s.t * 1.1;
    c.fillStyle = "rgba(8,12,22,.96)";
    c.beginPath(); c.ellipse(0, 0, L, L * .72, 0, 0, 6.283); c.fill();
    c.beginPath(); c.moveTo(-L * .95, 0);                                 // queue
    c.lineTo(-L * 1.7, -L * .5); c.lineTo(-L * 1.7, L * .5); c.closePath(); c.fill();
    c.fillStyle = "rgba(230,244,255,.85)";                                // dents
    for (let k = 0; k < 5; k++){
      const x = L * (.18 + k * .16);
      c.beginPath(); c.moveTo(x, L * .3); c.lineTo(x + L * .07, L * .05);
      c.lineTo(x + L * .14, L * .3); c.closePath(); c.fill();
    }
    c.strokeStyle = "rgba(10,16,26,.96)"; c.lineWidth = 2.2 * dpr;        // tige du leurre
    c.beginPath(); c.moveTo(L * .25, -L * .55);
    c.quadraticCurveTo(L * 1.25, -L * 1.5, L * 1.5, -L * .55); c.stroke();
    const pulse = .55 + Math.sin(t0 * 3 + s.ph) * .45;                    // leurre qui palpite
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "rgba(140,255,220," + (.16 * pulse) + ")";
    c.beginPath(); c.arc(L * 1.5, -L * .55, L * 1.5, 0, 6.283); c.fill();
    c.fillStyle = "rgba(200,255,240," + (.55 + .4 * pulse) + ")";
    c.beginPath(); c.arc(L * 1.5, -L * .55, L * .22, 0, 6.283); c.fill();
    c.globalCompositeOperation = "source-over";
    c.fillStyle = "rgba(150,240,255,.8)";                                 // œil
    c.beginPath(); c.arc(L * .45, -L * .18, L * .11, 0, 6.283); c.fill();
  }

  /* ---- instruments : règle de profondeur + manomètre ----
     RP : l'écran est le masque du plongeur. La vitre du manomètre puis celle du
     casque se fissurent quand la pression devient critique. */
  let rulePM = -1;                          // profondeur max déjà graduée
  function construitRegle(PM){
    if (rulePM === PM) return;
    rulePM = PM;
    const pas = PM <= 40 ? 5 : PM <= 250 ? 25 : PM <= 700 ? 100 : 200;
    let h = "";
    for (let m = 0; m <= PM; m += pas){
      const y = (m / PM) * 100, maj = (m % (pas * 2) === 0);
      h += '<i class="' + (maj ? "maj" : "") + '" style="top:' + y + '%;width:'
         + (maj ? 14 : 8) + 'px"></i>';
      if (maj) h += '<b style="top:' + y + '%">' + m + '</b>';
    }
    $("drTicks").innerHTML = h;
    // graduations du cadran, une fois par échelle
    const barMax = 1 + PM / 10;
    let t = "";
    for (let i = 0; i <= 8; i++){
      const a = (-120 + i * 30) * Math.PI / 180, maj = i % 2 === 0;
      const r1 = maj ? 36 : 40, r2 = 46;
      t += '<line class="' + (maj ? "maj" : "") + '" x1="' + (60 + Math.sin(a) * r1).toFixed(1)
         + '" y1="' + (60 - Math.cos(a) * r1).toFixed(1)
         + '" x2="' + (60 + Math.sin(a) * r2).toFixed(1)
         + '" y2="' + (60 - Math.cos(a) * r2).toFixed(1) + '"/>';
    }
    $("pgTicks").innerHTML = t;
    $("pressGauge").dataset.max = barMax;
  }
  function majInstruments(secDep){
    const PM = profMax();
    construitRegle(PM);
    // règle : le curseur descend avec nous
    $("drCursor").style.top = Math.max(0, Math.min(100, profM / PM * 100)) + "%";
    $("drVal").textContent = "−" + (profM < 100 ? profM.toFixed(1) : Math.round(profM));
    // manomètre : 1 bar d'atmosphère + 1 bar par tranche de 10 m
    const bar = 1 + profM / 10, barMax = Number($("pressGauge").dataset.max) || 1;
    $("pgNeedle").style.transform =
      "rotate(" + (-120 + Math.min(1, bar / barMax) * 240).toFixed(1) + "deg)";
    $("pgVal").textContent = bar.toFixed(bar < 100 ? 1 : 0) + " bar";
    // état de la LED. Une fois le départ passé, tout redevient calme :
    // sinon les fissures resteraient à l'écran toute la soirée.
    const b = document.body, avant = secDep > 0;
    const etat = !avant ? "" : secDep <= 60 ? "noire" : secDep <= 300 ? "rouge"
               : secDep <= 1200 ? "orange" : secDep <= 3600 ? "jaune" : "";
    for (const e of ["jaune", "orange", "rouge", "noire"])
      b.classList.toggle("led-" + e, etat === e);
    b.classList.toggle("pg-fissure", avant && secDep <= 300);   // vitre du manomètre
    b.classList.toggle("visor-casse", avant && secDep <= 60);   // vitre du casque
  }

  let profM = 0;                            // profondeur courante
  function dessineAbysses(prog, enPause, alerte, libre, secDep){
    initAbysses();
    const p = Math.max(0, Math.min(1, prog));
    const lent = reduce ? .35 : 1;
    const PM = profMax();
    profM = PM * p;                          // on DESCEND : 0 le matin, PM le soir
    const t0 = performance.now() / 1000;
    const zone = libre ? "fosse" : zoneDe(secDep);
    const clarte = libre ? .05 : clarteDe(secDep);
    const g = ctx.createLinearGradient(0, 0, 0, Hh);
    g.addColorStop(0, "rgb(" + mix([1, 8, 18], [96, 214, 232], clarte) + ")");
    g.addColorStop(1, "rgb(" + mix([0, 2, 6], [14, 104, 146], clarte) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);

    // géométrie verticale : le plongeur est fixe, surface et fond défilent.
    // SPAN large = la surface quitte l'écran tôt, le fond n'arrive qu'à la fin.
    const dy = Hh * .46, SPAN = Hh * 3;
    const surfY = dy - p * SPAN;
    const solY  = dy + (1 - p) * SPAN;

    // rais de lumière, seulement tant qu'on est assez haut
    if (clarte > .12){
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 4; i++){
        const x = W * (.16 + i * .24) + Math.sin(t0 * .25 + i) * 40 * dpr;
        const w = (34 + Math.sin(t0 * .4 + i * 2) * 12) * dpr;
        const gr = ctx.createLinearGradient(x, 0, x + w * .6, Hh);
        gr.addColorStop(0, "rgba(190,245,255," + (.04 + clarte * .14) + ")");
        gr.addColorStop(1, "rgba(190,245,255,0)");
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.moveTo(x - w, 0); ctx.lineTo(x + w, 0);
        ctx.lineTo(x + w * 2.4, Hh); ctx.lineTo(x - w * .4, Hh);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }

    // plancton : il monte puisqu'on descend
    for (const q of plancton){
      q.y -= q.v * lent * (enPause ? .12 : 1);
      if (q.y < -4){ q.y = Hh + 4; q.x = Math.random() * W; }
      ctx.fillStyle = "rgba(200,240,255," + (q.a * (.2 + clarte * .45)) + ")";
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
    }

    // ---- la surface et le bateau, visibles seulement au tout début ----
    if (surfY > -120 * dpr){
      const sg = ctx.createLinearGradient(0, surfY - 130 * dpr, 0, surfY);
      sg.addColorStop(0, "rgba(255,255,255,.5)");
      sg.addColorStop(1, "rgba(200,248,255,0)");
      ctx.fillStyle = sg; ctx.fillRect(0, surfY - 130 * dpr, W, 130 * dpr);
      ctx.strokeStyle = "rgba(240,255,255,.85)"; ctx.lineWidth = 2.4 * dpr;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12 * dpr)
        ctx.lineTo(x, surfY + Math.sin(x * .015 + t0 * 2.2) * 5 * dpr);
      ctx.stroke();

      if (aDebloque("boat")){                 // coque + cabine + mât, vus d'en dessous
        const bx = W * .13 + Math.sin(t0 * .6) * 14 * dpr;   // dégagé du compteur
        const by = surfY + Math.sin(bx * .015 + t0 * 2.2) * 5 * dpr;
        ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.sin(t0 * .9) * .05);
        ctx.fillStyle = "rgba(10,24,38,.95)";
        ctx.beginPath(); ctx.moveTo(-52 * dpr, 0); ctx.lineTo(52 * dpr, 0);
        ctx.quadraticCurveTo(40 * dpr, 22 * dpr, -28 * dpr, 20 * dpr);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(18,40,60,.95)";
        ctx.fillRect(-16 * dpr, -20 * dpr, 30 * dpr, 20 * dpr);           // cabine
        ctx.fillRect(24 * dpr, -44 * dpr, 3.5 * dpr, 44 * dpr);           // mât
        ctx.restore();
      }
    }

    // ---- le fond, qui n'apparaît qu'en fin de journée ----
    if (solY < Hh + 60 * dpr){
      ctx.fillStyle = "rgb(" + mix([14, 18, 26], [226, 206, 156], clarte) + ")";
      ctx.beginPath(); ctx.moveTo(0, Hh); ctx.lineTo(0, solY + 14 * dpr);
      for (let x = 0; x <= W; x += 24 * dpr)
        ctx.lineTo(x, solY + Math.sin(x * .011) * 11 * dpr);
      ctx.lineTo(W, Hh); ctx.closePath(); ctx.fill();

      if (aDebloque("algues")){
        ctx.strokeStyle = "rgba(" + mix([16, 52, 46], [56, 164, 96], clarte) + ",.9)";
        ctx.lineCap = "round";
        for (const hb of herbes){
          const base = solY + Math.sin(hb.x * .011) * 11 * dpr;
          ctx.lineWidth = hb.w;
          ctx.beginPath(); ctx.moveTo(hb.x, base);
          ctx.quadraticCurveTo(hb.x + Math.sin(t0 * 1.1 + hb.ph) * 18 * dpr, base - hb.h * .58,
                               hb.x + Math.sin(t0 * 1.1 + hb.ph) * 27 * dpr, base - hb.h);
          ctx.stroke();
        }
      }
      if (aDebloque("tresor")){               // coffre ouvert, or qui déborde
        // à droite du compteur : au centre, le coffre passerait sous les chiffres
        const cx = W * .87, cy = solY + Math.sin(cx * .011) * 11 * dpr - 16 * dpr, s = dpr;
        ctx.save(); ctx.translate(cx, cy);
        ctx.fillStyle = "rgb(" + mix([26, 22, 18], [96, 62, 32], clarte) + ")";
        ctx.fillRect(-28 * s, 0, 56 * s, 22 * s);                          // caisse
        ctx.save(); ctx.rotate(-.42);                                      // couvercle ouvert
        ctx.beginPath(); ctx.ellipse(-6 * s, -8 * s, 28 * s, 14 * s, 0, Math.PI, 0); ctx.fill();
        ctx.restore();
        ctx.fillStyle = "rgb(" + mix([56, 46, 20], [214, 172, 62], clarte) + ")";
        ctx.fillRect(-28 * s, -3 * s, 56 * s, 5 * s);                      // ferrure
        for (let k = 0; k < 7; k++){                                       // pièces
          ctx.beginPath();
          ctx.ellipse(-20 * s + k * 7 * s, -6 * s + Math.sin(k * 2.1) * 3 * s,
                      4.4 * s, 2.6 * s, 0, 0, 6.283);
          ctx.fill();
        }
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(255,214,110," + (.14 + Math.sin(t0 * 2) * .05) + ")";
        ctx.beginPath(); ctx.arc(0, 0, 46 * s, 0, 6.283); ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.restore();
      }
    }

    // ---- faune de la zone courante uniquement ----
    if (aDebloque("bg")){
      const zoneOk = { recif:true, large:true, meduses:aDebloque("rouge"),
                       abysse:aDebloque("rouge"), fosse:aDebloque("rouge") }[zone];
      // les méduses sont grandes : moins nombreuses. Dans la fosse, la vie se raréfie.
      const cible = !zoneOk ? 0
                  : zone === "fosse"   ? 3
                  : zone === "meduses" ? 5
                  : (aDebloque("orange") ? 9 : 5);
      // renouveler la population quand on change de zone
      for (let i = nageurs.length - 1; i >= 0; i--)
        if (nageurs[i].zone !== zone) nageurs.splice(i, 1);
      while (nageurs.length < cible) nageurs.push(seedNageur(zone, true));
      while (nageurs.length > cible) nageurs.pop();

      for (const s of nageurs){
        s.x += s.v * s.dir * lent;
        s.y += Math.sin(t0 * 1.6 + s.ph) * .5 * dpr;
        if (s.dir > 0 ? s.x > W + 90 * dpr : s.x < -90 * dpr) Object.assign(s, seedNageur(zone));
        ctx.save(); ctx.translate(s.x, s.y); ctx.scale(s.dir, 1);
        if (zone === "recif")        poissonRecif(ctx, s, clarte);
        else if (zone === "large")   poissonLarge(ctx, s, clarte);
        else if (zone === "meduses") meduse(ctx, s, t0);
        else                         poissonLanterne(ctx, s, t0);   // abysse et fosse
        ctx.restore();
      }
    }
    if (aDebloque("violet") && zone !== "recif"){       // la baleine, passage rare
      if (!baleine && Math.random() < .0014)
        baleine = { x: -340 * dpr, y: Hh * (.14 + Math.random() * .6), v: .85 * dpr };
      if (baleine){
        baleine.x += baleine.v * lent;
        if (baleine.x > W + 360 * dpr) baleine = null;
        else {
          const b = baleine, L = 270 * dpr, H2 = 66 * dpr;
          ctx.save(); ctx.translate(b.x, b.y);
          ctx.fillStyle = "rgba(10,32,54," + (.45 + clarte * .3) + ")";
          ctx.beginPath(); ctx.moveTo(L * .5, 0);
          ctx.quadraticCurveTo(L * .1, -H2 * .55, -L * .42, -H2 * .3);
          ctx.quadraticCurveTo(-L * .58, -H2 * .1, -L * .5, 0);
          ctx.quadraticCurveTo(-L * .58, H2 * .16, -L * .42, H2 * .34);
          ctx.quadraticCurveTo(L * .1, H2 * .6, L * .5, 0);
          ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-L * .46, 0);                        // nageoire caudale
          ctx.lineTo(-L * .8, -H2 * .6); ctx.lineTo(-L * .68, 0);
          ctx.lineTo(-L * .8, H2 * .6); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-L * .02, H2 * .28);                 // pectorale
          ctx.lineTo(-L * .2, H2 * .78); ctx.lineTo(L * .1, H2 * .38); ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
    }

    // ---- le plongeur : il descend, tête en bas ----
    if (aDebloque("diver")){
      const dxp = W * .17, tang = Math.sin(t0 * 1.1) * .07;
      ctx.save(); ctx.translate(dxp, dy); ctx.rotate(.42 + tang);
      ctx.fillStyle = "rgba(6,16,28,.95)";
      ctx.beginPath(); ctx.ellipse(0, 0, 25 * dpr, 10 * dpr, 0, 0, 6.283); ctx.fill();   // torse
      ctx.beginPath(); ctx.arc(23 * dpr, -3 * dpr, 8.5 * dpr, 0, 6.283); ctx.fill();     // tête
      ctx.fillStyle = "rgba(16,34,52,.95)";
      ctx.fillRect(-16 * dpr, -17 * dpr, 18 * dpr, 13 * dpr);                            // bloc
      ctx.fillStyle = "rgba(6,16,28,.95)";
      ctx.beginPath(); ctx.moveTo(-22 * dpr, -2 * dpr);                                  // jambes
      ctx.lineTo(-40 * dpr, -7 * dpr); ctx.lineTo(-40 * dpr, 4 * dpr); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-38 * dpr, -8 * dpr);                                  // palmes
      ctx.lineTo(-58 * dpr, -16 * dpr); ctx.lineTo(-52 * dpr, -2 * dpr); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-38 * dpr, 3 * dpr);
      ctx.lineTo(-56 * dpr, 12 * dpr); ctx.lineTo(-50 * dpr, -1 * dpr); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(" + accent().map(Math.round) + ",.95)";                      // masque
      ctx.beginPath(); ctx.ellipse(27 * dpr, -4 * dpr, 5.5 * dpr, 4 * dpr, 0, 0, 6.283); ctx.fill();
      ctx.restore();

      // lampe frontale dans le noir
      if (clarte < .3){
        ctx.globalCompositeOperation = "lighter";
        const lg = ctx.createRadialGradient(dxp + 30 * dpr, dy + 10 * dpr, 0,
                                            dxp + 30 * dpr, dy + 10 * dpr, 230 * dpr);
        lg.addColorStop(0, "rgba(190,240,255,.20)");
        lg.addColorStop(1, "rgba(190,240,255,0)");
        ctx.fillStyle = lg; ctx.fillRect(0, 0, W, Hh);
        ctx.globalCompositeOperation = "source-over";
      }

      if (bulles.length < 40 && Math.random() < (enPause ? .2 : .4))
        bulles.push({ x: dxp + 22 * dpr + (Math.random() - .5) * 10 * dpr, y: dy - 10 * dpr,
                      r: (Math.random() * 3 + 1.2) * dpr,
                      v: (Math.random() * 1.4 + .9) * dpr, ph: Math.random() * 6.3 });
    } else if (bulles.length < 6 && Math.random() < .04){
      bulles.push({ x: Math.random() * W, y: Hh, r: (Math.random() * 2.4 + 1) * dpr,
                    v: (Math.random() * 1 + .6) * dpr, ph: Math.random() * 6.3 });
    }
    for (let i = bulles.length - 1; i >= 0; i--){
      const b = bulles[i];
      b.y -= b.v * lent; b.x += Math.sin(b.y * .04 + b.ph) * .6 * dpr;
      if (b.y < -10){ bulles.splice(i, 1); continue; }
      ctx.strokeStyle = "rgba(225,250,255,.5)"; ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.stroke();
    }

    // voile central : sans lui le texte serait illisible en eau claire
    const vg = ctx.createRadialGradient(W * .5, Hh * .42, 0, W * .5, Hh * .42, Math.max(W, Hh) * .55);
    vg.addColorStop(0, "rgba(1,12,22," + (.30 * clarte + .12) + ")");
    vg.addColorStop(1, "rgba(1,12,22,0)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, Hh);

    // fin de journée : on touche le fond, la lampe éclaire le sable
    if (libre){
      ctx.globalCompositeOperation = "lighter";
      const s = ctx.createRadialGradient(W * .5, Hh * .7, 0, W * .5, Hh * .7, Hh * .9);
      s.addColorStop(0, "rgba(190,235,255,.22)");
      s.addColorStop(1, "rgba(190,235,255,0)");
      ctx.fillStyle = s; ctx.fillRect(0, 0, W, Hh);
      ctx.globalCompositeOperation = "source-over";
    }
  }
  /* ========================================================= */

  /* --- le hamburger : une couche toutes les 15 minutes de pause --- */
  const COUCHES = ["l-bunb","l-steak","l-cheese","l-salad","l-tomato","l-onion","l-bacon","l-bunt"];
  let couchesPosees = -1;
  function majBurger(n){
    if (n === couchesPosees) return;
    const host = $("burger");
    if (n < couchesPosees){ host.textContent = ""; couchesPosees = 0; }
    for (let i = couchesPosees < 0 ? 0 : couchesPosees; i < n; i++){
      const el = document.createElement("i");
      el.className = COUCHES[i];
      host.appendChild(el);
      if (couchesPosees >= 0) chirp(180 + i * 40, .12, "sine", .05);
    }
    couchesPosees = n;
  }

  /* --- boucle --- */
  let frames = 0, fpsT = performance.now();
  function loop(){
    hostWin().requestAnimationFrame(loop);
    const t = nowUs(), now = t / 1000;
    const b = document.body;
    // si l'appli est épinglée en PiP, son body reçoit les mêmes classes d'état
    if (pipWin) pipWin.document.body.className = b.className;
    if (new Date(now).getDate() !== jourAffiche) recale();   // minuit : on repart sur la journée suivante

    // tokens : le rAF ne tourne que fenêtre visible → on crédite le temps réellement passé
    const pn = performance.now();
    if (lastTok) jeu.earned += Math.min(1, (pn - lastTok) / 1000) * tauxToken();
    lastTok = pn;
    const s = solde();
    $("tokVal").textContent = s; $("treeVal").textContent = s;
    if (pn - tokSaveT > 1000){ tokSaveT = pn; sauveJeu(); majArbre(); }

    // phase de la journée (pause : réglable ET débloquée dans l'arbre)
    const pauseOn = horaires.pause && aDebloque("lunch");
    if (now < A.debut)                phase = "avant";
    else if (pauseOn && now < A.dej)  phase = "matin";
    else if (pauseOn && now < A.rep)  phase = "pause";
    else if (now < A.dep)             phase = pauseOn ? "aprem" : "jour";
    else                              phase = "libre";

    const enPause = phase === "pause";
    // pendant la pause, le compte à rebours vise la reprise ; sinon, le départ
    const cibleUs = (enPause ? A.rep : A.dep) * 1000;
    const rem = cibleUs - t, over = rem < 0, abs = Math.abs(rem);

    // Affichage arrondi AU-DESSUS jusqu'à la plus petite unité débloquée : sinon, avec
    // seulement les heures, 30 min restantes montreraient « 0 h » sans être LIBRE.
    // (abs reste la vraie valeur : seuils, bips et logique ne doivent pas être arrondis.)
    const unite = aDebloque("us")  ? 1
                : aDebloque("ms")  ? 1e3
                : aDebloque("sec") ? 1e6
                : aDebloque("min") ? 6e7
                :                    3.6e9;
    const absR = over ? abs : Math.ceil(abs / unite) * unite;
    setDigits(H, Math.min(Math.floor(absR / 3.6e9), 99));
    setDigits(M, Math.floor(absR / 6e7) % 60);
    setDigits(S, Math.floor(absR / 1e6) % 60);
    $("ms").textContent = pad(Math.floor(absR / 1e3) % 1000, 3);
    $("us").textContent = pad(absR % 1000, 3);

    // habillage selon la phase
    const secLeft = rem / 1e6;
    const secDep = (A.dep - now) / 1000;           // secondes avant le départ, seul juge de l'urgence
    let alerte = "";
    if (!enPause && phase !== "libre")
      for (const s of SEUILS) if (aDebloque(s.classe) && secDep <= s.sec) alerte = s.classe;
    b.classList.toggle("lunch", enPause);
    for (const s of SEUILS) b.classList.toggle(s.classe, alerte === s.classe);
    if (alerte !== lastAlerte){
      ({ jaune:  () => air([523, 659]),
         orange: () => air([440, 554]),
         rouge:  () => air([392, 466, 587]),
         violet: () => air([330, 415, 523, 622]),
         arc:    () => air([262, 330, 392, 523, 659, 784])
       }[alerte] || (() => {}))();
      lastAlerte = alerte;
    }

    if (phase !== lastPhase){
      if (lastPhase !== ""){
        if (enPause){ burst(20, 45); air([392, 523, 659, 784]); }
        else if (phase === "aprem"){ burst(200, 60); air([784, 659, 523]); }
      }
      lastPhase = phase;
    }

    if (phase === "libre" && !freed){
      freed = true;
      b.classList.add("free");
      for (const s of SEUILS) b.classList.remove(s.classe);
      burst(120, 70); air([523, 659, 784, 1046]);
    }
    $("status").textContent = {
      avant: "avant l'embauche", matin: "matinée", pause: "pause repas",
      aprem: "après-midi", jour: "journée en cours", libre: "heures supplémentaires"
    }[phase];
    $("targetLbl").textContent = enPause ? "reprise à " + hhmm(A.rep)
                               : phase === "libre" ? "départ passé à " + hhmm(A.dep)
                               : "départ à " + hhmm(A.dep);

    // hamburger : 8 couches réparties sur la pause
    majBurger(enPause ? Math.max(1, Math.ceil((now - A.dej) / (A.rep - A.dej) * 8)) : 0);

    // bips
    if (!over){
      const sec = Math.ceil(secLeft);
      if (sec !== lastSecond){
        lastSecond = sec;
        if (sec <= 10) chirp(sec <= 3 ? 1100 : 880, .05);
        else if (sec % 60 === 0) chirp(enPause ? 330 : 440, .07);
      }
    }

    // frise + télémétrie
    const span = A.dep - A.debut;
    const prog = Math.max(0, Math.min(1, (now - A.debut) / span));
    $("fill").style.width = (prog * 100).toFixed(3) + "%";
    $("cursor").style.left = (prog * 100).toFixed(3) + "%";

    const pause = pauseOn ? (A.rep - A.dej) : 0;
    const ecoule = Math.max(0, Math.min(now, A.dep) - A.debut);
    const pausePrise = pauseOn ? Math.max(0, Math.min(now, A.rep) - A.dej) : 0;
    const effectif = Math.max(0, ecoule - pausePrise);
    const totalTravail = span - pause;

    $("tPhase").textContent = { avant:"attente", matin:"matinée", pause:"repas",
                                aprem:"après-midi", jour:"en cours", libre:"libéré" }[phase];
    $("tWork").textContent = duree(effectif);
    $("tLeft").textContent = duree(totalTravail - effectif);
    $("tPct").textContent  = (prog * 100).toFixed(2) + " %";

    if (enPause){
      $("kExtra").textContent = "burger";
      $("tExtra").textContent = couchesPosees + "/8 couches";
    } else if (phase === "libre"){
      $("kExtra").textContent = "heures sup";     // l'info survit, le compteur géant non
      $("tExtra").textContent = duree(now - A.dep);
    } else if (pauseOn && (phase === "matin" || phase === "avant")){
      $("kExtra").textContent = "pause repas";
      $("tExtra").textContent = "dans " + duree(A.dej - now);
    } else {
      $("kExtra").textContent = "cafés possibles";
      $("tExtra").textContent = String(Math.max(0, Math.floor((A.dep - now) / 3e5)));
    }

    if (save.actif === "abysses") majInstruments(secDep);

    frames++;
    if (performance.now() - fpsT > 500){
      $("tFps").textContent = (frames / ((performance.now() - fpsT) / 1000)).toFixed(0) + " Hz";
      frames = 0; fpsT = performance.now();
    }

    /* ---- rendu ---- */
    const [r, g2, bl] = accent();

    if (save.actif === "abysses"){       // ===== MONDE 2 : remontée des abysses =====
      dessineAbysses(prog, enPause, alerte, phase === "libre", secDep);
      for (let i = bursts.length - 1; i >= 0; i--){
        const p = bursts[i];
        p.x += p.vx; p.y += p.vy; p.vy += .18 * dpr; p.life -= .012;
        if (p.life <= 0){ bursts.splice(i, 1); continue; }
        ctx.fillStyle = `hsla(${p.hue},100%,65%,${p.life})`;
        ctx.fillRect(p.x, p.y, 3 * dpr, 3 * dpr);
      }
      return;
    }

    // voile plus léger en warp : les traînées persistent et étirent l'hyperespace
    ctx.fillStyle = alerte === "arc" ? "rgba(4,5,10,.17)"
                  : enPause ? "rgba(10,4,2,.30)" : "rgba(4,5,10,.34)";
    ctx.fillRect(0, 0, W, Hh);

    if (enPause){
      // la faim monte : tout tombe plus vite à l'approche de la reprise
      const faim = 1 + (1 - Math.min(1, secLeft / (pause / 1000))) * 2.6;
      ctx.fillStyle = "#FFFFFF";   // sinon les emoji héritent du voile de fond
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.globalAlpha = .18;       // en fond, discrets : ils ne concurrencent pas le burger et le texte
      for (const f of food){
        f.y += f.vy * (reduce ? .3 : 1) * faim;
        f.rot += f.vr * faim;
        if (f.y > Hh + 80 * dpr) Object.assign(f, seedFood(true));
        ctx.save();
        ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.font = f.size + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
        ctx.fillText(f.ch, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    } else if (alerte === "arc" || aDebloque("bg")) {
      // champ d'étoiles ambiant = « décor spatial » ; l'hyperespace vient avec le RAINBOW.
      const warp = alerte === "arc";                 // hyperespace RGB sur les 10 dernières s
      const urgence = over ? 5 : Math.max(.35, Math.min(4.5, 90 / Math.max(secLeft, 3)));
      const speed = warp ? (reduce ? .02 : .075) : (reduce ? .12 : .5) * urgence * .004;
      const cx = W / 2, cy = Hh / 2, fl = Math.min(W, Hh) * .9;
      for (const st of stars){
        st.z -= speed;
        if (st.z <= .02){ Object.assign(st, seedStar(1)); continue; }
        const x = cx + (st.x / st.z) * fl, y = cy + (st.y / st.z) * fl;
        if (x < -60 || x > W + 60 || y < -60 || y > Hh + 60){ Object.assign(st, seedStar(1)); continue; }
        const pz = Math.min(st.z + speed * (warp ? 3 : 9), 1);
        const a = Math.min(1, (1 - st.z) * 1.1);
        if (warp){
          // chaque étoile prend une couleur de la palette, décalée par son offset
          const [hr, hg, hb] = arcColor(arcPhase() + st.h / 360);
          ctx.strokeStyle = `rgba(${hr|0},${hg|0},${hb|0},${a})`;
          ctx.lineWidth = Math.max(1.5, (1 - st.z) * 3.6) * dpr;
        } else {
        ctx.strokeStyle = `rgba(${r},${g2},${bl},${a * .85})`;
        ctx.lineWidth = Math.max(1, (1 - st.z) * 2.4) * dpr;
        }
        ctx.beginPath();
        ctx.moveTo(cx + (st.x / pz) * fl, cy + (st.y / pz) * fl);
        ctx.lineTo(x, y); ctx.stroke();
      }
    }

    // le feu lèche le bas de l'écran : braises à 5 min, enfer à 1 min (l'arc-en-ciel, lui, part en warp)
    const BRASIER = {
      //        débit  teinte  étalement  vitesse  usure  taille  halo
      rouge:  { n: 6,  h: 4,   d: 32,     f: 1,    dv: 1,   t: 18, halo: .20, wash: "255,60,20" },
      violet: { n: 34, h: 262, d: 46,     f: 5.2,  dv: 2.3, t: 26, halo: .50, wash: "150,50,255" }
    }[alerte];
    if (BRASIER){                    // les flammes viennent avec Rouge/Violet, à leur palier
      const haut = Hh * BRASIER.halo;
      const g = ctx.createLinearGradient(0, Hh, 0, Hh - haut);
      g.addColorStop(0, `rgba(${BRASIER.wash},.3)`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g; ctx.fillRect(0, Hh - haut, W, haut);
      ctx.globalCompositeOperation = "source-over";
      attise(reduce ? Math.ceil(BRASIER.n / 3) : BRASIER.n,
             BRASIER.h, BRASIER.d, BRASIER.f, BRASIER.t, BRASIER.dv);
    }
    brule();

    for (let i = bursts.length - 1; i >= 0; i--){
      const p = bursts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .18 * dpr; p.life -= .012;
      if (p.life <= 0){ bursts.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(${p.hue},100%,65%,${p.life})`;
      ctx.fillRect(p.x, p.y, 3 * dpr, 3 * dpr);
    }
  }

  /* --- menu de réglages --- */
  const CHAMPS = { hDebut: "debut", hDej: "dejeuner", hRep: "reprise", hDep: "depart" };
  function syncMenu(){                          // reflète les réglages courants dans le panneau
    for (const [id, key] of Object.entries(CHAMPS))
      $(id).value = pad(horaires[key][0], 2) + ":" + pad(horaires[key][1], 2);
    $("pauseOn").checked = horaires.pause;
    $("pauseFields").classList.toggle("off", !horaires.pause);
    $("hDej").disabled = $("hRep").disabled = !horaires.pause;
  }
  for (const [id, key] of Object.entries(CHAMPS)){
    $(id).addEventListener("change", () => {
      const v = $(id).value;
      if (!v) return;
      const [h, m] = v.split(":").map(Number);
      horaires[key] = [h, m];
      sauveHoraires();
      recale();
    });
  }
  $("pauseOn").addEventListener("change", () => {
    horaires.pause = $("pauseOn").checked;
    sauveHoraires();
    recale();
  });
  $("reset").addEventListener("click", () => {
    horaires = clone(DEF);
    sauveHoraires();
    recale();
  });

  function ouvreMenu(o){
    document.body.classList.toggle("menu-open", o);
    $("menuBtn").setAttribute("aria-expanded", String(o));
  }
  $("menuBtn").addEventListener("click", () =>
    ouvreMenu(!document.body.classList.contains("menu-open")));
  $("backdrop").addEventListener("click", () => ouvreMenu(false));

  $("sound").addEventListener("click", e => {
    soundOn = !soundOn;
    e.currentTarget.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) chirp(880, .08);
  });
  $("full").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });
  addEventListener("keydown", e => {
    if (e.key === "Escape") ouvreMenu(false);
    if (e.key.toLowerCase() === "f" && aDebloque("full")) $("full").click();
    if (e.key.toLowerCase() === "r") recale();
  });

  /* --- téléphone : garder l'écran allumé, un compte à rebours qu'on regarde --- */
  let veille = null;
  async function garderAllume(){
    try {
      if (aDebloque("wake") && "wakeLock" in navigator && !veille){
        veille = await navigator.wakeLock.request("screen");
        veille.addEventListener("release", () => { veille = null; });
      }
    } catch { /* refusé ou non supporté : sans conséquence */ }
  }
  addEventListener("pointerdown", garderAllume);          // certains navigateurs exigent un geste
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible"){ lastTok = 0; garderAllume(); }
    else sauveJeu();                                       // on ne perd pas les tokens en quittant
  });
  addEventListener("pagehide", sauveJeu);
  garderAllume();

  /* --- arbre de compétences : rendu, achats, déblocages --- */
  function appliqueDeblocages(){
    const b = document.body;
    // union de TOUS les identifiants : une compétence absente du monde actif
    // (ex. les millisecondes dans les abysses) doit rester verrouillée, pas s'afficher.
    for (const id of TOUS_IDS)
      b.classList.toggle("lock-" + id, !(COMPETENCES().some(c => c.id === id) && aDebloque(id)));
  }
  const noeudEls = {};
  const SVGNS = "http://www.w3.org/2000/svg";
  function construitArbre(){
    const body = $("treeBody"); body.innerHTML = "";
    for (const k in noeudEls) delete noeudEls[k];    // sinon des nœuds de l'autre monde persistent
    const svg = document.createElementNS(SVGNS, "svg");   // couche des connecteurs, sous les nœuds
    svg.setAttribute("class", "treeLines"); svg.id = "treeLines";
    body.appendChild(svg);
    const rows = Math.max(...COMPETENCES().map(c => c.row));
    body.style.gridTemplateRows = "repeat(" + rows + ", auto)";
    for (const c of COMPETENCES()){
      const n = document.createElement("button");
      n.type = "button"; n.className = "noeud"; n.dataset.id = c.id;
      n.style.gridColumn = c.col; n.style.gridRow = c.row;
      n.innerHTML = '<span class="n-nom"></span><span class="n-cout"></span>';
      n.querySelector(".n-nom").textContent = c.nom;
      n.querySelector(".n-cout").textContent = c.cout ? c.cout + " " + MONDE().monnaie : "acquis";
      if (c.id !== "start") n.addEventListener("click", () => tenteAchat(c.id));
      body.appendChild(n); noeudEls[c.id] = n;
    }
    addEventListener("resize", () => {
      if (document.body.classList.contains("tree-open")) traceLignes();
    });
  }
  function traceLignes(){                       // relie chaque nœud à son parent (courbes de Bézier)
    const svg = $("treeLines"), body = $("treeBody");
    if (!svg) return;
    const R = body.getBoundingClientRect();
    let d = "";
    for (const c of COMPETENCES()){
      const a = noeudEls[c.pre], b = noeudEls[c.id];
      if (!a || !b) continue;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.left - R.left + ra.width / 2, y1 = ra.bottom - R.top;
      const x2 = rb.left - R.left + rb.width / 2, y2 = rb.top - R.top;
      const my = (y1 + y2) / 2;
      const col = aDebloque(c.id) ? "#3BF07A" : aDebloque(c.pre) ? "#00E5FF" : "#26314A";
      d += `<path d="M${x1} ${y1} C ${x1} ${my} ${x2} ${my} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="2"/>`;
    }
    svg.innerHTML = d;
  }
  function majArbre(){
    const bal = solde();
    let dispo = false;
    for (const c of COMPETENCES()){
      const el = noeudEls[c.id]; if (!el) continue;
      let st;
      if (aDebloque(c.id))          st = "owned";
      else if (!aDebloque(c.pre))   st = "locked";     // parent pas encore acheté
      else if (bal >= c.cout){ st = "buyable"; dispo = true; }
      else                          st = "pending";
      el.className = "noeud " + st;
      el.disabled = (st === "owned" || st === "locked");
    }
    $("tokBtn").classList.toggle("ready", dispo);
    // le bouton PRESTIGE n'apparaît que si tout le monde actif est acheté ET qu'un monde suit
    document.body.classList.toggle("peut-prestige", toutAchete() && !!mondeSuivant());
    traceLignes();
  }

  /* --- mondes : habillage, prestige, bascule --- */
  function appliqueMonde(){
    const b = document.body;
    for (const id of ORDRE_MONDES) b.classList.toggle("monde-" + id, save.actif === id);
    b.classList.toggle("a-prestige", save.debloques.length > 1);
    const M = MONDE();
    $("treeTitre").textContent = M.nom;
    $("tokStar").textContent = $("treeStar").textContent = M.monnaie;
    $("treeHint").textContent = "Tu gagnes des " + M.monnaie + " en attendant devant l'appli "
      + "(1/min au départ, +1/min par upgrade d'économie). L'arbre descend : chaque nœud demande le précédent.";
  }
  function changeMonde(id){
    if (!save.debloques.includes(id) || id === save.actif) return;
    save.actif = id; jeu = save.mondes[id]; sauveJeu();
    lastAlerte = ""; baleine = null; bulles.length = 0;
    appliqueMonde(); appliqueDeblocages();
    construitArbre(); majArbre();
    $("tokVal").textContent = $("treeVal").textContent = solde();
    recale();
  }
  function prestige(){
    const suivant = mondeSuivant();
    if (!toutAchete() || !suivant) return;
    if (!save.debloques.includes(suivant)) save.debloques.push(suivant);
    sauveJeu();
    burst(220, 280); air([262, 330, 392, 523, 659, 784]);   // gerbe violette
    changeMonde(suivant);
    ouvreArbre(false);
  }
  function tenteAchat(id){
    const c = COMPETENCES().find(x => x.id === id);
    if (!c || aDebloque(id)) return;
    if (c.pre && !aDebloque(c.pre)) return;               // prérequis manquant
    if (solde() < c.cout) return;                         // pas assez de tokens
    jeu.unlocked.push(id); sauveJeu();
    appliqueDeblocages(); majArbre();
    $("tokVal").textContent = $("treeVal").textContent = solde();   // solde à jour tout de suite
    chirp(880, .06); setTimeout(() => chirp(1320, .09), 80);
    recale();                                             // rafraîchit menu, pause, frise
  }
  function ouvreArbre(o){
    document.body.classList.toggle("tree-open", o);
    if (o) requestAnimationFrame(majArbre);      // laisse la grille se poser avant de tracer les liens
  }
  $("tokBtn").addEventListener("click", e => {
    if (e.shiftKey){                       // triche de test : Shift+clic = +5000 ✦ (modifie la save en mémoire)
      jeu.earned += 5000; sauveJeu();
      $("tokVal").textContent = $("treeVal").textContent = solde();
      majArbre(); chirp(1046, .08);
      return;
    }
    ouvreArbre(!document.body.classList.contains("tree-open"));
  });
  $("treeClose").addEventListener("click", () => ouvreArbre(false));
  $("prestigeBtn").addEventListener("click", prestige);
  $("worldBtn").addEventListener("click", () => {          // cycle sur les mondes débloqués
    const l = save.debloques, i = l.indexOf(save.actif);
    changeMonde(l[(i + 1) % l.length]);
  });
  addEventListener("keydown", e => { if (e.key === "Escape") ouvreArbre(false); });

  /* --- épinglage : on déplace L'APPLI ELLE-MÊME dans une fenêtre PiP (toujours au 1er plan),
     pas un mini-timer à part. À la fermeture, tout revient dans l'onglet. --- */
  async function epingler(){
    if (pipWin){ pipWin.close(); return; }              // déjà épinglé → on ferme (toggle)
    if (!("documentPictureInPicture" in window)){
      alert("L'épinglage au premier plan nécessite Chrome ou Edge sur ordinateur "
          + "(pas disponible sur ce navigateur).");
      return;
    }
    try {
      const w = await documentPictureInPicture.requestWindow({ width: 460, height: 300 });
      // recopier nos styles (feuilles inline, même origine)
      for (const ss of document.styleSheets){
        try {
          const st = w.document.createElement("style");
          st.textContent = [...ss.cssRules].map(r => r.cssText).join("");
          w.document.head.appendChild(st);
        } catch { /* feuille inaccessible : ignorée */ }
      }
      w.document.documentElement.style.cssText = "margin:0;height:100%";
      w.document.body.style.margin = "0";
      w.document.body.className = document.body.className;
      // déplacer tout le contenu visuel dans la fenêtre épinglée
      pipWin = w;
      while (document.body.firstChild) w.document.body.appendChild(document.body.firstChild);
      document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;'
        + 'align-items:center;justify-content:center;text-align:center;background:#04050A;'
        + 'color:#5C6784;font-family:system-ui,sans-serif;font-size:14px;line-height:1.6">'
        + 'Épinglé au premier plan&nbsp;↗<br>Ferme la petite fenêtre pour revenir ici.</div>';
      resize();                                          // canvas recalé sur la fenêtre PiP
      w.addEventListener("resize", resize);
      w.addEventListener("pagehide", () => {             // fermeture : on rapatrie tout dans l'onglet
        document.body.innerHTML = "";
        while (w.document.body.firstChild) document.body.appendChild(w.document.body.firstChild);
        pipWin = null;
        resize();
        window.requestAnimationFrame(loop);              // la boucle tournait sur la fenêtre PiP → relance
      });
    } catch { /* refusé ou interrompu */ }
  }
  $("pin").addEventListener("click", epingler);

  appliqueMonde();
  appliqueDeblocages();
  construitArbre();
  majArbre();

  recale();
  hostWin().requestAnimationFrame(loop);
})();
</script>
