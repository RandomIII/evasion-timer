      for (var m = 0; m < (cont.big ? 7 : 2); m++) {
        var mlon = lerp(lo0, lo1, al(s0 + 200 + m * 3));
        var mlat = lerp(la0, la1, al(s0 + 201 + m * 3));
        var mrot = al(s0 + 202 + m * 3) * TAU;
        sphBlob(mlon, mlat, 0.10, spin, function (rr) {
          c.save(); c.rotate(mrot); c.scale(1, 0.24);
          var g = c.createRadialGradient(0, 0, 0, 0, 0, rr);
          g.addColorStop(0, om(186, 176, 158, 0.50));
          g.addColorStop(1, om(186, 176, 158, 0));
          c.fillStyle = g;
          c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.fill();
          c.restore();
        });
      }
      c.restore();
    }

    // --- calottes polaires
    function cap(pts, alpha) {
      if (coastPath(pts, spin) < -1) return;
      c.fillStyle = om(232, 240, 248, alpha);
      c.fill();
    }
    cap(COASTS.north, 0.95);
    cap(COASTS.south, 1);

    // --- couverture nuageuse : volutes, fronts et cyclones
    function puff(rr) {
      var g = c.createRadialGradient(0, 0, 0, 0, 0, rr);
      g.addColorStop(0, om(255, 255, 255, 0.62));
      g.addColorStop(0.42, om(250, 252, 255, 0.34));
      g.addColorStop(1, om(240, 246, 255, 0));
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.fill();
    }
    var cs = 20000;
    for (var cy2 = 0; cy2 < 9; cy2++) {            // systemes cycloniques
      var clon = al(cs++) * 360 - 180;
      var clat = (22 + al(cs++) * 36) * (cy2 % 2 ? 1 : -1);
      var sgn = clat > 0 ? 1 : -1;
      var ph = al(cs++) * TAU;
      for (var k2 = 0; k2 < 30; k2++) {
        var uu = k2 / 30;
        var ra = 2.5 + uu * 15;
        var an = ph + sgn * uu * 5.4;
        sphBlob(clon + Math.cos(an) * ra / Math.max(0.3, Math.cos(clat * D2R)),
          clat + Math.sin(an) * ra * 0.72, 0.030 + 0.020 * (1 - uu), spinC, puff);
      }
    }
    for (var f = 0; f < 8; f++) {                  // fronts obliques
      var flon = al(cs++) * 360 - 180;
      var flat = (al(cs++) - 0.5) * 110;
      var fa = (al(cs++) - 0.5) * 1.5;
      for (var k3 = 0; k3 < 22; k3++) {
        var dd = (k3 - 11) * 2.6;
        sphBlob(flon + dd / Math.max(0.3, Math.cos(flat * D2R)),
          flat + dd * Math.tan(fa) * 0.5 + (al(cs + k3) - 0.5) * 5,
          0.022 + al(cs + k3 + 40) * 0.020, spinC, puff);
      }
      cs += 80;
    }
    for (var z = 0; z < 96; z++) {                 // convergence intertropicale
      var zlon = al(cs++) * 360 - 180;
      var zlat = (al(cs++) - 0.5) * 22 + Math.sin(zlon * D2R * 2) * 4;
      sphBlob(zlon, zlat, 0.016 + al(cs++) * 0.026, spinC, puff);
    }
    var scatter = 120 + Math.round(near * 160);
    for (var w = 0; w < scatter; w++) {
      var wlon = al(cs++) * 360 - 180;
      var wlat = (al(cs++) - 0.5) * 168;
      sphBlob(wlon, wlat, 0.008 + al(cs++) * 0.024, spinC, puff);
    }

    // --- eclairement : limbe assombri (radial) puis loi de Lambert (lineaire)
    c.globalCompositeOperation = "multiply";
    var lg = c.createRadialGradient(cx, cy, 0, cx, cy, R);
    lg.addColorStop(0.00, "rgba(255,255,255,1)");
    lg.addColorStop(0.55, "rgba(233,238,246,1)");
    lg.addColorStop(0.82, "rgba(178,190,212,1)");
    lg.addColorStop(0.95, "rgba(118,133,166,1)");
    lg.addColorStop(1.00, "rgba(84,98,132,1)");
    c.fillStyle = lg;
    c.fillRect(cx - R, cy - R, 2 * R, 2 * R);

    var dg = c.createLinearGradient(cx - R * ux, cy - R * uy, cx + R * ux, cy + R * uy);
    dg.addColorStop(0.00, "rgba(64,72,96,1)");
    dg.addColorStop(0.35, "rgba(132,143,168,1)");
    dg.addColorStop(0.62, "rgba(214,220,232,1)");
    dg.addColorStop(0.85, "rgba(255,255,255,1)");
    dg.addColorStop(1.00, "rgba(255,255,255,1)");
    c.fillStyle = dg;
    c.fillRect(cx - R, cy - R, 2 * R, 2 * R);
    c.globalCompositeOperation = "source-over";

    // --- nuit : le terminateur est le grand cercle vu de biais, donc une ellipse
    var termR = R * SZ;
    c.save();
    c.beginPath();
    c.arc(cx, cy, R, th + Math.PI / 2, th + Math.PI * 1.5, false);
    c.ellipse(cx, cy, termR, R, th, Math.PI * 1.5, Math.PI / 2, true);
    c.closePath();
    c.clip();
    var ng = c.createLinearGradient(cx - R * ux, cy - R * uy, cx + R * ux, cy + R * uy);
    ng.addColorStop(0.00, om(3, 5, 13, 0.955));
    ng.addColorStop(0.70, om(3, 6, 15, 0.94));
    ng.addColorStop(1.00, om(6, 10, 22, 0.86));
    c.fillStyle = ng;
    c.fillRect(cx - R, cy - R, 2 * R, 2 * R);
    c.restore();

    // lisiere crepusculaire, chaude et etroite
    c.globalCompositeOperation = "lighter";
    c.beginPath();
    c.ellipse(cx, cy, termR, R, th, Math.PI * 0.52, Math.PI * 1.48, false);
    c.strokeStyle = rg(255, 138, 62, 0.16);
    c.lineWidth = R * 0.055; c.stroke();
    c.strokeStyle = rg(255, 196, 132, 0.14);
    c.lineWidth = R * 0.018; c.stroke();
    c.globalCompositeOperation = "source-over";

    // --- lumieres des villes, en chapelets le long des cotes
    c.globalCompositeOperation = "lighter";
    var ls = 40000;
    for (var lc = 0; lc < COASTS.length; lc++) {
      var co = COASTS[lc], pts = co.p, n2 = pts.length;
      var mlo = 0, mla = 0;
      for (var mi = 0; mi < n2; mi++) { mlo += pts[mi][0]; mla += pts[mi][1]; }
      mlo /= n2; mla /= n2;
      var stride = co.big ? 3 : 2;
      for (var pi = 0; pi < n2; pi += stride) {
        var seedp = ls + lc * 9001 + pi * 7;
        if (al(seedp) > 0.50 + 0.22 * (1 - near)) continue;
        var base = pts[pi];
        var inward = al(seedp + 1) < 0.24 ? 3 + al(seedp + 2) * 11 : 0.4 + al(seedp + 2) * 1.6;
        var dlo = (mlo - base[0]), dla = (mla - base[1]);
        var dn = Math.sqrt(dlo * dlo + dla * dla) || 1;
        var glon = base[0] + dlo / dn * inward, glat = base[1] + dla / dn * inward;
        var cnt = 2 + Math.floor(al(seedp + 3) * (co.big ? 6 : 3));
        var strong = al(seedp + 4) < 0.14;
        for (var d2 = 0; d2 < cnt; d2++) {
          var sd = seedp + 20 + d2 * 3;
          var llon = glon + (al(sd) - 0.5) * 4.4;
          var llat = glat + (al(sd + 1) - 0.5) * 3.2;
          sphTo(llon, llat, spin);
          if (_Z <= 0.03) continue;
          var lam = lambert();
          var na = ss(0.11, -0.10, lam);
          if (na <= 0.01) continue;
          toScreen();
          var fs = 0.35 + 0.65 * _Z;
          var tw2 = 0.70 + 0.30 * Math.sin(t * 1.15 + al(sd + 2) * TAU);
          var warm = al(sd + 2) < 0.76;
          var aa = na * fs * tw2 * (strong ? 0.95 : 0.62);
          var rr2 = R * (strong ? 0.0075 : 0.0042) * fs;
          c.fillStyle = warm ? rg(255, 198, 122, aa) : rg(186, 214, 255, aa * 0.85);
          c.beginPath(); c.arc(_sx, _sy, rr2, 0, TAU); c.fill();
          if (strong) {
            var hr = R * 0.030 * fs;
            var hg = c.createRadialGradient(_sx, _sy, 0, _sx, _sy, hr);
            hg.addColorStop(0, rg(255, 190, 110, aa * 0.40));
            hg.addColorStop(1, rg(255, 170, 90, 0));
            c.fillStyle = hg;
            c.beginPath(); c.arc(_sx, _sy, hr, 0, TAU); c.fill();
          }
        }
      }
    }

    // --- reflet speculaire du soleil sur l'ocean
    sphTo(0, 0, 0);
    var gx = cx + R * SX * 0.86, gy = cy - R * SY * 0.86;
    var gg = c.createRadialGradient(gx, gy, 0, gx, gy, R * 0.52);
    gg.addColorStop(0, rg(210, 232, 255, 0.30));
    gg.addColorStop(0.35, rg(150, 196, 245, 0.13));
    gg.addColorStop(1, rg(120, 180, 240, 0));
    c.fillStyle = gg;
    c.beginPath(); c.arc(gx, gy, R * 0.52, 0, TAU); c.fill();

    // --- voile atmospherique interieur, colle au limbe eclaire
    c.strokeStyle = (function () {
      var g = c.createLinearGradient(cx - R * ux, cy - R * uy, cx + R * ux, cy + R * uy);
      g.addColorStop(0.00, rg(40, 78, 150, 0.10));
      g.addColorStop(0.45, rg(70, 132, 205, 0.26));
      g.addColorStop(1.00, rg(176, 220, 255, 0.72));
      return g;
    })();
    c.lineWidth = R * 0.022;
    c.beginPath(); c.arc(cx, cy, R * 0.992, 0, TAU); c.stroke();
    c.globalCompositeOperation = "source-over";

    c.restore();                     // fin du disque

    // ======================= 3. atmosphere ============================
    c.globalCompositeOperation = "lighter";
    function atmo(rad, w, a0, a1) {
      var g = c.createLinearGradient(cx - R * ux, cy - R * uy, cx + R * ux, cy + R * uy);
      g.addColorStop(0.00, rg(26, 54, 118, a0));
      g.addColorStop(0.40, rg(46, 104, 180, (a0 + a1) * 0.33));
      g.addColorStop(0.78, rg(120, 186, 246, a1 * 0.82));
      g.addColorStop(1.00, rg(198, 230, 255, a1));
      c.strokeStyle = g; c.lineWidth = w;
      c.beginPath(); c.arc(cx, cy, rad, 0, TAU); c.stroke();
    }
    atmo(R * 1.008, R * 0.028, 0.20, 0.62);
    atmo(R * 1.030, R * 0.062, 0.10, 0.34);
    atmo(R * 1.072, R * 0.130, 0.045, 0.17);
    atmo(R * 1.140, R * 0.230, 0.018, 0.075);
    atmo(R * 1.250, R * 0.360, 0.007, 0.030);
    c.globalCompositeOperation = "source-over";

    // ================= 4. moitie proche de l'anneau ===================
    if (pRing > 0.004) ringHalf(true);

    // ========================== 5. soleil =============================
    if (pSun > 0.01) {
      var sx2 = cx + 3.30 * R * ux, sy2 = cy + 3.30 * R * uy;
      c.globalCompositeOperation = "lighter";
      var bg = c.createRadialGradient(sx2, sy2, 0, sx2, sy2, R * 0.55);
      bg.addColorStop(0.00, rg(255, 255, 252, 0.98 * pSun));
      bg.addColorStop(0.10, rg(255, 246, 216, 0.72 * pSun));
      bg.addColorStop(0.30, rg(255, 214, 150, 0.24 * pSun));
      bg.addColorStop(1.00, rg(255, 190, 120, 0));
      c.fillStyle = bg;
      c.beginPath(); c.arc(sx2, sy2, R * 0.55, 0, TAU); c.fill();

      c.save();
      c.translate(sx2, sy2); c.rotate(th); c.scale(1, 0.05);
      var st = c.createRadialGradient(0, 0, 0, 0, 0, R * 0.70);
      st.addColorStop(0, rg(255, 244, 220, 0.55 * pSun));
      st.addColorStop(1, rg(255, 220, 170, 0));
      c.fillStyle = st;
      c.beginPath(); c.arc(0, 0, R * 0.70, 0, TAU); c.fill();
      c.restore();

      for (var fl = 0; fl < 3; fl++) {
        var u2 = [0.42, 0.66, 1.28][fl];
        var fx = cx + (3.30 - 3.30 * u2) * R * ux, fy = cy + (3.30 - 3.30 * u2) * R * uy;
        var fr = R * [0.085, 0.045, 0.062][fl];
        var fc = [[150, 210, 255], [255, 190, 140], [130, 255, 200]][fl];
        var fg = c.createRadialGradient(fx, fy, 0, fx, fy, fr);
        fg.addColorStop(0, rg(fc[0], fc[1], fc[2], 0.10 * pSun));
        fg.addColorStop(0.7, rg(fc[0], fc[1], fc[2], 0.05 * pSun));
        fg.addColorStop(1, rg(fc[0], fc[1], fc[2], 0));
        c.fillStyle = fg;
        c.beginPath(); c.arc(fx, fy, fr, 0, TAU); c.fill();
      }
      c.globalCompositeOperation = "source-over";
    }

    c.restore();
  }

  // Fumees du village : panaches de foyer, de cheminee et de chantier, plus la
  // nappe de poussiere au sol. Repere ecran, y vers le bas, la fumee monte vers
  // les y negatifs. Lumiere fixe au haut-droite (0.62, -0.78).

  function panache(c, x, y, larg, haut, genre, force, nuit, t, om, al, graine){
    var f = force < 0 ? 0 : (force > 1 ? 1 : force);
    if (!(larg > 0) || !(haut > 0) || !(f > 0.004)) return;

    var TAU = 6.283185307179586, LX = 0.62, LY = -0.78;
    var gi = genre | 0; if (gi < 0) gi = 0; if (gi > 3) gi = 3;
    var nt = nuit < 0 ? 0 : (nuit > 1 ? 1 : nuit);

    /* Silhouettes lobees gardees en cache sur la fonction : refaire un contour
       par bouffee coute plus que de piocher dans quatorze formes qu'on tourne
       et ecrase ensuite. Aucun degrade radial n'est cree ici. */
    var SH = panache.sh, si, k, n, ang, rr;
    if (!SH){
      SH = panache.sh = [];
      for (si = 0; si < 14; si++){
        var L = 9, ux = [], uy = [];
        for (k = 0; k < L; k++){
          ang = k / L * TAU;
          rr = 0.70 + 0.46 * al(si * 29 + k * 3 + 5);
          ux.push(Math.cos(ang) * rr); uy.push(Math.sin(ang) * rr);
        }
        var pp = new Path2D();
        pp.moveTo((ux[L - 1] + ux[0]) * 0.5, (uy[L - 1] + uy[0]) * 0.5);
        for (k = 0; k < L; k++){
          n = (k + 1) % L;
          pp.quadraticCurveTo(ux[k], uy[k], (ux[k] + ux[n]) * 0.5, (uy[k] + uy[n]) * 0.5);
        }
        pp.closePath();
        SH.push(pp);
      }
    }

    // riseExp expand sway wind  sag  spin squash rate  alpha fadeO ember hK   grow
    var G = [
      [1.55, 2.40, 0.34, 0.55, 0.00, 0.55, 0.94, 0.30, 0.185, 0.42, 1.00, 1.00, 0.80],
      [1.08, 1.70, 0.22, 1.30, 0.26, 0.28, 0.76, 0.21, 0.300, 0.30, 0.45, 0.96, 0.70],
      [1.90, 3.10, 0.28, 0.30, 0.00, 0.90, 1.00, 0.46, 0.215, 0.66, 0.30, 0.86, 1.05],
      [0.82, 3.30, 0.38, 1.15, 0.14, 0.32, 0.60, 0.25, 0.200, 0.46, 0.20, 0.44, 0.62]
    ][gi];
    var CB = [[86, 80, 76], [34, 27, 23], [212, 220, 228], [156, 126, 84]][gi];
    var CT = [[172, 170, 172], [106, 89, 72], [248, 250, 252], [206, 188, 152]][gi];

    var g0 = (Math.abs(graine * 977) | 0) * 13 + 7;
    var p0 = al(g0) * TAU, p1 = al(g0 + 1) * TAU, p2 = al(g0 + 2) * TAU;
    var rate = G[7] * (0.84 + 0.32 * al(g0 + 3));
    var off = al(g0 + 4);
    var wsg = al(g0 + 5) < 0.5 ? -1 : 1;
    var H = haut * G[11] * (0.62 + 0.38 * f);
    var sway = G[2] * (0.75 + 0.5 * al(g0 + 6));
    var wind = G[3] * (0.7 + 0.6 * al(g0 + 7));

    // Nuit : la matiere s'assombrit et vire au bleu, sauf a la base ou le foyer
    // la rallume ; le facteur reste le meme pour toute la colonne.
    var nk = 1 - 0.58 * nt, nb = 1 + 0.14 * nt, nr = 1 - 0.10 * nt;
    var emK = G[10] * (0.30 + 0.70 * nt);

    var PX = 0, PY = 0;
    function track(s){
      var w = s * s;
      PX = x + wsg * wind * larg * w * 1.15
         + sway * larg * s * (Math.sin(s * 4.3 - t * 1.15 + p0)
                            + 0.52 * Math.sin(s * 9.9 - t * 1.9 + p1));
      PY = y - H * s + G[4] * H * s * s * s;
    }
    function tint(s, ew, kk, aa){
      var r = (CB[0] + (CT[0] - CB[0]) * s) * kk * nk * nr;
      var v = (CB[1] + (CT[1] - CB[1]) * s) * kk * nk;
      var b = (CB[2] + (CT[2] - CB[2]) * s) * kk * nk * nb;
      if (ew > 0){ r += (255 - r) * ew; v += (150 - v) * ew * 0.72; b += (58 - b) * ew * 0.42; }
      return om(r > 255 ? 255 : r | 0, v > 255 ? 255 : v | 0, b > 255 ? 255 : b | 0, aa);
    }
    function blob(sh, cx, cy, rx, ry, rot, cs){
      if (rx < 0.25 || ry < 0.25) return;
      c.save();
      c.translate(cx, cy);
      c.rotate(rot);
      c.scale(rx, ry);
      c.fillStyle = cs;
      c.fill(sh);
      c.restore();
    }

    c.save();

    // Voile large, pose avant les bouffees : il relie la colonne pour qu'elle ne
    // se lise pas comme un chapelet de boules.
    var V = 8, vi, vs, vr;
    for (vi = V - 1; vi >= 0; vi--){
      vs = (vi + 0.5) / V;
      track(vs);
      vr = larg * (0.55 + G[1] * Math.pow(vs, G[12])) * 1.55;
      blob(SH[(vi * 5 + g0) % 14], PX + Math.sin(t * 0.31 + vi + p2) * larg * 0.12 * vs,
           PY, vr, vr * G[6] * 1.1, (p2 + vi * 1.7 + t * 0.05),
           tint(vs, 0, 1, G[8] * f * 0.30 * (1 - vs * 0.55)));
    }

    var P = 40, i, u, em, a, s, id, sh, r, ry, rot, A, ew, side, cx, cy;
    var base = t * rate + off, fo = G[9];
    for (i = P - 1; i >= 0; i--){
      u = base + i / P;
      em = Math.floor(u);
      a = u - em;
      // La graine vient de l'indice d'emission : elle ne change qu'a alpha nul.
      id = g0 + i * 31 + em * 7;

      A = (a < 0.09 ? a / 0.09 : 1);
      if (a > 1 - fo) A *= (1 - a) / fo;
      if (A <= 0.004) continue;

      s = 1 - Math.pow(1 - a, G[0]);
      track(s);
      side = (i & 1) ? 1 : -1;

      cx = PX + side * larg * 0.26 * s * Math.sin(s * 2.4 + p2)
              + (al(id) - 0.5) * larg * (0.34 + 0.8 * s);
      cy = PY + (al(id + 1) - 0.5) * larg * 0.42;

      r = larg * (0.42 + G[1] * Math.pow(s, G[12])) * (0.76 + 0.48 * al(id + 2)) * (0.62 + 0.38 * f);
      ry = r * (G[6] - 0.16 * s);
      rot = al(id + 3) * TAU + side * G[5] * s * TAU;

      A *= G[8] * f * (1 - 0.62 * s);
      ew = s < 0.32 ? emK * (1 - s / 0.32) * (1 - s / 0.32) : 0;

      sh = SH[(id >>> 2) % 14];
      // Halo dilue, coeur eclaire decale vers la lumiere, oeil sombre en orbite :
      // c'est ce decalage tournant qui creuse la volute.
      blob(sh, cx, cy, r, ry, rot, tint(s, ew * 0.55, 1, A * 0.62));
      blob(sh, cx + LX * r * 0.26, cy + LY * ry * 0.26, r * 0.64, ry * 0.64, rot * 0.7 + 0.9,
           tint(s, ew, 1.30, A * 0.85));
      blob(sh, cx + (Math.cos(rot) * 0.34 - LX * 0.20) * r,
               cy + (Math.sin(rot) * 0.34 - LY * 0.20) * ry, r * 0.36, ry * 0.36, -rot,
           tint(s, ew * 0.3, 0.62, A * 0.55));

      if (ew > 0.02){
        c.save();
        c.globalCompositeOperation = "lighter";
        c.translate(cx, cy);
        c.scale(r * 0.8, ry * 0.8);
        c.fillStyle = om(255, 132, 44, 0.20 * ew * A / G[8]);
        c.fill(sh);
        c.restore();
      }
    }

    c.restore();
  }

  function poussiere(c, x, y, larg, force, nuit, t, om, al, graine){
    var f = force < 0 ? 0 : (force > 1 ? 1 : force);
    if (!(larg > 0) || !(f > 0.004)) return;

    var TAU = 6.283185307179586, LX = 0.62, LY = -0.78;
    var nt = nuit < 0 ? 0 : (nuit > 1 ? 1 : nuit);

    // Contours plus decoupes que ceux du panache : la poussiere s'effiloche.
    var SH = poussiere.sh, si, k, n, ang, rr;
    if (!SH){
      SH = poussiere.sh = [];
      for (si = 0; si < 12; si++){
        var L = 11, ux = [], uy = [];
        for (k = 0; k < L; k++){
          ang = k / L * TAU;
          rr = 0.60 + 0.62 * al(si * 37 + k * 7 + 11);
          ux.push(Math.cos(ang) * rr); uy.push(Math.sin(ang) * rr);
        }
        var pp = new Path2D();
        pp.moveTo((ux[L - 1] + ux[0]) * 0.5, (uy[L - 1] + uy[0]) * 0.5);
        for (k = 0; k < L; k++){
          n = (k + 1) % L;
          pp.quadraticCurveTo(ux[k], uy[k], (ux[k] + ux[n]) * 0.5, (uy[k] + uy[n]) * 0.5);
        }
        pp.closePath();
        SH.push(pp);
      }
    }

    var g0 = (Math.abs(graine * 601) | 0) * 17 + 3;
    var p0 = al(g0) * TAU, p1 = al(g0 + 1) * TAU;
    var rate = 0.26 * (0.82 + 0.36 * al(g0 + 2));
    var off = al(g0 + 3);
    var wsg = al(g0 + 4) < 0.5 ? -1 : 1;
    var HH = larg * 0.30 * (0.7 + 0.3 * f);
    var CB = [150, 120, 80], CT = [214, 198, 168];
    var nk = 1 - 0.56 * nt, nb = 1 + 0.16 * nt, nr = 1 - 0.09 * nt;
    var emK = 0.26 * (0.30 + 0.70 * nt);

    function tint(h, ew, kk, aa){
      var r = (CB[0] + (CT[0] - CB[0]) * h) * kk * nk * nr;
      var v = (CB[1] + (CT[1] - CB[1]) * h) * kk * nk;
      var b = (CB[2] + (CT[2] - CB[2]) * h) * kk * nk * nb;
      if (ew > 0){ r += (255 - r) * ew; v += (146 - v) * ew * 0.7; b += (54 - b) * ew * 0.4; }
      return om(r > 255 ? 255 : r | 0, v > 255 ? 255 : v | 0, b > 255 ? 255 : b | 0, aa);
    }
    function blob(sh, cx, cy, rx, ry, rot, cs){
      if (rx < 0.25 || ry < 0.25) return;
      c.save();
      c.translate(cx, cy);
      c.rotate(rot);
      c.scale(rx, ry);
      c.fillStyle = cs;
      c.fill(sh);
      c.restore();
    }

    c.save();

    // Nappe rasante : elle tient les bouffees ensemble et salit le pied du decor.
    var V = 6, vi, vu, vr;
    for (vi = 0; vi < V; vi++){
      vu = (vi + 0.5) / V;
      vr = larg * (0.14 + 0.26 * vu);
      blob(SH[(vi * 5 + g0) % 12],
           x + (vu - 0.5) * larg * 0.86 * wsg + Math.sin(t * 0.42 + vi * 2.1 + p0) * larg * 0.05,
           y - HH * 0.10 * (1 - vu),
           vr, vr * 0.34, Math.sin(t * 0.19 + vi + p1) * 0.25,
           tint(0.18 + 0.3 * vu, 0, 1, 0.11 * f * (1 - 0.4 * vu)));
    }

    var P = 34, i, u, em, a, id, sh, r, ry, rot, A, ew, side, cx, cy, hf, sp;
    var base = t * rate + off;
    for (i = P - 1; i >= 0; i--){
      u = base + i / P;
      em = Math.floor(u);
      a = u - em;
      id = g0 + i * 43 + em * 11;

      A = (a < 0.10 ? a / 0.10 : 1) * (1 - a) * (1 - a * 0.5);
      if (A <= 0.004) continue;

      side = (i & 1) ? 1 : -1;
      sp = 0.34 + 0.66 * al(id);
      // Elle part du point de contact, ralentit en s'etalant, et retombe au sol.
      cx = x + side * larg * 0.54 * Math.pow(a, 0.55) * sp
             + wsg * larg * 0.16 * a * a
             + Math.sin(a * 5.2 + p0 + id * 0.7) * larg * 0.035;
      hf = Math.sin(Math.PI * Math.pow(a, 0.78)) * (0.32 + 0.68 * al(id + 1));
      cy = y - HH * hf - larg * 0.012 * al(id + 4);

      r = larg * (0.055 + 0.185 * Math.pow(a, 0.66)) * (0.68 + 0.7 * al(id + 2)) * (0.6 + 0.4 * f);
      ry = r * (0.66 - 0.14 * a);
      rot = al(id + 3) * TAU + side * a * 1.15;

      A *= 0.26 * f;
      ew = hf < 0.45 && a < 0.4 ? emK * (1 - a / 0.4) : 0;

      sh = SH[(id >>> 2) % 12];
      blob(sh, cx, cy, r, ry, rot, tint(hf, ew * 0.5, 1, A * 0.70));
      blob(sh, cx + LX * r * 0.24, cy + LY * ry * 0.24, r * 0.62, ry * 0.62, rot * 0.6 + 1.2,
           tint(hf, ew, 1.26, A * 0.88));
      blob(sh, cx + (Math.cos(rot) * 0.32 - LX * 0.18) * r,
               cy + (Math.sin(rot) * 0.32 - LY * 0.18) * ry, r * 0.34, ry * 0.34, -rot,
           tint(hf, 0, 0.66, A * 0.5));
    }

    c.restore();
  }

  /* Perspective atmosphérique : plus un objet est loin, plus sa matière tire
     vers la couleur de l'horizon. C'est ce qui recolle des assets dessinés
     séparément ; sans ça le fond n'est qu'une version rapetissée du premier plan. */
  function teinteScene(nuit, brume, ciel){
    const k = Math.max(0, Math.min(1, nuit)) * .62;
    const b = Math.max(0, Math.min(1, brume));
    return (r, g, bb, a) => {
      const R = (r * (1 - k) + 16 * k) * (1 - b) + ciel[0] * b;
      const G = (g * (1 - k) + 22 * k) * (1 - b) + ciel[1] * b;
      const B = (bb * (1 - k) + 46 * k) * (1 - b) + ciel[2] * b;
      return "rgba(" + Math.round(R) + "," + Math.round(G) + "," + Math.round(B)
           + "," + (a === undefined ? 1 : a) + ")";
    };
  }
  function batiment(c, ep, L, H, gr, nuit, t, om){
    const f = [batNom, bat0, bat1, bat2, bat3, bat4, bat5, batSol][Math.max(0, Math.min(7, ep))];
    f(c, L, H, om || teinteNuit(nuit), aleaDe(gr), Math.max(0, Math.min(1, nuit)), t);
  }
  function monument(c, ep, L, H, t, nuit){
    const f = [monNom, mon0, mon1, mon2, mon3, mon4, mon5, monSol][Math.max(0, Math.min(7, ep))];
    f(c, L, H, teinteNuit(nuit), aleaDe(0.37), Math.max(0, Math.min(1, nuit)), t);
  }

  /* Reliefs, sol et voie ne changent qu'avec l'époque et l'heure, jamais d'une
     frame à l'autre : on les cuit une fois par palier et on rejoue l'image.
     Les redessiner à chaque frame coûtait plus du double du monde des abysses. */
  const DECOR = { cle: "", cv: null };
  /* Les maisons non plus ne bougent pas : seules leurs fenêtres s'allument, et
     ça dépend de l'heure, pas de la frame. Le monument, lui, reste vivant :
     c'est là que sont la flamme, la bannière et les anneaux. */
  const BATIS = new Map();
  const MARGE_BAS = 6;               // marge sous la ligne de sol, dans le sprite
  function spriteBati(ep, k, L, H, gr, nuit, brume, ciel){
    /* La couleur d'horizon dérive en continu : brute dans la clef, elle faisait
       recuire tous les sprites à chaque frame. On la quantifie par paliers de 16. */
    const cle = ep + "|" + k + "|" + Math.round(nuit * 8) + "|" + Math.round(brume * 20)
              + "|" + (ciel[0] >> 4) + "," + (ciel[1] >> 4) + "," + (ciel[2] >> 4)
              + "|" + Math.round(L) + "x" + Math.round(H);
    const vu = BATIS.get(cle);
    if (vu) return vu;
    const cv = document.createElement("canvas");
    cv.width = Math.max(2, Math.ceil(L * 1.4));
    cv.height = Math.max(2, Math.ceil(H * 1.35 + 8));
    const g = cv.getContext("2d");
    g.translate(cv.width / 2, cv.height - MARGE_BAS);
    batiment(g, ep, L, H, gr, nuit, 0, teinteScene(nuit, brume, ciel));
    if (BATIS.size > 80) BATIS.clear();          // borne mémoire au changement de taille
    BATIS.set(cle, cv);
    return cv;
  }
  /* ---- le décor, cuit par étapes ----
     Reliefs, sol, voie et arbres coûtent près d'un quart de seconde à redessiner.
     Les faire d'un bloc figeait l'image à chaque changement d'époque. On les cuit
     donc **une étape par frame**, sur un calque de réserve, en continuant
     d'afficher le décor précédent ; la bascule n'a lieu qu'une fois tout prêt.
     Comme une époque dure des minutes, la préparation passe inaperçue. */
  const RD = 2;                          // demi-résolution : le fond est derrière le village
  const N_PAS = 5;
  const PREP = { cle: "", cv: null, pas: 0 };

  function calqueDecor(){
    const cw = Math.max(2, Math.ceil(W / RD)), ch = Math.max(2, Math.ceil(Hh / RD));
    const cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    return cv;
  }

  function etapeDecor(cv, ee, nuit, solY, E, pas){
    const g = cv.getContext("2d");
    const om = teinteNuit(nuit), al = aleaDe(.271);
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (pas === 0) g.clearRect(0, 0, cv.width, cv.height);
    g.setTransform(1 / RD, 0, 0, 1 / RD, 0, 0);

    if (pas === 0){
      if (!aDebloque("bg")) return;
      paysageFond(g, W, Hh, solY, ee, nuit, 0, E, om, al);
      /* Les reliefs ressortaient plus clairs que le ciel, ce qui aplatit tout :
         on les ramène sous lui. `source-atop` ne touche que ce qui est déjà là. */
      const cb = couleurVil(ee, "b");
      g.save();
      g.globalCompositeOperation = "source-atop";
      g.fillStyle = "rgba(" + Math.round(cb[0] * .52) + "," + Math.round(cb[1] * .58)
                  + "," + Math.round(cb[2] * .66) + ",.34)";
      g.fillRect(0, 0, W, Hh);
      g.restore();

    } else if (pas === 1){
      paysageSol(g, W, Hh, solY, ee, nuit, 0, E, om, al);

    } else if (pas === 2){
      paysageRoute(g, W, Hh, solY, ee, nuit, 0, E, om, al);
      /* Le bord lointain de la voie tranche net dans l'herbe, ce qui la fait lire
         comme un haut de mur. On reprend la couleur du sol juste au-dessus
         plutôt qu'une teinte devinée. */
      const yR = solY + (Hh - solY) * .42;
      // getImageData ignore la transformation : ses coordonnées sont en pixels réels
      const pix = g.getImageData(Math.round(W * .5 / RD), Math.round((yR - 6) / RD), 1, 1).data;
      const herbe = pix[0] + "," + pix[1] + "," + pix[2];
      const fo = g.createLinearGradient(0, yR - 3, 0, yR + (Hh - solY) * .13);
      fo.addColorStop(0, "rgba(" + herbe + ",.92)");
      fo.addColorStop(1, "rgba(" + herbe + ",0)");
      g.fillStyle = fo;
      g.fillRect(0, yR - 3, W, (Hh - solY) * .13 + 3);

    } else if (pas === 3){
      if (aDebloque("bg"))
        paysageArbres(g, W, Hh, solY, ee, nuit, 0, E,
                      teinteScene(nuit, .17, couleurVil(ee, "b")), al);

    } else {
      // étalonnage : `source-atop` ne teinte que ce qui est peint, sinon le ciel blanchit
      g.save();
      g.globalCompositeOperation = "source-atop";
      const et = g.createLinearGradient(0, 0, 0, Hh);
      et.addColorStop(0,   "rgba(64,88,168,.085)");
      et.addColorStop(.52, "rgba(255,244,222,.030)");
      et.addColorStop(1,   "rgba(186,104,36,.090)");
      g.fillStyle = et; g.fillRect(0, 0, W, Hh);
      g.restore();
    }
  }

  function decorVillage(eBrut, nuit, solY, E){
    const ee = interpV(PAY_MAP, eBrut);            // échelle des modules de paysage
    const cle = W + "x" + Hh + "|" + Math.round(ee * 40) + "|" + Math.round(nuit * 10)
              + "|" + (aDebloque("bg") ? 1 : 0);
    if (DECOR.cle === cle) return DECOR.cv;

    if (PREP.cle !== cle){ PREP.cle = cle; PREP.pas = 0; PREP.cv = calqueDecor(); }
    // rien à montrer encore : on cuit tout d'un coup, une seule fois par session
    // à l'entrée, on force juste de quoi avoir un sol ; la voie et les arbres suivent
    const presse = !DECOR.cv || DECOR.cv.width !== PREP.cv.width;
    const budget = presse ? 2 : 1;
    for (let i = 0; i < budget && PREP.pas < N_PAS; i++)
      etapeDecor(PREP.cv, ee, nuit, solY, E, PREP.pas++);
    if (PREP.pas >= N_PAS){
      DECOR.cle = cle; DECOR.cv = PREP.cv; PREP.cle = ""; PREP.cv = null;
    }
    // tant que rien n'est prêt on montre le calque en cours plutôt que rien
    return DECOR.cv || PREP.cv;
  }

  function dessineVillage(prog, enPause, alerte, libre, secDep){
    initVillage();
    const p = Math.max(0, Math.min(1, prog));
    const lent = reduce ? .35 : 1;
    const t0 = performance.now() / 1000;
    const emax = epoqueMax();
    const ee = Math.min(emax, (libre ? 1 : p) * (CIEL_V.length - 1));
    /* Le chantier : les parcelles passent à l'époque suivante une par une, de
       gauche à droite, le monument en dernier. C'est sa bascule à lui qui fait
       tourner tout le décor, d'où le fondu court juste après. */
    const iEre = Math.min(emax, Math.floor(ee)), suiv = Math.min(emax, iEre + 1);
    const u = Math.max(0, Math.min(1, ee - Math.floor(ee)));
    const chantier = suiv > iEre;
    const NP = PARCELLES.length;
    const seuilPl = (rang) => .06 + .66 * (NP > 1 ? rang / (NP - 1) : 0);
    const SEUIL_MON = .84, SEUIL_DEC = .90;
    const fd = chantier ? Math.max(0, Math.min(1, (u - SEUIL_DEC) / .07)) : 0;
    const eeVis = iEre + fd;
    // la cité future se vit de nuit : c'est là que les néons servent à quelque chose
    const nuit = Math.max(0, Math.min(1, interpV(NUIT_EP, eeVis)));
    const eePay = interpV(PAY_MAP, eeVis);         // échelle propre aux modules de paysage
    const jour = 1 - nuit;
    const E = ech() * dpr;
    anneeV = interpV(ANNEES, ee); popV = interpV(POPS, ee);
    epNom = NOMS_EP[Math.min(NOMS_EP.length - 1, Math.round(eeVis))];

    const solY = Hh * .76;
    const om = teinteNuit(nuit), al = aleaDe(.271);
    const cielBas = couleurVil(eeVis, "b");        // cible du fondu atmosphérique

    // ---- le ciel ----
    const g = ctx.createLinearGradient(0, 0, 0, solY);
    g.addColorStop(0,   "rgb(" + couleurVil(eeVis, "h") + ")");
    g.addColorStop(.62, "rgb(" + couleurVil(eeVis, "m") + ")");
    g.addColorStop(1,   "rgb(" + couleurVil(eeVis, "b") + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, solY);

    if (nuit > .03){                                 // étoiles, seulement le soir venu
      for (const e of etoiles){
        const a = nuit * (.3 + Math.sin(t0 * 1.4 + e.ph) * .25 + .3);
        ctx.fillStyle = "rgba(238,244,255," + Math.max(0, a) + ")";
        ctx.beginPath(); ctx.arc(e.x * W, e.y * solY * .9, e.r * E, 0, 6.283); ctx.fill();
      }
    }

    /* L'astre traverse le ciel avec la journée : il ne dit pas l'époque mais
       l'heure, et c'est le seul repère qui relie la scène au vrai compte à rebours. */
    const ax2 = W * (.10 + p * .80), ay = solY * (.72 - Math.sin(p * 3.1416) * .58);
    const lune = nuit > .5;
    const cs = lune ? [226, 232, 244] : mix([255, 246, 208], [255, 138, 74], Math.min(1, eeVis / 6));
    const sr = (lune ? 26 : 34) * E;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const sg = ctx.createRadialGradient(ax2, ay, 0, ax2, ay, sr * 7);
    sg.addColorStop(0,   "rgba(" + cs + "," + (lune ? .22 : .34) + ")");
    sg.addColorStop(.16, "rgba(" + cs + "," + (lune ? .10 : .16) + ")");
    sg.addColorStop(1,   "rgba(" + cs + ",0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, solY);
    ctx.restore();
    ctx.fillStyle = "rgb(" + cs + ")";
    ctx.beginPath(); ctx.arc(ax2, ay, sr, 0, 6.283); ctx.fill();
    if (lune){                                       // croissant : on mord le disque
      ctx.fillStyle = "rgb(" + couleurVil(eeVis, "m") + ")";
      ctx.beginPath(); ctx.arc(ax2 + sr * .38, ay - sr * .22, sr * .92, 0, 6.283); ctx.fill();
    }

    paysageNuages(ctx, W, Hh, solY, eePay, nuit, t0, E, om, al);
    // le décor bascule d'un bloc derrière le monument, en fondu court
    ctx.drawImage(decorVillage(iEre, nuit, solY, E), 0, 0, W, Hh);
    if (fd > 0){
      ctx.globalAlpha = fd;
      ctx.drawImage(decorVillage(suiv, nuit, solY, E), 0, 0, W, Hh);
      ctx.globalAlpha = 1;
    }
    /* Voile d'horizon : la ligne de sol séparait le cadre en deux images sans
       transition, un lointain pâle posé sur un premier plan sombre. */
    const hz = ctx.createLinearGradient(0, solY - Hh * .09, 0, solY + (Hh - solY) * .20);
    hz.addColorStop(0,   "rgba(" + cielBas + ",0)");
    hz.addColorStop(.52, "rgba(" + cielBas + "," + (.17 * jour + .06) + ")");
    hz.addColorStop(1,   "rgba(" + cielBas + ",0)");
    ctx.fillStyle = hz;
    ctx.fillRect(0, solY - Hh * .09, W, (Hh - solY) * .20 + Hh * .09);

    // la voie garde ses bornes : habitants et convoi s'y placent
    const rY = solY + (Hh - solY) * .42, rH = (Hh - solY) * .32;

    /* ---- les parcelles ----
       Chacune bascule à son propre seuil : le village se refait bâtiment par
       bâtiment, ce qui se lit comme un chantier et non comme un fondu global. */
    const rendu = [];
    for (const q of PARCELLES){
      const sq = seuilPl(q.rang), fait = chantier && u >= sq;
      rendu.push({ q: q, e: fait ? suiv : iEre, s: sq,
                   g: fait ? Math.max(0, Math.min(1, (u - sq) / .022)) : 1 });
    }
    if (aDebloque("algues")) for (const r of rendu){
      if (r.q.fond) dessineParcelle(r, solY, ee, nuit, t0, E, cielBas);
    }
    // le monument, entre les deux rangées
    if (aDebloque("tresor")){
      const faitM = chantier && u >= SEUIL_MON;
      const em = faitM ? suiv : iEre;
      const gm = faitM ? Math.max(0, Math.min(1, (u - SEUIL_MON) / .022)) : 1;
      const HM = (Hh - solY) * 1.45 * (.55 + em * .16);
      ctx.save();
      ctx.translate(W * .70, solY + (Hh - solY) * .026);
      if (gm < 1){                     // même règle que les maisons : on révèle par le bas
        ctx.beginPath();
        ctx.rect(-W, -HM * 1.3 * gm, 2 * W, HM * 1.3 * gm + 4);
        ctx.clip();
      }
      monument(ctx, em, 120 * E, HM, t0, nuit);
      ctx.restore();
    }
    if (aDebloque("algues")) for (const r of rendu){
      if (!r.q.fond) dessineParcelle(r, solY, ee, nuit, t0, E, cielBas);
    }
    if (chantier) dessineOuvrier(rendu, u, iEre, solY, nuit, t0, E);

    /* Le grand foyer : une flaque de lumière chaude au cœur du village. C'est
       lui qui rend la nuit habitée plutôt que simplement sombre. */
    if (aDebloque("feu") && nuit > .04){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const bat2 = 1 + Math.sin(t0 * 2.3) * .05 + Math.sin(t0 * 5.1) * .03;
      const R2 = Math.min(W, Hh) * .40 * bat2;
      const fg = ctx.createRadialGradient(W * .5, solY, 0, W * .5, solY, R2);
      fg.addColorStop(0,   "rgba(255,186,96," + (.30 * nuit) + ")");
      fg.addColorStop(.34, "rgba(255,146,58," + (.13 * nuit) + ")");
      fg.addColorStop(1,   "rgba(200,80,20,0)");
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.ellipse(W * .5, solY, R2, R2 * .5, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }

    /* ---- fumées ----
       Trois sources au plus : chaque panache est un vrai calcul de turbulence,
       en aligner huit coûterait plus cher que tout le reste de la frame. */
    if (eeVis > 3.3 && eeVis < 5.5){
      const force = Math.min(1, Math.min(eeVis - 3.3, 5.5 - eeVis) * 1.5);
      let k = 0;
      for (const r of rendu){
        if (r.q.fond || r.e !== 4) continue;
        const Lb = (78 + r.q.gr * 30) * E * r.q.ech;
        const Hb = (58 + r.q.gr * 26 + r.e * 26) * E * r.q.ech;
        panache(ctx, r.q.u * W + Lb * .28, solY + (Hh - solY) * r.q.dy - Hb,
                Lb * .17, solY * .78, 1, force, nuit, t0, om, al, r.q.gr * 97 + 3);
        if (++k >= 3) break;
      }
    }
    // le feu du campement fume aussi, tant qu'il n'y a pas d'usine
    if (eeVis < 2.4 && aDebloque("tresor")){
      panache(ctx, W * .70, solY - (Hh - solY) * .55, 26 * E, solY * .5, 0,
              Math.min(1, 2.4 - eeVis), nuit, t0, om, al, 11);
    }

    // ---- les habitants ----
    if (aDebloque("diver")){
      const n = 7;
      for (let i = 0; i < n; i++){
        const ph = i * 2.4 + 1;
        const x = ((i / n + t0 * .012 * (i % 2 ? 1 : -1) + 1) % 1) * W;
        const y = rY + rH * (.3 + .5 * ((i * .37) % 1));
        const h = (13 + (i % 3) * 3) * E * (1 + (y - rY) / rH * .2);
        const bal = Math.sin(t0 * 3.4 + ph) * .5;
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = nuit > .4 ? "rgba(18,20,34,.9)" : "rgba(38,34,40,.82)";
        ctx.beginPath(); ctx.arc(0, -h, h * .19, 0, 6.283); ctx.fill();   // tête
        ctx.fillRect(-h * .13, -h * .82, h * .26, h * .48);              // buste
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, h * .10);
        ctx.beginPath();                                                  // jambes
        ctx.moveTo(0, -h * .34); ctx.lineTo(bal * h * .22, 0);
        ctx.moveTo(0, -h * .34); ctx.lineTo(-bal * h * .22, 0);
        ctx.stroke();
        ctx.restore();
      }
    }

    // ---- le convoi : il change de moyen avec l'époque ----
    if (aDebloque("boat")){
      const vx = ((t0 * .055) % 1.25 - .125) * W;
      const vy = rY + rH * .70;
      const L = 46 * E * (1 + Math.min(ee, 5) * .1);
      const eq = Math.round(ee);
      ctx.save(); ctx.translate(vx, vy);
      ctx.fillStyle = nuit > .4 ? "rgba(30,34,54,.95)" : "rgba(60,48,38,.92)";
      if (eq <= 1){                                  // charrette à bras
        ctx.fillRect(-L * .4, -L * .26, L * .8, L * .2);
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, L * .04);
        for (const s of [-.22, .22]){
          ctx.beginPath(); ctx.arc(s * L, -L * .04, L * .1, 0, 6.283); ctx.stroke();
        }
      } else if (eq <= 3){                           // wagon sur rails
        ctx.fillRect(-L * .5, -L * .34, L, L * .3);
        ctx.fillRect(-L * .5, -L * .5, L * .3, L * .18);
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1, L * .05);
        for (const s of [-.32, 0, .32]){
          ctx.beginPath(); ctx.arc(s * L, 0, L * .075, 0, 6.283); ctx.stroke();
        }
      } else {                                       // véhicule sur coussin d'air
        ctx.beginPath();
        ctx.moveTo(-L * .5, -L * .1); ctx.quadraticCurveTo(-L * .3, -L * .4, 0, -L * .4);
        ctx.quadraticCurveTo(L * .34, -L * .4, L * .5, -L * .1);
        ctx.quadraticCurveTo(0, L * .04, -L * .5, -L * .1);
        ctx.closePath(); ctx.fill();
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        const gg = ctx.createLinearGradient(0, -L * .08, 0, L * .12);
        gg.addColorStop(0, "rgba(120,230,255,.6)");
        gg.addColorStop(1, "rgba(120,230,255,0)");
        ctx.fillStyle = gg; ctx.fillRect(-L * .44, -L * .08, L * .88, L * .2);
        ctx.restore();
      }
      ctx.restore();
    }

    // ---- lucioles le soir, halo de néon la nuit ----
    if (nuit > .25 && aDebloque("feu")){
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (const l of lucioles){
        l.y -= l.v * lent * .0008;
        if (l.y < 0) l.y = 1;
        const sc = .35 + Math.sin(t0 * 2.2 + l.ph) * .3 + .35;
        const x = l.x * W + Math.sin(t0 * .6 + l.ph) * 22 * E;
        ctx.fillStyle = "rgba(160,240,255," + (nuit * .5 * sc) + ")";
        ctx.beginPath();
        ctx.arc(x, l.y * solY, 1.6 * E, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }

    /* ---- la fin : la caméra recule jusqu'à voir la Terre ----
       Le village ne décolle pas, c'est le regard qui s'éloigne. La scène
       s'efface pendant que la planète prend toute la place. */
    if (libre && aDebloque("arc")){
      if (!tLibre) tLibre = t0;
      const av = Math.max(0, Math.min(1, (t0 - tLibre) / 7));
      const doux = av * av * (3 - 2 * av);
      const voile = Math.min(1, doux / .42);
      ctx.fillStyle = "rgba(3,4,12," + voile.toFixed(3) + ")";
      ctx.fillRect(0, 0, W, Hh);
      if (voile > .12){
        ctx.save();
        ctx.globalAlpha = voile;
        for (const e of etoiles){
          const a = .3 + Math.sin(t0 * 1.3 + e.ph) * .25 + .3;
          ctx.fillStyle = "rgba(240,246,255," + a.toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(e.x * W, e.y * Hh, e.r * E, 0, 6.283); ctx.fill();
        }
        terreAnneau(ctx, W * .5, Hh * (1.72 - 1.26 * doux),
                    Hh * (2.30 - 1.98 * doux), doux, t0, teinteNuit(0), aleaDe(.13));
        ctx.restore();
      }
    } else if (tLibre) tLibre = 0;


    /* Étalonnage : bascule froide en haut, chaude en bas, sur tout le cadre.
       C'est la dernière chose qui donne à onze assets séparés l'air d'avoir été
       peints le même jour. */
    // voile central, pour que le compteur reste lisible sur un ciel clair
    /* Un seul dégradé fait le voile central et le vignettage : deux passes
       plein écran par frame, c'est autant de fois la surface du canvas. */
    const vg = ctx.createRadialGradient(W * .5, Hh * .44, 0,
                                        W * .5, Hh * .48, Math.max(W, Hh) * .78);
    vg.addColorStop(0,   "rgba(8,10,20," + (.17 - nuit * .09) + ")");
    vg.addColorStop(.34, "rgba(6,8,16," + (.04 - nuit * .02) + ")");
    vg.addColorStop(1,   "rgba(0,4,10," + (.14 + nuit * .22) + ")");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, Hh);
  }

  /* Le bâtisseur remonte le village de gauche à droite : il marche jusqu'à la
     parcelle suivante, frappe quelques instants, et elle change d'époque. Le
     monument est sa dernière étape. */
  /* La bâche du chantier : tendue entre les montants, elle s'affaisse entre ses
     points d'attache et bat au vent. Elle couvre la part non encore montée. */
  function bache(c, L, H, av, nuit, t, om, al){
    const k = Math.max(0, Math.min(1, 1 - av));
    if (k < .04) return;
    const yH = -H * (.35 + .62 * k), yB = -H * .18 * k;
    const dx = L * .56, sw = Math.sin(t * .9) * L * .022;
    c.save();
    c.beginPath();
    c.moveTo(-dx, yH);
    c.quadraticCurveTo(-dx * .3, yH + H * .06 + sw, 0, yH + H * .02);
    c.quadraticCurveTo(dx * .3, yH - H * .02 + sw, dx, yH + H * .03);
    c.lineTo(dx * .94, yB);
    c.quadraticCurveTo(dx * .3, yB + H * .09 - sw, 0, yB + H * .05);
    c.quadraticCurveTo(-dx * .3, yB + H * .10 + sw, -dx * .94, yB);
    c.closePath();
    c.fillStyle = om(206, 194, 168, .93); c.fill();
    // plis : la toile ne peut pas être un aplat, c'est ce qui la ferait lire carton
    c.strokeStyle = om(150, 138, 116, .5);
    c.lineWidth = Math.max(.8, L * .012);
    for (let i = 1; i < 6; i++){
      const x = -dx + (2 * dx) * (i / 6);
      c.beginPath();
      c.moveTo(x, yH + H * .03 + Math.sin(i * 1.7) * H * .012);
      c.quadraticCurveTo(x + sw * .6, (yH + yB) / 2, x, yB + H * .06);
      c.stroke();
    }
    c.strokeStyle = om(88, 74, 54, .8);          // liens aux quatre coins
    c.lineWidth = Math.max(1, L * .016);
    for (const sx of [-1, 1]){
      c.beginPath();
      c.moveTo(sx * dx, yH + H * .03); c.lineTo(sx * dx * 1.1, yH - H * .05);
      c.stroke();
    }
    c.restore();
  }

  // le bâtisseur n'a que six tenues : les deux époques ajoutées empruntent la voisine
  const epOut = (ep) => Math.max(0, Math.min(5, ep - 1));
  function dessineOuvrier(rendu, u, ep, solY, nuit, t0, E){
    const etapes = [];
    for (const r of rendu)
      etapes[r.q.rang] = { x: r.q.u * W, y: solY + (Hh - solY) * r.q.dy,
                           s: r.s, L: (78 + r.q.gr * 30) * E * r.q.ech,
                           H: (58 + r.q.gr * 26 + r.e * 26) * E * r.q.ech };
    etapes.push({ x: W * .70, y: solY + (Hh - solY) * .026, s: .84,
                  L: 120 * E, H: (Hh - solY) * 1.45 });
    const TRAV = .035;                       // durée du travail sur place, en avancement
    let j = 0;
    while (j < etapes.length && u >= etapes[j].s) j++;
    if (j >= etapes.length){                 // le village est fait : il s'en va
      const q = Math.min(1, (u - etapes[etapes.length - 1].s) / .10);
      const S = 17 * E;
      ctx.save();
      ctx.translate(etapes[etapes.length - 1].x + q * W * .6, solY + (Hh - solY) * .04);
      batisseur(ctx, S, epOut(ep), 1, nuit, t0,
                teinteScene(nuit, .10, couleurVil(ep, "b")), aleaDe(.61));
      ctx.restore();
      return;
    }
    const cible = etapes[j], dep = j > 0 ? etapes[j - 1] : { x: -W * .12, y: cible.y };
    const t0s = j > 0 ? etapes[j - 1].s : 0, t1s = cible.s;
    const arrivee = Math.max(t0s, t1s - TRAV);
    const marche = u < arrivee;
    const av = marche ? (u - t0s) / Math.max(.001, arrivee - t0s)
                      : (u - arrivee) / Math.max(.001, t1s - arrivee);
    const lisse = marche ? av * av * (3 - 2 * av) : 1;
    const x = dep.x + (cible.x - dep.x) * lisse;
    const y = dep.y + (cible.y - dep.y) * lisse;
    const om2 = teinteScene(nuit, .10, couleurVil(ep, "b")), al2 = aleaDe(.61);
    if (!marche){                            // l'échafaudage se monte pendant les coups
      ctx.save();
      ctx.translate(cible.x, cible.y);
      echafaudage(ctx, cible.L, cible.H, epOut(ep), 1 - av, nuit, t0, om2, al2);
      bache(ctx, cible.L, cible.H, av, nuit, t0, om2, al2);
      ctx.restore();
      poussiere(ctx, cible.x, cible.y, cible.L * .9, .55 + av * .35,
                nuit, t0, om2, al2, 23);
    }
    ctx.save();
    ctx.translate(x + (marche ? 0 : cible.L * .42), y);
    batisseur(ctx, 17 * E, epOut(ep), marche ? 1 : 0, nuit, t0, om2, al2);
    ctx.restore();
  }

  // pose d'une parcelle : place, met à l'échelle, applique la pousse du chantier
  function dessineParcelle(r, solY, ee, nuit, t0, E, cielBas){
    const q = r.q;
    const base = solY + (Hh - solY) * q.dy;
    const L = (78 + q.gr * 30) * E * q.ech;
    const H = (58 + q.gr * 26 + r.e * 26) * E * q.ech;
    const sp = spriteBati(r.e, q.dec, L, H, q.gr, nuit + (q.fond ? .18 : 0),
                          q.fond ? .40 : .11, cielBas);
    const g2 = Math.max(0, Math.min(1, r.g));
    ctx.save();
    ctx.fillStyle = "rgba(14,11,8," + ((q.fond ? .15 : .30) * (1 - nuit * .5)) + ")";
    ctx.beginPath();
    ctx.ellipse(q.u * W, base, L * .56, Math.max(2, L * .075), 0, 0, 6.283);
    ctx.fill();
    if (q.fond){ ctx.globalAlpha = .92; }
    /* La ligne de sol du sprite est à `sp.height - MARGE_BAS` : c'est elle qu'il
       faut poser sur `base`, pas le bas du canvas. Les maisons flottaient. */
    const gx = q.u * W - sp.width / 2, gy = base - (sp.height - MARGE_BAS);
    if (g2 >= 1){
      ctx.drawImage(sp, gx, gy);
    } else {
      /* Un chantier se découvre par le bas, assise après assise. L'écraser
         verticalement en faisait une crêpe posée au sol. */
      const hv = (sp.height - MARGE_BAS) * g2;
      ctx.beginPath();
      ctx.rect(gx, base - hv, sp.width, hv + MARGE_BAS);
      ctx.clip();
      ctx.drawImage(sp, gx, gy);
    }
    ctx.restore();
    if (r.g < 1){                                    // poussière de chantier
      ctx.save();
      ctx.globalAlpha = (1 - r.g) * .5;
      ctx.fillStyle = "rgba(190,176,150,.8)";
      for (let i = 0; i < 6; i++){
        const a = i * 1.05 + t0 * 2;
        ctx.beginPath();
        ctx.arc(q.u * W + Math.cos(a) * L * .5, base - Math.abs(Math.sin(a)) * 12 * E,
                (3 + i) * E * q.ech, 0, 6.283);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  /* ================= MONDE 2 : les abysses =================
     La journée est une DESCENTE : on quitte le bateau le matin en surface et on
     atteint le fond le soir. Acheter une profondeur allonge la plongée.
     La faune est zonée : on ne croise que les espèces de la profondeur courante,
     ce qui évite d'avoir tout l'océan à l'écran en même temps. */
  const PROFONDEURS = [                    // palier acheté → fond atteint (m)
    { id:"violet", m:1800 }, { id:"rouge", m:600 },
    { id:"orange", m:200 },  { id:"jaune", m:80 }
  ];
  const profMax = () => (PROFONDEURS.find(z => aDebloque(z.id)) || { m:30 }).m;

  /* Zone et clarté sont pilotées par le TEMPS RESTANT, aux mêmes seuils que la LED
     du manomètre : l'instrument et l'environnement racontent la même chose.
     (La profondeur en mètres et la pression restent, elles, continues et physiques.) */
  const zoneDe = s => s > 3600 ? "recif"      // + d'1 h : eaux claires, poissons vifs
                    : s > 1200 ? "large"      // 1 h    : pleine eau, poissons argentés
                    : s >  300 ? "meduses"    // 20 min : pénombre, méduses
                    : s >   60 ? "abysse"     // 5 min  : nuit, poissons-lanternes
                    :            "fosse";     // 1 min  : la fosse, presque rien
  // clarté par paliers interpolés, calée sur les mêmes bornes
  const ANCRES = [[14400, 1], [3600, .55], [1200, .28], [300, .12], [60, .05], [0, .02]];
  function clarteDe(s){
    s = Math.max(0, s);
    if (s >= ANCRES[0][0]) return 1;
    for (let i = 0; i < ANCRES.length - 1; i++){
      const [a, va] = ANCRES[i], [b, vb] = ANCRES[i + 1];
      if (s <= a && s >= b) return vb + (va - vb) * (s - b) / (a - b);
    }
    return .02;
  }

  const plancton = [], nageurs = [], bulles = [], herbes = [], rochers = [], grains = [];
  let baleine = null, abyssPret = false;

  // enPlace : répartir d'emblée sur la largeur, sinon la zone paraît vide au changement.
  // d = éloignement (0 tout près, 1 au loin) : pilote ensemble opacité, taille et
  // vitesse, ce qui donne une vraie parallaxe plutôt qu'une transparence aléatoire.
  /* Échelle du décor : tout est proportionnel au plus petit côté du viewport.
     Sans ça les poissons paraissent minuscules sur un grand écran et énormes
     dans une petite fenêtre. Recalculée à chaque frame → le redimensionnement
     est pris en compte immédiatement, sans faire réapparaître les créatures. */
  const ech = () => Math.min(W, Hh) / 760;

  const seedNageur = (zone, enPlace) => {
    const versDroite = Math.random() < .5, d = Math.random();
    const liste = FAUNE[zone] || ["🐟"];
    const em = tirage(liste[(Math.random() * liste.length) | 0]);
    const pr = profil(em);
    return { x: enPlace ? Math.random() * W : (versDroite ? -90 * dpr : W + 90 * dpr),
             y: Hh * (.08 + Math.random() * .84),
             dir: versDroite ? 1 : -1, d,
             // tailles et vitesses stockées SANS échelle, appliquée au dessin
             vb: (Math.random() * .35 + .8) * pr.v * (1 - d * .55),
             tb: (Math.random() * 3 + 19) * pr.t * (1 - d * .4),
             v: 0, t: 0,
             op: 1 - d * .5,
             ph: Math.random() * 6.3, zone, em,
             nage: pr.nage,
             dess: Math.random() < (PART_DESSIN[zone] || 0) };
  };
  function initAbysses(){
    if (abyssPret) return;
    abyssPret = true;
    for (let i = 0; i < 70; i++)
      plancton.push({ x: Math.random() * W, y: Math.random() * Hh,
                      r: (Math.random() * 1.3 + .35) * dpr,
                      v: (Math.random() * .4 + .12) * dpr, a: Math.random() * .4 + .12 });
    for (let i = 0; i < 24; i++)
      herbes.push({ x: Math.random(), h: (Math.random() * 70 + 40) * dpr,
                    ph: Math.random() * 6.3, w: (Math.random() * 3 + 2.5) * dpr });
    // décor du fond, en fractions de largeur pour survivre à un redimensionnement
    for (let i = 0; i < 9; i++)
      rochers.push({ x: Math.random(), w: (Math.random() * 55 + 30) * dpr,
                     h: (Math.random() * 45 + 22) * dpr });
    for (let i = 0; i < 130; i++)
      grains.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .5 });
  }
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

  /* ---- caustiques : somme d'ondes calculée pixel par pixel sur une petite surface,
     puis étirée plein écran. L'agrandissement fait le flou, comme une vraie lumière
     d'eau. C'est le seul « shader » qu'on peut se permettre en Canvas 2D. ---- */
  let cauCv = null, cauCtx = null, cauImg = null;
  const CAU_W = 150, CAU_H = 84;
  function caustiques(alpha, t){
    if (alpha < .015) return;
    if (!cauCv){
      cauCv = document.createElement("canvas");
      cauCv.width = CAU_W; cauCv.height = CAU_H;
      cauCtx = cauCv.getContext("2d");
      cauImg = cauCtx.createImageData(CAU_W, CAU_H);
      for (let i = 3; i < cauImg.data.length; i += 4) cauImg.data[i] = 0;
      for (let i = 0; i < cauImg.data.length; i += 4){
        cauImg.data[i] = 190; cauImg.data[i + 1] = 242; cauImg.data[i + 2] = 255;
      }
    }
    const d = cauImg.data;
    for (let y = 0; y < CAU_H; y++){
      const v = y * .11;
      for (let x = 0; x < CAU_W; x++){
        const u = x * .085;
        const s = Math.sin(u + t) + Math.sin(v * 1.3 - t * .8)
                + Math.sin((u + v) * .7 + t * 1.35)
                + Math.sin(Math.sqrt((u - 7) * (u - 7) + (v - 4) * (v - 4)) * 1.15 - t * 1.1);
        const k = 1 - Math.min(1, Math.abs(s) * .27);
        d[(y * CAU_W + x) * 4 + 3] = (k * k * k * k * k * k) * 255;   // veines fines
      }
    }
    cauCtx.putImageData(cauImg, 0, 0);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = alpha;
    ctx.drawImage(cauCv, 0, 0, W, Hh);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  // motes bioluminescentes : la seule vie visible quand la lumière a disparu
  const motes = [];
  let moteSprite = null;
  function bioluminescence(force, t){
    if (force < .02) return;
    if (!motes.length)
      for (let i = 0; i < 46; i++)
        motes.push({ x: Math.random() * W, y: Math.random() * Hh,
                     r: (Math.random() * 2.2 + .8) * dpr,
                     vy: (Math.random() * .22 + .06) * dpr,
                     vx: (Math.random() - .5) * .12 * dpr,
                     ph: Math.random() * 6.3, h: 150 + Math.random() * 60 });
    // sprite de halo calculé une fois : recréer 46 dégradés par frame coûterait cher sur téléphone
    if (!moteSprite){
      moteSprite = document.createElement("canvas");
      moteSprite.width = moteSprite.height = 64;
      const g2 = moteSprite.getContext("2d");
      const gr = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0,   "rgba(215,255,240,.95)");
      gr.addColorStop(.18, "rgba(140,255,220,.45)");
      gr.addColorStop(1,   "rgba(90,220,255,0)");
      g2.fillStyle = gr; g2.fillRect(0, 0, 64, 64);
    }
    ctx.globalCompositeOperation = "lighter";
    for (const m of motes){
      m.y -= m.vy; m.x += m.vx + Math.sin(m.y * .01 + m.ph) * .12 * dpr;
      if (m.y < -8){ m.y = Hh + 8; m.x = Math.random() * W; }
      const pulse = .45 + Math.sin(t * 1.7 + m.ph) * .55;
      const d2 = m.r * 14;
      ctx.globalAlpha = force * pulse;
      ctx.drawImage(moteSprite, m.x - d2 / 2, m.y - d2 / 2, d2, d2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---- créatures ----
     Récif et pleine eau utilisent des emoji : jeu d'assets plat et universel, déjà
     employé pour la pause repas, et disponible hors ligne. Les deux créatures
     signature restent dessinées : aucun emoji de poisson-lanterne n'existe, et
     celui de méduse est trop récent pour s'afficher partout. */
  /* Sprites fournis, embarqués en base64 : l'artifact bloque tout chargement

  /* Ondulation : l'emoji est rendu une fois hors écran, puis redessiné en tranches
     verticales décalées par une onde qui court de la tête vers la queue. Un simple
     balancement d'ensemble ferait « panneau qui pivote » ; là, le corps nage. */
  // Un seul cache pour tout le monde : une espèce dessinée et un emoji produisent
  // le même sprite, donc les deux héritent de l'ondulation sans code en double.
  const emSprites = {};
  const TAILLE_SPRITE = S96;
  // les sprites fournis sont décodés une fois au démarrage
  const IMAGES = {};
  for (const cle in ASSETS_B64){
    const im = new Image();
    im.src = ASSETS_B64[cle];
    IMAGES[cle] = im;
  }
  function spriteEmoji(cle){
    const im = IMAGES[cle];
    if (im) return (im.complete && im.naturalWidth) ? im : null;   // pas encore décodé
    if (emSprites[cle]) return emSprites[cle];
    const c = document.createElement("canvas");
    c.width = c.height = TAILLE_SPRITE;
    const g = c.getContext("2d");
    if (DESSINS[cle]) DESSINS[cle](g);
    else {
      g.font = Math.round(TAILLE_SPRITE * .82)
             + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(cle, TAILLE_SPRITE / 2, TAILLE_SPRITE / 2);
    }
    return emSprites[cle] = c;
  }
  /* Le sprite est dessiné d'un bloc. Le découpage en tranches ondulantes déchirait
     les dessins fournis — sur un emoji ça passait, sur un vrai poisson c'est laid.
     Seuls calmar et méduse gardent une contraction du corps, qui EST leur nage. */
  /* Perspective atmosphérique : au lieu de rendre les créatures transparentes —
     ce qui en fait des fantômes à travers lesquels on voit les caustiques — on les
     fond vers la couleur de l'eau. Le sujet reste opaque, mais s'efface au loin.
     Les variantes teintées sont mises en cache, et le cache est vidé quand la
     couleur de l'eau change assez pour que ça se voie. */
  const teintes = {};
  let seauCourant = -1, seauArr = [10, 40, 60];
  const NIV = 7;
  function spriteFondu(cle, niv){
    const k = cle + "|" + niv;
    if (teintes[k]) return teintes[k];
    const src = spriteEmoji(cle);
    if (!src) return null;
    const c = document.createElement("canvas");
    c.width = src.width || 128; c.height = src.height || 128;
    const g = c.getContext("2d");
    g.drawImage(src, 0, 0, c.width, c.height);
    const f = niv / NIV;                          // 0 tout près, 1 au loin
    // La cible s'assombrit avec la distance ET tire vers le bleu franc : l'eau
    // absorbe le rouge en premier, c'est ce qui donne son teint à tout ce qui baigne.
    const som = 1 - f * .62;
    const r = Math.round(seauArr[0] * som * .45);
    const v = Math.round(seauArr[1] * som * .78);
    const b = Math.round(seauArr[2] * som);
    g.globalCompositeOperation = "source-atop";   // ne peint que le sujet, pas le vide
    g.fillStyle = "rgba(" + r + "," + v + "," + b + "," + (.5 + f * .45) + ")";
    g.fillRect(0, 0, c.width, c.height);

    // Une créature qui porte sa propre lampe s'éclaire elle-même : on rallume la
    // face autour du foyer, sinon le poisson reste noir à côté d'un halo lumineux.
    const lu = LUEURS[cle];
    if (lu && lu.foyer){
      const fx = lu.foyer[0] * c.width, fy = lu.foyer[1] * c.height;
      const rg = g.createRadialGradient(fx, fy, 0, fx, fy, c.width * .58);
      rg.addColorStop(0,   "rgba(" + lu.t + ",.95)");
      rg.addColorStop(.16, "rgba(" + lu.t + ",.55)");
      rg.addColorStop(.55, "rgba(" + lu.t + ",.14)");
      rg.addColorStop(1,   "rgba(" + lu.t + ",0)");
      g.fillStyle = rg;                            // toujours en source-atop
      g.fillRect(0, 0, c.width, c.height);
    }
    return teintes[k] = c;
  }

  /* Étincelle : cœur blanc + croix de diffraction. Les branches, c'est ce qui la
     fait lire comme un éclat plutôt que comme une bulle lumineuse. */
  function etincelle(c, x, y, r, col, b){
    if (b <= .03) return;
    c.globalCompositeOperation = "lighter";
    const g = c.createRadialGradient(x, y, 0, x, y, r * 2.4);
    g.addColorStop(0,  "rgba(255,255,255," + b + ")");
    g.addColorStop(.35,"rgba(" + col + "," + (b * .55) + ")");
    g.addColorStop(1,  "rgba(" + col + ",0)");
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r * 2.4, 0, 6.283); c.fill();
    const L = r * 4.2 * b;
    c.strokeStyle = "rgba(255,255,255," + (b * .8) + ")";
    c.lineWidth = Math.max(.7, r * .2);
    c.beginPath();
    c.moveTo(x - L, y); c.lineTo(x + L, y);
    c.moveTo(x, y - L); c.lineTo(x, y + L);
    c.stroke();
    c.globalCompositeOperation = "source-over";
  }
  // positions fixes sur le corps, tirées de la phase de la créature (donc stables)
  function scintille(c, s, lu, t, dd){
    const e = lu.etinc;
    for (let i = 0; i < e.n; i++){
      const a = s.ph + i * 2.399;                      // angle d'or : répartition régulière
      const fx = .5 + Math.cos(a * 3.1) * .30;
      const fy = .5 + Math.sin(a * 2.7) * .28;
      const x = s.x - s.dir * (fx - .5) * dd;
      const y = s.y + (fy - .5) * dd;
      const br = Math.pow(Math.max(0, Math.sin(t * e.v + a * 5.7)), 7);
      etincelle(c, x, y, dd * .045, e.c, br);
    }
  }

  function poissonEmoji(c, s, t){
    const sp = spriteEmoji(s.em);
    if (!sp) return;                          // sprite pas encore prêt
    const d = s.t * 3.2;
    if (s.nage === "jet" || s.nage === "meduse"){
      const vite = s.nage === "jet" ? 1.5 : 1.1;
      const pomp = Math.sin(t * vite + s.ph);
      c.scale(1 + pomp * .10, 1 - pomp * .09);
    }
    // même au premier plan la créature baigne dans l'eau : le fondu ne part pas de zéro
    const niv = Math.max(1, Math.min(NIV, Math.round(s.d * (NIV - 1)) + 1));
    c.drawImage(spriteFondu(s.em, niv) || sp, -d / 2, -d / 2, d, d);
  }
  function meduse(c, s, t0){                   // ombrelle translucide + tentacules
    const pulse = 1 + Math.sin(t0 * 1.5 + s.ph) * .13, R = s.t * 1.15;
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "rgba(140,120,255,.16)";
    c.beginPath(); c.arc(0, 0, R * 2.2 * pulse, 0, 6.283); c.fill();
    const g = c.createLinearGradient(0, -R, 0, R * .8);
    g.addColorStop(0, "rgba(226,214,255,.72)");
    g.addColorStop(1, "rgba(150,120,235,.16)");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, R * pulse, R * .78 * pulse, 0, Math.PI, 0); c.fill();
    c.strokeStyle = "rgba(206,190,255,.5)"; c.lineWidth = 1.6 * dpr; c.lineCap = "round";
    for (let k = -2; k <= 2; k++){
      c.beginPath(); c.moveTo(k * R * .3, R * .1);
      c.quadraticCurveTo(k * R * .48 + Math.sin(t0 * 2.2 + k + s.ph) * 7 * dpr, R * 1.5,
                         k * R * .32, R * 2.6);
      c.stroke();
    }
    c.globalCompositeOperation = "source-over";
  }
  function poissonLanterne(c, s, t0){          // corps trapu, mâchoire, leurre lumineux
    const L = s.t * 1.1;
    c.fillStyle = "rgba(8,12,22,.96)";
    c.beginPath(); c.ellipse(0, 0, L, L * .72, 0, 0, 6.283); c.fill();
    c.beginPath(); c.moveTo(-L * .95, 0);                                 // queue
    c.lineTo(-L * 1.7, -L * .5); c.lineTo(-L * 1.7, L * .5); c.closePath(); c.fill();
    c.fillStyle = "rgba(230,244,255,.85)";                                // dents
    for (let k = 0; k < 5; k++){
      const x = L * (.18 + k * .16);
      c.beginPath(); c.moveTo(x, L * .3); c.lineTo(x + L * .07, L * .05);
      c.lineTo(x + L * .14, L * .3); c.closePath(); c.fill();
    }
    c.strokeStyle = "rgba(10,16,26,.96)"; c.lineWidth = 2.2 * dpr;        // tige du leurre
    c.beginPath(); c.moveTo(L * .25, -L * .55);
    c.quadraticCurveTo(L * 1.25, -L * 1.5, L * 1.5, -L * .55); c.stroke();
    const pulse = .55 + Math.sin(t0 * 3 + s.ph) * .45;                    // leurre qui palpite
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "rgba(140,255,220," + (.16 * pulse) + ")";
    c.beginPath(); c.arc(L * 1.5, -L * .55, L * 1.5, 0, 6.283); c.fill();
    c.fillStyle = "rgba(200,255,240," + (.55 + .4 * pulse) + ")";
    c.beginPath(); c.arc(L * 1.5, -L * .55, L * .22, 0, 6.283); c.fill();
    c.globalCompositeOperation = "source-over";
    c.fillStyle = "rgba(150,240,255,.8)";                                 // œil
    c.beginPath(); c.arc(L * .45, -L * .18, L * .11, 0, 6.283); c.fill();
  }

  /* ---- instruments : règle de profondeur + manomètre ----
     RP : l'écran est le masque du plongeur. La vitre du manomètre puis celle du
     casque se fissurent quand la pression devient critique. */
  let rulePM = -1;                          // profondeur max déjà graduée
  // position d'une altitude sur une règle logarithmique, 0 en bas, 1 en haut
  const partLog = (m, PM) => Math.max(0, Math.min(1,
    Math.log10(Math.max(1, m)) / Math.log10(PM)));
  // libellé compact : mètres puis kilomètres, avec une espace fine tous les 3 chiffres
  function libAlt(m){
    if (m < 1000) return m + " m";
    const km = Math.round(m / 1000) + "";
    return km.replace(/\B(?=(\d{3})+$)/g, "\u202F") + " km";
  }
  function construitRegle(PM, arbre){
    if (rulePM === PM) return;
    rulePM = PM;
    // pas « rond » (1, 2 ou 5 × puissance de 10) visant ~8 repères : sinon une
    // échelle de 40 km produisait deux cents graduations illisibles
    let h = "";
    if (arbre && PM > 2000){
      // au-delà du kilomètre, seule une échelle logarithmique tient sur la règle
      for (let e = 0; Math.pow(10, e) <= PM; e++){
        const m = Math.pow(10, e);
        const y = (1 - partLog(m, PM)) * 100;
        h += '<i class="maj" style="top:' + y.toFixed(2) + '%;width:14px"></i>'
           + '<b style="top:' + y.toFixed(2) + '%">' + libAlt(m) + '</b>';
        for (let k = 2; k < 10; k++){            // demi-décades, sans étiquette
          const mm = m * k;
          if (mm > PM) break;
          h += '<i style="top:' + ((1 - partLog(mm, PM)) * 100).toFixed(2)
             + '%;width:6px"></i>';
        }
      }
    } else {
      // pas « rond » (1, 2 ou 5 × puissance de 10) visant ~8 repères : sinon une
      // échelle de 40 km produisait deux cents graduations illisibles
      const brut = PM / 8, dec = Math.pow(10, Math.floor(Math.log10(brut)));
      const nn = brut / dec;
      const pas = (nn <= 1 ? 1 : nn <= 2 ? 2 : nn <= 5 ? 5 : 10) * dec;
      for (let m = 0; m <= PM; m += pas){
        const y = arbre ? 100 - (m / PM) * 100 : (m / PM) * 100;
        const maj = (m % (pas * 2) === 0);
        h += '<i class="' + (maj ? "maj" : "") + '" style="top:' + y + '%;width:'
           + (maj ? 14 : 8) + 'px"></i>';
        const lib = arbre ? libAlt(m)
                  : m >= 2000 ? (m / 1000).toFixed(m % 1000 ? 1 : 0) + "k" : m;
        if (maj) h += '<b style="top:' + y + '%">' + lib + '</b>';
      }
    }
    $("drTicks").innerHTML = h;
    // graduations du cadran, une fois par échelle
    const barMax = arbre ? 1013 : 1 + PM / 10;
    let t = "";
    for (let i = 0; i <= 8; i++){
      const a = (-120 + i * 30) * Math.PI / 180, maj = i % 2 === 0;
      const r1 = maj ? 36 : 40, r2 = 46;
      t += '<line class="' + (maj ? "maj" : "") + '" x1="' + (60 + Math.sin(a) * r1).toFixed(1)
         + '" y1="' + (60 - Math.cos(a) * r1).toFixed(1)
         + '" x2="' + (60 + Math.sin(a) * r2).toFixed(1)
         + '" y2="' + (60 - Math.cos(a) * r2).toFixed(1) + '"/>';
    }
    $("pgTicks").innerHTML = t;
    $("pressGauge").dataset.max = barMax;
  }
  /* La chronique remplace règle et manomètre : le Village ne se mesure pas en
     mètres mais en siècles. */
  function majChronique(){
    const an = Math.round(anneeV);
    $("chAn").textContent = an < 0 ? Math.abs(an) + " av. J.-C." : "an " + an;
    $("chEp").textContent = epNom;
    const h = Math.round(popV);
    $("chPop").textContent = (h >= 1e6 ? (h / 1e6).toFixed(1).replace(".", ",") + " M"
                            : h >= 1000 ? (h / 1000).toFixed(1).replace(".", ",") + " k"
                            : h) + " habitants";
  }
  function majInstruments(secDep){
    /* La règle sert aux deux mondes ; le manomètre, lui, reste à l'eau :
       chaque monde a ses instruments. */
    const arbre = save.actif === "arbre";
    const MX = arbre ? altMax() : profMax();
    const val = arbre ? altM : profM;
    construitRegle(MX, arbre);
    // règle : le curseur descend en plongée, remonte en ascension
    const part = arbre && MX > 2000 ? partLog(val, MX) * 100
               : Math.max(0, Math.min(100, val / MX * 100));
    $("drCursor").style.top = (arbre ? 100 - part : part) + "%";
    $("drVal").textContent = arbre ? libAlt(Math.round(val))
      : "−" + (val < 100 ? val.toFixed(1) : Math.round(val));
    if (arbre) return;

    // cadran : la pression de l'eau, en bar
    const mes = 1 + val / 10;
    const frac = mes / (Number($("pressGauge").dataset.max) || 1);
    $("pgNeedle").style.transform =
      "rotate(" + (-120 + Math.max(0, Math.min(1, frac)) * 240).toFixed(1) + "deg)";
    $("pgVal").textContent = mes.toFixed(mes < 100 ? 1 : 0) + " bar";
    // état de la LED. Une fois le départ passé, tout redevient calme :
    // sinon les fissures resteraient à l'écran toute la soirée.
    const b = document.body, avant = secDep > 0;
    const etat = !avant ? "" : secDep <= 60 ? "noire" : secDep <= 300 ? "rouge"
               : secDep <= 1200 ? "orange" : secDep <= 3600 ? "jaune" : "";
    for (const e of ["jaune", "orange", "rouge", "noire"])
      b.classList.toggle("led-" + e, etat === e);
    b.classList.toggle("pg-fissure", avant && secDep <= 300);   // vitre du manomètre
    b.classList.toggle("visor-casse", avant && secDep <= 60);   // vitre du casque
  }

  /* ---- le canyon : décor de fond ----
     Trois couches de parois dentelées, de part et d'autre. Elles défilent vers le
     haut pendant qu'on descend, et à des vitesses différentes : c'est ce décalage
     qui donne la sensation de chute. Le centre reste dégagé pour le compteur. */
  const PAROIS = [
    { n:24, larg:.30, par:.22, haut:[34, 58, 78], bas:[18, 32, 46], a:.85 }, // lointaine, bleutée
    { n:18, larg:.22, par:.50, haut:[16, 30, 44], bas:[8,  16, 26], a:.92 },
    { n:13, larg:.15, par:1,   haut:[5,  10, 17], bas:[1,  3,  6 ], a:1   }  // proche, presque noire
  ];
  const parois = [];
  function initCanyon(){
    if (parois.length) return;
    for (const cf of PAROIS){
      const tirer = () => Array.from({ length: cf.n }, () => Math.random());
      parois.push({ cf, g: tirer(), d: tirer() });
    }
  }
  // interpolation douce entre points de contrôle, avec bouclage
  function ondu(arr, x){
    const n = arr.length, i = Math.floor(x), f = x - i;
    const a = arr[((i % n) + n) % n], b = arr[((((i + 1) % n)) + n) % n];
    return a + (b - a) * (1 - Math.cos(f * Math.PI)) * .5;
  }
  // largeur de la paroi à une hauteur donnée : deux fréquences pour dentelure
  const largeurParoi = (arr, v) =>
    .22 + ondu(arr, v) * .48 + ondu(arr, v * 3.7 + 11) * .30;

  function dessineCanyon(p, clarte, t0){
    initCanyon();
    const PAS = 16 * dpr;
    for (let k = 0; k < parois.length; k++){
      const { cf, g, d } = parois[k];
      const off = p * Hh * 9 * cf.par;              // défile vers le haut avec la descente
      const ech = Hh * .34;
      const gr = ctx.createLinearGradient(0, 0, 0, Hh);
      gr.addColorStop(0, "rgb(" + mix(cf.haut, [150, 176, 150], clarte * .55) + ")");
      gr.addColorStop(1, "rgb(" + mix(cf.bas,  [96, 120, 104], clarte * .55) + ")");
      ctx.globalAlpha = cf.a;
      ctx.fillStyle = gr;

      ctx.beginPath(); ctx.moveTo(-2, -2);           // paroi gauche
      for (let y = -PAS; y <= Hh + PAS; y += PAS)
        ctx.lineTo(W * cf.larg * largeurParoi(g, (y + off) / ech), y);
      ctx.lineTo(-2, Hh + 2); ctx.closePath(); ctx.fill();

      ctx.beginPath(); ctx.moveTo(W + 2, -2);        // paroi droite
      for (let y = -PAS; y <= Hh + PAS; y += PAS)
        ctx.lineTo(W - W * cf.larg * largeurParoi(d, (y + off) / ech), y);
      ctx.lineTo(W + 2, Hh + 2); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }

  }

  /* ---- le plongeur s'équipe à mesure qu'il s'enfonce ----
     + d'1 h : en maillot, il fait trempette
     - d'1 h : scaphandre autonome
     - 10 min : scaphandre pieds-lourds, casque de cuivre et lampe
     - 1 min  : il a troqué le corps humain contre un sous-marin

     Les membres sont des CHAÎNES ARTICULÉES : chaque segment est dessiné dans le
     repère de son parent (hanche → cuisse → mollet → palme). Rien ne peut se
     détacher, et le retard de phase d'un segment sur l'autre donne le coup de
     fouet du battement. */
  function jambePalmee(c, u, t, cad, ph, teint, palme, lp){
    c.save();
    c.rotate(Math.sin(t * cad + ph) * .30);                    // cuisse
    c.strokeStyle = teint; c.lineWidth = 6.5 * u; c.lineCap = "round";
    c.beginPath(); c.moveTo(0, 0); c.lineTo(-11 * u, 0); c.stroke();
    c.translate(-11 * u, 0);
    c.rotate(Math.sin(t * cad + ph - .75) * .42);               // mollet, en retard
    c.lineWidth = 5.4 * u;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(-11 * u, 0); c.stroke();
    c.translate(-11 * u, 0);
    c.rotate(Math.sin(t * cad + ph - 1.4) * .5);                // palme, encore en retard
    c.fillStyle = palme;
    c.beginPath(); c.moveTo(0, -3.5 * u);
    c.lineTo(-lp * u, -7 * u); c.lineTo(-lp * .92 * u, 6 * u);
    c.closePath(); c.fill();
    c.restore();
  }
  function brasNage(c, u, t, cad, teint, ep){
    c.save();
    c.rotate(Math.sin(t * cad + .9) * .26);                     // épaule
    c.strokeStyle = teint; c.lineWidth = ep * u; c.lineCap = "round";
    c.beginPath(); c.moveTo(0, 0); c.lineTo(10 * u, 0); c.stroke();
    c.translate(10 * u, 0);
    c.rotate(Math.sin(t * cad + .3) * .3);                      // coude
    c.lineWidth = ep * .88 * u;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(9 * u, 0); c.stroke();
    c.restore();
  }

  const EQUIPEMENTS = {
    nageur(c, u, glow, t){
      c.save(); c.translate(-6 * u, -3 * u);
      jambePalmee(c, u, t, 3.2, 0,   "#E8B98F", "#25A9C6", 19); c.restore();
      c.save(); c.translate(-6 * u, 3 * u);

      c.fillStyle = "#E8543F";                                                  // short
      c.beginPath(); c.ellipse(-7 * u, 0, 11 * u, 8 * u, 0, 0, 6.283); c.fill();

      c.beginPath(); c.ellipse(8 * u, -1 * u, 16 * u, 8 * u, 0, 0, 6.283); c.fill();
      c.fillStyle = "#F0C79C";
      c.beginPath(); c.arc(23 * u, -6 * u, 8 * u, 0, 6.283); c.fill();          // tête
      c.fillStyle = "#3B2A1E";
      c.beginPath(); c.arc(22 * u, -7 * u, 8.4 * u, Math.PI, 0); c.fill();      // cheveux
      c.strokeStyle = "#F5D64A"; c.lineWidth = 2.4 * u;                         // tuba
      c.beginPath(); c.moveTo(25 * u, -12 * u);
      c.quadraticCurveTo(19 * u, -24 * u, 26 * u, -26 * u); c.stroke();
      c.fillStyle = glow;
      c.beginPath(); c.ellipse(28 * u, -6 * u, 5 * u, 4 * u, 0, 0, 6.283); c.fill();

      c.save(); c.translate(13 * u, 2 * u);                                     // bras devant
      brasNage(c, u, t, 3.2, "#F0C79C", 5); c.restore();
    },

    scuba(c, u, glow, t){
      c.save(); c.translate(-4 * u, -4 * u);
