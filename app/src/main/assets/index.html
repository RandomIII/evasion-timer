    const mx  = (A, B, k) => [lrp(A[0], B[0], k), lrp(A[1], B[1], k), lrp(A[2], B[2], k)];
    const TAU = Math.PI * 2;

    const ep = cl(ee, 0, 5);
    const ei = Math.min(4, Math.floor(ep));
    const ef = cl(ep - ei, 0, 1);
    const wt = (k) => Math.max(0, 1 - Math.abs(ep - k));   // poids d'une epoque
    const NP = (a) => lrp(a[ei], a[ei + 1], ef);
    const NC = (a) => mx(a[ei], a[ei + 1], ef);
    const K  = (A, a) => om(A[0], A[1], A[2], a);

    const nt  = cl(nuit, 0, 1);
    const day = 1 - nt;

    // Horizon virtuel au-dessus de solY : pose sur solY meme, l'echelle tomberait
    // a zero et toute la matiere lointaine disparaitrait d'un coup.
    const hz  = D * 0.15;
    const vpX = W * 0.5, vpY = solY - hz;
    const sc  = (v) => (v * D + hz) / (D + hz);
    const yv  = (v) => solY + v * D;
    const xAt = (gx, v) => vpX + (gx - vpX) * sc(v);
    const gxOf = (xs, v) => vpX + (xs - vpX) / sc(v);

    // Unite de dessin : l'echelle appli, mais bornee par la hauteur de la bande.
    // Sans ces bornes un sol tres plat recevrait des brins plus hauts que lui, et
    // un sol tres haut une pelouse en poils de brosse.
    const U = Math.max(D / 300, Math.min(E, D / 90));

    // Bande centrale laissee a la route : rien de haut n'y pousse.
    const vA = 0.42, vB = 0.74, vMg = 0.055;
    const openv = (v) => {
      if (v <= vA - vMg || v >= vB + vMg) return 1;
      if (v >= vA && v <= vB) return 0;
      return v < vA ? (vA - v) / vMg : (v - vB) / vMg;
    };
    const vStrat = 0.884;                       // haut de la coupe de terre

    // ---------------------------------------------------------------- palettes
    const GD = [[40, 56, 26], [76, 74, 38], [26, 58, 24], [42, 46, 34], [30, 70, 34], [20, 58, 54]];
    const GL = [[112, 132, 60], [172, 160, 92], [98, 148, 54], [94, 94, 60], [108, 162, 80], [72, 160, 128]];
    const SO = [[88, 74, 56], [146, 130, 100], [76, 56, 36], [60, 54, 48], [94, 90, 84], [100, 106, 116]];
    const DU = [[134, 122, 100], [198, 184, 152], [112, 92, 66], [86, 80, 72], [142, 140, 134], [152, 162, 172]];
    const CP = [[62, 52, 38], [120, 108, 84], [54, 40, 26], [46, 42, 38], [168, 166, 160], [174, 186, 198]];
    const FL = [
      [[236, 232, 214], [230, 198, 88], [186, 168, 222]],
      [[216, 200, 122], [198, 178, 98], [226, 216, 172]],
      [[240, 238, 228], [238, 208, 76], [212, 122, 152]],
      [[152, 148, 140], [170, 152, 92], [140, 150, 140]],
      [[246, 246, 240], [242, 224, 122], [236, 240, 246]],
      [[120, 240, 212], [150, 202, 255], [212, 152, 255]]
    ];
    const dGr = [0.66, 0.46, 0.95, 0.28, 1.00, 0.44];   // densite de brins
    const lGr = [1.10, 0.86, 1.24, 0.66, 0.46, 0.74];   // longueur
    const wGr = [1.00, 0.82, 0.88, 0.66, 0.10, 0.34];   // desordre
    const dPe = [1.00, 0.55, 0.42, 1.00, 0.16, 0.12];   // cailloux
    const dFl = [0.60, 0.26, 0.90, 0.04, 0.20, 0.70];   // fleurs
    const rTe = [1.00, 0.78, 1.00, 0.88, 0.24, 0.18];   // irregularite du terrain
    const cpH = [0.10, 0.16, 0.10, 0.18, 0.30, 0.34];   // epaisseur de la couche de surface

    const gd = NC(GD), gl = NC(GL), so = NC(SO), du = NC(DU), cp = NC(CP);
    const dG = NP(dGr), lG = NP(lGr), wG = NP(wGr);
    const pG = NP(dPe), fG = NP(dFl), rG = NP(rTe);
    const flA = mx(FL[ei][0], FL[ei + 1][0], ef);
    const flB = mx(FL[ei][1], FL[ei + 1][1], ef);
    const flC = mx(FL[ei][2], FL[ei + 1][2], ef);
    const w0 = wt(0), w1 = wt(1), w2 = wt(2), w3 = wt(3), w4 = wt(4), w5 = wt(5);

    c.save();
    c.beginPath();
    c.rect(0, solY, W, D);
    c.clip();

    // -------------------------------------------------------------- fond fuyant
    const far  = mx(gd, [0, 0, 0], 0.34);
    const near = mx(gl, gd, 0.44);
    const g0 = c.createLinearGradient(0, solY, 0, Hh);
    g0.addColorStop(0, K(far));
    g0.addColorStop(0.16, K(mx(far, near, 0.30)));
    g0.addColorStop(0.52, K(mx(far, near, 0.72)));
    g0.addColorStop(1, K(near));
    c.fillStyle = g0;
    c.fillRect(0, solY, W, D);

    // Lisiere : le tapis vu par la tranche est presque noir sur la ligne de sol.
    const g1 = c.createLinearGradient(0, solY, 0, solY + D * 0.055);
    g1.addColorStop(0, K(mx(gd, [0, 0, 0], 0.62), 0.9));
    g1.addColorStop(1, K(gd, 0));
    c.fillStyle = g1;
    c.fillRect(0, solY, W, D * 0.055);

    // ------------------------------------------------- relief : taches du sol
    for (let i = 0; i < 96; i++){
      const v  = al(1000 + i * 4) * 0.99 + 0.005;
      const s  = sc(v);
      const xs = al(1001 + i * 4) * W * 1.3 - W * 0.15;
      const rx = (9 + al(1002 + i * 4) * 30) * U * s * 2.1;
      const ry = rx * (0.20 + al(1003 + i * 4) * 0.18);
      const up = al(1000 + i * 4) > 0.5;
      const co = up ? mx(gl, du, 0.30) : mx(gd, so, 0.45);
      c.beginPath();
      c.ellipse(xs, yv(v), rx, ry, 0, 0, TAU);
      c.fillStyle = K(co, (0.05 + al(1002 + i * 4) * 0.09) * rG);
      c.fill();
    }

    // ------------------------------------------------- bande nue de la route
    const yA = yv(vA), yB = yv(vB);
    const gB = c.createLinearGradient(0, yv(vA - vMg * 1.6), 0, yv(vB + vMg * 1.6));
    gB.addColorStop(0, K(so, 0));
    gB.addColorStop(0.24, K(so, 0.86));
    gB.addColorStop(0.5, K(mx(so, du, 0.22), 0.94));
    gB.addColorStop(0.78, K(so, 0.88));
    gB.addColorStop(1, K(so, 0));
    c.fillStyle = gB;
    c.fillRect(0, yv(vA - vMg * 1.6), W, yv(vB + vMg * 1.6) - yv(vA - vMg * 1.6));

    // grain de la terre battue
    for (let i = 0; i < 300; i++){
      const v  = vA - vMg + al(2000 + i * 3) * (vB - vA + vMg * 2);
      const s  = sc(v);
      const xs = al(2001 + i * 3) * W;
      const r  = (0.5 + al(2002 + i * 3) * 1.6) * U * s;
      c.beginPath();
      c.ellipse(xs, yv(v), r * 2.0, r * 0.7, 0, 0, TAU);
      c.fillStyle = al(2002 + i * 3) > 0.5
        ? K(mx(so, [0, 0, 0], 0.35), 0.30)
        : K(mx(so, du, 0.55), 0.26);
      c.fill();
    }

    // ------------------------------------------------------- epoque 0 : tribu
    if (w0 > 0.002){
      for (let i = 0; i < 9; i++){                       // cendres refroidies
        const v  = 0.05 + al(3000 + i * 5) * 0.86;
        const s  = sc(v);
        const xs = al(3001 + i * 5) * W;
        const r  = (16 + al(3002 + i * 5) * 20) * U * s;
        for (let j = 0; j < 4; j++){
          const k = 1 - j * 0.20;
          c.beginPath();
          c.ellipse(xs, yv(v), r * k, r * k * 0.32, 0, 0, TAU);
          c.fillStyle = K(mx(du, [222, 218, 210], 0.55), 0.09 * w0);
          c.fill();
        }
        for (let j = 0; j < 14; j++){                    // charbons
          const a  = al(3003 + i * 5 + j * 7) * TAU;
          const rr = r * (0.2 + al(3004 + i * 5 + j * 7) * 0.9);
          const cx = xs + Math.cos(a) * rr, cy = yv(v) + Math.sin(a) * rr * 0.34;
          const cs = (0.7 + al(3000 + j * 11) * 1.5) * U * s;
          c.beginPath();
          c.moveTo(cx - cs, cy);
          c.lineTo(cx - cs * 0.2, cy - cs * 0.8);
          c.lineTo(cx + cs, cy - cs * 0.15);
          c.lineTo(cx + cs * 0.3, cy + cs * 0.6);
          c.closePath();
          c.fillStyle = K([26, 22, 20], 0.72 * w0);
          c.fill();
        }
      }
    }

    // -------------------------------------------------- epoque 1 : antiquite
    if (w1 > 0.002){
      for (let i = 0; i < 22; i++){
        const v  = 0.03 + al(4000 + i * 6) * 0.85;
        const s  = sc(v);
        const xs = al(4001 + i * 6) * W * 1.1 - W * 0.05;
        const gx = gxOf(xs, v);
        const lw = (26 + al(4002 + i * 6) * 26) * U;
        const lh = (12 + al(4003 + i * 6) * 10) * U;
        const sk = (al(4004 + i * 6) - 0.5) * lw * 0.22;
        const v0 = Math.max(0, v - lh * s / D), v1 = v + lh * s / D;
        const s0 = sc(v0), s1 = sc(v1);
        const y0 = yv(v0), y1 = yv(v1);
        const c0 = xAt(gx, v0) + sk, c1 = xAt(gx, v1);
        const h0 = lw * 0.5 * s0, h1 = lw * 0.5 * s1;
        c.beginPath();
        c.moveTo(c0 - h0, y0); c.lineTo(c0 + h0, y0);
        c.lineTo(c1 + h1, y1); c.lineTo(c1 - h1, y1);
        c.closePath();
        c.fillStyle = K(mx(du, [236, 228, 206], 0.35 + al(4005 + i * 6) * 0.3), 0.92 * w1);
        c.fill();
        c.beginPath();                                   // arete gauche a l'ombre
        c.moveTo(c0 - h0, y0); c.lineTo(c0 - h0 + h0 * 0.24, y0);
        c.lineTo(c1 - h1 + h1 * 0.24, y1); c.lineTo(c1 - h1, y1);
        c.closePath();
        c.fillStyle = K(mx(du, [0, 0, 0], 0.32), 0.5 * w1);
        c.fill();
        c.beginPath();                                   // fissure
        const fx = c1 + (al(4002 + i * 6) - 0.5) * h1 * 1.2;
        c.moveTo(fx, y1);
        c.lineTo(fx + (al(4003 + i * 6) - 0.5) * h1 * 0.7, (y0 + y1) * 0.5);
        c.lineTo(c0 + (al(4004 + i * 6) - 0.5) * h0 * 1.3, y0);
        c.lineWidth = Math.max(0.5, U * s * 0.35);
        c.strokeStyle = K(mx(du, [0, 0, 0], 0.5), 0.55 * w1);
        c.stroke();
      }
    }

    // ------------------------------------------------- epoque 2 : moyen age
    if (w2 > 0.002){
      for (let i = 0; i < 16; i++){                      // plaques de boue
        const v  = 0.04 + al(5000 + i * 5) * 0.84;
        const s  = sc(v);
        const xs = al(5001 + i * 5) * W;
        const r  = (12 + al(5002 + i * 5) * 26) * U * s;
        c.beginPath();
        for (let j = 0; j < 11; j++){
          const a  = j / 11 * TAU;
          const rr = r * (0.55 + al(5003 + i * 5 + j * 3) * 0.75);
          const px = xs + Math.cos(a) * rr, py = yv(v) + Math.sin(a) * rr * 0.34;
          if (j) c.lineTo(px, py); else c.moveTo(px, py);
        }
        c.closePath();
        c.fillStyle = K(mx(so, [0, 0, 0], 0.30), 0.78 * w2);
        c.fill();
        c.beginPath();                                   // reflet mouille en bas
        c.ellipse(xs + r * 0.12, yv(v) + r * 0.10, r * 0.55, r * 0.14, 0, 0, TAU);
        c.fillStyle = K(mx(so, [150, 168, 196], 0.55), (0.16 + 0.30 * day) * w2);
        c.fill();
      }
      for (let i = 0; i < 2; i++){                       // ornieres dans la bande
        const off = (i ? 1 : -1) * W * 0.16;
        const gxr = gxOf(vpX + off, vB);
        c.beginPath();
        let first = true;
        for (let j = 0; j <= 12; j++){
          const v = vA - vMg * 0.4 + (vB - vA + vMg * 0.8) * (j / 12);
          const s = sc(v);
          const x = xAt(gxr, v) + Math.sin(v * 9 + i * 2.1) * U * s * 3;
          const w = 7 * U * s;
          if (first){ c.moveTo(x - w, yv(v)); first = false; } else c.lineTo(x - w, yv(v));
        }
        for (let j = 12; j >= 0; j--){
          const v = vA - vMg * 0.4 + (vB - vA + vMg * 0.8) * (j / 12);
          const s = sc(v);
          const x = xAt(gxr, v) + Math.sin(v * 9 + i * 2.1) * U * s * 3;
          c.lineTo(x + 7 * U * s, yv(v));
        }
        c.closePath();
        c.fillStyle = K(mx(so, [0, 0, 0], 0.42), 0.60 * w2);
        c.fill();
      }
      for (let i = 0; i < 26; i++){                      // empreintes de sabots
        const v  = vA - vMg + al(5200 + i * 4) * (vB - vA + vMg * 2);
        const s  = sc(v);
        const xs = al(5201 + i * 4) * W;
        const r  = (2.4 + al(5202 + i * 4) * 1.8) * U * s;
        for (let j = 0; j < 2; j++){
          c.beginPath();
          c.ellipse(xs + (j ? r * 0.7 : -r * 0.7), yv(v), r * 0.6, r * 0.9, 0.2 - j * 0.4, 0, TAU);
          c.fillStyle = K(mx(so, [0, 0, 0], 0.45), 0.5 * w2);
          c.fill();
        }
      }
    }

    // -------------------------------------------------- epoque 3 : industrie
    if (w3 > 0.002){
      for (let i = 0; i < 14; i++){                      // trainees de suie
        const v  = 0.03 + al(6000 + i * 4) * 0.86;
        const s  = sc(v);
        const xs = al(6001 + i * 4) * W;
        const r  = (20 + al(6002 + i * 4) * 34) * U * s;
        for (let j = 0; j < 3; j++){
          c.beginPath();
          c.ellipse(xs, yv(v), r * (1 - j * 0.22), r * (1 - j * 0.22) * 0.24, 0, 0, TAU);
          c.fillStyle = K([22, 20, 20], 0.10 * w3);
          c.fill();
        }
      }
      c.beginPath();                                     // machefer, un seul trace
      for (let i = 0; i < 420; i++){
        const v  = 0.02 + al(6100 + i * 3) * 0.86;
        const s  = sc(v);
        const xs = al(6101 + i * 3) * W;
        const r  = (0.9 + al(6102 + i * 3) * 2.2) * U * s;
        const y  = yv(v);
        c.moveTo(xs - r, y + r * 0.2);
        c.lineTo(xs - r * 0.3, y - r * 0.7);
        c.lineTo(xs + r, y - r * 0.1);
        c.lineTo(xs + r * 0.2, y + r * 0.5);
        c.closePath();
      }
      c.fillStyle = K([38, 34, 32], 0.80 * w3);
      c.fill();
      for (let i = 0; i < 9; i++){                       // flaques
        const v  = vA - vMg * 2 + al(6200 + i * 5) * (vB - vA + vMg * 4);
        const s  = sc(v);
        const xs = al(6201 + i * 5) * W;
        const r  = (16 + al(6202 + i * 5) * 26) * U * s;
        c.beginPath();
        for (let j = 0; j < 13; j++){
          const a  = j / 13 * TAU;
          const rr = r * (0.62 + al(6203 + i * 5 + j * 3) * 0.6);
          const px = xs + Math.cos(a) * rr, py = yv(v) + Math.sin(a) * rr * 0.30;
          if (j) c.lineTo(px, py); else c.moveTo(px, py);
        }
        c.closePath();
        c.fillStyle = K([26, 26, 28], 0.86 * w3);
        c.fill();
        c.save();
        c.clip();
        c.beginPath();                                   // ciel reflete, moitie haute
        c.ellipse(xs, yv(v) - r * 0.16, r * 1.1, r * 0.26, 0, 0, TAU);
        c.fillStyle = K([126, 146, 176], (0.14 + 0.46 * day) * w3);
        c.fill();
        for (let j = 0; j < 3; j++){                     // irisation d'huile
          c.beginPath();
          c.ellipse(xs + (al(6204 + i * 5 + j) - 0.5) * r, yv(v) + (j - 1) * r * 0.10,
                    r * (0.35 + j * 0.22), r * (0.10 + j * 0.05), 0, 0, TAU);
          c.fillStyle = K([j === 0 ? 190 : 90, j === 1 ? 190 : 110, j === 2 ? 200 : 130],
                          0.13 * w3 * (0.4 + 0.6 * day));
          c.fill();
        }
        c.restore();
        c.beginPath();                                   // levre claire au loin
        c.ellipse(xs, yv(v), r * 1.0, r * 0.30, 0, Math.PI, TAU);
        c.lineWidth = Math.max(0.5, U * s * 0.5);
        c.strokeStyle = K(mx(du, [255, 255, 255], 0.3), 0.34 * w3);
        c.stroke();
      }
    }

    // --------------------------------------------------- epoque 4 : moderne
    if (w4 > 0.002){
      let band = 0;                                      // bandes de tonte
      for (let v = 1.0; v > 0; band++){
        const s  = sc(v);
        const pv = (26 * U * s) / D;
        const v2 = Math.max(0, v - pv);
        if (band % 2 === 0){
          c.fillStyle = K(mx(gl, [255, 255, 255], 0.12), 0.10 * w4);
          c.fillRect(0, yv(v2), W, yv(v) - yv(v2) + 1);
        }
        v = v2;
        if (band > 90) break;
      }
      for (let e = 0; e < 2; e++){                       // bordures beton
        const v = e ? vB + 0.014 : vA - 0.014;
        const s = sc(v);
        const y = yv(v);
        const th = 3.4 * U * s, fh = 4.2 * U * s;
        c.fillStyle = K(mx(cp, [0, 0, 0], 0.30), 0.9 * w4);
        c.fillRect(0, y, W, fh);
        c.fillStyle = K(mx(cp, [255, 255, 255], 0.18), 0.95 * w4);
        c.fillRect(0, y - th, W, th);
        const pas = 30 * U * s;
        for (let x = (al(7000) * pas); x < W; x += pas){  // joints
          c.fillStyle = K(mx(cp, [0, 0, 0], 0.5), 0.6 * w4);
          c.fillRect(x, y - th, Math.max(0.6, U * s * 0.3), th + fh);
        }
      }
      for (let i = 0; i < 3; i++){                       // plaques d'egout
        const v  = [0.24, 0.80, 0.34][i];
        const s  = sc(v);
        const xs = [W * 0.22, W * 0.68, W * 0.86][i];
        const y  = yv(v);
        const rx = 20 * U * s, ry = rx * 0.34;
        c.beginPath(); c.ellipse(xs, y + ry * 0.16, rx * 1.04, ry * 1.04, 0, 0, TAU);
        c.fillStyle = K([0, 0, 0], 0.28 * w4); c.fill();
        c.beginPath(); c.ellipse(xs, y, rx, ry, 0, 0, TAU);
        c.fillStyle = K(mx(cp, [0, 0, 0], 0.42), 0.95 * w4); c.fill();
        c.beginPath(); c.ellipse(xs, y - ry * 0.10, rx * 0.86, ry * 0.86, 0, 0, TAU);
        c.fillStyle = K(mx(cp, [0, 0, 0], 0.24), 0.95 * w4); c.fill();
        for (let j = 0; j < 16; j++){                    // gaufrage
          const a = j / 16 * TAU;
          c.beginPath();
          c.ellipse(xs + Math.cos(a) * rx * 0.5, y - ry * 0.10 + Math.sin(a) * ry * 0.5,
                    rx * 0.16, ry * 0.20, 0, 0, TAU);
          c.fillStyle = K(mx(cp, [255, 255, 255], 0.10), 0.5 * w4);
          c.fill();
        }
        c.beginPath();
        c.ellipse(xs, y - ry * 0.10, rx * 0.18, ry * 0.22, 0, 0, TAU);
        c.fillStyle = K([0, 0, 0], 0.6 * w4); c.fill();
      }
    }

    // --------------------------------------------- epoque 5 : cite lumineuse
    const glowCells = [];
    if (w5 > 0.002){
      const tp = 30 * U;
      const rows = [];
      for (let v = 1.06; v > -0.01 && rows.length < 70; ) { rows.push(v); v -= tp * sc(v) / D; }
      const cols = [];
      for (let gx = -W * 0.25; gx < W * 1.25; gx += tp) cols.push(gx);
      for (let r = rows.length - 1; r > 0; r--){
        const vF = rows[r], vN = rows[r - 1];
        const sF = sc(vF), sN = sc(vN);
        const yF = yv(vF), yN = yv(vN);
        for (let j = 0; j < cols.length - 1; j++){
          const seed = 8000 + r * 37 + j * 5;
          const a0 = xAt(cols[j], vF), a1 = xAt(cols[j + 1], vF);
          const b0 = xAt(cols[j], vN), b1 = xAt(cols[j + 1], vN);
          if (Math.max(b0, a0) > W || Math.min(b1, a1) < 0) continue;
          c.beginPath();
          c.moveTo(a0, yF); c.lineTo(a1, yF); c.lineTo(b1, yN); c.lineTo(b0, yN);
          c.closePath();
          const q = al(seed);
          c.fillStyle = K(mx(cp, q > 0.82 ? [40, 46, 54] : gl, q * 0.22), 0.94 * w5);
          c.fill();
          if (q > 0.90) glowCells.push(a0, a1, b0, b1, yF, yN);
          if (sN > 0.4 && al(seed + 1) > 0.86){          // eclat sur la dalle
            c.beginPath();
            c.moveTo(a0, yF); c.lineTo(lrp(a0, a1, 0.4), yF);
            c.lineTo(lrp(b0, b1, 0.22), yN); c.lineTo(b0, yN);
            c.closePath();
            c.fillStyle = K(mx(cp, [255, 255, 255], 0.3), 0.10 * w5);
            c.fill();
          }
          if (al(seed + 2) > 0.80){                      // mousse dans le joint
            const mr = (3 + al(seed + 3) * 5) * U * sN;
            const mxp = lrp(b0, b1, al(seed + 4));
            for (let k2 = 0; k2 < 5; k2++){
              c.beginPath();
              c.ellipse(mxp + (al(seed + 5 + k2) - 0.5) * mr * 2.2,
                        yN + (al(seed + 9 + k2) - 0.5) * mr * 0.5,
                        mr * (0.4 + al(seed + 13 + k2) * 0.5), mr * 0.30, 0, 0, TAU);
              c.fillStyle = K([28, 84, 70], 0.62 * w5);
              c.fill();
            }
          }
        }
      }
      // rainures : seul l'artificiel s'ecrit en additif
      c.save();
      c.globalCompositeOperation = "lighter";
      const gi = (0.30 + 0.70 * nt) * w5;
      for (let r = 0; r < rows.length; r++){
        const v = rows[r];
        if (v < 0 || v > 1) continue;
        const s = sc(v);
        c.fillStyle = "rgba(70,190,220," + (0.34 * gi * (0.4 + 0.6 * s)).toFixed(3) + ")";
        c.fillRect(0, yv(v), W, Math.max(0.6, U * s * 0.30));
        c.fillStyle = "rgba(30,110,150," + (0.20 * gi * (0.4 + 0.6 * s)).toFixed(3) + ")";
        c.fillRect(0, yv(v) - U * s * 0.5, W, Math.max(1, U * s * 1.4));
      }
      for (let j = 0; j < cols.length; j++){
        const xTop = xAt(cols[j], 0), xBot = xAt(cols[j], 1);
        c.beginPath();
        c.moveTo(xTop, solY); c.lineTo(xBot, Hh);
        c.lineWidth = Math.max(0.6, U * 0.34);
        c.strokeStyle = "rgba(70,190,220," + (0.28 * gi).toFixed(3) + ")";
        c.stroke();
      }
      for (let i = 0; i < glowCells.length; i += 6){     // dalles allumees
        c.beginPath();
        c.moveTo(glowCells[i], glowCells[i + 4]); c.lineTo(glowCells[i + 1], glowCells[i + 4]);
        c.lineTo(glowCells[i + 3], glowCells[i + 5]); c.lineTo(glowCells[i + 2], glowCells[i + 5]);
        c.closePath();
        c.fillStyle = "rgba(40,140,180," + (0.16 * gi).toFixed(3) + ")";
        c.fill();
      }
      c.restore();
    }

    // ------------------------------------------------------------- cailloux
    if (pG > 0.005){
      for (let i = 0; i < 200; i++){
        if (al(9000 + i * 9) > pG) continue;
        const v  = 0.02 + al(9001 + i * 9) * 0.86;
        const s  = sc(v);
        const xs = al(9002 + i * 9) * W;
        const y  = yv(v);
        const r  = (2.6 + al(9003 + i * 9) * 5.4) * U * s;
        c.beginPath();                                   // ombre portee vers la gauche
        c.ellipse(xs - r * 0.55, y + r * 0.16, r * 1.3, r * 0.42, 0, 0, TAU);
        c.fillStyle = K(mx(so, [0, 0, 0], 0.55), 0.34);
        c.fill();
        const n = 6 + ((al(9004 + i * 9) * 3) | 0);
        c.beginPath();
        for (let j = 0; j < n; j++){
          const a  = j / n * TAU;
          const rr = r * (0.68 + al(9005 + i * 9 + j * 3) * 0.5);
          const px = xs + Math.cos(a) * rr, py = y - r * 0.34 + Math.sin(a) * rr * 0.70;
          if (j) c.lineTo(px, py); else c.moveTo(px, py);
        }
        c.closePath();
        const base = mx(du, so, 0.35 + al(9006 + i * 9) * 0.4);
        c.fillStyle = K(mx(base, [0, 0, 0], 0.30), 0.96);
        c.fill();
        c.beginPath();                                   // facette eclairee haut-droite
        for (let j = 0; j < n; j++){
          const a  = j / n * TAU;
          const rr = r * (0.68 + al(9005 + i * 9 + j * 3) * 0.5) * 0.62;
          const px = xs + r * 0.16 + Math.cos(a) * rr;
          const py = y - r * 0.52 + Math.sin(a) * rr * 0.66;
          if (j) c.lineTo(px, py); else c.moveTo(px, py);
        }
        c.closePath();
        c.fillStyle = K(mx(base, [255, 255, 255], 0.22), 0.9);
        c.fill();
      }
    }

    // --------------------------------------------------------------- herbe
    const bX = [], bY = [], bL = [], bH = [], bB = [], bT = [];
    const fX = [], fY = [], fR = [], fC = [];
    const blade = (x, y, len, hw, bend) => {
      const tx = x + bend, ty = y - len;
      const cx = x + bend * 0.30, cy = y - len * 0.58;
      c.moveTo(x - hw, y);
      c.quadraticCurveTo(cx - hw * 0.6, cy, tx, ty);
      c.quadraticCurveTo(cx + hw * 0.6, cy, x + hw, y);
      c.closePath();
    };
    const bladeTip = (x, y, len, hw, bend) => {
      const bx = x + bend * 0.24, by = y - len * 0.46;
      const tx = x + bend, ty = y - len;
      const cx = x + bend * 0.58, cy = y - len * 0.80;
      c.moveTo(bx - hw * 0.52, by);
      c.quadraticCurveTo(cx - hw * 0.3, cy, tx, ty);
      c.quadraticCurveTo(cx + hw * 0.3, cy, bx + hw * 0.52, by);
      c.closePath();
    };

    // Le pas des rangees et le nombre de candidats ne dependent pas de l'epoque :
    // seule l'acceptation change, sinon chaque brin sauterait d'un monde a l'autre.
    let idx = 20000;
    for (let v = 0.004; v < vStrat; v += 0.009 + 0.040 * sc(v)){
      const s  = sc(v);
      const y  = yv(v);
      const nC = Math.round(cl(W / (2.6 * U * s), 8, 150));
      const op = openv(v);
      if (op > 0.004){
        const len0 = 12.5 * U * lG * s * (0.45 + 0.55 * op);
        const hw0  = Math.max(0.32, 0.95 * U * s);
        const dark = mx(gd, [0, 0, 0], 0.16 + 0.34 * (1 - s));
        const midc = mx(dark, gl, 0.34 + 0.30 * s);
        const lite = mx(gl, gd, 0.42 * (1 - s));
        let nb = 0;
        for (let i = 0; i < nC; i++){
          const kk = idx + i * 4;
          if (al(kk) > dG * op * 1.02) continue;
          const xs  = ((i + al(kk + 1) * 0.94) / nC) * W * 1.04 - W * 0.02;
          const sub = al(kk + 2) < 0.32 * wG ? 3 : 1;    // touffe ou brin isole
          for (let j = 0; j < sub; j++){
            const q  = al(kk + 3 + j * 7);
            const q2 = al(kk + 5 + j * 7);
            const ln = len0 * (1 - 0.5 * wG + wG * q * 1.0 + 0.1);
            const gust = Math.sin(t * 0.72 - xs / W * 4.2 + v * 1.7)
                       + 0.45 * Math.sin(t * 0.31 + q * 6.28);
            const bd = ln * ((q2 - 0.5) * 0.62 * wG + 0.13 * gust * (0.4 + 0.6 * wG));
            const px = xs + (j - (sub - 1) * 0.5) * hw0 * 2.4 * (0.5 + q2);
            bX[nb] = px; bY[nb] = y + (q - 0.5) * hw0 * 1.2;
            bL[nb] = ln; bH[nb] = hw0 * (0.7 + q2 * 0.6); bB[nb] = bd;
            bT[nb] = q2 < 0.40 ? 0 : (q2 < 0.80 ? 1 : 2);
            nb++;
          }
          if (al(kk + 2) < fG * 0.14 * op && s > 0.26){  // fleur au bout d'une tige
            const q3 = al(kk + 1);
            fX.push(xs + len0 * 0.16 * (q3 - 0.5) * 2);
            fY.push(y - len0 * (0.85 + q3 * 0.5));
            fR.push(Math.max(0.7, 1.5 * U * s * (0.7 + q3 * 0.8)));
            fC.push(q3 < 0.4 ? flA : (q3 < 0.75 ? flB : flC));
          }
        }
        for (let pass = 0; pass < 3; pass++){
          c.beginPath();
          let any = false;
          for (let i = 0; i < nb; i++){
            if (bT[i] !== pass) continue;
            blade(bX[i], bY[i], bL[i], bH[i], bB[i]);
            any = true;
          }
          if (any){
            c.fillStyle = K(pass === 0 ? dark : (pass === 1 ? midc : lite));
            c.fill();
          }
        }
        if (s > 0.30 && nb){                             // pointes eclairees
          c.beginPath();
          for (let i = 0; i < nb; i++) bladeTip(bX[i], bY[i], bL[i], bH[i], bB[i]);
          c.fillStyle = K(mx(lite, [255, 255, 255], 0.18), 0.5);
          c.fill();
        }
        if (fX.length){
          for (let i = 0; i < fX.length; i++){
            const r = fR[i];
            for (let j = 0; j < 5; j++){
              const a = j / 5 * TAU + fX[i] * 0.01;
              c.beginPath();
              c.arc(fX[i] + Math.cos(a) * r * 0.9, fY[i] + Math.sin(a) * r * 0.9, r * 0.62, 0, TAU);
              c.fillStyle = K(fC[i], 0.95);
              c.fill();
            }
            c.beginPath();
            c.arc(fX[i], fY[i], r * 0.5, 0, TAU);
            c.fillStyle = K(mx(fC[i], [180, 140, 40], 0.6), 0.95);
            c.fill();
          }
          fX.length = 0; fY.length = 0; fR.length = 0; fC.length = 0;
        }
      }
      idx += nC * 4 + 3;
    }

    // ------------------------------------------------ strate de terre du bas
    const yS = yv(vStrat);
    const hS = Hh - yS;
    const turf = (x) => yS
      + Math.sin(x / W * 6.4 + al(12000) * 6.28) * hS * 0.13
      + Math.sin(x / W * 15.7 + al(12001) * 6.28) * hS * 0.07
      + Math.sin(x / W * 37.0 + al(12002) * 6.28) * hS * 0.03;

    c.save();
    c.beginPath();
    c.moveTo(0, Hh + 2);
    c.lineTo(0, turf(0));
    const pasx = Math.max(2, W / 160);
    for (let x = pasx; x <= W; x += pasx) c.lineTo(x, turf(x));
    c.lineTo(W, turf(W));
    c.lineTo(W, Hh + 2);
    c.closePath();
    const gS = c.createLinearGradient(0, yS, 0, Hh);
    gS.addColorStop(0, K(mx(so, [0, 0, 0], 0.52)));
    gS.addColorStop(0.35, K(mx(so, [0, 0, 0], 0.28)));
    gS.addColorStop(1, K(mx(so, [0, 0, 0], 0.46)));
    c.fillStyle = gS;
    c.fill();
    c.clip();

    c.beginPath();                                       // couche de surface
    c.moveTo(0, turf(0));
    for (let x = pasx; x <= W; x += pasx) c.lineTo(x, turf(x));
    c.lineWidth = Math.max(1, hS * NP(cpH) * 2);
    c.strokeStyle = K(mx(cp, [0, 0, 0], 0.15), 0.95);
    c.stroke();
    c.lineWidth = Math.max(0.6, hS * 0.035);
    c.strokeStyle = K(mx(cp, [255, 255, 255], 0.25), 0.7);
    c.stroke();

    for (let i = 0; i < 22; i++){                        // radicelles
      const x0 = al(12100 + i * 6) * W;
      const y0 = turf(x0) + hS * 0.12;
      const dx = (al(12101 + i * 6) - 0.5) * hS * 1.2;
      const dy = hS * (0.30 + al(12102 + i * 6) * 0.62);
      c.beginPath();
      c.moveTo(x0, y0);
      c.quadraticCurveTo(x0 + dx * 0.4, y0 + dy * 0.5, x0 + dx, y0 + dy);
      c.moveTo(x0 + dx * 0.5, y0 + dy * 0.55);
      c.quadraticCurveTo(x0 + dx * 0.2, y0 + dy * 0.8, x0 - dx * 0.5, y0 + dy * 0.9);
      c.lineWidth = Math.max(0.5, U * 0.34);
      c.strokeStyle = K(mx(so, [230, 220, 190], 0.35), 0.5);
      c.stroke();
    }
    for (let i = 0; i < 26; i++){                        // pierres enfouies
      const x0 = al(12200 + i * 5) * W;
      const y0 = turf(x0) + hS * (0.20 + al(12201 + i * 5) * 0.7);
      const r  = (1.6 + al(12202 + i * 5) * 4) * U;
      c.beginPath();
      for (let j = 0; j < 7; j++){
        const a  = j / 7 * TAU;
        const rr = r * (0.65 + al(12203 + i * 5 + j * 3) * 0.55);
        const px = x0 + Math.cos(a) * rr, py = y0 + Math.sin(a) * rr * 0.8;
        if (j) c.lineTo(px, py); else c.moveTo(px, py);
      }
      c.closePath();
      c.fillStyle = K(mx(du, so, 0.5), 0.75);
      c.fill();
      c.beginPath();
      c.ellipse(x0 + r * 0.2, y0 - r * 0.3, r * 0.4, r * 0.26, 0, 0, TAU);
      c.fillStyle = K(mx(du, [255, 255, 255], 0.3), 0.5);
      c.fill();
    }
    for (let i = 0; i < 620; i++){                       // grain
      const x0 = al(12400 + i * 3) * W;
      const y0 = turf(x0) + hS * (0.06 + al(12401 + i * 3) * 0.94);
      const r  = (0.25 + al(12402 + i * 3) * 0.9) * U;
      c.fillStyle = al(12402 + i * 3) > 0.5
        ? K(mx(so, [255, 245, 220], 0.30), 0.30)
        : K(mx(so, [0, 0, 0], 0.55), 0.34);
      c.fillRect(x0, y0, r * 1.6, r);
    }
    c.restore();

    // frange d'herbe posee sur la coupe : les brins les plus grands de l'image
    const nF = Math.round(cl(W / (1.7 * U), 24, 460));
    const dkF = mx(gd, [0, 0, 0], 0.22);
    const mdF = mx(dkF, gl, 0.46);
    const ltF = gl;
    const fb = [[], [], []];
    for (let i = 0; i < nF; i++){
      const kk = 14000 + i * 6;
      if (al(kk) > Math.min(1, dG * 1.25)) continue;
      const xs = ((i + al(kk + 1) * 0.9) / nF) * W * 1.04 - W * 0.02;
      const y  = turf(xs) + hS * 0.05;
      const q  = al(kk + 2), q2 = al(kk + 3);
      const ln = 15.5 * U * lG * (1 - 0.5 * wG + wG * q * 1.1 + 0.12);
      const gust = Math.sin(t * 0.72 - xs / W * 4.2 + 1.6) + 0.45 * Math.sin(t * 0.31 + q * 6.28);
      const bd = ln * ((q2 - 0.5) * 0.62 * wG + 0.15 * gust * (0.4 + 0.6 * wG));
      fb[q2 < 0.40 ? 0 : (q2 < 0.80 ? 1 : 2)].push(xs, y, ln, Math.max(0.5, 1.15 * U * (0.7 + q2 * 0.6)), bd);
    }
    const gF = c.createLinearGradient(0, yS - 16 * U * lG, 0, yS + hS * 0.2);
    gF.addColorStop(0, K(mx(gd, [0, 0, 0], 0.5), 0));
    gF.addColorStop(1, K(mx(gd, [0, 0, 0], 0.5), 0.5));
    c.fillStyle = gF;
    c.fillRect(0, yS - 16 * U * lG, W, hS * 0.2 + 16 * U * lG);
    for (let p = 0; p < 3; p++){
      if (!fb[p].length) continue;
      c.beginPath();
      for (let i = 0; i < fb[p].length; i += 5) blade(fb[p][i], fb[p][i + 1], fb[p][i + 2], fb[p][i + 3], fb[p][i + 4]);
      c.fillStyle = K(p === 0 ? dkF : (p === 1 ? mdF : ltF));
      c.fill();
    }
    c.beginPath();
    for (let p = 0; p < 3; p++)
      for (let i = 0; i < fb[p].length; i += 5) bladeTip(fb[p][i], fb[p][i + 1], fb[p][i + 2], fb[p][i + 3], fb[p][i + 4]);
    c.fillStyle = K(mx(ltF, [255, 255, 255], 0.22), 0.5);
    c.fill();

    if (w5 > 0.002){                                     // spores sur la frange
      c.save();
      c.globalCompositeOperation = "lighter";
      const gi = (0.35 + 0.65 * nt) * w5;
      for (let i = 0; i < 40; i++){
        const xs = al(15000 + i * 3) * W;
        const r  = (1 + al(15001 + i * 3) * 2.6) * U;
        const y  = turf(xs) - al(15002 + i * 3) * 13 * U;
        c.beginPath(); c.arc(xs, y, r, 0, TAU);
        c.fillStyle = "rgba(90,230,190," + (0.30 * gi).toFixed(3) + ")";
        c.fill();
        c.beginPath(); c.arc(xs, y, r * 2.6, 0, TAU);
        c.fillStyle = "rgba(40,150,140," + (0.10 * gi).toFixed(3) + ")";
        c.fill();
      }
      c.restore();
    }

    c.restore();
  }

  /* La voie du village : une seule bande, six états, tout interpolé.
     Repère écran, lumière du jour venant du haut-droite, ombres en bas-gauche. */
  /* La voie du village : un plan au sol vu presque a ras, six epoques.
     Tout part d'un horizon virtuel place au-dessus de la bande : c'est lui qui
     donne le raccourci, la fuite des joints et l'ecrasement de ce qui est pose. */
  function paysageRoute(c, W, Hh, solY, ee, nuit, t, E, om, al){
    const y0 = solY + (Hh - solY) * 0.42;
    const y1 = solY + (Hh - solY) * 0.74;
    const H  = y1 - y0;
    if (!(H > 0) || !(W > 0)) return;

    const TAU = 6.283185307179586;
    const e   = Math.max(0, Math.min(5, ee));
    const A   = Math.min(4, Math.floor(e)), B = A + 1, u = e - A;
    const N   = Math.max(0, Math.min(1, nuit));

    const cl  = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
    const mx  = (a) => a[A] + (a[B] - a[A]) * u;
    const mc  = (a) => [a[A][0] + (a[B][0] - a[A][0]) * u,
                        a[A][1] + (a[B][1] - a[A][1]) * u,
                        a[A][2] + (a[B][2] - a[A][2]) * u];
    const w6  = (k) => (A === k ? 1 - u : 0) + (B === k ? u : 0);
    const mel = (p, q, k) => [p[0] + (q[0] - p[0]) * k,
                              p[1] + (q[1] - p[1]) * k,
                              p[2] + (q[2] - p[2]) * k];
    const K   = (col, a) => om(Math.max(0, Math.min(255, col[0] | 0)),
                               Math.max(0, Math.min(255, col[1] | 0)),
                               Math.max(0, Math.min(255, col[2] | 0)), cl(a));

    /* ---- projection ----
       q = echelle laterale (1 au bord proche), d = 1/q la profondeur. Un pave du
       fond fait donc 1/3 de large et 1/9 de haut : le plan se couche tout seul. */
    const HOR  = 0.50;
    const yHor = y0 - H * HOR;
    const CD   = y1 - yHor;
    const DF   = CD / (y0 - yHor);
    const FLAT = 0.40;                       // ecrasement d'un disque au bord proche
    const KX   = CD / FLAT;
    const yOf  = (d) => yHor + CD / d;
    const qOf  = (y) => (y - yHor) / CD;
    const pxOf = (X, q) => W * 0.5 + X * q * KX;
    const Xmx  = (q) => (W * 0.58) / (q * KX);
    const hair = Math.max(0.6 * E, H * 0.006);

    // ---- perspective atmospherique : desaturer, puis filer vers l'horizon ----
    const HZM  = 0.52;
    const hzOf = (d) => Math.pow(cl((d - 1) / (DF - 1)), 0.60) * HZM;

    /* ---- tables d'epoque ----
       0 terre battue, 1 voie dallee, 2 paves irreguliers, 3 paves + caniveau,
       4 bitume, 5 dalle a rainures */
    const BED = [[126, 99, 64], [120, 112, 96], [ 66, 54, 40], [ 62, 60, 60], [ 48, 48, 52], [126, 134, 146]];
    const STC = [[130, 104, 68], [198, 190, 164], [116, 108, 94], [128, 128, 128], [ 56, 56, 60], [204, 212, 224]];
    const JOI = [[108, 84, 54], [150, 142, 120], [ 54, 46, 36], [ 50, 48, 48], [ 44, 44, 48], [148, 158, 174]];
    const HZC = [[178, 160, 126], [200, 192, 168], [152, 148, 138], [150, 150, 152], [166, 170, 178], [196, 208, 222]];
    const SZK = [1.00, 1.55, 0.78, 0.95, 1.00, 2.10];   // taille de pierre
    const IRR = [0.00, 0.10, 0.62, 0.16, 0.00, 0.02];   // irregularite des contours
    const JOK = [0.00, 0.075, 0.21, 0.115, 0.00, 0.050];// joint, en fraction de pave
    const VAR = [0.00, 0.16, 0.32, 0.20, 0.00, 0.07];   // teinte d'une pierre a l'autre
    const REL = [0.00, 0.58, 1.00, 0.74, 0.00, 0.28];   // force du biseau
    const DEN = [0.00, 1.00, 1.00, 1.00, 0.00, 1.00];   // presence du pavage
    const GRA = [0.75, 0.20, 0.55, 0.26, 1.00, 0.08];   // grain de surface
    const WET = [0.05, 0.06, 0.90, 0.26, 0.16, 0.10];   // humidite

    const bedC = mc(BED), stC = mc(STC), joC = mc(JOI), hzC = mc(HZC);
    const szk = mx(SZK), irr = mx(IRR), jok = mx(JOK), vaR = mx(VAR);
    const rel0 = mx(REL), den = mx(DEN), gra = mx(GRA), wet = mx(WET);

    const loin = (col, hz) => {
      const g = col[0] * 0.30 + col[1] * 0.59 + col[2] * 0.11;
      return mel(mel(col, [g, g, g], hz * 0.45), hzC, hz);
    };

    // ---- nappe : une bande couchee entre deux profondeurs, bords ondulants ----
    const nappe = (dLo, dHi, seed, ondu) => {
      const pas = W / 44;
      const yA = yOf(dLo), yB = yOf(dHi), qA = 1 / dLo, qB = 1 / dHi;
      c.beginPath();
      for (let x = -pas; x <= W + pas; x += pas){
        const w = Math.sin(x / W * 7.7 + seed) * 0.62 + Math.sin(x / W * 19.3 + seed * 2.3) * 0.38;
        const yy = yA + w * ondu * qA;
        if (x < 0) c.moveTo(x, yy); else c.lineTo(x, yy);
      }
      for (let x = W + pas; x >= -pas; x -= pas){
        const w = Math.sin(x / W * 8.9 + seed * 1.7) * 0.62 + Math.sin(x / W * 21.1 + seed * 3.1) * 0.38;
        c.lineTo(x, yB + w * ondu * qB);
      }
      c.closePath();
    };
    const nappeF = (dLo, dHi, seed, ondu, col, a) => {
      nappe(dLo, dHi, seed, ondu); c.fillStyle = K(col, a); c.fill();
    };

    // tout ce qui est pose au sol est une ellipse, jamais un cercle
    const posee = (x, y, rx, sq) => {
      const ry = Math.max(0.25, rx * FLAT * qOf(y) * (sq === undefined ? 1 : sq));
      c.beginPath(); c.ellipse(x, y, Math.max(0.35, rx), ry, 0, 0, TAU);
    };

    c.save();
    c.beginPath(); c.rect(0, y0, W, H); c.clip();

    // ================= 1. le lit de la voie =================
    const gb = c.createLinearGradient(0, y0, 0, y1);
    for (let i = 0; i <= 8; i++){
      const s = i / 8, yy = y0 + H * s;
      gb.addColorStop(s, K(loin(bedC, hzOf(1 / qOf(yy))), 1));
    }
    c.fillStyle = gb; c.fillRect(0, y0, W, H);

    // ================= 2. ornieres (epoque 0), sous le pavage =================
    const wOrn = w6(0);
    if (wOrn > 0.004){
      for (let r = 0; r < 2; r++){
        const dC = r ? 2.06 : 1.36, wd = 0.20 * dC;
        const hz = hzOf(dC), sd = 3.1 + r * 2.4, on = H * 0.022;
        // creux : coeur sombre, levre eclairee cote proche, fond le plus noir
        nappeF(dC - wd * 0.5, dC + wd * 0.5, sd, on, mel(bedC, [22, 15, 9], 0.50), 0.88 * wOrn * (1 - hz * 0.5));
        nappeF(dC + wd * 0.18, dC + wd * 0.5, sd, on, mel(bedC, [14, 10, 6], 0.62), 0.55 * wOrn * (1 - hz * 0.6));
        nappeF(dC - wd * 0.62, dC - wd * 0.40, sd, on, mel(bedC, [255, 240, 208], 0.34), 0.50 * wOrn * (1 - hz * 0.8));
      }
      // bourrelet central entre les deux traces
      nappeF(1.56, 1.86, 8.4, H * 0.016, mel(bedC, [255, 238, 202], 0.20), 0.34 * wOrn);
    }

    // ================= 3. le pavage =================
    if (den > 0.02){
      let NR = Math.round(24 / Math.max(0.3, szk));
      NR = Math.max(7, Math.min(38, NR));
      const rowD = (DF - 1) / NR;
      const sw = rowD * 1.18;                        // pave un peu plus large que profond
      const minRow = Math.max(0.85 * E, H * 0.010);

      let kTop = -1;
      for (let k = 0; k < NR; k++){
        const dA = 1 + k * rowD;
        if (CD * rowD / (dA * (dA + rowD)) < minRow) break;
        kTop = k;
      }
      // au-dela les rangees ne font plus un pixel : une seule nappe tient le fond
      if (kTop < NR - 1){
        const dm = (1 + (kTop + 1) * rowD + DF) * 0.5, hz = hzOf(dm);
        c.fillStyle = K(loin(mel(joC, stC, 0.55), hz), den);
        c.fillRect(0, y0 - 1, W, yOf(1 + (kTop + 1) * rowD) - y0 + 1.5);
      }

      for (let k = kTop; k >= 0; k--){
        const dA = 1 + k * rowD, dB = dA + rowD;      // dA proche, dB lointain
        const yB = yOf(dA), yT = yOf(dB), rowH = yB - yT;
        const qT = 1 / dB, qM = 2 / (dA + dB);
        const hz = hzOf((dA + dB) * 0.5);
        const jw = jok * sw;

        // fond de joint : aucun interstice ne laisse voir le lit
        c.fillStyle = K(loin(joC, hz), den);
        c.fillRect(0, yT - 0.45, W, rowH + 0.9);

        const off = (k & 1 ? sw * 0.5 : 0) + irr * sw * (al(60000 + k) - 0.5) * 0.7;
        const XM = Xmx(qT) + sw;
        const k0 = Math.floor((-XM - off) / sw), k1 = Math.ceil((XM - off) / sw);
        const relK = rel0 * Math.pow(qM, 1.30);
        const bev = rowH >= 2.3 * E && relK > 0.05;
        const fx = 1 - 0.22 * relK, fy = 1 - 0.34 * relK;
        const lit = 0.40 * relK * (1 - hz * 0.78);
        const dLo = dA + rowD * jok * 0.5, dHi = dB - rowD * jok * 0.5;
        const ix = irr * sw * 0.22, id = irr * rowD * 0.22;

        for (let kk = k0; kk <= k1; kk++){
          const s0 = 70000 + k * 811 + (kk + 8192) * 17;
          const bx = kk * sw + off, X0 = bx + jw * 0.5, X1 = bx + sw - jw * 0.5;
          // quatre coins tires separement : les paves cessent d'etre un damier
          const dHa = dHi + (al(s0)     - 0.5) * id, dHb = dHi + (al(s0 + 1) - 0.5) * id;
          const dLc = dLo + (al(s0 + 2) - 0.5) * id, dLd = dLo + (al(s0 + 3) - 0.5) * id;
          const qa = 1 / dHa, qb = 1 / dHb, qc = 1 / dLc, qd = 1 / dLd;
          const xa = pxOf(X0 + (al(s0 + 4) - 0.5) * ix, qa), ya = yOf(dHa);
          const xb = pxOf(X1 + (al(s0 + 5) - 0.5) * ix, qb), yb = yOf(dHb);
          const xc = pxOf(X1 + (al(s0 + 6) - 0.5) * ix, qc), yc = yOf(dLc);
          const xd = pxOf(X0 + (al(s0 + 7) - 0.5) * ix, qd), yd = yOf(dLd);
          if ((xa < -3 && xb < -3 && xc < -3 && xd < -3) ||
              (xa > W + 3 && xb > W + 3 && xc > W + 3 && xd > W + 3)) continue;

          const v = (al(s0 + 8) - 0.5) * 2 * vaR;
          const body = loin([stC[0] * (1 + v * 0.95), stC[1] * (1 + v * 0.88), stC[2] * (1 + v * 0.80)], hz);

          if (!bev){
            c.beginPath(); c.moveTo(xa, ya); c.lineTo(xb, yb); c.lineTo(xc, yc); c.lineTo(xd, yd); c.closePath();
            c.fillStyle = K(body, den); c.fill();
            continue;
          }
          const cx = (xa + xb + xc + xd) * 0.25, cy = (ya + yb + yc + yd) * 0.25;
          const qax = cx + (xa - cx) * fx, qay = cy + (ya - cy) * fy;
          const qbx = cx + (xb - cx) * fx, qby = cy + (yb - cy) * fy;
          const qcx = cx + (xc - cx) * fx, qcy = cy + (yc - cy) * fy;
          const qdx = cx + (xd - cx) * fx, qdy = cy + (yd - cy) * fy;

          c.beginPath(); c.moveTo(xa, ya); c.lineTo(xb, yb); c.lineTo(xc, yc); c.lineTo(xd, yd); c.closePath();
          c.fillStyle = K(mel(body, [16, 13, 11], lit), den); c.fill();
          // lisere clair sur le haut et la droite, la lumiere vient de la
          c.beginPath(); c.moveTo(xa, ya); c.lineTo(xb, yb); c.lineTo(xc, yc);
          c.lineTo(qcx, qcy); c.lineTo(qbx, qby); c.lineTo(qax, qay); c.closePath();
          c.fillStyle = K(mel(body, [255, 248, 232], lit * 0.92), den); c.fill();
          c.beginPath(); c.moveTo(qax, qay); c.lineTo(qbx, qby); c.lineTo(qcx, qcy); c.lineTo(qdx, qdy); c.closePath();
          c.fillStyle = K(body, den); c.fill();
        }
      }
    }

    // ================= 4. bordures relevees (epoque 1) =================
    const wBor = w6(1);
    if (wBor > 0.004){
      const kerb = mel(stC, [236, 230, 206], 0.30);
      for (let s = 0; s < 2; s++){
        const dL = s ? 2.62 : 1.000, dH = s ? DF + 0.2 : 1.085;
        const hz = hzOf((dL + dH) * 0.5), on = H * 0.008;
        nappeF(dL, dH, 5.7 + s * 3.3, on, mel(kerb, [10, 8, 6], 0.26), 0.95 * wBor * (1 - hz * 0.4));
        nappeF(dL + (dH - dL) * 0.30, dH, 5.7 + s * 3.3, on, kerb, 0.95 * wBor * (1 - hz * 0.55));
        nappeF(dH - (dH - dL) * 0.16, dH, 5.7 + s * 3.3, on, mel(kerb, [255, 252, 238], 0.55), 0.7 * wBor * (1 - hz * 0.8));
      }
      // l'ombre de la bordure du fond glisse sur la chaussee, jamais vers le haut
      nappeF(2.30, 2.62, 9.1, H * 0.008, [20, 16, 12], 0.20 * wBor);
    }

    // ================= 5. boue et flaques (epoque 2) =================
    const wBou = w6(2);
    if (wBou > 0.004){
      for (let i = 0; i < 26; i++){
        const d = 1 + al(11000 + i * 5) * (DF - 1);
        const q = 1 / d, yy = yOf(d), hz = hzOf(d);
        const xx = pxOf((al(11001 + i * 5) - 0.5) * 2 * Xmx(q), q);
        const rx = H * (0.10 + al(11002 + i * 5) * 0.22) * q * 2.4;
        posee(xx, yy, rx, 1);
        c.fillStyle = K(loin(mel(bedC, [18, 13, 9], 0.42), hz), 0.52 * wBou);
        c.fill();
        posee(xx + rx * 0.16, yy - rx * FLAT * q * 0.34, rx * 0.62, 1);
        c.fillStyle = K(loin(mel(bedC, [40, 30, 20], 0.30), hz), 0.34 * wBou);
        c.fill();
      }
      for (let i = 0; i < 9; i++){
        const d = 1 + al(12000 + i * 4) * (DF - 1) * 0.92;
        const q = 1 / d, yy = yOf(d), hz = hzOf(d);
        const xx = pxOf((al(12001 + i * 4) - 0.5) * 2 * Xmx(q), q);
        const rx = H * (0.09 + al(12002 + i * 4) * 0.16) * q * 2.6;
        posee(xx, yy, rx, 1);
        c.fillStyle = K(loin([26, 24, 22], hz), 0.62 * wBou * wet); c.fill();
        // le ciel se couche dans la flaque : une trainee laterale, pas verticale
        posee(xx - rx * 0.10, yy - rx * FLAT * q * 0.30, rx * 0.74, 0.58);
        c.fillStyle = K(loin([150, 168, 192], hz), 0.34 * wBou * wet); c.fill();
        posee(xx, yy + rx * FLAT * q * 0.66, rx * 0.96, 0.30);
        c.fillStyle = K(loin(mel(bedC, [255, 246, 220], 0.42), hz), 0.26 * wBou); c.fill();
      }
    }

    // ================= 6. caniveau et plaque (epoque 3) =================
    const wCan = w6(3);
    if (wCan > 0.004){
      const dC = 1.145, wd = 0.055;
      const hz = hzOf(dC);
      nappeF(dC - wd, dC + wd, 4.4, H * 0.006, mel(joC, [10, 10, 12], 0.55), 0.92 * wCan);
      nappeF(dC + wd * 0.30, dC + wd, 4.4, H * 0.006, [8, 9, 11], 0.55 * wCan);
      nappeF(dC - wd * 1.55, dC - wd, 4.4, H * 0.006, mel(stC, [255, 250, 236], 0.45), 0.48 * wCan);
      // filet d'eau au fond du caniveau
      nappeF(dC - wd * 0.30, dC + wd * 0.35, 4.4, H * 0.006, [64, 86, 96], 0.34 * wCan * wet);

      for (let i = 0; i < 2; i++){
        const d = 1.30 + i * 0.62, q = 1 / d, yy = yOf(d), h2 = hzOf(d);
        const xx = pxOf((al(13000 + i) - 0.5) * 1.4 * Xmx(q), q);
        const rx = H * 0.19 * q * 2.4;
        posee(xx - rx * 0.22, yy + rx * FLAT * q * 0.22, rx * 1.12, 1);
        c.fillStyle = K([14, 12, 10], 0.26 * wCan); c.fill();
        posee(xx, yy, rx, 1); c.fillStyle = K(loin([84, 82, 80], h2), 0.95 * wCan); c.fill();
        posee(xx, yy, rx * 0.82, 1); c.fillStyle = K(loin([64, 62, 60], h2), 0.9 * wCan); c.fill();
        for (let j = 0; j < 7; j++){
          const fr = (j + 0.5) / 7;
          posee(xx, yy - rx * FLAT * q * (0.72 - fr * 1.44), rx * 0.78, 0.06);
          c.fillStyle = K(loin([116, 114, 110], h2), 0.5 * wCan); c.fill();
        }
        posee(xx, yy - rx * FLAT * q * 0.62, rx * 0.9, 0.10);
        c.fillStyle = K(loin([150, 148, 142], h2), 0.45 * wCan); c.fill();
      }
    }

    // ================= 7. bitume : marquage et usure (epoque 4) =================
    const wBit = w6(4);
    if (wBit > 0.004){
      for (let i = 0; i < 2; i++){                    // bandes polies par les roues
        const d = 1.26 + i * 0.66;
        nappeF(d - 0.16, d + 0.16, 6.2 + i * 2.1, H * 0.010,
               mel(bedC, [190, 192, 196], 0.34), 0.22 * wBit * (1 - hzOf(d) * 0.5));
      }
      for (let i = 0; i < 4; i++){                    // reprises d'enrobe
        const d = 1.08 + al(14000 + i) * (DF - 1.2);
        nappeF(d - 0.035, d + 0.035, 12.3 + i * 4.7, H * 0.014,
               mel(bedC, [16, 16, 18], 0.55), 0.55 * wBit * (1 - hzOf(d) * 0.6));
      }
      const paint = [236, 232, 216];
      const rail = (d, dl, dg, a) => {
        const q = 1 / d, yy = yOf(d), hz = hzOf(d);
        const th = Math.max(hair, 0.085 * CD * q * q);
        const XM = Xmx(q), per = dl + dg;
        const n = Math.ceil(XM / per) + 1;
        for (let i = -n; i <= n; i++){
          const xa = pxOf(i * per, q), xb = pxOf(i * per + dl, q);
          if (xb < -2 || xa > W + 2) continue;
          const wear = 0.55 + 0.45 * al(31000 + i * 3 + Math.round(d * 10));
          c.fillStyle = K(loin(paint, hz), a * wear * wBit * (1 - hz * 0.35));
          c.fillRect(xa, yy - th * 0.5, xb - xa, th);
        }
      };
      rail(1.50, 0.44, 0.36, 0.92);                   // marquage central
      rail(1.055, 9e3, 0, 0.55); rail(2.78, 9e3, 0, 0.5);
    }

    // ================= 8. rainures lumineuses (epoque 5) =================
    const wRai = w6(5);
    const RAIN = [1.172, 1.500, 2.083];
    if (wRai > 0.004){
      for (let i = 0; i < RAIN.length; i++){
        const d = RAIN[i], q = 1 / d, hz = hzOf(d);
        const wd = 0.05 * d;
        nappeF(d - wd, d + wd, 2.2 + i * 3.7, H * 0.003, mel(stC, [30, 46, 60], 0.55), 0.75 * wRai * (1 - hz * 0.4));
        nappeF(d - wd * 1.9, d - wd, 2.2 + i * 3.7, H * 0.003, mel(stC, [255, 255, 250], 0.40), 0.45 * wRai * (1 - hz * 0.7));
      }
    }

    // ================= 9. grain, gravillons, cailloux =================
    const nGr = Math.round(760 * (0.30 + gra));
    for (let i = 0; i < nGr; i++){
      const d = 1 + al(20000 + i * 3) * (DF - 1);
      const q = 1 / d, yy = yOf(d), hz = hzOf(d);
      const xx = pxOf((al(20001 + i * 3) - 0.5) * 2 * Xmx(q), q);
      const rx = Math.max(0.35, H * 0.011 * q * 2.4 * (0.5 + al(20002 + i * 3)));
      const up = al(20000 + i * 3) > 0.5;
      posee(xx, yy, rx, 1);
      c.fillStyle = K(loin(mel(bedC, up ? [246, 238, 218] : [16, 13, 10], 0.42), hz), (0.16 + 0.2 * gra) * (1 - hz * 0.55));
      c.fill();
    }
    const nCa = Math.round(140 * cl(w6(0) + w6(2) * 0.8 + w6(1) * 0.2));
    for (let i = 0; i < nCa; i++){
      const d = 1 + al(21000 + i * 3) * (DF - 1);
      const q = 1 / d, yy = yOf(d), hz = hzOf(d);
      const xx = pxOf((al(21001 + i * 3) - 0.5) * 2 * Xmx(q), q);
      const rx = H * 0.028 * q * 2.4 * (0.5 + al(21002 + i * 3));
      const li = cl(1 - hz * 0.85);
      posee(xx - rx * 0.30, yy + rx * FLAT * q * 0.30, rx * 1.05, 1);
      c.fillStyle = K([16, 13, 10], 0.20 * li); c.fill();      // contact au sol
      posee(xx, yy, rx, 1);
      c.fillStyle = K(loin(mel(bedC, [130, 122, 106], 0.55), hz), 0.72); c.fill();
      posee(xx + rx * 0.20, yy - rx * FLAT * q * 0.24, rx * 0.58, 1);
      c.fillStyle = K(loin([238, 232, 210], hz), 0.42 * li); c.fill();
    }

    // touffes d'herbe du sentier : basses et etalees, jamais dressees
    const wHer = cl(w6(0) + w6(2) * 0.35);
    if (wHer > 0.01){
      for (let i = 0; i < 34; i++){
        const d = 1 + al(22000 + i * 4) * (DF - 1);
        const q = 1 / d, yy = yOf(d), hz = hzOf(d);
        const xx = pxOf((al(22001 + i * 4) - 0.5) * 2 * Xmx(q), q);
        const rr = H * 0.05 * q * 2.4 * (0.6 + al(22002 + i * 4));
        c.strokeStyle = K(loin([98, 112, 58], hz), 0.5 * wHer);
        c.lineWidth = Math.max(hair * 0.8, rr * 0.09);
        c.beginPath();
        for (let j = 0; j < 5; j++){
          const a2 = (al(22003 + i * 4 + j * 7) - 0.5) * 2.2;
          c.moveTo(xx, yy);
          c.lineTo(xx + Math.sin(a2) * rr, yy - Math.abs(Math.cos(a2)) * rr * FLAT * q * 1.5);
        }
        c.stroke();
      }
    }

    // ================= 10. voile atmospherique, un seul etalonnage =================
    const gv = c.createLinearGradient(0, y0, 0, y1);
    for (let i = 0; i <= 6; i++){
      const s = i / 6, yy = y0 + H * s;
      gv.addColorStop(s, K(hzC, hzOf(1 / qOf(yy)) * 0.56));
    }
    c.fillStyle = gv; c.fillRect(0, y0, W, H);

    // ================= 11. lumieres =================
    if (N > 0.02 || wRai > 0.004){
      c.save();
      c.globalCompositeOperation = "lighter";
      if (wRai > 0.004){
        for (let i = 0; i < RAIN.length; i++){
          const d = RAIN[i], q = 1 / d, yy = yOf(d);
          const th = Math.max(hair, 0.045 * CD * q * q);
          const halo = th * 9;
          const gg = c.createLinearGradient(0, yy - halo, 0, yy + halo);
          const a = (0.16 + 0.5 * N) * wRai;
          gg.addColorStop(0, "rgba(90,190,235,0)");
          gg.addColorStop(0.5, "rgba(150,225,255," + (a * 0.85).toFixed(3) + ")");
          gg.addColorStop(1, "rgba(90,190,235,0)");
          c.fillStyle = gg; c.fillRect(0, yy - halo, W, halo * 2);
          c.fillStyle = "rgba(226,250,255," + ((0.30 + 0.6 * N) * wRai).toFixed(3) + ")";
          c.fillRect(0, yy - th * 0.5, W, th);
        }
      }
      // flaques de lumiere : des ellipses tres couchees, jamais des cones
      const wLum = cl(w6(3) * 0.7 + w6(4) + w6(5) * 0.8);
      if (N > 0.02 && wLum > 0.01){
        const teinte = w6(4) + w6(5) > 0.5 ? [214, 232, 255] : [255, 206, 132];
        for (let i = 0; i < 4; i++){
          const d = 1.12 + al(24000 + i * 2) * (DF - 1.3);
          const q = 1 / d, yy = yOf(d);
          const xx = pxOf((al(24001 + i * 2) - 0.5) * 1.9 * Xmx(q), q);
          const rx = H * 0.75 * q * 2.2;
          c.save();
          c.translate(xx, yy); c.scale(1, FLAT * q);
          const gp = c.createRadialGradient(0, 0, 0, 0, 0, Math.max(1, rx));
          const a = 0.30 * N * wLum;
          gp.addColorStop(0, "rgba(" + teinte[0] + "," + teinte[1] + "," + teinte[2] + "," + a.toFixed(3) + ")");
          gp.addColorStop(0.55, "rgba(" + teinte[0] + "," + teinte[1] + "," + teinte[2] + "," + (a * 0.32).toFixed(3) + ")");
          gp.addColorStop(1, "rgba(" + teinte[0] + "," + teinte[1] + "," + teinte[2] + ",0)");
          c.fillStyle = gp;
          c.beginPath(); c.arc(0, 0, Math.max(1, rx), 0, TAU); c.fill();
          c.restore();
        }
      }
      c.restore();
    }

    // ================= 12. mobilier plante sur le bord proche =================
    /* Seuls objets verticaux tolerés, et courts : a cette echelle la voie n'a de
       place que pour leur pied. */
    const MOB = [
      [[0.115, 0.62, 0], [0.355, 0.42, 1], [0.845, 0.55, 0]],
      [[0.140, 0.92, 2], [0.870, 0.70, 3]],
      [[0.105, 0.78, 0], [0.400, 0.44, 1], [0.865, 0.86, 4]],
      [[0.095, 0.72, 5], [0.885, 1.00, 4]],
      [[0.110, 0.62, 6], [0.890, 0.94, 7]],
      [[0.120, 1.00, 8], [0.885, 0.88, 8]]
    ];
    const CORPS = [[122, 96, 62], [138, 128, 106], [206, 198, 172], [190, 182, 156],
                   [76, 66, 54], [58, 58, 62], [180, 182, 186], [126, 130, 136], [176, 196, 214]];
    const yMob = y1 - H * 0.035, qMob = qOf(yMob);
    const HMOB = H * 0.19;
    const flam = 0.86 + 0.14 * Math.sin(t * 8.3) + 0.06 * Math.sin(t * 19.7);
    for (let s = 0; s < 6; s++){
      const wS = w6(s);
      if (wS < 0.004) continue;
      for (let i = 0; i < MOB[s].length; i++){
        const m = MOB[s][i], xx = W * m[0], hg = HMOB * m[1], ty = m[2];
        const wd = hg * (ty === 1 ? 0.62 : ty === 3 ? 0.40 : 0.26);
        const col = CORPS[ty];
        // l'ombre file vers le bas-gauche et reste couchee sur le sol
        posee(xx - hg * 0.52, yMob + hg * 0.05, hg * 0.95, 1);
        c.fillStyle = K([14, 12, 10], 0.30 * wS); c.fill();
        posee(xx, yMob, wd * 0.62, 1);
        c.fillStyle = K([16, 14, 12], 0.34 * wS); c.fill();

        if (ty === 1){                                  // cairn : un tas, pas un mat
          for (let j = 0; j < 4; j++){
            const rr = wd * (0.50 - j * 0.09);
            posee(xx + (al(26000 + i * 5 + j) - 0.5) * wd * 0.22, yMob - hg * (0.10 + j * 0.20), rr, 1.6);
            c.fillStyle = K(mel(col, [255, 244, 220], 0.10 + j * 0.10), wS); c.fill();
          }
          continue;
        }
        const tp = ty === 5 || ty === 6 ? 0.72 : 0.86;
        c.beginPath();
        c.moveTo(xx - wd * 0.5, yMob);
        c.lineTo(xx - wd * 0.5 * tp, yMob - hg);
        c.lineTo(xx + wd * 0.5 * tp, yMob - hg);
        c.lineTo(xx + wd * 0.5, yMob);
        c.closePath();
        c.fillStyle = K(mel(col, [12, 10, 8], 0.30), wS); c.fill();
        c.beginPath();                                   // face droite eclairee
        c.moveTo(xx + wd * 0.06, yMob);
        c.lineTo(xx + wd * 0.06 * tp, yMob - hg);
        c.lineTo(xx + wd * 0.5 * tp, yMob - hg);
        c.lineTo(xx + wd * 0.5, yMob);
        c.closePath();
        c.fillStyle = K(mel(col, [255, 248, 228], 0.26), wS); c.fill();
        posee(xx, yMob - hg, wd * 0.5 * tp, 2.2);        // couronnement
        c.fillStyle = K(mel(col, [255, 250, 232], 0.42), wS); c.fill();

        if (ty === 4 || ty === 7 || ty === 8){           // les porteurs de lumiere
          const yl = yMob - hg * 1.02;
          const chaud = ty === 4;
          const a = (chaud ? flam : 1) * (0.25 + 0.72 * N) * wS;
          c.save();
          c.globalCompositeOperation = "lighter";
          const rr = wd * (chaud ? 2.6 : 3.4);
          const gg = c.createRadialGradient(xx, yl, 0, xx, yl, Math.max(1, rr));
          const tc = chaud ? "255,182,86" : ty === 7 ? "222,238,255" : "150,222,255";
          gg.addColorStop(0, "rgba(" + tc + "," + a.toFixed(3) + ")");
          gg.addColorStop(1, "rgba(" + tc + ",0)");
          c.fillStyle = gg;
          c.beginPath(); c.arc(xx, yl, Math.max(1, rr), 0, TAU); c.fill();
          c.fillStyle = "rgba(255,246,224," + (a * 0.9).toFixed(3) + ")";
          c.beginPath(); c.ellipse(xx, yl, wd * 0.32, wd * 0.32 * (chaud ? 1.5 : 1.0), 0, 0, TAU); c.fill();
          c.restore();
          // la lueur retombe sur la voie en flaque couchee
          c.save();
          c.globalCompositeOperation = "lighter";
          c.translate(xx, yMob); c.scale(1, FLAT * qMob);
          const gp = c.createRadialGradient(0, 0, 0, 0, 0, Math.max(1, hg * 2.2));
          gp.addColorStop(0, "rgba(" + tc + "," + (a * 0.42).toFixed(3) + ")");
          gp.addColorStop(1, "rgba(" + tc + ",0)");
          c.fillStyle = gp;
          c.beginPath(); c.arc(0, 0, Math.max(1, hg * 2.2), 0, TAU); c.fill();
          c.restore();
        }
      }
    }

    c.restore();
  }

  /* Arbres et végétation autour du village, de la forêt sauvage à la serre sous cloche.
     Repère écran, sujets plantés sur solY, toutes les tailles dérivées de E.
     Lumière venant du haut-droite. */
  function paysageArbres(c, W, Hh, solY, ee, nuit, t, E, om, al){
    const TAU = Math.PI * 2, HP = Math.PI * 0.5;
    const CL = (v, a, b) => (v < a ? a : (v > b ? b : v));
    const LP = (a, b, u) => a + (b - a) * u;
    const SS = (u) => { const k = CL(u, 0, 1); return k * k * (3 - 2 * k); };

    const T = t || 0, nt = CL(nuit || 0, 0, 1);
    const bande = Math.max(Hh - solY, 1);
    const e = CL(ee || 0, 0, 5);
    const i0 = Math.min(4, Math.max(0, Math.floor(e))), fr = CL(e - i0, 0, 1);

    // aléa adressé par une clé, jamais par la position : le vent ferait grésiller la texture
    const R = (s, k) => {
      const v = al(s * 137.13 + k * 2.7183 + 11.31);
      return v - Math.floor(v);
    };

    /* ---------- l'époque, interpolée d'un palier au suivant ---------- */
    const EP = {
      couvert:[0.98, 0.66, 0.90, 0.24, 0.76, 0.86],  // part des emplacements plantés
      haut:   [176,  106,  146,   80,  128,  116 ],
      ratio:  [1.05, 1.10, 1.24, 0.62, 0.84, 0.96],  // envergure / hauteur
      tronc:  [0.100,0.150,0.126,0.074,0.104,0.088],
      ouv:    [0.82, 1.05, 0.94, 0.60, 0.64, 0.84],  // ouverture des fourches
      noeud:  [0.30, 0.90, 0.42, 0.58, 0.12, 0.22],  // torsion des charpentières
      dens:   [1.00, 0.74, 0.98, 0.28, 0.94, 1.00],  // bouquets feuillus / rameaux nus
      bouq:   [1.10, 0.80, 1.10, 0.52, 0.96, 1.05],
      cyp:    [0.00, 0.62, 0.10, 0.00, 0.06, 0.20],  // part de sujets en colonne
      taille: [0.00, 0.24, 0.46, 0.06, 0.96, 0.56],  // arbre taillé, têtes de chat
      align:  [0.00, 0.12, 0.32, 0.04, 0.92, 0.58],
      fruit:  [0.06, 0.34, 0.86, 0.00, 0.05, 0.42],
      irr:    [1.00, 0.88, 0.74, 0.94, 0.30, 0.44],  // irrégularité du bord du feuillage
      herbe:  [1.00, 0.78, 0.88, 0.40, 0.82, 0.76],
      foug:   [1.00, 0.32, 0.24, 0.06, 0.05, 0.30],
      souche: [0.05, 0.10, 0.26, 1.00, 0.10, 0.04],
      haie:   [0.00, 0.16, 0.44, 0.04, 1.00, 0.42],
      cloche: [0.00, 0.00, 0.00, 0.00, 0.05, 1.00],
      susp:   [0.00, 0.00, 0.00, 0.00, 0.04, 1.00],
      bio:    [0.00, 0.00, 0.00, 0.00, 0.03, 1.00],
      vent:   [1.00, 0.72, 0.86, 0.62, 0.54, 0.34]
    };
    const P = {};
    for (const k in EP) P[k] = LP(EP[k][i0], EP[k][i0 + 1], fr);

    const mixc = (A, B, u) => [LP(A[0], B[0], u), LP(A[1], B[1], u), LP(A[2], B[2], u)];
    const FEU = [
      [[18,44,22],[42,92,40],[116,166,78]],      // 0 forêt sauvage
      [[46,60,42],[96,116,80],[168,180,142]],    // 1 olivier argenté
      [[22,52,24],[54,104,44],[130,176,84]],     // 2 chêne
      [[48,48,30],[88,82,44],[136,124,66]],      // 3 feuillage jauni de suie
      [[28,58,30],[66,114,52],[142,184,96]],     // 4 platane
      [[14,54,56],[32,112,104],[96,196,170]]     // 5 sous cloche
    ];
    const ECO = [
      [[46,34,22],[88,66,42],[130,102,66]],
      [[58,54,44],[104,98,80],[156,150,128]],
      [[44,32,22],[86,66,42],[128,100,66]],
      [[38,32,26],[70,60,50],[100,88,74]],
      [[86,84,72],[146,144,126],[204,202,184]],  // platane marbré
      [[70,74,86],[122,128,146],[178,186,204]]
    ];
    const FRU = [[112,40,52],[62,70,44],[172,46,34],[120,96,50],[156,74,60],[112,236,198]];
    const FE = [0,1,2].map(j => mixc(FEU[i0][j], FEU[i0 + 1][j], fr));
    const EC = [0,1,2].map(j => mixc(ECO[i0][j], ECO[i0 + 1][j], fr));
    const FR = mixc(FRU[i0], FRU[i0 + 1], fr);

    const CF0 = om(FE[0][0], FE[0][1], FE[0][2], 1);
    const CF1 = om(FE[1][0], FE[1][1], FE[1][2], 1);
    const CF2 = om(FE[2][0], FE[2][1], FE[2][2], 1);
    const CE0 = om(EC[0][0], EC[0][1], EC[0][2], 1);
    const CE1 = om(EC[1][0], EC[1][1], EC[1][2], 1);
    const CE2 = om(EC[2][0], EC[2][1], EC[2][2], 1);
    const CFR = om(FR[0], FR[1], FR[2], 1);
    const jour = 1 - 0.42 * nt;                  // la nuit écrase les hautes lumières

    const glows = [];                            // points bio-luminescents, passe additive finale

    /* ================= briques de dessin ================= */

    // masse de feuillage : polygone festonné, jamais un disque
    function masse(cx, cy, r, s, key, ap){
      if (!(r > 0.7)) return;
      const n = CL(Math.round(6 + r * 0.42), 7, 15) | 0;
      const rot = R(s, key) * TAU;
      const bosse = 0.40 * P.irr, creux = 1 - 0.24 * P.irr;
      c.beginPath();
      for (let i = 0; i <= n; i++){
        const j = i % n;
        const a = (j / n) * TAU + rot;
        const rr = r * (creux + bosse * R(s, key + j * 1.71));
        const qx = cx + Math.cos(a) * rr, qy = cy + Math.sin(a) * rr * ap;
        if (i === 0){ c.moveTo(qx, qy); continue; }
        // contrôle repoussé vers l'extérieur : chaque segment devient un feston
        const am = ((i - 0.5) / n) * TAU + rot;
        const rm = r * (1.05 + 0.22 * P.irr * R(s, key + i * 3.13));
        c.quadraticCurveTo(cx + Math.cos(am) * rm, cy + Math.sin(am) * rm * ap, qx, qy);
      }
      c.closePath();
      c.fill();
    }

    // membre fuselé et courbe ; off décale le ruban vers un flanc, k le rétrécit
    function membre(x0, y0, a0, xm, ym, am, x1, y1, a1, w0, w1, off, k){
      const wm = (w0 + w1) * 0.5;
      const s0 = Math.sin(a0), c0 = Math.cos(a0);
      const sm = Math.sin(am), cm = Math.cos(am);
      const s1 = Math.sin(a1), c1 = Math.cos(a1);
      const gx0 = x0 + s0 * (w0 * off + w0 * k), gy0 = y0 - c0 * (w0 * off + w0 * k);
      const gxm = xm + sm * (wm * off + wm * k), gym = ym - cm * (wm * off + wm * k);
      const gx1 = x1 + s1 * (w1 * off + w1 * k), gy1 = y1 - c1 * (w1 * off + w1 * k);
      const dx1 = x1 + s1 * (w1 * off - w1 * k), dy1 = y1 - c1 * (w1 * off - w1 * k);
      const dxm = xm + sm * (wm * off - wm * k), dym = ym - cm * (wm * off - wm * k);
      const dx0 = x0 + s0 * (w0 * off - w0 * k), dy0 = y0 - c0 * (w0 * off - w0 * k);
      c.beginPath();
      c.moveTo(gx0, gy0);
      c.quadraticCurveTo(2 * gxm - (gx0 + gx1) * 0.5, 2 * gym - (gy0 + gy1) * 0.5, gx1, gy1);
      c.lineTo(dx1, dy1);
      c.quadraticCurveTo(2 * dxm - (dx1 + dx0) * 0.5, 2 * dym - (dy1 + dy0) * 0.5, dx0, dy0);
      c.closePath();
      c.fill();
    }

    function rrect(x0, y0, w, h, r){
      const q = Math.min(r, w * 0.5, h * 0.5);
      c.beginPath();
      c.moveTo(x0 + q, y0);
      c.lineTo(x0 + w - q, y0);
      c.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + q);
      c.lineTo(x0 + w, y0 + h - q);
      c.quadraticCurveTo(x0 + w, y0 + h, x0 + w - q, y0 + h);
      c.lineTo(x0 + q, y0 + h);
      c.quadraticCurveTo(x0, y0 + h, x0, y0 + h - q);
      c.lineTo(x0, y0 + q);
      c.quadraticCurveTo(x0, y0, x0 + q, y0);
      c.closePath();
    }

    function ombrePied(x, y, demi, ep){
      c.fillStyle = om(16, 13, 10, 0.16);
      c.beginPath();
      c.ellipse(x - demi * 0.34, y, demi * 1.15, ep * 1.35, 0, 0, TAU);
      c.fill();
      c.fillStyle = om(12, 10, 8, 0.26);
      c.beginPath();
      c.ellipse(x - demi * 0.22, y, demi * 0.62, ep * 0.78, 0, 0, TAU);
      c.fill();
    }

    /* ================= la lisière du fond ================= */
    function lisiere(){
      const h = solY * 0.115 * P.couvert;
      if (!(h > 1)) return;
      const cotes = [[-W * 0.03, W * 0.34], [W * 0.66, W * 1.03]];
      for (let z = 0; z < 2; z++){
        const x0 = cotes[z][0], x1 = cotes[z][1], n = 26;
        for (let pass = 0; pass < 2; pass++){
          c.fillStyle = pass ? CF1 : CF0;
          c.globalAlpha = pass ? 0.5 * jour : 1;
          const dy = pass ? -h * 0.16 : 0, dx = pass ? h * 0.2 : 0;
          c.beginPath();
          c.moveTo(x0, solY + 2);
          for (let i = 0; i <= n; i++){
            const u = i / n, k = z * 100 + i;
            const bosse = 0.34 + 0.66 * R(700, k * 1.3);
            const y = solY - h * bosse * (0.55 + 0.45 * Math.sin(u * 7.1 + z * 2.3)) + dy;
            c.lineTo(LP(x0, x1, u) + dx, y);
          }
          c.lineTo(x1, solY + 2);
          c.closePath();
          c.fill();
        }
      }
      c.globalAlpha = 1;
    }

    /* ================= un arbre ================= */
    function arbre(s, x, base, haut, col, ech){
      const tw = haut * P.tronc * LP(1, 0.60, col);
      const larg = haut * P.ratio * LP(1, 0.30, col);
      const ph = R(s, 6) * TAU, vit = 0.13 + R(s, 7) * 0.09;
      const bal = (Math.sin(T * vit + ph) * 0.6 + Math.sin(T * vit * 0.41 + ph * 1.7) * 0.4);
      const amp = 0.045 * P.vent * LP(1, 0.45, P.taille);
      const niv = haut > 58 * E ? 3 : (haut > 24 * E ? 2 : 1);
      const L0 = haut * LP(0.40, 0.28, col) * (0.9 + 0.2 * R(s, 8));
      const ratL = LP(0.76, 0.88, col);
      const anc = [];
      let mnx = x, mxx = x, mny = base;

      ombrePied(x, base, larg * 0.30 + tw * 1.6, tw * 0.5 + haut * 0.012);

      function pousse(bx, by, a, L, w, lvl, id){
        const bend = (R(s, id * 5 + 1) - 0.5) * P.noeud * 1.6 * LP(1, 0.35, col)
                   + bal * amp * (niv - lvl + 1);
        const am = a + bend * 0.5, a1 = a + bend;
        const xm = bx + Math.cos(a + bend * 0.25) * L * 0.5;
        const ym = by + Math.sin(a + bend * 0.25) * L * 0.5;
        const x1 = xm + Math.cos(a + bend * 0.75) * L * 0.5;
        const y1 = ym + Math.sin(a + bend * 0.75) * L * 0.5;
        const w1 = w * (0.52 + 0.14 * R(s, id * 5 + 2));

        // flanc éclairé : normale droite projetée sur la direction du haut-droite
        const lit = (-Math.sin(am) - Math.cos(am)) * 0.7071;
        const sg = lit >= 0 ? -1 : 1, inten = Math.abs(lit);

        c.fillStyle = CE1;
        membre(bx, by, a, xm, ym, am, x1, y1, a1, w, w1, 0, 1);
        if (w > 0.9){
          c.fillStyle = om(EC[0][0], EC[0][1], EC[0][2], 0.30 + 0.30 * inten);
          membre(bx, by, a, xm, ym, am, x1, y1, a1, w, w1, -sg * 0.46, 0.50);
          c.fillStyle = om(EC[2][0], EC[2][1], EC[2][2], (0.26 + 0.48 * inten) * jour);
          membre(bx, by, a, xm, ym, am, x1, y1, a1, w, w1, sg * 0.44, 0.44);
        }

        if (lvl === niv && w > 2.2 * E){
          // contrefort des racines et rainures d'écorce, seulement sur le fût
          c.fillStyle = CE1;
          for (let g = 0; g < 5; g++){
            const cote = g % 2 ? 1 : -1, u = 0.35 + 0.65 * R(s, id * 5 + 20 + g);
            const rx = bx + cote * w * (0.9 + 1.5 * u), ry = by + w * 0.10;
            c.beginPath();
            c.moveTo(bx + cote * w * 0.94, by - w * (0.5 + 1.6 * u));
            c.quadraticCurveTo(bx + cote * w * (1.1 + 0.9 * u), by - w * 0.3, rx, ry);
            c.lineTo(bx + cote * w * 0.5, ry);
            c.closePath();
            c.fill();
          }
          c.fillStyle = om(EC[0][0], EC[0][1], EC[0][2], 0.34);
          c.beginPath();
          for (let g = 0; g < 6; g++){
            const o = (R(s, id * 5 + 30 + g) - 0.5) * 1.5, u0 = R(s, id * 5 + 40 + g);
            const yA = by - L * (0.05 + 0.55 * u0), yB = yA - L * (0.14 + 0.3 * R(s, id * 5 + 50 + g));
            const wq = w * 0.055;
            c.moveTo(bx + w * o - wq, yA);
            c.quadraticCurveTo(bx + w * o * 1.15, (yA + yB) * 0.5, bx + w * o + wq * 0.4, yB);
            c.lineTo(bx + w * o + wq, yB + L * 0.02);
            c.quadraticCurveTo(bx + w * o * 1.15 + wq, (yA + yB) * 0.5, bx + w * o + wq, yA);
            c.closePath();
          }
          c.fill();
        }

        if (lvl <= 0){
          const r = L * (0.95 + 0.55 * R(s, id * 5 + 3)) * P.bouq
                  * LP(1, 1.5, P.taille) * LP(1, 0.52, col);
          if (R(s, id * 5 + 4) < P.dens) anc.push({ x: x1, y: y1, r: r, k: id * 7 + 3 });
          if (x1 - r < mnx) mnx = x1 - r;
          if (x1 + r > mxx) mxx = x1 + r;
          if (y1 - r < mny) mny = y1 - r;
          return;
        }

        const nc = 2 + (R(s, id * 5 + 5) < LP(0.62, 0.20, col) ? 1 : 0);
        // tête de chat : les sujets taillés bourgeonnent d'un moignon renflé
        if (P.taille > 0.12 && w1 > 1.4 * E){
          c.fillStyle = CE1;
          c.beginPath();
          c.ellipse(x1, y1, w1 * LP(1, 2.1, P.taille), w1 * LP(1, 1.8, P.taille), a1, 0, TAU);
          c.fill();
          c.fillStyle = om(EC[2][0], EC[2][1], EC[2][2], 0.34 * P.taille * jour);
          c.beginPath();
          c.ellipse(x1 + w1 * 0.4, y1 - w1 * 0.4, w1 * 1.0 * P.taille, w1 * 0.8 * P.taille, a1, 0, TAU);
          c.fill();
        }
        for (let ci = 0; ci < nc; ci++){
          const cid = id * 4 + 1 + ci;
          const sp = nc > 2 ? (ci - 1) : (ci * 2 - 1);
          const jit = (R(s, cid * 5 + 6) - 0.5) * 0.55;
          let ang = a1 + (sp + jit) * P.ouv * LP(1, 0.15, col) * LP(1, 0.72, P.taille);
          ang = LP(ang, -HP, 0.13 + 0.55 * col);   // gravitropisme : rien ne retombe
          const cl = L * ratL * (0.84 + 0.30 * R(s, cid * 5 + 7))
                   * LP(1, 0.60, P.taille * (lvl === 1 ? 1 : 0.35));
          pousse(x1, y1, ang, cl, w1 * (0.94 + 0.10 * R(s, cid * 5 + 8)), lvl - 1, cid);
        }
      }

      pousse(x, base, -HP + (R(s, 9) - 0.5) * 0.16, L0, tw, niv, 1);

      /* ---- le feuillage, trois plans de valeur ---- */
      const cx = (mnx + mxx) * 0.5, ext = Math.max(mxx - mnx, 1) * 0.5;
      for (let pass = 0; pass < 3; pass++){
        c.fillStyle = pass === 0 ? CF0 : (pass === 1 ? CF1 : CF2);
        for (let i = 0; i < anc.length; i++){
          const a = anc[i], r = a.r;
          const hn = CL((base - a.y) / Math.max(haut, 1), 0, 1);
          const lat = CL((a.x - cx) / ext, -1, 1);
          if (pass === 0){
            masse(a.x - r * 0.13, a.y + r * 0.17, r, s, a.k, 0.94);
            const nf = CL(Math.round(r * 0.24), 0, 6) | 0;
            for (let f = 0; f < nf; f++){
              const ang = R(s, a.k + 60 + f * 1.37) * TAU;
              const dr = r * (0.86 + 0.30 * R(s, a.k + 90 + f * 1.13));
              masse(a.x + Math.cos(ang) * dr, a.y + Math.sin(ang) * dr + r * 0.1,
                    r * 0.30, s, a.k + 120 + f, 0.95);
            }
          } else if (pass === 1){
            masse(a.x + r * 0.02, a.y - r * 0.04, r * 0.84, s, a.k + 1, 0.93);
            for (let f = 0; f < 3; f++){
              const ang = -HP + (R(s, a.k + 150 + f) - 0.5) * 2.2;
              masse(a.x + Math.cos(ang) * r * 0.82, a.y + Math.sin(ang) * r * 0.78,
                    r * 0.26, s, a.k + 170 + f, 0.95);
            }
          } else {
            c.globalAlpha = CL(0.22 + 0.62 * hn + 0.30 * lat, 0, 1) * jour;
            masse(a.x + r * 0.27, a.y - r * 0.29, r * 0.50, s, a.k + 2, 0.9);
            c.globalAlpha = CL(0.12 + 0.5 * hn + 0.3 * lat, 0, 1) * jour * 0.9;
            masse(a.x + r * 0.44, a.y - r * 0.44, r * 0.24, s, a.k + 3, 0.95);
            c.globalAlpha = 1;
          }
        }
      }

      /* ---- fruits et olives ---- */
      if (P.fruit > 0.05 && haut > 26 * E){
        c.fillStyle = CFR;
        const rf = Math.max(0.9, haut * 0.012);
        for (let i = 0; i < anc.length; i++){
          const a = anc[i], n = Math.round(5 * P.fruit);
          for (let f = 0; f < n; f++){
            const ang = R(s, a.k + 200 + f * 1.29) * TAU;
            const dr = a.r * (0.35 + 0.55 * R(s, a.k + 230 + f * 1.61));
            c.beginPath();
            c.ellipse(a.x + Math.cos(ang) * dr, a.y + Math.sin(ang) * dr + a.r * 0.12,
                      rf, rf * 1.15, 0, 0, TAU);
            c.fill();
          }
        }
      }

      /* ---- bio-luminescence : les points sont relevés, la passe additive suit ---- */
      if (P.bio > 0.03 && glows.length < 150){
        for (let i = 0; i < anc.length && glows.length < 150; i += 2){
          const a = anc[i];
          glows.push({ x: a.x + Math.cos(R(s, a.k + 300) * TAU) * a.r * 0.4,
                       y: a.y + Math.sin(R(s, a.k + 301) * TAU) * a.r * 0.4,
                       r: a.r * 0.55, h: R(s, a.k + 302) });
        }
      }

      /* ---- la cloche de verre ---- */
      if (P.cloche > 0.02 && R(s, 10) < 0.62 && haut > 30 * E){
        const rc = Math.max(ext * 1.16, larg * 0.5), hc = (base - mny) * 1.1 + haut * 0.05;
        const k = P.cloche;
        c.save();
        const g = c.createRadialGradient(x + rc * 0.35, base - hc * 0.72, rc * 0.05,
                                         x, base - hc * 0.45, rc * 1.25);
        g.addColorStop(0, om(190, 232, 240, 0.20 * k));
        g.addColorStop(0.55, om(120, 180, 200, 0.07 * k));
        g.addColorStop(1, om(90, 150, 180, 0.02 * k));
        c.fillStyle = g;
        c.beginPath();
        c.moveTo(x - rc, base);
        c.bezierCurveTo(x - rc, base - hc * 0.86, x - rc * 0.68, base - hc, x, base - hc);
        c.bezierCurveTo(x + rc * 0.68, base - hc, x + rc, base - hc * 0.86, x + rc, base);
        c.closePath();
        c.fill();
        c.lineWidth = Math.max(0.7, E * 1.1);
        c.strokeStyle = om(180, 226, 236, 0.42 * k);
        c.stroke();
        c.strokeStyle = om(226, 248, 255, 0.6 * k * jour);
        c.beginPath();
        c.moveTo(x + rc * 0.30, base - hc * 0.94);
        c.quadraticCurveTo(x + rc * 0.86, base - hc * 0.74, x + rc * 0.94, base - hc * 0.30);
        c.stroke();
        c.strokeStyle = om(150, 200, 220, 0.20 * k);
        for (let m = -1; m <= 1; m += 2){
          c.beginPath();
          c.moveTo(x, base - hc);
          c.quadraticCurveTo(x + m * rc * 0.62, base - hc * 0.72, x + m * rc * 0.52, base);
          c.stroke();
        }
        c.fillStyle = om(96, 110, 120, 0.55 * k);
        c.beginPath();
        c.ellipse(x, base, rc * 1.05, Math.max(1.2, haut * 0.016), 0, 0, TAU);
        c.fill();
        c.restore();
      }
    }

    /* ================= fougères ================= */
    function fronde(bx, by, ang, L, wid, s, key){
      const n = 9;
      const courbe = (R(s, key) - 0.5) * 0.4 + (ang + HP) * 0.55;
      const sx = [], sy = [], sa = [];
      let px = bx, py = by, a = ang;
      for (let i = 0; i <= n; i++){
        sx.push(px); sy.push(py); sa.push(a);
        px += Math.cos(a) * (L / n); py += Math.sin(a) * (L / n); a += courbe / n;
      }
      const prof = (u) => Math.pow(1 - u, 0.85) * Math.min(1, u * 4.5 + 0.18);
      c.beginPath();
      c.moveTo(sx[0], sy[0]);
      for (let i = 1; i <= n; i++){
        const w = prof(i / n) * wid, nx = Math.sin(sa[i]), ny = -Math.cos(sa[i]);
        c.lineTo(sx[i] + nx * w * 0.30, sy[i] + ny * w * 0.30);
        c.lineTo(sx[i] + nx * w + Math.cos(sa[i]) * w * 0.42,
                 sy[i] + ny * w + Math.sin(sa[i]) * w * 0.42);
      }
      for (let i = n; i >= 1; i--){
        const w = prof(i / n) * wid, nx = -Math.sin(sa[i]), ny = Math.cos(sa[i]);
        c.lineTo(sx[i] + nx * w + Math.cos(sa[i]) * w * 0.42,
                 sy[i] + ny * w + Math.sin(sa[i]) * w * 0.42);
        c.lineTo(sx[i] + nx * w * 0.30, sy[i] + ny * w * 0.30);
      }
      c.closePath();
      c.fill();
    }

    function fougere(s, x, base, taille){
      const nf = 7;
      ombrePied(x, base, taille * 0.5, taille * 0.055);
      const bal = Math.sin(T * 0.19 + R(s, 1) * TAU) * 0.05 * P.vent;
      for (let pass = 0; pass < 2; pass++){
        c.fillStyle = pass ? CF1 : CF0;
        c.globalAlpha = pass ? 1 : 1;
        for (let i = 0; i < nf; i++){
          const u = (i + 0.5) / nf;
          // la lumière vient du haut-droite : les frondes de droite passent en clair
          const droite = u > 0.5;
          if (pass === 1 && !droite) continue;
          if (pass === 0 && droite && R(s, i + 40) < 0.45) continue;
          const ang = -HP + (u - 0.5) * 2.25 + bal;
          const L = taille * (0.72 + 0.32 * R(s, i * 3 + 2));
          fronde(x + (u - 0.5) * taille * 0.10, base, ang, L, L * 0.20, s, i * 3 + 5);
        }
      }
      c.globalAlpha = 1;
      c.fillStyle = om(EC[0][0], EC[0][1], EC[0][2], 0.5);
      c.beginPath();
      c.ellipse(x, base, taille * 0.10, taille * 0.045, 0, 0, TAU);
      c.fill();
    }

    /* ================= souches ================= */
    function souche(s, x, base, d){
      const rr = d * 0.5, h = d * 0.55;
      ombrePied(x, base, rr * 1.5, h * 0.16);
      const BOIS = [[64,46,30],[132,102,66],[186,152,106]];
      c.fillStyle = om(BOIS[0][0], BOIS[0][1], BOIS[0][2], 1);
      c.beginPath();
      c.moveTo(x - rr, base - h);
      c.lineTo(x - rr, base);
      c.quadraticCurveTo(x, base + h * 0.34, x + rr, base);
      c.lineTo(x + rr, base - h);
      c.closePath();
      c.fill();
      c.fillStyle = om(BOIS[1][0], BOIS[1][1], BOIS[1][2], 0.55 * jour);
      c.beginPath();
      c.moveTo(x + rr * 0.18, base - h);
      c.lineTo(x + rr * 0.18, base + h * 0.2);
      c.quadraticCurveTo(x + rr * 0.7, base + h * 0.1, x + rr, base);
      c.lineTo(x + rr, base - h);
      c.closePath();
      c.fill();
      c.fillStyle = om(BOIS[2][0], BOIS[2][1], BOIS[2][2], jour);
      c.beginPath();
      c.ellipse(x, base - h, rr, rr * 0.36, 0, 0, TAU);
      c.fill();
      c.strokeStyle = om(78, 56, 36, 0.55);
      c.lineWidth = Math.max(0.6, d * 0.018);
      for (let i = 1; i <= 5; i++){
        const k = i / 5.6 * (0.7 + 0.3 * R(s, i));
        c.beginPath();
        c.ellipse(x + rr * 0.06 * i * 0.2, base - h, rr * k, rr * 0.36 * k, 0, 0, TAU);
        c.stroke();
      }
      c.beginPath();                                  // fente d'abattage
      c.moveTo(x - rr * 0.1, base - h - rr * 0.3);
      c.lineTo(x + rr * 0.32, base - h + rr * 0.28);
      c.stroke();
      c.fillStyle = om(52, 38, 26, 0.85);             // encoche de la scie
      c.beginPath();
      c.moveTo(x - rr * 0.85, base - h * 0.72);
      c.lineTo(x - rr * 0.18, base - h * 0.5);
      c.lineTo(x - rr * 0.85, base - h * 0.24);
      c.closePath();
      c.fill();
      if (R(s, 11) < 0.45){                           // grume abandonnée à côté
        const lg = d * (1.4 + 0.8 * R(s, 12)), cote = R(s, 13) < 0.5 ? -1 : 1;
        const lx = x + cote * d * 1.1, ly = base - h * 0.22;
        c.fillStyle = om(BOIS[0][0], BOIS[0][1], BOIS[0][2], 1);
        rrect(lx - lg * 0.5, ly - h * 0.42, lg, h * 0.44, h * 0.2);
        c.fill();
        c.fillStyle = om(BOIS[1][0], BOIS[1][1], BOIS[1][2], 0.5 * jour);
        rrect(lx - lg * 0.5, ly - h * 0.42, lg, h * 0.16, h * 0.08);
        c.fill();
        c.fillStyle = om(BOIS[2][0], BOIS[2][1], BOIS[2][2], 0.9 * jour);
        c.beginPath();
        c.ellipse(lx + lg * 0.5 * cote, ly - h * 0.2, h * 0.1, h * 0.22, 0, 0, TAU);
        c.fill();
      }
      c.fillStyle = om(FE[0][0], FE[0][1], FE[0][2], 0.7);   // rejets au pied
      for (let i = 0; i < 4; i++){
        const cote = i % 2 ? 1 : -1, rj = d * (0.1 + 0.09 * R(s, 14 + i));
        masse(x + cote * rr * (0.7 + 0.4 * R(s, 20 + i)), base - h * 0.1 - rj, rj, s, 300 + i, 0.9);
      }
    }
