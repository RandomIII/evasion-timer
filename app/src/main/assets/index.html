        c.lineWidth = Math.max(0.5, rb * 0.24);
        c.beginPath();
        c.moveTo(cx + Math.sin(th) * rad(0), yb);
        c.lineTo(cx + Math.sin(th) * rad(1), yt);
        c.stroke();
        var th2 = th + Math.PI / 10;
        c.strokeStyle = om(255, 250, 230, 0.06 + 0.26 * lit);
        c.lineWidth = Math.max(0.4, rb * 0.10);
        c.beginPath();
        c.moveTo(cx + Math.sin(th2) * rad(0), yb);
        c.lineTo(cx + Math.sin(th2) * rad(1), yt);
        c.stroke();
      }
      for (var d = 1; d < 3; d++) {
        var dy = yb - hh * (d / 3);
        c.strokeStyle = om(66, 54, 40, 0.16);
        c.lineWidth = Math.max(0.5, rb * 0.13);
        c.beginPath();
        c.moveTo(cx - rb, dy);
        c.lineTo(cx + rb, dy);
        c.stroke();
      }
      c.restore();

      c.beginPath();
      c.ellipse(cx, yb - rb * 0.22, rb * 1.5, rb * 0.5, 0, 0, TAU);
      var gb = c.createLinearGradient(cx - rb * 1.5, 0, cx + rb * 1.5, 0);
      gb.addColorStop(0, om(112, 100, 80));
      gb.addColorStop(0.72, om(238, 230, 206));
      gb.addColorStop(1, om(180, 168, 142));
      c.fillStyle = gb;
      c.fill();

      var rt = rad(1);
      c.beginPath();
      c.moveTo(cx - rt, yt);
      c.quadraticCurveTo(cx - rt * 1.35, yt - hh * 0.045, cx - rt * 1.7, yt - hh * 0.07);
      c.lineTo(cx + rt * 1.7, yt - hh * 0.07);
      c.quadraticCurveTo(cx + rt * 1.35, yt - hh * 0.045, cx + rt, yt);
      c.closePath();
      var gk = c.createLinearGradient(cx - rt * 1.7, 0, cx + rt * 1.7, 0);
      gk.addColorStop(0, om(118, 106, 86));
      gk.addColorStop(0.7, om(244, 236, 212));
      gk.addColorStop(1, om(186, 174, 148));
      c.fillStyle = gk;
      c.fill();
      c.fillStyle = om(224, 214, 188);
      c.fillRect(cx - rt * 1.85, yt - hh * 0.10, rt * 3.7, hh * 0.032);
      c.fillStyle = om(58, 46, 34, 0.30);
      c.fillRect(cx - rt * 1.85, yt - hh * 0.072, rt * 3.7, hh * 0.008);
      if (al(seed + 99) > 0.62) {
        c.fillStyle = om(70, 58, 44, 0.35);
        c.beginPath();
        c.moveTo(cx - rt * 1.85, yt - hh * 0.10);
        c.lineTo(cx - rt * 1.2, yt - hh * 0.10);
        c.lineTo(cx - rt * 1.85, yt - hh * 0.062);
        c.closePath();
        c.fill();
      }
    }

    // ---- ombre de contact ----
    c.beginPath();
    c.ellipse(-L * 0.06, -H * 0.024, wx * 1.24, H * 0.024, 0, 0, TAU);
    c.fillStyle = om(30, 24, 18, 0.30);
    c.fill();

    // ---- mur de torchis ----
    c.save();
    c.beginPath();
    c.rect(-wx, wallTop, wx * 2, -wallTop);
    c.clip();
    var gw = c.createLinearGradient(-wx, 0, wx, 0);
    gw.addColorStop(0, om(122, 108, 88));
    gw.addColorStop(0.30, om(176, 161, 134));
    gw.addColorStop(0.72, om(233, 222, 193));
    gw.addColorStop(1, om(209, 196, 166));
    c.fillStyle = gw;
    c.fillRect(-wx, wallTop, wx * 2, -wallTop);
    var gv = c.createLinearGradient(0, wallTop, 0, 0);
    gv.addColorStop(0, om(46, 36, 26, 0.36));
    gv.addColorStop(0.14, om(46, 36, 26, 0));
    gv.addColorStop(0.78, om(64, 50, 34, 0));
    gv.addColorStop(1, om(64, 50, 34, 0.34));
    c.fillStyle = gv;
    c.fillRect(-wx, wallTop, wx * 2, -wallTop);

    for (var i = 0; i < 30; i++) {
      var px = -wx + al(i * 3 + 1) * wx * 2;
      var py = wallTop + al(i * 3 + 2) * (-wallTop);
      var pw = wx * (0.07 + al(i * 3 + 3) * 0.20);
      var ph = H * (0.015 + al(i * 7 + 5) * 0.045);
      c.fillStyle = al(i * 5 + 4) > 0.5 ? om(255, 246, 222, 0.075) : om(94, 78, 58, 0.07);
      c.beginPath();
      c.ellipse(px, py, pw, ph, (al(i * 11 + 6) - 0.5) * 0.8, 0, TAU);
      c.fill();
    }

    // enduit ecaille : le blocage de pierre affleure
    for (var k = 0; k < 4; k++) {
      var cxk = -wx * 0.9 + al(k * 13 + 2) * wx * 1.5;
      var cyk = wallTop + (0.28 + al(k * 13 + 3) * 0.55) * (-wallTop);
      var rk = L * (0.035 + al(k * 13 + 4) * 0.05);
      var pts = [];
      for (var a1 = 0; a1 < 10; a1++) {
        var ang = a1 / 10 * TAU;
        var rr = rk * (0.55 + al(k * 31 + a1) * 0.7);
        pts.push([cxk + Math.cos(ang) * rr, cyk + Math.sin(ang) * rr * 0.72]);
      }
      c.beginPath();
      for (var a2 = 0; a2 < pts.length; a2++) {
        c.lineTo(pts[a2][0] - L * 0.005, pts[a2][1] - H * 0.004);
      }
      c.closePath();
      c.fillStyle = om(72, 58, 42, 0.45);
      c.fill();
      c.save();
      c.beginPath();
      for (var a3 = 0; a3 < pts.length; a3++) c.lineTo(pts[a3][0], pts[a3][1]);
      c.closePath();
      c.fillStyle = om(154, 140, 116);
      c.fill();
      c.clip();
      for (var s1 = 0; s1 < 9; s1++) {
        c.beginPath();
        c.ellipse(cxk + (al(k * 41 + s1) - 0.5) * rk * 1.7,
                  cyk + (al(k * 41 + s1 + 5) - 0.5) * rk * 1.2,
                  rk * (0.16 + al(k * 43 + s1) * 0.20),
                  rk * (0.10 + al(k * 47 + s1) * 0.13),
                  (al(k * 53 + s1) - 0.5) * 1.2, 0, TAU);
        c.fillStyle = al(k * 59 + s1) > 0.5 ? om(186, 176, 156) : om(118, 106, 88);
        c.fill();
      }
      c.restore();
    }
    c.restore();

    // ---- loggia : le vide doit rester plus sombre que les futs ----
    var lx0 = L * 0.04, lx1 = L * 0.36;
    var lTop = -H * 0.425, lFloor = plinthY;
    c.save();
    c.beginPath();
    c.rect(lx0, lTop, lx1 - lx0, lFloor - lTop);
    c.clip();
    var gl = c.createLinearGradient(lx0, 0, lx1, 0);
    gl.addColorStop(0, om(30, 25, 22));
    gl.addColorStop(0.6, om(20, 17, 15));
    gl.addColorStop(1, om(44, 37, 31));
    c.fillStyle = gl;
    c.fillRect(lx0, lTop, lx1 - lx0, lFloor - lTop);
    var gl2 = c.createLinearGradient(0, lTop, 0, lFloor);
    gl2.addColorStop(0, om(6, 5, 5, 0.55));

    c.fillRect(lx0 + L * 0.01, lFloor - H * 0.055, (lx1 - lx0) * 0.55, H * 0.043);
    c.fillStyle = om(122, 110, 90);
    c.fillRect(lx0 + L * 0.01, lFloor - H * 0.055, (lx1 - lx0) * 0.55, H * 0.007);
    if (nuit > 0.02) {

    c.fillRect(dx0, dTop + H * 0.10, dx1 - dx0, H * 0.014);
    c.fillStyle = om(10, 8, 7, 0.6);
    c.fillRect(dx0, dTop, dx1 - dx0, H * 0.016);
    c.restore();
    c.fillStyle = om(198, 186, 158);
    c.fillRect(dx0 - L * 0.014, dTop - H * 0.042, dx1 - dx0 + L * 0.028, H * 0.042);
    c.fillStyle = om(120, 108, 88, 0.5);
    c.fillRect(dx0 - L * 0.014, dTop - H * 0.042, (dx1 - dx0) * 0.35, H * 0.042);
    c.fillStyle = om(48, 38, 28, 0.4);
    c.fillRect(dx0 - L * 0.014, dTop - H * 0.006, dx1 - dx0 + L * 0.028, H * 0.006);
    c.fillStyle = om(160, 148, 124);
    c.fillRect(dx0 - L * 0.02, dBot, dx1 - dx0 + L * 0.04, H * 0.03);
    c.fillStyle = om(226, 216, 190);
    c.fillRect(dx0 - L * 0.02, dBot, dx1 - dx0 + L * 0.04, H * 0.007);

    // ---- fenetres a volets ----
    function fenetre(fx0, fx1, fy0, fy1, seed) {

      c.fillStyle = om(14, 12, 11);

        c.globalCompositeOperation = "lighter";

        c.fillRect(fx0, fy0, fw, fh);

                                        fx0 + fw / 2, fy0 + fh / 2, fw * 1.9);

    // ---- soubassement de pierre ----
    c.save();
    c.beginPath();
    c.rect(-wx - L * 0.012, plinthY, (wx + L * 0.012) * 2, -plinthY);
    c.clip();
    c.fillStyle = om(112, 102, 86);
    c.fillRect(-wx - L * 0.012, plinthY, (wx + L * 0.012) * 2, -plinthY);
    for (var course = 0; course < 2; course++) {
      var cy0 = plinthY + course * (-plinthY) / 2;

      var cursor = -wx - L * 0.012 - (course === 1 ? L * 0.03 : 0);

      while (cursor < wx + L * 0.012) {

    // ---- toiture de tuiles romaines ----
    var nT = 17, nRow = 10;
    function halfAt(v) { return eaveX + (ridgeX - eaveX) * v; }
    function rowV(i2) { return 1 - Math.pow(1 - i2 / nRow, 1.4); }
    c.save();
    c.beginPath();
    c.moveTo(-eaveX, eaveY);
    c.lineTo(eaveX, eaveY);
    c.lineTo(ridgeX, ridgeY);
    c.lineTo(-ridgeX, ridgeY);

    c.clip();
    var gt = c.createLinearGradient(-eaveX, 0, eaveX, 0);
    gt.addColorStop(0, om(98, 50, 38));
    gt.addColorStop(0.34, om(148, 78, 54));

    gt2.addColorStop(1, om(38, 22, 18, 0));
    c.fillStyle = gt2;
    c.fillRect(-eaveX, ridgeY, eaveX * 2, eaveY - ridgeY);

    for (var im = 0; im < nT; im++) {
      var sc = (im + 0.5) / nT;
      var hwS = 0.46 / nT;
      var xe0 = (sc - hwS) * 2 * eaveX - eaveX, xe1 = (sc + hwS) * 2 * eaveX - eaveX;
      var xr0 = (sc - hwS) * 2 * ridgeX - ridgeX, xr1 = (sc + hwS) * 2 * ridgeX - ridgeX;
      c.beginPath();
      c.moveTo(xe0, eaveY);
      c.lineTo(xe1, eaveY);
      c.lineTo(xr1, ridgeY);
      c.lineTo(xr0, ridgeY);
      c.closePath();
      var gim = c.createLinearGradient(xe0, 0, xe1, 0);
      gim.addColorStop(0, om(44, 24, 18, 0.46));
      gim.addColorStop(0.42, om(255, 224, 190, 0));
      gim.addColorStop(0.74, om(255, 228, 196, 0.30));
      gim.addColorStop(1, om(86, 42, 30, 0.26));

    for (var rw = 1; rw < nRow; rw++) {
      var v = rowV(rw);
      var ry = eaveY + (ridgeY - eaveY) * v;

      var lw = Math.max(0.7, (eaveY - ridgeY) * 0.012 * (1 - v * 0.5));
      c.fillStyle = om(52, 28, 20, 0.42);
      c.fillRect(-hwr, ry, hwr * 2, lw);
      c.fillStyle = om(255, 214, 172, 0.20);

    // usure : tuiles rompues et mousse a l'ombre
    for (var br = 0; br < 5; br++) {
      var bk = Math.floor(al(br * 17 + 3) * nT);
      var brw = Math.floor(al(br * 17 + 5) * (nRow - 1));
      var v0 = rowV(brw), v1 = rowV(brw + 1);
      var y0b = eaveY + (ridgeY - eaveY) * v0, y1b = eaveY + (ridgeY - eaveY) * v1;
      var h0 = halfAt(v0), h1 = halfAt(v1);
      var sB = (bk + 0.5) / nT, hwB = 0.5 / nT;
      c.beginPath();
      c.moveTo((sB - hwB) * 2 * h0 - h0, y0b);
      c.lineTo((sB + hwB) * 2 * h0 - h0, y0b);
      c.lineTo((sB + hwB) * 2 * h1 - h1, y1b);
      c.lineTo((sB - hwB) * 2 * h1 - h1, y1b);

      c.fillStyle = al(br * 23 + 7) > 0.45 ? om(56, 34, 26, 0.70) : om(96, 104, 62, 0.45);
      c.fill();
    }
    c.beginPath();
    c.ellipse(-eaveX * 0.62, eaveY - (eaveY - ridgeY) * 0.20,
              eaveX * 0.22, (eaveY - ridgeY) * 0.16, 0, 0, TAU);
    c.fillStyle = om(92, 108, 62, 0.28);
    c.fill();
    c.restore();

    // ---- rive basse : bouts d'imbrex et ombre portee sur le mur ----
    for (var eb = 0; eb < nT; eb++) {
      var se = (eb + 0.5) / nT;
      var xc = se * 2 * eaveX - eaveX;
      var rw2 = eaveX / nT * 0.5;
      c.beginPath();
      c.ellipse(xc, eaveY, rw2, H * 0.016, 0, 0, Math.PI);
      var geb = c.createLinearGradient(xc - rw2, 0, xc + rw2, 0);
      geb.addColorStop(0, om(92, 46, 34));
      geb.addColorStop(0.72, om(212, 130, 92));
      geb.addColorStop(1, om(148, 82, 58));

      c.fill();
    }
    c.fillStyle = om(44, 26, 20, 0.5);
    c.fillRect(-eaveX, eaveY - H * 0.006, eaveX * 2, H * 0.006);

    ges.addColorStop(0, om(34, 26, 18, 0.46));
    ges.addColorStop(1, om(34, 26, 18, 0));
    c.fillStyle = ges;
    c.fillRect(-wx, eaveY + H * 0.014, wx * 2, H * 0.062);

    for (var rg = 0; rg < nT; rg++) {
      var sr = (rg + 0.5) / nT;
      var xrc = sr * 2 * ridgeX - ridgeX;
      var rwr = ridgeX / nT * 0.62;
      c.beginPath();
      c.ellipse(xrc, ridgeY + H * 0.002, rwr, H * 0.022, 0, Math.PI, TAU);
      var grg = c.createLinearGradient(xrc - rwr, 0, xrc + rwr, 0);
      grg.addColorStop(0, om(104, 54, 40));
      grg.addColorStop(0.74, om(224, 142, 100));
      grg.addColorStop(1, om(160, 90, 62));
      c.fillStyle = grg;
      c.fill();
    }

    // ---- vigne grimpante ----
    c.save();
    c.lineCap = "round";
    var vx = -L * 0.375;
    var lwV = Math.max(0.8, L * 0.008);
    c.strokeStyle = om(78, 66, 46);
    c.lineWidth = lwV;
    c.beginPath();
    c.moveTo(vx, -lwV * 0.6);
    var px2 = vx, py2 = -lwV * 0.6;

      py2 = ny;
    }
    c.stroke();
    for (var lf = 0; lf < 26; lf++) {
      var fu = lf / 26;
      var lx = vx + Math.sin(fu * 9 + al(lf) * 2) * L * 0.05 + (al(lf * 3) - 0.5) * L * 0.03;
      var lr = L * (0.012 + al(lf * 5) * 0.012);
      var ly = Math.min(-H * 0.53 * fu - H * 0.03, -lr * 0.80);
      c.beginPath();
      c.ellipse(lx, ly, lr, lr * 0.78, al(lf * 7) * TAU, 0, TAU);
      c.fillStyle = al(lf * 11) > 0.5 ? om(104, 132, 66) : om(66, 92, 46);
      c.fill();
    }
    c.restore();
    touffe(-wx + L * 0.05, -H * 0.005, H * 0.035, 301);
    touffe(wx - L * 0.02, -H * 0.005, H * 0.028, 337);
    touffe(L * 0.02, plinthY + H * 0.002, H * 0.022, 373);

    // ---- brasero de seuil ----
    var brx = L * 0.44, bry = -H * 0.10;
    c.save();
    var lwB = Math.max(0.8, L * 0.009);

    c.lineWidth = lwB;

    c.moveTo(brx + L * 0.03, -lwB * 0.6);
    c.lineTo(brx, bry + H * 0.012);
    c.moveTo(brx, -lwB * 0.6);
    c.lineTo(brx, bry + H * 0.012);
    c.stroke();
    c.restore();
    c.beginPath();
    c.moveTo(brx - L * 0.045, bry);
    c.lineTo(brx + L * 0.045, bry);
    c.lineTo(brx + L * 0.03, bry + H * 0.030);
    c.lineTo(brx - L * 0.03, bry + H * 0.030);
    c.closePath();
    var gbr = c.createLinearGradient(brx - L * 0.045, 0, brx + L * 0.045, 0);
    gbr.addColorStop(0, om(58, 46, 36));
    gbr.addColorStop(0.72, om(146, 118, 78));
    gbr.addColorStop(1, om(96, 78, 54));
    c.fillStyle = gbr;
    c.fill();
    c.fillStyle = om(212, 178, 112, 0.55);
    c.fillRect(brx - L * 0.045, bry, L * 0.09, H * 0.004);
    // le halo doit aussi tenir dans la largeur, pas seulement dans la hauteur
    flamme(brx, bry, Math.min(H * 0.026, L * 0.020), 401);

    c.restore();
  }

  function mon1(c, L, H, om, al, nuit, t) {
    c.save();

    var TAU = 6.2831853;
    var ys = -H * 0.10;            // dessus du stylobate
    var yShaft = -H * 0.60;
    var yEch = yShaft - H * 0.021;
    var yCol = yEch - H * 0.019;   // dessus de l'abaque
    var yArch = -H * 0.716;
    var yFrieze = -H * 0.798;
    var yCorn = -H * 0.840;
    var apexY = -H * 0.985;
    var axW = L * 0.452;
    var cornW = L * 0.498;
    var nCol = 6;
    var colX0 = -L * 0.385, colDx = (L * 0.385 * 2) / (nCol - 1);
    var rb = L * 0.037;
    var triW = L * 0.040;
    var nTri = nCol * 2 - 1;

    function flamme(fx, fy, fs, seed) {
      if (nuit <= 0.02) return;
      c.save();
      c.globalCompositeOperation = "lighter";
      c.beginPath();
      c.rect(-L * 0.6, -H * 1.2, L * 1.2, H * 1.2);
      c.clip();
      var halo = c.createRadialGradient(fx, fy - fs * 0.7, 0, fx, fy - fs * 0.7, fs * 7);
      halo.addColorStop(0, "rgba(255,202,124," + (0.42 * nuit).toFixed(3) + ")");
      halo.addColorStop(0.32, "rgba(255,146,58," + (0.16 * nuit).toFixed(3) + ")");
      halo.addColorStop(1, "rgba(255,112,32,0)");
      c.fillStyle = halo;
      c.beginPath();
      c.arc(fx, fy - fs * 0.7, fs * 7, 0, TAU);
      c.fill();
      for (var i = 0; i < 12; i++) {
        var ph = t * (0.48 + al(seed + i) * 0.5) + al(seed + i + 19) * TAU;
        var sway = Math.sin(ph) * fs * 0.34;
        var hgt = fs * (1.3 + 1.6 * al(seed + i + 43)) * (0.74 + 0.26 * Math.sin(ph * 1.6));
        var wid = fs * (0.24 + 0.34 * al(seed + i + 67));
        var a = nuit * (0.13 + 0.20 * al(seed + i + 11));
        c.fillStyle = (i % 4 === 0)
          ? "rgba(255,242,204," + a.toFixed(3) + ")"
          : "rgba(255,146,48," + a.toFixed(3) + ")";
        c.beginPath();
        c.moveTo(fx - wid, fy);
        c.quadraticCurveTo(fx - wid + sway * 0.6, fy - hgt * 0.55, fx + sway, fy - hgt);
        c.quadraticCurveTo(fx + wid + sway * 0.6, fy - hgt * 0.55, fx + wid, fy);
        c.closePath();
        c.fill();
      }
      for (var e = 0; e < 5; e++) {
        var eph = (t * 0.22 + al(seed + e + 91)) % 1;
        var ey = fy - fs * (1.6 + eph * 3.4);
        var ex = fx + Math.sin(eph * 5 + al(seed + e + 97) * TAU) * fs * 0.6;
        c.fillStyle = "rgba(255,190,110," + (nuit * 0.5 * (1 - eph)).toFixed(3) + ")";
        c.beginPath();
        c.arc(ex, ey, fs * 0.07, 0, TAU);
        c.fill();
      }
      c.restore();
    }

    function touffe(gx, gy, gs, seed) {
      // le trait a une epaisseur plancher : remonter le pied pour rester au dessus du sol
      var lw = Math.max(0.6, gs * 0.15);
      var by = Math.min(gy, -lw * 0.6);
      c.save();
      c.lineCap = "round";
      c.lineWidth = lw;
      for (var i = 0; i < 10; i++) {
        var a = -1.5708 + (al(seed + i) - 0.5) * 2.0;
        var ln = gs * (0.5 + al(seed + i + 13) * 1.0);
        var sw = Math.sin(t * 0.28 + al(seed + i + 29) * TAU) * gs * 0.12;
        c.strokeStyle = al(seed + i + 3) > 0.5 ? om(124, 146, 76) : om(70, 92, 48);
        c.beginPath();
        c.moveTo(gx, by);
        c.quadraticCurveTo(gx + Math.cos(a) * ln * 0.45, by + Math.sin(a) * ln * 0.75,
                           gx + Math.cos(a) * ln + sw, by + Math.sin(a) * ln);
        c.stroke();
      }
      c.restore();
    }

    // Bas relief : sept tetes de haut, lance ou bouclier pour se lire en petit
    function figure(fx, fby, fh, dir, pose, seed) {
      var hr = fh * 0.085;
      var hipY = fby - fh * (pose === 2 ? 0.34 : 0.47);
      var shoY = fby - fh * (pose === 2 ? 0.66 : 0.79);
      c.save();
      c.lineCap = "round";
      c.lineJoin = "round";
      c.strokeStyle = om(46, 40, 30, 0.45);
      c.lineWidth = fh * 0.17;
      c.beginPath();
      c.moveTo(fx - fh * 0.035, hipY);
      c.lineTo(fx - fh * 0.035, shoY);
      c.stroke();
      c.strokeStyle = om(200, 192, 170);
      c.lineWidth = fh * 0.072;
      c.beginPath();
      if (pose === 2) {
        c.moveTo(fx, hipY);
        c.lineTo(fx + dir * fh * 0.27, hipY + fh * 0.05);
        c.lineTo(fx + dir * fh * 0.25, fby);
        c.moveTo(fx, hipY);
        c.lineTo(fx + dir * fh * 0.20, hipY + fh * 0.12);
        c.lineTo(fx + dir * fh * 0.16, fby);
      } else {
        c.moveTo(fx, hipY);
        c.lineTo(fx - dir * fh * 0.13, fby - fh * 0.23);
        c.lineTo(fx - dir * fh * 0.17, fby);
        c.moveTo(fx, hipY);
        c.lineTo(fx + dir * fh * 0.15, fby - fh * 0.21);
        c.lineTo(fx + dir * fh * 0.21, fby);
      }
      c.stroke();
      c.strokeStyle = om(216, 208, 186);
      c.lineWidth = fh * 0.125;
      c.beginPath();
      c.moveTo(fx, hipY);
      c.lineTo(fx + dir * fh * 0.025, shoY);
      c.stroke();
      c.lineWidth = fh * 0.055;
      c.beginPath();
      c.moveTo(fx + dir * fh * 0.01, shoY - fh * 0.02);
      c.lineTo(fx + dir * fh * 0.17, shoY - fh * (pose === 0 ? 0.14 : 0.01));
      c.moveTo(fx + dir * fh * 0.01, shoY - fh * 0.02);
      c.lineTo(fx - dir * fh * 0.13, shoY + fh * 0.10);
      c.stroke();
      c.fillStyle = om(228, 221, 200);
      c.beginPath();
      c.arc(fx + dir * fh * 0.035, shoY - hr * 1.3, hr, 0, TAU);
      c.fill();
      if (pose === 1) {
        c.fillStyle = om(146, 138, 118);
        c.beginPath();
        c.arc(fx + dir * fh * 0.17, shoY - fh * 0.03, fh * 0.16, 0, TAU);
        c.fill();
        c.strokeStyle = om(232, 225, 204);
        c.lineWidth = fh * 0.030;
        c.beginPath();
        c.arc(fx + dir * fh * 0.17, shoY - fh * 0.03, fh * 0.16, 0, TAU);
        c.stroke();
      } else if (pose === 0) {
        c.strokeStyle = om(210, 202, 180);
        c.lineWidth = fh * 0.030;
        c.beginPath();
        c.moveTo(fx + dir * fh * 0.24, fby);
        c.lineTo(fx + dir * fh * 0.10, fby - fh * 1.06);
        c.stroke();
      } else if (al(seed + 5) > 0.45) {
        c.strokeStyle = om(190, 182, 162);
        c.lineWidth = fh * 0.10;
        c.beginPath();
        c.moveTo(fx - dir * fh * 0.10, shoY + fh * 0.04);
        c.quadraticCurveTo(fx - dir * fh * 0.24, hipY, fx - dir * fh * 0.16, fby - fh * 0.06);
        c.stroke();
      }
      c.restore();
    }

    // Bandeau de marbre : degrade lateral, arete haute eclairee, ombre portee dessous
    function band(x0, x1, yTop, yBot, r, g, b) {
      var gg = c.createLinearGradient(x0, 0, x1, 0);
      gg.addColorStop(0, om((r * 0.46) | 0, (g * 0.46) | 0, (b * 0.48) | 0));
      gg.addColorStop(0.30, om((r * 0.70) | 0, (g * 0.70) | 0, (b * 0.72) | 0));
      gg.addColorStop(0.78, om(r, g, b));
      gg.addColorStop(1, om((r * 0.84) | 0, (g * 0.84) | 0, (b * 0.86) | 0));
      c.fillStyle = gg;
      c.fillRect(x0, yTop, x1 - x0, yBot - yTop);
      var gh = c.createLinearGradient(0, yTop, 0, yBot);
      gh.addColorStop(0, om(255, 252, 240, 0.18));
      gh.addColorStop(0.20, om(255, 252, 240, 0));
      gh.addColorStop(0.76, om(36, 30, 22, 0));
      gh.addColorStop(1, om(36, 30, 22, 0.28));
      c.fillStyle = gh;
      c.fillRect(x0, yTop, x1 - x0, yBot - yTop);
    }

    function rad(v) {
      return rb * (1 - 0.17 * v) + rb * 0.042 * Math.sin(Math.PI * Math.pow(v, 0.88));
    }

    function colonne(cx, seed) {
      var hh = ys - yShaft;
      var n = 18, i, u;
      c.save();
      c.beginPath();
      for (i = 0; i <= n; i++) { u = i / n; c.lineTo(cx + rad(u), ys - hh * u); }
      for (i = n; i >= 0; i--) { u = i / n; c.lineTo(cx - rad(u), ys - hh * u); }
      c.closePath();
      var gc = c.createLinearGradient(cx - rb, 0, cx + rb, 0);
      gc.addColorStop(0, om(84, 76, 62));
      gc.addColorStop(0.14, om(124, 114, 94));
      gc.addColorStop(0.42, om(198, 188, 162));
      gc.addColorStop(0.70, om(248, 242, 222));
      gc.addColorStop(0.90, om(220, 212, 188));
      gc.addColorStop(1, om(152, 142, 120));
      c.fillStyle = gc;
      c.fill();
      c.save();
      c.clip();
      var gvv = c.createLinearGradient(0, yShaft, 0, ys);
      gvv.addColorStop(0, om(255, 252, 238, 0.12));
      gvv.addColorStop(0.4, om(255, 252, 238, 0));
      gvv.addColorStop(1, om(44, 36, 26, 0.26));
      c.fillStyle = gvv;
      c.fillRect(cx - rb * 1.5, yShaft, rb * 3, hh);
      // cannelure : creux sombre puis arete eclairee, largeur apparente en sin(theta)
      var K = 9;
      for (var f = 0; f < K; f++) {
        var th = -1.5708 + Math.PI * (f + 0.5) / K;
        var lit = Math.max(0, Math.cos(th - 0.65));
        var hwT = Math.PI / (2 * K);
        c.beginPath();
        for (i = 0; i <= 8; i++) {
          u = i / 8;
          c.lineTo(cx + Math.sin(th - hwT * 0.62) * rad(u), ys - hh * u);
        }
        for (i = 8; i >= 0; i--) {
          u = i / 8;
          c.lineTo(cx + Math.sin(th + hwT * 0.62) * rad(u), ys - hh * u);
        }
        c.closePath();
        c.fillStyle = om(48, 40, 28, 0.10 + 0.20 * (1 - lit));
        c.fill();
        c.beginPath();
        for (i = 0; i <= 8; i++) {
          u = i / 8;
          c.lineTo(cx + Math.sin(th + hwT) * rad(u), ys - hh * u);
        }
        c.strokeStyle = om(255, 252, 238, 0.05 + 0.32 * lit);
        c.lineWidth = Math.max(0.5, rb * 0.09);
        c.stroke();
      }
      for (var d = 1; d < 6; d++) {
        var dy = ys - hh * (d / 6) + (al(seed + d) - 0.5) * H * 0.004;
        c.strokeStyle = om(62, 52, 38, 0.14);
        c.lineWidth = Math.max(0.5, rb * 0.075);
        c.beginPath();
        c.moveTo(cx - rb, dy);
        c.lineTo(cx + rb, dy);
        c.stroke();
        c.strokeStyle = om(255, 250, 234, 0.10);
        c.beginPath();
        c.moveTo(cx - rb, dy + rb * 0.09);
        c.lineTo(cx + rb, dy + rb * 0.09);
        c.stroke();
      }
      if (al(seed + 41) > 0.5) {
        var chy = ys - hh * (0.25 + al(seed + 43) * 0.5);
        c.beginPath();
        c.moveTo(cx - rad(0.5), chy);
        c.lineTo(cx - rad(0.5) + rb * 0.62, chy - H * 0.012);
        c.lineTo(cx - rad(0.5) + rb * 0.50, chy + H * 0.016);
        c.closePath();
        c.fillStyle = om(78, 68, 54, 0.5);
        c.fill();
      }
      c.restore();
      c.restore();

      var rt = rad(1);
      c.beginPath();
      c.moveTo(cx - rt, yShaft);
      c.bezierCurveTo(cx - rt * 1.12, yShaft - (yShaft - yEch) * 0.45,
                      cx - rt * 1.42, yShaft - (yShaft - yEch) * 0.72,
                      cx - rt * 1.62, yEch);
      c.lineTo(cx + rt * 1.62, yEch);
      c.bezierCurveTo(cx + rt * 1.42, yShaft - (yShaft - yEch) * 0.72,
                      cx + rt * 1.12, yShaft - (yShaft - yEch) * 0.45,
                      cx + rt, yShaft);
      c.closePath();
      var ge = c.createLinearGradient(cx - rt * 1.62, 0, cx + rt * 1.62, 0);
      ge.addColorStop(0, om(102, 92, 74));
      ge.addColorStop(0.42, om(196, 186, 160));
      ge.addColorStop(0.76, om(250, 244, 224));
      ge.addColorStop(1, om(166, 156, 132));
      c.fillStyle = ge;
      c.fill();
      for (var an = 0; an < 3; an++) {
        c.strokeStyle = om(58, 48, 36, 0.26);
        c.lineWidth = Math.max(0.4, rb * 0.055);
        c.beginPath();
        c.moveTo(cx - rt * (1.0 + an * 0.03), yShaft - (yShaft - yEch) * 0.12 * (an + 1));
        c.lineTo(cx + rt * (1.0 + an * 0.03), yShaft - (yShaft - yEch) * 0.12 * (an + 1));
        c.stroke();
      }
      band(cx - rt * 1.78, cx + rt * 1.78, yCol, yEch, 236, 229, 208);
    }

    // ---- ombre de contact ----
    c.beginPath();
    c.ellipse(-L * 0.04, -H * 0.022, L * 0.52, H * 0.022, 0, 0, TAU);
    c.fillStyle = om(28, 22, 16, 0.32);
    c.fill();

    // ---- crepidoma : trois degres ----
    for (var st = 0; st < 3; st++) {
      var sy0 = -H * 0.0333 * (st + 1);
      var sy1 = -H * 0.0333 * st;
      var sw = L * (0.53 - st * 0.03);
      band(-sw, sw, sy0, sy1, 214, 206, 184);
      var jx = -sw + L * 0.04;
      var ji = 0;
      while (jx < sw) {
        c.fillStyle = om(70, 60, 46, 0.24);
        c.fillRect(jx, sy0 + H * 0.004, Math.max(0.6, L * 0.004), sy1 - sy0 - H * 0.005);
        jx += L * (0.10 + al(st * 37 + ji * 3) * 0.05);
        ji++;
      }
    }
    // usure : angles ebreches, vegetation dans les joints
    c.beginPath();
    c.moveTo(L * 0.53, -H * 0.0333);
    c.lineTo(L * 0.53, -H * 0.010);
    c.lineTo(L * 0.487, -H * 0.0333);
    c.closePath();
    c.fillStyle = om(96, 86, 68, 0.55);
    c.fill();
    c.beginPath();
    c.moveTo(-L * 0.50, -H * 0.0666);
    c.lineTo(-L * 0.455, -H * 0.0666);
    c.lineTo(-L * 0.50, -H * 0.045);
    c.closePath();
    c.fillStyle = om(88, 78, 62, 0.5);
    c.fill();
    touffe(-L * 0.44, -H * 0.0666, H * 0.024, 11);
    touffe(L * 0.30, -H * 0.0333, H * 0.020, 47);
    touffe(L * 0.46, -H * 0.010, H * 0.018, 83);

    // ---- peristyle : le vide entre les futs est le plan le plus sombre ----
    var voidX = L * 0.42;
    var gvd = c.createLinearGradient(0, yCol, 0, ys);
    gvd.addColorStop(0, om(10, 9, 9));
    gvd.addColorStop(0.6, om(20, 18, 17));
    gvd.addColorStop(1, om(34, 30, 26));
    c.fillStyle = gvd;
    c.fillRect(-voidX, yCol, voidX * 2, ys - yCol);
    var cellaX = L * 0.30, cellaTop = -H * 0.555;
    var gce = c.createLinearGradient(-cellaX, 0, cellaX, 0);
    gce.addColorStop(0, om(38, 34, 29));
    gce.addColorStop(0.7, om(74, 68, 58));
    gce.addColorStop(1, om(56, 51, 43));
    c.fillStyle = gce;
    c.fillRect(-cellaX, cellaTop, cellaX * 2, ys - cellaTop);
    for (var cb = 1; cb < 6; cb++) {
      c.fillStyle = om(20, 18, 15, 0.35);
      c.fillRect(-cellaX, cellaTop + (ys - cellaTop) * (cb / 6), cellaX * 2, Math.max(0.6, H * 0.003));
    }
    c.fillStyle = om(16, 14, 12, 0.55);
    c.fillRect(-cellaX, cellaTop, cellaX * 2, H * 0.020);

    var dxc = L * 0.062, dTopC = -H * 0.40;
    band(-dxc - L * 0.022, dxc + L * 0.022, dTopC - H * 0.036, ys, 176, 168, 148);
    c.fillStyle = om(8, 7, 7);
    c.fillRect(-dxc, dTopC, dxc * 2, ys - dTopC);
    if (nuit > 0.02) {
      c.save();
      c.globalCompositeOperation = "lighter";
      var gdo = c.createLinearGradient(0, ys, 0, dTopC);
      gdo.addColorStop(0, "rgba(255,164,74," + (0.42 * nuit).toFixed(3) + ")");
      gdo.addColorStop(1, "rgba(255,130,40,0)");
      c.fillStyle = gdo;
      c.fillRect(-dxc, dTopC, dxc * 2, ys - dTopC);
      c.restore();
    }

    for (var cc = 0; cc < nCol; cc++) colonne(colX0 + cc * colDx, cc * 29 + 5);

    // ---- architrave, regules et gouttes ----
    band(-axW, axW, yArch, yCol, 232, 225, 204);
    c.fillStyle = om(44, 36, 26, 0.30);
    c.fillRect(-axW, yCol - H * 0.008, axW * 2, H * 0.008);
    for (var rg2 = 0; rg2 < nTri; rg2++) {
      var tcx = colX0 + rg2 * colDx * 0.5;
      band(tcx - triW * 0.55, tcx + triW * 0.55, yArch - H * 0.012, yArch, 216, 208, 186);
      for (var gu = 0; gu < 6; gu++) {
        var gx2 = tcx - triW * 0.44 + gu * triW * 0.176;
        c.beginPath();
        c.moveTo(gx2 - triW * 0.05, yArch - H * 0.012);
        c.lineTo(gx2 + triW * 0.05, yArch - H * 0.012);
        c.lineTo(gx2 + triW * 0.03, yArch - H * 0.028);
        c.lineTo(gx2 - triW * 0.03, yArch - H * 0.028);
        c.closePath();
        c.fillStyle = om(198, 190, 168);
        c.fill();
        c.fillStyle = om(64, 54, 40, 0.35);
        c.fillRect(gx2 - triW * 0.05, yArch - H * 0.014, triW * 0.03, H * 0.014);
      }
    }

    // ---- frise dorique : metopes en creux, triglyphes en saillie ----
    c.fillStyle = om(52, 46, 36);
    c.fillRect(-axW, yFrieze, axW * 2, yArch - yFrieze);
    for (var mt = 0; mt < nTri - 1; mt++) {
      var mx0 = colX0 + mt * colDx * 0.5 + triW * 0.55;
      var mx1 = colX0 + (mt + 1) * colDx * 0.5 - triW * 0.55;
      var gmt = c.createLinearGradient(mx0, 0, mx1, 0);
      gmt.addColorStop(0, om(78, 72, 60));
      gmt.addColorStop(0.72, om(150, 142, 122));
      gmt.addColorStop(1, om(112, 105, 88));
      c.fillStyle = gmt;
      c.fillRect(mx0, yFrieze, mx1 - mx0, yArch - yFrieze);
      c.fillStyle = om(24, 20, 15, 0.55);
      c.fillRect(mx0, yFrieze, mx1 - mx0, H * 0.010);
      c.fillStyle = om(24, 20, 15, 0.40);
      c.fillRect(mx0, yFrieze, Math.max(0.8, L * 0.006), yArch - yFrieze);
      c.save();
      c.beginPath();
      c.rect(mx0, yFrieze, mx1 - mx0, yArch - yFrieze);
      c.clip();
      var fh = (yArch - yFrieze) * 0.76;
      var fby = yArch - (yArch - yFrieze) * 0.10;
      figure(mx0 + (mx1 - mx0) * 0.30, fby, fh, 1, al(mt * 7 + 1) > 0.45 ? 1 : 0, mt * 7);
      figure(mx0 + (mx1 - mx0) * 0.72, fby, fh, -1, al(mt * 7 + 2) > 0.55 ? 1 : 0, mt * 7 + 3);
      c.restore();
    }
    for (var tg = 0; tg < nTri; tg++) {
      var tx = colX0 + tg * colDx * 0.5;
      band(tx - triW * 0.5, tx + triW * 0.5, yFrieze, yArch, 240, 233, 212);
      for (var gr3 = 0; gr3 < 2; gr3++) {
        var gxx = tx - triW * 0.16 + gr3 * triW * 0.32;
        c.fillStyle = om(58, 50, 38, 0.65);
        c.fillRect(gxx - triW * 0.035, yFrieze + H * 0.004, triW * 0.07, (yArch - yFrieze) - H * 0.004);
        c.fillStyle = om(255, 252, 240, 0.30);
        c.fillRect(gxx + triW * 0.035, yFrieze + H * 0.004, triW * 0.022, (yArch - yFrieze) - H * 0.004);
      }
      c.fillStyle = om(58, 50, 38, 0.5);
      c.fillRect(tx - triW * 0.5, yFrieze + H * 0.004, triW * 0.04, (yArch - yFrieze) - H * 0.004);
      c.fillRect(tx + triW * 0.46, yFrieze + H * 0.004, triW * 0.04, (yArch - yFrieze) - H * 0.004);
    }

    // ---- geison et mutules ----
    for (var mu = 0; mu < nTri; mu++) {
      var mux = colX0 + mu * colDx * 0.5;
      band(mux - triW * 0.72, mux + triW * 0.72, yFrieze - H * 0.014, yFrieze, 206, 198, 176);
      c.fillStyle = om(40, 34, 24, 0.42);
      c.fillRect(mux - triW * 0.72, yFrieze - H * 0.002, triW * 1.44, H * 0.004);
    }
    band(-cornW, cornW, yCorn, yFrieze - H * 0.014, 240, 233, 212);
    c.fillStyle = om(38, 32, 22, 0.42);
    c.fillRect(-cornW, yFrieze - H * 0.018, cornW * 2, H * 0.006);

    // toiture entrevue derriere le fronton : decalee pour ouvrir un troisieme plan
    c.save();
    c.beginPath();
    c.moveTo(-cornW + L * 0.03, yCorn - H * 0.004);
    c.lineTo(L * 0.03, apexY - H * 0.012);
    c.lineTo(cornW + L * 0.03, yCorn - H * 0.004);
    c.closePath();
    var grf = c.createLinearGradient(-cornW, 0, cornW, 0);
    grf.addColorStop(0, om(72, 40, 30));
    grf.addColorStop(0.8, om(148, 84, 58));
    grf.addColorStop(1, om(112, 62, 44));
    c.fillStyle = grf;
    c.fill();
    c.clip();
    for (var tl = 0; tl < 9; tl++) {
      c.fillStyle = om(46, 26, 20, 0.35);
      c.fillRect(-cornW, yCorn - H * 0.016 * tl, cornW * 2, Math.max(0.6, H * 0.004));
    }
    c.restore();

    // ---- fronton et tympan ----
    c.save();
    c.beginPath();
    c.moveTo(-cornW, yCorn);
    c.lineTo(0, apexY);
    c.lineTo(cornW, yCorn);
    c.closePath();
    var gtp = c.createLinearGradient(-cornW, 0, cornW, 0);
    gtp.addColorStop(0, om(96, 88, 72));
    gtp.addColorStop(0.55, om(150, 142, 122));
    gtp.addColorStop(1, om(190, 182, 158));
    c.fillStyle = gtp;
    c.fill();
    c.save();
    c.clip();
    var gtp2 = c.createLinearGradient(0, apexY, 0, yCorn);
    gtp2.addColorStop(0, om(22, 18, 13, 0.50));
    gtp2.addColorStop(0.5, om(22, 18, 13, 0.16));
    gtp2.addColorStop(1, om(22, 18, 13, 0.42));
    c.fillStyle = gtp2;
    c.fillRect(-cornW, apexY, cornW * 2, yCorn - apexY);
    // groupe sculpte : debout au centre, assis puis couches vers les angles
    for (var sc2 = 0; sc2 < 7; sc2++) {
      var sx2 = -cornW * 0.84 + ((sc2 + 0.5) / 7) * cornW * 1.68;
      var room = (yCorn - apexY) * (1 - Math.abs(sx2) / cornW) * 0.88;
      var fby2 = yCorn - H * 0.008;
      var dir2 = sx2 < 0 ? 1 : -1;
      var slot = Math.abs(sc2 - 3);
      if (slot >= 3) {
        c.save();
        c.translate(sx2 - dir2 * room * 0.3, fby2);
        c.rotate(dir2 * 1.35);
        figure(0, 0, Math.min((yCorn - apexY) * 0.52, cornW * 0.30), 1, 2, sc2 * 11);
        c.restore();
      } else if (room > H * 0.010) {
        figure(sx2, fby2, room, dir2, slot === 0 ? 0 : (slot === 1 ? 1 : 2), sc2 * 11);
      }
    }
    c.restore();
    c.restore();

    // ---- corniches rampantes ----
    c.save();
    c.lineWidth = Math.max(1.2, H * 0.020);
    c.strokeStyle = om(120, 112, 94);
    c.beginPath();
    c.moveTo(-cornW, yCorn);
    c.lineTo(0, apexY);
    c.stroke();
    c.strokeStyle = om(246, 240, 220);
    c.beginPath();
    c.moveTo(cornW, yCorn);
    c.lineTo(0, apexY);
    c.stroke();
    c.lineWidth = Math.max(0.5, H * 0.005);
    c.strokeStyle = om(255, 253, 244, 0.35);
    c.beginPath();
    c.moveTo(-cornW, yCorn - H * 0.011);
    c.lineTo(0, apexY - H * 0.011);
    c.lineTo(cornW, yCorn - H * 0.011);
    c.stroke();
    c.restore();

    // ---- acroteres : palmettes, celle de l'angle gauche est rompue ----
    function palmette(px, py, ps, broken) {
      c.save();
      band(px - ps * 0.5, px + ps * 0.5, py, py + ps * 0.36, 226, 219, 198);
      if (!broken) {
        c.lineCap = "round";
        for (var pf = 0; pf < 7; pf++) {
          var ang = -1.5708 + (pf - 3) * 0.30;
          var ln = ps * (1.5 - Math.abs(pf - 3) * 0.20);
          var dark = Math.abs(pf - 3) * 24;
          c.strokeStyle = om(244 - dark, 237 - dark, 216 - dark);
          c.lineWidth = Math.max(0.8, ps * 0.16);
          c.beginPath();
          c.moveTo(px, py);
          c.quadraticCurveTo(px + Math.cos(ang) * ln * 0.3, py + Math.sin(ang) * ln * 0.8,
                             px + Math.cos(ang) * ln, py + Math.sin(ang) * ln);
          c.stroke();
        }
      }
      c.restore();
    }
    palmette(0, apexY, H * 0.030, false);
    palmette(cornW, yCorn, H * 0.024, false);
    palmette(-cornW, yCorn, H * 0.024, true);
    c.beginPath();
    c.moveTo(-cornW - H * 0.012, yCorn);
    c.lineTo(-cornW + H * 0.010, yCorn);
    c.lineTo(-cornW + H * 0.002, yCorn - H * 0.014);
    c.closePath();
    c.fillStyle = om(112, 104, 86);
    c.fill();

    // ---- fissures et salissures du soubassement ----
    c.save();
    c.lineCap = "round";
    for (var cr = 0; cr < 5; cr++) {
      var crx = -L * 0.42 + al(cr * 19 + 1) * L * 0.84;
      var cry = -H * 0.098 + al(cr * 19 + 2) * H * 0.02;
      c.strokeStyle = om(58, 50, 38, 0.32);
      c.lineWidth = Math.max(0.5, L * 0.003);
      c.beginPath();
      c.moveTo(crx, cry);
      c.lineTo(crx + (al(cr * 19 + 3) - 0.5) * L * 0.09, cry + H * 0.020);
      c.lineTo(crx + (al(cr * 19 + 4) - 0.5) * L * 0.13, cry + H * 0.040);
      c.stroke();
    }
    c.restore();
    var gmo = c.createLinearGradient(0, ys - H * 0.02, 0, ys + H * 0.03);
    gmo.addColorStop(0, om(96, 104, 66, 0));
    gmo.addColorStop(1, om(96, 104, 66, 0.22));
    c.fillStyle = gmo;
    c.fillRect(-L * 0.53, ys - H * 0.02, L * 1.06, H * 0.05);

    // ---- braseros du parvis ----
    function brasero(bx, seed) {
      var topY = ys - H * 0.085;
      c.save();
      c.strokeStyle = om(72, 60, 46);
      c.lineWidth = Math.max(0.9, L * 0.007);
      c.beginPath();
      c.moveTo(bx - L * 0.022, ys);
      c.lineTo(bx, topY + H * 0.012);
      c.moveTo(bx + L * 0.022, ys);
      c.lineTo(bx, topY + H * 0.012);
      c.moveTo(bx, ys);
      c.lineTo(bx, topY + H * 0.012);
      c.stroke();
      c.restore();
      c.beginPath();
      c.moveTo(bx - L * 0.036, topY);
      c.lineTo(bx + L * 0.036, topY);
      c.lineTo(bx + L * 0.024, topY + H * 0.026);
      c.lineTo(bx - L * 0.024, topY + H * 0.026);
      c.closePath();
      var gbo = c.createLinearGradient(bx - L * 0.036, 0, bx + L * 0.036, 0);
      gbo.addColorStop(0, om(58, 48, 34));
      gbo.addColorStop(0.72, om(158, 126, 72));
      gbo.addColorStop(1, om(104, 84, 52));
      c.fillStyle = gbo;
      c.fill();
      c.fillStyle = om(216, 180, 110, 0.6);
      c.fillRect(bx - L * 0.036, topY, L * 0.072, H * 0.004);
      // le halo doit aussi tenir dans la largeur, pas seulement dans la hauteur
      flamme(bx, topY, Math.min(H * 0.030, L * 0.026), seed);
    }
    brasero(-L * 0.215, 601);
    brasero(L * 0.215, 641);
    if (nuit > 0.02) {
      c.save();
      c.globalCompositeOperation = "lighter";
      var gsp = c.createLinearGradient(0, ys, 0, -H * 0.45);
      gsp.addColorStop(0, "rgba(255,158,72," + (0.18 * nuit).toFixed(3) + ")");
      gsp.addColorStop(1, "rgba(255,140,50,0)");
      c.fillStyle = gsp;
      c.fillRect(-L * 0.42, -H * 0.45, L * 0.84, ys + H * 0.45);
      c.restore();
    }

    c.restore();
  }

  function bat2(c, L, H, om, al, nuit, t) {
    c.save();

    var seed = 11;
    var r = function (i) { return al(seed + i); };

    var groundW = L * 0.86;            // rez-de-chaussee
    var overW = L * 1.0;               // etage en encorbellement, plus large
    var gx0 = -groundW / 2, gx1 = groundW / 2;
    var ox0 = -overW / 2, ox1 = overW / 2;

    var yGround = 0;
    var ySill = -H * 0.40;             // sablière basse de l'étage
    var yJetty = -H * 0.44;            // dessous de l'encorbellement
    var yTop = -H * 0.74;              // sablière haute, base de toiture
    var yRidge = -H * 1.06;            // faîtage

    // ---------- ombre portee au sol ----------
    c.save();
    c.globalAlpha = 0.28;
    c.fillStyle = om(28, 24, 20);
    c.beginPath();
    c.ellipse(-L * 0.06, -H * 0.006, overW * 0.62, H * 0.028, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();

    // ---------- plan 1 : soubassement de pierre ----------
    var yBase = -H * 0.085;
    c.fillStyle = om(122, 114, 100);
    c.fillRect(gx0, yBase, groundW, -yBase);
    c.fillStyle = om(96, 88, 76);
    c.fillRect(gx0, yBase, groundW * 0.42, -yBase);
    // moellons du soubassement
    for (var sr = 0; sr < 2; sr++) {
      var syT = yBase * (1 - sr / 2);
      var syB = yBase * (1 - (sr + 1) / 2);
      var sx = gx0 + (sr % 2 ? groundW * 0.09 : 0);
      var k = 0;
      while (sx < gx1) {
        var sw = groundW * (0.10 + r(sr * 9 + k) * 0.07);
        if (sx + sw > gx1) sw = gx1 - sx;
        var lit = (sx + sw / 2 - gx0) / groundW;
        var sv = 106 + lit * 38 + r(sr * 13 + k) * 14;
        c.fillStyle = om(sv, sv * 0.93, sv * 0.82);
        c.fillRect(sx + 0.6, syB + 0.6, sw - 1.2, syT - syB - 1.2);
        sx += sw;
        k++;
      }
    }

    // ---------- plan 1 : torchis du rez-de-chaussee ----------
    c.fillStyle = om(198, 186, 162);
    c.fillRect(gx0, ySill, groundW, ySill * -1 + yBase);
    c.fillStyle = om(168, 156, 134);
    c.fillRect(gx0, ySill, groundW * 0.40, ySill * -1 + yBase);
    // grain irregulier du torchis
    for (var g = 0; g < 46; g++) {
      var gxp = gx0 + r(g * 3) * groundW;
      var gyp = ySill + r(g * 3 + 1) * (yBase - ySill);
      var gs = 1 + r(g * 3 + 2) * 2.4;
      c.fillStyle = om(150, 140, 120, 0.16 + r(g * 5) * 0.16);
      c.beginPath();
      c.ellipse(gxp, gyp, gs, gs * 0.6, 0, 0, Math.PI * 2);
      c.fill();
    }

    // ---------- plan 2 : etage en encorbellement ----------
    var upH = ySill - yTop;
    c.fillStyle = om(206, 194, 170);
    c.fillRect(ox0, yTop, overW, upH);
    c.fillStyle = om(174, 162, 140);
    c.fillRect(ox0, yTop, overW * 0.40, upH);
    for (var g2 = 0; g2 < 54; g2++) {
      var g2x = ox0 + r(200 + g2 * 3) * overW;
      var g2y = yTop + r(200 + g2 * 3 + 1) * upH;
      var g2s = 1 + r(200 + g2 * 3 + 2) * 2.6;
      c.fillStyle = om(154, 144, 124, 0.14 + r(200 + g2 * 5) * 0.16);
      c.beginPath();
      c.ellipse(g2x, g2y, g2s, g2s * 0.6, 0, 0, Math.PI * 2);
      c.fill();
    }

    // ---------- dessous de l'encorbellement et corbeaux ----------
    c.fillStyle = om(74, 58, 42);
    c.fillRect(ox0, ySill, overW, yJetty - ySill);
    var beamW = L * 0.030;
    for (var cb = 0; cb < 5; cb++) {
      var cbx = ox0 + overW * (0.08 + cb * 0.21);
      c.fillStyle = om(96, 74, 52);
      c.beginPath();
      c.moveTo(cbx, yJetty);
      c.lineTo(cbx + beamW, yJetty);
      c.lineTo(cbx + beamW * 0.55, ySill - upH * 0.10);
      c.lineTo(cbx, ySill - upH * 0.04);
      c.closePath();
      c.fill();
      c.fillStyle = om(58, 44, 32, 0.5);
      c.fillRect(cbx, yJetty, beamW * 0.35, ySill - yJetty);
    }

    // ---------- pans de bois ----------
    var woodLight = om(126, 96, 66);
    var woodDark = om(72, 54, 38);
    var woodMid = om(98, 76, 52);

    // Le bois recoit sa propre lumiere : face droite claire, gauche sombre.
    var timber = function (x0, y0, x1, y1, w) {
      var dx = x1 - x0, dy = y1 - y0;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var h = w / 2;
      c.fillStyle = woodMid;
      c.beginPath();
      c.moveTo(x0 + nx * h, y0 + ny * h);
      c.lineTo(x1 + nx * h, y1 + ny * h);
      c.lineTo(x1 - nx * h, y1 - ny * h);
      c.lineTo(x0 - nx * h, y0 - ny * h);
      c.closePath();
      c.fill();
      var sgn = nx >= 0 ? 1 : -1;
      c.fillStyle = woodLight;
      c.beginPath();
      c.moveTo(x0 + nx * h * sgn, y0 + ny * h * sgn);
      c.lineTo(x1 + nx * h * sgn, y1 + ny * h * sgn);
      c.lineTo(x1 + nx * h * sgn * 0.42, y1 + ny * h * sgn * 0.42);
      c.lineTo(x0 + nx * h * sgn * 0.42, y0 + ny * h * sgn * 0.42);
      c.closePath();
      c.fill();
      c.fillStyle = woodDark;
      c.beginPath();
      c.moveTo(x0 - nx * h * sgn, y0 - ny * h * sgn);
      c.lineTo(x1 - nx * h * sgn, y1 - ny * h * sgn);
      c.lineTo(x1 - nx * h * sgn * 0.45, y1 - ny * h * sgn * 0.45);
      c.lineTo(x0 - nx * h * sgn * 0.45, y0 - ny * h * sgn * 0.45);
      c.closePath();
      c.fill();
    };

    var wPost = L * 0.052;
    var wRail = L * 0.042;
    var wBrace = L * 0.034;

    // sablieres horizontales
    timber(gx0, yBase, gx1, yBase, wRail);
    timber(gx0, ySill + wRail * 0.4, gx1, ySill + wRail * 0.4, wRail * 1.15);
    timber(ox0, yTop, ox1, yTop, wRail * 1.15);
    timber(ox0, ySill - wRail * 0.2, ox1, ySill - wRail * 0.2, wRail);

    // poteaux corniers et intermediaires du rez-de-chaussee
    var doorX0 = gx0 + groundW * 0.13;
    var doorX1 = doorX0 + groundW * 0.24;
    var gPosts = [gx0 + wPost / 2, doorX0, doorX1, gx0 + groundW * 0.62, gx1 - wPost / 2];
    for (var p = 0; p < gPosts.length; p++) {
      timber(gPosts[p], yBase, gPosts[p], ySill, wPost);
    }
    // decharges du rez-de-chaussee, en pied de poteau cornier
    timber(gx0 + wPost / 2, ySill * 0.30, gx0 + groundW * 0.13, ySill * 0.72, wBrace);
    timber(gx1 - wPost / 2, ySill * 0.30, gx1 - groundW * 0.16, ySill * 0.72, wBrace);

    // poteaux de l'etage
    var uPosts = [ox0 + wPost / 2, ox0 + overW * 0.26, ox0 + overW * 0.50,
                  ox0 + overW * 0.74, ox1 - wPost / 2];
    for (var p2 = 0; p2 < uPosts.length; p2++) {
      timber(uPosts[p2], ySill, uPosts[p2], yTop, wPost);
    }
    // guettes et decharges : les obliques partent du poteau vers la sabliere
    var mid = (ySill + yTop) / 2;
    timber(ox0 + wPost / 2, mid, ox0 + overW * 0.26, yTop + wRail * 0.5, wBrace);
    timber(ox0 + wPost / 2, mid, ox0 + overW * 0.26, ySill - wRail * 0.5, wBrace);
    timber(ox1 - wPost / 2, mid, ox0 + overW * 0.74, yTop + wRail * 0.5, wBrace);
    timber(ox1 - wPost / 2, mid, ox0 + overW * 0.74, ySill - wRail * 0.5, wBrace);
    // croix de Saint-Andre du panneau central
    timber(ox0 + overW * 0.50, ySill - wRail * 0.4, ox0 + overW * 0.74, yTop + wRail * 0.5, wBrace * 0.9);
    timber(ox0 + overW * 0.26, yTop + wRail * 0.5, ox0 + overW * 0.50, ySill - wRail * 0.4, wBrace * 0.9);
    // tournisses verticaux courts
    timber(ox0 + overW * 0.38, mid, ox0 + overW * 0.38, ySill - wRail * 0.4, wBrace * 0.8);
    timber(ox0 + overW * 0.62, mid, ox0 + overW * 0.62, yTop + wRail * 0.5, wBrace * 0.8);

    // ---------- porte ----------
    var dTop = ySill * 0.86;
    c.fillStyle = om(52, 38, 26);
    c.beginPath();
    c.moveTo(doorX0 + wPost * 0.4, 0);
    c.lineTo(doorX0 + wPost * 0.4, dTop + (doorX1 - doorX0) * 0.18);
    c.quadraticCurveTo((doorX0 + doorX1) / 2, dTop - (doorX1 - doorX0) * 0.16,
                       doorX1 - wPost * 0.4, dTop + (doorX1 - doorX0) * 0.18);
    c.lineTo(doorX1 - wPost * 0.4, 0);
    c.closePath();
    c.fill();
    c.save();
    c.clip();
    c.fillStyle = om(84, 62, 42);
    for (var dp = 0; dp < 4; dp++) {
      var dpx = doorX0 + wPost * 0.4 + dp * (doorX1 - doorX0) * 0.215;
      c.fillRect(dpx, ySill, (doorX1 - doorX0) * 0.16, -ySill);
    }
    c.fillStyle = om(120, 106, 92);
    c.fillRect(doorX0, dTop * 0.62, doorX1 - doorX0, (doorX1 - doorX0) * 0.055);
    c.fillRect(doorX0, dTop * 0.22, doorX1 - doorX0, (doorX1 - doorX0) * 0.055);
    c.restore();
    c.fillStyle = om(150, 138, 120);
    c.beginPath();
    c.arc(doorX1 - (doorX1 - doorX0) * 0.24, dTop * 0.44, L * 0.014, 0, Math.PI * 2);
    c.fill();

    // ---------- fenetres ----------
    var windows = [
      { x: ox0 + overW * 0.295, y: yTop + upH * 0.30, w: overW * 0.155, h: upH * 0.46, lit: 1 },
      { x: ox0 + overW * 0.535, y: yTop + upH * 0.30, w: overW * 0.155, h: upH * 0.46, lit: 1 },
      { x: gx0 + groundW * 0.66, y: ySill + (yBase - ySill) * 0.66, w: groundW * 0.20, h: (yBase - ySill) * 0.42, lit: 0 }
    ];
    for (var w2 = 0; w2 < windows.length; w2++) {
      var wn = windows[w2];
      // ebrasement : le tableau droit prend la lumiere
      c.fillStyle = om(60, 48, 36);
      c.fillRect(wn.x - 1.5, wn.y - 1.5, wn.w + 3, wn.h + 3);
      c.fillStyle = om(34, 28, 24);
      c.fillRect(wn.x, wn.y, wn.w, wn.h);
      // meneau + traverse
      c.fillStyle = om(88, 68, 48);
      c.fillRect(wn.x + wn.w / 2 - wn.w * 0.05, wn.y, wn.w * 0.10, wn.h);
      c.fillRect(wn.x, wn.y + wn.h * 0.46, wn.w, wn.h * 0.08);
      if (nuit > 0.02 && wn.lit) {
        c.save();
        c.globalCompositeOperation = "lighter";
        var flick = 0.86 + 0.14 * Math.sin(t * 1.3 + w2 * 2.1);
        c.fillStyle = "rgba(255,186,86," + (0.62 * nuit * flick) + ")";
        c.fillRect(wn.x, wn.y, wn.w, wn.h);
        var gr = c.createRadialGradient(wn.x + wn.w / 2, wn.y + wn.h / 2, 0,
                                        wn.x + wn.w / 2, wn.y + wn.h / 2, wn.w * 2.1);
        gr.addColorStop(0, "rgba(255,172,72," + (0.40 * nuit * flick) + ")");
        gr.addColorStop(1, "rgba(255,150,60,0)");
        c.fillStyle = gr;
        c.beginPath();
        c.arc(wn.x + wn.w / 2, wn.y + wn.h / 2, wn.w * 2.1, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // ---------- volets ouverts sur la fenetre du bas ----------
    var sw2 = windows[2];
    for (var sh = 0; sh < 2; sh++) {
      var sx2 = sh ? sw2.x + sw2.w : sw2.x - sw2.w * 0.42;
      c.fillStyle = sh ? om(112, 84, 56) : om(78, 58, 40);
      c.fillRect(sx2, sw2.y - 1, sw2.w * 0.42, sw2.h + 2);
      c.fillStyle = om(56, 42, 30, 0.55);
      c.fillRect(sx2, sw2.y + sw2.h * 0.42, sw2.w * 0.42, sw2.h * 0.10);
    }

    // ---------- toit de chaume en rangs ----------
    var eaveOver = L * 0.10;
    var rx0 = ox0 - eaveOver, rx1 = ox1 + eaveOver;
    var apex = -L * 0.02;
    c.beginPath();
    c.moveTo(rx0, yTop);
    c.lineTo(apex - L * 0.06, yRidge);
    c.lineTo(apex + L * 0.06, yRidge);
    c.lineTo(rx1, yTop);
    c.lineTo(rx1, yTop + H * 0.035);
    c.lineTo(rx0, yTop + H * 0.035);
    c.closePath();
    c.save();
    c.clip();
    c.fillStyle = om(150, 122, 74);
    c.fillRect(rx0 - 4, yRidge - 4, (rx1 - rx0) + 8, (yTop - yRidge) + H * 0.06);
    // versant gauche a l'ombre
    c.fillStyle = om(104, 84, 52);
    c.beginPath();
    c.moveTo(rx0 - 4, yTop + H * 0.05);
    c.lineTo(apex, yRidge - 4);
    c.lineTo(apex, yTop + H * 0.05);
    c.closePath();
    c.fill();
    // rangs de chaume
    var rows = 7;
    for (var rw = 0; rw < rows; rw++) {
      var ry = yTop + H * 0.02 - (rw / rows) * (yTop - yRidge + H * 0.02) * -1;
      ry = yTop + H * 0.02 + rw * ((yRidge - yTop - H * 0.02) / rows);
      c.fillStyle = om(70, 56, 34, 0.34);
      c.beginPath();
      c.moveTo(rx0 - 6, ry);
      for (var sxp = rx0 - 6; sxp <= rx1 + 6; sxp += (rx1 - rx0) / 14) {
        c.lineTo(sxp, ry + Math.sin(sxp * 0.16 + rw * 1.7) * H * 0.006 + H * 0.008);
      }
      c.lineTo(rx1 + 6, ry - H * 0.012);
      c.lineTo(rx0 - 6, ry - H * 0.012);
      c.closePath();
      c.fill();
    }
    // brins verticaux
    for (var st = 0; st < 60; st++) {
      var stx = rx0 + r(400 + st) * (rx1 - rx0);
      var sty = yTop + r(400 + st * 2) * (yRidge - yTop);
      c.fillStyle = om(190, 162, 104, 0.10 + r(400 + st * 3) * 0.14);
      c.fillRect(stx, sty, 1.2, H * 0.022);
    }
    c.restore();
    // faitage torsade
    c.fillStyle = om(118, 96, 58);
    c.beginPath();
    c.moveTo(apex - L * 0.085, yRidge + H * 0.012);
    c.quadraticCurveTo(apex, yRidge - H * 0.020, apex + L * 0.085, yRidge + H * 0.012);
    c.quadraticCurveTo(apex, yRidge + H * 0.030, apex - L * 0.085, yRidge + H * 0.012);
    c.closePath();
    c.fill();
    c.fillStyle = om(168, 142, 90);
    c.beginPath();
    c.moveTo(apex, yRidge - H * 0.011);
    c.quadraticCurveTo(apex + L * 0.05, yRidge - H * 0.006, apex + L * 0.085, yRidge + H * 0.012);
    c.quadraticCurveTo(apex + L * 0.04, yRidge + H * 0.004, apex, yRidge + H * 0.004);
    c.closePath();
    c.fill();
    // ombre de l'avant-toit sur la facade
    c.fillStyle = om(40, 32, 24, 0.30);
    c.fillRect(ox0, yTop + H * 0.032, overW, H * 0.026);

    // ---------- cheminee de pierre ----------
    var chX = ox0 + overW * 0.20, chW = L * 0.115;
    var chTop = yRidge - H * 0.11;
    c.fillStyle = om(126, 118, 106);
    c.fillRect(chX, chTop, chW, -chTop + yTop - H * 0.02);
    c.fillStyle = om(98, 90, 80);
    c.fillRect(chX, chTop, chW * 0.38, -chTop + yTop - H * 0.02);
    for (var cs = 0; cs < 6; cs++) {
      var csy = chTop + H * 0.020 + cs * H * 0.028;
      c.fillStyle = om(70, 64, 56, 0.32);
      c.fillRect(chX, csy, chW, 1.1);
      c.fillStyle = om(70, 64, 56, 0.22);
      c.fillRect(chX + chW * (cs % 2 ? 0.35 : 0.62), csy, 1.1, H * 0.028);
    }
    c.fillStyle = om(146, 138, 126);
    c.fillRect(chX - chW * 0.10, chTop, chW * 1.20, H * 0.020);
    c.fillStyle = om(30, 26, 24);
    c.fillRect(chX + chW * 0.16, chTop, chW * 0.68, H * 0.010);

    // ---------- linge tendu ----------
    var lx0 = gx1 - groundW * 0.02, lx1 = gx1 + L * 0.16;
    var sag = H * 0.03;
    c.strokeStyle = om(120, 110, 94, 0.7);
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(lx0, ySill + H * 0.05);
    c.quadraticCurveTo((lx0 + lx1) / 2, ySill + H * 0.05 + sag, lx1, ySill + H * 0.03);
    c.stroke();
    var clothCol = [[176, 92, 74], [96, 116, 148], [196, 182, 150]];
    for (var cl = 0; cl < 3; cl++) {
      var u = 0.20 + cl * 0.27;
      var cxp = lx0 + (lx1 - lx0) * u;
      var cyp = ySill + H * 0.05 + sag * 4 * u * (1 - u);
      var sway = Math.sin(t * 0.55 + cl * 1.9) * L * 0.012;
      var col = clothCol[cl];
      c.fillStyle = om(col[0], col[1], col[2]);
      c.beginPath();
      c.moveTo(cxp - L * 0.028, cyp);
      c.lineTo(cxp + L * 0.028, cyp);
      c.lineTo(cxp + L * 0.030 + sway, cyp + H * 0.075);
      c.lineTo(cxp - L * 0.026 + sway, cyp + H * 0.075);
      c.closePath();
      c.fill();
      c.fillStyle = om(col[0] * 0.7, col[1] * 0.7, col[2] * 0.7, 0.5);
      c.beginPath();
      c.moveTo(cxp - L * 0.028, cyp);
      c.lineTo(cxp - L * 0.010, cyp);
      c.lineTo(cxp - L * 0.008 + sway, cyp + H * 0.075);
      c.lineTo(cxp - L * 0.026 + sway, cyp + H * 0.075);
      c.closePath();
      c.fill();
    }

    // ---------- enseigne suspendue ----------
    var sgX = gx0 + groundW * 0.04;
    c.fillStyle = om(74, 56, 38);
    c.fillRect(sgX, ySill + H * 0.02, L * 0.13, H * 0.012);
    c.fillRect(sgX, ySill + H * 0.02, L * 0.010, H * 0.010);
    var swing = Math.sin(t * 0.7) * 0.09;
    c.save();
    c.translate(sgX + L * 0.115, ySill + H * 0.030);
    c.rotate(swing);
    c.strokeStyle = om(90, 84, 74);
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(-L * 0.03, 0); c.lineTo(-L * 0.02, H * 0.030);
    c.moveTo(L * 0.005, 0); c.lineTo(0, H * 0.030);
    c.stroke();
    c.fillStyle = om(120, 96, 62);
    c.fillRect(-L * 0.045, H * 0.030, L * 0.075, H * 0.070);
    c.fillStyle = om(82, 64, 42);
    c.fillRect(-L * 0.045, H * 0.030, L * 0.026, H * 0.070);
    c.fillStyle = om(210, 190, 140);
    c.beginPath();
    c.arc(-L * 0.008, H * 0.058, L * 0.014, Math.PI * 0.15, Math.PI * 1.15);
    c.lineTo(-L * 0.008, H * 0.082);
    c.closePath();
    c.fill();
    c.restore();

    // ---------- occlusion de contact et halo global ----------
    c.fillStyle = om(30, 26, 22, 0.30);
    c.fillRect(gx0, yBase - H * 0.012, groundW, H * 0.012);

    if (nuit > 0.02) {
      c.save();
      c.globalCompositeOperation = "lighter";
      var lampGr = c.createRadialGradient(0, ySill - upH * 0.3, 0, 0, ySill - upH * 0.3, L * 0.9);
      lampGr.addColorStop(0, "rgba(255,164,72," + (0.09 * nuit) + ")");
      lampGr.addColorStop(1, "rgba(255,150,60,0)");
      c.fillStyle = lampGr;
      c.beginPath();
      c.arc(0, ySill - upH * 0.3, L * 0.9, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    c.restore();
  }

  function mon2(c, L, H, om, al, nuit, t) {
    c.save();

    var seed = 71;
    var r = function (i) { return al(seed + i); };

    var baseW = L * 0.72;              // fruit : le donjon s'amincit vers le haut
    var topW = L * 0.58;
    var yBattl = -H * 0.80;            // niveau du chemin de ronde
    var yPara = -H * 0.90;             // haut des merlons
    var talusY = -H * 0.14;

    var widthAt = function (y) {
      var u = Math.min(1, Math.max(0, y / yBattl));
      return baseW + (topW - baseW) * u;
    };

    // ---------- ombre portee ----------
    c.save();
    c.globalAlpha = 0.30;
    c.fillStyle = om(26, 22, 18);
    c.beginPath();
    c.ellipse(-L * 0.05, -H * 0.005, L * 0.56, H * 0.022, 0, 0, Math.PI * 2);
    c.fill();
    c.restore();

    // ---------- talus en fruit ----------
    var talusW = L * 0.92;
    c.fillStyle = om(118, 112, 100);
    c.beginPath();
    c.moveTo(-talusW / 2, 0);
    c.lineTo(talusW / 2, 0);
    c.lineTo(baseW / 2, talusY);
    c.lineTo(-baseW / 2, talusY);
    c.closePath();
    c.fill();
    c.fillStyle = om(84, 78, 68);
    c.beginPath();
    c.moveTo(-talusW / 2, 0);
    c.lineTo(-talusW * 0.10, 0);
    c.lineTo(-baseW * 0.08, talusY);
    c.lineTo(-baseW / 2, talusY);
    c.closePath();
    c.fill();

    // ---------- corps : appareil de pierre en assises ----------
    var courses = 22;
    for (var i = 0; i < courses; i++) {
      var y0 = talusY + (yBattl - talusY) * (i / courses);
      var y1 = talusY + (yBattl - talusY) * ((i + 1) / courses);
      var w0 = widthAt(y0), w1 = widthAt(y1);
      var x0 = -w0 / 2, x1 = -w1 / 2;
      var stoneX = x0 + (i % 2 ? w0 * 0.055 : 0);
      var j = 0;
      while (stoneX < w0 / 2) {
        var sw = w0 * (0.085 + r(i * 17 + j * 5) * 0.055);
        if (stoneX + sw > w0 / 2) sw = w0 / 2 - stoneX;
        if (sw <= 0) break;
        // gradient horizontal : la face droite recoit le jour
        var lit = (stoneX + sw / 2 + w0 / 2) / w0;
        var v = 96 + lit * 62 + r(i * 23 + j * 7) * 16;
        c.fillStyle = om(v, v * 0.95, v * 0.86);
        c.fillRect(stoneX + 0.5, y1 + 0.5, sw - 1, y0 - y1 - 1);
        stoneX += sw;
        j++;
      }
      // rappel du fruit sur l'arete gauche
      c.fillStyle = om(46, 42, 36, 0.20);
      c.fillRect(-w0 / 2, y1, (w0 - w1) * 0.5 + w0 * 0.10, y0 - y1);
    }

    // ---------- chaines d'angle ----------
    for (var q = 0; q < 2; q++) {
      var side = q ? 1 : -1;
      for (var k2 = 0; k2 < 16; k2++) {
        var qy0 = talusY + (yBattl - talusY) * (k2 / 16);
        var qy1 = talusY + (yBattl - talusY) * ((k2 + 1) / 16);
        var qw = widthAt(qy0) / 2;
        var big = k2 % 2 === 0;
        var qwid = L * (big ? 0.075 : 0.048);
        c.fillStyle = side > 0 ? om(178, 170, 154) : om(112, 106, 94);
        if (side > 0) c.fillRect(qw - qwid, qy1, qwid, qy0 - qy1);
        else c.fillRect(-qw, qy1, qwid, qy0 - qy1);
        c.fillStyle = om(52, 48, 42, 0.30);
        c.fillRect(side > 0 ? qw - qwid : -qw, qy0 - 1, qwid, 1.2);
      }
    }

    // ---------- contrefort central en facade ----------
    var btW = L * 0.15;
    c.fillStyle = om(148, 142, 128);
    c.beginPath();
    c.moveTo(-btW / 2, talusY);
    c.lineTo(btW / 2, talusY);
    c.lineTo(btW * 0.40, -H * 0.58);
    c.lineTo(-btW * 0.40, -H * 0.58);
    c.closePath();
    c.fill();
    c.fillStyle = om(104, 98, 88);
    c.beginPath();
    c.moveTo(-btW / 2, talusY);
    c.lineTo(-btW * 0.14, talusY);
    c.lineTo(-btW * 0.12, -H * 0.58);
    c.lineTo(-btW * 0.40, -H * 0.58);
    c.closePath();
    c.fill();
    // glacis d'about du contrefort
    c.fillStyle = om(166, 158, 142);
    c.beginPath();
    c.moveTo(-btW * 0.40, -H * 0.58);
    c.lineTo(btW * 0.40, -H * 0.58);
    c.lineTo(btW * 0.10, -H * 0.635);
    c.lineTo(-btW * 0.10, -H * 0.635);
    c.closePath();
    c.fill();

    // ---------- porte en plein cintre ----------
    var dW = L * 0.20, dH = H * 0.24;
    c.fillStyle = om(150, 144, 130);
    c.beginPath();
    c.moveTo(-dW * 0.62, talusY);
    c.lineTo(-dW * 0.62, talusY - dH * 0.62);
    c.arc(0, talusY - dH * 0.62, dW * 0.62, Math.PI, 0);
    c.lineTo(dW * 0.62, talusY);
    c.closePath();
    c.fill();
    c.fillStyle = om(38, 32, 26);
    c.beginPath();
    c.moveTo(-dW * 0.46, talusY);
    c.lineTo(-dW * 0.46, talusY - dH * 0.62);
    c.arc(0, talusY - dH * 0.62, dW * 0.46, Math.PI, 0);
    c.lineTo(dW * 0.46, talusY);
    c.closePath();
    c.fill();
    c.save();
    c.clip();
    c.fillStyle = om(72, 52, 34);
    c.fillRect(-dW * 0.46, talusY - dH, dW * 0.92, dH);
    c.fillStyle = om(96, 72, 48);
    for (var dv = 0; dv < 5; dv++) {
      c.fillRect(-dW * 0.46 + dv * dW * 0.19, talusY - dH, dW * 0.10, dH);
    }
    c.fillStyle = om(118, 110, 98);
    c.fillRect(-dW * 0.46, talusY - dH * 0.30, dW * 0.92, dH * 0.055);
    c.fillRect(-dW * 0.46, talusY - dH * 0.62, dW * 0.92, dH * 0.055);
    c.restore();
    // claveaux du cintre
    for (var vs = 0; vs < 9; vs++) {
      var a = Math.PI + (vs + 0.5) / 9 * Math.PI;
      c.save();
      c.translate(Math.cos(a) * dW * 0.54, talusY - dH * 0.62 + Math.sin(a) * dW * 0.54);
      c.rotate(a + Math.PI / 2);
      var vl = 0.5 + (Math.cos(a) + 1) * 0.28;
      c.fillStyle = om(112 + vl * 68, 106 + vl * 64, 94 + vl * 58);
      c.fillRect(-dW * 0.055, -dW * 0.085, dW * 0.11, dW * 0.17);
      c.restore();
    }

    // ---------- archeres et fenetres geminees ----------
    var loops = [
      { x: -L * 0.24, y: -H * 0.30, h: H * 0.11 },
      { x: L * 0.22, y: -H * 0.30, h: H * 0.11 },
      { x: -L * 0.24, y: -H * 0.50, h: H * 0.11 },
      { x: L * 0.22, y: -H * 0.50, h: H * 0.11 }
    ];
    for (var lp = 0; lp < loops.length; lp++) {
      var lo = loops[lp];
      c.fillStyle = om(150, 144, 130);
      c.fillRect(lo.x - L * 0.020, lo.y - lo.h, L * 0.040, lo.h);
      c.fillStyle = om(28, 24, 20);
      c.fillRect(lo.x - L * 0.007, lo.y - lo.h, L * 0.014, lo.h);
      c.fillRect(lo.x - L * 0.022, lo.y - lo.h * 0.62, L * 0.044, L * 0.013);
      if (nuit > 0.02) {
        c.save();
        c.globalCompositeOperation = "lighter";
        var fk = 0.80 + 0.20 * Math.sin(t * 1.7 + lp * 2.4);
        c.fillStyle = "rgba(255,178,84," + (0.55 * nuit * fk) + ")";
        c.fillRect(lo.x - L * 0.007, lo.y - lo.h, L * 0.014, lo.h);
        c.restore();
      }
    }

    // fenetre geminee de la salle haute
    var gw = L * 0.22, gy = -H * 0.68, gh = H * 0.13;
    c.fillStyle = om(158, 150, 136);
    c.fillRect(-gw / 2 - L * 0.012, gy - gh - L * 0.012, gw + L * 0.024, gh + L * 0.024);
    for (var gb = 0; gb < 2; gb++) {
      var gbx = -gw / 2 + L * 0.012 + gb * (gw / 2 - L * 0.004);
      var gbw = gw / 2 - L * 0.028;
      c.fillStyle = om(30, 26, 22);
      c.beginPath();
      c.moveTo(gbx, gy);
      c.lineTo(gbx, gy - gh + gbw / 2);
      c.arc(gbx + gbw / 2, gy - gh + gbw / 2, gbw / 2, Math.PI, 0);
      c.lineTo(gbx + gbw, gy);
      c.closePath();
      c.fill();
      if (nuit > 0.02) {
        c.save();
        c.globalCompositeOperation = "lighter";
        var gf = 0.84 + 0.16 * Math.sin(t * 1.1 + gb * 1.6);
        c.fillStyle = "rgba(255,182,92," + (0.58 * nuit * gf) + ")";
        c.fillRect(gbx, gy - gh, gbw, gh);
        c.restore();
      }
    }
    // colonnette centrale
    c.fillStyle = om(172, 164, 148);
    c.fillRect(-L * 0.010, gy - gh * 0.86, L * 0.020, gh * 0.86);
    c.fillStyle = om(186, 178, 160);
    c.fillRect(-L * 0.020, gy - gh, L * 0.040, gh * 0.10);

    // ---------- corniche sur corbeaux (machicoulis) ----------
    var corbY = yBattl + H * 0.055;
    var corbW = widthAt(corbY);
    var nCorb = 11;
    for (var cbi = 0; cbi < nCorb; cbi++) {
      var cbx2 = -corbW / 2 + (cbi + 0.5) * (corbW / nCorb);
      c.fillStyle = om(130, 124, 110);
      c.beginPath();
      c.moveTo(cbx2 - corbW * 0.026, corbY);
      c.lineTo(cbx2 + corbW * 0.026, corbY);
      c.lineTo(cbx2 + corbW * 0.034, yBattl);
      c.lineTo(cbx2 - corbW * 0.034, yBattl);
      c.closePath();
      c.fill();
      c.fillStyle = om(174, 166, 150);
      c.fillRect(cbx2 + corbW * 0.012, yBattl, corbW * 0.022, corbY - yBattl);
      // vide entre corbeaux, la ou tombent les projectiles
      c.fillStyle = om(34, 30, 26, 0.55);
      c.fillRect(cbx2 + corbW * 0.030, yBattl, corbW / nCorb - corbW * 0.062, (corbY - yBattl) * 0.55);
    }
    // bandeau du chemin de ronde, plus large que le fut
    var wallW = widthAt(yBattl) + L * 0.10;
    c.fillStyle = om(152, 146, 132);
    c.fillRect(-wallW / 2, yBattl, wallW, H * 0.030);
    c.fillStyle = om(108, 102, 92);
    c.fillRect(-wallW / 2, yBattl, wallW * 0.34, H * 0.030);
    c.fillStyle = om(190, 182, 166);
    c.fillRect(-wallW / 2, yBattl, wallW, H * 0.006);

    // ---------- creneaux ----------
    var nMer = 7;
    var slot = wallW / (nMer * 2 - 1);
    for (var m = 0; m < nMer; m++) {
      var mx = -wallW / 2 + m * slot * 2;
      var mh = yPara - yBattl;
      c.fillStyle = om(150, 144, 130);
      c.fillRect(mx, yPara, slot, -mh);
      c.fillStyle = om(184, 176, 160);
      c.fillRect(mx + slot * 0.62, yPara, slot * 0.38, -mh);
      c.fillStyle = om(104, 98, 88);
      c.fillRect(mx, yPara, slot * 0.30, -mh);
      c.fillStyle = om(196, 188, 172);
      c.fillRect(mx, yPara, slot, H * 0.007);
      // ombre du merlon sur le fond du creneau
      if (m < nMer - 1) {
        c.fillStyle = om(46, 42, 36, 0.42);
        c.fillRect(mx + slot, yBattl - H * 0.028, slot * 0.35, H * 0.028);
      }
    }

    // ---------- echauguette d'angle ----------
    var tW = L * 0.15, tX = wallW / 2 - tW * 0.35, tBot = yBattl + H * 0.02;
    var tTop = yPara - H * 0.10;
    c.fillStyle = om(146, 140, 126);
    c.beginPath();
    c.moveTo(tX - tW / 2, tTop);
    c.lineTo(tX + tW / 2, tTop);
    c.lineTo(tX + tW * 0.42, yBattl - H * 0.01);
    c.lineTo(tX, tBot);
    c.lineTo(tX - tW * 0.42, yBattl - H * 0.01);
    c.closePath();
    c.fill();
    c.fillStyle = om(102, 96, 86);
    c.beginPath();
    c.moveTo(tX - tW / 2, tTop);
    c.lineTo(tX - tW * 0.14, tTop);
    c.lineTo(tX - tW * 0.10, yBattl - H * 0.01);
    c.lineTo(tX - tW * 0.42, yBattl - H * 0.01);
    c.closePath();
    c.fill();
    c.fillStyle = om(26, 22, 18);
    c.fillRect(tX - L * 0.008, tTop + H * 0.02, L * 0.016, H * 0.045);
    // toit conique de l'echauguette
    c.fillStyle = om(112, 74, 62);
    c.beginPath();
    c.moveTo(tX - tW * 0.60, tTop);
    c.lineTo(tX, tTop - H * 0.075);
    c.lineTo(tX + tW * 0.60, tTop);
    c.closePath();
    c.fill();
    c.fillStyle = om(154, 102, 82);
    c.beginPath();
    c.moveTo(tX, tTop - H * 0.075);
    c.lineTo(tX + tW * 0.60, tTop);
    c.lineTo(tX, tTop);
    c.closePath();
    c.fill();

    // ---------- toiture en poivriere du donjon ----------
    var roofW = widthAt(yPara) * 0.86;
    var yPeak = -H * 1.10;
    c.fillStyle = om(96, 66, 58);
    c.beginPath();
    c.moveTo(-roofW / 2, yPara - H * 0.005);
    c.lineTo(0, yPeak);
    c.lineTo(roofW / 2, yPara - H * 0.005);
    c.closePath();
    c.fill();
    c.fillStyle = om(146, 100, 82);
    c.beginPath();
    c.moveTo(0, yPeak);
    c.lineTo(roofW / 2, yPara - H * 0.005);
    c.lineTo(0, yPara - H * 0.005);
    c.closePath();
    c.fill();
    // rangs de tuiles
    c.save();
    c.beginPath();
    c.moveTo(-roofW / 2, yPara - H * 0.005);
    c.lineTo(0, yPeak);
    c.lineTo(roofW / 2, yPara - H * 0.005);
    c.closePath();
    c.clip();
    for (var tr = 0; tr < 8; tr++) {
      var try0 = yPara - (tr / 8) * (yPara - yPeak);
      c.fillStyle = om(56, 38, 32, 0.34);
      c.fillRect(-roofW, try0, roofW * 2, 1.2);
      var span = roofW * (1 - tr / 8);
      for (var tc = 0; tc < 7; tc++) {
        var tcx = -span / 2 + (tc + 0.5) * (span / 7);
        c.fillStyle = om(56, 38, 32, 0.18);
        c.fillRect(tcx, try0 - (yPara - yPeak) / 8, 1.1, (yPara - yPeak) / 8);
      }
    }
    c.restore();

    // ---------- hampe et banniere animee ----------
    var poleX = 0, poleTop = yPeak - H * 0.20;
    c.fillStyle = om(86, 70, 52);
    c.fillRect(poleX - L * 0.008, poleTop, L * 0.016, yPeak - poleTop);
    c.fillStyle = om(128, 108, 82);
    c.fillRect(poleX + L * 0.002, poleTop, L * 0.006, yPeak - poleTop);
    c.fillStyle = om(196, 172, 96);
    c.beginPath();
    c.arc(poleX, poleTop - L * 0.012, L * 0.016, 0, Math.PI * 2);
    c.fill();

    var flagL = L * 0.34, flagHh = H * 0.115;
    var segs = 14;
    var wave = function (u) {
      return Math.sin(u * 5.2 - t * 1.6) * flagHh * 0.16 * (0.25 + u)
           + Math.sin(u * 2.4 - t * 0.9) * flagHh * 0.10 * u;
    };
    var flagY = poleTop + L * 0.012;
    // deux passes : le fanion clair puis sa bande d'ombre, pour garder le volume
    var bandCols = [[178, 62, 58], [214, 198, 152], [178, 62, 58]];
    for (var b = 0; b < 3; b++) {
      var y0b = flagY + (b / 3) * flagHh;
      var y1b = flagY + ((b + 1) / 3) * flagHh;
      c.fillStyle = om(bandCols[b][0], bandCols[b][1], bandCols[b][2]);
      c.beginPath();
      for (var s = 0; s <= segs; s++) {
        var u2 = s / segs;
        var xs = poleX + u2 * flagL;
        var tail = u2 > 0.80 ? (u2 - 0.80) / 0.20 * flagHh * 0.22 : 0;
        var yy = y0b + wave(u2) + tail * (b === 0 ? 1 : b === 2 ? -1 : 0);
        if (s === 0) c.moveTo(xs, yy); else c.lineTo(xs, yy);
      }
      for (var s2 = segs; s2 >= 0; s2--) {
        var u3 = s2 / segs;
        var xs2 = poleX + u3 * flagL;
        var tail2 = u3 > 0.80 ? (u3 - 0.80) / 0.20 * flagHh * 0.22 : 0;
        c.lineTo(xs2, y1b + wave(u3) + tail2 * (b === 0 ? 1 : b === 2 ? -1 : 0));
      }
      c.closePath();
      c.fill();
      // creux de l'ondulation assombris
      for (var sh2 = 0; sh2 < segs; sh2++) {
        var us = sh2 / segs;
        var dwave = wave(us + 0.05) - wave(us);
        if (dwave > 0) continue;
        c.fillStyle = om(30, 22, 20, Math.min(0.34, -dwave * 0.9 / flagHh * 3));
        c.fillRect(poleX + us * flagL, y0b + wave(us), flagL / segs + 1, y1b - y0b);
      }
    }
    // queue d'aronde
    c.fillStyle = om(40, 32, 28, 0.28);
    c.beginPath();
    c.moveTo(poleX + flagL * 0.98, flagY + wave(0.98));
    c.lineTo(poleX + flagL * 0.80, flagY + flagHh * 0.5 + wave(0.80));
    c.lineTo(poleX + flagL * 0.98, flagY + flagHh + wave(0.98));
    c.closePath();
    c.fill();

    // ---------- torches du chemin de ronde ----------
    var torches = [-wallW * 0.30, wallW * 0.30];
    for (var tq = 0; tq < torches.length; tq++) {
      var txp = torches[tq], typ = yBattl - H * 0.015;
      c.fillStyle = om(72, 60, 46);
      c.fillRect(txp - L * 0.008, typ - H * 0.055, L * 0.016, H * 0.055);
      c.fillStyle = om(108, 96, 78);
      c.beginPath();
      c.moveTo(txp - L * 0.020, typ - H * 0.055);
      c.lineTo(txp + L * 0.020, typ - H * 0.055);
      c.lineTo(txp + L * 0.012, typ - H * 0.030);
      c.lineTo(txp - L * 0.012, typ - H * 0.030);
      c.closePath();
      c.fill();
      if (nuit > 0.02) {
        c.save();
        c.globalCompositeOperation = "lighter";
        var ph = t * 3.1 + tq * 2.7;
        var fh = H * 0.055 * (0.82 + 0.18 * Math.sin(ph) + 0.08 * Math.sin(ph * 2.3));
        var fx = txp + Math.sin(ph * 0.8) * L * 0.008;
        var fTop = typ - H * 0.058 - fh;
        c.fillStyle = "rgba(255,150,50," + (0.72 * nuit) + ")";
        c.beginPath();
        c.moveTo(txp - L * 0.019, typ - H * 0.055);
        c.quadraticCurveTo(fx - L * 0.024, fTop + fh * 0.42, fx, fTop);
        c.quadraticCurveTo(fx + L * 0.024, fTop + fh * 0.42, txp + L * 0.019, typ - H * 0.055);
        c.closePath();
        c.fill();
        c.fillStyle = "rgba(255,226,150," + (0.80 * nuit) + ")";
        c.beginPath();
        c.moveTo(txp - L * 0.009, typ - H * 0.055);
        c.quadraticCurveTo(fx - L * 0.011, fTop + fh * 0.55, fx, fTop + fh * 0.30);
        c.quadraticCurveTo(fx + L * 0.011, fTop + fh * 0.55, txp + L * 0.009, typ - H * 0.055);
        c.closePath();
        c.fill();
        var tg = c.createRadialGradient(fx, fTop + fh * 0.5, 0, fx, fTop + fh * 0.5, L * 0.30);
        tg.addColorStop(0, "rgba(255,160,60," + (0.34 * nuit) + ")");
        tg.addColorStop(1, "rgba(255,140,50,0)");
        c.fillStyle = tg;
        c.beginPath();
        c.arc(fx, fTop + fh * 0.5, L * 0.30, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // ---------- lierre et usure en pied ----------
    for (var iv = 0; iv < 26; iv++) {
      var ivx = -baseW * 0.46 + r(600 + iv) * baseW * 0.30;
      var ivy = talusY - r(600 + iv * 3) * H * 0.28;
      var ivs = L * (0.014 + r(600 + iv * 5) * 0.016);
      c.fillStyle = om(64, 88, 52, 0.42 + r(600 + iv * 7) * 0.28);
      c.beginPath();
      c.ellipse(ivx, ivy, ivs, ivs * 0.72, r(600 + iv * 11) * 3, 0, Math.PI * 2);
      c.fill();
    }

    // occlusion de contact au sol
    c.fillStyle = om(26, 22, 18, 0.32);
    c.fillRect(-talusW / 2, -H * 0.012, talusW, H * 0.012);

    c.restore();
  }

  /* Ere 3, revolution industrielle (vers 1870) : halle a sheds et cheminee d'usine. */

  function bat3(c, L, H, om, al, nuit, t){
    const W = L, xL = -W/2, xR = W/2;
    const roofH   = H*0.27;
    const wallH   = H - roofH;
    const yEave   = -wallH;
    const yPk     = yEave - roofH;
    const corn    = Math.max(3, wallH*0.062);
    const ov      = Math.max(1.5, W*0.016);
    const plinthH = Math.max(3, Math.min(wallH*0.11, H*0.07));
    const quoinW  = Math.max(4, W*0.05);

    const BRICK=[146,78,61], BRICKD=[80,41,37], BRICKL=[194,122,92];
    const MORTAR=[208,192,172], STONE=[142,136,124], STONED=[82,78,72];
    const IRON=[48,46,50], SOOT=[28,24,24], WOOD=[76,54,40];
    const SLATE=[84,90,99], SLATEL=[142,150,160];
    const GLASS=[54,70,78], GLASSL=[120,140,148];
    const SUN=[255,238,212], NIGHTBLUE=[20,14,12];

    function mix(a,b,k){ return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k]; }
    function C(p,a){ return om(p[0]|0, p[1]|0, p[2]|0, a===undefined?1:a); }

    const ch = Math.max(2.2, Math.min(6, H*0.021));
    const bl = ch*2.7;

    function courses(x, y, w, h, seed, tone){
      c.save();
      c.beginPath(); c.rect(x, y, w, h); c.clip();
      let row = 0;
      for(let yy = y+h; yy > y-ch; yy -= ch, row++){
        c.fillStyle = C(MORTAR, .10);
        c.fillRect(x, yy-0.75, w, 0.75);
        c.fillStyle = C(BRICKD, .16);
        c.fillRect(x, yy, w, 0.5);
        const off = (row%2)*bl*0.5;
        for(let k = -1; x + off + k*bl < x + w; k++){
          const r = al((seed + row*131 + k*17)|0);
          if(r < 0.34){
            const bx = x + off + k*bl;
            c.fillStyle = C(mix(tone, r < 0.15 ? BRICKD : BRICKL, 0.28 + r), .55);
            c.fillRect(bx+0.7, yy-ch+0.85, bl-1.4, ch-1.5);
          }
        }
      }
      c.restore();
    }

    /* --- toit en sheds --- */
    const gw  = Math.max(2.5, W*0.035);
    const iL  = xL + gw, iR = xR - gw, iW = iR - iL;
    const nsh = Math.max(2, Math.round(iW/(roofH*1.05)));
    const sw  = iW/nsh;
    const gr  = sw*0.38;

    c.save();
    for(let p = 0; p < nsh; p++){
      const xpk = iL + p*sw, xv = xpk + (sw-gr), xnk = xpk + sw;

      c.beginPath(); c.moveTo(xpk, yPk); c.lineTo(xv, yEave); c.lineTo(xpk, yEave); c.closePath();
      const g1 = c.createLinearGradient(xpk, yPk, xv, yEave);
      g1.addColorStop(0, C(mix(SLATEL, SUN, .30), 1));
      g1.addColorStop(1, C(mix(SLATE, SOOT, .18), 1));
      c.fillStyle = g1; c.fill();

      // la verriere regarde toujours au nord, donc a l'oppose du soleil : c'est le plan sombre
      c.beginPath(); c.moveTo(xv, yEave); c.lineTo(xnk, yPk); c.lineTo(xnk, yEave); c.closePath();
      const g2 = c.createLinearGradient(xnk, yPk, xv, yEave);
      g2.addColorStop(0, C(GLASSL, 1));
      g2.addColorStop(0.5, C(GLASS, 1));
      g2.addColorStop(1, C(mix(GLASS, SOOT, .55), 1));
      c.fillStyle = g2; c.fill();

      c.save();
      c.beginPath(); c.moveTo(xv, yEave); c.lineTo(xnk, yPk); c.lineTo(xnk, yEave); c.closePath(); c.clip();
      c.strokeStyle = C(IRON, .60);
      c.lineWidth = Math.max(0.6, gr*0.055);
      for(let m = 1; m <= 4; m++){
        const xx = xv + gr*m/5;
        c.beginPath(); c.moveTo(xx, yEave); c.lineTo(xx, yPk); c.stroke();
      }
      for(let m = 1; m <= 3; m++){
        const yy = yEave - roofH*m/4;
        c.beginPath(); c.moveTo(xv, yy); c.lineTo(xnk, yy); c.stroke();
      }
      c.restore();

      c.lineWidth = Math.max(0.9, roofH*0.020);
      c.strokeStyle = C(mix(SLATEL, SUN, .55), .95);
      c.beginPath(); c.moveTo(xpk, yPk); c.lineTo(xv, yEave); c.stroke();
      c.lineWidth = Math.max(0.7, roofH*0.014);
      c.strokeStyle = C(IRON, .85);
      c.beginPath(); c.moveTo(xv, yEave); c.lineTo(xnk, yPk); c.stroke();
      c.fillStyle = C(IRON, .9);
      c.fillRect(xv - gr*0.10, yEave - Math.max(1.2, roofH*0.030), gr*0.26, Math.max(1.4, roofH*0.032));
    }
    c.restore();

    for(let s = 0; s < 2; s++){
      const px = s ? iR : xL;
      c.fillStyle = C(mix(BRICK, s ? BRICKL : BRICKD, .28), 1);
      c.fillRect(px, yPk, gw, roofH);
      courses(px, yPk, gw, roofH, s ? 61 : 23, mix(BRICK, s ? BRICKL : BRICKD, .28));
      c.fillStyle = C(SOOT, .28);
      c.fillRect(px, yPk, gw, roofH*0.45);
      c.fillStyle = C(mix(STONE, SUN, s ? .45 : .05), 1);
      c.fillRect(px - ov*0.3, yPk - Math.max(1.4, roofH*0.035), gw + ov*0.6, Math.max(1.4, roofH*0.035));
    }

    /* --- mur en brique --- */
    c.fillStyle = C(BRICK, 1);
    c.fillRect(xL, yEave, W, wallH);
    courses(xL, yEave, W, wallH, 11, BRICK);

    const sg = c.createLinearGradient(0, yEave, 0, 0);
    sg.addColorStop(0, C(SOOT, .52));
    sg.addColorStop(0.26, C(SOOT, .20));
    sg.addColorStop(0.72, C(SOOT, .03));
    sg.addColorStop(1, C(SOOT, .15));
    c.fillStyle = sg; c.fillRect(xL, yEave, W, wallH);

    for(let i = 0; i < 11; i++){
      const w2 = W*(0.010 + 0.030*al(i*7+5));
      const x2 = xL + (W - w2)*al(i*7+3);
      const h2 = wallH*(0.16 + 0.52*al(i*7+9));
      const gs = c.createLinearGradient(0, yEave, 0, yEave + h2);
      gs.addColorStop(0, C(SOOT, .32)); gs.addColorStop(1, C(SOOT, 0));
      c.fillStyle = gs; c.fillRect(x2, yEave, w2, h2);
    }

    /* --- travees --- */
    const inW = W - quoinW*2;
    let nb = Math.max(3, Math.round(inW/(wallH*0.46)));
    if(nb % 2 === 0) nb++;
    const bw  = inW/nb;
    const mid = (nb-1)/2;
    const pw  = Math.max(2.5, quoinW*0.62);

    for(let i = 1; i < nb; i++){
      const px = xL + quoinW + i*bw - pw/2;
      c.fillStyle = C(BRICKD, .42);
      c.fillRect(px - pw*0.42, yEave + corn, pw*0.42, wallH - corn);
      c.fillStyle = C(mix(BRICK, BRICKL, .14), 1);
      c.fillRect(px, yEave + corn, pw, wallH - corn);
      courses(px, yEave + corn, pw, wallH - corn, 200 + i*13, mix(BRICK, BRICKL, .14));
      c.fillStyle = C(mix(BRICKL, SUN, .40), .85);
      c.fillRect(px + pw - Math.max(0.8, pw*0.18), yEave + corn, Math.max(0.8, pw*0.18), wallH - corn);
      c.fillStyle = C(SOOT, .26);
      c.fillRect(px - pw*0.42, yEave + corn, pw*1.42, wallH*0.22);
    }

    /* --- chainages d'angle --- */
    function quoinRun(x, w, lit){
      let row = 0;
      for(let yy = -plinthH; yy > yEave; yy -= ch*2, row++){
        const wide = (row % 2) === 0;
        const ww = wide ? w : w*0.60;
        const xx = lit ? x + (w - ww) : x;
        c.fillStyle = C(mix(BRICK, lit ? BRICKL : BRICKD, wide ? 0.34 : 0.24), 1);
        c.fillRect(xx, yy - ch*2 + 0.9, ww, ch*2 - 1.5);
        c.fillStyle = lit ? C(SUN, .26) : C(MORTAR, .09);
        c.fillRect(xx, yy - ch*2 + 0.9, ww, 0.9);
        if(lit){
          c.fillStyle = C(SUN, .18);
          c.fillRect(xx + ww - 0.9, yy - ch*2 + 0.9, 0.9, ch*2 - 1.5);
        }
      }
      c.fillStyle = C(SOOT, .30);
      c.fillRect(x, yEave, w, wallH*0.26);
    }
    quoinRun(xL, quoinW, false);
    quoinRun(xR - quoinW, quoinW, true);

    /* --- baies --- */
    const winW   = Math.min(bw*0.54, wallH*0.30);
    const winTop = yEave + corn + wallH*0.11;
    const winBot = winTop + wallH*0.42;
    const rise   = Math.max(1.6, winW*0.17);
    const bays   = [];

    function arch(x0, x1, yt, yb, ri){
      c.beginPath();
      c.moveTo(x0, yb); c.lineTo(x0, yt);
      c.quadraticCurveTo((x0+x1)/2, yt - ri*2, x1, yt);
      c.lineTo(x1, yb); c.closePath();
    }

    function voussoirs(x0, x1, yt, ri, th){
      c.save();
      c.lineWidth = th; c.lineCap = "butt";
      c.strokeStyle = C(mix(BRICK, BRICKL, .32), 1);
      c.beginPath();
      c.moveTo(x0, yt); c.quadraticCurveTo((x0+x1)/2, yt - ri*2, x1, yt); c.stroke();
      c.lineWidth = Math.max(0.6, th*0.14);
      for(let s = 0; s <= 8; s++){
        const u = s/8, v = 1-u;
        const px = v*v*x0 + 2*v*u*(x0+x1)/2 + u*u*x1;
        const py = v*v*yt + 2*v*u*(yt - ri*2) + u*u*yt;
        let dx = 2*v*((x0+x1)/2 - x0) + 2*u*(x1 - (x0+x1)/2);
        let dy = 2*v*((yt - ri*2) - yt) + 2*u*(yt - (yt - ri*2));
        const n = Math.hypot(dx, dy) || 1;
        dx /= n; dy /= n;
        c.strokeStyle = C(BRICKD, u > 0.55 ? .30 : .55);
        c.beginPath();
        c.moveTo(px + dy*th*0.5, py - dx*th*0.5);
        c.lineTo(px - dy*th*0.5, py + dx*th*0.5);
        c.stroke();
      }
      c.strokeStyle = C(mix(BRICKL, SUN, .45), .8);
      c.lineWidth = Math.max(0.7, th*0.16);
      c.beginPath();
      c.moveTo(x0 + th*0.2, yt - th*0.45);
      c.quadraticCurveTo((x0+x1)/2, yt - ri*2 - th*0.45, x1 - th*0.2, yt - th*0.45);
      c.stroke();
      c.restore();
    }

    function panes(x0, x1, yt, yb, cols, rows){
      c.strokeStyle = C(mix(WOOD, MORTAR, .45), .70);
      c.lineWidth = Math.max(0.55, (x1-x0)*0.045);
      for(let i = 1; i < cols; i++){
        const xx = x0 + (x1-x0)*i/cols;
        c.beginPath(); c.moveTo(xx, yt - rise*2); c.lineTo(xx, yb); c.stroke();
      }
      for(let j = 1; j < rows; j++){
        const yy = yt + (yb-yt)*j/rows;
        c.beginPath(); c.moveTo(x0, yy); c.lineTo(x1, yy); c.stroke();
      }
    }

    function opening(x0, x1, yt, yb, ri, cols, rows){
