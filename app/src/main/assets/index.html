      var cw = frx*(0.09 + al(i*5 + 183)*0.07);
      var cwo = Math.sin(t*2.6 + sd2*6.283)*cw*0.7;
      c.beginPath();
      c.moveTo(cx0 - cw, fcy - H*0.012);
      c.quadraticCurveTo(cx0 - cw*0.4 + cwo, fcy - H*0.012 - ch*0.6, cx0 + cwo, fcy - H*0.012 - ch);
      c.quadraticCurveTo(cx0 + cw*0.4 + cwo, fcy - H*0.012 - ch*0.6, cx0 + cw, fcy - H*0.012);
      c.closePath();
      c.fillStyle = "rgba(255,244,206," + (0.30 + 0.16*nu) + ")";
      c.fill();
    }
    // braises qui montent
    for (i = 0; i < 24; i++){
      var ph = (t*0.13 + al(i*3 + 191))%1;
      var exx = (al(i*3 + 192) - 0.5)*frx*0.9 + Math.sin(ph*7.4 + al(i + 200)*6.283)*L*0.055 + ph*L*0.075;
      var eyy = fcy - H*(0.10 + ph*0.88);
      var err = L*(0.004 + al(i*3 + 193)*0.006)*(1 - ph*0.5);
      c.beginPath();
      c.arc(exx, eyy, Math.abs(err), 0, Math.PI*2);
      c.fillStyle = "rgba(255," + Math.round(140 + 110*(1 - ph)) + ",70," + (0.65*(1 - ph)*(ph < 0.1 ? ph*10 : 1)) + ")";
      c.fill();
    }
    c.restore();

    // ---------- pierres du cercle, moitié avant, ourlées de lumière ----------
    for (i = 0; i < 13; i++){
      var ab = Math.PI*2*(i/13) + 0.18;
      if (Math.sin(ab) <= -0.12) continue;
      var sr2 = frx*(0.16 + al(i*5 + 111)*0.11);
      var sx2 = Math.cos(ab)*frx, sy2 = fcy + Math.sin(ab)*fry + sr2*0.45;
      stone(sx2, sy2, sr2, sr2*0.80, i + 120, 128, 120, 108);
      c.save();
      c.globalCompositeOperation = "lighter";
      c.beginPath();
      c.ellipse(sx2 - Math.cos(ab)*sr2*0.35, sy2 - sr2*0.85, sr2*0.75, sr2*0.42,
                -Math.cos(ab)*0.4, 0, Math.PI*2);
      c.fillStyle = "rgba(255,150,58," + (0.16 + 0.30*nu)*fl + ")";
      c.fill();
      c.restore();
    }

    // ---------- offrandes au pied ----------
    // défense de mammouth
    var tx0 = -L*0.470, ty0 = -H*0.004;
    contact(tx0 + L*0.05, ty0, L*0.09, H*0.014, 0.32);
    c.beginPath();
    c.moveTo(tx0, ty0);
    c.bezierCurveTo(tx0 + L*0.10, ty0 - H*0.115, tx0 + L*0.008, ty0 - H*0.185, tx0 - L*0.075, ty0 - H*0.150);
    c.bezierCurveTo(tx0 + L*0.010, ty0 - H*0.215, tx0 + L*0.130, ty0 - H*0.125, tx0 + L*0.030, ty0);
    c.closePath();
    c.fillStyle = om(206, 196, 172);
    c.fill();
    c.save();
    c.clip();
    var gt = c.createLinearGradient(tx0 - L*0.08, ty0 - H*0.20, tx0 + L*0.06, ty0);
    gt.addColorStop(0, om(120, 112, 96, 0.55));
    gt.addColorStop(0.5, om(230, 222, 200, 0.25));
    gt.addColorStop(1, om(96, 88, 74, 0.55));
    c.fillStyle = gt;
    c.fillRect(tx0 - L*0.12, ty0 - H*0.24, L*0.24, H*0.26);
    c.restore();

    // bois plantés dans le sol
    contact(L*0.330, -H*0.002, L*0.07, H*0.013, 0.3);
    antler(L*0.330, -H*0.006, H*0.180, -1.30, 41, 2);
    antler(L*0.352, -H*0.004, H*0.140, -1.75, 47, 1);

    // tas d'ocre et galets peints
    c.beginPath();
    c.ellipse(-L*0.300, -H*0.014, L*0.060, H*0.026, 0, 0, Math.PI*2);
    c.fillStyle = om(158, 66, 34);
    c.fill();
    c.beginPath();
    c.ellipse(-L*0.292, -H*0.020, L*0.040, H*0.016, 0, 0, Math.PI*2);
    c.fillStyle = om(202, 96, 48, 0.8);
    c.fill();
    for (i = 0; i < 4; i++){
      var ox = -L*0.360 + al(i*3 + 211)*L*0.130;
      var oy = -H*0.002 - al(i*3 + 212)*H*0.012;
      var orr = L*(0.012 + al(i*3 + 213)*0.010);
      stone(ox, oy, orr, orr*0.78, i + 220, 146, 138, 124);
      c.beginPath();
      c.moveTo(ox - orr*0.4, oy - orr*0.85);
      c.lineTo(ox + orr*0.4, oy - orr*0.60);
      c.lineWidth = lw(orr*0.24);
      c.strokeStyle = om(168, 62, 34, 0.8);
      c.stroke();
    }

    // deux épieux appuyés contre les perches
    for (i = 0; i < 2; i++){
      var spx = i ? L*0.395 : -L*0.360;
      var spy = i ? -H*0.004 : -H*0.030;
      var stx = i ? L*0.250 : -L*0.230;
      var sty = i ? -H*0.430 : -H*0.470;
      branch(spx, spy, stx, sty, L*0.010, L*0.007, (al(i + 231) - 0.5)*L*0.02, 92, 72, 46);
      c.beginPath();
      c.moveTo(stx, sty);
      c.lineTo(stx + (i ? -L*0.012 : L*0.012), sty - H*0.042);
      c.lineTo(stx + (i ? L*0.010 : -L*0.010), sty - H*0.030);
      c.closePath();
      c.fillStyle = om(126, 132, 138);
      c.fill();
      c.beginPath();
      c.moveTo(stx + (i ? -L*0.012 : L*0.012), sty - H*0.042);
      c.lineTo(stx + (i ? L*0.010 : -L*0.010), sty - H*0.030);
      c.lineWidth = lw(L*0.004);
      c.strokeStyle = om(196, 206, 214, 0.7);
      c.stroke();
      lash(stx, sty - H*0.008, i ? -0.4 : 0.4, L*0.010, i + 33, 1);
    }

    // ---------- fumée : elle voile ce qui est derrière, poteaux compris ----------
    for (i = 0; i < 16; i++){
      var sp2 = (t*0.048 + al(i*3 + 241))%1;
      var sxx = Math.sin(sp2*3.1 + al(i + 250)*6.283)*L*0.085 + sp2*L*0.170;
      var syy = fcy - H*(0.30 + sp2*0.86);
      var srr2 = H*(0.045 + sp2*0.175)*(0.7 + al(i*3 + 242)*0.6);
      var sa2 = 0.20*(1 - sp2)*(sp2 < 0.14 ? sp2/0.14 : 1)*(0.55 + 0.45*(1 - nu));
      c.beginPath();
      c.ellipse(sxx, syy, Math.abs(srr2), Math.abs(srr2)*0.72, al(i + 260)*3, 0, Math.PI*2);
      c.fillStyle = om(168, 158, 148, sa2);
      c.fill();
    }
    c.save();
    c.globalCompositeOperation = "lighter";
    var gs2 = c.createRadialGradient(0, fcy - H*0.26, 0, 0, fcy - H*0.26, L*0.30);
    gs2.addColorStop(0, "rgba(255,150,60," + (0.10 + 0.20*nu)*fl + ")");
    gs2.addColorStop(1, "rgba(255,120,40,0)");
    c.fillStyle = gs2;
    c.beginPath();
    c.arc(0, fcy - H*0.26, L*0.30, 0, Math.PI*2);
    c.fill();
    c.restore();

    c.restore();
  }

  // Village vers 2600 : IA pacifiste, climat repare, temps parfait. Contraire
  // apaise de la cite cyberpunk : blanc mat, lignes douces, vegetation partout.
  // Lumiere haut-droite ; sur du blanc c'est le modele qui porte tout le volume.

  function batSol(c, L, H, om, al, nuit, t){
    const n = nuit < 0 ? 0 : nuit > 1 ? 1 : nuit;
    const day = 1 - n;
    const lerp = (a, b, u) => a + (b - a) * u;
    const cl = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);
    const sat = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    const TAU = 6.28318;

    // Sur du blanc l'ombre n'est jamais grise : elle prend la couleur du ciel.
    const wh = (v, a) => {
      const u = sat(v), k = u < 0.5 ? u * 2 : (u - 0.5) * 2, aa = a === undefined ? 1 : a;
      return u < 0.5
        ? om(lerp(146, 214, k), lerp(166, 223, k), lerp(200, 234, k), aa)
        : om(lerp(214, 255, k), lerp(223, 252, k), lerp(234, 243, k), aa);
    };
    const vg = (v, a) => {
      const u = sat(v), k = u < 0.5 ? u * 2 : (u - 0.5) * 2, aa = a === undefined ? 1 : a;
      return u < 0.5
        ? om(lerp(20, 58, k), lerp(50, 104, k), lerp(42, 58, k), aa)
        : om(lerp(58, 156, k), lerp(104, 194, k), lerp(58, 100, k), aa);
    };
    const em = (r, g, b, a) =>
      "rgba(" + Math.round(cl(r)) + "," + Math.round(cl(g)) + "," + Math.round(cl(b)) +
      "," + Math.max(0, Math.min(1, a)) + ")";

    const dep = Math.min(L * 0.105, H * 0.10);   // profondeur axonometrique
    const ddx = dep, ddy = -dep * 0.46;
    const px = Math.max(0.55, L * 0.0035);

    const rrPath = (x0, y0, x1, y1, r) => {
      const w = x1 - x0, h = y1 - y0, rr = Math.min(r, Math.abs(w) * 0.5, Math.abs(h) * 0.5);
      c.beginPath();
      c.moveTo(x0 + rr, y0);
      c.lineTo(x1 - rr, y0); c.quadraticCurveTo(x1, y0, x1, y0 + rr);
      c.lineTo(x1, y1 - rr); c.quadraticCurveTo(x1, y1, x1 - rr, y1);
      c.lineTo(x0 + rr, y1); c.quadraticCurveTo(x0, y1, x0, y1 - rr);
      c.lineTo(x0, y0 + rr); c.quadraticCurveTo(x0, y0, x0 + rr, y0);
      c.closePath();
    };
    const quad = (a, b, d, e, style) => {
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
      c.lineTo(d[0], d[1]); c.lineTo(e[0], e[1]); c.closePath();
      c.fillStyle = style; c.fill();
    };
    const vgrad = (y0, y1, s0, s1) => {
      const g = c.createLinearGradient(0, y0, 0, y1);
      g.addColorStop(0, s0); g.addColorStop(1, s1); return g;
    };
    const hgrad = (x0, x1, s0, s1) => {
      const g = c.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, s0); g.addColorStop(1, s1); return g;
    };

    // Lobe au contour bruite : la graine vient de l'indice, jamais de la position,
    // sinon la texture clignote des que la masse respire.
    const bump = (x, y, rx, ry, sd, style) => {
      const N = 13;
      c.beginPath();
      for (let i = 0; i <= N; i++){
        const a = i / N * TAU, rr = 0.78 + 0.44 * al(sd * 29 + i * 5);
        const qx = x + Math.cos(a) * rx * rr, qy = y + Math.sin(a) * ry * rr;
        if (i === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
      }
      c.closePath(); c.fillStyle = style; c.fill();
    };

    // Masse de feuillage : trois plans de valeur decales vers la lumiere, plus
    // quelques feuilles detachees sur le bord eclaire.
    const foliage = (cx, cy, rx, ry, sd, nb, vb) => {
      const br = 1 + 0.03 * Math.sin(t * 0.21 + sd * 0.7);
      const ox = [], oy = [], os = [];
      for (let i = 0; i < nb; i++){
        const a = al(sd * 17 + i) * TAU, rd = 0.30 + 0.55 * al(sd * 23 + i * 3);
        ox[i] = Math.cos(a) * rx * rd; oy[i] = Math.sin(a) * ry * rd * 0.85;
        os[i] = 0.42 + 0.34 * al(sd * 31 + i * 7);
      }
      const pass = (dx, dy, sc, v, keep) => {
        for (let i = 0; i < nb; i++){
          if (keep > 0 && al(sd * 41 + i * 11) > keep) continue;
          bump(cx + ox[i] + dx, cy + oy[i] + dy, rx * os[i] * sc * br,
               ry * os[i] * sc * br * 1.05, sd * 3 + i, vg(v + 0.10 * al(sd * 53 + i)));
        }
      };
      pass(0, 0, 1.00, vb - 0.30, 0);                                  // masse d'ombre
      pass(rx * 0.10, -ry * 0.13, 0.80, vb + 0.05, 0.74);              // plan median
      pass(rx * 0.19, -ry * 0.24, 0.52, vb + 0.34, 0.42);              // plan eclaire
      for (let i = 0; i < nb; i++){                                     // feuilles detachees
        if (al(sd * 61 + i * 13) > 0.44) continue;
        const a = -0.9 + al(sd * 71 + i) * 1.5, r = rx * (0.72 + 0.30 * al(sd * 79 + i));
        const lx = cx + Math.cos(a) * r, ly = cy + Math.sin(a) * ry * 0.85;
        c.save(); c.translate(lx, ly); c.rotate(-0.5 + al(sd * 83 + i) * 1.0);
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(rx * 0.13, -ry * 0.07, rx * 0.24, 0);
        c.quadraticCurveTo(rx * 0.13, ry * 0.07, 0, 0);
        c.closePath();
        c.fillStyle = vg(vb + 0.46, 0.95); c.fill();
        c.restore();
      }
    };

    // Retombee de lierre : la tige s'incurve, les paquets s'espacent vers la pointe.
    const ivy = (x0, y0, len, w, sd) => {
      const seg = 8, sw = Math.sin(t * 0.15 + sd * 0.9) * len * 0.05;
      let px0 = x0, py0 = y0;
      c.strokeStyle = vg(0.12, 0.8); c.lineWidth = Math.max(0.5, w * 0.16);
      c.beginPath(); c.moveTo(x0, y0);
      for (let i = 1; i <= seg; i++){
        const u = i / seg;
        px0 = x0 + sw * u * u + (al(sd * 7 + i) - 0.5) * w * 0.5;
        py0 = y0 + len * u;
        c.lineTo(px0, py0);
      }
      c.stroke();
      for (let i = 1; i <= seg; i++){
        const u = i / seg;
        const qx = x0 + sw * u * u + (al(sd * 7 + i) - 0.5) * w * 0.5;
        const qy = y0 + len * u;
        const rr = w * (1 - 0.62 * u) * (0.60 + 0.55 * al(sd * 11 + i * 3));
        if (rr < px * 0.6) continue;
        bump(qx, qy, rr, rr * 0.86, sd * 5 + i, vg(0.16 + 0.10 * al(sd * 13 + i)));
        bump(qx + rr * 0.22, qy - rr * 0.22, rr * 0.60, rr * 0.52, sd * 9 + i, vg(0.52));
        if (al(sd * 19 + i) < 0.5)
          bump(qx + rr * 0.34, qy - rr * 0.34, rr * 0.30, rr * 0.26, sd * 23 + i, vg(0.82));
      }
    };

    // Les LED restent discretes de jour et prennent le relais la nuit.
    const ledA = (0.30 + 0.70 * n);
    const ledLine = (x0, y0, x1, y1, w, ph) => {
      const p = 0.88 + 0.12 * Math.sin(t * 0.42 + ph);
      const a = ledA * p;
      c.save();
      c.globalCompositeOperation = "lighter";
      c.lineCap = "round";
      c.strokeStyle = em(46, 132, 236, a * 0.17); c.lineWidth = w * 7;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.strokeStyle = em(92, 182, 255, a * 0.46); c.lineWidth = w * 2.4;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.strokeStyle = em(212, 240, 255, a * 0.88); c.lineWidth = w * 0.85;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.restore();
    };

    // Garde-corps : montants fins et une main courante, jamais un trait plein.
    const railing = (x0, x1, y, h, sd) => {
      const nbm = Math.max(2, Math.round(Math.abs(x1 - x0) / (L * 0.028)));
      c.strokeStyle = wh(0.80, 0.72); c.lineWidth = px * 0.9;
      c.beginPath();
      for (let i = 0; i <= nbm; i++){
        const qx = lerp(x0, x1, i / nbm);
        c.moveTo(qx, y); c.lineTo(qx, y - h);
      }
      c.stroke();
      c.strokeStyle = wh(0.98, 0.95); c.lineWidth = px * 1.5;
      c.beginPath(); c.moveTo(x0, y - h); c.lineTo(x1, y - h); c.stroke();
      c.strokeStyle = wh(0.62, 0.5); c.lineWidth = px * 0.8;
      c.beginPath(); c.moveTo(x0, y - h * 0.42); c.lineTo(x1, y - h * 0.42); c.stroke();
    };

    // Baie : embrasure sombre, verre qui reflete le ciel, meneaux clairs devant.
    const bay = (x0, y0, x1, y1, sd) => {
      if (x1 - x0 < px * 3 || y1 - y0 < px * 2.5) return;
      rrPath(x0, y0, x1, y1, (y1 - y0) * 0.18);
      c.fillStyle = wh(0.10); c.fill();
      const gx0 = x0 + px * 0.9, gy0 = y0 + px * 0.9, gx1 = x1 - px * 0.9, gy1 = y1 - px * 0.9;
      if (gx1 - gx0 <= 0 || gy1 - gy0 <= 0) return;
      rrPath(gx0, gy0, gx1, gy1, (gy1 - gy0) * 0.16);
      c.fillStyle = vgrad(gy0, gy1, om(118, 152, 186, 1), om(52, 74, 100, 1));
      c.fill();
      if (day > 0.02){
        c.fillStyle = vgrad(gy0, gy1,
          om(206, 230, 246, 0.95 * day), om(132, 172, 204, 0.55 * day));
        c.fill();
      }
      if (n > 0.02){                                     // interieurs habites, chauds
        c.save(); c.globalCompositeOperation = "lighter";
        const w2 = al(sd * 3 + 1);
        c.fillStyle = em(250, 232, 198, (0.10 + 0.16 * w2) * n);
        c.fill();
        c.restore();
      }
      c.save(); c.beginPath(); c.rect(gx0, gy0, gx1 - gx0, gy1 - gy0); c.clip();
      c.strokeStyle = om(255, 255, 255, 0.22 * day + 0.06);   // reflet oblique doux
      c.lineWidth = (gy1 - gy0) * 0.20;
      c.beginPath();
      c.moveTo(gx0 - (gy1 - gy0), gy1 + (gy1 - gy0) * 0.4);
      c.lineTo(gx0 + (gx1 - gx0) * 0.55, gy0 - (gy1 - gy0) * 0.4);
      c.stroke();
      c.restore();
      const nbm = Math.max(1, Math.round((gx1 - gx0) / (L * 0.075)));
      c.strokeStyle = wh(0.90, 0.85); c.lineWidth = px * 1.1;
      c.beginPath();
      for (let i = 1; i < nbm; i++){
        const qx = lerp(gx0, gx1, i / nbm);
        c.moveTo(qx, gy0); c.lineTo(qx, gy1);
      }
      c.stroke();
      c.strokeStyle = wh(1.0, 0.55); c.lineWidth = px * 0.9;   // linteau qui accroche
      c.beginPath(); c.moveTo(x0, y1 + px * 0.5); c.lineTo(x1, y1 + px * 0.5); c.stroke();
    };

    // ---- massing : un noyau haut a gauche, des gradins qui descendent a droite ----
    const vols = [
      { x0: -0.560 * L, x1: -0.170 * L, yt: -0.960 * H, fl: 5 },
      { x0: -0.170 * L, x1:  0.130 * L, yt: -0.700 * H, fl: 4 },
      { x0:  0.130 * L, x1:  0.390 * L, yt: -0.450 * H, fl: 3 },
      { x0:  0.390 * L, x1:  0.565 * L, yt: -0.245 * H, fl: 1 }
    ];
    const slab = Math.max(px * 2, H * 0.026);
    const para = H * 0.030;                       // hauteur du muret de bac

    c.save();

    // ---- 1. ombre portee au sol, bleutee et molle ----
    const sh = c.createLinearGradient(0, 0, 0, -H * 0.05);
    sh.addColorStop(0, om(96, 116, 152, 0.30 * (0.35 + 0.65 * day)));
    sh.addColorStop(1, om(96, 116, 152, 0));
    c.fillStyle = sh;
    c.beginPath();
    c.ellipse ? c.ellipse(-L * 0.06, 0, L * 0.62, H * 0.045, 0, 0, TAU)
              : c.arc(-L * 0.06, 0, L * 0.62, 0, TAU);
    c.fill();

    // ---- 2. les volumes, de gauche a droite : le suivant recouvre le retour du precedent ----
    for (let v = 0; v < vols.length; v++){
      const V = vols[v], x0 = V.x0, x1 = V.x1, yt = V.yt;
      const sd = 100 + v * 37;
      const yf = yt + slab;                       // haut de la facade, sous la dalle
      const back = v === vols.length - 1;

      // -- retour droit, plan eclaire --
      quad([x1, 0], [x1, yt], [x1 + ddx, yt + ddy], [x1 + ddx, ddy],
        vgrad(yt, 0, wh(0.90), wh(0.60)));

      // -- terrasse : dalle vue de dessus, le plan le plus clair du batiment --
      quad([x0, yt], [x1, yt], [x1 + ddx, yt + ddy], [x0 + ddx, yt + ddy],
        hgrad(x0, x1 + ddx, wh(0.84), wh(1.0)));
      // terre du bac, le long du bord arriere
      quad([x0 + ddx * 0.30, yt + ddy * 0.30], [x1 + ddx * 0.30, yt + ddy * 0.30],
           [x1 + ddx, yt + ddy], [x0 + ddx, yt + ddy], om(72, 58, 46, 1));

      // -- plantation de la terrasse, en masses --
      const nbf = 3 + Math.round((x1 - x0) / (L * 0.085));
      for (let i = 0; i < nbf; i++){
        const u = (i + 0.5) / nbf + (al(sd + i) - 0.5) * 0.06;
        const fx = lerp(x0 + L * 0.02, x1 - L * 0.02, u) + ddx * 0.62;
        const fy = yt + ddy * 0.62;
        const big = al(sd * 3 + i) < 0.34;
        const fr = (big ? 0.075 : 0.048) * L * (0.75 + 0.5 * al(sd * 5 + i));
        // ombre de contact : sans elle l'arbuste flotte au dessus de la dalle
        c.fillStyle = om(120, 132, 158, 0.42);
        c.beginPath();
        c.ellipse ? c.ellipse(fx - fr * 0.18, fy + fr * 0.12, fr * 1.05, fr * 0.24, 0, 0, TAU)
                  : c.arc(fx, fy, fr * 0.5, 0, TAU);
        c.fill();
        if (big){                                  // petit arbre : tronc puis houppier
          c.strokeStyle = om(96, 82, 68, 1); c.lineWidth = Math.max(px, fr * 0.14);
          c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx - fr * 0.10, fy - fr * 0.85); c.stroke();
          foliage(fx - fr * 0.12, fy - fr * 1.35, fr * 1.05, fr * 0.90, sd + i * 3, 8, 0.42);
        } else {
          foliage(fx, fy - fr * 0.55, fr * 1.10, fr * 0.72, sd + i * 3, 7, 0.34);
        }
      }

      // -- muret / garde-corps du bord avant de la terrasse --
      c.fillStyle = vgrad(yt - para, yt, wh(0.99), wh(0.86));
      rrPath(x0, yt - para, x1, yt, para * 0.35); c.fill();
      c.fillStyle = wh(1.0, 0.9);
      c.fillRect(x0, yt - para, x1 - x0, px * 1.2);
      railing(x0 + L * 0.012, x1 - L * 0.012, yt - para, H * 0.036, sd + 11);

      // -- fascia de la dalle, avec son ombre portee dessous --
      c.fillStyle = vgrad(yt, yf, wh(0.80), wh(0.52));
      rrPath(x0, yt, x1, yf, slab * 0.30); c.fill();
      c.fillStyle = wh(1.0, 0.75);
      c.fillRect(x0 + slab * 0.3, yt, x1 - x0 - slab * 0.6, px * 1.1);
      quad([x1, yt], [x1 + ddx, yt + ddy], [x1 + ddx, yf + ddy], [x1, yf], wh(0.94));

      // -- facade avant, plan median : c'est elle qui doit rester la valeur moyenne --
      const fg = c.createLinearGradient(x0, 0, x1, 0);
      fg.addColorStop(0, wh(0.44));
      fg.addColorStop(0.55, wh(0.66));
      fg.addColorStop(1, wh(0.76));
      rrPath(x0, yf, x1, 0, Math.min(L * 0.030, (x1 - x0) * 0.16));
      c.fillStyle = fg; c.fill();
      // occlusion sous la dalle : le blanc a besoin de ce contact pour ne pas etre plat
      c.fillStyle = vgrad(yf, yf + H * 0.045, wh(0.20, 0.55), wh(0.20, 0));
      c.fillRect(x0, yf, x1 - x0, H * 0.045);
      // et au pied du volume
      c.fillStyle = vgrad(-H * 0.05, 0, wh(0.26, 0), wh(0.26, 0.45));
      c.fillRect(x0, -H * 0.05, x1 - x0, H * 0.05);

      // -- liseré LED sous la dalle --
      ledLine(x0 + L * 0.015, yf - px * 1.2, x1 - L * 0.015, yf - px * 1.2, px, v * 1.3);

      // -- etages : baies larges, balcon plante un niveau sur deux --
      const fh = (0 - yf) / V.fl;
      for (let f = 0; f < V.fl; f++){
        const yb = yf + f * fh;                    // haut de l'etage
        const bal = (f % 2 === 1) && V.fl > 1;
        const m = (x1 - x0) * 0.055;
        const by0 = yb + fh * 0.20, by1 = yb + fh * 0.78;
        bay(x0 + m, by0, x1 - m, by1, sd + f * 7);
        // bandeau de nez de dalle entre les etages
        c.fillStyle = wh(0.86, 0.9);
        c.fillRect(x0, yb + fh * 0.82, x1 - x0, Math.max(px * 1.4, fh * 0.05));
        c.fillStyle = wh(0.30, 0.35);
        c.fillRect(x0, yb + fh * 0.87 + px, x1 - x0, Math.max(px, fh * 0.018));
        if (bal){
          const ly = yb + fh * 0.86, bx0 = x0 + m * 0.4, bx1 = x1 - m * 0.4;
          const bth = Math.max(px * 1.6, H * 0.014);
          c.fillStyle = vgrad(ly - bth, ly, wh(0.97), wh(0.66));
          rrPath(bx0, ly - bth, bx1, ly, bth * 0.4); c.fill();
          railing(bx0 + px * 2, bx1 - px * 2, ly - bth, H * 0.030, sd + f * 13);
          // jardinieres du balcon
          const nbv = Math.max(2, Math.round((bx1 - bx0) / (L * 0.10)));
          for (let i = 0; i < nbv; i++){
            const qx = lerp(bx0 + L * 0.02, bx1 - L * 0.02, (i + 0.5) / nbv);
            foliage(qx, ly - bth - H * 0.016, L * 0.036, H * 0.020, sd + f * 17 + i, 6, 0.36);
          }
          ivy(bx0 + (bx1 - bx0) * (0.18 + 0.5 * al(sd + f)), ly,
              fh * (0.42 + 0.32 * al(sd * 3 + f)), L * 0.019, sd + f * 29);
          ivy(bx0 + (bx1 - bx0) * (0.62 + 0.28 * al(sd * 5 + f)), ly,
              fh * (0.30 + 0.30 * al(sd * 7 + f)), L * 0.016, sd + f * 31);
        }
      }

      // -- lierre qui retombe de la terrasse sur la facade --
      const nbi = 2 + Math.round((x1 - x0) / (L * 0.13));
      for (let i = 0; i < nbi; i++){
        const qx = lerp(x0 + L * 0.02, x1 - L * 0.02, (i + 0.5) / nbi + (al(sd * 9 + i) - 0.5) * 0.12);
        ivy(qx, yf, (0 - yf) * (0.14 + 0.26 * al(sd * 11 + i)), L * 0.024, sd * 2 + i * 19);
      }

      // -- arete verticale entre deux volumes, soulignee de LED --
      if (!back)
        ledLine(x1 - px * 0.8, yt + slab, x1 - px * 0.8, -H * 0.02, px * 0.9, v * 0.8 + 2.1);
    }

    // ---- 3. coursive exterieure sur le noyau, a mi hauteur ----
    {
      const V = vols[0], cy = -0.52 * H, th = Math.max(px * 2, H * 0.016);
      const cx0 = V.x0 - L * 0.028, cx1 = V.x1 + L * 0.010;
      c.fillStyle = wh(0.24, 0.30);                          // ombre portee sur la facade
      c.fillRect(cx0, cy, cx1 - cx0, H * 0.030);
      c.fillStyle = vgrad(cy - th, cy, wh(1.0), wh(0.60));
      rrPath(cx0, cy - th, cx1, cy, th * 0.45); c.fill();
      quad([cx1, cy - th], [cx1 + ddx * 0.5, cy - th + ddy * 0.5],
           [cx1 + ddx * 0.5, cy + ddy * 0.5], [cx1, cy], wh(0.92));
      railing(cx0 + px, cx1 - px, cy - th, H * 0.032, 71);
      ledLine(cx0 + px, cy - px * 0.8, cx1 - px, cy - px * 0.8, px * 0.9, 1.7);
      for (let i = 0; i < 5; i++){
        const qx = lerp(cx0 + L * 0.03, cx1 - L * 0.03, (i + 0.5) / 5);
        foliage(qx, cy - th - H * 0.014, L * 0.030, H * 0.017, 210 + i * 5, 6, 0.34);
        if (i % 2 === 0) ivy(qx, cy, H * 0.075, L * 0.018, 240 + i * 9);
      }
    }

    // ---- 4. entree : une haute embrasure douce, eclairee de bleu ----
    {
      const ex = -0.365 * L, ew = L * 0.115, eh = H * 0.175;
      rrPath(ex - ew * 0.5, -eh, ex + ew * 0.5, 0, ew * 0.45);
      c.fillStyle = vgrad(-eh, 0, wh(0.16), wh(0.06)); c.fill();
      c.save();
      c.globalCompositeOperation = "lighter";
      const gg = c.createRadialGradient(ex, -eh * 0.35, 0, ex, -eh * 0.35, ew * 1.5);
      const p = 0.85 + 0.15 * Math.sin(t * 0.33);
      gg.addColorStop(0, em(120, 190, 255, (0.30 + 0.34 * n) * p));
      gg.addColorStop(0.45, em(70, 150, 240, (0.12 + 0.16 * n) * p));
      gg.addColorStop(1, em(60, 140, 235, 0));
      c.fillStyle = gg;
      c.beginPath(); c.arc(ex, -eh * 0.35, ew * 1.5, 0, TAU); c.fill();
      c.restore();
      // auvent mince au dessus de l'entree
      const ay = -eh - H * 0.006, at = Math.max(px * 1.5, H * 0.011);
      c.fillStyle = vgrad(ay - at, ay, wh(1.0), wh(0.58));
      rrPath(ex - ew * 0.95, ay - at, ex + ew * 0.95, ay, at * 0.5); c.fill();
      ledLine(ex - ew * 0.85, ay + px, ex + ew * 0.85, ay + px, px, 0.4);
    }

    // ---- 5. jardin de toit du noyau : pergola legere et deux arbres ----
    {
      const V = vols[0], ry = V.yt - para, cx = (V.x0 + V.x1) * 0.5 + ddx * 0.5;
      const pw = (V.x1 - V.x0) * 0.42, ph = H * 0.085;
      c.strokeStyle = wh(0.95, 0.92); c.lineWidth = px * 1.6;
      c.beginPath();
      c.moveTo(cx - pw, ry); c.lineTo(cx - pw, ry - ph);
      c.lineTo(cx + pw, ry - ph); c.lineTo(cx + pw, ry);
      c.stroke();
      c.strokeStyle = wh(0.72, 0.6); c.lineWidth = px * 0.8;
      c.beginPath();
      for (let i = 1; i < 7; i++){
        const qx = lerp(cx - pw, cx + pw, i / 7);
        c.moveTo(qx, ry - ph); c.lineTo(qx, ry - ph * 0.78);
      }
      c.stroke();
      ledLine(cx - pw, ry - ph - px, cx + pw, ry - ph - px, px, 3.0);
      for (let i = 0; i < 5; i++){                    // vigne courant sur la pergola
        const qx = lerp(cx - pw * 0.9, cx + pw * 0.9, (i + 0.5) / 5);
        foliage(qx, ry - ph - H * 0.008, L * 0.038, H * 0.016, 300 + i * 7, 7, 0.38);
        ivy(qx, ry - ph + H * 0.006, ph * (0.30 + 0.28 * al(310 + i)), L * 0.017, 320 + i * 11);
      }
      for (let i = 0; i < 2; i++){
        const qx = cx + (i === 0 ? -pw * 1.30 : pw * 1.22);
        const tr = L * 0.052 * (1 + 0.15 * al(340 + i));
        c.strokeStyle = om(102, 88, 72, 1); c.lineWidth = Math.max(px, tr * 0.16);
        c.beginPath(); c.moveTo(qx, ry); c.lineTo(qx + tr * 0.12, ry - tr * 1.15); c.stroke();
        foliage(qx + tr * 0.14, ry - tr * 1.75, tr * 1.20, tr * 0.98, 350 + i * 13, 9, 0.44);
      }
    }

    c.restore();
  }


  function monSol(c, L, H, om, al, nuit, t){
    const n = nuit < 0 ? 0 : nuit > 1 ? 1 : nuit;
    const day = 1 - n;
    const lerp = (a, b, u) => a + (b - a) * u;
    const cl = (v) => (v < 0 ? 0 : v > 255 ? 255 : v);
    const sat = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    const TAU = 6.28318;

    const wh = (v, a) => {
      const u = sat(v), k = u < 0.5 ? u * 2 : (u - 0.5) * 2, aa = a === undefined ? 1 : a;
      return u < 0.5
        ? om(lerp(146, 214, k), lerp(166, 223, k), lerp(200, 234, k), aa)
        : om(lerp(214, 255, k), lerp(223, 252, k), lerp(234, 243, k), aa);
    };
    const vg = (v, a) => {
      const u = sat(v), k = u < 0.5 ? u * 2 : (u - 0.5) * 2, aa = a === undefined ? 1 : a;
      return u < 0.5
        ? om(lerp(20, 58, k), lerp(50, 104, k), lerp(42, 58, k), aa)
        : om(lerp(58, 156, k), lerp(104, 194, k), lerp(58, 100, k), aa);
    };
    const em = (r, g, b, a) =>
      "rgba(" + Math.round(cl(r)) + "," + Math.round(cl(g)) + "," + Math.round(cl(b)) +
      "," + Math.max(0, Math.min(1, a)) + ")";

    const px = Math.max(0.55, L * 0.0035);
    const horizon = -0.50 * H;                 // hauteur d'oeil : les cercles s'ouvrent en s'en eloignant

    // Demi hauteur d'un cercle de rayon R vu a la hauteur y, bornee pour que le
    // monument tienne dans son cadre quel que soit le rapport L/H.
    const sq = (y, R) => Math.min(R * 0.46 * Math.abs(y - horizon) / H, H * 0.095);
    const sgn = (y) => (y < horizon ? -1 : 1);
    const PX = (R, a) => Math.cos(a) * R;
    const PY = (y, R, a) => y - sgn(y) * sq(y, R) * Math.sin(a);

    const vgrad = (y0, y1, s0, s1) => {
      const g = c.createLinearGradient(0, y0, 0, y1);
      g.addColorStop(0, s0); g.addColorStop(1, s1); return g;
    };
    const quad = (a, b, d, e, style) => {
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
      c.lineTo(d[0], d[1]); c.lineTo(e[0], e[1]); c.closePath();
      c.fillStyle = style; c.fill();
    };
    const bump = (x, y, rx, ry, sd, style) => {
      const N = 13;
      c.beginPath();
      for (let i = 0; i <= N; i++){
        const a = i / N * TAU, rr = 0.78 + 0.44 * al(sd * 29 + i * 5);
        const qx = x + Math.cos(a) * rx * rr, qy = y + Math.sin(a) * ry * rr;
        if (i === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
      }
      c.closePath(); c.fillStyle = style; c.fill();
    };
    const foliage = (cx, cy, rx, ry, sd, nb, vb) => {
      const br = 1 + 0.03 * Math.sin(t * 0.19 + sd * 0.7);
      const ox = [], oy = [], os = [];
      for (let i = 0; i < nb; i++){
        const a = al(sd * 17 + i) * TAU, rd = 0.30 + 0.55 * al(sd * 23 + i * 3);
        ox[i] = Math.cos(a) * rx * rd; oy[i] = Math.sin(a) * ry * rd * 0.85;
        os[i] = 0.42 + 0.34 * al(sd * 31 + i * 7);
      }
      const pass = (dx, dy, sc, v, keep) => {
        for (let i = 0; i < nb; i++){
          if (keep > 0 && al(sd * 41 + i * 11) > keep) continue;
          bump(cx + ox[i] + dx, cy + oy[i] + dy, rx * os[i] * sc * br,
               ry * os[i] * sc * br * 1.05, sd * 3 + i, vg(v + 0.10 * al(sd * 53 + i)));
        }
      };
      pass(0, 0, 1.00, vb - 0.30, 0);
      pass(rx * 0.10, -ry * 0.13, 0.80, vb + 0.05, 0.74);
      pass(rx * 0.19, -ry * 0.24, 0.52, vb + 0.34, 0.42);
    };
    const ivy = (x0, y0, len, w, sd) => {
      const seg = 7, sw = Math.sin(t * 0.14 + sd * 0.9) * len * 0.05;
      c.strokeStyle = vg(0.12, 0.8); c.lineWidth = Math.max(0.5, w * 0.16);
      c.beginPath(); c.moveTo(x0, y0);
      for (let i = 1; i <= seg; i++){
        const u = i / seg;
        c.lineTo(x0 + sw * u * u + (al(sd * 7 + i) - 0.5) * w * 0.5, y0 + len * u);
      }
      c.stroke();
      for (let i = 1; i <= seg; i++){
        const u = i / seg;
        const qx = x0 + sw * u * u + (al(sd * 7 + i) - 0.5) * w * 0.5, qy = y0 + len * u;
        const rr = w * (1 - 0.60 * u) * (0.60 + 0.55 * al(sd * 11 + i * 3));
        if (rr < px * 0.6) continue;
        bump(qx, qy, rr, rr * 0.86, sd * 5 + i, vg(0.16 + 0.10 * al(sd * 13 + i)));
        bump(qx + rr * 0.22, qy - rr * 0.22, rr * 0.58, rr * 0.50, sd * 9 + i, vg(0.54));
        if (al(sd * 19 + i) < 0.5)
          bump(qx + rr * 0.34, qy - rr * 0.34, rr * 0.28, rr * 0.24, sd * 23 + i, vg(0.84));
      }
    };
    const ledA = 0.30 + 0.70 * n;
    const ledArc = (y, R, a0, a1, w, alp) => {
      const steps = 26;
      const stroke = (style, lw) => {
        c.strokeStyle = style; c.lineWidth = lw; c.beginPath();
        for (let i = 0; i <= steps; i++){
          const a = lerp(a0, a1, i / steps), qx = PX(R, a), qy = PY(y, R, a);
          if (i === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
        }
        c.stroke();
      };
      c.save(); c.globalCompositeOperation = "lighter"; c.lineCap = "round";
      stroke(em(46, 132, 236, alp * 0.16), w * 6.5);
      stroke(em(92, 182, 255, alp * 0.44), w * 2.2);
      stroke(em(212, 240, 255, alp * 0.86), w * 0.8);
      c.restore();
    };

    // ---- geometrie : socle, fut effile, rampe helicoidale plantee, anneau flottant ----
    const yBase = -0.045 * H, yTop = -0.885 * H;
    const turns = 4.5, segT = 34, segs = Math.round(turns * segT);
    const rShaft = (y) => {
      const u = sat((y - yBase) / (yTop - yBase));
      return lerp(0.088, 0.044, Math.pow(u, 0.82)) * L;
    };
    const rampW = (y) => {
      const u = sat((y - yBase) / (yTop - yBase));
      return lerp(0.150, 0.072, u) * L;
    };
    const th = Math.max(px * 2, H * 0.015);           // epaisseur de la dalle de rampe
    const yAt = (i) => lerp(yBase, yTop, i / segs);
    const aAt = (i) => -1.15 + (i / segs) * turns * TAU;

    const ringY = -1.045 * H, ringR = 0.285 * L;
    const ringB = 0.052 * L, ringT = Math.max(px * 2.2, H * 0.017);
    const ringDY = sq(ringY, ringR);
    const breath = 0.5 + 0.5 * Math.sin(t * 0.30);    // respiration lente du coeur

    c.save();

    // ---- 1. ombre au sol et bassin du socle ----
    const sh = c.createLinearGradient(0, 0, 0, -H * 0.06);
    sh.addColorStop(0, om(96, 116, 152, 0.32 * (0.35 + 0.65 * day)));
    sh.addColorStop(1, om(96, 116, 152, 0));
    c.fillStyle = sh;
    c.beginPath();
    c.ellipse ? c.ellipse(0, 0, L * 0.40, H * 0.05, 0, 0, TAU) : c.arc(0, 0, L * 0.40, 0, TAU);
    c.fill();

    const plinth = (R, y0, y1, v0, v1) => {
      const dy = sq(y0, R);
      c.beginPath();
      for (let i = 0; i <= 40; i++){                 // bord avant : demi ellipse basse
        const a = lerp(0, -Math.PI, i / 40);
        const qx = PX(R, a), qy = PY(y0, R, a);
        if (i === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
      }
      c.lineTo(-R, y1); c.lineTo(R, y1); c.closePath();
      c.fillStyle = vgrad(y0 - dy, y1, wh(v0), wh(v1)); c.fill();
      c.beginPath();                                  // dessus, plan clair
      for (let i = 0; i <= 48; i++){
        const a = lerp(0, TAU, i / 48);
        const qx = PX(R, a), qy = PY(y0, R, a);
        if (i === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
      }
      c.closePath();
      const g = c.createLinearGradient(-R, 0, R, 0);
      g.addColorStop(0, wh(0.70)); g.addColorStop(1, wh(1.0));
      c.fillStyle = g; c.fill();
      return dy;
    };
    plinth(0.345 * L, -0.020 * H, 0, 0.72, 0.30);
    plinth(0.255 * L, -0.048 * H, -0.020 * H, 0.80, 0.36);
    // miroir d'eau au centre du socle : le ciel s'y repose
    {
      const R = 0.175 * L, y = -0.048 * H;
      c.beginPath();
      for (let i = 0; i <= 44; i++){
        const a = lerp(0, TAU, i / 44), qx = PX(R, a), qy = PY(y, R, a);
        if (i === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
      }
      c.closePath();
      c.fillStyle = vgrad(y - sq(y, R), y + sq(y, R),
        om(150, 190, 220, 1), om(196, 224, 240, 1));
      c.fill();
      c.strokeStyle = wh(1.0, 0.8); c.lineWidth = px * 1.2; c.stroke();
    }
    // couronne de plantation autour du socle
    for (let i = 0; i < 16; i++){
      const a = -0.15 - (i / 15) * (Math.PI + 0.3);
      const R = 0.300 * L, y = -0.020 * H;
      const fx = PX(R, a), fy = PY(y, R, a);
      if (fy < y - sq(y, R) * 0.2) continue;          // uniquement le bord vu de devant
      foliage(fx, fy - L * 0.012, L * 0.040, L * 0.024, 500 + i * 7, 6, 0.36);
    }

    // ---- 2. rampe helicoidale : arriere, puis le fut, puis l'avant ----
    const rampSeg = (i) => {
      const a0 = aAt(i), a1 = aAt(i + 1);
      const y0 = yAt(i), y1 = yAt(i + 1);
      const ym = (y0 + y1) * 0.5, am = (a0 + a1) * 0.5;
      const ri0 = rShaft(y0) * 1.04, ri1 = rShaft(y1) * 1.04;
      const ro0 = ri0 + rampW(y0), ro1 = ri1 + rampW(y1);
      // Lambert horizontal : la joue exterieure ne s'eclaire qu'a droite.
      const lam = sat(0.50 + 0.50 * Math.cos(am - 0.35));
      const up = sgn(ym) > 0;                          // sous l'horizon : on voit le dessus

      const Ai = [PX(ri0, a0), PY(y0, ri0, a0)], Bi = [PX(ri1, a1), PY(y1, ri1, a1)];
      const Ao = [PX(ro0, a0), PY(y0, ro0, a0)], Bo = [PX(ro1, a1), PY(y1, ro1, a1)];

      // surface de la rampe : plan clair vue de dessus, plan sombre en sous face
      quad(Ai, Ao, Bo, Bi, up ? wh(0.80 + 0.18 * lam) : wh(0.16 + 0.16 * lam));
      // joue exterieure, avec son epaisseur
      quad(Ao, [Ao[0], Ao[1] + th], [Bo[0], Bo[1] + th], Bo,
        wh(0.30 + 0.56 * lam));
      // arete superieure de la joue, le liseré qui dessine la spirale
      c.strokeStyle = wh(0.55 + 0.45 * lam, 0.9); c.lineWidth = px * 1.1;
      c.beginPath(); c.moveTo(Ao[0], Ao[1]); c.lineTo(Bo[0], Bo[1]); c.stroke();

      // garde-corps
      if (i % 2 === 0){
        const rh = H * 0.028;
        c.strokeStyle = wh(0.86, 0.55 + 0.35 * lam); c.lineWidth = px * 0.8;
        c.beginPath(); c.moveTo(Ao[0], Ao[1]); c.lineTo(Ao[0], Ao[1] - rh); c.stroke();
      }
      const rh = H * 0.028;
      c.strokeStyle = wh(0.75 + 0.25 * lam, 0.8); c.lineWidth = px * 1.0;
      c.beginPath(); c.moveTo(Ao[0], Ao[1] - rh); c.lineTo(Bo[0], Bo[1] - rh); c.stroke();

      // vegetation : massif sur la rampe, lierre par dessus la joue
      if (i % 3 === 0){
        const sd = 600 + i * 3;
        const fr = lerp(0.055, 0.030, sat((ym - yBase) / (yTop - yBase))) * L
                 * (0.75 + 0.5 * al(sd));
        const fx = (Ao[0] + Ai[0]) * 0.5, fy = (Ao[1] + Ai[1]) * 0.5;
        c.fillStyle = om(120, 132, 158, 0.35);
        c.beginPath();
        c.ellipse ? c.ellipse(fx, fy, fr * 1.0, fr * 0.22, 0, 0, TAU) : c.arc(fx, fy, fr * 0.4, 0, TAU);
        c.fill();
        foliage(fx, fy - fr * 0.60, fr * 1.05, fr * 0.72, sd, 7, 0.30 + 0.22 * lam);
      }
      if (i % 4 === 1){
        const sd = 700 + i * 5;
        ivy(Ao[0], Ao[1] + th * 0.6,
            H * (0.045 + 0.055 * al(sd)), L * 0.020, sd);
      }
    };

    const backIdx = [], frontIdx = [];
    for (let i = 0; i < segs; i++){
      (Math.sin(aAt(i) + (aAt(i + 1) - aAt(i)) * 0.5) > 0 ? backIdx : frontIdx).push(i);
    }
    // Ordre optique : le plus loin d'abord dans chaque moitie, le fut entre les deux.
    const bySin = (p, q) => Math.sin(aAt(q)) - Math.sin(aAt(p));
    backIdx.sort(bySin); frontIdx.sort(bySin);
    for (let k = 0; k < backIdx.length; k++) rampSeg(backIdx[k]);

    // ---- 3. le fut : cylindre eclaire par une vraie loi de Lambert ----
    {
      const steps = 22;
      c.beginPath();
      c.moveTo(-rShaft(yBase), yBase + H * 0.02);
      for (let i = 0; i <= steps; i++){ const y = lerp(yBase, yTop, i / steps); c.lineTo(-rShaft(y), y); }
      for (let i = steps; i >= 0; i--){ const y = lerp(yBase, yTop, i / steps); c.lineTo(rShaft(y), y); }
      c.lineTo(rShaft(yBase), yBase + H * 0.02);
      c.closePath();
      const R0 = rShaft(yBase);
      const g = c.createLinearGradient(-R0, 0, R0, 0);
      const lx = 0.86, lz = 0.51;
      for (let i = 0; i <= 10; i++){
        const u = i / 10, nx = u * 2 - 1, nz = Math.sqrt(Math.max(0, 1 - nx * nx));
        const lam = Math.max(0, nx * lx + nz * lz);
        const sky = 0.20 * (1 - nx) * 0.5;            // rebond bleute cote ombre
        g.addColorStop(u, wh(0.12 + 0.86 * Math.min(1, lam + sky)));
      }
      c.fillStyle = g; c.fill();
      // nervures verticales, tres discretes : elles donnent l'echelle du fut
      c.save(); c.clip();
      for (let i = -3; i <= 3; i++){
        const u = i / 3.4;
        c.strokeStyle = wh(u > 0.1 ? 0.99 : 0.34, 0.30);
        c.lineWidth = px * 1.1;
        c.beginPath();
        for (let k = 0; k <= steps; k++){
          const y = lerp(yBase, yTop, k / steps), qx = u * rShaft(y);
          if (k === 0) c.moveTo(qx, y); else c.lineTo(qx, y);
        }
        c.stroke();
      }
      c.restore();
    }

    for (let k = 0; k < frontIdx.length; k++) rampSeg(frontIdx[k]);

    // ---- 4. couronne du fut : plate-forme plantee ----
    {
      const R = 0.115 * L, y = yTop, dy = sq(y, R), ct = Math.max(px * 2, H * 0.014);
      const ellipse = (yy, RR) => {
        c.beginPath();
        for (let i = 0; i <= 44; i++){
          const a = lerp(0, TAU, i / 44), qx = PX(RR, a), qy = PY(yy, RR, a);
          if (i === 0) c.moveTo(qx, qy); else c.lineTo(qx, qy);
        }
        c.closePath();
      };
      ellipse(y + ct, R); c.fillStyle = wh(0.30); c.fill();          // sous face
      c.beginPath();                                                  // tranche
      c.moveTo(-R, y); c.lineTo(-R, y + ct);
      for (let i = 0; i <= 30; i++){
        const a = lerp(-Math.PI, 0, i / 30);
        c.lineTo(PX(R, a), PY(y + ct, R, a));
      }
      c.lineTo(R, y);
      for (let i = 30; i >= 0; i--){
        const a = lerp(-Math.PI, 0, i / 30);
        c.lineTo(PX(R, a), PY(y, R, a));
      }
      c.closePath();
      const g2 = c.createLinearGradient(-R, 0, R, 0);
      g2.addColorStop(0, wh(0.26)); g2.addColorStop(1, wh(0.88));
      c.fillStyle = g2; c.fill();
      ellipse(y, R);                                                  // dessus
      const g3 = c.createLinearGradient(-R, 0, R, 0);
      g3.addColorStop(0, wh(0.66)); g3.addColorStop(1, wh(1.0));
      c.fillStyle = g3; c.fill();
      ledArc(y - px, R * 0.99, -Math.PI, 0, px, ledA * (0.86 + 0.14 * Math.sin(t * 0.4)));
      for (let i = 0; i < 7; i++){
        const a = -0.2 - (i / 6) * (Math.PI - 0.4);
        const fx = PX(R * 0.86, a), fy = PY(y, R * 0.86, a);
        foliage(fx, fy - L * 0.010, L * 0.032, L * 0.019, 800 + i * 9, 6, 0.34);
        if (i % 2 === 1) ivy(fx, fy + ct * 0.6, H * 0.048, L * 0.016, 830 + i * 7);
      }
    }

    // ---- 5. filaments qui tiennent l'anneau ----
    const strut = (a) => {
      const x0 = PX(0.10 * L, a), y0 = PY(yTop, 0.10 * L, a);
      const x1 = PX(ringR - ringB, a), y1 = PY(ringY, ringR - ringB, a) + ringT;
      c.strokeStyle = wh(0.96, 0.62); c.lineWidth = px * 1.1;
      c.beginPath(); c.moveTo(x0, y0);
      c.quadraticCurveTo((x0 + x1) * 0.5 * 0.7, lerp(y0, y1, 0.55), x1, y1);
      c.stroke();
    };

    // ---- 6. anneau suspendu : moitie arriere, coeur, moitie avant ----
    const ringArc = (a0, a1) => {
      const steps = 40;
      const outer = [], inner = [];
      for (let i = 0; i <= steps; i++){
        const a = lerp(a0, a1, i / steps);
        outer.push([PX(ringR, a), PY(ringY, ringR, a)]);
        inner.push([PX(ringR - ringB, a), PY(ringY, ringR - ringB, a)]);
      }
      // sous face : on regarde l'anneau par dessous, c'est le plan sombre
      c.beginPath();
      for (let i = 0; i <= steps; i++) c.lineTo(outer[i][0], outer[i][1] + ringT);
      for (let i = steps; i >= 0; i--) c.lineTo(inner[i][0], inner[i][1] + ringT);
      c.closePath();
      const gs = c.createLinearGradient(-ringR, 0, ringR, 0);
      gs.addColorStop(0, wh(0.14)); gs.addColorStop(1, wh(0.42));
      c.fillStyle = gs; c.fill();
      // tranche exterieure
      c.beginPath();
      for (let i = 0; i <= steps; i++) c.lineTo(outer[i][0], outer[i][1]);
      for (let i = steps; i >= 0; i--) c.lineTo(outer[i][0], outer[i][1] + ringT);
      c.closePath();
      const ge = c.createLinearGradient(-ringR, 0, ringR, 0);
      ge.addColorStop(0, wh(0.30)); ge.addColorStop(1, wh(0.95));
      c.fillStyle = ge; c.fill();
      // dessus, plan le plus clair
      c.beginPath();
      for (let i = 0; i <= steps; i++) c.lineTo(outer[i][0], outer[i][1]);
      for (let i = steps; i >= 0; i--) c.lineTo(inner[i][0], inner[i][1]);
      c.closePath();
      const gt = c.createLinearGradient(-ringR, 0, ringR, 0);
      gt.addColorStop(0, wh(0.72)); gt.addColorStop(1, wh(1.0));
      c.fillStyle = gt; c.fill();
      // plantation sur la couronne + retombees vers l'interieur
      for (let i = 0; i <= steps; i += 4){
        const a = lerp(a0, a1, i / steps);

    // ---- 7. coeur de lumiere : la respiration de l'IA ----
    {

  // La Terre vue de l'espace et son anneau de Dyson, image finale du dezoom.
  // Repere ecran, soleil a droite. Toute matiere opaque passe par om(),
  // les emissions sont ecrites en rgba direct et composees en "lighter".

  function terreAnneau(c, cx, cy, R, av, t, om, al) {

    var spinC = t * 0.0212;                    // les nuages devancent legerement le sol

    var near = 1 - ss(0.12, 0.66, A);          // 1 quand la camera est collee a la surface
    var pRing = ss(0.24, 0.64, A);
    var pDet = ss(0.40, 0.82, A);
    var pSun = ss(0.40, 0.80, A);

    var store = terreAnneau._m || (terreAnneau._m = {});

    // ------------------------------------------------------------------
    // projection orthographique de la sphere
    // ------------------------------------------------------------------
    var _X = 0, _Y = 0, _Z = 0, _sx = 0, _sy = 0;
    function sphTo(lon, lat, sp) {

    var RAW = [
      // Eurasie

        34, 28, 38, 22, 43, 13, 48, 15, 52, 17, 57, 23, 60, 25, 66, 25, 70, 21, 73, 16,
        76, 9, 80, 13, 87, 21, 92, 20, 95, 16, 98, 10, 101, 3, 104, 2, 105, 10, 109, 15,
        108, 21, 113, 22, 118, 25, 121, 31, 122, 38, 126, 40, 128, 43, 131, 48, 136, 53,
        141, 52, 143, 59, 155, 58, 160, 61, 170, 62, 177, 65, 179, 69, 165, 70, 150, 72,
        135, 74, 115, 76, 100, 77, 85, 75, 72, 72, 62, 71, 52, 70, 45, 68, 38, 66, 33, 70,
        28, 71, 22, 70, 16, 69, 12, 65, 5, 61, 8, 58, 11, 58, 9, 54, 4, 52, 0, 50, -2, 48, -4, 44],
      // Afrique
      [-6, 35, 2, 37, 10, 37, 19, 32, 25, 32, 33, 31, 35, 26, 37, 20, 39, 15, 43, 12,
        51, 12, 48, 5, 42, 0, 40, -8, 40, -16, 35, -22, 32, -27, 26, -34, 20, -35, 16, -29,
        12, -18, 9, -6, 6, 0, 2, 5, -4, 5, -8, 4, -13, 9, -17, 15, -17, 21, -14, 28, -10, 32],
      // Amerique du Nord
      [-168, 66, -166, 60, -158, 57, -152, 59, -148, 61, -140, 60, -134, 57, -128, 52,
        -124, 47, -122, 38, -118, 34, -114, 30, -110, 24, -106, 22, -101, 17, -96, 16,
        -92, 15, -88, 16, -84, 10, -80, 9, -83, 15, -88, 21, -91, 19, -95, 19, -97, 26,
        -94, 29, -89, 29, -85, 30, -81, 25, -80, 32, -76, 36, -74, 40, -70, 42, -66, 45,
        -60, 47, -55, 52, -64, 58, -70, 62, -78, 62, -82, 66, -76, 68, -70, 70, -80, 73,
        -95, 70, -105, 69, -115, 70, -125, 70, -135, 69, -145, 70, -156, 71, -164, 68],
      // Amerique du Sud
      [-77, 8, -72, 12, -64, 11, -60, 8, -52, 5, -50, 0, -44, -3, -38, -5, -35, -8,
        -38, -13, -39, -18, -43, -23, -48, -25, -54, -34, -57, -38, -62, -40, -65, -45,
        -68, -50, -70, -55, -74, -52, -75, -46, -73, -42, -73, -37, -71, -30, -70, -23,
        -71, -18, -76, -14, -79, -8, -81, -5, -80, 0, -78, 5],
      // Australie
      [114, -22, 114, -27, 116, -32, 119, -34, 124, -33, 129, -32, 134, -33, 138, -35,
        141, -38, 146, -39, 150, -37, 153, -32, 153, -26, 149, -21, 146, -18, 142, -11,

    function refine(flat, passes, seed, rough) {
      var pts = [], i;

      for (var p = 0; p < passes; p++) {

    var COASTS = store.co;
    if (!COASTS) {

          p: refine(RAW[ci], big ? 4 : 3, 1000 + ci * 4093, 0.26),
          big: big, seed: 3000 + ci * 977

      // Calottes : frontiere de glace dentelee, refermee par le limbe a la projection.

    var Rr = R * 2.42;
    var sinT = lerp(0.13, 0.30, ss(0.24, 1, A));
    var cosT = Math.sqrt(1 - sinT * sinT);

      var X = x * cRo - y * sRo, Y = x * sRo + y * cRo;

      q = rp(p1, r1); c.lineTo(q[0], q[1]);
      q = rp(p0, r1); c.lineTo(q[0], q[1]);
      c.closePath();
    }

    function ringHalf(front) {

          var e = rp(pm, Rr + hw * 1.05);
          var lx = e[0], ly = e[1];
          var e2 = rp(pm, Rr - hw * 1.05);

          c.beginPath(); c.arc(e2[0], e2[1], lr, 0, TAU); c.fill();

            gh.addColorStop(0, rg(col[0], col[1], col[2], la * 0.42));
            gh.addColorStop(1, rg(col[0], col[1], col[2], 0));
            c.fillStyle = gh;
            c.beginPath(); c.arc(lx, ly, R * 0.055, 0, TAU); c.fill();

    }

    if (pRing > 0.004) ringHalf(false);

    // ========================= 2. la planete ==========================
    c.save();
    c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.clip();

    // --- oceans : bande de latitude, puis reliefs de fond
    var og = c.createLinearGradient(cx, cy - R, cx, cy + R);
    og.addColorStop(0.00, om(14, 42, 78, 1));
    og.addColorStop(0.22, om(12, 52, 104, 1));
    og.addColorStop(0.50, om(16, 78, 140, 1));
    og.addColorStop(0.78, om(12, 54, 106, 1));
    og.addColorStop(1.00, om(14, 40, 74, 1));
    c.fillStyle = og;
    c.fillRect(cx - R, cy - R, 2 * R, 2 * R);

    for (var b = 0; b < 54; b++) {
      var blon = al(200 + b * 3) * 360 - 180;
      var blat = (al(201 + b * 3) - 0.5) * 150;
      var brad = 0.10 + al(202 + b * 3) * 0.24;
      var dark = al(203 + b * 3) < 0.55;
      sphBlob(blon, blat, brad, spin, function (rr) {
        var g = c.createRadialGradient(0, 0, 0, 0, 0, rr);
        g.addColorStop(0, dark ? om(6, 26, 58, 0.50) : om(34, 116, 168, 0.34));
        g.addColorStop(0.6, dark ? om(6, 26, 58, 0.26) : om(34, 116, 168, 0.17));
        g.addColorStop(1, dark ? om(6, 26, 58, 0) : om(34, 116, 168, 0));
        c.fillStyle = g;
        c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.fill();
      });
    }

    // --- continents
    function terrainColor(lat, u) {
      var a = lat < 0 ? -lat : lat;
      if (a < 11) return u < 0.30 ? [42, 88, 44] : [30, 72, 36];        // foret dense
      if (a < 20) return u < 0.45 ? [96, 118, 56] : [46, 92, 46];
      if (a < 32) return u < 0.62 ? [172, 142, 88] : [138, 122, 74];    // ceintures desertiques
      if (a < 46) return u < 0.50 ? [104, 112, 62] : [76, 98, 58];
      if (a < 58) return u < 0.55 ? [62, 84, 58] : [80, 96, 62];        // foret boreale
      return u < 0.5 ? [128, 136, 130] : [152, 158, 152];               // toundra
    }

    for (var ic = 0; ic < COASTS.length; ic++) {
      var cont = COASTS[ic];

      c.strokeStyle = om(38, 128, 172, 0.55);
      c.lineWidth = R * 0.013;

      c.fillStyle = om(74, 92, 58, 1);

      c.save();
      c.clip();

      var lo0 = 999, lo1 = -999, la0 = 999, la1 = -999;
      for (var q2 = 0; q2 < cont.p.length; q2 += 3) {
        var pp = cont.p[q2];
        if (pp[0] < lo0) lo0 = pp[0]; if (pp[0] > lo1) lo1 = pp[0];
        if (pp[1] < la0) la0 = pp[1]; if (pp[1] > la1) la1 = pp[1];
      }
      for (var q = 0; q < nb; q++) {
        var tlon = lerp(lo0, lo1, al(s0 + q * 4));
        var tlat = lerp(la0, la1, al(s0 + q * 4 + 1));
        var u = al(s0 + q * 4 + 2);
        var col = terrainColor(tlat, u);
        var trad = 0.05 + al(s0 + q * 4 + 3) * 0.13;
        sphBlob(tlon, tlat, trad, spin, function (rr) {
          var g = c.createRadialGradient(0, 0, 0, 0, 0, rr);
          g.addColorStop(0, om(col[0], col[1], col[2], 0.92));
          g.addColorStop(0.55, om(col[0], col[1], col[2], 0.60));
          g.addColorStop(1, om(col[0], col[1], col[2], 0));
