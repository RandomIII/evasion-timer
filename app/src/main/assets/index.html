  c.strokeStyle = ecorce(0.99, 0.13); c.lineWidth = epMoy * 0.7; c.stroke();
  c.lineCap = 'round';
  // bourrelets à la naissance des branches
  c.fillStyle = ecorce(0.05, 0.13);
  for (const j of jonctions) {
    c.beginPath(); c.ellipse(j[0], j[1], j[2] * 2.2, j[2] * 1.25, 0, 0, 6.2832); c.fill();
  }
  // liseré froid sur la tranche à l'ombre : c'est le ciel qui s'y reflète
  c.beginPath(); courbe(gauche, true);
  c.strokeStyle = 'rgba(126,168,208,' + (0.26 - n * 0.12) + ')';
  c.lineWidth = 4.5 * E; c.stroke();
  c.beginPath(); courbe(droite, true);
  c.strokeStyle = ecorce(1, 0.34); c.lineWidth = 4 * E; c.stroke();

  c.restore();
  c.restore();
  return ancres;
}

/* ---- le feuillage ----
   Chaque bouquet est un amas de vraies feuilles, dessinées une à une. Une masse
   festonnée d'un seul tenant donnait des boules de brocoli. Comme il en faut
   deux cents par bouquet, on les cuit dans un sprite : la saison et l'heure
   déterminent la variante, et une variante ne se recalcule qu'au changement. */
const BOUQUETS = { cle: "", tab: null };
const BQ_TAILLE = 232, BQ_N = 6;
let ARBRE_COSMOS = false;

/* ---- l'univers derrière les feuilles ----
   Une seule grande texture de cosmos, révélée à travers la découpe du feuillage.
   Peindre une nébuleuse dans chaque feuille donnait des confettis ; ici toute la
   canopée est une fenêtre sur un même ciel. */
let universSprite = null;
function spriteUnivers() {
  if (universSprite) return universSprite;
  const S = 1024;
  universSprite = document.createElement('canvas');
  universSprite.width = universSprite.height = S;
  const g = universSprite.getContext('2d');
  const rnd = (i) => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

  g.fillStyle = '#030209';
  g.fillRect(0, 0, S, S);

  // nappes de gaz : chaque foyer est un amas de lobes décalés, un cercle net
  // ne ressemblant à rien de céleste
  g.globalCompositeOperation = 'lighter';
  const FOYERS = [
    [0.24, 0.30, 0.46, '190,70,240'], [0.72, 0.24, 0.40, '60,140,255'],
    [0.58, 0.72, 0.50, '240,90,140'], [0.14, 0.78, 0.36, '70,220,215'],
    [0.86, 0.62, 0.30, '255,170,80'], [0.44, 0.46, 0.34, '130,90,255']
  ];
  for (let q = 0; q < FOYERS.length; q++) {
    const f = FOYERS[q];
    for (let k = 0; k < 10; k++) {
      const a = rnd(q * 40 + k) * 6.2832, d = rnd(q * 40 + k + 20) * f[2] * S * 0.5;
      const x = f[0] * S + Math.cos(a) * d, y = f[1] * S + Math.sin(a) * d;
      const r = f[2] * S * (0.26 + rnd(q * 40 + k + 40) * 0.44);
      const ng = g.createRadialGradient(x, y, 0, x, y, r);
      ng.addColorStop(0, 'rgba(' + f[3] + ',.22)');
      ng.addColorStop(0.45, 'rgba(' + f[3] + ',.09)');
      ng.addColorStop(1, 'rgba(' + f[3] + ',0)');
      g.fillStyle = ng;
      g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
    }
  }

  // poussière : des voiles sombres qui découpent les nappes
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 46; i++) {
    const x = rnd(i + 900) * S, y = rnd(i + 940) * S;
    const r = S * (0.04 + rnd(i + 980) * 0.11);
    const dg = g.createRadialGradient(x, y, 0, x, y, r);
    dg.addColorStop(0, 'rgba(4,2,10,.58)');
    dg.addColorStop(1, 'rgba(4,2,10,0)');
    g.fillStyle = dg;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }

  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9000; i++) {
    const x = rnd(i + 2000) * S, y = rnd(i + 3000) * S, b = rnd(i + 4000);
    g.fillStyle = 'rgba(' + ((214 + b * 41) | 0) + ',' + ((220 + b * 35) | 0)
                + ',255,' + (0.30 + b * 0.68).toFixed(2) + ')';
    g.beginPath(); g.arc(x, y, b * 1.5 + 0.45, 0, 6.2832); g.fill();
  }
  for (let i = 0; i < 240; i++) {               // les vives, avec leur halo
    const x = rnd(i + 6000) * S, y = rnd(i + 6500) * S, r = 1.4 + rnd(i + 7000) * 2.4;
    const hg = g.createRadialGradient(x, y, 0, x, y, r * 6);
    hg.addColorStop(0, 'rgba(255,255,255,.95)');
    hg.addColorStop(0.22, 'rgba(200,220,255,.30)');
    hg.addColorStop(1, 'rgba(150,190,255,0)');
    g.fillStyle = hg;
    g.beginPath(); g.arc(x, y, r * 6, 0, 6.2832); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  return universSprite;
}

function cuitBouquets(saison, nuitQ, cosmos) {
  const cle = (cosmos ? 'cosmos' : saison.nom) + '|' + nuitQ;
  if (BOUQUETS.cle === cle) return BOUQUETS.tab;
  const k = (cosmos ? 0 : nuitQ / 10) * 0.62;
  const P = saison.rampe.map((v) => [
    ((((v >> 16) & 255) * (1 - k) + 14 * k) | 0),
    ((((v >> 8) & 255) * (1 - k) + 30 * k) | 0),
    (((v & 255) * (1 - k) + 48 * k) | 0)
  ]);
  const rgb = (i, a) => 'rgba(' + P[i][0] + ',' + P[i][1] + ',' + P[i][2] + ',' + a + ')';
  const S = BQ_TAILLE, m = S / 2, R = S * 0.46;
  const tab = [];

  for (let v = 0; v < BQ_N; v++) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    const gr = (i) => { const s = Math.sin((i + v * 71.3) * 12.9898 + 78.233) * 43758.5453;
                        return s - Math.floor(s); };

    // contour d'une feuille : limbe en amande, la transformation reste posée
    function chemin(f) {
      const w = f.len * 0.40;
      g.save();
      g.translate(f.x, f.y); g.rotate(f.ang);
      g.beginPath();
      g.moveTo(-f.len * 0.5, 0);
      g.quadraticCurveTo(-f.len * 0.1, -w, f.len * 0.5, 0);
      g.quadraticCurveTo(-f.len * 0.1, w, -f.len * 0.5, 0);
      g.closePath();
      return w;
    }
    function feuille(f) {
      const w = chemin(f);
      g.fillStyle = rgb(f.ton, 1); g.fill();
      g.strokeStyle = rgb(Math.max(0, f.ton - 2), 0.5);
      g.lineWidth = Math.max(0.5, f.len * 0.045); g.stroke();
      g.beginPath();                              // nervure
      g.moveTo(-f.len * 0.42, 0); g.lineTo(f.len * 0.44, 0);
      g.strokeStyle = rgb(Math.min(5, f.ton + 1), 0.42);
      g.lineWidth = Math.max(0.5, f.len * 0.05); g.stroke();
      g.beginPath();                              // reflet sur la face éclairée
      g.moveTo(-f.len * 0.34, -w * 0.12);
      g.quadraticCurveTo(-f.len * 0.05, -w * 0.72, f.len * 0.34, -w * 0.10);
      g.quadraticCurveTo(-f.len * 0.05, -w * 0.30, -f.len * 0.34, -w * 0.12);
      g.closePath();
      g.fillStyle = rgb(Math.min(5, f.ton + 2), 0.34); g.fill();
      g.restore();
    }

    /* Trois couches décalées vers la lumière : le fond est sombre et large, le
       dessus clair et resserré en haut à droite. C'est l'empilement qui fait le
       volume, pas un dégradé. */
    const COUCHES = [
      { nb: 64, dx: -0.10, dy: 0.11, ray: 1.00, len: 0.300, tons: [0, 1] },
      { nb: 52, dx: 0.00, dy: -0.01, ray: 0.84, len: 0.280, tons: [1, 2, 3] },
      { nb: 40, dx: 0.13, dy: -0.14, ray: 0.60, len: 0.255, tons: [3, 4] },
      { nb: 18, dx: 0.21, dy: -0.22, ray: 0.36, len: 0.235, tons: [4, 5] }
    ];
    const paquet = [];
    let s = 0;
    for (const co of COUCHES) {
      for (let i = 0; i < co.nb; i++, s++) {
        const a = gr(s * 2.1) * 6.2832;
        // racine carrée : sans elle tout s'entasse au centre et le bord est nu
        const d = Math.sqrt(gr(s * 3.7 + 1)) * R * co.ray;
        const x = m + co.dx * R + Math.cos(a) * d;
        const y = m + co.dy * R + Math.sin(a) * d * 0.88;
        const len = R * co.len * (0.72 + gr(s * 5.3 + 2) * 0.62);
        // les feuilles du bord pointent vers l'extérieur, celles du cœur non
        const dehors = Math.min(1, d / (R * co.ray + 0.001));
        const ang = a * dehors + (gr(s * 7.1 + 3) - 0.5) * (3.4 - dehors * 2.1);
        const ton = co.tons[(gr(s * 9.7 + 4) * co.tons.length) | 0];
        paquet.push({ x: x, y: y, len: len, ang: ang, ton: ton });
      }
    }

    if (cosmos) {
      /* Le feuillage sert de pochoir. L'opacité du masque suit la couche :
         les feuilles du fond laissent passer moins d'univers, ce qui rend la
         profondeur sans avoir à les assombrir. */
      for (const f of paquet) {
        chemin(f);
        g.fillStyle = 'rgba(255,255,255,' + (0.64 + f.ton * 0.072).toFixed(3) + ')';
        g.fill();
        g.restore();
      }
      g.globalCompositeOperation = 'source-in';
      const U = spriteUnivers(), SW = 190;
      g.drawImage(U, (v * 137) % (1024 - SW), (v * 251) % (1024 - SW), SW, SW, 0, 0, S, S);
      g.globalCompositeOperation = 'source-over';
      for (const f of paquet) {                  // nervure et bord, sinon ce n'est plus une feuille
        chemin(f);
        g.strokeStyle = 'rgba(46,28,86,.60)';   // un bord sombre sépare, un bord clair bave
        g.lineWidth = Math.max(0.6, f.len * 0.05); g.stroke();
        g.beginPath();
        g.moveTo(-f.len * 0.40, 0); g.lineTo(f.len * 0.42, 0);
        g.strokeStyle = 'rgba(214,196,255,.34)';
        g.lineWidth = Math.max(0.5, f.len * 0.035); g.stroke();
        g.restore();
      }
    } else {
      for (const f of paquet) feuille(f);
      if (saison.fleurs) {
        for (let i = 0; i < 16; i++) {
          const a = gr(i * 11.3 + 900) * 6.2832;
          const d = Math.sqrt(gr(i * 13.1 + 901)) * R * 0.9;
          const x = m + Math.cos(a) * d, y = m + Math.sin(a) * d * 0.88;
          const rr = R * (0.026 + gr(i + 902) * 0.018);
          for (let q = 0; q < 5; q++) {
            const aa = q * 1.2566 + gr(i + 903) * 3;
            g.fillStyle = saison.fleurs;
            g.beginPath();
            g.ellipse(x + Math.cos(aa) * rr, y + Math.sin(aa) * rr, rr * 0.72, rr * 0.5, aa, 0, 6.2832);
            g.fill();
          }
          g.fillStyle = 'rgba(255,238,170,.95)';
          g.beginPath(); g.arc(x, y, rr * 0.42, 0, 6.2832); g.fill();
        }
      }
    }
    tab.push(cv);
  }
  BOUQUETS.cle = cle; BOUQUETS.tab = tab;
  return tab;
}

function dessineFeuillage(c, E, x, y, taille, graine, t, nuit) {
  const R = taille * E;
  if (!(R > 1)) return;
  const nq = Math.round(Math.min(1, Math.max(0, nuit || 0)) * 10);
  const tab = cuitBouquets(SAISON, nq, ARBRE_COSMOS);
  /* Le hachage vient de la graine de l'ancre, jamais de sa position : celle-ci
     dérive avec le balancement, et la variante de sprite changeait à chaque
     frame — le bouquet clignotait d'une texture à l'autre. */
  const h1 = Math.abs(Math.sin(graine * 12.9898) * 43758.5453) % 1;
  const h2 = Math.abs(Math.sin(graine * 78.233 + 4.1) * 24634.6345) % 1;
  const sp = tab[((h1 * BQ_N) | 0) % BQ_N];
  const ph = h2 * 6.2832;
  const d = R * 2.35 * (0.86 + h2 * 0.30);
  c.save();
  c.translate(x + Math.sin(t * 0.83 + ph) * R * 0.035,
              y + Math.cos(t * 0.61 + ph * 1.7) * R * 0.022);
  c.rotate((h2 - 0.5) * 1.4 + Math.sin(t * 0.47 + ph) * 0.022);
  const resp = 1 + Math.sin(t * 0.53 + ph) * 0.014;
  c.drawImage(sp, -d * resp / 2, -d * resp / 2, d * resp, d * resp);
  c.restore();
}

function dessineCouronne(c, E, tx, cimeY, taille, t, nuit) {
  const R = taille * E;
  if (!(R > 1)) return;
  // la couronne n'est qu'un empilement plus dense, du côté ombre vers la lumière
  const M = [
    [-0.72, 0.26, 0.54], [-0.34, 0.50, 0.44], [0.22, 0.50, 0.42],
    [0.70, 0.26, 0.50], [-0.60, -0.34, 0.52], [0.00, -0.14, 1.00],
    [-0.14, -0.84, 0.54], [0.48, -0.50, 0.58], [0.22, -1.02, 0.40],
    [0.64, -0.82, 0.30]
  ];
  for (let i = 0; i < M.length; i++)
    dessineFeuillage(c, E, tx + M[i][0] * R, cimeY + M[i][1] * R,
                     taille * M[i][2], i * 5.6 + 3.1, t, nuit);
}

  /* ---- assets du sol : prairie et nid ---- */
function dessineSol(c, E, W, Hh, solY, t, nuit) {
  if (solY > Hh + 8 * E) return;

  const TAU = 6.2831853;
  const q = Math.round(nuit * 24) / 24;
  let S = dessineSol._cache;

  if (!S || S.q !== q || S.E !== E || S.W !== W || S.Hh !== Hh) {
    // "brume" = perspective atmosphérique : plus un plan est loin, plus il se délave
    const teinte = (hex, brume) => {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      r += (202 - r) * brume; g += (218 - g) * brume; b += (178 - b) * brume;
      const l = r * 0.3 + g * 0.55 + b * 0.15;
      r += (l * 0.62 - r) * q; g += (l * 0.74 - g) * q; b += (l * 1.02 + 14 - b) * q;
      const k = 1 - 0.54 * q;
      return 'rgb(' + ((r * k) | 0) + ',' + ((g * k) | 0) + ',' + ((b * k) | 0) + ')';
    };
    // hachage déterministe : les positions doivent être identiques à chaque frame
    const alea = (i) => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
    const touffe = (taille, nb, graine) => {
      const l = [];
      for (let k = 0; k < nb; k++) {
        const a = alea(graine + k * 3.7), b = alea(graine + k * 8.3 + 17), u = k - (nb - 1) / 2;
        l.push({
          dx: u * taille * 0.16 + (a - 0.5) * taille * 0.1,
          h: taille * (0.58 + 0.42 * b) * (1 - 0.1 * Math.abs(u)),
          incl: u * taille * 0.3 + (a - 0.5) * taille * 0.16,
          w: taille * 0.06 + 0.45
        });
      }
      return l;
    };

    const P = {
      loin: teinte('#9BCB63', 0.44), loinBrin: teinte('#9BCB63', 0.66),
      med: teinte('#74AE4A', 0.2), medBrin: teinte('#4E8438', 0.14), medLisiere: teinte('#9BCB63', 0.32),
      presLisiere: teinte('#74AE4A', 0.04), brin: teinte('#1F3D1E', 0), brinClair: teinte('#74AE4A', 0),
      frange: teinte('#1F3D1E', 0), strate: teinte('#5C3F27', 0),
      racine: teinte('#2A1C12', 0), tige: teinte('#35602C', 0), tigeLoin: teinte('#4E8438', 0.24),
      caillou: teinte('#8E8B80', 0), caillouOmbre: teinte('#2A1C12', 0), caillouClair: teinte('#ABA79A', 0),
      petaleA: teinte('#F4E9AE', 0), petaleB: teinte('#F2E2EE', 0), coeur: teinte('#E2A335', 0),
      petaleLoin: teinte('#F4E9AE', 0.4)
    };

    const gPres = c.createLinearGradient(0, 21 * E, 0, 44 * E);
    gPres.addColorStop(0, teinte('#4E8438', 0.05));
    gPres.addColorStop(0.5, teinte('#35602C', 0));
    gPres.addColorStop(1, teinte('#1F3D1E', 0));

    const L = Math.max(Hh, 160 * E);
    const gTerre = c.createLinearGradient(0, 37 * E, 0, 37 * E + L);
    gTerre.addColorStop(0, teinte('#1B120A', 0));
    gTerre.addColorStop(Math.min(0.86, 4 * E / L), teinte('#6B4A2E', 0));
    gTerre.addColorStop(Math.min(0.92, 26 * E / L), teinte('#4A3120', 0));
    gTerre.addColorStop(1, teinte('#2A1C12', 0));

    const loin = [], med = [], pres = [], frange = [], fLoin = [], fPres = [], cailloux = [], pierres = [], racines = [];
    let i = 0;
    for (let x = -4 * E; x < W + 4 * E; x += (4.5 + alea(i) * 3.5) * E, i++)
      loin.push({ x: x, h: (1.6 + alea(i + 91) * 2.4) * E, l: (1.1 + alea(i + 41) * 1.2) * E });
    i = 0;
    for (let x = -6 * E; x < W + 6 * E; x += (8 + alea(i + 7) * 6) * E, i++) {
      const taille = (4.5 + alea(i + 13) * 3.5) * E;
      med.push({ x: x, ph: alea(i + 29) * TAU, brins: touffe(taille, 3, i * 13 + 3) });
    }
    i = 0;
    for (let x = -8 * E; x < W + 8 * E; x += (10 + alea(i + 3) * 8) * E, i++) {
      const taille = (9 + alea(i + 17) * 7) * E;
      pres.push({ x: x, ph: alea(i + 5) * TAU, brins: touffe(taille, 5, i * 31 + 11) });
    }
    i = 0;
    for (let x = -4 * E; x < W + 4 * E; x += (3.5 + alea(i + 55) * 2.5) * E, i++)
      frange.push({ x: x, h: (4 + alea(i + 67) * 5) * E, w: 0.8 * E, ph: alea(i + 71) * TAU });

    const nf = Math.max(3, Math.round(W / (170 * E)));
    for (let k = 0; k < nf; k++)
      fPres.push({
        x: (0.04 + 0.92 * alea(k * 5 + 61)) * W, h: (6 + alea(k * 9 + 7) * 5) * E,
        r: (1.4 + alea(k * 11 + 3) * 0.9) * E, type: alea(k * 7 + 23) < 0.55 ? 0 : 1, ph: alea(k * 3 + 2) * TAU
      });
    const nfl = Math.max(2, Math.round(W / (300 * E)));
    for (let k = 0; k < nfl; k++)
      fLoin.push({ x: (0.06 + 0.88 * alea(k * 13 + 5)) * W, h: (3 + alea(k * 17 + 9) * 2) * E, r: 0.95 * E, type: 0, ph: alea(k * 19 + 1) * TAU });

    const nc = Math.max(3, Math.round(W / (220 * E)));
    for (let k = 0; k < nc; k++)
      cailloux.push({ x: (0.05 + 0.9 * alea(k * 23 + 11)) * W, y: (28 + alea(k * 29 + 3) * 7) * E, r: (1.5 + alea(k * 31 + 7) * 1.4) * E });
    for (let k = 0; k < nc; k++)
      pierres.push({ x: (0.04 + 0.92 * alea(k * 37 + 19)) * W, y: (48 + alea(k * 41 + 5) * 46) * E, r: (1.8 + alea(k * 43 + 13) * 2) * E });
    const nr = Math.max(3, Math.round(W / (130 * E)));
    for (let k = 0; k < nr; k++)
      racines.push({
        x: (0.05 + 0.9 * alea(k * 47 + 29)) * W, len: (18 + alea(k * 53 + 3) * 34) * E,
        w: (1.8 + alea(k * 59 + 7) * 1.9) * E, courbe: (alea(k * 61 + 11) - 0.5) * 24 * E
      });

    S = dessineSol._cache = {
      q: q, E: E, W: W, Hh: Hh, P: P, gPres: gPres, gTerre: gTerre,
      loin: loin, med: med, pres: pres, frange: frange, fLoin: fLoin, fPres: fPres,
      cailloux: cailloux, pierres: pierres, racines: racines
    };
  }

  const P = S.P, u = 1 / E;
  const ondLoin = (x) => (Math.sin(x * u * 0.0135) * 2.3 + Math.sin(x * u * 0.031 + 2.1) * 1.1) * E;
  const ondMed = (x) => 10 * E + (Math.sin(x * u * 0.0172 + 1.3) * 2.1 + Math.sin(x * u * 0.044 + 0.4) * 0.9) * E;
  const ondPres = (x) => 22 * E + (Math.sin(x * u * 0.0121 + 3.4) * 2.5 + Math.sin(x * u * 0.037 + 2.6) * 1.1) * E;
  const ondTerre = (x) => 37 * E + (Math.sin(x * u * 0.021 + 0.8) * 1.9 + Math.sin(x * u * 0.052 + 1.9) * 0.8) * E;
  const vent = (ph) => Math.sin(t * 1.15 + ph) * 0.62 + Math.sin(t * 0.47 + ph * 1.7) * 0.38;

  c.save();
  c.translate(0, solY);
  const bas = Hh - solY + 12 * E, g = -6 * E, d = W + 6 * E, pas = Math.max(5, 7 * E);

  const bande = (ond, remplissage, lisiere) => {
    c.beginPath();
    c.moveTo(g, ond(g));
    for (let x = g + pas; x < d; x += pas) c.lineTo(x, ond(x));
    c.lineTo(d, ond(d));
    c.lineTo(d, bas);
    c.lineTo(g, bas);
    c.closePath();
    c.fillStyle = remplissage;
    c.fill();
    if (lisiere) { c.strokeStyle = lisiere; c.lineWidth = Math.max(1, 1.1 * E); c.stroke(); }
  };

  const brin = (bx, by, h, incl, w) => {
    const mx = bx + incl * 0.25, my = by - h * 0.58;
    c.moveTo(bx - w, by);
    c.quadraticCurveTo(mx - w * 0.55, my, bx + incl, by - h);
    c.quadraticCurveTo(mx + w * 0.55, my, bx + w, by);
  };

  const fleur = (f, base, tigeC, petaleC, coeurC, ech) => {
    const v = vent(f.ph), dx = v * f.h * 0.28, cx = f.x + dx, cy = base - f.h;
    c.strokeStyle = tigeC;
    c.lineWidth = Math.max(1, 0.5 * ech);
    c.beginPath();
    c.moveTo(f.x, base);
    c.quadraticCurveTo(f.x + dx * 0.25, base - f.h * 0.6, cx, cy);
    c.stroke();
    c.fillStyle = petaleC;
    c.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = k * 1.2566 + 0.5, px = cx + Math.cos(a) * f.r, py = cy + Math.sin(a) * f.r * 0.9, pr = f.r * 0.66;
      c.moveTo(px + pr, py);
      c.arc(px, py, pr, 0, TAU);
    }
    c.fill();
    if (coeurC) {
      c.fillStyle = coeurC;
      c.beginPath();
      c.arc(cx, cy, f.r * 0.42, 0, TAU);
      c.fill();
    }
  };

  const galets = (liste) => {
    c.fillStyle = P.caillouOmbre;
    c.beginPath();
    for (const p of liste) { c.moveTo(p.x + p.r * 1.04, p.y + p.r * 0.3); c.ellipse(p.x, p.y + p.r * 0.3, p.r * 1.04, p.r * 0.6, 0, 0, TAU); }
    c.fill();
    c.fillStyle = P.caillou;
    c.beginPath();
    for (const p of liste) { c.moveTo(p.x + p.r, p.y); c.ellipse(p.x, p.y, p.r, p.r * 0.74, 0, 0, TAU); }
    c.fill();
    c.fillStyle = P.caillouClair;
    c.beginPath();
    for (const p of liste) { c.moveTo(p.x + p.r * 0.46, p.y - p.r * 0.22); c.ellipse(p.x + p.r * 0.18, p.y - p.r * 0.22, p.r * 0.28, p.r * 0.15, 0, 0, TAU); }
    c.fill();
  };

  bande(ondLoin, P.loin, 0);
  c.fillStyle = P.loinBrin;
  c.beginPath();
  for (const o of S.loin) {
    const y = ondLoin(o.x) + 0.6 * E, s = vent(o.x * 0.03) * o.l * 0.4;
    c.moveTo(o.x - o.l, y);
    c.lineTo(o.x + s, y - o.h);
    c.lineTo(o.x + o.l, y);
  }
  c.fill();
  for (const f of S.fLoin) fleur(f, ondMed(f.x) - 1.5 * E, P.tigeLoin, P.petaleLoin, 0, E * 0.7);

  bande(ondMed, P.med, P.medLisiere);
  c.fillStyle = P.medBrin;
  c.beginPath();
  for (const o of S.med) {
    const y = ondMed(o.x) + 1.2 * E, v = vent(o.ph);
    for (const b of o.brins) brin(o.x + b.dx, y, b.h, b.incl + v * b.h * 0.2, b.w);
  }
  c.fill();

  bande(ondPres, S.gPres, P.presLisiere);
  c.fillStyle = P.brin;
  c.beginPath();
  for (const o of S.pres) {
    const y = ondPres(o.x) + 1.8 * E, v = vent(o.ph);
    for (const b of o.brins) brin(o.x + b.dx, y, b.h, b.incl + v * b.h * 0.26, b.w);
  }
  c.fill();
  c.fillStyle = P.brinClair;
  c.beginPath();
  for (const o of S.pres) {
    const y = ondPres(o.x) + 1.8 * E, v = vent(o.ph);
    for (let k = 0; k < o.brins.length; k += 2) {
      const b = o.brins[k];
      brin(o.x + b.dx + b.w * 0.75, y, b.h * 0.84, b.incl + v * b.h * 0.26, b.w * 0.42);
    }
  }
  c.fill();

  galets(S.cailloux);
  for (const f of S.fPres) fleur(f, ondPres(f.x) + 6 * E, P.tige, f.type ? P.petaleB : P.petaleA, P.coeur, E);

  c.fillStyle = P.frange;
  c.beginPath();
  for (const o of S.frange) {
    const v = vent(o.ph);
    brin(o.x, ondTerre(o.x) + 1 * E, o.h, v * o.h * 0.22, o.w);
  }
  c.fill();

  bande(ondTerre, S.gTerre, 0);

  c.fillStyle = P.strate;
  c.beginPath();
  const yStrate = (x) => ondTerre(x) + 17 * E + Math.sin(x * u * 0.019 + 4.2) * 2.4 * E;
  c.moveTo(g, yStrate(g));
  for (let x = g + 14 * E; x < d; x += 14 * E) c.lineTo(x, yStrate(x));
  c.lineTo(d, yStrate(d));
  c.lineTo(d, yStrate(d) + 3.5 * E);
  for (let x = d - 14 * E; x > g; x -= 14 * E) c.lineTo(x, yStrate(x) + 3.5 * E);
  c.lineTo(g, yStrate(g) + 3.5 * E);
  c.closePath();
  c.fill();

  c.fillStyle = P.racine;
  c.beginPath();
  for (const r of S.racines) {
    const y0 = ondTerre(r.x) + 1.5 * E;
    brin(r.x, y0, -r.len, r.courbe, r.w);
    const mx = r.x + r.courbe * 0.28, my = y0 + r.len * 0.5;
    brin(mx, my, -r.len * 0.34, r.courbe * 0.5 + (r.courbe > 0 ? -5.5 : 5.5) * E, r.w * 0.5);
  }
  c.fill();

  galets(S.pierres);

  c.restore();
}

function dessineNid(c, E, x, y, t, nuit) {
  const TAU = 6.2831853;
  const q = Math.round(nuit * 24) / 24;
  const alea = (i) => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
  let S = dessineNid._cache;

  if (!S || S.q !== q || S.E !== E) {
    const teinte = (hex) => {
      const n = parseInt(hex.slice(1), 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      const l = r * 0.3 + g * 0.55 + b * 0.15;
      r += (l * 0.62 - r) * q; g += (l * 0.74 - g) * q; b += (l * 1.02 + 14 - b) * q;
      const k = 1 - 0.54 * q;
      return 'rgb(' + ((r * k) | 0) + ',' + ((g * k) | 0) + ',' + ((b * k) | 0) + ')';
    };
    const Rx = 15 * E, Ry = 9 * E;
    const P = {
      creux: teinte('#3A2617'), dessous: teinte('#4A3120'), sombre: teinte('#6B4A2E'),
      moyen: teinte('#8A6340'), clair: teinte('#A87A4E'),
      tache: teinte('#B08D63'),
      ombre: 'rgba(22,13,7,' + (0.2 - 0.09 * q).toFixed(3) + ')'
    };
    const gNid = c.createLinearGradient(-Rx * 0.75, Ry, Rx * 0.85, -Ry);
    gNid.addColorStop(0, teinte('#54381F'));
    gNid.addColorStop(0.5, teinte('#6B4A2E'));
    gNid.addColorStop(1, teinte('#9C7046'));
    const gOeuf = c.createRadialGradient(1.4 * E, -2 * E, 0.3 * E, 0, 0, 6.6 * E);
    gOeuf.addColorStop(0, teinte('#FFFCF4'));
    gOeuf.addColorStop(0.42, teinte('#EFE6D6'));
    gOeuf.addColorStop(1, teinte('#C9B69C'));

    const oeufs = [
      { ox: -Rx * 0.34, oy: -Ry * 0.24, rot: -0.3, r: 3.9 * E },
      { ox: Rx * 0.02, oy: -Ry * 0.48, rot: 0.05, r: 4.1 * E },
      { ox: Rx * 0.38, oy: -Ry * 0.2, rot: 0.32, r: 3.7 * E }
    ];
    for (let k = 0; k < oeufs.length; k++) {
      const taches = [];
      for (let j = 0; j < 11; j++) {
        const a = alea(k * 17 + j * 5.3) * TAU, dist = 0.22 + 0.55 * alea(k * 23 + j * 9.1);
        taches.push({
          sx: Math.cos(a) * dist * oeufs[k].r, sy: Math.sin(a) * dist * oeufs[k].r * 1.2,
          sr: (0.18 + 0.24 * alea(k * 31 + j * 3.7)) * E
        });
      }
      oeufs[k].taches = taches;
    }
    S = dessineNid._cache = { q: q, E: E, Rx: Rx, Ry: Ry, P: P, gNid: gNid, gOeuf: gOeuf, oeufs: oeufs };
  }

  const Rx = S.Rx, Ry = S.Ry, P = S.P;
  const bal = Math.sin(t * 0.62) * 0.022 + Math.sin(t * 0.23 + 1.1) * 0.012;

  c.save();
  c.translate(x, y);
  c.rotate(-0.035 + bal);
  c.lineCap = 'round';

  const bri = (x0, y0, cx, cy, x1, y1, w, col) => {
    c.strokeStyle = col;
    c.lineWidth = w;
    c.beginPath();
    c.moveTo(x0, y0);
    c.quadraticCurveTo(cx, cy, x1, y1);
    c.stroke();
  };
  // rebord du nid : ellipse vue de trois quarts, base de toute la géométrie
  const bordX = (a) => Math.cos(a) * Rx;
  const bordY = (a) => -Ry * 0.5 + Math.sin(a) * Ry * 0.45;

  c.fillStyle = P.ombre;
  c.beginPath();
  c.moveTo(Rx * 0.94, Ry * 0.99);
  c.ellipse(0, Ry * 0.99, Rx * 0.94, Ry * 0.2, 0, 0, TAU);
  c.fill();

  const saillies = [-0.55, -0.15, 0.35, 0.95, 1.55, 2.25, 2.7, 3.35];
  for (let k = 0; k < saillies.length; k++) {
    const a = saillies[k] + (alea(k * 3.1) - 0.5) * 0.18;
    const bx = bordX(a), by = bordY(a) + Math.max(0, Math.sin(a)) * Ry * 0.55;
    const nx = Math.cos(a), ny = Math.sin(a) * 0.7 + 0.15;
    const len = (2.6 + alea(k * 5.7) * 3.4) * E;
    bri(bx - nx * 3.5 * E, by - ny * 3.5 * E, bx + nx * len * 0.5, by + ny * len * 0.5 + (alea(k * 7.3) - 0.5) * 2 * E,
      bx + nx * len, by + ny * len, (0.8 + alea(k * 9.1) * 0.7) * E, k % 2 ? P.sombre : P.moyen);
  }

  bri(-Rx * 1.1, Ry * 0.2, -Rx * 0.2, Ry * 1.25, Rx * 0.62, Ry * 1.05, 1.5 * E, P.dessous);
  bri(Rx * 1.1, Ry * 0.18, Rx * 0.2, Ry * 1.3, -Rx * 0.58, Ry * 1.05, 1.4 * E, P.dessous);

  c.beginPath();
  c.moveTo(-Rx, -Ry * 0.45);
  c.bezierCurveTo(-Rx * 0.99, Ry * 0.72, -Rx * 0.58, Ry, 0, Ry);
  c.bezierCurveTo(Rx * 0.58, Ry, Rx * 0.99, Ry * 0.72, Rx, -Ry * 0.45);
  c.bezierCurveTo(Rx * 0.6, -Ry * 1.12, -Rx * 0.6, -Ry * 1.12, -Rx, -Ry * 0.45);
  c.closePath();
  c.fillStyle = S.gNid;
  c.fill();

  c.fillStyle = P.creux;
  c.beginPath();
  c.moveTo(Rx * 0.84, -Ry * 0.5);
  c.ellipse(0, -Ry * 0.5, Rx * 0.84, Ry * 0.38, 0, 0, TAU);
  c.fill();

  bri(-Rx * 0.96, -Ry * 0.52, 0, -Ry * 1.36, Rx * 0.96, -Ry * 0.52, 1.5 * E, P.moyen);
  bri(-Rx * 0.82, -Ry * 0.66, -Rx * 0.05, -Ry * 1.18, Rx * 0.88, -Ry * 0.58, 1.2 * E, P.clair);

  for (const o of S.oeufs) {
    c.save();
    c.translate(o.ox, o.oy);
    c.rotate(o.rot);
    c.scale(1, 1.28);
    c.beginPath();
    c.arc(0, 0, o.r, 0, TAU);
    c.fillStyle = S.gOeuf;
    c.fill();
    c.fillStyle = P.tache;
    c.beginPath();
    for (const s of o.taches) { c.moveTo(s.sx + s.sr, s.sy); c.arc(s.sx, s.sy, s.sr, 0, TAU); }
    c.fill();
    c.restore();
  }

  bri(-Rx * 0.9, -Ry * 0.38, -Rx * 0.1, Ry * 0.26, Rx * 0.86, -Ry * 0.46, 1.6 * E, P.clair);
  bri(-Rx * 0.94, -Ry * 0.16, Rx * 0.06, Ry * 0.44, Rx * 0.92, -Ry * 0.24, 1.4 * E, P.moyen);

  for (let j = 0; j < 4; j++) {
    const f = (j + 1) / 4.6;
    const ex = Rx * (1 - 0.5 * f * f), ey = -Ry * 0.42 + Ry * 0.9 * f;
    const my = -Ry * 0.06 + Ry * 1.12 * f;
    bri(-ex, ey, 0, 2 * my - ey, ex, ey, (1.5 - 0.15 * j) * E, j % 2 ? P.moyen : P.sombre);
  }

  for (let k = 0; k < 9; k++) {
    const s = k % 2 ? 1 : -1, a = 0.28 + k * 0.32;
    const hx = bordX(a) * 0.94, hy = bordY(a) + Ry * 0.34;
    const bxx = hx * 0.52 + s * Rx * 0.1, byy = Ry * (0.62 + alea(k * 11.3) * 0.34);
    bri(hx, hy, (hx + bxx) * 0.5 + s * Rx * 0.16, (hy + byy) * 0.5, bxx, byy,
      (0.85 + alea(k * 13.7) * 0.6) * E, k % 3 === 0 ? P.clair : (k % 3 === 1 ? P.moyen : P.sombre));
  }

  bri(Rx * 0.34, -Ry * 0.62, Rx * 0.66, -Ry * 0.34, Rx * 0.86, Ry * 0.1, 1.1 * E, P.clair);
  bri(Rx * 0.06, Ry * 0.52, Rx * 0.42, Ry * 0.62, Rx * 0.72, Ry * 0.36, 0.9 * E, P.clair);
  bri(-Rx * 0.86, -Ry * 0.2, -Rx * 0.6, Ry * 0.22, -Rx * 0.24, Ry * 0.52, 1 * E, P.dessous);

  c.restore();
}

  /* ---- les nuages ----
     Trois passes décalées vers le soleil : la silhouette entière dans le ton
     d'ombre, la partie éclairée par-dessus, puis les crêtes. Des bouffées
     dégradées empilées ne donnaient qu'une tache de brouillard. */
  const NUAGES_SP = { cle: "", tab: null };
  const NU_W = 420, NU_H = 260, NU_N = 5;
  function cuitNuages(nuitQ){
    const cle = "" + nuitQ;
    if (NUAGES_SP.cle === cle) return NUAGES_SP.tab;
    const n = nuitQ / 10;
    const c3 = (r, g, b, a) => "rgba(" + Math.round(r * (1 - n) + 22 * n) + ","
             + Math.round(g * (1 - n) + 26 * n) + ","
             + Math.round(b * (1 - n) + 44 * n) + "," + a + ")";
    const tab = [];
    for (let v = 0; v < NU_N; v++){
      const cv = document.createElement("canvas");
      cv.width = NU_W; cv.height = NU_H;
      const g = cv.getContext("2d");
      const rnd = i => { const s = Math.sin((i + v * 53.1) * 12.9898 + 78.233) * 43758.5453;
                         return s - Math.floor(s); };
      const base = NU_H * .80, NL = 9;
      const lobes = [];
      for (let i = 0; i < NL; i++){
        const u = i / (NL - 1);
        // cloche : les lobes du centre montent plus haut que ceux des extrémités
        const cloche = Math.pow(Math.sin(u * Math.PI), .62);
        const r = NU_H * (.13 + .27 * cloche) * (.78 + rnd(i) * .40);
        /* Les passes décalent les lobes de .76 r vers la gauche et .94 r vers le
           haut : sans cette marge, le nuage sortait du sprite et se retrouvait
           coupé net par le bord du canvas. */
        const marge = r * 1.05 + 6;
        const x = Math.max(marge, Math.min(NU_W - marge,
                  NU_W * (.10 + .80 * u) + (rnd(i + 20) - .5) * NU_W * .04));
        const y = Math.max(marge, base - r * (.90 + rnd(i + 40) * .16));
        lobes.push({ x: x, y: y, r: r });
      }
      // passe : dessine tous les lobes décalés d'un vecteur, dans une teinte
      const passe = (dx, dy, ech, col, bord) => {
        for (const L of lobes){
          const r = L.r * ech, x = L.x + dx * L.r, y = L.y + dy * L.r;
          const gr = g.createRadialGradient(x, y, r * .1, x, y, r);
          gr.addColorStop(0, col); gr.addColorStop(.66, col);
          gr.addColorStop(.87, bord); gr.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = gr;
          g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
        }
      };
      passe(0, 0, 1, c3(146, 158, 188, .92), c3(146, 158, 188, .30));
      passe(-.08, -.20, .88, c3(214, 222, 238, 1), c3(214, 222, 238, .26));
      passe(-.18, -.36, .58, c3(255, 254, 249, 1), c3(255, 254, 249, .28));
      tab.push(cv);
    }
    NUAGES_SP.cle = cle; NUAGES_SP.tab = tab;
    return tab;
  }

  function dessineArbre(prog, enPause, alerte, libre, secDep){
    initArbre();
    SAISON = aDebloque("saison") ? saisonDuJour() : SAISONS.ete;
    const p = Math.max(0, Math.min(1, prog));
    const lent = reduce ? .35 : 1;
    const t0 = performance.now() / 1000;
    const fe = (libre ? 1 : p) * (ETAGES.length - 1);
    altM = Math.min(altMax(), altitudeDe(fe));
    const etage = ETAGES[Math.min(ETAGES.length - 1, Math.floor(fe + .5))];
    ARBRE_COSMOS = libre;
    const nuit = Math.min(1, Math.max(0, (fe - 2.25) / 1.15));
    const jour = 1 - nuit;
    const E = ech() * dpr;

    // ---- le ciel ----
    const g = ctx.createLinearGradient(0, 0, 0, Hh);
    g.addColorStop(0,   "rgb(" + couleurCiel(fe, "h") + ")");
    g.addColorStop(.58, "rgb(" + couleurCiel(fe, "m") + ")");
    g.addColorStop(1,   "rgb(" + couleurCiel(fe, "b") + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);

    /* ---- la galaxie de fond ----
       Elle s'allume avec la nuit, dérive lentement et grossit à mesure qu'on
       s'éloigne : c'est elle qui donne l'échelle du voyage. */
    const galOp = Math.max(0, Math.min(1, (fe - 2.7) / 1.1));
    if (galOp > .01){
      const sp = spriteGalaxie();
      const dg = Math.max(W, Hh) * (1.35 + Math.min(1, Math.max(0, fe - 3)) * .40);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = galOp * .82;
      ctx.translate(W * .74, Hh * (.24 - (fe - 3) * .04));
      ctx.rotate(-.42 + t0 * .0035);
      ctx.drawImage(sp, -dg / 2, -dg / 2, dg, dg);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // étoiles, révélées par l'altitude
    if (nuit > .02){
      for (const e of etoiles){
        const a = nuit * (.35 + Math.sin(t0 * 1.4 + e.ph) * .3 + .35);
        ctx.fillStyle = "rgba(255,252,238," + Math.max(0, a) + ")";
        ctx.beginPath(); ctx.arc(e.x * W, e.y * Hh * .92, e.r * E, 0, 6.283); ctx.fill();
      }
    }

    // ---- le soleil et ses rayons crépusculaires ----
    const sx = W * .78, sy = Hh * (.14 + Math.min(fe, 3) * .09), sr = 46 * E;
    const cs = mix([255, 244, 190], [255, 118, 72], Math.min(1, fe / 3));
    if (jour > .01){
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      // atmosphère : la lueur diffuse qui déborde bien au-delà des rais
      const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 5);
      sg.addColorStop(0,   "rgba(255,252,232," + (.26 * jour) + ")");
      sg.addColorStop(.18, "rgba(" + cs + "," + (.13 * jour) + ")");
      sg.addColorStop(1,   "rgba(" + cs + ",0)");
      ctx.fillStyle = sg; ctx.fillRect(0, 0, W, Hh);
      if (jour > .06){
        const d = sr * 13;
        ctx.globalAlpha = jour * .55;
        ctx.translate(sx, sy);
        ctx.rotate(t0 * .012);                     // la couronne tourne, très lentement
        ctx.drawImage(spriteSoleil(), -d / 2, -d / 2, d, d);
        ctx.rotate(-t0 * .019);                    // seconde passe en sens inverse : scintillement
        ctx.globalAlpha = jour * .28;
        ctx.drawImage(spriteSoleil(), -d * .58 / 2, -d * .58 / 2, d * .58, d * .58);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      if (jour > .12){
        // le disque : cœur blanc, bord fondu — un cercle plein découpait le ciel
        const dg2 = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 1.12);
        dg2.addColorStop(0,   "rgba(255,255,254," + jour + ")");
        dg2.addColorStop(.52, "rgba(255,251,232," + jour + ")");
        dg2.addColorStop(.80, "rgba(" + cs + "," + jour + ")");
        dg2.addColorStop(.90, "rgba(" + cs + "," + (.62 * jour) + ")");
        dg2.addColorStop(1,   "rgba(" + cs + ",0)");
        ctx.fillStyle = dg2;
        ctx.beginPath(); ctx.arc(sx, sy, sr * 1.18, 0, 6.283); ctx.fill();
      }
    }

    /* ---- la Lune ----
       Elle entre par le haut, grossit, puis sort par le bas de l'écran : c'est
       la seule façon de faire sentir qu'on l'a vraiment dépassée. */
    const passe = Math.max(0, Math.min(1, (fe - 3.15) / 1.9));
    if (passe > 0 && passe < 1){
      const lr = Hh * (.08 + passe * .44);
      const lx = W * (.74 - passe * .26);
      const ly = -Hh * .5 + passe * Hh * 2.0;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const hg = ctx.createRadialGradient(lx, ly, lr * .92, lx, ly, lr * 2.4);
      hg.addColorStop(0, "rgba(206,220,242,.22)");
      hg.addColorStop(1, "rgba(206,220,242,0)");
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(lx, ly, lr * 2.4, 0, 6.283); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1 - passe * .18;          // elle s'éteint un peu en s'éloignant
      ctx.drawImage(spriteLune(), lx - lr, ly - lr, lr * 2, lr * 2);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    /* ---- Gargantua ----
       La lumière du disque contourne l'astre : on voit son arrière ramené
       au-dessus ET au-dessous de l'ombre, d'où l'anneau complet. Le disque plat
       repasse ensuite devant le bas de l'ombre. C'est cet ordre-là qui fait
       la silhouette, pas la couleur. */
    const tn = libre ? 0 : Math.max(0, Math.min(1, (fe - 4.35) / .65));
    if (tn > .005){
      const R = Math.min(W, Hh) * (.055 + tn * .115);
      const tour = t0 * .32;
      ctx.save();
      ctx.translate(W * .5, Hh * .30);
      ctx.globalAlpha = tn;
      ctx.globalCompositeOperation = "lighter";

      // halo général : la lueur qui déborde bien au-delà du disque
      const bl = ctx.createRadialGradient(0, 0, R * .9, 0, 0, R * 6);
      bl.addColorStop(0,   "rgba(255,182,96,.26)");
      bl.addColorStop(.30, "rgba(255,132,48,.09)");
      bl.addColorStop(1,   "rgba(170,54,10,0)");
      ctx.fillStyle = bl;
      ctx.beginPath(); ctx.arc(0, 0, R * 6, 0, 6.283); ctx.fill();

      // la nappe du disque : un fondu très aplati, sous les filaments
      function nappe(){
        ctx.save();
        ctx.scale(1, .125);
        const np = ctx.createRadialGradient(0, 0, R * 1.02, 0, 0, R * 4.4);
        np.addColorStop(0,   "rgba(255,240,206,.90)");
        np.addColorStop(.14, "rgba(255,196,116,.58)");
        np.addColorStop(.46, "rgba(255,134,46,.26)");
        np.addColorStop(1,   "rgba(146,40,6,0)");
        ctx.fillStyle = np;
        ctx.beginPath(); ctx.arc(0, 0, R * 4.4, 0, 6.283); ctx.fill();
        ctx.restore();
      }
      /* Filaments : le gaz s'enroule, d'autant plus vite qu'il est proche.
         `devant` ne garde que la portion d'angle qui passe sous le centre —
         découper au rectangle laissait une arête horizontale en travers. */
      function filaments(devant){
        for (let i = 0; i < 54; i++){
          const u = i / 53;
          const rr = R * (1.05 + u * 3.2);
          const sq = .105 + u * .05;
          const a0 = (tour * (1.9 - u * 1.35) + i * 2.399) % 6.283;
          const arc = 1.3 + u * 2.0;
          const chaud = 1 - u;
          // le gaz qui vient vers nous est bleui et plus vif : effet Doppler
          const dop = .34 + .66 * (.5 - .5 * Math.cos(a0 + arc * .5));
          const al = (.36 - u * .29) * dop;
          if (al <= 0) continue;
          ctx.strokeStyle = "rgba(255," + Math.round(148 + chaud * 106) + ","
                          + Math.round(50 + chaud * 152) + "," + al.toFixed(3) + ")";
          ctx.lineWidth = R * (.075 - u * .05);
          if (!devant){
            ctx.beginPath();
            ctx.ellipse(0, 0, rr, rr * sq, 0, a0, a0 + arc);
            ctx.stroke();
            continue;
          }
          for (const dec of [0, -6.2832, 6.2832]){   // l'arc peut enjamber le tour
            const d0 = Math.max(a0 + dec, .05), d1 = Math.min(a0 + arc + dec, 3.0916);
            if (d1 <= d0) continue;
            ctx.beginPath();
            ctx.ellipse(0, 0, rr, rr * sq, 0, d0, d1);
            ctx.stroke();
          }
        }
      }

      /* l'anneau d'Einstein : l'arrière du disque, replié tout autour de
         l'ombre. C'est lui qui distingue un trou noir d'un simple astre. */
      const ha = ctx.createRadialGradient(0, 0, R * 1.0, 0, 0, R * 2.05);
      ha.addColorStop(0,   "rgba(255,248,222,0)");
      ha.addColorStop(.09, "rgba(255,242,206,.92)");
      ha.addColorStop(.26, "rgba(255,196,118,.44)");
      ha.addColorStop(.62, "rgba(255,142,60,.15)");
      ha.addColorStop(1,   "rgba(255,120,40,0)");
      ctx.fillStyle = ha;
      ctx.beginPath(); ctx.arc(0, 0, R * 2.05, 0, 6.283); ctx.fill();

      nappe(); filaments(false);

      // dissymétrie Doppler : le côté qui approche écrase l'autre en éclat
      const dp = ctx.createLinearGradient(-R * 4.4, 0, R * 4.4, 0);
      dp.addColorStop(0,   "rgba(255,246,226,.34)");
      dp.addColorStop(.34, "rgba(255,216,166,.08)");
      dp.addColorStop(1,   "rgba(255,120,40,0)");
      ctx.save();
      ctx.scale(1, .16); ctx.fillStyle = dp;
      ctx.beginPath(); ctx.arc(0, 0, R * 4.4, 0, 6.283); ctx.fill();
      ctx.restore();

      // l'horizon : un noir franc, posé sur tout ce qui précède
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();

      // l'anneau de photons, fin et presque blanc, avec son propre halo
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(255,238,204,.20)";
      ctx.lineWidth = R * .11;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.035, 0, 6.283); ctx.stroke();
      const pr = ctx.createLinearGradient(-R, 0, R, 0);
      pr.addColorStop(0,  "rgba(255,253,244,1)");
      pr.addColorStop(.5, "rgba(255,240,210,.80)");
      pr.addColorStop(1,  "rgba(255,216,152,.52)");
      ctx.strokeStyle = pr; ctx.lineWidth = R * .026;
      ctx.beginPath(); ctx.arc(0, 0, R * 1.012, 0, 6.283); ctx.stroke();

      // le devant du disque repasse par-dessus le bas de l'ombre
      filaments(true);

      ctx.restore();
      ctx.globalAlpha = 1;
    }

    const dtA = tArbrePrec ? Math.min(.12, t0 - tArbrePrec) : 0;
    tArbrePrec = t0;
    rushArbre = 1 + tn * 7;
    phArbre += dtA * rushArbre;

    // ---- nuages : bouffées douces, en parallaxe, cantonnées à leur étage ----
    const bandeN = Math.max(0, Math.min(1, (fe - .35) / .85))
                 * Math.max(0, Math.min(1, (3.05 - fe) / .7));
    if (bandeN > .015){
      const tab = cuitNuages(Math.round(nuit * 10));
      let i = 0;
      for (const n of nuees){
        const par = .35 + n.c * .65;                 // les proches défilent plus vite
        const yv = (((n.y + p * 3.2 * par) % 1) + 1) % 1;
        const y = yv * (Hh + 420 * E) - 210 * E;
        const x = n.x * W + Math.sin(t0 * .06 + n.y * 9) * 30 * E;
        const L = n.l * W * (.48 + n.e * .40) * (.62 + par * .5);
        ctx.globalAlpha = Math.min(.72, bandeN * (.50 + n.c * .26) * (.55 + par * .45));
        const sp = tab[i++ % NU_N];
        ctx.drawImage(sp, x - L / 2, y - L * (NU_H / NU_W) / 2, L, L * (NU_H / NU_W));
        ctx.globalAlpha = 1;
      }
    }

    // ---- pollen : poussière qui monte dans la lumière ----
    if (jour > .08 && fe < 2.6){
      ctx.globalCompositeOperation = "lighter";
      for (const q of pollen){
        q.y -= q.v * lent * E * .35;
        q.x += Math.sin(q.y * .012 + q.ph) * .3 * E;
        if (q.y < -6 * E){ q.y = Hh + 6 * E; q.x = Math.random() * W; }
        const sc = .35 + Math.sin(t0 * 1.6 + q.ph) * .3 + .35;
        ctx.fillStyle = "rgba(255,244,208," + (jour * .3 * sc) + ")";
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r * E, 0, 6.283); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }

    /* ---- géométrie : la caméra reste sur la CIME ----
       Le sommet est fixe à l'écran, l'arbre s'allonge vers le bas et le sol
       s'éloigne. L'exposant retarde la pousse : la matinée se joue sur quelques
       centimètres de tige, l'après-midi sur des kilomètres de tronc. */
    const tx = W * (libre ? .5 : .17);
    const CIME = Hh * .34, SOL0 = Hh * .74;
    const SPAN = Hh * 5.6;
    const haut = Math.max(15 * E, Math.pow(p, 1.25) * SPAN);
    // l'horizon reste posé tant que la cime n'a pas atteint sa marque : sans ça,
    // la pousse du matin serait vue de trois mètres sous terre
    const solY = SOL0 + Math.max(0, haut - (SOL0 - CIME));
    const cimeY = solY - haut;
    const bas = Math.min(solY, Hh + 260 * E);

    if (libre) dessineSysteme(tx, cimeY, t0, E, false);   // moitié d'orbite au fond

    /* ---- le tronc, ses branches et son feuillage ----
       Les deux silhouettes se croisent sur sept minutes : basculer d'un coup de
       la pousse à l'arbre faisait apparaître une ramure entière en une frame. */
    const HT = bas - cimeY;
    const fondu = Math.max(0, Math.min(1, (HT - 62 * E) / (42 * E)));
    if (fondu < 1){
      ctx.globalAlpha = 1 - fondu;
      dessinePousse(ctx, E, tx, cimeY, bas, phArbre, nuit);
      ctx.globalAlpha = 1;
    }
    if (fondu > 0){
      ctx.globalAlpha = fondu;
      const ancres = dessineTronc(ctx, E, tx, cimeY, bas, phArbre, nuit);
      // la saison éclaircit la ramure : en hiver il ne reste presque rien
      const dens = SAISON.densite;
      if (aDebloque("algues")){
        let k = 0;
        for (const an of ancres){
          if (an.cote === 0) continue;
          if (dens < .99 && ((k++ * .618) % 1) > dens) continue;
          dessineFeuillage(ctx, E, an.x, an.y, an.taille / E * (.78 + dens * .3),
                           an.graine, phArbre, nuit);
        }
        // la couronne suit l'axe réel du fût, qui serpente et se balance
        dessineCouronne(ctx, E, ancres[0].x, ancres[0].y,
                        86 * (.66 + dens * .34) * Math.min(1, HT / (420 * E)),
                        phArbre, nuit);
      }
      ctx.globalAlpha = 1;
    }

    // ---- le sol et le nid, visibles au début de la journée ----
    if (solY < Hh + 80 * E){
      dessineSol(ctx, E, W, Hh, solY, t0, nuit);
      if (aDebloque("tresor")) dessineNid(ctx, E, W * .74, solY - 6 * E, t0, nuit);
    }

    if (libre) dessineSysteme(tx, cimeY, t0, E, true);    // et celle qui passe devant

    // ---- montgolfière ----
    if (aDebloque("boat") && fe > .8 && fe < 3.1){
      const bx = W * .84 + Math.sin(t0 * .35) * 26 * E;
      const by = Hh * .34 + Math.sin(t0 * .5) * 18 * E;
      ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.sin(t0 * .4) * .06);
      GRIMPEURS.ballon(ctx, E * .9, "rgba(255,220,150,.9)", t0);
      ctx.restore();
    }

    // ---- oiseaux ----
    if (aDebloque("bg") && nuit < .9){
      for (const o of oiseaux){
        o.x += o.v * o.dir * lent * E * .6;
        o.y += Math.sin(t0 * .8 + o.ph) * .4 * E;
        if (o.dir > 0 ? o.x > W + 40 * E : o.x < -40 * E){
          o.x = o.dir > 0 ? -40 * E : W + 40 * E;
          o.y = Math.random() * Hh * .7;
        }
        const bat = Math.sin(t0 * 7 + o.ph);
        const l = o.t * E;
        ctx.save();
        ctx.translate(o.x, o.y); ctx.scale(o.dir, 1);
        ctx.fillStyle = "rgba(32,38,50," + (.82 - nuit * .74) + ")";
        // aile fuselée, avec le coude qui remonte : un trait courbe ne fait qu'un accent
        for (const c of [-1, 1]){
          const h = -bat * l * .52 * (c < 0 ? 1 : .92);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(c * l * .42, h * .75, c * l * 1.02, h);
          ctx.quadraticCurveTo(c * l * .52, h * .30 + l * .10, 0, l * .13);
          ctx.closePath(); ctx.fill();
        }
        ctx.beginPath();                            // corps et tête
        ctx.ellipse(l * .06, l * .04, l * .22, l * .11, .2, 0, 6.283);
        ctx.fill();
        ctx.beginPath(); ctx.arc(l * .26, l * .01, l * .075, 0, 6.283); ctx.fill();
        ctx.restore();
      }
    }

    /* ---- ce qui tombe : feuilles ou neige selon la saison ----
       Au-dessus des nuages il ne tombe plus rien : il n'y a plus d'air. */
    const chute = Math.max(0, Math.min(1, (2.55 - fe) / .6));
    if (chute > .02){
      const S = SAISON;
      if (S.neige){
        for (const f of flocons){
          f.y += f.v * lent * rushArbre * E * .9;
          f.x += Math.sin(f.y * .014 + f.ph) * 1.1 * E;
          if (f.y > Hh + 8 * E){ f.y = -8 * E; f.x = Math.random() * W; }
          ctx.fillStyle = "rgba(244,250,255," + (chute * (f.br ? .92 : .55)) + ")";
          ctx.beginPath(); ctx.arc(f.x, f.y, f.r * E, 0, 6.283); ctx.fill();
        }
      } else {
        const k = nuit * .62;
        for (const f of feuilles){
          f.y += f.v * lent * rushArbre * E * .8;
          f.x += Math.sin(f.y * .02 + f.rot) * .8 * E;
          f.rot += f.vr;
          if (f.y > Hh + 20 * E){ f.y = -20 * E; f.x = Math.random() * W; }
          const v = S.rampe[3 + (((f.h * 7) | 0) % 3)];
          ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
          ctx.fillStyle = "rgba("
            + ((((v >> 16) & 255) * (1 - k) + 13 * k) | 0) + ","
            + ((((v >> 8) & 255) * (1 - k) + 29 * k) | 0) + ","
            + (((v & 255) * (1 - k) + 45 * k) | 0) + "," + (chute * .85) + ")";
          ctx.beginPath(); ctx.ellipse(0, 0, f.r * E, f.r * .45 * E, 0, 0, 6.283); ctx.fill();
          ctx.restore();
        }
      }
    }

    // ---- le grimpeur, accroché à la cime qu'on suit ----
    if (aDebloque("diver") && bas - cimeY > 150 * E){
      const monte = { prairie:"ecureuil", ciel:"oiseau", nuages:"ballon",
                      espace:"fusee", lune:"fusee", trou:"fusee" }[etage];
      ctx.save();
      ctx.translate(tx + 52 * E, cimeY + 42 * E + Math.sin(t0 * 1.3) * 8 * E);
      // les assets sont dessinés tournés vers la droite ; la fusée, elle, monte
      if (monte === "fusee") ctx.rotate(-1.5708);
      GRIMPEURS[monte](ctx, E, "rgba(" + accent().map(Math.round) + ",.95)", t0);
      ctx.restore();
    }

    // ---- aurore boréale, juste avant de quitter l'atmosphère ----
    const aur = Math.max(0, Math.min(1, (fe - 2.8) / .8))
              * Math.max(0, Math.min(1, (4.3 - fe) / .7));
    if (aur > .02){
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 3; i++){
        const ag = ctx.createLinearGradient(0, Hh * .1, 0, Hh * .62);
        const hue = 140 + i * 60 + Math.sin(t0 * .5 + i) * 30;
        ag.addColorStop(0, "hsla(" + hue + ",90%,62%,0)");
        ag.addColorStop(.45, "hsla(" + hue + ",90%,62%," + (.14 * aur) + ")");
        ag.addColorStop(1, "hsla(" + hue + ",90%,62%,0)");
        ctx.fillStyle = ag;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 26 * E)
          ctx.lineTo(x, Hh * .12 + Math.sin(x * .004 + t0 * .6 + i * 2) * 60 * E
                                 + Math.sin(x * .011 + t0 * .9) * 26 * E);
        for (let x = W; x >= 0; x -= 26 * E)
          ctx.lineTo(x, Hh * .58 + Math.sin(x * .004 + t0 * .6 + i * 2) * 60 * E);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }

    // ---- la floraison ----
    if (libre){
      if (petales.length < 160 && Math.random() < .6)
        petales.push({ x: Math.random() * W, y: -20 * E,
                       r: (Math.random() * 6 + 5), rot: Math.random() * 6.3,
                       vr: (Math.random() - .5) * .12, v: Math.random() * 1.6 + .8,
                       ph: Math.random() * 6.3, h: 330 + Math.random() * 40 });
      for (let i = petales.length - 1; i >= 0; i--){
        const q = petales[i];
        q.y += q.v * lent * E; q.x += Math.sin(q.y * .015 + q.ph) * 1.6 * E;
        q.rot += q.vr;
        if (q.y > Hh + 30 * E){ petales.splice(i, 1); continue; }
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.fillStyle = "rgba(236,232,255,.92)";
        ctx.beginPath(); ctx.ellipse(0, 0, q.r * .5 * E, q.r * .16 * E, 0, 0, 6.283); ctx.fill();
        ctx.restore();
      }
      ctx.globalCompositeOperation = "lighter";
      const fg = ctx.createRadialGradient(tx, Hh * .34, 0, tx, Hh * .34, Hh);
      fg.addColorStop(0, "rgba(158,120,255,.26)");
      fg.addColorStop(1, "rgba(158,120,255,0)");
      ctx.fillStyle = fg; ctx.fillRect(0, 0, W, Hh);
      ctx.globalCompositeOperation = "source-over";
    } else if (petales.length) petales.length = 0;

    // voile central, pour que le compteur reste lisible sur un ciel clair
    const vg = ctx.createRadialGradient(W * .5, Hh * .42, 0, W * .5, Hh * .42,
                                        Math.max(W, Hh) * .55);
    vg.addColorStop(0, "rgba(6,14,26," + (.15 - nuit * .09) + ")");
    vg.addColorStop(1, "rgba(6,14,26,0)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, Hh);

    // vignettage doux, comme dans les abysses : referme la composition
    const vig = ctx.createRadialGradient(W * .5, Hh * .5, Math.min(W, Hh) * .34,
                                         W * .5, Hh * .5, Math.max(W, Hh) * .8);
    vig.addColorStop(0, "rgba(0,6,12,0)");
    vig.addColorStop(1, "rgba(0,6,12," + (.20 + nuit * .28) + ")");
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, Hh);
  }
  /* ===================================================== */

  /* ================= MONDE 4 : le Village =================
     La caméra ne bouge pas : c'est la scène qui se refait. Chaque parcelle
     bascule d'une époque à la suivante à son propre moment, décalé des autres,
     si bien que le village se reconstruit bâtiment par bâtiment plutôt que de
     changer d'un bloc. */
  const EPOQUES = [                       // palier acheté → époque atteinte le soir
    { id:"arc", e:7 }, { id:"violet", e:6 }, { id:"rouge", e:5 },
    { id:"orange", e:4 }, { id:"jaune", e:3 }
  ];
  const epoqueMax = () => (EPOQUES.find(z => aDebloque(z.id)) || { e:2 }).e;
  const NOMS_EP = ["les nomades", "la tribu", "l'antiquité", "le moyen âge",
                   "l'ère industrielle", "l'ère moderne", "la cité de néon",
                   "la cité-jardin"];
  const ANNEES = [-30000, -8000, -500, 1150, 1870, 1995, 2210, 2604];
  const POPS   = [9, 42, 850, 5200, 78000, 2400000, 11000000, 24000000];
  /* Nuit par époque plutôt qu'une rampe : la cité de néon se vit de nuit, mais
     la cité-jardin qui la suit retrouve le plein jour. Une rampe monotone ne
     pouvait pas redescendre. */
  const NUIT_EP = [.24, 0, 0, 0, .06, 0, .95, .05];
  /* Les modules de paysage ont été écrits pour six époques : on leur donne leur
     propre échelle plutôt que de tous les réécrire. */
  const PAY_MAP = [0, 0, 1, 2, 3, 4, 5, 5];
  const interpV = (tab, ee) => {
    const i = Math.min(tab.length - 2, Math.max(0, Math.floor(ee)));
    return tab[i] + (tab[i + 1] - tab[i]) * Math.max(0, Math.min(1, ee - i));
  };
  // ciel en trois arrêts : l'industrie encrasse tout, le futur rallume en néon
  const CIEL_V = [
    { h:[38, 54, 104],  m:[128, 112, 128], b:[214, 156, 112] },   // nomades, avant l'aube
    { h:[74, 116, 172], m:[176, 168, 148], b:[228, 196, 142] },   // tribu
    { h:[46, 122, 196], m:[126, 186, 226], b:[226, 226, 200] },   // antiquité
    { h:[62, 96, 140],  m:[132, 152, 176], b:[196, 198, 190] },   // moyen âge
    { h:[122, 108, 90], m:[186, 160, 124], b:[228, 202, 158] },   // industrie
    { h:[38, 92, 158],  m:[118, 160, 202], b:[206, 212, 216] },   // moderne
    { h:[12, 10, 38],   m:[58, 30, 104],   b:[186, 92, 152] },    // cité de néon
    { h:[26, 106, 198], m:[126, 198, 240], b:[214, 242, 232] }    // cité-jardin, air lavé
  ];
  function couleurVil(ee, cle){
    const i = Math.min(CIEL_V.length - 2, Math.max(0, Math.floor(ee)));
    return mix(CIEL_V[i][cle], CIEL_V[i + 1][cle], Math.max(0, Math.min(1, ee - i)));
  }

  const PARCELLES = [], fumees = [], lucioles = [];
  let vilPret = false, anneeV = ANNEES[0], popV = POPS[0], epNom = NOMS_EP[0];
  let dernierVillage = 0;                 // cadence de rendu du Village
  let tLibre = 0;                         // instant de la libération, pour le dézoom
  function initVillage(){
    if (vilPret) return;
    vilPret = true;
    // deux rangées : le fond, plus petit et plus haut, donne la profondeur
    const pose = (n, dy, ech, fond) => {
      for (let i = 0; i < n; i++){
        const k = PARCELLES.length;
        PARCELLES.push({ u: (i + .5) / n + Math.sin(i * 12.9 + n) * .035,
                         dy: dy, ech: ech, fond: fond,
                         dec: ((k * .618) % 1) * .9 + .05,
                         gr: Math.abs(Math.sin(k * 7.13) * 43758.5) % 1 });
      }
    };
    pose(4, .000, .62, true);
    pose(5, .055, 1.00, false);
    // rang de chantier : le bâtisseur remonte le village de gauche à droite
    PARCELLES.map((q, i) => i).sort((a2, b2) => PARCELLES[a2].u - PARCELLES[b2].u)
             .forEach((idx, rang) => { PARCELLES[idx].rang = rang; });
    for (let i = 0; i < 40; i++)
      fumees.push({ p: Math.random(), v: Math.random() * .35 + .25,
                    x: Math.random(), r: Math.random() * .5 + .5 });
    for (let i = 0; i < 46; i++)
      lucioles.push({ x: Math.random(), y: Math.random(), ph: Math.random() * 6.3,
                      v: Math.random() * .3 + .12 });
  }

  function bat0(c, L, H, om, al, nuit, t) {
    c.save();

    var halfW = L * 0.5;
    var apex = -H;
    var baseY = 0;

    // Ombre portee au sol, allongee vers la gauche car la lumiere vient du haut-droite.
    c.save();
    c.beginPath();
    c.ellipse(-L * 0.12, -H * 0.012, halfW * 1.18, H * 0.055, 0, 0, Math.PI * 2);
    c.fillStyle = om(28, 22, 16, 0.3);
    c.fill();
    c.restore();

    // Sol pietine autour de l'entree
    c.save();
    c.beginPath();
    c.ellipse(L * 0.02, -H * 0.01, halfW * 0.95, H * 0.042, 0, 0, Math.PI * 2);
    c.fillStyle = om(112, 96, 74, 0.35);
    c.fill();
    c.restore();

    for (var s = 0; s < 22; s++) {
      var sx = (al(s * 3 + 1) - 0.5) * L * 1.05;
      var sy = -al(s * 3 + 2) * H * 0.05;
      var sr = 1 + al(s * 3 + 3) * 2.2;
      c.beginPath();
      c.ellipse(sx, sy, sr, sr * 0.45, 0, 0, Math.PI * 2);
      c.fillStyle = om(92, 78, 58, 0.4);
      c.fill();
    }

    // Ossature : perches plantees en cercle, croisees au sommet
    var poles = 9;
    var poleTop = [];
    for (var p = 0; p < poles; p++) {
      var f = p / (poles - 1);
      var bx = -halfW + f * L;
      var lean = (al(p * 5 + 7) - 0.5) * L * 0.05;
      var topX = lean * 0.9 + (bx > 0 ? L * 0.035 : -L * 0.035);
      var topY = apex - H * (0.02 + al(p * 5 + 8) * 0.075);
      poleTop.push([topX, topY, bx]);
    }

    c.save();
    c.lineCap = "round";
    for (var pa = 0; pa < poles; pa++) {
      var tp = poleTop[pa];
      c.beginPath();
      c.moveTo(tp[2], baseY);
      c.quadraticCurveTo(
        tp[2] * 0.55 + tp[0] * 0.45,
        apex * 0.52,
        tp[0],
        tp[1]
      );
      c.lineWidth = Math.max(1.4, L * 0.016);
      c.strokeStyle = om(70, 54, 38);
      c.stroke();
    }
    c.restore();

    var skinTop = -H * 0.9;

    // Peau : silhouette conique, flancs bombes par le poids des peaux
    function skinPath(inset) {
      c.beginPath();
      c.moveTo(-halfW + inset, baseY);
      c.bezierCurveTo(
        -halfW * 0.92 + inset,
        -H * 0.36,
        -L * 0.2,
        skinTop + H * 0.06,
        -L * 0.055,
        skinTop + inset * 0.5
      );
      c.lineTo(L * 0.055, skinTop + inset * 0.5);
      c.bezierCurveTo(
        L * 0.2,
        skinTop + H * 0.06,
        halfW * 0.92 - inset,
        -H * 0.36,
        halfW - inset,
        baseY
      );
      c.closePath();
    }

    // Demi-teinte de base
    skinPath(0);
    c.fillStyle = om(146, 118, 88);
    c.fill();

    // Plan d'ombre : moitie gauche
    c.save();
    skinPath(0);
    c.clip();
    c.beginPath();
    c.moveTo(-halfW * 1.1, baseY);
    c.bezierCurveTo(-L * 0.34, -H * 0.3, -L * 0.16, -H * 0.66, -L * 0.02, skinTop);
    c.lineTo(-halfW * 1.1, skinTop);
    c.closePath();
    c.fillStyle = om(84, 65, 48, 0.85);
    c.fill();

    // Plan de lumiere : bande droite, plus etroite que l'ombre
    c.beginPath();
    c.moveTo(halfW * 1.1, baseY);
    c.bezierCurveTo(L * 0.3, -H * 0.32, L * 0.16, -H * 0.66, L * 0.03, skinTop);
    c.lineTo(halfW * 1.1, skinTop);
    c.closePath();
    c.fillStyle = om(206, 176, 134, 0.6);
    c.fill();

    // Occlusion au ras du sol : la peau y est humide et sale
    var grd = c.createLinearGradient(0, baseY, 0, -H * 0.3);
    grd.addColorStop(0, om(58, 44, 32, 0.7));
    grd.addColorStop(1, om(58, 44, 32, 0));
    c.fillStyle = grd;
    c.fillRect(-halfW * 1.1, -H * 0.3, L * 1.2, H * 0.3);

    // Lés de peaux : coutures verticales suivant la pente des perches
    for (var q = 1; q < poles - 1; q++) {
      var qt = poleTop[q];
      c.beginPath();
      c.moveTo(qt[2] * 0.99, baseY);
      c.quadraticCurveTo(
        qt[2] * 0.55 + qt[0] * 0.45,
        apex * 0.5,
        qt[0] * 0.6,
        skinTop + H * 0.02
      );
      c.lineWidth = Math.max(0.8, L * 0.008);
      c.strokeStyle = om(74, 58, 42, 0.55);
      c.stroke();
      c.beginPath();
      c.moveTo(qt[2] * 0.99 + L * 0.008, baseY);
      c.quadraticCurveTo(
        qt[2] * 0.55 + qt[0] * 0.45 + L * 0.008,
        apex * 0.5,
        qt[0] * 0.6 + L * 0.006,
        skinTop + H * 0.02
      );
      c.lineWidth = Math.max(0.5, L * 0.005);
      c.strokeStyle = om(214, 188, 148, 0.35);
      c.stroke();
    }

    // Sangles horizontales, affaissees entre les perches
    for (var r = 1; r <= 3; r++) {
      var ry = -H * (0.16 + r * 0.2);
      var spanF = 1 - r * 0.235;
      c.beginPath();
      for (var seg = 0; seg <= poles - 1; seg++) {
        var segX = (-halfW + (seg / (poles - 1)) * L) * spanF;
        var sag = seg === 0 || seg === poles - 1 ? 0 : H * 0.016;
        if (seg === 0) c.moveTo(segX, ry);
        else {
          var prevX = (-halfW + ((seg - 1) / (poles - 1)) * L) * spanF;
          c.quadraticCurveTo((prevX + segX) * 0.5, ry + sag, segX, ry);
        }
      }
      c.lineWidth = Math.max(0.9, L * 0.009);
      c.strokeStyle = om(96, 76, 54, 0.6);
      c.stroke();
    }

    // Points d'attache : noeuds de tendon aux croisements
    for (var k = 0; k < 14; k++) {
      var kx = (al(k * 7 + 11) - 0.5) * L * 0.72;
      var ky = -H * (0.16 + al(k * 7 + 12) * 0.62);
      var lit = kx > 0;
      c.beginPath();
      c.ellipse(kx, ky, L * 0.011, L * 0.008, 0, 0, Math.PI * 2);
      c.fillStyle = lit ? om(196, 170, 132) : om(72, 56, 40);
      c.fill();
    }

    // Taches de poil et usure sur les peaux
    for (var m = 0; m < 16; m++) {
      var mx = (al(m * 11 + 21) - 0.5) * L * 0.78;
      var my = -H * (0.1 + al(m * 11 + 22) * 0.7);
      var mw = L * (0.02 + al(m * 11 + 23) * 0.05);
      c.beginPath();
      c.ellipse(mx, my, mw, mw * 0.5, al(m * 11 + 24) * 3, 0, Math.PI * 2);
      c.fillStyle = mx > 0 ? om(178, 150, 112, 0.3) : om(104, 82, 60, 0.35);
      c.fill();
    }
    c.restore();

    // Entree : trou sombre, decale a gauche pour rester dans l'ombre
    var doorX = -L * 0.1;
    var doorW = L * 0.15;
    var doorH = H * 0.38;
    c.save();
    c.beginPath();
    c.moveTo(doorX - doorW, baseY);
    c.bezierCurveTo(
      doorX - doorW,
      -doorH * 0.7,
      doorX - doorW * 0.5,
      -doorH,
      doorX,
      -doorH
    );
    c.bezierCurveTo(
      doorX + doorW * 0.5,
      -doorH,
      doorX + doorW,
      -doorH * 0.7,
      doorX + doorW,
      baseY
    );
    c.closePath();
    c.fillStyle = om(24, 18, 14);
    c.fill();

    // Lueur du foyer interieur vue par l'ouverture
    if (nuit > 0.05) {
      c.globalCompositeOperation = "lighter";
      var inner = c.createRadialGradient(
        doorX,
        -doorH * 0.35,
        0,
        doorX,
        -doorH * 0.35,
        doorW * 1.5
      );
      inner.addColorStop(0, "rgba(255,150,60," + (0.5 * nuit).toFixed(3) + ")");
      inner.addColorStop(1, "rgba(255,120,40,0)");
      c.fillStyle = inner;
      c.fill();
    }
    c.restore();

    // Rabat de peau releve et cale sur le cote
    c.save();
    c.beginPath();
    c.moveTo(doorX + doorW * 0.92, baseY);
    c.bezierCurveTo(
      doorX + doorW * 1.05,
      -doorH * 0.72,
      doorX + doorW * 0.7,
      -doorH * 1.02,
      doorX + doorW * 0.05,
      -doorH * 0.98
    );
    c.bezierCurveTo(
      doorX + doorW * 0.55,
      -doorH * 0.76,
      doorX + doorW * 0.78,
      -doorH * 0.4,
      doorX + doorW * 0.78,
      baseY
    );
    c.closePath();
    c.fillStyle = om(170, 140, 104);
    c.fill();
    c.lineWidth = Math.max(0.7, L * 0.006);
    c.strokeStyle = om(84, 66, 48, 0.7);
    c.stroke();
    c.restore();

    // Lourde peau plus claire calee sur le flanc eclaire
    c.save();
    c.beginPath();
    c.moveTo(L * 0.2, baseY);
    c.bezierCurveTo(L * 0.34, -H * 0.1, L * 0.36, -H * 0.24, L * 0.28, -H * 0.3);
    c.bezierCurveTo(L * 0.24, -H * 0.2, L * 0.22, -H * 0.1, L * 0.14, baseY);
    c.closePath();
    c.fillStyle = om(198, 172, 132, 0.7);
    c.fill();
    c.restore();

    // Sommet : les perches depassent et fument par le trou d'evacuation
    c.save();
    c.lineCap = "round";
    for (var v = 0; v < poles; v++) {
      var vt = poleTop[v];
      c.beginPath();
      c.moveTo(vt[0] * 0.55, skinTop + H * 0.02);
      c.lineTo(vt[0], vt[1]);
      c.lineWidth = Math.max(1.2, L * 0.014);
      c.strokeStyle = vt[0] > 0 ? om(122, 98, 70) : om(62, 48, 34);
      c.stroke();
    }
    c.restore();

    // Fumee lente sortant du sommet
    c.save();
    c.globalAlpha = 0.22 + nuit * 0.1;
    for (var f2 = 0; f2 < 5; f2++) {
      var ph = t * 0.14 + al(f2 * 13 + 31);
      var rise = ph % 1;
      var sy2 = skinTop - rise * H * 0.28;
      var sx2 = Math.sin(rise * 3.2 + f2) * L * 0.09 + L * 0.02;
      var rad = L * (0.03 + rise * 0.1);
      c.beginPath();
      c.ellipse(sx2, sy2, rad, rad * 0.8, 0, 0, Math.PI * 2);
      c.fillStyle = om(190, 186, 178, (1 - rise) * 0.5);
      c.fill();
    }
    c.restore();

    // Sechoir : perche inclinee avec lanieres de viande et un os
    c.save();
    var rackX = halfW * 0.86;
    c.beginPath();
    c.moveTo(rackX, baseY);
    c.lineTo(rackX + L * 0.05, -H * 0.34);
    c.lineWidth = Math.max(1.2, L * 0.012);
    c.lineCap = "round";
    c.strokeStyle = om(96, 76, 54);
    c.stroke();
    c.beginPath();
    c.moveTo(rackX + L * 0.045, -H * 0.3);
    c.quadraticCurveTo(rackX - L * 0.06, -H * 0.26, rackX - L * 0.16, -H * 0.28);
    c.lineWidth = Math.max(0.7, L * 0.006);
    c.strokeStyle = om(120, 98, 72);
    c.stroke();
    for (var st = 0; st < 4; st++) {
      var stx = rackX + L * 0.03 - st * L * 0.05;
      var sth = H * (0.05 + al(st * 17 + 41) * 0.04);
      c.beginPath();
      c.moveTo(stx, -H * 0.275);
      c.lineTo(stx + L * 0.012, -H * 0.275 + sth);
      c.lineTo(stx - L * 0.012, -H * 0.275 + sth * 0.9);
      c.closePath();
      c.fillStyle = om(148, 72, 58);
      c.fill();
    }
    c.restore();

    // Os pose au sol, cote ombre
    c.save();
    c.beginPath();
    c.moveTo(-halfW * 0.86, -H * 0.012);
    c.lineTo(-halfW * 0.62, -H * 0.03);
    c.lineWidth = Math.max(1.4, L * 0.014);
    c.lineCap = "round";
    c.strokeStyle = om(206, 198, 176);
    c.stroke();
    c.beginPath();
    c.ellipse(-halfW * 0.87, -H * 0.014, L * 0.014, L * 0.011, 0, 0, Math.PI * 2);
    c.fillStyle = om(214, 206, 184);
    c.fill();
    c.beginPath();
    c.ellipse(-halfW * 0.61, -H * 0.032, L * 0.013, L * 0.01, 0, 0, Math.PI * 2);
    c.fillStyle = om(196, 188, 166);
    c.fill();
    c.restore();

    // Pierres calant le bas des peaux
    for (var g = 0; g < 8; g++) {
      var gf = g / 7;
      var gx = -halfW * 0.98 + gf * L * 0.96;
      if (Math.abs(gx - doorX) < doorW * 1.2) continue;
      var gr = L * (0.018 + al(g * 19 + 51) * 0.016);
      c.beginPath();
      c.ellipse(gx, -H * 0.008, gr, gr * 0.68, 0, 0, Math.PI * 2);
      c.fillStyle = om(118, 112, 104);
      c.fill();
      c.beginPath();
      c.ellipse(gx + gr * 0.25, -H * 0.014, gr * 0.55, gr * 0.34, 0, 0, Math.PI * 2);
      c.fillStyle = om(168, 162, 152);
      c.fill();
    }

    c.restore();
  }

  function mon0(c, L, H, om, al, nuit, t) {
    c.save();

    var hearthR = L * 0.46;
    var hearthY = -H * 0.02;
    var glow = 0.35 + nuit * 0.65;

    // Halo au sol : cercle de lumiere projete par le foyer
    c.save();
    c.globalCompositeOperation = "lighter";
    var ground = c.createRadialGradient(0, hearthY, hearthR * 0.3, 0, hearthY, hearthR * 3.2);
    ground.addColorStop(0, "rgba(255,150,60," + (0.3 * glow).toFixed(3) + ")");
    ground.addColorStop(0.5, "rgba(255,110,35," + (0.12 * glow).toFixed(3) + ")");
    ground.addColorStop(1, "rgba(255,90,20,0)");
    c.beginPath();
    c.ellipse(0, hearthY, hearthR * 3.2, hearthR * 1.1, 0, 0, Math.PI * 2);
    c.fillStyle = ground;
    c.fill();
    c.restore();

    // Cendrier : terre brulee sous les pierres
    c.save();
    c.beginPath();
    c.ellipse(0, hearthY, hearthR * 1.25, hearthR * 0.44, 0, 0, Math.PI * 2);
    c.fillStyle = om(58, 48, 40, 0.75);
    c.fill();
    c.beginPath();
    c.ellipse(0, hearthY, hearthR * 0.92, hearthR * 0.3, 0, 0, Math.PI * 2);
    c.fillStyle = om(96, 90, 84, 0.8);
    c.fill();
    c.restore();

    // Pierres de foyer, moitie arriere : dessinees avant les buches
    var stones = 13;
    function drawStone(i, back) {
      var a = (i / stones) * Math.PI * 2 + 0.3;
      var isBack = Math.sin(a) < 0;
      if (isBack !== back) return;
      var sx = Math.cos(a) * hearthR * 1.1;
      var sy = hearthY + Math.sin(a) * hearthR * 0.4;
      var sw = hearthR * (0.17 + al(i * 23 + 61) * 0.1);
      var sh = sw * (0.72 + al(i * 23 + 62) * 0.4);
      var rot = (al(i * 23 + 63) - 0.5) * 1.1;

      c.save();
      c.translate(sx, sy);
      c.rotate(rot);
      // Corps en demi-teinte
      c.beginPath();
      c.ellipse(0, -sh * 0.45, sw, sh, 0, 0, Math.PI * 2);
      c.fillStyle = om(104, 100, 96);
      c.fill();
      // Facette gauche a l'ombre
      c.beginPath();
      c.ellipse(-sw * 0.34, -sh * 0.4, sw * 0.6, sh * 0.82, 0, 0, Math.PI * 2);
      c.fillStyle = om(66, 62, 60, 0.8);
      c.fill();
      // Facette droite eclairee
      c.beginPath();
      c.ellipse(sw * 0.32, -sh * 0.62, sw * 0.52, sh * 0.6, 0, 0, Math.PI * 2);
      c.fillStyle = om(158, 152, 145, 0.85);
      c.fill();
      c.beginPath();
      c.ellipse(sw * 0.42, -sh * 0.78, sw * 0.26, sh * 0.28, 0, 0, Math.PI * 2);
      c.fillStyle = om(190, 184, 176, 0.7);
      c.fill();
      c.restore();

      // Face interne des pierres, chauffee par le feu
      if (!back) {
        c.save();
        c.globalCompositeOperation = "lighter";
        c.beginPath();
        c.ellipse(sx, sy - sh * 0.7, sw * 0.7, sh * 0.5, 0, 0, Math.PI * 2);
        c.fillStyle = "rgba(255,120,40," + (0.22 * glow).toFixed(3) + ")";
        c.fill();
        c.restore();
      }
    }
    for (var sb = 0; sb < stones; sb++) drawStone(sb, true);

    // Braises au centre du foyer
    c.save();
    c.beginPath();
    c.ellipse(0, hearthY - H * 0.01, hearthR * 0.75, hearthR * 0.25, 0, 0, Math.PI * 2);
    c.fillStyle = om(40, 32, 28);
    c.fill();
    c.globalCompositeOperation = "lighter";
    for (var e = 0; e < 18; e++) {
      var ea = al(e * 29 + 71) * Math.PI * 2;
      var er = al(e * 29 + 72);
      var ex = Math.cos(ea) * hearthR * 0.68 * er;
      var ey = hearthY - H * 0.01 + Math.sin(ea) * hearthR * 0.2 * er;
      var pulse = 0.5 + 0.5 * Math.sin(t * 1.3 + e * 1.7);
      var esz = hearthR * (0.04 + al(e * 29 + 73) * 0.05);
      c.beginPath();
      c.ellipse(ex, ey, esz, esz * 0.6, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(255," + Math.round(90 + pulse * 90) + ",30," + (0.35 + pulse * 0.45).toFixed(3) + ")";
      c.fill();
    }
    c.restore();

    // Buches croisees en tipi, sur trois plans de profondeur
    var logs = [
      [-0.72, 0.06, -0.1, -0.86, 0.055, 0],
      [0.7, 0.04, 0.09, -0.9, 0.05, 0],
      [-0.5, 0.02, -0.16, -0.98, 0.045, 1],
      [0.48, 0.03, 0.14, -1.0, 0.048, 1],
      [-0.86, 0.05, 0.2, -0.62, 0.042, 2],
      [0.88, 0.05, -0.18, -0.6, 0.04, 2]
    ];
    for (var lg = 0; lg < logs.length; lg++) {
      var d = logs[lg];
      var x0 = d[0] * hearthR;
      var y0 = hearthY + d[1] * H;
      var x1 = d[2] * L;
      var y1 = d[3] * H * 0.42;
      var w = d[4] * L;
      var lit = x0 > 0;

      c.save();
      c.lineCap = "round";
      c.beginPath();
      c.moveTo(x0, y0);
      c.lineTo(x1, y1);
      c.lineWidth = w;
      c.strokeStyle = om(72, 54, 38);
      c.stroke();
      // Arete superieure : liseré de bois clair cote lumiere
      c.beginPath();
      c.moveTo(x0 + w * 0.22, y0 - w * 0.16);
      c.lineTo(x1 + w * 0.22, y1 - w * 0.16);
      c.lineWidth = w * 0.42;
      c.strokeStyle = lit ? om(146, 112, 76, 0.9) : om(96, 74, 52, 0.7);
      c.stroke();
      // Ecorce fendue
      c.beginPath();
      c.moveTo(x0 - w * 0.1, y0 - w * 0.05);
      c.lineTo(x1 - w * 0.1, y1 - w * 0.05);
      c.lineWidth = Math.max(0.6, w * 0.12);
      c.strokeStyle = om(48, 36, 26, 0.8);
      c.stroke();
      c.restore();

      // Base des buches carbonisee puis incandescente
      c.save();
      var burn = c.createLinearGradient(x0, y0, (x0 + x1) * 0.5, (y0 + y1) * 0.5);
      burn.addColorStop(0, om(30, 24, 22, 0.9));
      burn.addColorStop(1, om(30, 24, 22, 0));
      c.lineCap = "round";
      c.beginPath();
      c.moveTo(x0, y0);
      c.lineTo(x1, y1);
      c.lineWidth = w * 0.95;
      c.strokeStyle = burn;
      c.stroke();
      c.restore();
    }

    // Pierres avant : elles masquent le pied des buches
    for (var sf = 0; sf < stones; sf++) drawStone(sf, false);

    // Flammes : trois nappes decalees, du coeur pale vers les langues sombres
    c.save();
    c.globalCompositeOperation = "lighter";
    var flameH = H * 0.86;
    var sheets = [
      [1.0, 0.55, 210, 90, 0.5],
      [0.74, 0.42, 245, 150, 0.62],
      [0.46, 0.3, 255, 225, 0.72]
    ];
    for (var fs = 0; fs < sheets.length; fs++) {
      var sh2 = sheets[fs];
      var tongues = 7;
      c.beginPath();
      c.moveTo(-hearthR * sh2[1], hearthY);
      for (var tg = 0; tg <= tongues; tg++) {
        var u = tg / tongues;
        var baseX = (-1 + u * 2) * hearthR * sh2[1];
        var speed = 0.9 + al(tg * 31 + fs * 7 + 81) * 0.7;
        var wob = Math.sin(t * speed + tg * 2.1 + fs * 1.3);
        var wob2 = Math.sin(t * speed * 0.53 + tg * 3.7);
        var peakH = flameH * sh2[0] * (0.42 + 0.58 * (1 - Math.abs(baseX) / (hearthR * sh2[1] + 0.0001)));
        peakH *= 0.82 + wob2 * 0.18;
        var peakX = baseX * 0.55 + wob * L * 0.05 * sh2[0];
        var peakY = hearthY - peakH;
        c.quadraticCurveTo(
          baseX - hearthR * 0.12 + wob * L * 0.02,
          hearthY - peakH * 0.5,
          peakX,
          peakY
        );
        c.quadraticCurveTo(
          baseX + hearthR * 0.14 + wob * L * 0.02,
          hearthY - peakH * 0.42,
          baseX + hearthR * 0.05,
          hearthY
        );
      }
      c.closePath();
      var fg = c.createLinearGradient(0, hearthY, 0, hearthY - flameH * sh2[0]);
      fg.addColorStop(0, "rgba(255," + sh2[3] + ",40," + (sh2[4] * (0.6 + glow * 0.4)).toFixed(3) + ")");
      fg.addColorStop(0.45, "rgba(255," + sh2[2] + ",60," + (sh2[4] * 0.7 * (0.6 + glow * 0.4)).toFixed(3) + ")");
      fg.addColorStop(1, "rgba(255,80,20,0)");
      c.fillStyle = fg;
      c.fill();
    }
    c.restore();

    // Etincelles montantes
    c.save();
    c.globalCompositeOperation = "lighter";
    for (var sp = 0; sp < 16; sp++) {
      var life = (t * (0.22 + al(sp * 37 + 91) * 0.2) + al(sp * 37 + 92)) % 1;
      var spx = (al(sp * 37 + 93) - 0.5) * hearthR * 1.1 + Math.sin(t * 0.8 + sp) * L * 0.06 * life;
      var spy = hearthY - life * H * 1.05;
      var szz = L * 0.008 * (1 - life * 0.5);
      c.beginPath();
      c.ellipse(spx, spy, szz, szz * 1.6, 0, 0, Math.PI * 2);
      c.fillStyle = "rgba(255," + Math.round(170 + al(sp * 37 + 94) * 60) + ",90," + ((1 - life) * 0.8 * (0.4 + glow * 0.6)).toFixed(3) + ")";
      c.fill();
    }
    c.restore();

    // Fumee au-dessus des flammes, chargee de suie
    c.save();
    for (var sm = 0; sm < 6; sm++) {
      var srise = (t * 0.1 + al(sm * 41 + 101)) % 1;
      var smy = hearthY - flameH * 0.75 - srise * H * 0.32;
      var smx = Math.sin(srise * 2.6 + sm * 1.4) * L * 0.14 + L * 0.03;
      var smr = L * (0.06 + srise * 0.16);
      c.beginPath();
      c.ellipse(smx, smy, smr, smr * 0.78, 0, 0, Math.PI * 2);
      c.fillStyle = om(120, 112, 104, (1 - srise) * 0.24);
      c.fill();
    }
    c.restore();

    // Halo additif enveloppant, il grandit avec la nuit
    c.save();
    c.globalCompositeOperation = "lighter";
    var hr = L * (0.55 + nuit * 0.6);
    var hg = c.createRadialGradient(0, hearthY - H * 0.3, 0, 0, hearthY - H * 0.3, hr);
    hg.addColorStop(0, "rgba(255,170,80," + (0.26 * glow).toFixed(3) + ")");
    hg.addColorStop(0.45, "rgba(255,120,40," + (0.12 * glow).toFixed(3) + ")");
    hg.addColorStop(1, "rgba(255,90,20,0)");
    c.beginPath();
    c.arc(0, hearthY - H * 0.3, hr, 0, Math.PI * 2);
    c.fillStyle = hg;
    c.fill();
    c.restore();

    // Perche a viande plantee de biais, hors du halo direct
    c.save();
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(-L * 0.52, hearthY);
    c.lineTo(-L * 0.3, -H * 0.66);
    c.lineWidth = Math.max(1.3, L * 0.014);
    c.strokeStyle = om(88, 68, 48);
    c.stroke();
    c.beginPath();
    c.moveTo(L * 0.53, hearthY);
    c.lineTo(L * 0.31, -H * 0.66);
    c.lineWidth = Math.max(1.3, L * 0.014);
    c.strokeStyle = om(140, 112, 80);
    c.stroke();
    c.beginPath();
    c.moveTo(-L * 0.3, -H * 0.64);
    c.quadraticCurveTo(0, -H * 0.58, L * 0.31, -H * 0.64);
    c.lineWidth = Math.max(1, L * 0.01);
    c.strokeStyle = om(112, 90, 64);
    c.stroke();
    c.restore();

    c.restore();
  }

  function bat1(c, L, H, om, al, nuit, t) {
    c.save();

    var TAU = 6.2831853;
    var wx = L * 0.40;          // demi-largeur du corps de logis
    var wallTop = -H * 0.62;    // remonte derriere l'avant-toit pour eviter tout jour
    var plinthY = -H * 0.11;
    var eaveY = -H * 0.598;
    var eaveX = L * 0.52;
    var ridgeY = -H * 0.925;
    var ridgeX = L * 0.435;

    function flamme(fx, fy, fs, seed) {
      if (nuit <= 0.02) return;
      c.save();
      c.globalCompositeOperation = "lighter";
      c.beginPath();
      c.rect(-L * 0.6, -H * 1.2, L * 1.2, H * 1.2);
      c.clip();
      var halo = c.createRadialGradient(fx, fy - fs * 0.7, 0, fx, fy - fs * 0.7, fs * 6);
      halo.addColorStop(0, "rgba(255,198,116," + (0.40 * nuit).toFixed(3) + ")");
      halo.addColorStop(0.34, "rgba(255,142,56," + (0.15 * nuit).toFixed(3) + ")");
      halo.addColorStop(1, "rgba(255,110,30,0)");
      c.fillStyle = halo;
      c.beginPath();
      c.arc(fx, fy - fs * 0.7, fs * 6, 0, TAU);
      c.fill();
      for (var i = 0; i < 10; i++) {
        var ph = t * (0.5 + al(seed + i) * 0.45) + al(seed + i + 17) * TAU;
        var sway = Math.sin(ph) * fs * 0.32;
        var hgt = fs * (1.2 + 1.5 * al(seed + i + 41)) * (0.76 + 0.24 * Math.sin(ph * 1.7));
        var wid = fs * (0.26 + 0.32 * al(seed + i + 63));
        var a = nuit * (0.14 + 0.20 * al(seed + i + 7));
        c.fillStyle = (i % 3 === 0)
          ? "rgba(255,240,196," + a.toFixed(3) + ")"
          : "rgba(255,144,44," + a.toFixed(3) + ")";
        c.beginPath();
        c.moveTo(fx - wid, fy);
        c.quadraticCurveTo(fx - wid + sway * 0.6, fy - hgt * 0.55, fx + sway, fy - hgt);
        c.quadraticCurveTo(fx + wid + sway * 0.6, fy - hgt * 0.55, fx + wid, fy);
        c.closePath();
        c.fill();
      }
      c.restore();
    }

    function touffe(gx, gy, gs, seed) {
      // le trait a une epaisseur plancher : remonter le pied pour rester au dessus du sol
      var lw = Math.max(0.6, gs * 0.15);
      var by = Math.min(gy, -lw * 0.6);
      c.save();
      c.lineCap = "round";
      c.lineWidth = lw;
      for (var i = 0; i < 11; i++) {
        var a = -1.5708 + (al(seed + i) - 0.5) * 2.1;
        var ln = gs * (0.5 + al(seed + i + 11) * 1.0);
        var sw = Math.sin(t * 0.3 + al(seed + i + 23) * TAU) * gs * 0.12;
        c.strokeStyle = al(seed + i + 5) > 0.5 ? om(120, 142, 74) : om(72, 94, 50);
        c.beginPath();
        c.moveTo(gx, by);
        c.quadraticCurveTo(gx + Math.cos(a) * ln * 0.45, by + Math.sin(a) * ln * 0.75,
                           gx + Math.cos(a) * ln + sw, by + Math.sin(a) * ln);
        c.stroke();
      }
      c.restore();
    }

    // Fut a entasis : le renflement doit se lire meme sur une colonnette de loggia
    function colonnette(cx, yb, yt, rb, seed) {
      var hh = yb - yt;
      var n = 12, i, u;
      function rad(v) {
        return rb * (1 - 0.16 * v) + rb * 0.05 * Math.sin(Math.PI * Math.pow(v, 0.9));
      }
      c.save();
      c.beginPath();
      for (i = 0; i <= n; i++) { u = i / n; c.lineTo(cx + rad(u), yb - hh * u); }
      for (i = n; i >= 0; i--) { u = i / n; c.lineTo(cx - rad(u), yb - hh * u); }
      c.closePath();
      var gc = c.createLinearGradient(cx - rb, 0, cx + rb, 0);
      gc.addColorStop(0, om(96, 84, 66));
      gc.addColorStop(0.18, om(140, 126, 102));
      gc.addColorStop(0.5, om(206, 194, 166));
      gc.addColorStop(0.76, om(246, 238, 214));
      gc.addColorStop(1, om(178, 166, 142));
      c.fillStyle = gc;
      c.fill();
      c.clip();
      var gy2 = c.createLinearGradient(0, yt, 0, yb);
      gy2.addColorStop(0, om(255, 250, 232, 0.14));
      gy2.addColorStop(0.35, om(255, 250, 232, 0));
      gy2.addColorStop(1, om(46, 36, 26, 0.28));
      c.fillStyle = gy2;
      c.fillRect(cx - rb * 1.4, yt, rb * 2.8, hh);
      for (var f = 0; f < 5; f++) {
        var th = -1.5708 + Math.PI * (f + 0.5) / 5;
        var lit = Math.max(0, Math.cos(th - 0.7));
        c.strokeStyle = om(58, 46, 34, 0.20 + 0.16 * (1 - lit));
