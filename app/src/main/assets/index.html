  /* Ondulation : l'emoji est rendu une fois hors écran, puis redessiné en tranches
     verticales décalées par une onde qui court de la tête vers la queue. Un simple
     balancement d'ensemble ferait « panneau qui pivote » ; là, le corps nage. */
  // Un seul cache pour tout le monde : une espèce dessinée et un emoji produisent
  // le même sprite, donc les deux héritent de l'ondulation sans code en double.
  const emSprites = {};
  const TAILLE_SPRITE = S96;
  // les sprites fournis sont décodés une fois au démarrage
  const IMAGES = {};
  for (const cle in ASSETS_B64){
    const im = new Image();
    im.src = ASSETS_B64[cle];
    IMAGES[cle] = im;
  }
  function spriteEmoji(cle){
    const im = IMAGES[cle];
    if (im) return (im.complete && im.naturalWidth) ? im : null;   // pas encore décodé
    if (emSprites[cle]) return emSprites[cle];
    const c = document.createElement("canvas");
    c.width = c.height = TAILLE_SPRITE;
    const g = c.getContext("2d");
    if (DESSINS[cle]) DESSINS[cle](g);
    else {
      g.font = Math.round(TAILLE_SPRITE * .82)
             + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(cle, TAILLE_SPRITE / 2, TAILLE_SPRITE / 2);
    }
    return emSprites[cle] = c;
  }
  const N_TRANCHES = 11;
  // amplitude et cadence de l'ondulation selon le style de nage
  const ONDE = { ondule:  { a:.055, f:3.4 }, planeur: { a:.020, f:1.5 },
                 derive:  { a:.030, f:1.1 }, jet:     { a:0,    f:0   },
                 meduse:  { a:0,    f:0   } };
  function poissonEmoji(c, s, t){
    const sp = spriteEmoji(s.em);
    if (!sp) return;                          // sprite pas encore prêt
    const d = s.t * 3.2;

    // calmar et méduse ne se tortillent pas : ils se contractent puis se détendent
    if (s.nage === "jet" || s.nage === "meduse"){
      const vite = s.nage === "jet" ? 1.5 : 1.1;
      const pomp = Math.sin(t * vite + s.ph);
      c.scale(1 + pomp * .13, 1 - pomp * .11);
      c.drawImage(sp, -d / 2, -d / 2, d, d);
      return;
    }

    const o = ONDE[s.nage] || ONDE.ondule;
    const sw = sp.width / N_TRANCHES, dw = d / N_TRANCHES;
    for (let i = 0; i < N_TRANCHES; i++){
      const u = i / (N_TRANCHES - 1);            // 0 = tête, 1 = queue
      // l'onde remonte le corps ; l'amplitude enfle vers la queue
      const dy = Math.sin(t * o.f + s.ph - u * 3.2) * d * o.a * (.15 + u);
      c.drawImage(sp, i * sw, 0, sw, sp.height,
                  -d / 2 + i * dw, -d / 2 + dy, dw + .7, d);   // +.7 : pas de couture
    }
  }
  function meduse(c, s, t0){                   // ombrelle translucide + tentacules
    const pulse = 1 + Math.sin(t0 * 1.5 + s.ph) * .13, R = s.t * 1.15;
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "rgba(140,120,255,.16)";
    c.beginPath(); c.arc(0, 0, R * 2.2 * pulse, 0, 6.283); c.fill();
    const g = c.createLinearGradient(0, -R, 0, R * .8);
    g.addColorStop(0, "rgba(226,214,255,.72)");
    g.addColorStop(1, "rgba(150,120,235,.16)");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, R * pulse, R * .78 * pulse, 0, Math.PI, 0); c.fill();
    c.strokeStyle = "rgba(206,190,255,.5)"; c.lineWidth = 1.6 * dpr; c.lineCap = "round";
    for (let k = -2; k <= 2; k++){
      c.beginPath(); c.moveTo(k * R * .3, R * .1);
      c.quadraticCurveTo(k * R * .48 + Math.sin(t0 * 2.2 + k + s.ph) * 7 * dpr, R * 1.5,
                         k * R * .32, R * 2.6);
      c.stroke();
    }
    c.globalCompositeOperation = "source-over";
  }
  function poissonLanterne(c, s, t0){          // corps trapu, mâchoire, leurre lumineux
    const L = s.t * 1.1;
    c.fillStyle = "rgba(8,12,22,.96)";
    c.beginPath(); c.ellipse(0, 0, L, L * .72, 0, 0, 6.283); c.fill();
    c.beginPath(); c.moveTo(-L * .95, 0);                                 // queue
    c.lineTo(-L * 1.7, -L * .5); c.lineTo(-L * 1.7, L * .5); c.closePath(); c.fill();
    c.fillStyle = "rgba(230,244,255,.85)";                                // dents
    for (let k = 0; k < 5; k++){
      const x = L * (.18 + k * .16);
      c.beginPath(); c.moveTo(x, L * .3); c.lineTo(x + L * .07, L * .05);
      c.lineTo(x + L * .14, L * .3); c.closePath(); c.fill();
    }
    c.strokeStyle = "rgba(10,16,26,.96)"; c.lineWidth = 2.2 * dpr;        // tige du leurre
    c.beginPath(); c.moveTo(L * .25, -L * .55);
    c.quadraticCurveTo(L * 1.25, -L * 1.5, L * 1.5, -L * .55); c.stroke();
    const pulse = .55 + Math.sin(t0 * 3 + s.ph) * .45;                    // leurre qui palpite
    c.globalCompositeOperation = "lighter";
    c.fillStyle = "rgba(140,255,220," + (.16 * pulse) + ")";
    c.beginPath(); c.arc(L * 1.5, -L * .55, L * 1.5, 0, 6.283); c.fill();
    c.fillStyle = "rgba(200,255,240," + (.55 + .4 * pulse) + ")";
    c.beginPath(); c.arc(L * 1.5, -L * .55, L * .22, 0, 6.283); c.fill();
    c.globalCompositeOperation = "source-over";
    c.fillStyle = "rgba(150,240,255,.8)";                                 // œil
    c.beginPath(); c.arc(L * .45, -L * .18, L * .11, 0, 6.283); c.fill();
  }

  /* ---- instruments : règle de profondeur + manomètre ----
     RP : l'écran est le masque du plongeur. La vitre du manomètre puis celle du
     casque se fissurent quand la pression devient critique. */
  let rulePM = -1;                          // profondeur max déjà graduée
  function construitRegle(PM){
    if (rulePM === PM) return;
    rulePM = PM;
    const pas = PM <= 40 ? 5 : PM <= 250 ? 25 : PM <= 700 ? 100 : 200;
    let h = "";
    for (let m = 0; m <= PM; m += pas){
      const y = (m / PM) * 100, maj = (m % (pas * 2) === 0);
      h += '<i class="' + (maj ? "maj" : "") + '" style="top:' + y + '%;width:'
         + (maj ? 14 : 8) + 'px"></i>';
      if (maj) h += '<b style="top:' + y + '%">' + m + '</b>';
    }
    $("drTicks").innerHTML = h;
    // graduations du cadran, une fois par échelle
    const barMax = 1 + PM / 10;
    let t = "";
    for (let i = 0; i <= 8; i++){
      const a = (-120 + i * 30) * Math.PI / 180, maj = i % 2 === 0;
      const r1 = maj ? 36 : 40, r2 = 46;
      t += '<line class="' + (maj ? "maj" : "") + '" x1="' + (60 + Math.sin(a) * r1).toFixed(1)
         + '" y1="' + (60 - Math.cos(a) * r1).toFixed(1)
         + '" x2="' + (60 + Math.sin(a) * r2).toFixed(1)
         + '" y2="' + (60 - Math.cos(a) * r2).toFixed(1) + '"/>';
    }
    $("pgTicks").innerHTML = t;
    $("pressGauge").dataset.max = barMax;
  }
  function majInstruments(secDep){
    const PM = profMax();
    construitRegle(PM);
    // règle : le curseur descend avec nous
    $("drCursor").style.top = Math.max(0, Math.min(100, profM / PM * 100)) + "%";
    $("drVal").textContent = "−" + (profM < 100 ? profM.toFixed(1) : Math.round(profM));
    // manomètre : 1 bar d'atmosphère + 1 bar par tranche de 10 m
    const bar = 1 + profM / 10, barMax = Number($("pressGauge").dataset.max) || 1;
    $("pgNeedle").style.transform =
      "rotate(" + (-120 + Math.min(1, bar / barMax) * 240).toFixed(1) + "deg)";
    $("pgVal").textContent = bar.toFixed(bar < 100 ? 1 : 0) + " bar";
    // état de la LED. Une fois le départ passé, tout redevient calme :
    // sinon les fissures resteraient à l'écran toute la soirée.
    const b = document.body, avant = secDep > 0;
    const etat = !avant ? "" : secDep <= 60 ? "noire" : secDep <= 300 ? "rouge"
               : secDep <= 1200 ? "orange" : secDep <= 3600 ? "jaune" : "";
    for (const e of ["jaune", "orange", "rouge", "noire"])
      b.classList.toggle("led-" + e, etat === e);
    b.classList.toggle("pg-fissure", avant && secDep <= 300);   // vitre du manomètre
    b.classList.toggle("visor-casse", avant && secDep <= 60);   // vitre du casque
  }

  let profM = 0;                            // profondeur courante
  function dessineAbysses(prog, enPause, alerte, libre, secDep){
    initAbysses();
    const p = Math.max(0, Math.min(1, prog));
    const lent = reduce ? .35 : 1;
    const PM = profMax();
    profM = PM * p;                          // on DESCEND : 0 le matin, PM le soir
    const t0 = performance.now() / 1000;
    const zone = libre ? "fosse" : zoneDe(secDep);
    const clarte = libre ? .05 : clarteDe(secDep);
    const g = ctx.createLinearGradient(0, 0, 0, Hh);
    g.addColorStop(0, "rgb(" + mix([1, 8, 18], [96, 214, 232], clarte) + ")");
    g.addColorStop(1, "rgb(" + mix([0, 2, 6], [14, 104, 146], clarte) + ")");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);

    // géométrie verticale : le plongeur est fixe, surface et fond défilent.
    // SPAN large = la surface quitte l'écran tôt, le fond n'arrive qu'à la fin.
    const dy = Hh * .46, SPAN = Hh * 3;
    const surfY = dy - p * SPAN;
    // Le fond ne monte dans le champ que sur les 2 dernières minutes : il doit
    // surgir de l'obscurité au moment où la vitre lâche, pas traîner tout l'après-midi.
    const APPROCHE = 120;
    const solY = libre ? dy
               : secDep > APPROCHE ? Hh * 99
               : dy + (secDep / APPROCHE) * Hh * 1.5;

    // couches de brume qui dérivent lentement : donne du volume à l'eau
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 3; i++){
      const y = ((t0 * (5 + i * 3) + i * Hh / 3) % (Hh + 300 * dpr)) - 150 * dpr;
      const h = (110 + i * 60) * dpr;
      const bg = ctx.createLinearGradient(0, y, 0, y + h);
      bg.addColorStop(0, "rgba(120,190,220,0)");
      bg.addColorStop(.5, "rgba(120,190,220," + (.018 + clarte * .03) + ")");
      bg.addColorStop(1, "rgba(120,190,220,0)");
      ctx.fillStyle = bg; ctx.fillRect(0, y, W, h);
    }
    ctx.globalCompositeOperation = "source-over";

    // rais de lumière, seulement tant qu'on est assez haut
    if (clarte > .12){
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 4; i++){
        const x = W * (.16 + i * .24) + Math.sin(t0 * .25 + i) * 40 * dpr;
        const w = (34 + Math.sin(t0 * .4 + i * 2) * 12) * dpr;
        const gr = ctx.createLinearGradient(x, 0, x + w * .6, Hh);
        gr.addColorStop(0, "rgba(190,245,255," + (.04 + clarte * .14) + ")");
        gr.addColorStop(1, "rgba(190,245,255,0)");
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.moveTo(x - w, 0); ctx.lineTo(x + w, 0);
        ctx.lineTo(x + w * 2.4, Hh); ctx.lineTo(x - w * .4, Hh);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }
    // caustiques : franches près de la surface, éteintes en profondeur
    caustiques(clarte * clarte * .5, t0 * .55);

    // plancton : il monte puisqu'on descend
    for (const q of plancton){
      q.y -= q.v * lent * (enPause ? .12 : 1);
      if (q.y < -4){ q.y = Hh + 4; q.x = Math.random() * W; }
      ctx.fillStyle = "rgba(200,240,255," + (q.a * (.2 + clarte * .45)) + ")";
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
    }

    // ---- la surface et le bateau, visibles seulement au tout début ----
    if (surfY > -120 * dpr){
      const sg = ctx.createLinearGradient(0, surfY - 130 * dpr, 0, surfY);
      sg.addColorStop(0, "rgba(255,255,255,.5)");
      sg.addColorStop(1, "rgba(200,248,255,0)");
      ctx.fillStyle = sg; ctx.fillRect(0, surfY - 130 * dpr, W, 130 * dpr);
      ctx.strokeStyle = "rgba(240,255,255,.85)"; ctx.lineWidth = 2.4 * dpr;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12 * dpr)
        ctx.lineTo(x, surfY + Math.sin(x * .015 + t0 * 2.2) * 5 * dpr);
      ctx.stroke();

      if (aDebloque("boat")){                 // coque + cabine + mât, vus d'en dessous
        const bx = W * .13 + Math.sin(t0 * .6) * 14 * dpr;   // dégagé du compteur
        const by = surfY + Math.sin(bx * .015 + t0 * 2.2) * 5 * dpr;
        ctx.save(); ctx.translate(bx, by); ctx.rotate(Math.sin(t0 * .9) * .05);
        ctx.fillStyle = "rgba(10,24,38,.95)";
        ctx.beginPath(); ctx.moveTo(-52 * dpr, 0); ctx.lineTo(52 * dpr, 0);
        ctx.quadraticCurveTo(40 * dpr, 22 * dpr, -28 * dpr, 20 * dpr);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgba(18,40,60,.95)";
        ctx.fillRect(-16 * dpr, -20 * dpr, 30 * dpr, 20 * dpr);           // cabine
        ctx.fillRect(24 * dpr, -44 * dpr, 3.5 * dpr, 44 * dpr);           // mât
        ctx.restore();
      }
    }

    // ---- la plaine abyssale, qui surgit dans les dernières secondes ----
    if (solY < Hh + 60 * dpr){
      const relief = x => Math.sin(x * .011) * 11 * dpr + Math.sin(x * .0037 + 2) * 18 * dpr;

      // voile de sédiment en suspension juste au-dessus du sol
      const hz = ctx.createLinearGradient(0, solY - 120 * dpr, 0, solY + 20 * dpr);
      hz.addColorStop(0, "rgba(90,120,140,0)");
      hz.addColorStop(1, "rgba(90,120,140,.16)");
      ctx.fillStyle = hz; ctx.fillRect(0, solY - 120 * dpr, W, 140 * dpr);

      // rochers en silhouette, posés derrière le sol
      ctx.fillStyle = "rgb(" + mix([9, 13, 20], [58, 62, 66], clarte) + ")";
      for (const r of rochers){
        const bx = r.x * W, by = solY + relief(r.x * W) - r.h * .18;
        ctx.beginPath();
        ctx.moveTo(bx - r.w, by + r.h);
        ctx.lineTo(bx - r.w * .62, by - r.h * .5);
        ctx.lineTo(bx + r.w * .1, by - r.h);
        ctx.lineTo(bx + r.w * .78, by - r.h * .34);
        ctx.lineTo(bx + r.w, by + r.h);
        ctx.closePath(); ctx.fill();
      }

      // le sol : sédiment sombre, éclairci près de la crête par la lampe
      const sg = ctx.createLinearGradient(0, solY - 10 * dpr, 0, solY + Hh * .35);
      sg.addColorStop(0, "rgb(" + mix([46, 50, 54], [214, 196, 152], clarte) + ")");
      sg.addColorStop(1, "rgb(" + mix([6, 9, 14], [120, 106, 78], clarte) + ")");
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.moveTo(0, Hh + 40 * dpr); ctx.lineTo(0, solY + relief(0));
      for (let x = 0; x <= W; x += 18 * dpr) ctx.lineTo(x, solY + relief(x));
      ctx.lineTo(W, Hh + 40 * dpr); ctx.closePath(); ctx.fill();

      // grains clairs sur le sédiment, pour casser l'aplat
      ctx.fillStyle = "rgba(190,205,215,.10)";
      for (const gr of grains){
        const gx = gr.x * W, gy = solY + relief(gx) + gr.y * Hh * .3;
        if (gy > Hh + 20 * dpr) continue;
        ctx.beginPath(); ctx.arc(gx, gy, gr.r * dpr, 0, 6.283); ctx.fill();
      }

      if (aDebloque("algues")){
        ctx.strokeStyle = "rgba(" + mix([16, 52, 46], [56, 164, 96], clarte) + ",.9)";
        ctx.lineCap = "round";
        for (const hb of herbes){
          const hx = hb.x * W, base = solY + relief(hx);
          ctx.lineWidth = hb.w;
          ctx.beginPath(); ctx.moveTo(hx, base);
          ctx.quadraticCurveTo(hx + Math.sin(t0 * 1.1 + hb.ph) * 18 * dpr, base - hb.h * .58,
                               hx + Math.sin(t0 * 1.1 + hb.ph) * 27 * dpr, base - hb.h);
          ctx.stroke();
        }
      }
      if (aDebloque("tresor")){               // coffre ouvert, or qui déborde
        // à droite du compteur : au centre, le coffre passerait sous les chiffres
        const cx = W * .87, cy = solY + relief(cx) - 16 * dpr, s = dpr;
        ctx.save(); ctx.translate(cx, cy);
        ctx.fillStyle = "rgb(" + mix([26, 22, 18], [96, 62, 32], clarte) + ")";
        ctx.fillRect(-28 * s, 0, 56 * s, 22 * s);                          // caisse
        ctx.save(); ctx.rotate(-.42);                                      // couvercle ouvert
        ctx.beginPath(); ctx.ellipse(-6 * s, -8 * s, 28 * s, 14 * s, 0, Math.PI, 0); ctx.fill();
        ctx.restore();
        ctx.fillStyle = "rgb(" + mix([56, 46, 20], [214, 172, 62], clarte) + ")";
        ctx.fillRect(-28 * s, -3 * s, 56 * s, 5 * s);                      // ferrure
        for (let k = 0; k < 7; k++){                                       // pièces
          ctx.beginPath();
          ctx.ellipse(-20 * s + k * 7 * s, -6 * s + Math.sin(k * 2.1) * 3 * s,
                      4.4 * s, 2.6 * s, 0, 0, 6.283);
          ctx.fill();
        }
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(255,214,110," + (.14 + Math.sin(t0 * 2) * .05) + ")";
        ctx.beginPath(); ctx.arc(0, 0, 46 * s, 0, 6.283); ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.restore();
      }
    }

    // ---- faune de la zone courante uniquement ----
    if (aDebloque("bg")){
      const zoneOk = { recif:true, large:true, meduses:aDebloque("rouge"),
                       abysse:aDebloque("rouge"), fosse:aDebloque("rouge") }[zone];
      // les méduses sont grandes : moins nombreuses. Dans la fosse, la vie se raréfie.
      const cible = !zoneOk ? 0
                  : zone === "fosse"   ? 3
                  : zone === "meduses" ? 5
                  : (aDebloque("orange") ? 9 : 5);
      // renouveler la population quand on change de zone
      for (let i = nageurs.length - 1; i >= 0; i--)
        if (nageurs[i].zone !== zone) nageurs.splice(i, 1);
      while (nageurs.length < cible) nageurs.push(seedNageur(zone, true));
      while (nageurs.length > cible) nageurs.pop();

      for (const s of nageurs){
        // chaque style avance à sa manière : le calmar pousse puis glisse,
        // la méduse dérive en tanguant, le grand nageur file droit.
        let allure = 1, monteeY = Math.sin(t0 * 1.6 + s.ph) * .5;
        if (s.nage === "jet"){
          const poussee = Math.max(0, Math.sin(t0 * 1.5 + s.ph));
          allure = .2 + poussee * poussee * 2.1;
        } else if (s.nage === "meduse"){
          const pomp = Math.max(0, Math.sin(t0 * 1.1 + s.ph));
          allure = .35 + pomp * pomp * 1.2;
          monteeY = Math.sin(t0 * 1.1 + s.ph) * 1.1;      // tangage vertical marqué
        } else if (s.nage === "derive"){
          allure = .8 + Math.sin(t0 * .5 + s.ph) * .25;
          monteeY = Math.sin(t0 * .8 + s.ph) * .8;
        } else if (s.nage === "planeur"){
          allure = 1;                                      // allure régulière, sans à-coups
          monteeY = Math.sin(t0 * .7 + s.ph) * .35;
        }
        s.x += s.v * s.dir * lent * allure;
        s.y += monteeY * dpr * lent;
        if (s.dir > 0 ? s.x > W + 110 * dpr : s.x < -110 * dpr) Object.assign(s, seedNageur(zone));
        ctx.save(); ctx.translate(s.x, s.y);
        // l'éloignement estompe la créature, et l'eau trouble l'estompe encore
        ctx.globalAlpha = s.op * (.7 + clarte * .3);
        if (s.dess){
          ctx.scale(s.dir, 1);
          if (zone === "meduses") meduse(ctx, s, t0);
          else                    poissonLanterne(ctx, s, t0);   // abysse et fosse
        } else {
          ctx.scale(-s.dir, 1);            // les emoji poissons regardent à gauche
          poissonEmoji(ctx, s, t0);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }
    if (aDebloque("violet") && zone !== "recif"){       // un géant traverse, seul
      if (!baleine && Math.random() < .0014){
        // le requin scintillant est la pièce de collection : 1 % des passages
        const cle = Math.random() < P_RARE
                  ? GEANT_RARE : GEANTS[(Math.random() * GEANTS.length) | 0];
        baleine = { cle, x: -340 * dpr, y: Hh * (.14 + Math.random() * .6),
                    v: .85 * dpr, ph: Math.random() * 6.3 };
      }
      if (baleine){
        baleine.x += baleine.v * lent;
        if (baleine.x > W + 380 * dpr) baleine = null;
        else {
          const sp = spriteEmoji(baleine.cle);
          if (sp){
            const L = 300 * dpr;
            ctx.save();
            ctx.translate(baleine.x, baleine.y + Math.sin(t0 * .7 + baleine.ph) * 8 * dpr);
            ctx.scale(-1, 1);                       // les sprites regardent à gauche
            ctx.globalAlpha = .55 + clarte * .4;
            ctx.drawImage(sp, -L / 2, -L / 2, L, L);
            ctx.globalAlpha = 1;
            ctx.restore();
          }
        }
      }
    }

    // ---- le plongeur : il descend, tête en bas ----
    if (aDebloque("diver")){
      const dxp = W * .17, tang = Math.sin(t0 * 1.1) * .07;
      ctx.save(); ctx.translate(dxp, dy); ctx.rotate(.42 + tang);
      ctx.fillStyle = "rgba(6,16,28,.95)";
      ctx.beginPath(); ctx.ellipse(0, 0, 25 * dpr, 10 * dpr, 0, 0, 6.283); ctx.fill();   // torse
      ctx.beginPath(); ctx.arc(23 * dpr, -3 * dpr, 8.5 * dpr, 0, 6.283); ctx.fill();     // tête
      ctx.fillStyle = "rgba(16,34,52,.95)";
      ctx.fillRect(-16 * dpr, -17 * dpr, 18 * dpr, 13 * dpr);                            // bloc
      ctx.fillStyle = "rgba(6,16,28,.95)";
      ctx.beginPath(); ctx.moveTo(-22 * dpr, -2 * dpr);                                  // jambes
      ctx.lineTo(-40 * dpr, -7 * dpr); ctx.lineTo(-40 * dpr, 4 * dpr); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-38 * dpr, -8 * dpr);                                  // palmes
      ctx.lineTo(-58 * dpr, -16 * dpr); ctx.lineTo(-52 * dpr, -2 * dpr); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-38 * dpr, 3 * dpr);
      ctx.lineTo(-56 * dpr, 12 * dpr); ctx.lineTo(-50 * dpr, -1 * dpr); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(" + accent().map(Math.round) + ",.95)";                      // masque
      ctx.beginPath(); ctx.ellipse(27 * dpr, -4 * dpr, 5.5 * dpr, 4 * dpr, 0, 0, 6.283); ctx.fill();
      ctx.restore();

      // lampe frontale dans le noir
      if (clarte < .3){
        ctx.globalCompositeOperation = "lighter";
        const lg = ctx.createRadialGradient(dxp + 30 * dpr, dy + 10 * dpr, 0,
                                            dxp + 30 * dpr, dy + 10 * dpr, 230 * dpr);
        lg.addColorStop(0, "rgba(190,240,255,.20)");
        lg.addColorStop(1, "rgba(190,240,255,0)");
        ctx.fillStyle = lg; ctx.fillRect(0, 0, W, Hh);
        ctx.globalCompositeOperation = "source-over";
      }

      if (bulles.length < 40 && Math.random() < (enPause ? .2 : .4))
        bulles.push({ x: dxp + 22 * dpr + (Math.random() - .5) * 10 * dpr, y: dy - 10 * dpr,
                      r: (Math.random() * 3 + 1.2) * dpr,
                      v: (Math.random() * 1.4 + .9) * dpr, ph: Math.random() * 6.3 });
    } else if (bulles.length < 6 && Math.random() < .04){
      bulles.push({ x: Math.random() * W, y: Hh, r: (Math.random() * 2.4 + 1) * dpr,
                    v: (Math.random() * 1 + .6) * dpr, ph: Math.random() * 6.3 });
    }
    for (let i = bulles.length - 1; i >= 0; i--){
      const b = bulles[i];
      b.y -= b.v * lent; b.x += Math.sin(b.y * .04 + b.ph) * .6 * dpr;
      if (b.y < -10){ bulles.splice(i, 1); continue; }
      ctx.strokeStyle = "rgba(225,250,255,.5)"; ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.stroke();
    }

    // la bioluminescence prend le relais quand la lumière du jour a disparu
    bioluminescence((1 - clarte) * .85, t0);

    // voile central : sans lui le texte serait illisible en eau claire
    const vg = ctx.createRadialGradient(W * .5, Hh * .42, 0, W * .5, Hh * .42, Math.max(W, Hh) * .55);
    vg.addColorStop(0, "rgba(1,12,22," + (.30 * clarte + .12) + ")");
    vg.addColorStop(1, "rgba(1,12,22,0)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, Hh);

    // vignettage : referme l'image, appuie la sensation d'enfermement en profondeur
    const vig = ctx.createRadialGradient(W * .5, Hh * .5, Math.min(W, Hh) * .30,
                                         W * .5, Hh * .5, Math.max(W, Hh) * .78);
    vig.addColorStop(0, "rgba(0,6,12,0)");
    vig.addColorStop(1, "rgba(0,6,12," + (.34 + (1 - clarte) * .34) + ")");
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, Hh);

    // fin de journée : on touche le fond, la lampe éclaire le sable
    if (libre){
      ctx.globalCompositeOperation = "lighter";
      const s = ctx.createRadialGradient(W * .5, Hh * .7, 0, W * .5, Hh * .7, Hh * .9);
      s.addColorStop(0, "rgba(190,235,255,.22)");
      s.addColorStop(1, "rgba(190,235,255,0)");
      ctx.fillStyle = s; ctx.fillRect(0, 0, W, Hh);
      ctx.globalCompositeOperation = "source-over";
    }
  }
  /* ========================================================= */

  /* --- le hamburger : une couche toutes les 15 minutes de pause --- */
  const COUCHES = ["l-bunb","l-steak","l-cheese","l-salad","l-tomato","l-onion","l-bacon","l-bunt"];
  let couchesPosees = -1;
  function majBurger(n){
    if (n === couchesPosees) return;
    const host = $("burger");
    if (n < couchesPosees){ host.textContent = ""; couchesPosees = 0; }
    for (let i = couchesPosees < 0 ? 0 : couchesPosees; i < n; i++){
      const el = document.createElement("i");
      el.className = COUCHES[i];
      host.appendChild(el);
      if (couchesPosees >= 0) chirp(180 + i * 40, .12, "sine", .05);
    }
    couchesPosees = n;
  }

  /* --- boucle --- */
  let frames = 0, fpsT = performance.now();
  function loop(){
    hostWin().requestAnimationFrame(loop);
    const t = nowUs(), now = t / 1000;
    const b = document.body;
    // si l'appli est épinglée en PiP, son body reçoit les mêmes classes d'état
    if (pipWin) pipWin.document.body.className = b.className;
    if (new Date(now).getDate() !== jourAffiche) recale();   // minuit : on repart sur la journée suivante

    // tokens : le rAF ne tourne que fenêtre visible → on crédite le temps réellement passé
    const pn = performance.now();
    if (lastTok) jeu.earned += Math.min(1, (pn - lastTok) / 1000) * tauxToken();
    lastTok = pn;
    const s = solde();
    $("tokVal").textContent = s; $("treeVal").textContent = s;
    if (pn - tokSaveT > 1000){ tokSaveT = pn; sauveJeu(); majArbre(); }

    // phase de la journée (pause : réglable ET débloquée dans l'arbre)
    const pauseOn = horaires.pause && aDebloque("lunch");
    if (now < A.debut)                phase = "avant";
    else if (pauseOn && now < A.dej)  phase = "matin";
    else if (pauseOn && now < A.rep)  phase = "pause";
    else if (now < A.dep)             phase = pauseOn ? "aprem" : "jour";
    else                              phase = "libre";

    const enPause = phase === "pause";
    // pendant la pause, le compte à rebours vise la reprise ; sinon, le départ
    const cibleUs = (enPause ? A.rep : A.dep) * 1000;
    const rem = cibleUs - t, over = rem < 0, abs = Math.abs(rem);

    // Affichage arrondi AU-DESSUS jusqu'à la plus petite unité débloquée : sinon, avec
    // seulement les heures, 30 min restantes montreraient « 0 h » sans être LIBRE.
    // (abs reste la vraie valeur : seuils, bips et logique ne doivent pas être arrondis.)
    const unite = aDebloque("us")  ? 1
                : aDebloque("ms")  ? 1e3
                : aDebloque("sec") ? 1e6
                : aDebloque("min") ? 6e7
                :                    3.6e9;
    const absR = over ? abs : Math.ceil(abs / unite) * unite;
    setDigits(H, Math.min(Math.floor(absR / 3.6e9), 99));
    setDigits(M, Math.floor(absR / 6e7) % 60);
    setDigits(S, Math.floor(absR / 1e6) % 60);
    $("ms").textContent = pad(Math.floor(absR / 1e3) % 1000, 3);
    $("us").textContent = pad(absR % 1000, 3);

    // habillage selon la phase
    const secLeft = rem / 1e6;
    const secDep = (A.dep - now) / 1000;           // secondes avant le départ, seul juge de l'urgence
    let alerte = "";
    if (!enPause && phase !== "libre")
      for (const s of SEUILS) if (aDebloque(s.classe) && secDep <= s.sec) alerte = s.classe;
    b.classList.toggle("lunch", enPause);
    for (const s of SEUILS) b.classList.toggle(s.classe, alerte === s.classe);
    if (alerte !== lastAlerte){
      ({ jaune:  () => air([523, 659]),
         orange: () => air([440, 554]),
         rouge:  () => air([392, 466, 587]),
         violet: () => air([330, 415, 523, 622]),
         arc:    () => air([262, 330, 392, 523, 659, 784])
       }[alerte] || (() => {}))();
      lastAlerte = alerte;
    }

    if (phase !== lastPhase){
      if (lastPhase !== ""){
        if (enPause){ burst(20, 45); air([392, 523, 659, 784]); }
        else if (phase === "aprem"){ burst(200, 60); air([784, 659, 523]); }
      }
      lastPhase = phase;
    }

    if (phase === "libre" && !freed){
      freed = true;
      b.classList.add("free");
      for (const s of SEUILS) b.classList.remove(s.classe);
      burst(120, 70); air([523, 659, 784, 1046]);
    }
    $("status").textContent = {
      avant: "avant l'embauche", matin: "matinée", pause: "pause repas",
      aprem: "après-midi", jour: "journée en cours", libre: "heures supplémentaires"
    }[phase];
    $("targetLbl").textContent = enPause ? "reprise à " + hhmm(A.rep)
                               : phase === "libre" ? "départ passé à " + hhmm(A.dep)
                               : "départ à " + hhmm(A.dep);

    // hamburger : 8 couches réparties sur la pause
    majBurger(enPause ? Math.max(1, Math.ceil((now - A.dej) / (A.rep - A.dej) * 8)) : 0);

    // bips
    if (!over){
      const sec = Math.ceil(secLeft);
      if (sec !== lastSecond){
        lastSecond = sec;
        if (sec <= 10) chirp(sec <= 3 ? 1100 : 880, .05);
        else if (sec % 60 === 0) chirp(enPause ? 330 : 440, .07);
      }
    }

    // frise + télémétrie
    const span = A.dep - A.debut;
    const prog = Math.max(0, Math.min(1, (now - A.debut) / span));
    $("fill").style.width = (prog * 100).toFixed(3) + "%";
    $("cursor").style.left = (prog * 100).toFixed(3) + "%";

    const pause = pauseOn ? (A.rep - A.dej) : 0;
    const ecoule = Math.max(0, Math.min(now, A.dep) - A.debut);
    const pausePrise = pauseOn ? Math.max(0, Math.min(now, A.rep) - A.dej) : 0;
    const effectif = Math.max(0, ecoule - pausePrise);
    const totalTravail = span - pause;

    $("tPhase").textContent = { avant:"attente", matin:"matinée", pause:"repas",
                                aprem:"après-midi", jour:"en cours", libre:"libéré" }[phase];
    $("tWork").textContent = duree(effectif);
    $("tLeft").textContent = duree(totalTravail - effectif);
    $("tPct").textContent  = (prog * 100).toFixed(2) + " %";

    if (enPause){
      $("kExtra").textContent = "burger";
      $("tExtra").textContent = couchesPosees + "/8 couches";
    } else if (phase === "libre"){
      $("kExtra").textContent = "heures sup";     // l'info survit, le compteur géant non
      $("tExtra").textContent = duree(now - A.dep);
    } else if (pauseOn && (phase === "matin" || phase === "avant")){
      $("kExtra").textContent = "pause repas";
      $("tExtra").textContent = "dans " + duree(A.dej - now);
    } else {
      $("kExtra").textContent = "cafés possibles";
      $("tExtra").textContent = String(Math.max(0, Math.floor((A.dep - now) / 3e5)));
    }

    if (save.actif === "abysses") majInstruments(secDep);

    frames++;
    if (performance.now() - fpsT > 500){
      $("tFps").textContent = (frames / ((performance.now() - fpsT) / 1000)).toFixed(0) + " Hz";
      frames = 0; fpsT = performance.now();
    }

    /* ---- rendu ---- */
    const [r, g2, bl] = accent();

    if (save.actif === "abysses"){       // ===== MONDE 2 : remontée des abysses =====
      dessineAbysses(prog, enPause, alerte, phase === "libre", secDep);
      for (let i = bursts.length - 1; i >= 0; i--){
        const p = bursts[i];
        p.x += p.vx; p.y += p.vy; p.vy += .18 * dpr; p.life -= .012;
        if (p.life <= 0){ bursts.splice(i, 1); continue; }
        ctx.fillStyle = `hsla(${p.hue},100%,65%,${p.life})`;
        ctx.fillRect(p.x, p.y, 3 * dpr, 3 * dpr);
      }
      return;
    }

    // voile plus léger en warp : les traînées persistent et étirent l'hyperespace
    ctx.fillStyle = alerte === "arc" ? "rgba(4,5,10,.17)"
                  : enPause ? "rgba(10,4,2,.30)" : "rgba(4,5,10,.34)";
    ctx.fillRect(0, 0, W, Hh);

    if (enPause){
      // la faim monte : tout tombe plus vite à l'approche de la reprise
      const faim = 1 + (1 - Math.min(1, secLeft / (pause / 1000))) * 2.6;
      ctx.fillStyle = "#FFFFFF";   // sinon les emoji héritent du voile de fond
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.globalAlpha = .18;       // en fond, discrets : ils ne concurrencent pas le burger et le texte
      for (const f of food){
        f.y += f.vy * (reduce ? .3 : 1) * faim;
        f.rot += f.vr * faim;
        if (f.y > Hh + 80 * dpr) Object.assign(f, seedFood(true));
        ctx.save();
        ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.font = f.size + 'px "Segoe UI Emoji","Apple Color Emoji",sans-serif';
        ctx.fillText(f.ch, 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    } else if (alerte === "arc" || aDebloque("bg")) {
      // champ d'étoiles ambiant = « décor spatial » ; l'hyperespace vient avec le RAINBOW.
      const warp = alerte === "arc";                 // hyperespace RGB sur les 10 dernières s
      const urgence = over ? 5 : Math.max(.35, Math.min(4.5, 90 / Math.max(secLeft, 3)));
      const speed = warp ? (reduce ? .02 : .075) : (reduce ? .12 : .5) * urgence * .004;
      const cx = W / 2, cy = Hh / 2, fl = Math.min(W, Hh) * .9;
      for (const st of stars){
        st.z -= speed;
        if (st.z <= .02){ Object.assign(st, seedStar(1)); continue; }
        const x = cx + (st.x / st.z) * fl, y = cy + (st.y / st.z) * fl;
        if (x < -60 || x > W + 60 || y < -60 || y > Hh + 60){ Object.assign(st, seedStar(1)); continue; }
        const pz = Math.min(st.z + speed * (warp ? 3 : 9), 1);
        const a = Math.min(1, (1 - st.z) * 1.1);
        if (warp){
          // chaque étoile prend une couleur de la palette, décalée par son offset
          const [hr, hg, hb] = arcColor(arcPhase() + st.h / 360);
          ctx.strokeStyle = `rgba(${hr|0},${hg|0},${hb|0},${a})`;
          ctx.lineWidth = Math.max(1.5, (1 - st.z) * 3.6) * dpr;
        } else {
        ctx.strokeStyle = `rgba(${r},${g2},${bl},${a * .85})`;
        ctx.lineWidth = Math.max(1, (1 - st.z) * 2.4) * dpr;
        }
        ctx.beginPath();
        ctx.moveTo(cx + (st.x / pz) * fl, cy + (st.y / pz) * fl);
        ctx.lineTo(x, y); ctx.stroke();
      }
    }

    // le feu lèche le bas de l'écran : braises à 5 min, enfer à 1 min (l'arc-en-ciel, lui, part en warp)
    const BRASIER = {
      //        débit  teinte  étalement  vitesse  usure  taille  halo
      rouge:  { n: 6,  h: 4,   d: 32,     f: 1,    dv: 1,   t: 18, halo: .20, wash: "255,60,20" },
      violet: { n: 34, h: 262, d: 46,     f: 5.2,  dv: 2.3, t: 26, halo: .50, wash: "150,50,255" }
    }[alerte];
    if (BRASIER){                    // les flammes viennent avec Rouge/Violet, à leur palier
      const haut = Hh * BRASIER.halo;
      const g = ctx.createLinearGradient(0, Hh, 0, Hh - haut);
      g.addColorStop(0, `rgba(${BRASIER.wash},.3)`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g; ctx.fillRect(0, Hh - haut, W, haut);
      ctx.globalCompositeOperation = "source-over";
      attise(reduce ? Math.ceil(BRASIER.n / 3) : BRASIER.n,
             BRASIER.h, BRASIER.d, BRASIER.f, BRASIER.t, BRASIER.dv);
    }
    brule();

    for (let i = bursts.length - 1; i >= 0; i--){
      const p = bursts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .18 * dpr; p.life -= .012;
      if (p.life <= 0){ bursts.splice(i, 1); continue; }
      ctx.fillStyle = `hsla(${p.hue},100%,65%,${p.life})`;
      ctx.fillRect(p.x, p.y, 3 * dpr, 3 * dpr);
    }
  }

  /* --- menu de réglages --- */
  const CHAMPS = { hDebut: "debut", hDej: "dejeuner", hRep: "reprise", hDep: "depart" };
  function syncMenu(){                          // reflète les réglages courants dans le panneau
    for (const [id, key] of Object.entries(CHAMPS))
      $(id).value = pad(horaires[key][0], 2) + ":" + pad(horaires[key][1], 2);
    $("pauseOn").checked = horaires.pause;
    $("pauseFields").classList.toggle("off", !horaires.pause);
    $("hDej").disabled = $("hRep").disabled = !horaires.pause;
  }
  for (const [id, key] of Object.entries(CHAMPS)){
    $(id).addEventListener("change", () => {
      const v = $(id).value;
      if (!v) return;
      const [h, m] = v.split(":").map(Number);
      horaires[key] = [h, m];
      sauveHoraires();
      recale();
    });
  }
  $("pauseOn").addEventListener("change", () => {
    horaires.pause = $("pauseOn").checked;
    sauveHoraires();
    recale();
  });
  $("reset").addEventListener("click", () => {
    horaires = clone(DEF);
    sauveHoraires();
    recale();
  });

  function ouvreMenu(o){
    document.body.classList.toggle("menu-open", o);
    $("menuBtn").setAttribute("aria-expanded", String(o));
  }
  $("menuBtn").addEventListener("click", () =>
    ouvreMenu(!document.body.classList.contains("menu-open")));
  $("backdrop").addEventListener("click", () => ouvreMenu(false));

  $("sound").addEventListener("click", e => {
    soundOn = !soundOn;
    e.currentTarget.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) chirp(880, .08);
  });
  $("full").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });
  addEventListener("keydown", e => {
    if (e.key === "Escape") ouvreMenu(false);
    if (e.key.toLowerCase() === "f" && aDebloque("full")) $("full").click();
    if (e.key.toLowerCase() === "r") recale();
  });

  /* --- téléphone : garder l'écran allumé, un compte à rebours qu'on regarde --- */
  let veille = null;
  async function garderAllume(){
    try {
      if (aDebloque("wake") && "wakeLock" in navigator && !veille){
        veille = await navigator.wakeLock.request("screen");
        veille.addEventListener("release", () => { veille = null; });
      }
    } catch { /* refusé ou non supporté : sans conséquence */ }
  }
  addEventListener("pointerdown", garderAllume);          // certains navigateurs exigent un geste
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible"){ lastTok = 0; garderAllume(); }
    else sauveJeu();                                       // on ne perd pas les tokens en quittant
  });
  addEventListener("pagehide", sauveJeu);
  garderAllume();

  /* --- arbre de compétences : rendu, achats, déblocages --- */
  function appliqueDeblocages(){
    const b = document.body;
    // union de TOUS les identifiants : une compétence absente du monde actif
    // (ex. les millisecondes dans les abysses) doit rester verrouillée, pas s'afficher.
    for (const id of TOUS_IDS)
      b.classList.toggle("lock-" + id, !(COMPETENCES().some(c => c.id === id) && aDebloque(id)));
  }
  const noeudEls = {};
  const SVGNS = "http://www.w3.org/2000/svg";
  function construitArbre(){
    const body = $("treeBody"); body.innerHTML = "";
    for (const k in noeudEls) delete noeudEls[k];    // sinon des nœuds de l'autre monde persistent
    const svg = document.createElementNS(SVGNS, "svg");   // couche des connecteurs, sous les nœuds
    svg.setAttribute("class", "treeLines"); svg.id = "treeLines";
    body.appendChild(svg);
    const rows = Math.max(...COMPETENCES().map(c => c.row));
    body.style.gridTemplateRows = "repeat(" + rows + ", auto)";
    for (const c of COMPETENCES()){
      const n = document.createElement("button");
      n.type = "button"; n.className = "noeud"; n.dataset.id = c.id;
      n.style.gridColumn = c.col; n.style.gridRow = c.row;
      n.innerHTML = '<span class="n-nom"></span><span class="n-cout"></span>';
      n.querySelector(".n-nom").textContent = c.nom;
      n.querySelector(".n-cout").textContent = c.cout ? c.cout + " " + MONDE().monnaie : "acquis";
      if (c.id !== "start") n.addEventListener("click", () => tenteAchat(c.id));
      body.appendChild(n); noeudEls[c.id] = n;
    }
    addEventListener("resize", () => {
      if (document.body.classList.contains("tree-open")) traceLignes();
    });
  }
  function traceLignes(){                       // relie chaque nœud à son parent (courbes de Bézier)
    const svg = $("treeLines"), body = $("treeBody");
    if (!svg) return;
    const R = body.getBoundingClientRect();
    let d = "";
    for (const c of COMPETENCES()){
      const a = noeudEls[c.pre], b = noeudEls[c.id];
      if (!a || !b) continue;
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const x1 = ra.left - R.left + ra.width / 2, y1 = ra.bottom - R.top;
      const x2 = rb.left - R.left + rb.width / 2, y2 = rb.top - R.top;
      const my = (y1 + y2) / 2;
      const col = aDebloque(c.id) ? "#3BF07A" : aDebloque(c.pre) ? "#00E5FF" : "#26314A";
      d += `<path d="M${x1} ${y1} C ${x1} ${my} ${x2} ${my} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="2"/>`;
    }
    svg.innerHTML = d;
  }
  function majArbre(){
    const bal = solde();
    let dispo = false;
    for (const c of COMPETENCES()){
      const el = noeudEls[c.id]; if (!el) continue;
      let st;
      if (aDebloque(c.id))          st = "owned";
      else if (!aDebloque(c.pre))   st = "locked";     // parent pas encore acheté
      else if (bal >= c.cout){ st = "buyable"; dispo = true; }
      else                          st = "pending";
      el.className = "noeud " + st;
      el.disabled = (st === "owned" || st === "locked");
    }
    $("tokBtn").classList.toggle("ready", dispo);
    // le bouton PRESTIGE n'apparaît que si tout le monde actif est acheté ET qu'un monde suit
    document.body.classList.toggle("peut-prestige", toutAchete() && !!mondeSuivant());
    traceLignes();
  }

  /* --- mondes : habillage, prestige, bascule --- */
  function appliqueMonde(){
    const b = document.body;
    for (const id of ORDRE_MONDES) b.classList.toggle("monde-" + id, save.actif === id);
    b.classList.toggle("a-prestige", save.debloques.length > 1);
    const M = MONDE();
    $("treeTitre").textContent = M.nom;
    $("tokStar").textContent = $("treeStar").textContent = M.monnaie;
    $("treeHint").textContent = "Tu gagnes des " + M.monnaie + " en attendant devant l'appli "
      + "(1/min au départ, +1/min par upgrade d'économie). L'arbre descend : chaque nœud demande le précédent.";
  }
  function changeMonde(id){
    if (!save.debloques.includes(id) || id === save.actif) return;
    save.actif = id; jeu = save.mondes[id]; sauveJeu();
    lastAlerte = ""; baleine = null; bulles.length = 0;
    appliqueMonde(); appliqueDeblocages();
    construitArbre(); majArbre();
    $("tokVal").textContent = $("treeVal").textContent = solde();
    recale();
  }
  function prestige(){
    const suivant = mondeSuivant();
    if (!toutAchete() || !suivant) return;
    if (!save.debloques.includes(suivant)) save.debloques.push(suivant);
    sauveJeu();
    burst(220, 280); air([262, 330, 392, 523, 659, 784]);   // gerbe violette
    changeMonde(suivant);
    ouvreArbre(false);
  }
  function tenteAchat(id){
    const c = COMPETENCES().find(x => x.id === id);
    if (!c || aDebloque(id)) return;
    if (c.pre && !aDebloque(c.pre)) return;               // prérequis manquant
    if (solde() < c.cout) return;                         // pas assez de tokens
    jeu.unlocked.push(id); sauveJeu();
    appliqueDeblocages(); majArbre();
    $("tokVal").textContent = $("treeVal").textContent = solde();   // solde à jour tout de suite
    chirp(880, .06); setTimeout(() => chirp(1320, .09), 80);
    recale();                                             // rafraîchit menu, pause, frise
  }
  function ouvreArbre(o){
    document.body.classList.toggle("tree-open", o);
    if (o) requestAnimationFrame(majArbre);      // laisse la grille se poser avant de tracer les liens
  }
  $("tokBtn").addEventListener("click", e => {
    if (e.shiftKey){                       // triche de test : Shift+clic = +5000 ✦ (modifie la save en mémoire)
      jeu.earned += 5000; sauveJeu();
      $("tokVal").textContent = $("treeVal").textContent = solde();
      majArbre(); chirp(1046, .08);
      return;
    }
    ouvreArbre(!document.body.classList.contains("tree-open"));
  });
  $("treeClose").addEventListener("click", () => ouvreArbre(false));
  $("prestigeBtn").addEventListener("click", prestige);
  $("worldBtn").addEventListener("click", () => {          // cycle sur les mondes débloqués
    const l = save.debloques, i = l.indexOf(save.actif);
    changeMonde(l[(i + 1) % l.length]);
  });
  addEventListener("keydown", e => { if (e.key === "Escape") ouvreArbre(false); });

  /* --- épinglage : on déplace L'APPLI ELLE-MÊME dans une fenêtre PiP (toujours au 1er plan),
     pas un mini-timer à part. À la fermeture, tout revient dans l'onglet. --- */
  async function epingler(){
    if (pipWin){ pipWin.close(); return; }              // déjà épinglé → on ferme (toggle)
    if (!("documentPictureInPicture" in window)){
      alert("L'épinglage au premier plan nécessite Chrome ou Edge sur ordinateur "
          + "(pas disponible sur ce navigateur).");
      return;
    }
    try {
      const w = await documentPictureInPicture.requestWindow({ width: 460, height: 300 });
      // recopier nos styles (feuilles inline, même origine)
      for (const ss of document.styleSheets){
        try {
          const st = w.document.createElement("style");
          st.textContent = [...ss.cssRules].map(r => r.cssText).join("");
          w.document.head.appendChild(st);
        } catch { /* feuille inaccessible : ignorée */ }
      }
      w.document.documentElement.style.cssText = "margin:0;height:100%";
      w.document.body.style.margin = "0";
      w.document.body.className = document.body.className;
      // déplacer tout le contenu visuel dans la fenêtre épinglée
      pipWin = w;
      while (document.body.firstChild) w.document.body.appendChild(document.body.firstChild);
      document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;'
        + 'align-items:center;justify-content:center;text-align:center;background:#04050A;'
        + 'color:#5C6784;font-family:system-ui,sans-serif;font-size:14px;line-height:1.6">'
        + 'Épinglé au premier plan&nbsp;↗<br>Ferme la petite fenêtre pour revenir ici.</div>';
      resize();                                          // canvas recalé sur la fenêtre PiP
      w.addEventListener("resize", resize);
      w.addEventListener("pagehide", () => {             // fermeture : on rapatrie tout dans l'onglet
        document.body.innerHTML = "";
        while (w.document.body.firstChild) document.body.appendChild(w.document.body.firstChild);
        pipWin = null;
        resize();
        window.requestAnimationFrame(loop);              // la boucle tournait sur la fenêtre PiP → relance
      });
    } catch { /* refusé ou interrompu */ }
  }
  $("pin").addEventListener("click", epingler);

  appliqueMonde();
  appliqueDeblocages();
  construitArbre();
  majArbre();

  recale();
  hostWin().requestAnimationFrame(loop);
})();
</script>
</body>
